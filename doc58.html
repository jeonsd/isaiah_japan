なたの子らは、昔からの廃墟を建て直し、あなたは、代々の土台を立て直します。","s":126.792,"e":133.115,"p":false,"h":false},{"t":"あなたは、「破れ口を修復する者」、「住める道に直す者」と呼ばれます(58:12)。","s":133.38,"e":138.355,"p":true,"h":false},{"t":"最後に、安息日についての約束が語られます。","s":138.996,"e":142.401,"p":false,"h":false},{"t":"もし、安息日に旅を控え、わたしの聖なる日に、自分の好むことをせず、安息日を「楽しい日」、主の聖日を「尊ぶべき日」と呼び、これを尊んで、自分の道を行わず、自分の好むことを求めず、むだ話をしないなら、あなたは主を、あなたの喜びとする。","s":142.668,"e":161.88,"p":false,"h":false},{"t":"わたしは、あなたを、地の高い所に乗らせ、あなたの父ヤコブの相続地で、あなたを養う。","s":162.18,"e":168.889,"p":false,"h":false},{"t":"主の口が語られた(58:13-14)。","s":169.2,"e":170.721,"p":true,"h":false},{"t":"各節の解説","s":171.36,"e":172.642,"p":true,"h":false},{"t":"1節の、「声を限りに叫べ」という命令は、預言者が、遠慮せずに、民の罪を語らなければならないことを示します。","s":173.304,"e":181.934,"p":false,"h":false},{"t":"民は、自分を信仰深い者と思っていたので、この指摘は、驚くべきものです。","s":182.232,"e":188.076,"p":true,"h":false},{"t":"3~5節の断食の問答は、礼拝や宗教的な行いが、日常の不正と切り離されている、という指摘です。","s":188.712,"e":197.027,"p":false,"h":false},{"t":"1章の、形だけの礼拝への批判と、同じ流れにあります。","s":197.316,"e":201.496,"p":false,"h":false},{"t":"断食自体が悪いのではなく、断食しながら、弱い者を虐げることが、問題とされています。","s":201.78,"e":208.616,"p":true,"h":false},{"t":"6~7節の、悪の鎖を解き、飢えた人にパンを分けるという描写は、神の望まれる信仰の姿を、具体的に語ります。","s":209.268,"e":218.273,"p":false,"h":false},{"t":"祈りや断食が、貧しい人への憐れみに結びついてこそ、神に届く、ということです。","s":218.556,"e":224.901,"p":false,"h":false},{"t":"新約聖書でも、ヤコブの手紙などに、似た教えがあります。","s":225.216,"e":229.492,"p":false,"h":false},{"t":"ただし、これは、行いによって救いを得るという意味ではなく、救われた者の歩みの姿として、読まれるべきです。","s":229.788,"e":237.211,"p":true,"h":false},{"t":"8~9節の約束は、「そうすれば」という言葉で始まります。","s":237.852,"e":242.343,"p":false,"h":false},{"t":"ここは、条件付きの約束のように見えます。","s":242.64,"e":245.707,"p":false,"h":false},{"t":"行いによる救いを教えているのではなく、神を信頼する者が、憐れみの行いに生きるとき、神との交わりが、さらに豊かになる、という意味に読まれます。","s":245.988,"e":256.732,"p":true,"h":false},{"t":"12節の「破れ口を修復する者」は、崩れた城壁を直す者という意味で、民が、エルサレムの再建に携わることを語っています。","s":257.364,"e":266.493,"p":false,"h":false},{"t":"ネヘミヤ記の、城壁の再建の働きと関係づけて読まれることがあります。","s":266.832,"e":271.987,"p":true,"h":false},{"t":"13~14節の安息日についての言葉は、安息日が、重荷ではなく、喜びの日であることを示します。","s":272.628,"e":280.618,"p":false,"h":false},{"t":"ここでも、外側の規則より、神を喜ぶ心が、中心とされています。","s":280.908,"e":286.347,"p":false,"h":false},{"t":"この安息日の理解が、新約聖書の教会で、どのように受け継がれるかについては、読み方が分かれますので、ここでは、細かい適用には立ち入りません。","s":286.632,"e":297.454,"p":true,"h":false}], NAV = {"prev":{"href":"doc57.html","title":"イザヤ書_57章"},"next":{"href":"doc59.html","title":"イザヤ書_59章"},"list":"index.html"};

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
