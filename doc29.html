(function () {
  const TITLE = "イザヤ書_29章", AUDIO_SRC = "doc29_2610231055.mp3", DUR = 323, SEGS = [{"t":"イザヤ書29章","s":0,"e":1.623,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"29章は、「災いだ、アリエルよ」で始まります。","s":4.176,"e":7.868,"p":false,"h":false},{"t":"アリエルは、ダビデが陣を敷いた町、つまりエルサレムの呼び名です。","s":8.136,"e":12.775,"p":false,"h":false},{"t":"年に年を加え、祭りを巡らせても、主はアリエルを苦しめられます。","s":13.068,"e":17.999,"p":false,"h":false},{"t":"町はうめき、嘆き、主にとってアリエルのようになります(29:1-2)。","s":18.288,"e":22.212,"p":false,"h":false},{"t":"主は、ダビデのように、町の周りに陣を敷き、塁を築いて攻められます。","s":22.5,"e":27.854,"p":false,"h":false},{"t":"町は、地の下から、ちりの中から、ささやくような声で語ります(29:3-4)。","s":28.152,"e":33.077,"p":true,"h":false},{"t":"しかし、突然、さばきの調子が変わります。","s":33.732,"e":37.05,"p":false,"h":false},{"t":"エルサレムを襲う大勢の敵は、細かいちりのようになり、一瞬のうちに消えます。","s":37.332,"e":42.908,"p":false,"h":false},{"t":"万軍の主が、雷と地震と大きな音、嵐とつむじ風と焼き尽くす炎の火で、訪れられます(29:5-6)。","s":43.2,"e":50.23,"p":false,"h":false},{"t":"それは、夢のように、夜の幻のようにはかなく、飢えた人が夢の中で食べ、目覚めると空腹のままであるように、渇いた人が夢の中で飲み、目覚めると渇いているように、シオンの山と戦うすべての国々は、そのようになります(29:7-8)。","s":50.508,"e":67.068,"p":true,"h":false},{"t":"けれども、民自身は、驚き、目をふさぎ、盲目になります。","s":67.752,"e":72.382,"p":false,"h":false},{"t":"酔っているが、ぶどう酒によらず、よろめくが、強い酒によらない、と言われます。","s":72.684,"e":78.415,"p":false,"h":false},{"t":"主が、深い眠りの霊を彼らに注ぎ、目を閉ざされたからです(29:9-10)。","s":78.696,"e":83.227,"p":false,"h":false},{"t":"幻は、封じられた書物のようになります。","s":83.52,"e":86.699,"p":false,"h":false},{"t":"読める者に渡しても、「封じられているので読めません」と言い、読めない者に渡しても、「読むことができません」と言います(29:11-12)。","s":86.976,"e":94.682,"p":true,"h":false},{"t":"主は、その理由を言われます。","s":95.328,"e":97.428,"p":false,"h":false},{"t":"「この民は、口先ではわたしに近づき、くちびるでわたしを敬うが、心はわたしから遠く離れている。","s":97.704,"e":104.976,"p":false,"h":false},{"t":"わたしを恐れるのは、人間の戒めを教えられてのことだ」(29:13)。","s":105.264,"e":109.285,"p":false,"h":false},{"t":"だから、主は、この民に不思議なわざを重ねて行い、知恵ある者の知恵を滅ぼされます(29:14)。","s":109.584,"e":116.007,"p":false,"h":false},{"t":"災いだ、主から計画を深く隠そうとする者、暗闇でわざを行い、「だれがわたしたちを見ているのか」と言う者。","s":116.316,"e":124.528,"p":false,"h":false},{"t":"あなたがたは、ものごとを逆さまにしています。","s":124.812,"e":127.842,"p":false,"h":false},{"t":"陶器師が粘土のように見なされてよいでしょうか(29:15-16)。","s":128.124,"e":130.926,"p":true,"h":false},{"t":"最後に、望みが語られます。","s":131.58,"e":133.664,"p":false,"h":false},{"t":"もう少しすれば、レバノンは果樹園となり、果樹園は森と見なされます。","s":133.956,"e":138.846,"p":false,"h":false},{"t":"その日、耳の聞こえない者が書物の言葉を聞き、盲人の目は、暗闇の中から見えるようになります。","s":139.14,"e":146.416,"p":false,"h":false},{"t":"貧しい者は主にあって喜びを増し、人の中の貧しい者は、イスラエルの聖なる方にあって、歓喜します(29:17-19)。","s":146.7,"e":154.205,"p":false,"h":false},{"t":"横暴な者はいなくなり、あざける者は消え、悪を行おうと目を光らせる者は、断たれます(29:20-21)。","s":154.512,"e":160.935,"p":false,"h":false},{"t":"ヤコブの家は、もう恥じることなく、その子らが、主の御名を聖とするのを見て、ヤコブの聖なる方を聖とし、イスラエルの神を恐れます(29:22-23)。","s":161.244,"e":171.143,"p":false,"h":false},{"t":"心の迷っていた者は悟りを得、つぶやいていた者は教えを学びます(29:24)。","s":171.432,"e":176.187,"p":true,"h":false},{"t":"各節の解説","s":176.832,"e":178.114,"p":true,"h":false},{"t":"1節の「アリエル」は、「神のかまど」、または「神の獅子」と理解されます。","s":178.776,"e":183.658,"p":false,"h":false},{"t":"祭壇の火の炉を意味するという読み方があり、エルサレムが、さばきの火に焼かれるという意味を重ねている、と読む立場があります。","s":183.924,"e":192.186,"p":false,"h":false},{"t":"意味ははっきり決まっていません。","s":192.492,"e":194.36,"p":true,"h":false},{"t":"5~8節の、敵が突然消える描写は、エルサレムが、最後に主ご自身によって守られることを語っています。","s":195.012,"e":202.926,"p":false,"h":false},{"t":"この出来事が、ヒゼキヤの時代にアッシリア軍が退いた出来事を指すのか、さらに後のことまで含むのかは、読み方が分かれます。","s":203.184,"e":212.126,"p":true,"h":false},{"t":"9~10節の「眠りの霊」は、神が民の目を閉ざされるという、重い言葉です。","s":212.76,"e":218.41,"p":false,"h":false},{"t":"10章の「ゆがんだ霊」と同じく、さばきの一部として、人が神のことばを理解できなくなるという面があります。","s":218.7,"e":226.078,"p":false,"h":false},{"t":"ただし、これも、民が自分で目を閉じたことへの、神の応答として読むのが、改革派の理解に近いでしょう。","s":226.368,"e":234.103,"p":true,"h":false},{"t":"11~12節の封じられた書物の比喩は、神のことばが、そこにありながら、人の心が閉ざされているために、理解されないことを表しています。","s":234.756,"e":245.186,"p":true,"h":false},{"t":"13節は、新約聖書で、イエスが、パリサイ人の形だけの信仰を批判する際に引かれた言葉です。","s":245.808,"e":253.169,"p":false,"h":false},{"t":"口と唇で神を敬いながら、心は遠く離れているという姿は、1章の、形だけの礼拝への批判と、つながっています。","s":253.476,"e":262.683,"p":false,"h":false},{"t":"人の戒めを教えとすることが、礼拝を空しくします。","s":262.98,"e":266.937,"p":true,"h":false},{"t":"14節の「不思議なわざ」は、人の知恵では測れない、神のさばきと恵みを指します。","s":267.552,"e":273.518,"p":false,"h":false},{"t":"パウロは、十字架の言葉が、この世の知恵を打ち砕くという話の中で、この節を引いています。","s":273.816,"e":280.583,"p":true,"h":false},{"t":"16節の陶器師と粘土の例えは、創造主と被造物の関係を表します。","s":281.232,"e":286.838,"p":false,"h":false},{"t":"神は、造られた者に問い返される方ではなく、造られた者が神に問う前に、神の主権を認めるべきです。","s":287.136,"e":294.717,"p":false,"h":false},{"t":"この比喩は、新約聖書のローマ人への手紙でも、神の主権を語る際に用いられています。","s":295.02,"e":301.424,"p":true,"h":false},{"t":"17~24節の結びは、さばきを経たのちの回復の姿です。","s":302.076,"e":307.227,"p":false,"h":false},{"t":"盲人の目が開かれ、耳の聞こえない人が聞くようになることは、のちにイエスの働きのしるしとしても思い起こされます。","s":307.512,"e":315.419,"p":false,"h":false},{"t":"ここでの回復は、体の癒やしだけでなく、神のことばを悟る心の回復を、中心としています。","s":315.72,"e":322.769,"p":true,"h":false}], NAV = {"prev":{"href":"doc28.html","title":"イザヤ書_28章"},"next":{"href":"doc30.html","title":"イザヤ書_30章"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];

  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

    $('tot').textContent = fmt(DUR);

  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }

  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }

  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }

  })();

  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
