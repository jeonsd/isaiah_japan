(function () {
  const TITLE = "イザヤ書_44章", AUDIO_SRC = "doc44_2610231055.mp3", DUR = 437, SEGS = [{"t":"イザヤ書44章","s":0,"e":1.636,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"「しかし、今、聞け。","s":4.176,"e":5.818,"p":false,"h":false},{"t":"わたしのしもべヤコブ、わたしが選んだイスラエルよ」と、44章は始まります。","s":6.084,"e":11.525,"p":false,"h":false},{"t":"あなたを造り、母の胎から形造り、あなたを助ける主は言われます。","s":11.808,"e":16.713,"p":false,"h":false},{"t":"「恐れるな、わたしのしもべヤコブ、わたしが選んだエシュルンよ」(44:1-2)。","s":16.992,"e":21.107,"p":false,"h":false},{"t":"主は、渇いた地に水を注ぎ、乾いた地に流れを注がれます。","s":21.42,"e":26.154,"p":false,"h":false},{"t":"そのように、あなたの子孫にわたしの霊を、あなたの末裔にわたしの祝福を注がれます。","s":26.46,"e":32.323,"p":false,"h":false},{"t":"彼らは、草の間に、流れのほとりのしだれ柳のように、芽生えます(44:3-4)。","s":32.616,"e":37.645,"p":false,"h":false},{"t":"ある者は「私は主のもの」と言い、ある者はヤコブの名を名乗り、ある者は手に「主のもの」と記し、イスラエルの名を称えます(44:5)。","s":37.944,"e":46.725,"p":true,"h":false},{"t":"イスラエルの王、その贖い主、万軍の主は言われます。","s":47.376,"e":51.442,"p":false,"h":false},{"t":"「わたしは初めであり、終わりである。","s":51.732,"e":53.924,"p":false,"h":false},{"t":"わたしのほかに神はいない」(44:6)。","s":54.216,"e":55.952,"p":false,"h":false},{"t":"わたしのように呼び、これを告げ、わたしの前に並べる者がいるだろうか。","s":56.232,"e":61.007,"p":false,"h":false},{"t":"あなたがたは、わたしの証人。","s":61.308,"e":63.507,"p":false,"h":false},{"t":"わたしのほかに神がいるだろうか。","s":63.792,"e":65.787,"p":false,"h":false},{"t":"ほかに岩はない。","s":66.096,"e":67.164,"p":false,"h":false},{"t":"わたしは知らない(44:7-8)。","s":68.004,"e":69.129,"p":true,"h":false},{"t":"そこから、偶像を作る者の愚かさが、長く語られます。","s":69.912,"e":74.041,"p":false,"h":false},{"t":"偶像を造る者は、みな空しい。","s":74.34,"e":76.836,"p":false,"h":false},{"t":"彼らが愛するものは、何の役にも立たない。","s":77.112,"e":80.032,"p":false,"h":false},{"t":"その証人たちは、見ることも知ることもできず、恥を見る(44:9)。","s":80.316,"e":84.508,"p":false,"h":false},{"t":"鉄の細工人は炭火で道具を作り、力を込めて形造ります。","s":84.78,"e":89.472,"p":false,"h":false},{"t":"しかし、飢えて力がなくなり、水を飲まなければ疲れます(44:10-12)。","s":89.748,"e":93.894,"p":false,"h":false},{"t":"木工職人は、定規をあてて、鉛筆で線を引き、かんなで削り、コンパスで円を描いて、人の姿に似せ、美しい人の形に造って、神殿に据えます(44:13)。","s":94.176,"e":105.553,"p":true,"h":false},{"t":"彼は、杉を切り、樫の木を選び、森の木の中で成長させます。","s":106.2,"e":111.508,"p":false,"h":false},{"t":"あるいは、月桂樹を植え、雨がそれを育てます。","s":111.816,"e":115.196,"p":false,"h":false},{"t":"それは人のたきぎになります。","s":115.488,"e":117.324,"p":false,"h":false},{"t":"彼はその一部を取って暖をとり、火を起こしてパンを焼きます。","s":117.612,"e":121.686,"p":false,"h":false},{"t":"その同じ木で神を造り、これを拝み、彫像にして、ひれ伏します。","s":121.968,"e":126.873,"p":false,"h":false},{"t":"半分は火に燃やし、その上で肉を焼いて食べ、満腹し、暖まって言います。","s":127.152,"e":132.857,"p":false,"h":false},{"t":"「ああ、暖かい。","s":133.164,"e":134.336,"p":false,"h":false},{"t":"火が見える」。","s":135.072,"e":135.856,"p":false,"h":false},{"t":"その残りで神を造り、これを拝んで、「私を救ってください。","s":136.98,"e":141.301,"p":false,"h":false},{"t":"あなたは私の神だから」と言います(44:14-17)。","s":141.588,"e":144.056,"p":false,"h":false},{"t":"彼らは知らず、悟らず、その目はふさがれて見えず、その心は悟れません。","s":144.324,"e":149.749,"p":false,"h":false},{"t":"心に留めて言う者はいません。","s":150.048,"e":152.024,"p":false,"h":false},{"t":"「その半分を火で燃やし、その炭火でパンを焼き、肉を焼いて食べた。","s":152.316,"e":157.179,"p":false,"h":false},{"t":"その残りで忌むべき物を造るのか。","s":157.464,"e":159.727,"p":false,"h":false},{"t":"木の切れ端にひれ伏すのか」(44:18-19)。","s":160.02,"e":161.758,"p":false,"h":false},{"t":"灰を食らう者は、惑わされた心に迷わされ、自分を救い出せず、「私の右手にあるのは偽りではないか」とも言いません(44:20)。","s":162.036,"e":170.602,"p":true,"h":false},{"t":"主は、ヤコブとイスラエルに言われます。","s":171.252,"e":173.839,"p":false,"h":false},{"t":"「これらのことを心に留めよ。","s":174.132,"e":175.96,"p":false,"h":false},{"t":"あなたはわたしのしもべ。","s":176.256,"e":177.782,"p":false,"h":false},{"t":"わたしがあなたを形造った。","s":178.164,"e":180.029,"p":false,"h":false},{"t":"あなたはわたしのしもべ。","s":180.324,"e":181.85,"p":false,"h":false},{"t":"イスラエルよ、わたしはあなたを忘れない」(44:21)。","s":182.232,"e":184.889,"p":false,"h":false},{"t":"「わたしは、あなたの背きを雲のように、あなたの罪を霧のように、ぬぐい去った。","s":185.148,"e":190.819,"p":false,"h":false},{"t":"わたしに立ち返れ。","s":191.088,"e":192.307,"p":false,"h":false},{"t":"わたしがあなたを贖ったから」(44:22)。","s":192.996,"e":194.706,"p":false,"h":false},{"t":"天よ、喜び歌え。","s":195.012,"e":196.593,"p":false,"h":false},{"t":"主がこれを行われた。","s":196.92,"e":198.45,"p":false,"h":false},{"t":"地の深みよ、叫べ。","s":198.828,"e":200.428,"p":false,"h":false},{"t":"山々よ、森とその中のすべての木よ、喜びの声を上げよ。","s":200.736,"e":205.486,"p":false,"h":false},{"t":"主がヤコブを贖い、イスラエルのうちに、ご自分の栄光を現されるからだ(44:23)。","s":205.776,"e":210.844,"p":true,"h":false},{"t":"あなたを贖い、母の胎からあなたを形造った主は言われます。","s":211.464,"e":215.649,"p":false,"h":false},{"t":"「わたしは主。","s":215.928,"e":216.756,"p":false,"h":false},{"t":"万物を造り、ひとりで天を広げ、地を敷き広げた。","s":217.836,"e":221.779,"p":false,"h":false},{"t":"占いをする者のしるしを破り、占う者を愚かにし、知恵ある者を退け、その知識を愚かにする。","s":222.048,"e":229.436,"p":false,"h":false},{"t":"しもべのことばを成就させ、使者たちの計画を成し遂げさせる」(44:24-26)。","s":229.716,"e":233.925,"p":false,"h":false},{"t":"エルサレムに「人が住む」と言い、ユダの町々に「再建される」と言い、その廃墟を「立て直す」と言う。","s":234.216,"e":241.122,"p":false,"h":false},{"t":"深い淵に「干上がれ」と言い、あなたの川を「干上がらせる」と言う。","s":241.416,"e":246.131,"p":false,"h":false},{"t":"そして、キュロスに言う。","s":246.42,"e":248.017,"p":false,"h":false},{"t":"「彼はわたしの牧者。","s":248.328,"e":249.771,"p":false,"h":false},{"t":"わたしの望むところをことごとく成し遂げる」。","s":250.236,"e":252.849,"p":false,"h":false},{"t":"エルサレムに、「再建される」、神殿に、「あなたの基は据えられる」と言う(44:27-28)。","s":253.152,"e":257.981,"p":true,"h":false},{"t":"各節の解説","s":258.624,"e":259.906,"p":true,"h":false},{"t":"2節の「エシュルン」は、「まっすぐな者」という意味の、イスラエルの詩的な呼び名です。","s":260.568,"e":265.479,"p":false,"h":false},{"t":"申命記にも出てくる名前で、民の本来あるべき姿を思い出させる呼び方です。","s":265.752,"e":271.294,"p":true,"h":false},{"t":"3節の「わたしの霊を注ぐ」は、渇いた地に水を注ぐ比喩で語られています。","s":271.944,"e":277.383,"p":false,"h":false},{"t":"32章15節の、「上から霊が注がれる」という約束と、つながっています。","s":277.668,"e":283.343,"p":false,"h":false},{"t":"民の回復が、神の霊の注ぎによって、子孫の世代まで広がるという望みです。","s":283.608,"e":289.408,"p":false,"h":false},{"t":"新約聖書では、聖霊の注ぎと結びつけられることがあります。","s":289.692,"e":294.16,"p":true,"h":false},{"t":"6節の「初めであり、終わりである」は、神が歴史全体の主であることを表します。","s":294.804,"e":300.802,"p":false,"h":false},{"t":"この言葉は、新約聖書の黙示録で、キリストご自身について語られる言葉と、同じ形をしています。","s":301.104,"e":308.209,"p":false,"h":false},{"t":"このことは、改革派の伝統が、キリストの神性を語るときに、よく指摘するところです。","s":308.484,"e":314.782,"p":true,"h":false},{"t":"9~20節の偶像の描写は、聖書の中でも特に皮肉に満ちた箇所です。","s":315.432,"e":321.009,"p":false,"h":false},{"t":"同じ木の半分は、暖をとる薪や、パンを焼く火になり、残りの半分は、神として拝まれます。","s":321.3,"e":328.743,"p":false,"h":false},{"t":"この愚かさを、筋の通った細かい描写で、静かに指摘しています。","s":329.04,"e":333.778,"p":false,"h":false},{"t":"ここでは、偶像を拝む人を、単に責めているのではなく、その愚かさを、本人が気づくように促しています。","s":334.044,"e":341.695,"p":true,"h":false},{"t":"19節の問いかけは、偶像に頼る人が、自分の行いの矛盾に気づく、という場面を想定しています。","s":342.324,"e":349.982,"p":false,"h":false},{"t":"「私の右手にあるのは偽りではないか」(20節)と言う者は、ほとんどいません。","s":350.28,"e":355.873,"p":false,"h":false},{"t":"偶像礼拝は、心が惑わされた結果であって、知識の不足というより、心の問題です。","s":356.184,"e":362.788,"p":true,"h":false},{"t":"22節の「雲のように、霧のようにぬぐい去った」は、罪が、神によって、跡形もなく消されることを表します。","s":363.42,"e":371.486,"p":false,"h":false},{"t":"「わたしに立ち返れ。","s":371.772,"e":372.992,"p":false,"h":false},{"t":"わたしがあなたを贖ったから」とあるように、赦しが先にあり、立ち返りが、その応答として語られています。","s":373.68,"e":380.909,"p":true,"h":false},{"t":"24~28節は、神の創造と、歴史の支配を結びつけています。","s":381.528,"e":387.228,"p":false,"h":false},{"t":"ここで、キュロスの名が、突然出てきます。","s":387.504,"e":390.456,"p":false,"h":false},{"t":"これは、バビロン捕囚の百五十年ほど前の預言者が、後に現れるペルシアの王の名を、前もって語っている、という理解になります。","s":390.744,"e":400.133,"p":false,"h":false},{"t":"この点は、聖書学者の間で、イザヤ書の成立について、見方が分かれる大きな論点の一つです。","s":400.428,"e":407.555,"p":false,"h":false},{"t":"ここでは、主が歴史を前もって告げられる方であることを、示す箇所として読むのが、改革派の伝統の理解です。","s":407.844,"e":415.649,"p":true,"h":false},{"t":"28節の、キュロスが「わたしの牧者」と呼ばれることは、驚くべきことです。","s":416.268,"e":421.817,"p":false,"h":false},{"t":"異邦人の王が、主の目的を果たすために用いられます。","s":422.136,"e":426.08,"p":false,"h":false},{"t":"5章の、遠くの国を呼ばれた主と、10章の、アッシリアを怒りの杖とされた主と、同じ方が、ここでは、キュロスを牧者として用いられます。","s":426.384,"e":436.147,"p":true,"h":false}], NAV = {"prev":{"href":"doc43.html","title":"イザヤ書_43章"},"next":{"href":"doc45.html","title":"イザヤ書_45章"},"list":"index.html"};

  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

  /* 글 그리기 */
  (function build() {
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
