":101.48,"p":false,"h":false},{"t":"さあ、共に立とう。","s":101.772,"e":103.223,"p":false,"h":false},{"t":"だれが私を訴えるのか。","s":103.68,"e":105.43,"p":false,"h":false},{"t":"私のところに来い」(50:8)。","s":105.732,"e":107.071,"p":false,"h":false},{"t":"「見よ、神である主が、私を助けてくださる。","s":107.64,"e":111.048,"p":false,"h":false},{"t":"だれが、私を罪に定めるのか。","s":111.312,"e":113.805,"p":false,"h":false},{"t":"見よ、彼らはみな、衣のように古び、しみが彼らを食い尽くす」(50:9)。","s":114.084,"e":118.991,"p":true,"h":false},{"t":"最後に、聞く者たちに、二つの呼びかけがなされます。","s":119.664,"e":123.487,"p":false,"h":false},{"t":"「あなたがたのうち、主を恐れ、そのしもべの声に聞き従う者はだれか。","s":123.804,"e":128.894,"p":false,"h":false},{"t":"暗闇の中を歩み、光のない者は、主の名に信頼し、自分の神に寄りかかれ」(50:10)。","s":129.168,"e":135.318,"p":false,"h":false},{"t":"一方、「見よ、あなたがたはみな、火をともし、火矢を身につける者たちだ。","s":135.612,"e":140.922,"p":false,"h":false},{"t":"自分の火の炎の中、自分がともした火矢の中を歩め。","s":141.228,"e":145.206,"p":false,"h":false},{"t":"これは、わたしの手から、あなたがたに与えられる。","s":145.476,"e":148.842,"p":false,"h":false},{"t":"あなたがたは、苦しみのうちに伏す」(50:11)。","s":149.112,"e":151.578,"p":true,"h":false},{"t":"各節の解説","s":152.244,"e":153.526,"p":true,"h":false},{"t":"1節の「離縁状」の問いは、主が、イスラエルを一方的に捨てたのではないことを語ります。","s":154.188,"e":160.379,"p":false,"h":false},{"t":"捕囚は、民の罪の結果であって、主が民との契約を、勝手に破棄したのではありません。","s":160.668,"e":167.079,"p":true,"h":false},{"t":"2節の「わたしの手は短くて」という問いは、主が、救う力がなくなったのではないことを示します。","s":167.724,"e":174.604,"p":false,"h":false},{"t":"民が、バビロンで、神に力がなくなったと感じていても、問題は、神の側にあるのではありません。","s":174.888,"e":182.124,"p":true,"h":false},{"t":"4~9節は、「しもべの歌」の三番目です。","s":182.772,"e":186.044,"p":false,"h":false},{"t":"この歌の特徴は、しもべが、神のことばを聞く者として描かれていることです。","s":186.336,"e":191.873,"p":false,"h":false},{"t":"「弟子の舌」「耳を開かれ」という言葉は、しもべが、まず聞く者であることを示します。","s":192.168,"e":198.172,"p":false,"h":false},{"t":"説教や教えの務めが、まず神のことばに耳を傾けることから始まる、という教えとしても、読まれることがあります。","s":198.468,"e":206.845,"p":true,"h":false},{"t":"6節の、背中を打たれ、ひげを抜かれ、つばきをかけられるという描写は、しもべが、苦難を、自分から進んで受けることを語ります。","s":207.468,"e":217.03,"p":false,"h":false},{"t":"新約聖書の福音書で、イエスの受難の場面と重なると、教会は読んできました。","s":217.296,"e":223.035,"p":false,"h":false},{"t":"ただし、この歌の中で、しもべが苦難を受ける理由は、まだ語られていません。","s":223.308,"e":228.912,"p":false,"h":false},{"t":"その意味は、52章13節から始まる、次の歌で明らかになります。","s":229.212,"e":234.391,"p":true,"h":false},{"t":"7節の「顔を火打石のようにして」は、困難に立ち向かう、決意の固さを表します。","s":235.044,"e":241.297,"p":false,"h":false},{"t":"ルカの福音書で、イエスがエルサレムへ向かう決意が、同じ表現で語られている、と指摘されることがあります。","s":241.596,"e":248.948,"p":true,"h":false},{"t":"8~9節の、法廷の言葉は、「義とする方」が近くにおられるので、訴える者を恐れない、という確信を語ります。","s":249.588,"e":258.178,"p":false,"h":false},{"t":"この言葉は、新約聖書で、パウロが、ローマ人への手紙8章で、「だれが神に選ばれた者たちを訴えるのか」と語る箇所と、響き合います。","s":258.48,"e":268.448,"p":false,"h":false},{"t":"信仰による義認の確信の姿が、ここに見られます。","s":268.74,"e":272.565,"p":true,"h":false},{"t":"10~11節の二つの呼びかけは、この章の結びです。","s":273.204,"e":277.33,"p":false,"h":false},{"t":"暗闇の中でも、主に信頼する者には、励ましが与えられます。","s":277.632,"e":282.306,"p":false,"h":false},{"t":"一方、自分の灯りと、自分の火矢に頼る者は、自分の火の中で苦しみます。","s":282.6,"e":288.53,"p":false,"h":false},{"t":"人が、自分の知恵や力に頼るのか、神に頼るのかという選択が、ここで鋭く示されています。","s":288.828,"e":296.147,"p":false,"h":false},{"t":"11節の「自分の火」が、何を指すのかは、読み方が分かれますが、自分の力による照らしと守りに頼る愚かさを語る、と読むのが穏当です。","s":296.46,"e":306.673,"p":true,"h":false}], NAV = {"prev":{"href":"doc49.html","title":"イザヤ書_49章"},"next":{"href":"doc51.html","title":"イザヤ書_51章"},"list":"index.html"};

  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
