<script>
(function () {
  const TITLE = "イザヤ書_51章", AUDIO_SRC = "doc51_2610231055.mp3", DUR = 364, SEGS = [{"t":"イザヤ書51章","s":0,"e":1.539,"p":true,"h":false},{"t":"全体の流れ","s":2.196,"e":3.301,"p":true,"h":false},{"t":"「義を追い求める者、主を尋ね求める者よ、私に聞け」と、51章は始まります。","s":4.104,"e":10.536,"p":false,"h":false},{"t":"あなたがたが切り出された岩、掘り出された穴を見よ。","s":10.836,"e":14.387,"p":false,"h":false},{"t":"あなたがたの父アブラハムと、あなたがたを産んだサラを見よ。","s":14.688,"e":18.31,"p":false,"h":false},{"t":"彼がひとりのとき、わたしは彼を呼び、祝福し、増やした、と主は言われます(51:1-2)。","s":18.612,"e":24.33,"p":false,"h":false},{"t":"主はシオンを慰め、その荒れ跡をみな慰め、荒れ野をエデンのように、荒れ地を主の園のようにされます。","s":24.624,"e":31.676,"p":false,"h":false},{"t":"そこには喜びと楽しみ、感謝と歌声があります(51:3)。","s":31.968,"e":35.606,"p":true,"h":false},{"t":"「わたしの民よ、わたしに心を留めよ。","s":36.252,"e":38.991,"p":false,"h":false},{"t":"わたしの国民よ、わたしに耳を傾けよ。","s":39.276,"e":42.363,"p":false,"h":false},{"t":"おしえはわたしから出、わたしの公正は、諸国民の光となる」(51:4)。","s":42.66,"e":47.133,"p":false,"h":false},{"t":"わたしの義は近い。","s":47.412,"e":48.69,"p":false,"h":false},{"t":"わたしの救いは出て行く。","s":49.32,"e":50.854,"p":false,"h":false},{"t":"島々はわたしを待ち望み、わたしの腕に望みを置く(51:5)。","s":51.228,"e":55.027,"p":false,"h":false},{"t":"目を上げて天を見、下の地を見よ。","s":55.332,"e":57.883,"p":false,"h":false},{"t":"天は煙のように消え、地は衣のように古び、そこに住む者も、虫のように死ぬ。","s":58.212,"e":64.28,"p":false,"h":false},{"t":"しかし、わたしの救いはとこしえに続き、わたしの義はくじけることがない(51:6)。","s":64.584,"e":69.658,"p":true,"h":false},{"t":"義を知る者、心にわたしのおしえを持つ民よ、聞け。","s":70.308,"e":74.246,"p":false,"h":false},{"t":"人にそしられることを恐れるな。","s":74.52,"e":76.533,"p":false,"h":false},{"t":"ののしられても、おののくな。","s":76.824,"e":78.502,"p":false,"h":false},{"t":"しみが彼らを衣のように食い、虫が羊毛のように食い尽くす。","s":78.804,"e":83.146,"p":false,"h":false},{"t":"しかし、わたしの義はとこしえに、わたしの救いは代々に続く(51:7-8)。","s":83.448,"e":88.005,"p":true,"h":false},{"t":"そこで、民が祈ります。","s":88.668,"e":90.434,"p":false,"h":false},{"t":"「目覚めよ、目覚めよ。","s":90.72,"e":92.248,"p":false,"h":false},{"t":"力を着よ、主の腕よ。","s":92.628,"e":94.494,"p":false,"h":false},{"t":"昔の日、遠い昔の代のように目覚めよ。","s":94.788,"e":97.902,"p":false,"h":false},{"t":"ラハブを切り刻み、竜を刺し貫いたのは、あなたではなかったか。","s":98.208,"e":102.873,"p":false,"h":false},{"t":"海を、大いなる淵の水を干上がらせ、海の深みを道とし、贖われた者たちが渡るようにしたのは、あなたではなかったか」(51:9-10)。","s":103.176,"e":111.656,"p":false,"h":false},{"t":"主に贖われた者たちは帰って来る。","s":111.96,"e":114.239,"p":false,"h":false},{"t":"喜び歌いながらシオンに入り、その頭にはとこしえの喜びがある。","s":114.516,"e":119.224,"p":false,"h":false},{"t":"楽しみと喜びがついて来て、悲しみとため息は逃げ去る(51:11)。","s":119.52,"e":123.595,"p":true,"h":false},{"t":"主が答えられます。","s":124.236,"e":125.519,"p":false,"h":false},{"t":"「わたし、このわたしが、あなたがたを慰める。","s":126.144,"e":129.398,"p":false,"h":false},{"t":"あなたは、なぜ、死ぬべき人間を恐れ、草のようになる人の子を恐れるのか。","s":129.672,"e":135.26,"p":false,"h":false},{"t":"天を張り、地の基を据えた、あなたの造り主、主を忘れ、圧迫する者の怒りを、一日中、絶えず恐れている」(51:12-13)。","s":135.54,"e":144.08,"p":false,"h":false},{"t":"縛られた者は、すぐに解き放たれる。","s":144.36,"e":147.048,"p":false,"h":false},{"t":"彼は穴の中で死なず、パンに欠けることもない(51:14)。","s":147.348,"e":150.453,"p":false,"h":false},{"t":"わたしは主、あなたの神。","s":150.732,"e":152.587,"p":false,"h":false},{"t":"海をかき立て、その波を荒立たせる。","s":152.892,"e":155.527,"p":false,"h":false},{"t":"その名は万軍の主(51:15)。","s":155.808,"e":157.393,"p":false,"h":false},{"t":"「わたしは、わたしのことばをあなたの口に置き、わたしの手の陰にあなたをおおった。","s":157.716,"e":163.21,"p":false,"h":false},{"t":"それは、天を張り、地の基を据え、シオンに、『あなたはわたしの民』と言うためだ」(51:16)。","s":163.476,"e":169.198,"p":true,"h":false},{"t":"最後に、「目覚めよ、目覚めよ、立ち上がれ、エルサレムよ」と呼びかけられます。","s":169.848,"e":175.449,"p":false,"h":false},{"t":"あなたは、主の手から、憤りの杯を飲み、よろめかせる大杯を飲み干した(51:17)。","s":175.752,"e":181.557,"p":false,"h":false},{"t":"産んだ子らの中に、手を引く者はなく、育てた子らの中に、手を取る者もいません。","s":181.836,"e":187.612,"p":false,"h":false},{"t":"荒廃と破滅、飢えと剣が、あなたを襲いました。","s":187.92,"e":191.45,"p":false,"h":false},{"t":"だれがあなたを慰めるのか(51:18-19)。","s":191.736,"e":193.523,"p":false,"h":false},{"t":"あなたの子らは、網にかかった羚羊のように、通りの角々で倒れ、主の憤りと、あなたの神の叱責で満ちています(51:20)。","s":193.824,"e":202.206,"p":false,"h":false},{"t":"だから、聞け。","s":202.5,"e":203.585,"p":false,"h":false},{"t":"苦しめられた者、酔った者、しかし、ぶどう酒によらない者よ。","s":204.408,"e":209.072,"p":false,"h":false},{"t":"あなたの主、神である主は言われる。","s":209.376,"e":212.062,"p":false,"h":false},{"t":"「見よ、わたしは、よろめかせる杯を、あなたの手から取り去る。","s":212.364,"e":216.771,"p":false,"h":false},{"t":"憤りの大杯を、あなたは二度と飲まない」(51:21-22)。","s":217.044,"e":219.848,"p":false,"h":false},{"t":"それを、あなたを苦しめた者の手に渡す。","s":220.14,"e":222.891,"p":false,"h":false},{"t":"彼らは、あなたに「身を伏せよ。","s":223.2,"e":225.4,"p":false,"h":false},{"t":"我々が踏み越えて行く」と言った(51:23)。","s":225.72,"e":227.768,"p":true,"h":false},{"t":"各節の解説","s":228.42,"e":229.702,"p":true,"h":false},{"t":"1~2節で、アブラハムとサラを思い出すよう言われるのは、民が、バビロンで少数になり、望みを失いかけているからです。","s":230.364,"e":239.129,"p":false,"h":false},{"t":"ひとりのアブラムを呼び、増やされた神は、今も同じことをされる、という励ましです。","s":239.436,"e":245.406,"p":true,"h":false},{"t":"3節の「エデンのように」は、荒れ果てたシオンが、創造のはじめの園のようにされる、という意味です。","s":246.06,"e":252.66,"p":false,"h":false},{"t":"回復が、単なる元通りではなく、はじめの祝福を超えるものとして語られています。","s":252.972,"e":258.768,"p":true,"h":false},{"t":"6節の、天が煙のように消え、地が衣のように古びるという言葉は、見えるものがすべて過ぎ去っても、神の救いだけは残ることを語ります。","s":259.416,"e":269.597,"p":false,"h":false},{"t":"何に望みを置くかが、問われています。","s":269.892,"e":272.505,"p":true,"h":false},{"t":"9~10節の「目覚めよ」は、神に向かって、民が、昔のように力を現してほしいと願う祈りです。","s":273.132,"e":280.68,"p":false,"h":false},{"t":"ラハブは、神話に出てくる海の怪物で、ここでは、出エジプトの時に主が打たれたエジプトを指して使われています。","s":280.98,"e":288.873,"p":false,"h":false},{"t":"この祈りは、神が眠っておられるという意味ではなく、民が、神の力を切実に求めている姿の表れです。","s":289.152,"e":296.616,"p":true,"h":false},{"t":"11節は、35章10節と、ほぼ同じ言葉です。","s":297.288,"e":301.535,"p":false,"h":false},{"t":"前半の終わりで語られた望みが、ここで、実現に向けて、もう一度語られます。","s":301.824,"e":307.76,"p":true,"h":false},{"t":"12~13節の、「人の子を恐れる」とは、抑圧する者の力を、神よりも大きく感じてしまう民の姿です。","s":308.412,"e":316.707,"p":false,"h":false},{"t":"慰めの根拠は、天と地を造られた方が、ご自分の民を覚えておられることにあります。","s":317.016,"e":323.189,"p":true,"h":false},{"t":"16節の「わたしのことばをあなたの口に置き」は、しもべの務めを思い出させる言葉です。","s":323.82,"e":329.777,"p":false,"h":false},{"t":"ここで語られている「あなた」が誰を指すかは、イスラエル全体なのか、しもべなのか、読み方が分かれます。","s":330.048,"e":337.235,"p":true,"h":false},{"t":"17~23節の「憤りの杯」は、さばきを、飲み干さなければならない杯にたとえたものです。","s":337.86,"e":345.4,"p":false,"h":false},{"t":"新約聖書で、イエスがゲツセマネで、「この杯を過ぎ去らせてください」と祈られたことと、結びつけて読まれることがあります。","s":345.708,"e":354.034,"p":false,"h":false},{"t":"ここでは、その杯が、民の手から取り去られ、苦しめた者に渡されると語られており、さばきと赦しの、大きな転換が示されています。","s":354.312,"e":363.68,"p":true,"h":false}], NAV = {"prev":{"href":"doc50.html","title":"イザヤ書_50章"},"next":{"href":"doc52.html","title":"イザヤ書_52章"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let spd = 1, fsi = 2, last = -1, lastUser = 0, playing = false, tickId = 0;
  const audio = new Audio(AUDIO_SRC);
  audio.preload = 'metadata';

  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });

  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }

  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
