<script>
(function () {
  const TITLE = "イザヤ書_40章", AUDIO_SRC = "doc40_2610231055.mp3", DUR = 429, SEGS = [{"t":"イザヤ書40章","s":0,"e":1.414,"p":true,"h":false},{"t":"全体の流れ","s":2.052,"e":3.157,"p":true,"h":false},{"t":"40章は、「慰めよ、慰めよ、わたしの民を」という、主のことばで始まります。","s":3.96,"e":10.382,"p":false,"h":false},{"t":"「エルサレムの心に語りかけ、これに呼びかけよ。","s":10.692,"e":13.988,"p":false,"h":false},{"t":"その苦役の時は満ち、その咎は償われた。","s":14.292,"e":17.675,"p":false,"h":false},{"t":"その全ての罪に代えて、主の手から二倍のものを受けた」(40:1-2)。","s":17.964,"e":21.86,"p":true,"h":false},{"t":"声が叫びます。","s":22.5,"e":23.586,"p":false,"h":false},{"t":"「荒れ野に、主の道を備えよ。","s":24.408,"e":26.48,"p":false,"h":false},{"t":"荒れ地に、私たちの神のために、大路をまっすぐにせよ。","s":26.784,"e":30.7,"p":false,"h":false},{"t":"すべての谷は引き上げられ、すべての山と丘は低くされ、曲がったところはまっすぐになり、でこぼこの所は平らになる。","s":30.996,"e":39.295,"p":false,"h":false},{"t":"主の栄光が現れ、すべての肉なる者が、ともにそれを見る。","s":39.6,"e":44.045,"p":false,"h":false},{"t":"主の口が語られたからだ」(40:3-5)。","s":44.316,"e":46.159,"p":true,"h":false},{"t":"また、声が言います。","s":46.8,"e":48.34,"p":false,"h":false},{"t":"「呼べ」。","s":48.708,"e":49.131,"p":false,"h":false},{"t":"「何と呼べばよいのですか」。","s":49.428,"e":50.965,"p":false,"h":false},{"t":"「すべての人は草。","s":51.336,"e":52.611,"p":false,"h":false},{"t":"その栄えは、すべて野の花のようだ。","s":53.244,"e":55.838,"p":false,"h":false},{"t":"草は枯れ、花はしぼむ。","s":56.124,"e":57.917,"p":false,"h":false},{"t":"主の息が吹きつけたからだ。","s":58.212,"e":59.992,"p":false,"h":false},{"t":"確かに、民は草だ。","s":60.3,"e":61.971,"p":false,"h":false},{"t":"草は枯れ、花はしぼむ。","s":62.28,"e":64.073,"p":false,"h":false},{"t":"しかし、私たちの神のことばは、永遠に立つ」(40:6-8)。","s":64.368,"e":67.903,"p":true,"h":false},{"t":"高い山に上って、良い知らせをシオンに伝える者よ、力の限り声を上げよ。","s":68.544,"e":74.159,"p":false,"h":false},{"t":"恐れずに声を上げ、ユダの町々に言え。","s":74.448,"e":77.375,"p":false,"h":false},{"t":"「見よ、あなたがたの神」(40:9)。","s":77.688,"e":79.24,"p":false,"h":false},{"t":"「見よ、神である主は、力をもって来られ、その腕で統べ治められる。","s":79.596,"e":84.798,"p":false,"h":false},{"t":"見よ、その報いは主とともにあり、その働きの報いは、御前にある。","s":85.068,"e":89.913,"p":false,"h":false},{"t":"主は、羊飼いのように、その群れを飼い、その腕に子羊を集め、懐に抱き、乳を飲ませる羊を優しく導かれる」(40:10-11)。","s":90.18,"e":99.116,"p":true,"h":false},{"t":"そして、問いが続きます。","s":99.756,"e":101.595,"p":false,"h":false},{"t":"だれが、手のひらで水を量り、手の幅で天を測ったのか。","s":101.88,"e":106.138,"p":false,"h":false},{"t":"地のちりを升に入れ、山々をはかりで、丘々を天秤で量ったのか(40:12)。","s":106.416,"e":111.454,"p":false,"h":false},{"t":"だれが、主の霊を測り、主の助言者として教えたのか(40:13-14)。","s":111.744,"e":115.847,"p":false,"h":false},{"t":"見よ、国々は、手おけのひとしずく、天秤のちりのようだ。","s":116.136,"e":120.552,"p":false,"h":false},{"t":"島々は、細かいちりのようだ。","s":120.852,"e":123.247,"p":false,"h":false},{"t":"レバノンの木々も、全焼のささげ物には足りない(40:15-16)。","s":123.552,"e":126.905,"p":false,"h":false},{"t":"国々はみな、主の前では無に等しく、むなしいものとして見なされる(40:17)。","s":127.188,"e":131.988,"p":true,"h":false},{"t":"では、だれに神をなぞらえるのか。","s":132.624,"e":134.975,"p":false,"h":false},{"t":"偶像は、職人が鋳て、金細工人が金をかぶせ、銀の鎖をつくる。","s":135.252,"e":140.653,"p":false,"h":false},{"t":"貧しい者は、朽ちない木を選び、巧みな職人を探して、倒れない偶像を据えさせる(40:18-20)。","s":140.94,"e":147.351,"p":false,"h":false},{"t":"あなたがたは知らないのか。","s":147.636,"e":149.279,"p":false,"h":false},{"t":"聞いていないのか。","s":149.58,"e":150.643,"p":false,"h":false},{"t":"初めから、告げられなかったのか。","s":151.488,"e":153.695,"p":false,"h":false},{"t":"地の基が据えられたときから、悟らなかったのか(40:21)。","s":153.972,"e":157.036,"p":false,"h":false},{"t":"主は、地を覆う丸い天の上に座し、地の住民は、いなごのようだ。","s":157.32,"e":162.459,"p":false,"h":false},{"t":"主は、天を薄い布のように広げ、住むための天幕のように張られる(40:22)。","s":162.756,"e":167.664,"p":false,"h":false},{"t":"主は、君主たちを無にし、地をさばく者たちを、むなしいものとされる(40:23-24)。","s":167.94,"e":173.15,"p":true,"h":false},{"t":"「では、わたしをだれになぞらえて、わたしが等しくなるというのか」と、聖なる方は言われます。","s":173.808,"e":180.033,"p":false,"h":false},{"t":"目を高く上げて、見よ。","s":180.324,"e":182.127,"p":false,"h":false},{"t":"これらを創造したのはだれか。","s":182.448,"e":184.316,"p":false,"h":false},{"t":"その万象を数えて引き出し、一つ一つ名を呼ばれる方。","s":184.608,"e":188.614,"p":false,"h":false},{"t":"その力は強く、その勢いは大きく、一つも欠けることはありません(40:25-26)。","s":188.892,"e":193.888,"p":false,"h":false},{"t":"ヤコブよ、なぜ言うのか。","s":194.184,"e":195.852,"p":false,"h":false},{"t":"イスラエルよ、なぜ語るのか。","s":196.128,"e":198.076,"p":false,"h":false},{"t":"「私の道は主に隠されている。","s":198.36,"e":200.526,"p":false,"h":false},{"t":"私の訴えは、神に見過ごされている」と(40:27)。","s":200.808,"e":203.871,"p":false,"h":false},{"t":"あなたは知らないのか。","s":204.156,"e":205.536,"p":false,"h":false},{"t":"聞いていないのか。","s":206.064,"e":207.127,"p":false,"h":false},{"t":"主は、とこしえの神、地の果てまで創造された方。","s":207.972,"e":211.867,"p":false,"h":false},{"t":"疲れることなく、弱ることなく、その英知は測り知れません(40:28)。","s":212.148,"e":216.302,"p":false,"h":false},{"t":"疲れた者には力を与え、力のない者には勢いを増し加えられます。","s":216.612,"e":221.676,"p":false,"h":false},{"t":"若者も疲れ、弱り、若い男もつまずき倒れる。","s":221.976,"e":225.847,"p":false,"h":false},{"t":"しかし、主を待ち望む者は、新しく力を得、鷲のように翼を広げて上る。","s":226.152,"e":232.373,"p":false,"h":false},{"t":"走っても疲れず、歩いても弱ることがありません(40:29-31)。","s":232.668,"e":235.988,"p":true,"h":false},{"t":"各節の解説","s":236.664,"e":237.946,"p":true,"h":false},{"t":"1~2節で、「慰めよ」は、複数の命令形です。","s":238.608,"e":242.604,"p":false,"h":false},{"t":"だれに向けられているのか、天の会議の声なのか、預言者たちなのかは、はっきり語られていません。","s":242.892,"e":249.508,"p":false,"h":false},{"t":"ここから、イザヤ書の後半、40~66章が始まり、場面は、バビロンの地で苦しむ民へと移ります。","s":249.804,"e":257.94,"p":false,"h":false},{"t":"39章の宣告の、その先を見る言葉です。","s":258.228,"e":261.841,"p":true,"h":false},{"t":"2節の「二倍のものを受けた」は、罪の刑罰を二倍受けたという意味か、十分に受けたという意味か、読み方が分かれます。","s":262.476,"e":270.428,"p":false,"h":false},{"t":"ここでは、償いが終わり、さばきの時が満ちたという意味が中心です。","s":270.756,"e":275.345,"p":true,"h":false},{"t":"3~5節の「荒れ野に主の道を備えよ」は、新約聖書で、四つの福音書すべてが、洗礼者ヨハネの働きを説明するために引いています。","s":276.012,"e":285.895,"p":false,"h":false},{"t":"ここでは、バビロンから帰る民のために、主が道を備えられると読まれます。","s":286.2,"e":291.552,"p":false,"h":false},{"t":"のちに、キリストの来臨を準備する声として、さらに深い意味で成就した、というのが、改革派の伝統の読み方です。","s":291.852,"e":299.554,"p":true,"h":false},{"t":"6~8節の「草は枯れ、花はしぼむ。","s":300.204,"e":303.143,"p":false,"h":false},{"t":"しかし、神のことばは永遠に立つ」は、人間のはかなさと、神のことばの確かさを、対比した、この章の中心です。","s":303.444,"e":312.061,"p":false,"h":false},{"t":"新約聖書では、ペテロが、福音のことばについて、この言葉を引いています。","s":312.372,"e":317.999,"p":false,"h":false},{"t":"人は頼りなく、神のことばだけが頼りになる、ということが、イザヤ書全体の主題と重なっています。","s":318.276,"e":325.519,"p":true,"h":false},{"t":"9~11節で、主は、力ある王として来られながら、同時に、羊飼いとして、子羊を腕に抱かれます。","s":326.16,"e":334.19,"p":false,"h":false},{"t":"力と優しさが、ひとりの方の中にあることが示されています。","s":334.476,"e":338.754,"p":false,"h":false},{"t":"この姿は、のちに、イエスが「良い羊飼い」と語られる場面とも、結びつけられます。","s":339.048,"e":345.148,"p":true,"h":false},{"t":"12~17節の、神の大きさを語る問いは、バビロンの偉大な神々と力に圧倒された民への、答えです。","s":345.78,"e":353.893,"p":false,"h":false},{"t":"国々が、手おけのしずくのようだというのは、国々が重要でないという意味ではなく、神の偉大さの前では比べものにならない、という意味です。","s":354.168,"e":363.444,"p":true,"h":false},{"t":"18~20節の偶像の描写は、44章でも、より長く語られる主題の始まりです。","s":364.104,"e":370.917,"p":false,"h":false},{"t":"人が作ったものを神とする愚かさが、ここで、職人の仕事の細かな描写を通して、皮肉を込めて語られています。","s":371.232,"e":379.375,"p":true,"h":false},{"t":"25~26節の、星を一つ一つ名で呼ぶ方という言葉は、バビロンの人々が神として拝んだ星々さえ、主が創造し、数えておられるものだ、ということです。","s":380.016,"e":392.38,"p":true,"h":false},{"t":"27~28節の民の不平は、バビロンの地で、神に忘れられたと感じている人々の声です。","s":393.012,"e":400.239,"p":false,"h":false},{"t":"それに対する答えは、神の偉大さを、もう一度語ることです。","s":400.536,"e":404.995,"p":false,"h":false},{"t":"慰めの根拠は、神がどのようなお方かにあります。","s":405.288,"e":408.945,"p":true,"h":false},{"t":"31節の「主を待ち望む者は、新しく力を得る」は、聖書の中でもよく知られた約束の一つです。","s":409.572,"e":417.177,"p":false,"h":false},{"t":"「待ち望む」は、ただ待つというより、神に望みを置いて、期待して待つことです。","s":417.456,"e":422.922,"p":false,"h":false},{"t":"弱い者を引き上げる神への信頼が、人に、新しい力を与えます。","s":423.216,"e":428.081,"p":true,"h":false}], NAV = {"prev":{"href":"doc39.html","title":"イザヤ書_39章"},"next":{"href":"doc41.html","title":"イザヤ書_41章"},"list":"index.html"};

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
