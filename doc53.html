は、末長く子孫を見、主のみこころは、彼の手によって成し遂げられる(53:10)。","s":110.052,"e":119.727,"p":false,"h":false},{"t":"彼は、自分のたましいの苦しみのあとを見て、満足する。","s":120.024,"e":124.249,"p":false,"h":false},{"t":"わたしの義なるしもべは、その知識によって、多くの人を義とし、彼らの咎を負う(53:11)。","s":124.524,"e":130.3,"p":false,"h":false},{"t":"それゆえ、わたしは、多くの人々を彼に分け与え、彼は、強い者たちを、戦利品として分ける。","s":130.608,"e":138.014,"p":false,"h":false},{"t":"彼が、自分のいのちを死に明け渡し、背く者たちとともに数えられたからだ。","s":138.312,"e":143.869,"p":false,"h":false},{"t":"彼は、多くの人の罪を負い、背く者たちのために、とりなしをした(53:12)。","s":144.144,"e":149.073,"p":true,"h":false},{"t":"各節の解説","s":149.724,"e":151.006,"p":true,"h":false},{"t":"1節の「だれが信じただろうか」は、この歌が語る内容が、あまりに人の予想に反していることを示します。","s":151.668,"e":159.04,"p":false,"h":false},{"t":"力ある救い主ではなく、苦しむしもべによって救いが来るという知らせは、信じがたいものでした。","s":159.336,"e":165.941,"p":false,"h":false},{"t":"この節は、新約聖書で、ヨハネの福音書とパウロが、イエスを信じない人々について語るときに、引いています。","s":166.212,"e":174.164,"p":true,"h":false},{"t":"2~3節の姿は、人の目に魅力のない、弱い者のようです。","s":174.816,"e":179.524,"p":false,"h":false},{"t":"神の救いが、人の目に華やかなものではなく、蔑まれる者を通して来るという逆説が、ここで語られています。","s":179.82,"e":187.668,"p":true,"h":false},{"t":"4~6節は、この歌の中心です。","s":188.316,"e":191.197,"p":false,"h":false},{"t":"「私たちの病を負い、痛みをになった」「私たちの背きのために刺され」「私たちすべての咎を、彼に負わせた」という言葉は、しもべが、他の人の罪を代わりに負うという、代わりの苦しみを語っています。","s":191.484,"e":205.346,"p":false,"h":false},{"t":"「私たち」が、告白する人々を指していることに、注意が必要です。","s":205.632,"e":210.55,"p":false,"h":false},{"t":"この人々は、最初、しもべを神に打たれた者として見ていました。","s":210.816,"e":215.51,"p":false,"h":false},{"t":"しかし、実は、自分たちの罪のために、しもべが苦しんだのだと、悟ります。","s":215.784,"e":221.664,"p":false,"h":false},{"t":"改革派の神学は、これを、キリストの代償的な贖いの預言として、重く受け取ってきました。","s":221.976,"e":228.582,"p":false,"h":false},{"t":"新約聖書でも、ペテロの手紙などで、この箇所が、キリストの十字架を説明するために、引かれています。","s":228.852,"e":236.229,"p":true,"h":false},{"t":"7節の、屠り場に引かれる羊のように黙っていたという描写は、使徒の働きで、エチオピアの宦官が、この箇所を読んでいて、ピリポが、イエスの福音を語る場面で出てきます。","s":236.88,"e":249.037,"p":false,"h":false},{"t":"しもべが、自分を弁護せず、黙って苦しみを受けたことを語ります。","s":249.336,"e":254.234,"p":true,"h":false},{"t":"8節の「私の民の背きのゆえに」は、苦しみの理由が、しもべ自身の罪ではなく、民の背きにあることを、はっきり語ります。","s":254.88,"e":263.979,"p":false,"h":false},{"t":"9節の「その口に偽りはなかった」も、しもべが、自分の罪のために苦しんだのではないことを示します。","s":264.276,"e":271.669,"p":true,"h":false},{"t":"9節の、悪しき者たちとともに墓が設けられ、富む者とともに死があったという言葉は、読み方が難しい箇所です。","s":272.304,"e":280.433,"p":false,"h":false},{"t":"新約聖書の福音書では、イエスが、罪人のように十字架につけられ、富む人の墓に葬られたことと結びつけて読まれています。","s":280.728,"e":289.596,"p":true,"h":false},{"t":"10節の「主は、彼を砕くことを望み」は、非常に厳しい言葉です。","s":290.232,"e":295.376,"p":false,"h":false},{"t":"ここで、しもべの苦しみが、人間の悪意だけでなく、神ご自身の計画の中にあったことが示されます。","s":295.668,"e":303.036,"p":false,"h":false},{"t":"ただし、この言葉は、神が残酷であるという意味ではなく、救いのために、しもべが自分から、いのちを献げることを、神が計画しておられた、という意味に、読まれます。","s":303.336,"e":314.45,"p":false,"h":false},{"t":"「罪過のためのささげ物」という言葉は、レビ記の、いけにえの言葉です。","s":314.748,"e":319.566,"p":false,"h":false},{"t":"しもべが、自分のいのちを、いけにえとして献げたことを、語っています。","s":319.86,"e":324.649,"p":true,"h":false},{"t":"11節の「義とする」は、しもべの苦しみによって、多くの人が、神の前で、義とされることを語ります。","s":325.296,"e":332.711,"p":false,"h":false},{"t":"新約聖書の、信仰による義認の教えが、ここに、旧約の中で、すでに語られていることを、教会は見てきました。","s":333,"e":341.568,"p":true,"h":false},{"t":"12節の、「背く者たちとともに数えられた」は、新約聖書で、イエスが、十字架の前に、ご自分のことを語る言葉として、引かれています。","s":342.216,"e":352.172,"p":false,"h":false},{"t":"「とりなしをした」という結びは、しもべが、苦しみの中でも、人々のために祈られたことを示します。","s":352.476,"e":359.566,"p":true,"h":false},{"t":"この歌のしもべが誰を指すかについては、イスラエルの民全体と読む立場や、預言者自身と読む立場もあります。","s":360.216,"e":367.984,"p":false,"h":false},{"t":"ただし、改革派の伝統は、新約聖書の理解を受けて、この歌を、イエス・キリストの預言として、読んできました。","s":368.28,"e":376.3,"p":true,"h":false}], NAV = {"prev":{"href":"doc52.html","title":"イザヤ書_52章"},"next":{"href":"doc54.html","title":"イザヤ書_54章"},"list":"index.html"};

    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
