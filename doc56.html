<script>
(function () {
  const TITLE = "イザヤ書_56章", AUDIO_SRC = "doc56_2610231055.mp3", DUR = 202, SEGS = [{"t":"イザヤ書56章","s":0,"e":1.548,"p":true,"h":false},{"t":"全体の流れ","s":2.196,"e":3.301,"p":true,"h":false},{"t":"主は言われます。","s":4.104,"e":5.143,"p":false,"h":false},{"t":"「公正を守り、正義を行え。","s":6.012,"e":8.297,"p":false,"h":false},{"t":"わたしの救いが来るのは近く、わたしの義が現れるのも近いからだ」(56:1)。","s":8.604,"e":13.205,"p":false,"h":false},{"t":"安息日を守って汚さず、どんな悪にも手を出さない人は幸いです(56:2)。","s":13.5,"e":18.18,"p":true,"h":false},{"t":"主に連なる異邦人は、「主は私を、その民から切り離される」と言ってはなりません。","s":18.828,"e":24.701,"p":false,"h":false},{"t":"宦官も、「私は枯れ木だ」と言ってはなりません(56:3)。","s":25.02,"e":28.183,"p":false,"h":false},{"t":"主は、安息日を守り、わたしの喜ぶことを選び、わたしの契約を堅く守る宦官に、わたしの家と城壁の内に、息子や娘にまさる記念の名を与え、絶えることのない永遠の名を与えます(56:4-5)。","s":28.476,"e":42.488,"p":false,"h":false},{"t":"主に連なって仕え、主の名を愛し、そのしもべとなる異邦人も、わたしの聖なる山に導き、祈りの家で喜ばせます。","s":42.768,"e":51.411,"p":false,"h":false},{"t":"そのささげ物は受け入れられ、「わたしの家は、すべての民の祈りの家と呼ばれる」と言われます(56:6-7)。","s":51.696,"e":58.119,"p":false,"h":false},{"t":"追い散らされたイスラエルを集める主は、言われます。","s":58.428,"e":61.724,"p":false,"h":false},{"t":"「すでに集められた者たちに、さらに他の者たちを集める」(56:8)。","s":62.028,"e":66.01,"p":true,"h":false},{"t":"ところが、後半は、指導者たちへの厳しい言葉に変わります。","s":66.636,"e":71.088,"p":false,"h":false},{"t":"野のすべての獣よ、来て食べよ。","s":71.388,"e":73.683,"p":false,"h":false},{"t":"見張りたちは盲目で、何も知らず、みな吠えることのできない犬、横になって夢を見て、眠りをむさぼる犬です。","s":74.016,"e":82.116,"p":false,"h":false},{"t":"この犬たちは貪欲で、足ることを知りません。","s":82.404,"e":85.452,"p":false,"h":false},{"t":"羊飼いたちにも悟りがありません。","s":85.752,"e":87.975,"p":false,"h":false},{"t":"みな自分の道に向かい、おのおの自分の利得を求めています(56:9-11)。","s":88.272,"e":92.502,"p":false,"h":false},{"t":"「さあ、ぶどう酒を持って来い。","s":92.772,"e":94.757,"p":false,"h":false},{"t":"強い酒に酔おう。","s":95.04,"e":96.279,"p":false,"h":false},{"t":"明日も今日のように、いや、もっと素晴らしいだろう」と言っています(56:12)。","s":96.948,"e":101.128,"p":true,"h":false},{"t":"各節の解説","s":101.772,"e":103.054,"p":true,"h":false},{"t":"1節の「公正を守り、正義を行え」は、救いが近いという約束への、民の応答として語られています。","s":103.716,"e":111.345,"p":false,"h":false},{"t":"救いは恵みですが、その恵みを受けた者は、公正と正義に歩む、という順序です。","s":111.636,"e":117.971,"p":true,"h":false},{"t":"3~5節の宦官への約束は、特に重い意味を持っています。","s":118.62,"e":122.875,"p":false,"h":false},{"t":"申命記の律法では、一定の人々は主の会衆に加われないとされていました。","s":123.192,"e":128.749,"p":false,"h":false},{"t":"ここでは、その壁が取り払われると語られます。","s":129.024,"e":132.262,"p":false,"h":false},{"t":"外側の条件ではなく、主の契約を守る心が、神の民のしるしとされています。","s":132.552,"e":138.626,"p":false,"h":false},{"t":"この節は、使徒の働きで、エチオピアの宦官が受け入れられる場面を思い起こさせる、と読まれることがあります。","s":138.924,"e":146.469,"p":true,"h":false},{"t":"6~7節の「すべての民の祈りの家」は、新約聖書で、イエスが宮を清められたとき、引かれた言葉です。","s":147.096,"e":154.785,"p":false,"h":false},{"t":"神殿が、一つの民だけの場所ではなく、すべての民のための祈りの家であることを、イエスは示されました。","s":155.088,"e":162.569,"p":true,"h":false},{"t":"8節の「さらに他の者たちを集める」は、神の民の広がりが、イスラエルの帰還だけにとどまらないことを語ります。","s":163.188,"e":171.118,"p":false,"h":false},{"t":"この言葉が、どの範囲まで及ぶのかについては、読み方が分かれます。","s":171.396,"e":176.243,"p":true,"h":false},{"t":"9~12節の「吠えることのできない犬」は、見張りの務めを果たさない指導者への、強い皮肉です。","s":176.868,"e":183.809,"p":false,"h":false},{"t":"危険を知らせるはずの者が、眠っています。","s":184.104,"e":186.956,"p":false,"h":false},{"t":"この指導者批判は、39章までの、イザヤの時代の指導者批判と、似た響きを持っています。","s":187.236,"e":194.329,"p":false,"h":false},{"t":"ここでの描写が、帰還後の共同体のことなのか、捕囚前のことなのかは、はっきりしません。","s":194.616,"e":200.978,"p":true,"h":false}], NAV = {"prev":{"href":"doc55.html","title":"イザヤ書_55章"},"next":{"href":"doc57.html","title":"イザヤ書_57章"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];

  const audio = new Audio(AUDIO_SRC);

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }

  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {

    const old = $('g' + last); if (old) { old.classList.remove('on'); }

    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }

  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */

  /* 단추 */
  $('play').onclick = toggle;

  (function () {

    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
