(function () {
  const TITLE = "イザヤ書_34章", AUDIO_SRC = "doc34_2610231055.mp3", DUR = 262, SEGS = [{"t":"イザヤ書34章","s":0,"e":1.686,"p":true,"h":false},{"t":"全体の流れ","s":2.34,"e":3.445,"p":true,"h":false},{"t":"34章は、すべての国々への呼びかけで始まります。","s":4.248,"e":8.366,"p":false,"h":false},{"t":"「諸国民よ、近づいて聞け。","s":8.64,"e":10.66,"p":false,"h":false},{"t":"国々の民よ、耳を傾けよ。","s":10.944,"e":13.454,"p":false,"h":false},{"t":"地とそこに満ちるもの、世界とそこから出るすべてのものよ、聞け」(34:1)。","s":13.752,"e":18.171,"p":false,"h":false},{"t":"主の憤りは、すべての国々に向けられ、その怒りは、すべての軍勢に向かいます。","s":18.468,"e":24.711,"p":false,"h":false},{"t":"主は彼らを滅ぼし、殺戮に渡されます(34:2)。","s":24.984,"e":28.115,"p":false,"h":false},{"t":"殺された者は投げ捨てられ、死体の悪臭が立ち上り、山々は彼らの血で溶けます。","s":28.404,"e":34.262,"p":false,"h":false},{"t":"天の万象は朽ち果て、天は巻物のように巻かれます(34:3-4)。","s":34.56,"e":38.372,"p":true,"h":false},{"t":"主の剣は、天で酔い、エドムの上に、主が滅ぼし尽くすと定めた民の上に下ります(34:5)。","s":39.024,"e":45.059,"p":false,"h":false},{"t":"主には、ボツラでのいけにえ、エドムの地での大きな殺戮があります。","s":45.36,"e":50.076,"p":false,"h":false},{"t":"野牛も子牛も強い雄牛も倒れ、地は血に酔います。","s":50.364,"e":54.14,"p":false,"h":false},{"t":"それは、主の復讐の日、シオンの訴えのための報復の年だからです(34:6-8)。","s":54.432,"e":59.407,"p":false,"h":false},{"t":"エドムの川は瀝青に、そのちりは硫黄に変わり、その地は燃える瀝青となります。","s":59.688,"e":65.417,"p":false,"h":false},{"t":"夜も昼も消えず、その煙は永遠に立ち上ります。","s":65.7,"e":69.372,"p":false,"h":false},{"t":"世代から世代へ荒れ果て、永遠に通る者はありません(34:9-10)。","s":69.66,"e":73.413,"p":true,"h":false},{"t":"そこには、ふくろうやはりねずみが住み、みみずく、からすがそこにいます。","s":74.088,"e":79.182,"p":false,"h":false},{"t":"主は、そこに、混沌の測りなわと、むなしさのおもりを垂らされます。","s":79.452,"e":84.314,"p":false,"h":false},{"t":"その高貴な人々は、王国の名を呼ぶ者もなく、首長たちはみな無になります(34:11-12)。","s":84.6,"e":90.165,"p":false,"h":false},{"t":"その宮殿にはいばらが生え、要塞にはあざみとおどろが生えます。","s":90.468,"e":94.749,"p":false,"h":false},{"t":"そこは、山犬の住み処、だちょうの家となります(34:13)。","s":95.04,"e":98.582,"p":false,"h":false},{"t":"荒れ野の獣はやまねこに会い、毛深い野やぎは、仲間を呼びます。","s":98.892,"e":103.529,"p":false,"h":false},{"t":"夜の魔物もそこにとどまり、休み場を見つけます(34:14)。","s":103.824,"e":107.21,"p":true,"h":false},{"t":"最後に、「主の書物を調べて読め」と言われます。","s":107.856,"e":111.229,"p":false,"h":false},{"t":"これらのものは、一つも欠けず、互いに相手を欠かすことがありません。","s":111.528,"e":116.297,"p":false,"h":false},{"t":"主の口がこれを命じ、主の霊がこれらを集められたからです。","s":116.604,"e":120.879,"p":false,"h":false},{"t":"主は、これらのためにくじを引き、手の測りなわで、地を分け与えられました。","s":121.176,"e":126.64,"p":false,"h":false},{"t":"これらは永遠にこれを所有し、世代から世代へ、そこに住みます(34:16-17)。","s":126.936,"e":131.525,"p":true,"h":false},{"t":"各節の解説","s":132.156,"e":133.438,"p":true,"h":false},{"t":"1~4節は、特定の国ではなく、すべての国々に対する、世界規模のさばきを語ります。","s":134.1,"e":141.077,"p":false,"h":false},{"t":"ここでは、13~23章の、個々の国への宣告の終わりに、全世界のさばきが総括されるという構造になっています。","s":141.336,"e":150.186,"p":false,"h":false},{"t":"天が巻物のように巻かれるという表現は、新約聖書の黙示録でも、終わりの時のさばきを語る際に用いられています。","s":150.48,"e":158.603,"p":true,"h":false},{"t":"5~6節の「エドム」は、イスラエルの兄弟の民でありながら、しばしば敵対した国です。","s":159.228,"e":165.53,"p":false,"h":false},{"t":"ここで、エドムが、神に逆らう世界全体の代表として扱われている、と読む立場があります。","s":165.816,"e":172.695,"p":false,"h":false},{"t":"エドムへの具体的な預言として読む立場もあり、どちらが中心かは、読み方が分かれます。","s":172.98,"e":179.181,"p":true,"h":false},{"t":"8節の「復讐の日」は、人間の私的な恨みを晴らすことではなく、主が、ご自分の民のために、正しいさばきを行われる日を意味しています。","s":179.82,"e":189.339,"p":false,"h":false},{"t":"人間が、自分で復讐することを正当化する言葉ではありません。","s":189.648,"e":194.315,"p":false,"h":false},{"t":"「シオンの訴えのための報復の年」は、35章で語られる救いの年との、対になっています。","s":194.616,"e":201.224,"p":true,"h":false},{"t":"9~10節の「永遠に立ち上る煙」は、さばきの徹底さを表現する、詩的な言葉です。","s":201.852,"e":208.225,"p":false,"h":false},{"t":"ソドムとゴモラの滅亡を思い起こさせます。","s":208.512,"e":211.254,"p":false,"h":false},{"t":"黙示録でも、バビロンの滅びを語る際に、同じような表現が用いられています。","s":211.536,"e":217.153,"p":true,"h":false},{"t":"11~15節の動物の描写は、人間が住まなくなり、荒れ果てた地の姿を表します。","s":217.8,"e":224.567,"p":false,"h":false},{"t":"かつて栄えた国が、獣だけの住む場所になるという、13章のバビロンの描写とも、響き合っています。","s":224.856,"e":232.288,"p":false,"h":false},{"t":"14節の「夜の魔物」については、翻訳や読み方が分かれる箇所で、民間伝承の存在を指す言葉と見る読み方があります。","s":232.56,"e":241.554,"p":true,"h":false},{"t":"16~17節の「主の書物」は、イザヤが語った預言の言葉を指すと読むのが一般的です。","s":242.172,"e":248.752,"p":false,"h":false},{"t":"主が語られたことは、必ず実現する、という確かさを語っています。","s":249.048,"e":254.185,"p":false,"h":false},{"t":"ここで語られるさばきは、主ご自身の口が命じたことなので、人間が変更することはできません。","s":254.484,"e":261.241,"p":true,"h":false}], NAV = {"prev":{"href":"doc33.html","title":"イザヤ書_33章"},"next":{"href":"doc35.html","title":"イザヤ書_35章"},"list":"index.html"};

  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  (function build() {

  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }

  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {

  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {

    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */

  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
