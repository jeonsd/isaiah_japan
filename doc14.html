  const TITLE = "イザヤ書_14章", AUDIO_SRC = "doc14_2610231055.mp3", DUR = 207, SEGS = [{"t":"イザヤ書14章","s":0,"e":1.486,"p":true,"h":false},{"t":"全体の流れ","s":2.124,"e":3.229,"p":true,"h":false},{"t":"14章の始めに、主はヤコブをあわれみ、イスラエルを再び選び、彼らをその地に住まわせると語られます。","s":4.032,"e":11.707,"p":false,"h":false},{"t":"外国人も彼らに加わります(14:1-2)。","s":11.988,"e":14.114,"p":false,"h":false},{"t":"主が民に安息を与え、苦役から解放される日が来ると、バビロンの王に対する嘲りの歌を歌うよう命じられます(14:3-4)。","s":14.4,"e":22.417,"p":true,"h":false},{"t":"その歌は、強い王が倒れた姿を歌います。","s":23.04,"e":26.383,"p":false,"h":false},{"t":"主は悪しき者の杖を砕かれ、全地は安らぎを得て、歓声をあげます(14:5-8)。","s":26.676,"e":31.748,"p":false,"h":false},{"t":"よみの世界は、王を迎えるために動き出し、死者の霊たちが立ち上がって語りかけます。","s":32.04,"e":37.904,"p":false,"h":false},{"t":"「あなたも私たちのように弱くなった」(14:9-11)。","s":38.196,"e":40.504,"p":true,"h":false},{"t":"続いて、「明けの明星、暁の子よ、どうして天から落ちたのか」と歌われます。","s":41.148,"e":46.779,"p":false,"h":false},{"t":"この王は、「私は天に上り、神の星々のはるか上に私の王座を据え、いと高き方のようになろう」と心の中で言いました。","s":47.088,"e":56.021,"p":false,"h":false},{"t":"しかし、よみの底に落とされます(14:12-15)。","s":56.304,"e":58.636,"p":false,"h":false},{"t":"人々は彼を見て、「この人が、地を震わせ、国々を揺り動かした者か」と驚きます(14:16-21)。","s":58.932,"e":65.463,"p":true,"h":false},{"t":"主は、バビロンを根絶やしにすると宣告されます(14:22-23)。","s":66.096,"e":69.444,"p":false,"h":false},{"t":"さらに、アッシリアについて、主は誓って言われます。","s":69.732,"e":73.119,"p":false,"h":false},{"t":"「私の計ったとおりに事は成り、私の定めたとおりに実現する」(14:24-27)。","s":73.404,"e":78.119,"p":false,"h":false},{"t":"最後に、ペリシテについての短い宣告があります(14:28-32)。","s":78.408,"e":81.89,"p":true,"h":false},{"t":"各節の解説","s":82.512,"e":83.794,"p":true,"h":false},{"t":"1~2節の、外国人が民に加わるという言葉は、神の民の回復が、諸国民をも巻き込むことを予感させます。","s":84.456,"e":93.023,"p":false,"h":false},{"t":"イスラエルの回復は、イスラエルだけで終わりません。","s":93.312,"e":96.579,"p":true,"h":false},{"t":"4節の「嘲りの歌」は、倒れた暴君に向けて歌われる歌です。","s":97.236,"e":101.813,"p":false,"h":false},{"t":"権力が絶対的に見えても、神の前では、一つの歌のネタになるほど小さい、ということが表れています。","s":102.096,"e":109.676,"p":true,"h":false},{"t":"9~11節で、よみの死者たちが王を迎える場面は、詩的な描写です。","s":110.304,"e":115.661,"p":false,"h":false},{"t":"この世で栄華を極めた者も、死んだ後は他の人と同じようになる、という皮肉を述べています。","s":115.956,"e":122.408,"p":false,"h":false},{"t":"死後の世界について詳しく教える箇所ではない、と読むのが安全です。","s":122.724,"e":127.424,"p":true,"h":false},{"t":"12節の「明けの明星」は、ラテン語訳で「ルシファー」と訳されたことから、後に、堕落した天使、つまりサタンの話と結びつけて読まれてきた箇所です。","s":128.052,"e":138.833,"p":false,"h":false},{"t":"この章の文脈では、バビロンの王に対する嘲りの歌です。","s":139.14,"e":143.393,"p":false,"h":false},{"t":"ですから、第一にはバビロンの王の高ぶりについて語っていると理解されます。","s":143.676,"e":148.761,"p":false,"h":false},{"t":"ただし、その背後に、神に逆らう高ぶりの典型を見て、サタンの姿と重ねる読み方も、教会の歴史にはあります。","s":149.04,"e":157.67,"p":false,"h":false},{"t":"どこまでそう読むかは、意見が分かれます。","s":157.968,"e":160.76,"p":true,"h":false},{"t":"13~14節の「いと高き方のようになろう」という言葉は、人間が神の座を奪おうとする、根源的な罪の姿を示しています。","s":161.424,"e":171.129,"p":false,"h":false},{"t":"高ぶる者は、必ず低くされます。","s":171.396,"e":173.973,"p":true,"h":false},{"t":"24~27節の主の誓いは、アッシリアだけでなく、諸国民すべてに対する主の計画を示す言葉です。","s":174.6,"e":182.67,"p":false,"h":false},{"t":"人が何を企てても、主の定めを妨げることはできません。","s":182.952,"e":187.229,"p":true,"h":false},{"t":"28~32節のペリシテへの宣告は、アハズ王が死んだ年に語られた、と書かれています。","s":187.884,"e":194.723,"p":false,"h":false},{"t":"ペリシテが、アッシリアの打撃を受けた後、喜んでいるのを戒める言葉です。","s":195.012,"e":200.34,"p":false,"h":false},{"t":"最後に、「主がシオンを築かれた」ことが、貧しい民の避け所だと言われます(14:32)。","s":200.664,"e":206.199,"p":true,"h":false}], NAV = {"prev":{"href":"doc13.html","title":"イザヤ書_13章"},"next":{"href":"doc15.html","title":"イザヤ書_15章"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];

  const audio = new Audio(AUDIO_SRC);

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }

  (function build() {

  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {

    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */

  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));

  (function () {

    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
