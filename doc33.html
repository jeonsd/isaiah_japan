  const TITLE = "イザヤ書_33章", AUDIO_SRC = "doc33_2610231055.mp3", DUR = 328, SEGS = [{"t":"イザヤ書33章","s":0,"e":1.673,"p":true,"h":false},{"t":"全体の流れ","s":2.304,"e":3.409,"p":true,"h":false},{"t":"33章は、「災いだ、あなたは」と、略奪する者に向けて始まります。","s":4.212,"e":9.922,"p":false,"h":false},{"t":"自分は略奪されたことがないのに略奪し、自分は裏切られたことがないのに裏切る者は、略奪を終えたとき、自分も略奪されます(33:1)。","s":10.188,"e":19.667,"p":false,"h":false},{"t":"ここで、民は祈ります。","s":19.98,"e":21.701,"p":false,"h":false},{"t":"「主よ、私たちをあわれんでください。","s":21.996,"e":24.334,"p":false,"h":false},{"t":"私たちはあなたを待ち望みます。","s":24.624,"e":26.792,"p":false,"h":false},{"t":"朝ごとに私たちの腕となり、苦難の時には私たちの救いとなってください」(33:2)。","s":27.072,"e":32.044,"p":false,"h":false},{"t":"主が立ち上がられると、国々は逃げ散り、略奪された物は、いなごが集まるように集められます(33:3-4)。","s":32.328,"e":39.208,"p":true,"h":false},{"t":"主は高く上げられ、高い所に住まわれます。","s":39.852,"e":43.029,"p":false,"h":false},{"t":"主はシオンを公正と義で満たされます。","s":43.308,"e":45.894,"p":false,"h":false},{"t":"主は、あなたの時代の堅い基となり、知恵と知識と主を恐れる心という、救いの富となられます(33:5-6)。","s":46.188,"e":53.446,"p":false,"h":false},{"t":"ところが、現実には、使者たちは激しく泣き、大路は荒れ果て、契約は破られ、町々は退けられ、人は顧みられません。","s":53.748,"e":63.128,"p":false,"h":false},{"t":"地は嘆き、しおれ、レバノンは恥じ、シャロンは荒れ地のようになります(33:7-9)。","s":63.432,"e":68.296,"p":true,"h":false},{"t":"「今、わたしは立ち上がる」と主は言われます。","s":68.94,"e":71.77,"p":false,"h":false},{"t":"「今、わたしは自分を高く上げる。","s":72.072,"e":74.435,"p":false,"h":false},{"t":"今、わたしは崇められる」(33:10)。","s":74.736,"e":76.558,"p":false,"h":false},{"t":"あなたがたは、もみ殻をはらみ、わらを産みます。","s":76.824,"e":80.144,"p":false,"h":false},{"t":"あなたがたの息は、あなたがたを食い尽くす火です。","s":80.46,"e":83.728,"p":false,"h":false},{"t":"諸国民は、石灰のように焼かれ、刈り取られたいばらのように、火に燃やされます(33:11-12)。","s":84.024,"e":89.638,"p":true,"h":false},{"t":"シオンの罪人たちは恐れ、神を敬わない者たちはおののきます。","s":90.288,"e":94.793,"p":false,"h":false},{"t":"「私たちのうちだれが、焼き尽くす火のそばに住めるだろうか。","s":95.076,"e":98.902,"p":false,"h":false},{"t":"私たちのうちだれが、とこしえに燃える炉のそばに住めるだろうか」(33:14)。","s":99.18,"e":103.331,"p":false,"h":false},{"t":"答えは、正しく歩み、正しく語る者、搾取による利益を退け、手を振って賄賂を受けず、血を流す相談に耳をふさぎ、悪を見ることに目を閉ざす者です。","s":103.608,"e":115.481,"p":false,"h":false},{"t":"その人は、高い所に住み、岩の砦が彼の避け所となり、パンが与えられ、水が絶えることがありません(33:15-16)。","s":115.776,"e":123.637,"p":true,"h":false},{"t":"そして、「あなたの目は王をその美しさのうちに見、遠くの地を見る」と約束されます。","s":124.308,"e":130.12,"p":false,"h":false},{"t":"あなたは恐れの日々を思い返します。","s":130.392,"e":132.722,"p":false,"h":false},{"t":"「数える者はどこにいるのか。","s":133.02,"e":134.862,"p":false,"h":false},{"t":"重さを量る者はどこにいるのか。","s":135.144,"e":137.338,"p":false,"h":false},{"t":"やぐらを数える者はどこにいるのか」(33:17-18)。","s":137.628,"e":139.972,"p":false,"h":false},{"t":"もうあの横柄な民を見ることはありません。","s":140.256,"e":142.952,"p":false,"h":false},{"t":"あなたの目は、祭りの町シオン、安らかな住まいエルサレムを見ます。","s":143.244,"e":147.986,"p":false,"h":false},{"t":"それは、動かされることのない天幕です(33:19-20)。","s":148.284,"e":151.129,"p":false,"h":false},{"t":"主はそこで、広い川や流れのある所のように、私たちの威光となられ、そこには、こぎ舟も大きな船も入りません。","s":151.452,"e":159.996,"p":false,"h":false},{"t":"主は私たちのさばき人、主は私たちの立法者、主は私たちの王。","s":160.308,"e":165.397,"p":false,"h":false},{"t":"この方が私たちを救われます(33:21-22)。","s":165.708,"e":167.765,"p":false,"h":false},{"t":"敵の船の綱は緩み、帆柱は支えられず、帆も張れません。","s":168.048,"e":172.356,"p":false,"h":false},{"t":"そのとき、莫大な略奪物が分けられ、足の不自由な者でさえ獲物を奪います。","s":172.656,"e":178.649,"p":false,"h":false},{"t":"そこに住む者は、「私は病気だ」とは言わず、そこに住む民は、咎を赦されます(33:23-24)。","s":178.956,"e":185.052,"p":true,"h":false},{"t":"各節の解説","s":185.688,"e":186.97,"p":true,"h":false},{"t":"1節の略奪者は、アッシリアを指すと読まれます。","s":187.632,"e":191.049,"p":false,"h":false},{"t":"人を裏切り、奪い続けた者も、やがて同じ目にあう、という神のさばきの原則が語られています。","s":191.34,"e":198.499,"p":true,"h":false},{"t":"2節の祈りは、この章の中心です。","s":199.116,"e":201.936,"p":false,"h":false},{"t":"「朝ごとに私たちの腕となってください」という願いは、日ごとに神に頼る信仰を表しています。","s":202.248,"e":208.55,"p":false,"h":false},{"t":"さばきの宣告が続く中で、民が神に呼びかける声が、ここに記されています。","s":208.836,"e":214.666,"p":true,"h":false},{"t":"5~6節の「主を恐れることが宝」という言葉は、救いの富が、金銀ではなく、神を畏れる心にあると教えます。","s":215.316,"e":224.011,"p":false,"h":false},{"t":"エジプトの財力や軍事力に頼った人々への、静かな答えとして読めます。","s":224.316,"e":229.509,"p":true,"h":false},{"t":"10節の「今、わたしは立ち上がる」は、主が、ご自分の時を定めて動き出される宣言です。","s":230.148,"e":236.834,"p":false,"h":false},{"t":"人々が自分の力で救いを得ようと動き回っていたとき、主は、ご自分の時に、ご自分の方法で働かれます。","s":237.132,"e":245.143,"p":true,"h":false},{"t":"14節の「焼き尽くす火のそばに住めるだろうか」という問いは、聖なる神の前に立てる人はだれか、という、聖書全体を通じた根本的な問いです。","s":245.772,"e":256.133,"p":false,"h":false},{"t":"15~16節の答えは、行いの条件のように見えますが、これだけで神の前に立てる人はいません。","s":256.428,"e":263.686,"p":false,"h":false},{"t":"改革派の伝統は、この問いの答えを、キリストご自身、そしてキリストにある者として読んできました。","s":263.988,"e":270.933,"p":false,"h":false},{"t":"ただし、この箇所が、そのまま行いによる救いを教えているのではない、という点が大切です。","s":271.224,"e":277.917,"p":true,"h":false},{"t":"17節の「王をその美しさのうちに見る」は、解釈が分かれます。","s":278.568,"e":283.158,"p":false,"h":false},{"t":"ヒゼキヤ王を指すという読み方、神ご自身を指すという読み方、メシアを指すという読み方があります。","s":283.428,"e":290.194,"p":false,"h":false},{"t":"22節で「主は私たちの王」と語られることから、主ご自身を指すと読む立場が有力です。","s":290.484,"e":297.177,"p":true,"h":false},{"t":"21~23節の、川と船の描写は、シオンが、敵の船が入ることのできない、守られた町であることを表します。","s":297.828,"e":307.083,"p":false,"h":false},{"t":"主ご自身が、さばき人、立法者、王として、民を治められます。","s":307.368,"e":312.523,"p":true,"h":false},{"t":"24節の「咎を赦される」は、この章の最後の言葉として、大きな意味を持っています。","s":313.164,"e":319.148,"p":false,"h":false},{"t":"シオンの安全と祝福の根本が、罪の赦しにあることを示します。","s":319.428,"e":324.233,"p":false,"h":false},{"t":"外側の平和は、神による赦しから来ます。","s":324.504,"e":327.64,"p":true,"h":false}], NAV = {"prev":{"href":"doc32.html","title":"イザヤ書_32章"},"next":{"href":"doc34.html","title":"イザヤ書_34章"},"list":"index.html"};

  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }

  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
