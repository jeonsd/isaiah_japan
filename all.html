を打つときのようです(24:13)。","s":60.048,"e":62.019,"p":true,"h":false},{"t":"そのわずかな者たちは、声を上げて喜び歌います。","s":62.676,"e":66.342,"p":false,"h":false},{"t":"彼らは、主の威光のゆえに、海から叫びます。","s":66.6,"e":70.014,"p":false,"h":false},{"t":"東で主をあがめ、海の島々で、イスラエルの神、主の名をあがめます(24:14-16前半)。","s":70.308,"e":76.283,"p":false,"h":false},{"t":"しかし、預言者は「ああ、私はやせ衰える。","s":76.572,"e":79.979,"p":false,"h":false},{"t":"災いだ」と言います。","s":80.28,"e":81.712,"p":false,"h":false},{"t":"裏切る者たちは裏切り続けているからです(24:16後半)。","s":82.188,"e":85.762,"p":true,"h":false},{"t":"地の住民に、恐れと落とし穴と罠が臨みます。","s":86.4,"e":89.746,"p":false,"h":false},{"t":"天の窓が開かれ、地の基が揺れ動きます。","s":90.036,"e":93.094,"p":false,"h":false},{"t":"地は砕かれ、よろめき、酔っ払いのようにふらつき、小屋のように揺れ動きます。","s":93.384,"e":98.713,"p":false,"h":false},{"t":"その罪の重みが、地の上にのしかかり、地は倒れて、もう起き上がれません(24:17-20)。","s":99,"e":104.454,"p":true,"h":false},{"t":"その日、主は、天では天の軍勢を、地では地の王たちを、罰されます。","s":105.12,"e":110.463,"p":false,"h":false},{"t":"彼らは、囚人が穴に集められるように集められ、牢に閉じ込められ、多くの日の後に罰せられます(24:21-22)。","s":110.772,"e":117.866,"p":false,"h":false},{"t":"月は恥じ、太陽は面目を失います。","s":118.152,"e":121.164,"p":false,"h":false},{"t":"万軍の主が、シオンの山とエルサレムで王となられ、長老たちの前に栄光を現されるからです(24:23)。","s":121.464,"e":128.293,"p":true,"h":false},{"t":"各節の解説","s":128.952,"e":130.234,"p":true,"h":false},{"t":"1節の「地」という言葉は、ヘブライ語で、「大地」とも「国土」とも読めます。","s":130.896,"e":135.976,"p":false,"h":false},{"t":"そのため、全世界のさばきを語っているのか、イスラエルの地のさばきなのかが、読み方が分かれます。","s":136.26,"e":143.118,"p":false,"h":false},{"t":"ここでは、13~23章の諸国民への宣告の後に置かれた、世界規模のさばきの預言として読むのが、一般的です。","s":143.424,"e":152.225,"p":true,"h":false},{"t":"5節の「永遠の契約」が何を指すかは、解釈が分かれます。","s":152.856,"e":157.144,"p":false,"h":false},{"t":"ノアの契約と結びつけて、全人類に対する神との約束と読む立場があります。","s":157.428,"e":163.233,"p":false,"h":false},{"t":"モーセの律法を指すと読む立場もあります。","s":163.512,"e":166.179,"p":false,"h":false},{"t":"どちらにしても、人が神との約束を破ったことが、さばきの理由になっています。","s":166.464,"e":172.052,"p":true,"h":false},{"t":"6節の「地が食い尽くされる」は、人の罪が、人だけでなく、人が住む世界全体に影響を及ぼすことを表しています。","s":172.692,"e":181.219,"p":false,"h":false},{"t":"罪の結果は、個人にとどまりません。","s":181.512,"e":184.15,"p":true,"h":false},{"t":"13~16節のわずかな者たちの歌は、さばきの中に、主をほめたたえる声が残ることを示しています。","s":184.788,"e":192.45,"p":false,"h":false},{"t":"さばきの暗さの中にも、神の栄光を見る人々がいます。","s":192.744,"e":196.773,"p":false,"h":false},{"t":"ただし、16節後半で、預言者は、まだ続く裏切りを見て嘆きます。","s":197.064,"e":202.577,"p":false,"h":false},{"t":"望みと現実の間にある緊張が、ここに表れています。","s":202.86,"e":207.035,"p":true,"h":false},{"t":"21~22節の「天の軍勢」を罰するという言葉は、解釈が難しいところです。","s":207.684,"e":214.036,"p":false,"h":false},{"t":"地上の王たちと並べて語られているので、神に逆らう霊的な力を指すとする読み方があります。","s":214.344,"e":220.896,"p":false,"h":false},{"t":"天体を指すとする読み方もあります。","s":221.184,"e":223.527,"p":false,"h":false},{"t":"はっきり決められない箇所ですので、分かれる読み方があるとだけ、お伝えするのが安全です。","s":223.812,"e":229.718,"p":true,"h":false},{"t":"23節で、「月は恥じ、太陽は面目を失う」とあるのは、主の栄光の前では、天体の光さえかすむ、という意味です。","s":230.364,"e":239.201,"p":false,"h":false},{"t":"主ご自身が王となられるという結びは、この黙示録の中心の主題です。","s":239.508,"e":244.693,"p":false,"h":false},{"t":"黙示録21章の、太陽も月も必要としない新しいエルサレムの姿とのつながりが、しばしば指摘されます。","s":244.98,"e":253.022,"p":true,"h":false}]},{"title":"イザヤ書_25章","audio":"doc25_2610231055.mp3","dur":261.1,"segs":[{"t":"イザヤ書25章","s":0,"e":1.479,"p":true,"h":false},{"t":"全体の流れ","s":2.124,"e":3.229,"p":true,"h":false},{"t":"25章は、24章の暗いさばきの後に、賛美の歌が来ます。","s":4.032,"e":9.07,"p":false,"h":false},{"t":"「主よ、あなたは私の神。","s":9.36,"e":11.164,"p":false,"h":false},{"t":"私はあなたをあがめ、御名に感謝します。","s":11.448,"e":14.516,"p":false,"h":false},{"t":"あなたは、遠い昔から計画された奇しいことを、まことに、真実をもって成し遂げられた」(25:1)。","s":14.796,"e":21.091,"p":false,"h":false},{"t":"主は、町を石の山とし、強い都を廃墟とされました。","s":21.384,"e":25.867,"p":false,"h":false},{"t":"外国人の宮殿は、もはや町ではなく、決して建て直されません(25:2)。","s":26.172,"e":30.993,"p":false,"h":false},{"t":"それゆえ、強い民は主をあがめ、横暴な国々の町は主を恐れます(25:3)。","s":31.284,"e":36.485,"p":true,"h":false},{"t":"主は、弱い者の砦、貧しい者の苦しみの時の砦、嵐からの避け所、暑さを避ける陰となられます。","s":37.116,"e":44.971,"p":false,"h":false},{"t":"横暴な者の息は、壁に打ちつける嵐のようです。","s":45.252,"e":48.852,"p":false,"h":false},{"t":"しかし、主は、乾いた土地の暑さを、雲の陰が和らげるように、外国人の騒ぎを静め、横暴な者たちの歌を抑えられます(25:4-5)。","s":49.14,"e":58.609,"p":true,"h":false},{"t":"そして、25章の中心となる約束が来ます。","s":59.256,"e":62.774,"p":false,"h":false},{"t":"万軍の主は、この山の上で、すべての民のために、脂肪に富む食べ物の宴と、熟成した酒の宴を催されます。","s":63.072,"e":71.766,"p":false,"h":false},{"t":"主は、この山の上で、すべての民を包んでいる顔おおい、すべての国々を覆っている覆いを、取り除かれます(25:6-7)。","s":72.036,"e":79.778,"p":false,"h":false},{"t":"主は、死を永遠に呑み込み、神である主は、すべての顔から涙をぬぐい、ご自分の民のそしりを、全地から取り除かれます。","s":80.064,"e":89.458,"p":false,"h":false},{"t":"主が、そう語られたのです(25:8)。","s":89.748,"e":91.683,"p":true,"h":false},{"t":"その日、人々は言います。","s":92.34,"e":94.292,"p":false,"h":false},{"t":"「見よ、この方こそ私たちの神。","s":94.572,"e":97.08,"p":false,"h":false},{"t":"私たちはこの方を待ち望んだ。","s":97.344,"e":99.452,"p":false,"h":false},{"t":"この方が私たちを救ってくださる。","s":99.756,"e":101.955,"p":false,"h":false},{"t":"この方こそ、主。","s":102.24,"e":103.621,"p":false,"h":false},{"t":"私たちはこの方を待ち望んだ。","s":104.148,"e":106.256,"p":false,"h":false},{"t":"その救いを楽しみ喜ぼう」(25:9)。","s":106.56,"e":108.46,"p":false,"h":false},{"t":"主の手がこの山にとどまるからです。","s":108.756,"e":111.063,"p":false,"h":false},{"t":"一方、モアブは、わらが肥だめの中で踏みつけられるように、踏みにじられます(25:10-12)。","s":111.384,"e":116.611,"p":true,"h":false},{"t":"各節の解説","s":117.252,"e":118.534,"p":true,"h":false},{"t":"1節の「奇しいこと」は、人の考えを超える神のわざを指します。","s":119.196,"e":123.626,"p":false,"h":false},{"t":"神が遠い昔から計画されたことが、今、成し遂げられた、というこの言葉は、神の主権と、約束の確かさを賛美するものです。","s":123.912,"e":133.531,"p":true,"h":false},{"t":"2節の「町」が、特定の都市を指すのか、神に逆らう世界の力の象徴なのかは、読み方が分かれます。","s":134.172,"e":141.854,"p":false,"h":false},{"t":"24章の流れから、象徴的に読む立場が有力です。","s":142.128,"e":146.474,"p":true,"h":false},{"t":"4~5節の、主が弱い者の砦、暑さを避ける陰となられるという描写は、さばきの宣告の中でも、貧しい人や苦しむ人に対する神の守りの意志が、変わらないことを示します。","s":147.132,"e":160.526,"p":true,"h":false},{"t":"6節の宴の約束は、この山、つまりシオンの山で行われる、すべての民のための食事です。","s":161.172,"e":168.205,"p":false,"h":false},{"t":"イスラエルだけでなく、すべての民が招かれている点が、大切です。","s":168.516,"e":173.197,"p":false,"h":false},{"t":"神の国の喜びが、食卓の豊かさとして描かれています。","s":173.484,"e":177.691,"p":false,"h":false},{"t":"新約聖書の、神の国の宴の描写とのつながりが、しばしば語られます。","s":177.984,"e":183.364,"p":true,"h":false},{"t":"7節の「顔おおい」は、諸国民が神を知らないことを覆う、無知と死の覆いを指すと読まれます。","s":183.996,"e":190.364,"p":false,"h":false},{"t":"主は、その覆いを取り除いて、すべての人が神を知るようにされます。","s":190.656,"e":195.533,"p":true,"h":false},{"t":"8節の「死を永遠に呑み込む」は、この章の頂点です。","s":196.164,"e":200.143,"p":false,"h":false},{"t":"死の力そのものが、神によって滅ぼされるという、旧約の中でも特に力強い約束です。","s":200.412,"e":207.144,"p":false,"h":false},{"t":"新約聖書では、パウロが復活について語るときに、この言葉を引いています。","s":207.432,"e":212.887,"p":false,"h":false},{"t":"黙示録も、この約束が完成する時を、神が涙をぬぐわれる姿で描いています。","s":213.192,"e":219.522,"p":false,"h":false},{"t":"ここで語られている望みが、キリストの復活によって保証されている、というのが、改革派の読み方です。","s":219.816,"e":226.999,"p":true,"h":false},{"t":"9節の、「待ち望んだ」という言葉の繰り返しは、救いが、人の力でなく、神ご自身から来るものだと、民が告白していることを表します。","s":227.628,"e":237.959,"p":true,"h":false},{"t":"10~12節のモアブは、神に逆らう高ぶりの象徴として、再び出てきます。","s":238.608,"e":244.474,"p":false,"h":false},{"t":"喜びの宴に招かれる諸国民の中で、なぜモアブだけが、踏みにじられるのか、という疑問は残ります。","s":244.764,"e":252.017,"p":false,"h":false},{"t":"この部分は、読み方が分かれます。","s":252.288,"e":254.696,"p":false,"h":false},{"t":"高ぶりを手放さない者は、宴の席に着けない、という意味に読むのが穏当でしょう。","s":254.988,"e":260.476,"p":true,"h":false}]},{"title":"イザヤ書_26章","audio":"doc26_2610231055.mp3","dur":247.1,"segs":[{"t":"イザヤ書26章","s":0,"e":1.526,"p":true,"h":false},{"t":"全体の流れ","s":2.16,"e":3.265,"p":true,"h":false},{"t":"「その日、ユダの地でこの歌が歌われる」と、26章は始まります。","s":4.068,"e":8.924,"p":false,"h":false},{"t":"「私たちには強い町がある。","s":9.216,"e":11.143,"p":false,"h":false},{"t":"主は救いのために、城壁と堡塁を築かれる。","s":11.448,"e":14.827,"p":false,"h":false},{"t":"城門を開け。","s":15.12,"e":16.071,"p":false,"h":false},{"t":"誠実を守る正しい民が入れるように」(26:1-2)。","s":17.028,"e":19.737,"p":false,"h":false},{"t":"神に心を堅く置く者を、主は全き平安のうちに守られます。","s":20.016,"e":24.466,"p":false,"h":false},{"t":"主に信頼しているからです。","s":24.768,"e":26.549,"p":false,"h":false},{"t":"だから、とこしえに主に信頼せよ、主こそ永遠の岩だからです(26:3-4)。","s":26.856,"e":31.394,"p":false,"h":false},{"t":"主は、高い所に住む者を低くし、そびえる町を地に倒されます。","s":31.716,"e":36.721,"p":false,"h":false},{"t":"それを踏みつけるのは、悩む者の足、貧しい者の歩みです(26:5-6)。","s":37.008,"e":41.598,"p":true,"h":false},{"t":"正しい人の道は平らで、主はその道をならされます。","s":42.228,"e":46.054,"p":false,"h":false},{"t":"民は、さばきの道で主を待ち望み、御名と御名の記念に、心の願いを向けています(26:7-8)。","s":46.332,"e":52.896,"p":false,"h":false},{"t":"夜、私の魂はあなたを慕い、朝、私の内なる霊はあなたを捜し求めます。","s":53.172,"e":59.398,"p":false,"h":false},{"t":"地にさばきが行われるとき、世界の住民は義を学ぶからです(26:9)。","s":59.688,"e":64.257,"p":false,"h":false},{"t":"しかし、悪者は恵みを示されても義を学ばず、正しい地でも不正を行い、主の威光を見ようとしません(26:10)。","s":64.548,"e":72.186,"p":true,"h":false},{"t":"民は告白します。","s":72.828,"e":74.182,"p":false,"h":false},{"t":"「主よ、あなたは私たちのために平和を備えられます。","s":74.736,"e":78.278,"p":false,"h":false},{"t":"私たちのすべてのわざも、あなたがなしてくださったのです」(26:12)。","s":78.552,"e":82.26,"p":false,"h":false},{"t":"以前は、ほかの主人たちが私たちを治めていましたが、これからはあなただけを、御名を、私たちは唱えます(26:13)。","s":82.584,"e":90.313,"p":true,"h":false},{"t":"そして、この章の望みの中心が語られます。","s":90.972,"e":94.251,"p":false,"h":false},{"t":"「あなたの死者は生き返り、私の屍は起き上がります。","s":94.536,"e":98.288,"p":false,"h":false},{"t":"ちりに住む者よ、目覚めて喜び歌え」(26:19)。","s":98.568,"e":101.377,"p":false,"h":false},{"t":"民は、主の怒りが過ぎるまで、しばらく部屋に隠れているようにと促されます。","s":101.664,"e":107.139,"p":false,"h":false},{"t":"主は、地の住民の咎を罰するために、御住まいから出て来られるからです(26:20-21)。","s":107.424,"e":112.524,"p":true,"h":false},{"t":"各節の解説","s":113.148,"e":114.43,"p":true,"h":false},{"t":"1~2節の「強い町」は、人の手で築いた城壁に頼る町ではなく、主ご自身が救いを城壁とされる町です。","s":115.092,"e":123.271,"p":false,"h":false},{"t":"城門を開けるのは、誠実な民であって、強い者ではありません。","s":123.552,"e":128.329,"p":true,"h":false},{"t":"3節の「全き平安」は、ヘブライ語で「平安、平安」と、同じ言葉を重ねています。","s":128.988,"e":134.996,"p":false,"h":false},{"t":"心を神に堅く置く人に与えられる平安は、状況に左右されない、深い平安です。","s":135.288,"e":141.451,"p":false,"h":false},{"t":"信頼が先にあり、平安がそのあとに来ます。","s":141.732,"e":144.962,"p":true,"h":false},{"t":"4節の「永遠の岩」は、揺るがない神を表す言葉です。","s":145.62,"e":149.58,"p":false,"h":false},{"t":"人間の同盟や城壁に頼る民への、静かな呼びかけとして響きます。","s":149.868,"e":154.943,"p":true,"h":false},{"t":"9節の、夜も朝も主を慕うという祈りは、さばきの中でも、神を求める心が失われていないことを示しています。","s":155.592,"e":164.33,"p":false,"h":false},{"t":"さばきが、人に義を学ばせる機会となる、という見方も語られています。","s":164.592,"e":169.847,"p":true,"h":false},{"t":"10節は、恵みが示されても悪者は学ばないと言います。","s":170.496,"e":174.764,"p":false,"h":false},{"t":"恵みが人を変えるのではなく、神の働きがなければ心は変わらないことを示しており、改革派の神学が人の心の堕落を語るときの背景にもなります。","s":175.068,"e":185.793,"p":true,"h":false},{"t":"12節の「私たちのすべてのわざも、あなたがなしてくださった」は、人の働きさえ、神の恵みの内にあるという告白です。","s":186.444,"e":194.874,"p":false,"h":false},{"t":"これは、救いが人の力によらないという、改革派の中心的な理解と響き合います。","s":195.156,"e":201.331,"p":true,"h":false},{"t":"19節の「死者は生き返る」は、旧約の中でも、復活の望みがはっきり語られる箇所として知られています。","s":201.996,"e":209.554,"p":false,"h":false},{"t":"ただし、この言葉が、体の復活を直接語っているのか、イスラエルの民族的な回復を、復活の姿で描いているのかは、読み方が分かれます。","s":209.844,"e":220.414,"p":false,"h":false},{"t":"改革派の伝統は、民の回復の中に、体の復活の望みも含まれていると読んできました。","s":220.716,"e":227.309,"p":false,"h":false},{"t":"この読み方が、新約聖書の復活の福音の光のもとで、重く受け取られています。","s":227.592,"e":233.392,"p":true,"h":false},{"t":"20~21節の「部屋に隠れなさい」は、出エジプトの夜に、家にとどまった民を思い出させます。","s":234.036,"e":240.974,"p":false,"h":false},{"t":"神のさばきが過ぎ去るまで、主の守りの中にとどまる、という意味に読まれます。","s":241.272,"e":246.478,"p":true,"h":false}]},{"title":"イザヤ書_27章","audio":"doc27_2610231055.mp3","dur":224.5,"segs":[{"t":"イザヤ書27章","s":0,"e":1.576,"p":true,"h":false},{"t":"全体の流れ","s":2.232,"e":3.337,"p":true,"h":false},{"t":"27章は、「その日」という言葉で始まります。","s":4.14,"e":7.559,"p":false,"h":false},{"t":"主は、鋭く、大きく、強い剣で、逃げる蛇レビヤタン、曲がりくねる蛇レビヤタンを罰し、海にいる竜を殺されます(27:1)。","s":7.848,"e":16.867,"p":true,"h":false},{"t":"次に、ぶどう畑の歌が歌われます。","s":17.496,"e":20.269,"p":false,"h":false},{"t":"「その日、実り豊かなぶどう畑について歌え。","s":20.556,"e":23.786,"p":false,"h":false},{"t":"私、主はそれを守る者。","s":24.084,"e":26.278,"p":false,"h":false},{"t":"絶えず水を注ぎ、だれも害を加えないよう、昼も夜も守る。","s":26.568,"e":31.045,"p":false,"h":false},{"t":"私にはもう怒りはない」(27:2-4前半)。","s":31.32,"e":33.665,"p":false,"h":false},{"t":"5章では、実らないぶどう畑が荒らされましたが、ここでは、同じぶどう畑が守られます。","s":33.948,"e":40.413,"p":false,"h":false},{"t":"もしいばらとおどろが出ても、主はそれに戦いを挑み、焼き尽くされます。","s":40.716,"e":45.626,"p":false,"h":false},{"t":"ただし、民が主の砦に身を寄せて、主と和解するなら、そうはなりません(27:4後半-5)。","s":45.9,"e":52.571,"p":false,"h":false},{"t":"やがて、ヤコブは根を張り、イスラエルは芽を出し、花を咲かせ、その実は世界の面に満ちます(27:6)。","s":52.848,"e":59.836,"p":true,"h":false},{"t":"主がイスラエルを打たれたことは、イスラエルを打った者への打ち方とは違い、また、殺された者の殺され方とは違います。","s":60.48,"e":68.725,"p":false,"h":false},{"t":"主は、追放によって、これを量って争われます。","s":69.012,"e":72.615,"p":false,"h":false},{"t":"ヤコブの咎が赦されるのは、偶像の祭壇の石が砕かれ、アシェラ像が立たなくなるときです(27:7-9)。","s":72.9,"e":79.265,"p":false,"h":false},{"t":"堅固な町は荒れ果て、子牛がそこで草を食べます(27:10-11)。","s":79.56,"e":83.062,"p":true,"h":false},{"t":"結びに、主は、川の流れから、エジプトの川まで、穂を打ち落とされます。","s":83.7,"e":89.289,"p":false,"h":false},{"t":"そして、イスラエルの子らよ、あなたがたは一人ずつ集められます。","s":89.568,"e":94.005,"p":false,"h":false},{"t":"その日、大きな角笛が鳴り響き、アッシリアの地に滅びようとしていた者、エジプトの地に追いやられていた者が来て、エルサレムの聖なる山で主を礼拝します(27:12-13)。","s":94.284,"e":105.001,"p":true,"h":false},{"t":"各節の解説","s":105.624,"e":106.906,"p":true,"h":false},{"t":"1節の「レビヤタン」は、神に逆らう力の象徴として、当時の人々によく知られていた海の怪物の名前です。","s":107.568,"e":115.557,"p":false,"h":false},{"t":"この怪物が何を指すのかは、読み方が分かれます。","s":115.848,"e":119.454,"p":false,"h":false},{"t":"悪の霊的な力と読む立場も、当時の大国と読む立場もあります。","s":119.736,"e":124.663,"p":false,"h":false},{"t":"黙示録の竜とのつながりを指摘する人もいます。","s":124.956,"e":128.131,"p":false,"h":false},{"t":"どちらにしても、神がすべての悪の力を、最後には滅ぼされるという約束です。","s":128.412,"e":134.025,"p":true,"h":false},{"t":"2~6節のぶどう畑の歌は、5章の歌と対になっています。","s":134.676,"e":139.219,"p":false,"h":false},{"t":"5章では、神は期待して待ったのに、野ぶどうしか実りませんでした。","s":139.5,"e":144.112,"p":false,"h":false},{"t":"ここでは、同じ神が、畑を守り、豊かな実りを与えると語られます。","s":144.396,"e":149.887,"p":false,"h":false},{"t":"「私にはもう怒りはない」という言葉は、さばきを経た民が、再び恵みの中に置かれることを表します。","s":150.192,"e":157.472,"p":true,"h":false},{"t":"4節の「いばらとおどろ」は、5章6節の荒れ果てたぶどう畑の姿を思い出させます。","s":158.112,"e":163.97,"p":false,"h":false},{"t":"しかし、ここでは、主が戦って、それらを取り除かれます。","s":164.268,"e":168.669,"p":false,"h":false},{"t":"民を守るのは、主のわざです。","s":168.948,"e":171.215,"p":true,"h":false},{"t":"7~9節は、解釈が難しいところです。","s":171.864,"e":175.358,"p":false,"h":false},{"t":"主の打ち方が、他の国の打ち方と違う、という意味が中心です。","s":175.644,"e":180.375,"p":false,"h":false},{"t":"神がイスラエルを懲らしめられるのは、滅ぼすためではなく、偶像を取り除き、咎を赦すためです。","s":180.684,"e":187.413,"p":false,"h":false},{"t":"9節の、「これによってヤコブの咎が赦される」という言葉は、懲らしめが清めのための手段であることを示しています。","s":187.704,"e":195.723,"p":true,"h":false},{"t":"12~13節の「一人ずつ集められる」は、集められる民が、一人ひとり、主に覚えられていることを示しています。","s":196.344,"e":204.774,"p":false,"h":false},{"t":"アッシリアとエジプトに散らされた人々が、エルサレムで礼拝するという結びは、19章の、エジプトとアッシリアが主の民となる約束とも響き合います。","s":205.056,"e":215.506,"p":false,"h":false},{"t":"この「大きな角笛」は、新約聖書で、終わりの時に神の民が集められる場面にも通じると、しばしば指摘されます。","s":215.784,"e":223.915,"p":true,"h":false}]},{"title":"イザヤ書_28章","audio":"doc28_2610231055.mp3","dur":297.5,"segs":[{"t":"イザヤ書28章","s":0,"e":1.551,"p":true,"h":false},{"t":"全体の流れ","s":2.196,"e":3.301,"p":true,"h":false},{"t":"28章から、「災いだ」で始まる一連の宣告が続きます。","s":4.104,"e":8.554,"p":false,"h":false},{"t":"最初に、エフライムの酔いどれたちの高ぶりの冠、つまりサマリアに対して語られます。","s":8.856,"e":14.565,"p":false,"h":false},{"t":"それは、肥えた谷の頭にある、しおれかけた花です。","s":14.868,"e":18.745,"p":false,"h":false},{"t":"主は、強い方を遣わされます。","s":19.044,"e":21.448,"p":false,"h":false},{"t":"それは、雹の嵐、破壊の暴風のようで、冠は足で踏みにじられます(28:1-4)。","s":21.744,"e":27.032,"p":false,"h":false},{"t":"しかし、その日、万軍の主は、ご自分の民の残りの者にとって、美しい冠、麗しい花輪となられます(28:5-6)。","s":27.324,"e":35.73,"p":true,"h":false},{"t":"ところが、ユダの祭司も預言者も、酒によろめき、幻の中で迷い、さばきを下す際につまずきます。","s":36.36,"e":44.039,"p":false,"h":false},{"t":"食卓は吐いたもので満ち、きれいな所はありません(28:7-8)。","s":44.316,"e":47.767,"p":false,"h":false},{"t":"彼らはイザヤをあざけって言います。","s":48.06,"e":50.127,"p":false,"h":false},{"t":"「だれに知識を教えようというのか。","s":50.436,"e":52.611,"p":false,"h":false},{"t":"乳離れしたばかりの子か。","s":52.884,"e":54.564,"p":false,"h":false},{"t":"教訓に教訓、教訓に教訓、規則に規則、規則に規則、ここに少し、あそこに少し」(28:9-10)。","s":54.864,"e":62.241,"p":false,"h":false},{"t":"主は、異国人の舌で、この民に語られます。","s":62.532,"e":65.958,"p":false,"h":false},{"t":"主は「ここに安息がある。","s":66.24,"e":68.058,"p":false,"h":false},{"t":"疲れた者に安息を与えよ」と言われましたが、彼らは聞こうとしませんでした(28:11-12)。","s":68.328,"e":73.347,"p":false,"h":false},{"t":"そのため、主のことばは、彼らにとって、まさに「教訓に教訓、規則に規則」となります。","s":73.62,"e":80.301,"p":false,"h":false},{"t":"彼らは、後ろに倒れ、砕かれ、わなにかかり、捕らえられます(28:13)。","s":80.568,"e":85.203,"p":true,"h":false},{"t":"エルサレムの支配者たちは言います。","s":85.86,"e":88.018,"p":false,"h":false},{"t":"「私たちは死と契約を結び、よみと協定を結んだ。","s":88.308,"e":92.269,"p":false,"h":false},{"t":"あふれる災いが過ぎるときも、私たちには届かない。","s":92.556,"e":96.173,"p":false,"h":false},{"t":"偽りを避け所とし、欺きの陰に身を隠したからだ」(28:14-15)。","s":96.444,"e":100.582,"p":false,"h":false},{"t":"しかし、主は言われます。","s":100.872,"e":102.63,"p":false,"h":false},{"t":"「見よ、わたしはシオンに一つの石を据える。","s":102.924,"e":105.837,"p":false,"h":false},{"t":"試みを経た石、堅く据えられた尊い隅の石。","s":106.128,"e":109.79,"p":false,"h":false},{"t":"これに信頼する者は、あわてることがない」(28:16)。","s":110.088,"e":113.058,"p":false,"h":false},{"t":"主は、公正を測りなわとし、義をおもりとされます。","s":113.328,"e":117.304,"p":false,"h":false},{"t":"偽りの避け所は雹で流され、死との契約は破られます(28:17-18)。","s":117.576,"e":121.864,"p":true,"h":false},{"t":"最後に、農夫の例えが語られます。","s":122.508,"e":125.088,"p":false,"h":false},{"t":"農夫は、一日中、畑を耕すのではありません。","s":125.388,"e":129.226,"p":false,"h":false},{"t":"種を蒔く時に蒔き、小麦、大麦、スペルト麦をそれぞれ植えます。","s":129.528,"e":134.533,"p":false,"h":false},{"t":"脱穀も、種類によって、道具を使い分けます(28:23-28)。","s":134.82,"e":138.209,"p":false,"h":false},{"t":"これらの知恵も、万軍の主から来ます。","s":138.492,"e":141.161,"p":false,"h":false},{"t":"主の計画は、不思議で、その知恵は偉大です(28:29)。","s":141.444,"e":144.85,"p":true,"h":false},{"t":"各節の解説","s":145.512,"e":146.794,"p":true,"h":false},{"t":"1~4節の「高ぶりの冠」は、サマリアが、丘の上に建てられた美しい町であることをとらえています。","s":147.456,"e":154.736,"p":false,"h":false},{"t":"その見た目は華やかですが、酔いどれの冠のように、やがてしおれます。","s":155.016,"e":159.768,"p":false,"h":false},{"t":"北王国の滅びが、すぐ先に迫っていることを語っています。","s":160.056,"e":164.257,"p":true,"h":false},{"t":"5~6節の、主ご自身が残りの者の「冠」となられるという言葉は、外側の飾りに頼る者と、主ご自身を誇りとする者を対比します。","s":164.88,"e":174.623,"p":true,"h":false},{"t":"9~10節の「教訓に教訓」は、イザヤの言葉をまねて、からかっている人々の声です。","s":175.248,"e":181.629,"p":false,"h":false},{"t":"ヘブライ語では、短い音の繰り返しで、幼児に言い聞かせるような響きがあります。","s":181.908,"e":187.6,"p":false,"h":false},{"t":"13節で、主はその同じ言葉を、さばきの宣告として、彼らに返されます。","s":187.884,"e":193.681,"p":true,"h":false},{"t":"11~12節の「異国人の舌」は、のちにアッシリアの外国語が、エルサレムの町で聞かれるようになることを指す、と読まれます。","s":194.328,"e":203.285,"p":false,"h":false},{"t":"新約聖書で、パウロが異言について語る際に、この箇所を引いています。","s":203.58,"e":208.66,"p":false,"h":false},{"t":"ただし、その用い方については、さまざまな読み方があります。","s":208.944,"e":213.411,"p":true,"h":false},{"t":"15節の「死と契約を結び」は、人々が、アッシリアの脅威から逃れるために、外国との同盟や、偽りに頼ったことを、皮肉を込めて語る言葉です。","s":214.056,"e":225.221,"p":false,"h":false},{"t":"本当に死と契約を結んだのではなく、それほどの危ういものに頼っている、という意味です。","s":225.504,"e":231.583,"p":true,"h":false},{"t":"16節の「隅の石」は、新約聖書で、キリストについて繰り返し引かれる、大切な言葉です。","s":232.236,"e":239.14,"p":false,"h":false},{"t":"主は、シオンに、堅く据えられた石を置かれます。","s":239.436,"e":242.897,"p":false,"h":false},{"t":"この石に信頼する者は、あわてません。","s":243.18,"e":245.936,"p":false,"h":false},{"t":"改革派の伝統は、この石を、メシアであるイエス・キリストと理解してきました。","s":246.24,"e":251.546,"p":false,"h":false},{"t":"8章14節の「つまずきの石」と合わせて読むと、同じ石が、信じる者には土台となり、信じない者にはつまずきとなることがわかります。","s":251.82,"e":261.12,"p":true,"h":false},{"t":"17~18節の測りなわとおもりは、建物の傾きを測る道具です。","s":261.756,"e":267.145,"p":false,"h":false},{"t":"人が頼った偽りの避け所が、神の基準の前で、傾いていることが明らかになります。","s":267.444,"e":273.759,"p":true,"h":false},{"t":"23~29節の農夫の例えは、一見、さばきの話から離れているように見えます。","s":274.392,"e":280.89,"p":false,"h":false},{"t":"しかし、農夫が、時と方法をわきまえて働くように、主も、それぞれの民に対して、さばきと恵みの方法を、知恵をもって定めておられる、という意味に読まれます。","s":281.16,"e":292.522,"p":false,"h":false},{"t":"さばきは、無秩序なものではなく、目的を持っています。","s":292.824,"e":296.829,"p":true,"h":false}]},{"title":"イザヤ書_29章","audio":"doc29_2610231055.mp3","dur":323.4,"segs":[{"t":"イザヤ書29章","s":0,"e":1.623,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"29章は、「災いだ、アリエルよ」で始まります。","s":4.176,"e":7.868,"p":false,"h":false},{"t":"アリエルは、ダビデが陣を敷いた町、つまりエルサレムの呼び名です。","s":8.136,"e":12.775,"p":false,"h":false},{"t":"年に年を加え、祭りを巡らせても、主はアリエルを苦しめられます。","s":13.068,"e":17.999,"p":false,"h":false},{"t":"町はうめき、嘆き、主にとってアリエルのようになります(29:1-2)。","s":18.288,"e":22.212,"p":false,"h":false},{"t":"主は、ダビデのように、町の周りに陣を敷き、塁を築いて攻められます。","s":22.5,"e":27.854,"p":false,"h":false},{"t":"町は、地の下から、ちりの中から、ささやくような声で語ります(29:3-4)。","s":28.152,"e":33.077,"p":true,"h":false},{"t":"しかし、突然、さばきの調子が変わります。","s":33.732,"e":37.05,"p":false,"h":false},{"t":"エルサレムを襲う大勢の敵は、細かいちりのようになり、一瞬のうちに消えます。","s":37.332,"e":42.908,"p":false,"h":false},{"t":"万軍の主が、雷と地震と大きな音、嵐とつむじ風と焼き尽くす炎の火で、訪れられます(29:5-6)。","s":43.2,"e":50.23,"p":false,"h":false},{"t":"それは、夢のように、夜の幻のようにはかなく、飢えた人が夢の中で食べ、目覚めると空腹のままであるように、渇いた人が夢の中で飲み、目覚めると渇いているように、シオンの山と戦うすべての国々は、そのようになります(29:7-8)。","s":50.508,"e":67.068,"p":true,"h":false},{"t":"けれども、民自身は、驚き、目をふさぎ、盲目になります。","s":67.752,"e":72.382,"p":false,"h":false},{"t":"酔っているが、ぶどう酒によらず、よろめくが、強い酒によらない、と言われます。","s":72.684,"e":78.415,"p":false,"h":false},{"t":"主が、深い眠りの霊を彼らに注ぎ、目を閉ざされたからです(29:9-10)。","s":78.696,"e":83.227,"p":false,"h":false},{"t":"幻は、封じられた書物のようになります。","s":83.52,"e":86.699,"p":false,"h":false},{"t":"読める者に渡しても、「封じられているので読めません」と言い、読めない者に渡しても、「読むことができません」と言います(29:11-12)。","s":86.976,"e":94.682,"p":true,"h":false},{"t":"主は、その理由を言われます。","s":95.328,"e":97.428,"p":false,"h":false},{"t":"「この民は、口先ではわたしに近づき、くちびるでわたしを敬うが、心はわたしから遠く離れている。","s":97.704,"e":104.976,"p":false,"h":false},{"t":"わたしを恐れるのは、人間の戒めを教えられてのことだ」(29:13)。","s":105.264,"e":109.285,"p":false,"h":false},{"t":"だから、主は、この民に不思議なわざを重ねて行い、知恵ある者の知恵を滅ぼされます(29:14)。","s":109.584,"e":116.007,"p":false,"h":false},{"t":"災いだ、主から計画を深く隠そうとする者、暗闇でわざを行い、「だれがわたしたちを見ているのか」と言う者。","s":116.316,"e":124.528,"p":false,"h":false},{"t":"あなたがたは、ものごとを逆さまにしています。","s":124.812,"e":127.842,"p":false,"h":false},{"t":"陶器師が粘土のように見なされてよいでしょうか(29:15-16)。","s":128.124,"e":130.926,"p":true,"h":false},{"t":"最後に、望みが語られます。","s":131.58,"e":133.664,"p":false,"h":false},{"t":"もう少しすれば、レバノンは果樹園となり、果樹園は森と見なされます。","s":133.956,"e":138.846,"p":false,"h":false},{"t":"その日、耳の聞こえない者が書物の言葉を聞き、盲人の目は、暗闇の中から見えるようになります。","s":139.14,"e":146.416,"p":false,"h":false},{"t":"貧しい者は主にあって喜びを増し、人の中の貧しい者は、イスラエルの聖なる方にあって、歓喜します(29:17-19)。","s":146.7,"e":154.205,"p":false,"h":false},{"t":"横暴な者はいなくなり、あざける者は消え、悪を行おうと目を光らせる者は、断たれます(29:20-21)。","s":154.512,"e":160.935,"p":false,"h":false},{"t":"ヤコブの家は、もう恥じることなく、その子らが、主の御名を聖とするのを見て、ヤコブの聖なる方を聖とし、イスラエルの神を恐れます(29:22-23)。","s":161.244,"e":171.143,"p":false,"h":false},{"t":"心の迷っていた者は悟りを得、つぶやいていた者は教えを学びます(29:24)。","s":171.432,"e":176.187,"p":true,"h":false},{"t":"各節の解説","s":176.832,"e":178.114,"p":true,"h":false},{"t":"1節の「アリエル」は、「神のかまど」、または「神の獅子」と理解されます。","s":178.776,"e":183.658,"p":false,"h":false},{"t":"祭壇の火の炉を意味するという読み方があり、エルサレムが、さばきの火に焼かれるという意味を重ねている、と読む立場があります。","s":183.924,"e":192.186,"p":false,"h":false},{"t":"意味ははっきり決まっていません。","s":192.492,"e":194.36,"p":true,"h":false},{"t":"5~8節の、敵が突然消える描写は、エルサレムが、最後に主ご自身によって守られることを語っています。","s":195.012,"e":202.926,"p":false,"h":false},{"t":"この出来事が、ヒゼキヤの時代にアッシリア軍が退いた出来事を指すのか、さらに後のことまで含むのかは、読み方が分かれます。","s":203.184,"e":212.126,"p":true,"h":false},{"t":"9~10節の「眠りの霊」は、神が民の目を閉ざされるという、重い言葉です。","s":212.76,"e":218.41,"p":false,"h":false},{"t":"10章の「ゆがんだ霊」と同じく、さばきの一部として、人が神のことばを理解できなくなるという面があります。","s":218.7,"e":226.078,"p":false,"h":false},{"t":"ただし、これも、民が自分で目を閉じたことへの、神の応答として読むのが、改革派の理解に近いでしょう。","s":226.368,"e":234.103,"p":true,"h":false},{"t":"11~12節の封じられた書物の比喩は、神のことばが、そこにありながら、人の心が閉ざされているために、理解されないことを表しています。","s":234.756,"e":245.186,"p":true,"h":false},{"t":"13節は、新約聖書で、イエスが、パリサイ人の形だけの信仰を批判する際に引かれた言葉です。","s":245.808,"e":253.169,"p":false,"h":false},{"t":"口と唇で神を敬いながら、心は遠く離れているという姿は、1章の、形だけの礼拝への批判と、つながっています。","s":253.476,"e":262.683,"p":false,"h":false},{"t":"人の戒めを教えとすることが、礼拝を空しくします。","s":262.98,"e":266.937,"p":true,"h":false},{"t":"14節の「不思議なわざ」は、人の知恵では測れない、神のさばきと恵みを指します。","s":267.552,"e":273.518,"p":false,"h":false},{"t":"パウロは、十字架の言葉が、この世の知恵を打ち砕くという話の中で、この節を引いています。","s":273.816,"e":280.583,"p":true,"h":false},{"t":"16節の陶器師と粘土の例えは、創造主と被造物の関係を表します。","s":281.232,"e":286.838,"p":false,"h":false},{"t":"神は、造られた者に問い返される方ではなく、造られた者が神に問う前に、神の主権を認めるべきです。","s":287.136,"e":294.717,"p":false,"h":false},{"t":"この比喩は、新約聖書のローマ人への手紙でも、神の主権を語る際に用いられています。","s":295.02,"e":301.424,"p":true,"h":false},{"t":"17~24節の結びは、さばきを経たのちの回復の姿です。","s":302.076,"e":307.227,"p":false,"h":false},{"t":"盲人の目が開かれ、耳の聞こえない人が聞くようになることは、のちにイエスの働きのしるしとしても思い起こされます。","s":307.512,"e":315.419,"p":false,"h":false},{"t":"ここでの回復は、体の癒やしだけでなく、神のことばを悟る心の回復を、中心としています。","s":315.72,"e":322.769,"p":true,"h":false}]},{"title":"イザヤ書_30章","audio":"doc30_2610231055.mp3","dur":388.7,"segs":[{"t":"イザヤ書30章","s":0,"e":1.426,"p":true,"h":false},{"t":"全体の流れ","s":2.088,"e":3.193,"p":true,"h":false},{"t":"30章は、「災いだ、反逆の子らは」と始まります。","s":3.996,"e":8.207,"p":false,"h":false},{"t":"主は言われます。","s":8.496,"e":9.535,"p":false,"h":false},{"t":"彼らは、計画を立てるが、わたしによらず、同盟を結ぶが、わたしの霊によらない。","s":10.404,"e":16.628,"p":false,"h":false},{"t":"そうして、罪に罪を重ねている(30:1)。","s":16.92,"e":19.411,"p":false,"h":false},{"t":"彼らは、わたしの口に尋ねることなく、エジプトに下って行き、ファラオの保護を求め、エジプトの陰に避け所を求める(30:2)。","s":19.692,"e":28.034,"p":false,"h":false},{"t":"そのため、ファラオの保護は恥となり、エジプトの陰は屈辱となります(30:3)。","s":28.332,"e":33.139,"p":false,"h":false},{"t":"ネゲブの獣たちの重荷、すなわち、荷を積んだろばやらくだの隊商は、苦難と悩みの地を通ってエジプトへ向かいますが、その助けは空しいものです。","s":33.444,"e":43.937,"p":false,"h":false},{"t":"だから、主は、エジプトを「何もしない、おとなしくしているラハブ」と呼ばれます(30:4-7)。","s":44.208,"e":49.703,"p":true,"h":false},{"t":"主は、イザヤに、これを板に書き、書物に記して、後の日の永遠の証拠とするよう命じられます。","s":50.328,"e":57.322,"p":false,"h":false},{"t":"彼らは、反逆の民、偽りの子ら、主の教えを聞こうとしない子らだからです。","s":57.6,"e":63.326,"p":false,"h":false},{"t":"彼らは、先見者に「見るな」、預言者に「正しいことを私たちに預言するな。","s":63.612,"e":69.037,"p":false,"h":false},{"t":"耳に心地よいことを語れ。","s":69.336,"e":71.15,"p":false,"h":false},{"t":"まぼろしを預言せよ。","s":71.424,"e":72.87,"p":false,"h":false},{"t":"道から離れ、小道を外れ、イスラエルの聖なる方を、私たちの前から消せ」と言います(30:8-11)。","s":73.332,"e":79.605,"p":true,"h":false},{"t":"だから、イスラエルの聖なる方は、こう言われます。","s":80.244,"e":83.646,"p":false,"h":false},{"t":"「あなたがたは、このことばを退け、しいたげとゆがんだ道に頼り、それに寄りかかった。","s":83.952,"e":90.092,"p":false,"h":false},{"t":"だから、この咎は、あなたがたにとって、崩れ落ちる高い城壁のひび割れのようになる。","s":90.396,"e":96.458,"p":false,"h":false},{"t":"それは、突然、一瞬のうちに崩れ落ちる」(30:12-14)。","s":96.732,"e":100.028,"p":true,"h":false},{"t":"ところが、主は、続けて言われます。","s":100.656,"e":103.274,"p":false,"h":false},{"t":"「立ち返って静かにしていれば、あなたがたは救われ、落ち着いて信頼すれば、あなたがたは力を得る。","s":103.572,"e":110.457,"p":false,"h":false},{"t":"それなのに、あなたがたは、そうしようとはしなかった」(30:15)。","s":110.736,"e":114.33,"p":false,"h":false},{"t":"彼らは、馬に乗って逃げようと言いますが、追う者はもっと速くなります。","s":114.624,"e":119.542,"p":false,"h":false},{"t":"千人が一人の脅しで逃げ、五人の脅しで逃げ去ります(30:16-17)。","s":119.844,"e":123.674,"p":true,"h":false},{"t":"それでも、主は、あなたがたに恵みを与えようと待っておられ、あわれみを与えようと立ち上がられます。","s":124.308,"e":131.146,"p":false,"h":false},{"t":"主は公正の神だからです。","s":131.436,"e":133.342,"p":false,"h":false},{"t":"主を待ち望むすべての人は、幸いです(30:18)。","s":133.668,"e":136.581,"p":false,"h":false},{"t":"シオンに住む民よ、あなたはもう泣くことはありません。","s":136.872,"e":140.089,"p":false,"h":false},{"t":"主は、あなたの叫び声に応えて、必ず恵みを与えられます。","s":140.4,"e":145.087,"p":false,"h":false},{"t":"主はあなたに悩みのパンと苦しみの水を与えられますが、あなたの教師は、もう隠れることなく、あなたの目は教師を見ます。","s":145.368,"e":154.002,"p":false,"h":false},{"t":"右に行くにも、左に行くにも、「これが道だ。","s":154.296,"e":157.607,"p":false,"h":false},{"t":"これに歩め」と言う声が、後ろから聞こえます(30:19-21)。","s":157.896,"e":161.025,"p":true,"h":false},{"t":"偶像は汚れた物として投げ捨てられ、主が土に蒔く種に雨を与え、地の産物は豊かで、肥えたものになります。","s":161.676,"e":169.658,"p":false,"h":false},{"t":"月の光は太陽の光のようになり、太陽の光は七倍になります。","s":169.956,"e":174.874,"p":false,"h":false},{"t":"主が、ご自分の民の傷を包み、打たれた傷を癒やされる日です(30:22-26)。","s":175.176,"e":179.875,"p":true,"h":false},{"t":"見よ、主の御名は遠くから来られます。","s":180.504,"e":183.172,"p":false,"h":false},{"t":"その怒りは燃え、立ち上る煙は重く、その唇は憤りに満ち、その舌は焼き尽くす火のようです。","s":183.456,"e":190.84,"p":false,"h":false},{"t":"その息は、首にまで達する、あふれる流れのようです。","s":191.16,"e":195.035,"p":false,"h":false},{"t":"主は諸国を破滅のふるいでふるい、民のあごに、迷わせるくつわをはめられます。","s":195.336,"e":200.838,"p":false,"h":false},{"t":"しかし、あなたがたは、聖なる祭りの夜のように歌い、主の山に笛を吹いて上る者のように、心から喜びます(30:27-29)。","s":201.132,"e":209.477,"p":false,"h":false},{"t":"アッシリアは、主の声で恐れ、打たれます。","s":209.772,"e":212.752,"p":false,"h":false},{"t":"主が杖で打たれるたびに、タンバリンと立琴が鳴り響きます。","s":213.048,"e":217.216,"p":false,"h":false},{"t":"トフェトは、昔から備えられており、王のためにも用意されています。","s":217.512,"e":222.229,"p":false,"h":false},{"t":"主の息は、硫黄の流れのように、これを燃やします(30:30-33)。","s":222.516,"e":226.111,"p":true,"h":false},{"t":"各節の解説","s":226.764,"e":228.046,"p":true,"h":false},{"t":"1~2節の「わたしの霊によらない同盟」は、神に尋ねることなく、人間の計画に頼った、ユダの外交を指しています。","s":228.708,"e":237.274,"p":false,"h":false},{"t":"同盟そのものが罪なのではなく、神に尋ねることをせず、神を抜きにして進んだことが、問題とされています。","s":237.564,"e":245.421,"p":true,"h":false},{"t":"7節の「ラハブ」は、神話に出てくる海の怪物の名前で、ここでは、エジプトの別名として使われています。","s":246.06,"e":253.665,"p":false,"h":false},{"t":"見かけは大きいのに、何の助けにもならない国、という皮肉です。","s":253.944,"e":258.481,"p":true,"h":false},{"t":"8~11節の、民が預言者に「耳に心地よいことを語れ」と求める姿は、人が、神の真実の言葉より、慰めのことばを好む傾向を示しています。","s":259.128,"e":270.853,"p":false,"h":false},{"t":"説教者が、聞く人の願いに合わせて語ってしまう危うさとして、今日の教会にも通じる言葉です。","s":271.152,"e":278.045,"p":true,"h":false},{"t":"12~14節の、崩れ落ちる城壁の例えは、小さなひびが、やがて取り返しのつかない崩壊となることを示しています。","s":278.676,"e":287.57,"p":false,"h":false},{"t":"罪は、時間とともに積み重なり、ある時、一瞬で崩れ落ちます。","s":287.856,"e":292.933,"p":true,"h":false},{"t":"15節は、この章でいちばん有名な言葉の一つです。","s":293.58,"e":297.525,"p":false,"h":false},{"t":"「立ち返って静かにしていれば救われ、落ち着いて信頼すれば力を得る」とあります。","s":297.828,"e":303.221,"p":false,"h":false},{"t":"「立ち返る」と「静かにする」は、悔い改めと、神に任せることの両方を表します。","s":303.516,"e":309.52,"p":false,"h":false},{"t":"人が焦って動き回る時に、主は静かに待つことを求められます。","s":309.816,"e":314.431,"p":false,"h":false},{"t":"救いが、人の働きによらず、神ご自身から来るという、イザヤ書の中心の主題が、ここに凝縮されています。","s":314.712,"e":322.899,"p":true,"h":false},{"t":"18節の「主は待っておられる」という言葉は、民が主を待つだけでなく、主ご自身が民に恵みを与えるために待っておられる、という、驚くべき姿を語ります。","s":323.532,"e":334.887,"p":false,"h":false},{"t":"主の忍耐の深さを示します。","s":335.16,"e":337.26,"p":true,"h":false},{"t":"20~21節の、教師が隠れず、後ろから「これが道だ」と声が聞こえるという約束は、神のことばによる導きの回復を語っています。","s":337.896,"e":348.049,"p":false,"h":false},{"t":"8章の、「おしえとあかしに尋ねよ」と響き合います。","s":348.336,"e":351.672,"p":true,"h":false},{"t":"26節の、月が太陽のように、太陽が七倍になるという表現は、癒やしと回復の完成を、光の溢れる姿で描く、詩的な表現です。","s":352.332,"e":363.031,"p":false,"h":false},{"t":"文字どおりの天体の変化というより、神の祝福の豊かさを語ると読むのが、穏当でしょう。","s":363.312,"e":369.599,"p":true,"h":false},{"t":"33節の「トフェト」は、エルサレムの近くの谷で、かつて偶像礼拝と子どもを犠牲にする儀式が行われた場所の名前です。","s":370.26,"e":379.149,"p":false,"h":false},{"t":"ここでは、アッシリアの王のために備えられた、さばきの火の場所として語られています。","s":379.44,"e":385.129,"p":false,"h":false},{"t":"細部については、読み方が分かれます。","s":385.416,"e":388.109,"p":true,"h":false}]},{"title":"イザヤ書_31章","audio":"doc31_2610231055.mp3","dur":206.6,"segs":[{"t":"イザヤ書31章","s":0,"e":1.601,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"「災いだ、助けを求めてエジプトに下る者たちは」と、31章は始まります。","s":4.176,"e":10.053,"p":false,"h":false},{"t":"彼らは馬に頼り、戦車が多いこと、騎兵がきわめて強いことを頼みとしながら、イスラエルの聖なる方に目を向けず、主を求めません(31:1)。","s":10.332,"e":19.918,"p":false,"h":false},{"t":"けれども、主もまた知恵のある方です。","s":20.232,"e":22.782,"p":false,"h":false},{"t":"主はご自分のことばを取り消さず、悪を行う者の家と、不法を行う者を助ける者に向かって立ち上がられます(31:2)。","s":23.076,"e":30.812,"p":true,"h":false},{"t":"エジプト人は人であって神ではなく、その馬は肉であって霊ではありません。","s":31.428,"e":36.37,"p":false,"h":false},{"t":"主が御手を伸ばされると、助ける者もつまずき、助けられる者も倒れ、みな共に滅びます(31:3)。","s":36.684,"e":43.201,"p":false,"h":false},{"t":"主はイザヤに言われます。","s":43.488,"e":45.029,"p":false,"h":false},{"t":"獅子や若獅子が獲物の上でうなるとき、羊飼いたちが集まって叫んでも、その声に驚かず、騒ぎにひるまないように、万軍の主もシオンの山と丘の上で戦うために下って来られる、と(31:4)。","s":45.396,"e":58.443,"p":false,"h":false},{"t":"さらに、飛ぶ鳥が雛をかばうように、万軍の主はエルサレムをかばい、守って救い、助け出されます(31:5)。","s":58.752,"e":65.965,"p":true,"h":false},{"t":"だから、「イスラエルの子らよ、あなたがたが深く背いた方に立ち返れ」と呼びかけられます。","s":66.6,"e":72.555,"p":false,"h":false},{"t":"その日、人々は、自分の手で造った銀の偶像、金の偶像を捨てます(31:6-7)。","s":72.828,"e":78.267,"p":false,"h":false},{"t":"アッシリアは、人間のものではない剣に倒れ、神の剣が彼を食い尽くします。","s":78.552,"e":83.969,"p":false,"h":false},{"t":"若者たちは苦役に服し、その岩は恐れのために去り、その将たちは旗を見て恐れおののきます。","s":84.276,"e":91.307,"p":false,"h":false},{"t":"これは、シオンに火を持ち、エルサレムにかまどを持つ主の言葉です(31:8-9)。","s":91.62,"e":96.383,"p":true,"h":false},{"t":"各節の解説","s":97.02,"e":98.302,"p":true,"h":false},{"t":"1節の「馬」と「戦車」は、当時の最新の軍事力の象徴です。","s":98.964,"e":103.644,"p":false,"h":false},{"t":"エジプトは戦車の国として知られていました。","s":103.932,"e":106.715,"p":false,"h":false},{"t":"軍備に頼ること自体より、「イスラエルの聖なる方に目を向けない」ことが問題とされています。","s":106.992,"e":112.993,"p":false,"h":false},{"t":"30章と同じ主題が、ここでもう一度、念を押すように語られています。","s":113.292,"e":118.647,"p":true,"h":false},{"t":"2節の「主もまた知恵のある方」は、少し皮肉を含んだ言い方です。","s":119.268,"e":123.998,"p":false,"h":false},{"t":"人間の外交の知恵を頼る者たちに、神こそ知恵のある方だと告げています。","s":124.272,"e":129.635,"p":true,"h":false},{"t":"3節の「人であって神ではなく、肉であって霊ではない」は、この章の中心です。","s":130.284,"e":136.097,"p":false,"h":false},{"t":"頼る相手が人間の力にすぎないとき、その頼りは必ず崩れます。","s":136.404,"e":141.346,"p":false,"h":false},{"t":"人間の力と神の力の違いを、短く言い切っています。","s":141.624,"e":145.868,"p":true,"h":false},{"t":"4~5節には、獅子と鳥という、二つの違う比喩が出てきます。","s":146.52,"e":151.223,"p":false,"h":false},{"t":"獅子は、主が敵に対して強く戦われる姿です。","s":151.524,"e":155.276,"p":false,"h":false},{"t":"鳥は、主が民をやさしく守られる姿です。","s":155.556,"e":158.783,"p":false,"h":false},{"t":"同じ神が、敵には獅子のように、ご自分の民には親鳥のように臨まれます。","s":159.084,"e":164.602,"p":false,"h":false},{"t":"ただし、4節の獅子が、エルサレムを襲う側なのか、守る側なのかは、読み方が分かれます。","s":164.88,"e":171.782,"p":false,"h":false},{"t":"ここでは、主が民のために戦われる姿と読むのが一般的です。","s":172.08,"e":176.786,"p":true,"h":false},{"t":"6節の「深く背いた方に立ち返れ」は、さばきの宣告の中に、悔い改めへの招きが入っている箇所です。","s":177.408,"e":184.907,"p":false,"h":false},{"t":"主は、さばくためだけでなく、立ち返らせるために語っておられます。","s":185.184,"e":189.673,"p":true,"h":false},{"t":"8~9節の「人間のものではない剣」は、アッシリアが、人の力ではなく、神ご自身の働きによって倒れることを表しています。","s":190.296,"e":199.535,"p":false,"h":false},{"t":"これが、ヒゼキヤの時代にアッシリア軍が退いた出来事を指すと読むのが、一般的です。","s":199.8,"e":205.973,"p":true,"h":false}]},{"title":"イザヤ書_32章","audio":"doc32_2610231055.mp3","dur":241.8,"segs":[{"t":"イザヤ書32章","s":0,"e":1.578,"p":true,"h":false},{"t":"全体の流れ","s":2.232,"e":3.337,"p":true,"h":false},{"t":"32章は、「見よ、ひとりの王が義をもって治め、首長たちは公正をもって支配する」と始まります。","s":4.14,"e":11.516,"p":false,"h":false},{"t":"その王は、風を避ける場所、嵐を避ける隠れ家、乾いた地の水の流れ、疲れた地の大岩の陰のようです(32:1-2)。","s":11.808,"e":19.7,"p":false,"h":false},{"t":"そのとき、見る者の目はふさがれず、聞く者の耳は傾けられます。","s":19.98,"e":24.81,"p":false,"h":false},{"t":"せっかちな者の心は知識を悟り、どもる者の舌は、はっきりと語ります(32:3-4)。","s":25.092,"e":30.391,"p":false,"h":false},{"t":"愚か者は、もはや高貴な人とは呼ばれず、ずる賢い者は、もはや紳士とは言われません。","s":30.672,"e":37.19,"p":false,"h":false},{"t":"愚か者は愚かなことを語り、心は不義を行い、神を汚すことを語るからです(32:5-7)。","s":37.512,"e":43.424,"p":false,"h":false},{"t":"しかし、高貴な人は高貴なことを計り、高貴なことに立ち続けます(32:8)。","s":43.74,"e":48.668,"p":true,"h":false},{"t":"そこで、気楽に暮らす女たちに呼びかけが向けられます。","s":49.284,"e":53.027,"p":false,"h":false},{"t":"「立ち上がって、私の声を聞け。","s":53.316,"e":55.516,"p":false,"h":false},{"t":"安心している娘たちよ、私のことばに耳を傾けよ」(32:9)。","s":55.8,"e":59.961,"p":false,"h":false},{"t":"一年と数日の後、安心している女たちは震えます。","s":60.264,"e":63.934,"p":false,"h":false},{"t":"ぶどうの収穫は終わり、果実の取り入れも来ないからです。","s":64.224,"e":67.998,"p":false,"h":false},{"t":"胸を打って嘆くことになります。","s":68.292,"e":70.283,"p":false,"h":false},{"t":"私の民の土地にはいばらとおどろが生え、喜びの町々の楽しい家々も荒れ果てます(32:10-14)。","s":70.56,"e":76.453,"p":true,"h":false},{"t":"しかし、その嘆きは永遠ではありません。","s":77.076,"e":79.899,"p":false,"h":false},{"t":"「上から霊が私たちに注がれるまで」と言われます。","s":80.208,"e":83.561,"p":false,"h":false},{"t":"そのとき、荒れ野は果樹園となり、果樹園は森と見なされます。","s":83.844,"e":88.265,"p":false,"h":false},{"t":"公正は荒れ野に住み、義は果樹園にとどまります。","s":88.56,"e":91.874,"p":false,"h":false},{"t":"義の実は平和、義の働きは、とこしえの平穏と安心です。","s":92.16,"e":96.84,"p":false,"h":false},{"t":"私の民は、平和な住まいに、安全な住み家に、安らかな休み場に住みます(32:15-18)。","s":97.164,"e":102.661,"p":false,"h":false},{"t":"森が雹で倒され、町が低く倒されても、あらゆる水のほとりに種を蒔く者は、牛やろばを自由に放ちます。","s":102.924,"e":110.735,"p":false,"h":false},{"t":"それは幸いです(32:19-20)。","s":111.024,"e":112.228,"p":true,"h":false},{"t":"各節の解説","s":112.932,"e":114.214,"p":true,"h":false},{"t":"1節の「ひとりの王」は、ヒゼキヤ王を指すとも読めますが、「義をもって治める」という描写の大きさから、メシアなるキリストを指すと読むのが、改革派の伝統です。","s":114.876,"e":125.714,"p":false,"h":false},{"t":"歴史上の王の姿を土台にしながら、それを超える王への望みが語られていると読むことができます。","s":126,"e":132.639,"p":true,"h":false},{"t":"2節の「風を避ける場所」「大岩の陰」といった表現は、この王が、民に安全と休みを与える方であることを示します。","s":133.272,"e":141.756,"p":false,"h":false},{"t":"30章で、エジプトの陰に避け所を求めた民に対して、本当の避け所はこの王にあると語っているとも読めます。","s":142.056,"e":149.926,"p":true,"h":false},{"t":"3~4節の、目や耳が開かれるという言葉は、29章18節の、聞こえない人が聞き、盲人が見るようになるという約束と、つながっています。","s":150.552,"e":161.57,"p":false,"h":false},{"t":"この王の支配のもとで、神のことばを悟る力が与えられます。","s":161.856,"e":166.074,"p":true,"h":false},{"t":"5~8節は、本物と偽物が見分けられるようになることを語ります。","s":166.716,"e":171.66,"p":false,"h":false},{"t":"今は、愚か者が高貴な人と呼ばれ、ずる賢い者が尊ばれていますが、この王のもとでは、人の本当の姿が明らかにされます。","s":171.972,"e":181.445,"p":true,"h":false},{"t":"9~14節の女たちへの警告は、3章の、飾りに頼った女性たちへの言葉と、似た響きを持っています。","s":182.088,"e":190.221,"p":false,"h":false},{"t":"ここでも、特定の人の性別をとがめているのではなく、豊かさに安心しきって、神を忘れている社会の姿を映していると読まれます。","s":190.512,"e":199.824,"p":true,"h":false},{"t":"15節の「上から霊が注がれる」は、この章の転換点です。","s":200.448,"e":204.778,"p":false,"h":false},{"t":"荒れ野が果樹園になるという回復は、人の努力ではなく、神の霊の注ぎによって始まります。","s":205.092,"e":211.5,"p":false,"h":false},{"t":"新約聖書では、聖霊の注ぎと結びつけて読まれることが多い言葉です。","s":211.788,"e":216.921,"p":false,"h":false},{"t":"改革派の伝統も、キリストによる聖霊の注ぎの預言として受け取ってきました。","s":217.224,"e":222.501,"p":false,"h":false},{"t":"ただし、その成就がどの時期を指すのかについては、読み方が分かれます。","s":222.804,"e":227.906,"p":true,"h":false},{"t":"16~18節の「義の実は平和」は、平和が、義と切り離せないことを教えています。","s":228.528,"e":235.118,"p":false,"h":false},{"t":"正義なしに平和はなく、神が義を実らせてくださるとき、本当の平安が来ます。","s":235.404,"e":241.197,"p":true,"h":false}]},{"title":"イザヤ書_33章","audio":"doc33_2610231055.mp3","dur":328.3,"segs":[{"t":"イザヤ書33章","s":0,"e":1.673,"p":true,"h":false},{"t":"全体の流れ","s":2.304,"e":3.409,"p":true,"h":false},{"t":"33章は、「災いだ、あなたは」と、略奪する者に向けて始まります。","s":4.212,"e":9.922,"p":false,"h":false},{"t":"自分は略奪されたことがないのに略奪し、自分は裏切られたことがないのに裏切る者は、略奪を終えたとき、自分も略奪されます(33:1)。","s":10.188,"e":19.667,"p":false,"h":false},{"t":"ここで、民は祈ります。","s":19.98,"e":21.701,"p":false,"h":false},{"t":"「主よ、私たちをあわれんでください。","s":21.996,"e":24.334,"p":false,"h":false},{"t":"私たちはあなたを待ち望みます。","s":24.624,"e":26.792,"p":false,"h":false},{"t":"朝ごとに私たちの腕となり、苦難の時には私たちの救いとなってください」(33:2)。","s":27.072,"e":32.044,"p":false,"h":false},{"t":"主が立ち上がられると、国々は逃げ散り、略奪された物は、いなごが集まるように集められます(33:3-4)。","s":32.328,"e":39.208,"p":true,"h":false},{"t":"主は高く上げられ、高い所に住まわれます。","s":39.852,"e":43.029,"p":false,"h":false},{"t":"主はシオンを公正と義で満たされます。","s":43.308,"e":45.894,"p":false,"h":false},{"t":"主は、あなたの時代の堅い基となり、知恵と知識と主を恐れる心という、救いの富となられます(33:5-6)。","s":46.188,"e":53.446,"p":false,"h":false},{"t":"ところが、現実には、使者たちは激しく泣き、大路は荒れ果て、契約は破られ、町々は退けられ、人は顧みられません。","s":53.748,"e":63.128,"p":false,"h":false},{"t":"地は嘆き、しおれ、レバノンは恥じ、シャロンは荒れ地のようになります(33:7-9)。","s":63.432,"e":68.296,"p":true,"h":false},{"t":"「今、わたしは立ち上がる」と主は言われます。","s":68.94,"e":71.77,"p":false,"h":false},{"t":"「今、わたしは自分を高く上げる。","s":72.072,"e":74.435,"p":false,"h":false},{"t":"今、わたしは崇められる」(33:10)。","s":74.736,"e":76.558,"p":false,"h":false},{"t":"あなたがたは、もみ殻をはらみ、わらを産みます。","s":76.824,"e":80.144,"p":false,"h":false},{"t":"あなたがたの息は、あなたがたを食い尽くす火です。","s":80.46,"e":83.728,"p":false,"h":false},{"t":"諸国民は、石灰のように焼かれ、刈り取られたいばらのように、火に燃やされます(33:11-12)。","s":84.024,"e":89.638,"p":true,"h":false},{"t":"シオンの罪人たちは恐れ、神を敬わない者たちはおののきます。","s":90.288,"e":94.793,"p":false,"h":false},{"t":"「私たちのうちだれが、焼き尽くす火のそばに住めるだろうか。","s":95.076,"e":98.902,"p":false,"h":false},{"t":"私たちのうちだれが、とこしえに燃える炉のそばに住めるだろうか」(33:14)。","s":99.18,"e":103.331,"p":false,"h":false},{"t":"答えは、正しく歩み、正しく語る者、搾取による利益を退け、手を振って賄賂を受けず、血を流す相談に耳をふさぎ、悪を見ることに目を閉ざす者です。","s":103.608,"e":115.481,"p":false,"h":false},{"t":"その人は、高い所に住み、岩の砦が彼の避け所となり、パンが与えられ、水が絶えることがありません(33:15-16)。","s":115.776,"e":123.637,"p":true,"h":false},{"t":"そして、「あなたの目は王をその美しさのうちに見、遠くの地を見る」と約束されます。","s":124.308,"e":130.12,"p":false,"h":false},{"t":"あなたは恐れの日々を思い返します。","s":130.392,"e":132.722,"p":false,"h":false},{"t":"「数える者はどこにいるのか。","s":133.02,"e":134.862,"p":false,"h":false},{"t":"重さを量る者はどこにいるのか。","s":135.144,"e":137.338,"p":false,"h":false},{"t":"やぐらを数える者はどこにいるのか」(33:17-18)。","s":137.628,"e":139.972,"p":false,"h":false},{"t":"もうあの横柄な民を見ることはありません。","s":140.256,"e":142.952,"p":false,"h":false},{"t":"あなたの目は、祭りの町シオン、安らかな住まいエルサレムを見ます。","s":143.244,"e":147.986,"p":false,"h":false},{"t":"それは、動かされることのない天幕です(33:19-20)。","s":148.284,"e":151.129,"p":false,"h":false},{"t":"主はそこで、広い川や流れのある所のように、私たちの威光となられ、そこには、こぎ舟も大きな船も入りません。","s":151.452,"e":159.996,"p":false,"h":false},{"t":"主は私たちのさばき人、主は私たちの立法者、主は私たちの王。","s":160.308,"e":165.397,"p":false,"h":false},{"t":"この方が私たちを救われます(33:21-22)。","s":165.708,"e":167.765,"p":false,"h":false},{"t":"敵の船の綱は緩み、帆柱は支えられず、帆も張れません。","s":168.048,"e":172.356,"p":false,"h":false},{"t":"そのとき、莫大な略奪物が分けられ、足の不自由な者でさえ獲物を奪います。","s":172.656,"e":178.649,"p":false,"h":false},{"t":"そこに住む者は、「私は病気だ」とは言わず、そこに住む民は、咎を赦されます(33:23-24)。","s":178.956,"e":185.052,"p":true,"h":false},{"t":"各節の解説","s":185.688,"e":186.97,"p":true,"h":false},{"t":"1節の略奪者は、アッシリアを指すと読まれます。","s":187.632,"e":191.049,"p":false,"h":false},{"t":"人を裏切り、奪い続けた者も、やがて同じ目にあう、という神のさばきの原則が語られています。","s":191.34,"e":198.499,"p":true,"h":false},{"t":"2節の祈りは、この章の中心です。","s":199.116,"e":201.936,"p":false,"h":false},{"t":"「朝ごとに私たちの腕となってください」という願いは、日ごとに神に頼る信仰を表しています。","s":202.248,"e":208.55,"p":false,"h":false},{"t":"さばきの宣告が続く中で、民が神に呼びかける声が、ここに記されています。","s":208.836,"e":214.666,"p":true,"h":false},{"t":"5~6節の「主を恐れることが宝」という言葉は、救いの富が、金銀ではなく、神を畏れる心にあると教えます。","s":215.316,"e":224.011,"p":false,"h":false},{"t":"エジプトの財力や軍事力に頼った人々への、静かな答えとして読めます。","s":224.316,"e":229.509,"p":true,"h":false},{"t":"10節の「今、わたしは立ち上がる」は、主が、ご自分の時を定めて動き出される宣言です。","s":230.148,"e":236.834,"p":false,"h":false},{"t":"人々が自分の力で救いを得ようと動き回っていたとき、主は、ご自分の時に、ご自分の方法で働かれます。","s":237.132,"e":245.143,"p":true,"h":false},{"t":"14節の「焼き尽くす火のそばに住めるだろうか」という問いは、聖なる神の前に立てる人はだれか、という、聖書全体を通じた根本的な問いです。","s":245.772,"e":256.133,"p":false,"h":false},{"t":"15~16節の答えは、行いの条件のように見えますが、これだけで神の前に立てる人はいません。","s":256.428,"e":263.686,"p":false,"h":false},{"t":"改革派の伝統は、この問いの答えを、キリストご自身、そしてキリストにある者として読んできました。","s":263.988,"e":270.933,"p":false,"h":false},{"t":"ただし、この箇所が、そのまま行いによる救いを教えているのではない、という点が大切です。","s":271.224,"e":277.917,"p":true,"h":false},{"t":"17節の「王をその美しさのうちに見る」は、解釈が分かれます。","s":278.568,"e":283.158,"p":false,"h":false},{"t":"ヒゼキヤ王を指すという読み方、神ご自身を指すという読み方、メシアを指すという読み方があります。","s":283.428,"e":290.194,"p":false,"h":false},{"t":"22節で「主は私たちの王」と語られることから、主ご自身を指すと読む立場が有力です。","s":290.484,"e":297.177,"p":true,"h":false},{"t":"21~23節の、川と船の描写は、シオンが、敵の船が入ることのできない、守られた町であることを表します。","s":297.828,"e":307.083,"p":false,"h":false},{"t":"主ご自身が、さばき人、立法者、王として、民を治められます。","s":307.368,"e":312.523,"p":true,"h":false},{"t":"24節の「咎を赦される」は、この章の最後の言葉として、大きな意味を持っています。","s":313.164,"e":319.148,"p":false,"h":false},{"t":"シオンの安全と祝福の根本が、罪の赦しにあることを示します。","s":319.428,"e":324.233,"p":false,"h":false},{"t":"外側の平和は、神による赦しから来ます。","s":324.504,"e":327.64,"p":true,"h":false}]},{"title":"イザヤ書_34章","audio":"doc34_2610231055.mp3","dur":261.9,"segs":[{"t":"イザヤ書34章","s":0,"e":1.686,"p":true,"h":false},{"t":"全体の流れ","s":2.34,"e":3.445,"p":true,"h":false},{"t":"34章は、すべての国々への呼びかけで始まります。","s":4.248,"e":8.366,"p":false,"h":false},{"t":"「諸国民よ、近づいて聞け。","s":8.64,"e":10.66,"p":false,"h":false},{"t":"国々の民よ、耳を傾けよ。","s":10.944,"e":13.454,"p":false,"h":false},{"t":"地とそこに満ちるもの、世界とそこから出るすべてのものよ、聞け」(34:1)。","s":13.752,"e":18.171,"p":false,"h":false},{"t":"主の憤りは、すべての国々に向けられ、その怒りは、すべての軍勢に向かいます。","s":18.468,"e":24.711,"p":false,"h":false},{"t":"主は彼らを滅ぼし、殺戮に渡されます(34:2)。","s":24.984,"e":28.115,"p":false,"h":false},{"t":"殺された者は投げ捨てられ、死体の悪臭が立ち上り、山々は彼らの血で溶けます。","s":28.404,"e":34.262,"p":false,"h":false},{"t":"天の万象は朽ち果て、天は巻物のように巻かれます(34:3-4)。","s":34.56,"e":38.372,"p":true,"h":false},{"t":"主の剣は、天で酔い、エドムの上に、主が滅ぼし尽くすと定めた民の上に下ります(34:5)。","s":39.024,"e":45.059,"p":false,"h":false},{"t":"主には、ボツラでのいけにえ、エドムの地での大きな殺戮があります。","s":45.36,"e":50.076,"p":false,"h":false},{"t":"野牛も子牛も強い雄牛も倒れ、地は血に酔います。","s":50.364,"e":54.14,"p":false,"h":false},{"t":"それは、主の復讐の日、シオンの訴えのための報復の年だからです(34:6-8)。","s":54.432,"e":59.407,"p":false,"h":false},{"t":"エドムの川は瀝青に、そのちりは硫黄に変わり、その地は燃える瀝青となります。","s":59.688,"e":65.417,"p":false,"h":false},{"t":"夜も昼も消えず、その煙は永遠に立ち上ります。","s":65.7,"e":69.372,"p":false,"h":false},{"t":"世代から世代へ荒れ果て、永遠に通る者はありません(34:9-10)。","s":69.66,"e":73.413,"p":true,"h":false},{"t":"そこには、ふくろうやはりねずみが住み、みみずく、からすがそこにいます。","s":74.088,"e":79.182,"p":false,"h":false},{"t":"主は、そこに、混沌の測りなわと、むなしさのおもりを垂らされます。","s":79.452,"e":84.314,"p":false,"h":false},{"t":"その高貴な人々は、王国の名を呼ぶ者もなく、首長たちはみな無になります(34:11-12)。","s":84.6,"e":90.165,"p":false,"h":false},{"t":"その宮殿にはいばらが生え、要塞にはあざみとおどろが生えます。","s":90.468,"e":94.749,"p":false,"h":false},{"t":"そこは、山犬の住み処、だちょうの家となります(34:13)。","s":95.04,"e":98.582,"p":false,"h":false},{"t":"荒れ野の獣はやまねこに会い、毛深い野やぎは、仲間を呼びます。","s":98.892,"e":103.529,"p":false,"h":false},{"t":"夜の魔物もそこにとどまり、休み場を見つけます(34:14)。","s":103.824,"e":107.21,"p":true,"h":false},{"t":"最後に、「主の書物を調べて読め」と言われます。","s":107.856,"e":111.229,"p":false,"h":false},{"t":"これらのものは、一つも欠けず、互いに相手を欠かすことがありません。","s":111.528,"e":116.297,"p":false,"h":false},{"t":"主の口がこれを命じ、主の霊がこれらを集められたからです。","s":116.604,"e":120.879,"p":false,"h":false},{"t":"主は、これらのためにくじを引き、手の測りなわで、地を分け与えられました。","s":121.176,"e":126.64,"p":false,"h":false},{"t":"これらは永遠にこれを所有し、世代から世代へ、そこに住みます(34:16-17)。","s":126.936,"e":131.525,"p":true,"h":false},{"t":"各節の解説","s":132.156,"e":133.438,"p":true,"h":false},{"t":"1~4節は、特定の国ではなく、すべての国々に対する、世界規模のさばきを語ります。","s":134.1,"e":141.077,"p":false,"h":false},{"t":"ここでは、13~23章の、個々の国への宣告の終わりに、全世界のさばきが総括されるという構造になっています。","s":141.336,"e":150.186,"p":false,"h":false},{"t":"天が巻物のように巻かれるという表現は、新約聖書の黙示録でも、終わりの時のさばきを語る際に用いられています。","s":150.48,"e":158.603,"p":true,"h":false},{"t":"5~6節の「エドム」は、イスラエルの兄弟の民でありながら、しばしば敵対した国です。","s":159.228,"e":165.53,"p":false,"h":false},{"t":"ここで、エドムが、神に逆らう世界全体の代表として扱われている、と読む立場があります。","s":165.816,"e":172.695,"p":false,"h":false},{"t":"エドムへの具体的な預言として読む立場もあり、どちらが中心かは、読み方が分かれます。","s":172.98,"e":179.181,"p":true,"h":false},{"t":"8節の「復讐の日」は、人間の私的な恨みを晴らすことではなく、主が、ご自分の民のために、正しいさばきを行われる日を意味しています。","s":179.82,"e":189.339,"p":false,"h":false},{"t":"人間が、自分で復讐することを正当化する言葉ではありません。","s":189.648,"e":194.315,"p":false,"h":false},{"t":"「シオンの訴えのための報復の年」は、35章で語られる救いの年との、対になっています。","s":194.616,"e":201.224,"p":true,"h":false},{"t":"9~10節の「永遠に立ち上る煙」は、さばきの徹底さを表現する、詩的な言葉です。","s":201.852,"e":208.225,"p":false,"h":false},{"t":"ソドムとゴモラの滅亡を思い起こさせます。","s":208.512,"e":211.254,"p":false,"h":false},{"t":"黙示録でも、バビロンの滅びを語る際に、同じような表現が用いられています。","s":211.536,"e":217.153,"p":true,"h":false},{"t":"11~15節の動物の描写は、人間が住まなくなり、荒れ果てた地の姿を表します。","s":217.8,"e":224.567,"p":false,"h":false},{"t":"かつて栄えた国が、獣だけの住む場所になるという、13章のバビロンの描写とも、響き合っています。","s":224.856,"e":232.288,"p":false,"h":false},{"t":"14節の「夜の魔物」については、翻訳や読み方が分かれる箇所で、民間伝承の存在を指す言葉と見る読み方があります。","s":232.56,"e":241.554,"p":true,"h":false},{"t":"16~17節の「主の書物」は、イザヤが語った預言の言葉を指すと読むのが一般的です。","s":242.172,"e":248.752,"p":false,"h":false},{"t":"主が語られたことは、必ず実現する、という確かさを語っています。","s":249.048,"e":254.185,"p":false,"h":false},{"t":"ここで語られるさばきは、主ご自身の口が命じたことなので、人間が変更することはできません。","s":254.484,"e":261.241,"p":true,"h":false}]},{"title":"イザヤ書_35章","audio":"doc35_2610231055.mp3","dur":233.5,"segs":[{"t":"イザヤ書35章","s":0,"e":1.563,"p":true,"h":false},{"t":"全体の流れ","s":2.232,"e":3.337,"p":true,"h":false},{"t":"34章の荒れ果てた地とは、まったく反対の光景が、35章で語られます。","s":4.14,"e":10.084,"p":false,"h":false},{"t":"荒れ野と、乾いた地は喜び、荒れ地は歓喜して、サフランのように花を咲かせます。","s":10.368,"e":16.245,"p":false,"h":false},{"t":"盛んに花を咲かせ、歓喜して、声高らかに歌います。","s":16.524,"e":20.538,"p":false,"h":false},{"t":"レバノンの栄光、カルメルとシャロンの威光が、これに与えられます。","s":20.808,"e":25.251,"p":false,"h":false},{"t":"人々は、主の栄光、私たちの神の威光を見ます(35:1-2)。","s":25.524,"e":29.518,"p":true,"h":false},{"t":"そこで、疲れた手を強め、よろめく膝をしっかりさせるよう、呼びかけられます。","s":30.168,"e":35.537,"p":false,"h":false},{"t":"心の弱っている人々に、「強くあれ。","s":35.82,"e":38.488,"p":false,"h":false},{"t":"恐れるな。","s":38.772,"e":39.483,"p":false,"h":false},{"t":"見よ、あなたがたの神が来られる。","s":40.68,"e":42.889,"p":false,"h":false},{"t":"復讐が来る。","s":43.164,"e":44.088,"p":false,"h":false},{"t":"神の報いが来る。","s":45.072,"e":46.286,"p":false,"h":false},{"t":"神ご自身が来て、あなたがたを救われる」と言いなさい、と(35:3-4)。","s":46.98,"e":51.034,"p":false,"h":false},{"t":"そのとき、盲人の目は開かれ、耳の聞こえない人の耳はあけられます。","s":51.336,"e":56.443,"p":false,"h":false},{"t":"足の不自由な人は、鹿のように跳ね、口のきけない人の舌は喜び歌います。","s":56.736,"e":62.354,"p":false,"h":false},{"t":"荒れ野に水が湧き出し、荒れ地に流れが生じるからです(35:5-6)。","s":62.64,"e":66.39,"p":false,"h":false},{"t":"焼けた砂地は沼となり、潤いのない地は水の湧く所となり、山犬の住み処だった所に、葦やパピルスが生えます(35:7)。","s":66.708,"e":74.801,"p":true,"h":false},{"t":"そこには大路があり、その道は「聖なる道」と呼ばれます。","s":75.456,"e":79.423,"p":false,"h":false},{"t":"汚れた者はそこを通れません。","s":79.704,"e":81.719,"p":false,"h":false},{"t":"愚か者も迷い込むことはありません。","s":82.044,"e":84.371,"p":false,"h":false},{"t":"そこには獅子はおらず、猛獣もそこに上らず、そこで見つかることはありません。","s":84.672,"e":90.06,"p":false,"h":false},{"t":"ただ、贖われた者たちがそこを歩きます(35:8-9)。","s":90.36,"e":93.343,"p":false,"h":false},{"t":"主に贖い出された者たちは帰って来ます。","s":93.636,"e":96.363,"p":false,"h":false},{"t":"彼らは、喜び歌いながらシオンに入り、その頭にはとこしえの喜びがあります。","s":96.66,"e":102.451,"p":false,"h":false},{"t":"楽しみと喜びがついて来て、悲しみとため息は逃げ去ります(35:10)。","s":102.744,"e":107.099,"p":true,"h":false},{"t":"各節の解説","s":107.748,"e":109.03,"p":true,"h":false},{"t":"1~2節の、荒れ野が花を咲かせるという描写は、34章の荒れ果てた地と対になっています。","s":109.692,"e":116.322,"p":false,"h":false},{"t":"さばきによって荒れ野となるエドムと、回復によって花を咲かせる荒れ野との対比が、この二つの章を結びつけています。","s":116.604,"e":124.334,"p":true,"h":false},{"t":"3~4節の「疲れた手を強めよ」という言葉は、すでに信仰の歩みに疲れている人々への励ましです。","s":124.956,"e":132.202,"p":false,"h":false},{"t":"ここで語られる救いは、「神ご自身が来られる」という約束です。","s":132.48,"e":136.895,"p":false,"h":false},{"t":"人が自分の力で立ち上がるのではなく、神が来てくださることが、慰めの根拠です。","s":137.196,"e":143.205,"p":true,"h":false},{"t":"4節の「復讐」は、34章8節と同じ言葉で、神が悪をさばき、ご自分の民を救い出される、という意味です。","s":143.856,"e":152.152,"p":false,"h":false},{"t":"さばきと救いが、一つのことの両面として語られています。","s":152.46,"e":156.483,"p":true,"h":false},{"t":"5~6節の、盲人の目が開かれ、耳の聞こえない人の耳が開かれ、足の不自由な人が跳ね、口のきけない人が歌うという描写は、新約聖書で、イエスが洗礼者ヨハネの使いに答える場面で、ご自身の働きのしるしとして語られた内容と重なります。","s":157.14,"e":175.384,"p":false,"h":false},{"t":"福音書は、イエスの癒やしの働きを、この預言の成就の始まりとして理解しています。","s":175.68,"e":181.635,"p":false,"h":false},{"t":"ただし、この預言が、イエスの働きだけで完成したのか、終わりの時の完全な回復も指しているのかについては、読み方が分かれます。","s":181.908,"e":191.197,"p":true,"h":false},{"t":"8節の「聖なる道」は、贖われた者だけが歩く道です。","s":191.844,"e":196.075,"p":false,"h":false},{"t":"汚れた者が通れないというのは、行いが整った者だけが入れるという意味ではなく、神によって贖われ、きよめられた者だけが、この道を歩くということです。","s":196.344,"e":206.604,"p":false,"h":false},{"t":"この道の備えは、神ご自身によるものです。","s":206.892,"e":210.018,"p":true,"h":false},{"t":"9~10節の「贖われた者」は、イザヤ書の後半、特に40章以降で、大きな主題となる言葉です。","s":210.672,"e":218.225,"p":false,"h":false},{"t":"10節は、51章11節と、ほぼ同じ言葉で繰り返されます。","s":218.52,"e":223.548,"p":false,"h":false},{"t":"これは、1~35章の前半が、望みの言葉で閉じられ、後半の慰めの預言への橋渡しになっていることを示します。","s":223.848,"e":232.807,"p":true,"h":false}]},{"title":"イザヤ書_36章","audio":"doc36_2610231055.mp3","dur":194.2,"segs":[{"t":"イザヤ書36章","s":0,"e":1.626,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"ヒゼキヤ王の第十四年に、アッシリアの王センナケリブが、ユダの堅固な町々をすべて攻め取りました。","s":4.176,"e":11.094,"p":false,"h":false},{"t":"王はラブ・シャケを大軍とともにラキシュからエルサレムへ遣わし、上の貯水池の水道のそばに立たせます(36:1-2)。","s":11.376,"e":17.986,"p":false,"h":false},{"t":"迎えに出たのは、宮廷長エルヤキム、書記官シェブナ、記録官ヨアです(36:3)。","s":18.252,"e":23.643,"p":true,"h":false},{"t":"ラブ・シャケは言います。","s":24.3,"e":25.553,"p":false,"h":false},{"t":"「いったい、何を頼みにしているのか。","s":26.208,"e":28.533,"p":false,"h":false},{"t":"エジプトか。","s":28.836,"e":29.599,"p":false,"h":false},{"t":"それは折れた葦の杖で、寄りかかる者の手を突き刺す」(36:4-6)。","s":30.744,"e":34.362,"p":false,"h":false},{"t":"さらに、「あなたがたは主に頼ると言うが、ヒゼキヤが取り除いたのは、その主の高き所と祭壇ではなかったか」と言い、二千頭の馬を与えても乗り手がいないだろうと嘲ります(36:7-9)。","s":34.668,"e":46.828,"p":false,"h":false},{"t":"そして、「主が私に、この地を攻めて滅ぼせと言われたのだ」とまで言います(36:10)。","s":47.124,"e":52.418,"p":true,"h":false},{"t":"エルヤキムたちが、「ユダのことばではなく、アラム語で話してください」と頼むと、ラブ・シャケはわざと大声でユダのことばで叫びます。","s":53.064,"e":61.581,"p":false,"h":false},{"t":"「ヒゼキヤにだまされるな。","s":61.848,"e":63.391,"p":false,"h":false},{"t":"ヒゼキヤは救い出せない。","s":63.756,"e":65.258,"p":false,"h":false},{"t":"私と和を結び、降伏せよ。","s":65.664,"e":67.903,"p":false,"h":false},{"t":"そうすれば、各自が自分のぶどうとイチジクを食べ、自分の井戸の水を飲める」(36:11-17)。","s":68.22,"e":73.671,"p":false,"h":false},{"t":"さらに、「どの国の神が、自分の国をアッシリアの手から救い出したか。","s":73.944,"e":78.776,"p":false,"h":false},{"t":"主がエルサレムを救い出せるだろうか」と挑みます(36:18-20)。","s":79.056,"e":82.127,"p":false,"h":false},{"t":"民は黙っており、ヒゼキヤの命令どおり、ひと言も答えませんでした。","s":82.404,"e":87.13,"p":false,"h":false},{"t":"三人は衣を引き裂いて、王に報告します(36:21-22)。","s":87.408,"e":90.422,"p":true,"h":false},{"t":"各節の解説","s":91.044,"e":92.326,"p":true,"h":false},{"t":"1節の「第十四年」は、アッシリアの記録などと照らして、年代の数え方に議論があります。","s":92.988,"e":99.556,"p":false,"h":false},{"t":"ここでは、センナケリブの侵攻が、ヒゼキヤの時代の大きな危機だったことを押さえておけば十分です。","s":99.828,"e":106.521,"p":true,"h":false},{"t":"2~3節の「上の貯水池の水道のそば」は、7章3節で、イザヤがアハズ王に会った場所と同じ地名です。","s":107.172,"e":114.949,"p":false,"h":false},{"t":"かつて、アハズがここで神の言葉を拒み、アッシリアに頼りました。","s":115.236,"e":119.877,"p":false,"h":false},{"t":"今、同じ場所で、ヒゼキヤは別の試みに立たされます。","s":120.168,"e":124.218,"p":true,"h":false},{"t":"4~10節で、ラブ・シャケの言葉は、一見、理屈が通っているように聞こえます。","s":124.848,"e":130.616,"p":false,"h":false},{"t":"エジプトが頼りにならないという指摘は、イザヤ自身が語ってきたことと同じです。","s":130.896,"e":136.226,"p":false,"h":false},{"t":"それでも、この人の言葉は、神を人間の神々の一つとして扱う高ぶりに満ちています。","s":136.512,"e":142.944,"p":false,"h":false},{"t":"真実の一部を使って、神への信頼を崩そうとするところが、この場面の怖さです。","s":143.244,"e":149.295,"p":true,"h":false},{"t":"10節の「主が私に命じた」という主張は、人間の言葉を神の名で飾った嘘として読まれます。","s":149.94,"e":156.604,"p":false,"h":false},{"t":"ここは、実際にそう言われたのか、脅しの修辞なのか、読み方が分かれます。","s":156.888,"e":162.31,"p":true,"h":false},{"t":"13~17節の「降伏すればぶどうとイチジクを食べられる」は、約束の地の祝福をまねた甘い誘いです。","s":162.936,"e":170.478,"p":false,"h":false},{"t":"しかし、続く17節で、「あなたがたの地のような地」へ連れ去ると言われており、実際には捕囚の誘いであることが分かります。","s":170.748,"e":179.355,"p":true,"h":false},{"t":"18~20節の、他国の神々との比較は、主を、他の神々と同じ種類のものと見なす誤りです。","s":180,"e":187.955,"p":false,"h":false},{"t":"この嘲りが、37章でヒゼキヤの祈りと、主の答えを引き出します。","s":188.244,"e":193.579,"p":true,"h":false}]},{"title":"イザヤ書_37章","audio":"doc37_2610231055.mp3","dur":310.4,"segs":[{"t":"イザヤ書37章","s":0,"e":1.664,"p":true,"h":false},{"t":"全体の流れ","s":2.304,"e":3.409,"p":true,"h":false},{"t":"ヒゼキヤは衣を引き裂き、粗布をまとって主の宮に入り、宮廷長エルヤキムたちを預言者イザヤのもとに遣わします。","s":4.212,"e":12.349,"p":false,"h":false},{"t":"「今日は、苦難と懲らしめと恥辱の日です。","s":12.636,"e":15.454,"p":false,"h":false},{"t":"子が生まれようとするのに、産む力がありません」と伝え、残りの者のために祈ってほしいと頼みます(37:1-4)。","s":15.768,"e":22.449,"p":false,"h":false},{"t":"イザヤは答えます。","s":22.716,"e":23.957,"p":false,"h":false},{"t":"「恐れるな。","s":24.624,"e":25.335,"p":false,"h":false},{"t":"アッシリアの王の若者たちが私を冒涜した、あのことばを恐れてはならない。","s":26.532,"e":31.732,"p":false,"h":false},{"t":"わたしは彼の中に霊を送る。","s":32.004,"e":34.088,"p":false,"h":false},{"t":"彼はうわさを聞いて、自分の国へ帰り、自分の国で剣によって倒れる」(37:5-7)。","s":34.38,"e":39.568,"p":true,"h":false},{"t":"やがてセンナケリブは、クシュの王が攻めて来るという知らせを聞き、再び使者を送って、ヒゼキヤに手紙を書きます。","s":40.212,"e":47.87,"p":false,"h":false},{"t":"「あなたが頼る神にだまされるな」と、同じ脅しを繰り返します(37:8-13)。","s":48.168,"e":52.161,"p":false,"h":false},{"t":"ヒゼキヤはその手紙を受け取って読み、主の宮に上って、主の前にそれを広げます(37:14)。","s":52.452,"e":58.248,"p":false,"h":false},{"t":"そして祈ります。","s":58.536,"e":59.575,"p":false,"h":false},{"t":"「ケルビムの上に座しておられる万軍の主よ。","s":60.444,"e":63.198,"p":false,"h":false},{"t":"あなただけが、地のすべての王国の神です。","s":63.504,"e":66.577,"p":false,"h":false},{"t":"主よ、耳を傾けて聞いてください。","s":66.888,"e":69.519,"p":false,"h":false},{"t":"センナケリブが生ける神をそしるために送ったことばを聞いてください。……","s":69.804,"e":73.947,"p":false,"h":false},{"t":"私たちを彼の手から救ってください。","s":74.808,"e":77.147,"p":false,"h":false},{"t":"地のすべての王国が、主よ、あなただけが主であることを知るように」(37:15-20)。","s":77.436,"e":81.974,"p":true,"h":false},{"t":"イザヤは、主の答えを伝えます。","s":82.62,"e":84.915,"p":false,"h":false},{"t":"「あなたが私に祈ったことを、私は聞いた。","s":85.212,"e":88.253,"p":false,"h":false},{"t":"シオンの娘は、あなたを侮り、あざ笑う」(37:21-22)。","s":88.524,"e":91.717,"p":false,"h":false},{"t":"主は、アッシリアの王に向かって言われます。","s":92.016,"e":94.78,"p":false,"h":false},{"t":"「あなたは、だれをそしり、だれをののしったのか。","s":95.076,"e":98.239,"p":false,"h":false},{"t":"イスラエルの聖なる方に向かってだ。","s":98.532,"e":100.67,"p":false,"h":false},{"t":"あなたは、自分の力を誇ったが、わたしは昔からこれを定め、今これを実現させた。","s":100.944,"e":107.527,"p":false,"h":false},{"t":"あなたは、わたしの鼻に鉤をかけ、くちびるにくつわをはめ、来た道を引き戻す」(37:23-29)。","s":107.82,"e":113.627,"p":true,"h":false},{"t":"ヒゼキヤへのしるしが与えられます。","s":114.264,"e":116.378,"p":false,"h":false},{"t":"今年は自然に生えたものを食べ、二年目にもそのまま食べ、三年目に種を蒔いて刈り入れ、ぶどう畑を作って、その実を食べる。","s":116.676,"e":125.5,"p":false,"h":false},{"t":"ユダの家の残された者は、下に根を張り、上に実を結ぶ。","s":125.784,"e":130.131,"p":false,"h":false},{"t":"エルサレムから残りの者が、シオンの山から生き延びる者が出る。","s":130.392,"e":134.676,"p":false,"h":false},{"t":"万軍の主の熱心が、これを成し遂げる(37:30-32)。","s":134.964,"e":137.9,"p":false,"h":false},{"t":"主は、アッシリアの王について、「この町に入らず、矢も射ず、盾も持って近づかず、塁も築かない。","s":138.204,"e":145.65,"p":false,"h":false},{"t":"来た道を引き返し、この町には入らない。","s":145.944,"e":148.965,"p":false,"h":false},{"t":"わたしは、この町を守って救う。","s":149.256,"e":151.623,"p":false,"h":false},{"t":"わたし自身のために、わたしのしもべダビデのために」と言われます(37:33-35)。","s":151.92,"e":156.212,"p":true,"h":false},{"t":"その夜、主の使いが出て行き、アッシリア人の陣営で十八万五千人を打ちました。","s":156.852,"e":162.771,"p":false,"h":false},{"t":"朝早く起きて見ると、みな死体となっていました。","s":163.08,"e":166.323,"p":false,"h":false},{"t":"センナケリブは陣を引き払い、ニネベに帰って住みました。","s":166.608,"e":170.396,"p":false,"h":false},{"t":"のちに、彼が自分の神ニスロクの神殿で礼拝していると、息子たちが剣で彼を打ち殺し、アララテの地へ逃げました(37:36-38)。","s":170.676,"e":178.915,"p":true,"h":false},{"t":"各節の解説","s":179.568,"e":180.85,"p":true,"h":false},{"t":"1節で、ヒゼキヤが主の宮に入るのは、アハズがアッシリアに使者を送ったこと(7章)との、大きな対比です。","s":181.512,"e":189.405,"p":false,"h":false},{"t":"この王は、人間の外交の前に、まず主の前に出ます。","s":189.684,"e":193.814,"p":true,"h":false},{"t":"3節の「子が生まれようとするのに、産む力がありません」は、危機が極まったとき、人にはもう何もできない、という正直な告白です。","s":194.436,"e":203.865,"p":false,"h":false},{"t":"この状態の中で、ヒゼキヤは祈りへと向かいます。","s":204.156,"e":207.616,"p":true,"h":false},{"t":"14節で、ヒゼキヤが手紙を主の前に広げるのは、問題を人の手から主の手に移す、象徴的な行いです。","s":208.26,"e":216.653,"p":false,"h":false},{"t":"脅しの手紙さえも、祈りの題材とすることができます。","s":216.936,"e":220.854,"p":true,"h":false},{"t":"15~20節の祈りは、ヒゼキヤの信仰の中心を示します。","s":221.472,"e":226.304,"p":false,"h":false},{"t":"主は、ケルビムの上に座しておられる、天地の創造者であり、すべての国の神です。","s":226.584,"e":232.629,"p":false,"h":false},{"t":"祈りの最後の目的は、自分の救いにとどまらず、「地のすべての王国が、あなただけが主であることを知る」ことにあります。","s":232.92,"e":241.339,"p":true,"h":false},{"t":"23~29節の、アッシリア王への言葉は、強い国も、主の手の中にある道具にすぎないことを語ります。","s":241.956,"e":250.025,"p":false,"h":false},{"t":"10章で、アッシリアが「怒りの杖」と呼ばれたことの、続きとして読まれます。","s":250.308,"e":255.638,"p":true,"h":false},{"t":"35節の「わたし自身のために、わたしのしもべダビデのために」は、救いの根拠が、民の功績ではなく、神ご自身の名と、ダビデに与えた約束にあることを示します。","s":256.284,"e":268.509,"p":false,"h":false},{"t":"9章7節の、ダビデの王座の約束と、つながっています。","s":268.812,"e":273.083,"p":true,"h":false},{"t":"36節の「十八万五千人」という数字については、読み方が分かれます。","s":273.744,"e":279.323,"p":false,"h":false},{"t":"文字どおりの数字と読む立場と、大きな数の表現と読む立場があります。","s":279.612,"e":284.342,"p":false,"h":false},{"t":"ここでは、主ご自身の働きによって、人の手を借りずに救いが来た、という点が中心です。","s":284.616,"e":291.246,"p":false,"h":false},{"t":"これが、疫病によるものか、別の方法によるものかは、本文は語りません。","s":291.528,"e":297.031,"p":true,"h":false},{"t":"38節で、センナケリブが自分の神の神殿で殺されるのは、7節の予告の成就です。","s":297.684,"e":304.403,"p":false,"h":false},{"t":"神ではない神に頼る王の最期が、短く、淡々と語られています。","s":304.704,"e":309.747,"p":true,"h":false}]},{"title":"イザヤ書_38章","audio":"doc38_2610231055.mp3","dur":277.9,"segs":[{"t":"イザヤ書38章","s":0,"e":1.627,"p":true,"h":false},{"t":"全体の流れ","s":2.304,"e":3.409,"p":true,"h":false},{"t":"そのころ、ヒゼキヤは病気になり、死にかけていました。","s":4.212,"e":7.995,"p":false,"h":false},{"t":"預言者イザヤが来て言います。","s":8.28,"e":10.084,"p":false,"h":false},{"t":"「あなたの家を整理せよ。","s":10.368,"e":11.959,"p":false,"h":false},{"t":"あなたは死ぬ。","s":12.276,"e":13.2,"p":false,"h":false},{"t":"治らない」(38:1)。","s":14.184,"e":14.89,"p":false,"h":false},{"t":"ヒゼキヤは顔を壁に向けて、主に祈ります。","s":16.092,"e":18.979,"p":false,"h":false},{"t":"「主よ、どうか思い出してください。","s":19.26,"e":21.426,"p":false,"h":false},{"t":"私が真実と全き心をもって、あなたの前を歩み、あなたの目にかなうことを行ってきたことを」。","s":21.708,"e":28.416,"p":false,"h":false},{"t":"そして、激しく泣きます(38:2-3)。","s":28.728,"e":30.517,"p":false,"h":false},{"t":"すると、主の言葉がイザヤに臨みます。","s":30.816,"e":33.62,"p":false,"h":false},{"t":"「あなたの祈りを聞き、涙を見た。","s":33.912,"e":36.344,"p":false,"h":false},{"t":"わたしはあなたの寿命に、十五年を加える。","s":36.612,"e":39.791,"p":false,"h":false},{"t":"あなたと、この町を、アッシリアの王の手から救い、この町を守る」(38:4-6)。","s":40.068,"e":44.695,"p":true,"h":false},{"t":"主は、しるしを与えられます。","s":45.324,"e":47.413,"p":false,"h":false},{"t":"アハズの日時計で、落ちた影を十度、後ろに戻す、というしるしです。","s":47.7,"e":52.467,"p":false,"h":false},{"t":"すると、日時計の影は十度戻りました(38:7-8)。","s":52.74,"e":55.592,"p":true,"h":false},{"t":"ヒゼキヤは、病気から回復したあと、詩を書きました。","s":56.232,"e":60.054,"p":false,"h":false},{"t":"「私は言った。","s":60.336,"e":61.31,"p":false,"h":false},{"t":"人生の半ばで、私は陰府の門に入らなければならない。","s":62.244,"e":66.247,"p":false,"h":false},{"t":"私の残りの年は、取り去られた」(38:9-10)。","s":66.528,"e":69.053,"p":false,"h":false},{"t":"「私は主を見ない。","s":69.336,"e":70.765,"p":false,"h":false},{"t":"生ける者の地で、主を見ない」(38:11)。","s":71.244,"e":73.269,"p":false,"h":false},{"t":"彼は、羊飼いの天幕のように取り去られ、織物のように巻き取られると嘆き、「昼も夜も、あなたは私を終わらせようとされる」と言います(38:12-14)。","s":73.548,"e":83.082,"p":false,"h":false},{"t":"しかし、「私は何を言おうか。","s":83.376,"e":85.602,"p":false,"h":false},{"t":"主が私に語り、主ご自身がそうされた」と悟ります(38:15)。","s":85.896,"e":89.826,"p":false,"h":false},{"t":"「主よ、これらによって人は生き、私の霊のいのちも、すべてこれらの中にあります。","s":90.108,"e":95.963,"p":false,"h":false},{"t":"私を癒やし、生かしてください」(38:16)。","s":96.264,"e":98.435,"p":true,"h":false},{"t":"最後に、彼は言います。","s":99.072,"e":100.8,"p":false,"h":false},{"t":"「見よ、私の苦しみは平安のためであった。","s":101.088,"e":104.194,"p":false,"h":false},{"t":"あなたは、滅びの穴から私のいのちを引き戻された。","s":104.472,"e":108.235,"p":false,"h":false},{"t":"あなたが、私のすべての罪を、あなたの背後に投げ捨てられたからです」(38:17)。","s":108.54,"e":113.22,"p":false,"h":false},{"t":"陰府はあなたに感謝せず、死はあなたをほめたたえません。","s":113.508,"e":117.229,"p":false,"h":false},{"t":"しかし、生きている者、生きている者こそ、今日の私のように、あなたに感謝します(38:18-19)。","s":117.54,"e":123.458,"p":false,"h":false},{"t":"主は私を救ってくださる。","s":123.768,"e":125.561,"p":false,"h":false},{"t":"私たちは生きている限り、主の宮で、琴に合わせて歌う(38:20)。","s":125.856,"e":130.156,"p":false,"h":false},{"t":"イザヤは、いちじくの練り物を腫れ物に当てるよう命じ、ヒゼキヤは癒やされます(38:21)。","s":130.464,"e":135.755,"p":false,"h":false},{"t":"ヒゼキヤは、「主の宮に上れるというしるしは何ですか」と尋ねていました(38:22)。","s":136.044,"e":140.963,"p":true,"h":false},{"t":"各節の解説","s":141.624,"e":142.906,"p":true,"h":false},{"t":"1節の「死ぬ。","s":143.568,"e":144.678,"p":false,"h":false},{"t":"治らない」という宣告は、ヒゼキヤの祈りによって、取り消されます。","s":145.476,"e":149.943,"p":false,"h":false},{"t":"これは、神のことばが、民の祈りに応答して変わることがある、という点で、読み方が分かれる箇所です。","s":150.228,"e":157.648,"p":false,"h":false},{"t":"改革派の伝統は、神の永遠の計画は変わらず、祈りも、その計画の中で神が用いられる手段だと理解してきました。","s":157.932,"e":166.762,"p":true,"h":false},{"t":"3節の「真実と全き心をもって歩んだ」という祈りは、自分の功績を主張するように聞こえます。","s":167.4,"e":174.28,"p":false,"h":false},{"t":"しかし、これは、神への信頼の中で歩んできた者が、その歩みを神に訴える言葉として読むのが、穏当です。","s":174.564,"e":182.689,"p":false,"h":false},{"t":"救いの根拠は、ヒゼキヤの行いでなく、後の17節が語るように、神の赦しにあります。","s":182.988,"e":189.774,"p":true,"h":false},{"t":"5~6節の「十五年」の延命は、この町の救いの約束と、結びつけて語られます。","s":190.404,"e":196.744,"p":false,"h":false},{"t":"この出来事の時期が、アッシリアの侵攻のどの時点かについては、聖書学者の間で見方が分かれます。","s":197.028,"e":204.323,"p":true,"h":false},{"t":"8節の「日時計の影が戻る」しるしは、天体の動きが主の支配のもとにあることを示します。","s":204.984,"e":211.652,"p":false,"h":false},{"t":"どのような自然現象だったのかは、本文は詳しく語りません。","s":211.932,"e":216.114,"p":true,"h":false},{"t":"10~14節の詩は、ヒゼキヤの率直な嘆きです。","s":216.756,"e":220.704,"p":false,"h":false},{"t":"陰府では、主を見ることも、ほめたたえることもできないという考え方は、旧約の初期の死後理解を示しています。","s":221.004,"e":228.998,"p":false,"h":false},{"t":"25章8節や26章19節で語られた、復活の望みは、ここでは、まだヒゼキヤの中ではっきりしていません。","s":229.284,"e":237.98,"p":false,"h":false},{"t":"啓示は、段階を追って進んでいきます。","s":238.284,"e":241.034,"p":true,"h":false},{"t":"17節の「あなたは、私のすべての罪を、あなたの背後に投げ捨てられた」は、この詩の頂点です。","s":241.668,"e":248.66,"p":false,"h":false},{"t":"ヒゼキヤの苦しみの中で、本当の救いは、病の癒やし以上に、罪の赦しにあったことが語られています。","s":248.94,"e":256.412,"p":false,"h":false},{"t":"この言葉は、ミカ書にも似た表現があり、聖書全体で、神の赦しを語る大切な言い方になっています。","s":256.716,"e":264.385,"p":true,"h":false},{"t":"18~19節の、死んだ者は神をほめたたえないという言葉は、旧約の死の理解を表します。","s":265.032,"e":272.255,"p":false,"h":false},{"t":"ここから、「生きている間に主をほめたたえよう」という励ましが生まれます。","s":272.556,"e":277.265,"p":true,"h":false}]},{"title":"イザヤ書_39章","audio":"doc39_2610231055.mp3","dur":181.6,"segs":[{"t":"イザヤ書39章","s":0,"e":1.686,"p":true,"h":false},{"t":"全体の流れ","s":2.34,"e":3.445,"p":true,"h":false},{"t":"そのころ、バビロンの王、バルアダンの子メロダク・バルアダンが、ヒゼキヤに手紙と贈り物を送ります。","s":4.248,"e":10.981,"p":false,"h":false},{"t":"ヒゼキヤが病気から回復したと聞いたからです。","s":11.268,"e":14.268,"p":false,"h":false},{"t":"ヒゼキヤは使者たちを喜んで迎え、自分の宝物庫、銀、金、香料、高価な油、武器庫、そして倉に収められているすべての物を見せました。","s":14.544,"e":25.59,"p":false,"h":false},{"t":"ヒゼキヤが彼らに見せなかったものは、彼の家にも、国中にも、何一つありませんでした(39:1-2)。","s":25.884,"e":32.179,"p":true,"h":false},{"t":"預言者イザヤが王のもとに来て尋ねます。","s":32.796,"e":35.426,"p":false,"h":false},{"t":"「あの者たちは何を言ったのか。","s":35.712,"e":37.606,"p":false,"h":false},{"t":"どこから来たのか」。","s":37.872,"e":38.985,"p":false,"h":false},{"t":"ヒゼキヤは答えます。","s":39.78,"e":41.146,"p":false,"h":false},{"t":"「遠い国、バビロンから来ました」(39:3)。","s":41.688,"e":43.815,"p":false,"h":false},{"t":"「彼らはあなたの家で何を見たのか」と問われると、「私の家の中のすべてを見ました。","s":44.1,"e":49.689,"p":false,"h":false},{"t":"私の宝物庫の中に、彼らに見せなかったものは何一つありません」と言います(39:4)。","s":49.968,"e":55.523,"p":true,"h":false},{"t":"イザヤは言います。","s":56.16,"e":57.238,"p":false,"h":false},{"t":"「万軍の主のことばを聞きなさい。","s":58.068,"e":60.207,"p":false,"h":false},{"t":"見よ、あなたの家にあるもの、あなたの先祖が今日まで蓄えてきたものがすべて、バビロンへ運び去られる日が来る。","s":60.48,"e":67.959,"p":false,"h":false},{"t":"何一つ残らない、と主は言われる。","s":68.256,"e":70.669,"p":false,"h":false},{"t":"あなたから生まれる息子たちの中から、連れて行かれ、バビロンの王の宮殿で、宦官となる者もいる」(39:5-7)。","s":70.956,"e":77.81,"p":false,"h":false},{"t":"ヒゼキヤは、イザヤに言います。","s":78.084,"e":80.134,"p":false,"h":false},{"t":"「あなたが告げてくれた主のことばは良いものです」。","s":80.424,"e":83.304,"p":false,"h":false},{"t":"彼は、「少なくとも、私の生きている間は、平和と安全があるのだから」と考えたのです(39:8)。","s":83.628,"e":90.163,"p":true,"h":false},{"t":"各節の解説","s":90.792,"e":92.074,"p":true,"h":false},{"t":"1節の、バビロンの使者が来たのは、病気の回復を祝う名目でしたが、その背後には、アッシリアに対抗する同盟を結ぶ、政治的な目的があったと考える立場が一般的です。","s":92.736,"e":105.798,"p":false,"h":false},{"t":"ここで、ヒゼキヤが、また人間の同盟の誘惑の前に立たされています。","s":106.092,"e":111.228,"p":true,"h":false},{"t":"2節で、ヒゼキヤが宝物庫を見せたことは、神への信頼でなく、自分の富と力を誇ったことと読まれます。","s":111.852,"e":119.77,"p":false,"h":false},{"t":"主が救ってくださったという証しをする機会に、自分の持ち物を見せたのです。","s":120.06,"e":125.215,"p":true,"h":false},{"t":"6~7節の、バビロンへ連れ去られるという宣告は、この書の前半の最後に置かれた、大きな転換の予告です。","s":125.856,"e":133.841,"p":false,"h":false},{"t":"この時点では、アッシリアが敵であり、バビロンはまだ強国ではありませんでした。","s":134.136,"e":139.554,"p":false,"h":false},{"t":"それなのに、バビロン捕囚が、すでにここで告げられています。","s":139.824,"e":143.963,"p":false,"h":false},{"t":"40章以降の慰めは、この予告を受けた先の、バビロンの地での民への言葉として読まれています。","s":144.252,"e":151.268,"p":true,"h":false},{"t":"8節のヒゼキヤの言葉は、解釈が分かれます。","s":151.92,"e":155.365,"p":false,"h":false},{"t":"主のことばに素直に従う謙遜として読む立場と、自分の時代さえ安全なら、後の世代のことは構わないという、無関心の表れとして読む立場があります。","s":155.664,"e":166.656,"p":false,"h":false},{"t":"この章が、ヒゼキヤの立派な信仰の物語の最後に、あえてこの失敗を残しているのは、人は、どれほど信仰深い王でも、最後まで神に頼り切る者ではない、ということを示しているとも読めます。","s":166.968,"e":180.987,"p":true,"h":false}]},{"title":"イザヤ書_40章","audio":"doc40_2610231055.mp3","dur":428.7,"segs":[{"t":"イザヤ書40章","s":0,"e":1.414,"p":true,"h":false},{"t":"全体の流れ","s":2.052,"e":3.157,"p":true,"h":false},{"t":"40章は、「慰めよ、慰めよ、わたしの民を」という、主のことばで始まります。","s":3.96,"e":10.382,"p":false,"h":false},{"t":"「エルサレムの心に語りかけ、これに呼びかけよ。","s":10.692,"e":13.988,"p":false,"h":false},{"t":"その苦役の時は満ち、その咎は償われた。","s":14.292,"e":17.675,"p":false,"h":false},{"t":"その全ての罪に代えて、主の手から二倍のものを受けた」(40:1-2)。","s":17.964,"e":21.86,"p":true,"h":false},{"t":"声が叫びます。","s":22.5,"e":23.586,"p":false,"h":false},{"t":"「荒れ野に、主の道を備えよ。","s":24.408,"e":26.48,"p":false,"h":false},{"t":"荒れ地に、私たちの神のために、大路をまっすぐにせよ。","s":26.784,"e":30.7,"p":false,"h":false},{"t":"すべての谷は引き上げられ、すべての山と丘は低くされ、曲がったところはまっすぐになり、でこぼこの所は平らになる。","s":30.996,"e":39.295,"p":false,"h":false},{"t":"主の栄光が現れ、すべての肉なる者が、ともにそれを見る。","s":39.6,"e":44.045,"p":false,"h":false},{"t":"主の口が語られたからだ」(40:3-5)。","s":44.316,"e":46.159,"p":true,"h":false},{"t":"また、声が言います。","s":46.8,"e":48.34,"p":false,"h":false},{"t":"「呼べ」。","s":48.708,"e":49.131,"p":false,"h":false},{"t":"「何と呼べばよいのですか」。","s":49.428,"e":50.965,"p":false,"h":false},{"t":"「すべての人は草。","s":51.336,"e":52.611,"p":false,"h":false},{"t":"その栄えは、すべて野の花のようだ。","s":53.244,"e":55.838,"p":false,"h":false},{"t":"草は枯れ、花はしぼむ。","s":56.124,"e":57.917,"p":false,"h":false},{"t":"主の息が吹きつけたからだ。","s":58.212,"e":59.992,"p":false,"h":false},{"t":"確かに、民は草だ。","s":60.3,"e":61.971,"p":false,"h":false},{"t":"草は枯れ、花はしぼむ。","s":62.28,"e":64.073,"p":false,"h":false},{"t":"しかし、私たちの神のことばは、永遠に立つ」(40:6-8)。","s":64.368,"e":67.903,"p":true,"h":false},{"t":"高い山に上って、良い知らせをシオンに伝える者よ、力の限り声を上げよ。","s":68.544,"e":74.159,"p":false,"h":false},{"t":"恐れずに声を上げ、ユダの町々に言え。","s":74.448,"e":77.375,"p":false,"h":false},{"t":"「見よ、あなたがたの神」(40:9)。","s":77.688,"e":79.24,"p":false,"h":false},{"t":"「見よ、神である主は、力をもって来られ、その腕で統べ治められる。","s":79.596,"e":84.798,"p":false,"h":false},{"t":"見よ、その報いは主とともにあり、その働きの報いは、御前にある。","s":85.068,"e":89.913,"p":false,"h":false},{"t":"主は、羊飼いのように、その群れを飼い、その腕に子羊を集め、懐に抱き、乳を飲ませる羊を優しく導かれる」(40:10-11)。","s":90.18,"e":99.116,"p":true,"h":false},{"t":"そして、問いが続きます。","s":99.756,"e":101.595,"p":false,"h":false},{"t":"だれが、手のひらで水を量り、手の幅で天を測ったのか。","s":101.88,"e":106.138,"p":false,"h":false},{"t":"地のちりを升に入れ、山々をはかりで、丘々を天秤で量ったのか(40:12)。","s":106.416,"e":111.454,"p":false,"h":false},{"t":"だれが、主の霊を測り、主の助言者として教えたのか(40:13-14)。","s":111.744,"e":115.847,"p":false,"h":false},{"t":"見よ、国々は、手おけのひとしずく、天秤のちりのようだ。","s":116.136,"e":120.552,"p":false,"h":false},{"t":"島々は、細かいちりのようだ。","s":120.852,"e":123.247,"p":false,"h":false},{"t":"レバノンの木々も、全焼のささげ物には足りない(40:15-16)。","s":123.552,"e":126.905,"p":false,"h":false},{"t":"国々はみな、主の前では無に等しく、むなしいものとして見なされる(40:17)。","s":127.188,"e":131.988,"p":true,"h":false},{"t":"では、だれに神をなぞらえるのか。","s":132.624,"e":134.975,"p":false,"h":false},{"t":"偶像は、職人が鋳て、金細工人が金をかぶせ、銀の鎖をつくる。","s":135.252,"e":140.653,"p":false,"h":false},{"t":"貧しい者は、朽ちない木を選び、巧みな職人を探して、倒れない偶像を据えさせる(40:18-20)。","s":140.94,"e":147.351,"p":false,"h":false},{"t":"あなたがたは知らないのか。","s":147.636,"e":149.279,"p":false,"h":false},{"t":"聞いていないのか。","s":149.58,"e":150.643,"p":false,"h":false},{"t":"初めから、告げられなかったのか。","s":151.488,"e":153.695,"p":false,"h":false},{"t":"地の基が据えられたときから、悟らなかったのか(40:21)。","s":153.972,"e":157.036,"p":false,"h":false},{"t":"主は、地を覆う丸い天の上に座し、地の住民は、いなごのようだ。","s":157.32,"e":162.459,"p":false,"h":false},{"t":"主は、天を薄い布のように広げ、住むための天幕のように張られる(40:22)。","s":162.756,"e":167.664,"p":false,"h":false},{"t":"主は、君主たちを無にし、地をさばく者たちを、むなしいものとされる(40:23-24)。","s":167.94,"e":173.15,"p":true,"h":false},{"t":"「では、わたしをだれになぞらえて、わたしが等しくなるというのか」と、聖なる方は言われます。","s":173.808,"e":180.033,"p":false,"h":false},{"t":"目を高く上げて、見よ。","s":180.324,"e":182.127,"p":false,"h":false},{"t":"これらを創造したのはだれか。","s":182.448,"e":184.316,"p":false,"h":false},{"t":"その万象を数えて引き出し、一つ一つ名を呼ばれる方。","s":184.608,"e":188.614,"p":false,"h":false},{"t":"その力は強く、その勢いは大きく、一つも欠けることはありません(40:25-26)。","s":188.892,"e":193.888,"p":false,"h":false},{"t":"ヤコブよ、なぜ言うのか。","s":194.184,"e":195.852,"p":false,"h":false},{"t":"イスラエルよ、なぜ語るのか。","s":196.128,"e":198.076,"p":false,"h":false},{"t":"「私の道は主に隠されている。","s":198.36,"e":200.526,"p":false,"h":false},{"t":"私の訴えは、神に見過ごされている」と(40:27)。","s":200.808,"e":203.871,"p":false,"h":false},{"t":"あなたは知らないのか。","s":204.156,"e":205.536,"p":false,"h":false},{"t":"聞いていないのか。","s":206.064,"e":207.127,"p":false,"h":false},{"t":"主は、とこしえの神、地の果てまで創造された方。","s":207.972,"e":211.867,"p":false,"h":false},{"t":"疲れることなく、弱ることなく、その英知は測り知れません(40:28)。","s":212.148,"e":216.302,"p":false,"h":false},{"t":"疲れた者には力を与え、力のない者には勢いを増し加えられます。","s":216.612,"e":221.676,"p":false,"h":false},{"t":"若者も疲れ、弱り、若い男もつまずき倒れる。","s":221.976,"e":225.847,"p":false,"h":false},{"t":"しかし、主を待ち望む者は、新しく力を得、鷲のように翼を広げて上る。","s":226.152,"e":232.373,"p":false,"h":false},{"t":"走っても疲れず、歩いても弱ることがありません(40:29-31)。","s":232.668,"e":235.988,"p":true,"h":false},{"t":"各節の解説","s":236.664,"e":237.946,"p":true,"h":false},{"t":"1~2節で、「慰めよ」は、複数の命令形です。","s":238.608,"e":242.604,"p":false,"h":false},{"t":"だれに向けられているのか、天の会議の声なのか、預言者たちなのかは、はっきり語られていません。","s":242.892,"e":249.508,"p":false,"h":false},{"t":"ここから、イザヤ書の後半、40~66章が始まり、場面は、バビロンの地で苦しむ民へと移ります。","s":249.804,"e":257.94,"p":false,"h":false},{"t":"39章の宣告の、その先を見る言葉です。","s":258.228,"e":261.841,"p":true,"h":false},{"t":"2節の「二倍のものを受けた」は、罪の刑罰を二倍受けたという意味か、十分に受けたという意味か、読み方が分かれます。","s":262.476,"e":270.428,"p":false,"h":false},{"t":"ここでは、償いが終わり、さばきの時が満ちたという意味が中心です。","s":270.756,"e":275.345,"p":true,"h":false},{"t":"3~5節の「荒れ野に主の道を備えよ」は、新約聖書で、四つの福音書すべてが、洗礼者ヨハネの働きを説明するために引いています。","s":276.012,"e":285.895,"p":false,"h":false},{"t":"ここでは、バビロンから帰る民のために、主が道を備えられると読まれます。","s":286.2,"e":291.552,"p":false,"h":false},{"t":"のちに、キリストの来臨を準備する声として、さらに深い意味で成就した、というのが、改革派の伝統の読み方です。","s":291.852,"e":299.554,"p":true,"h":false},{"t":"6~8節の「草は枯れ、花はしぼむ。","s":300.204,"e":303.143,"p":false,"h":false},{"t":"しかし、神のことばは永遠に立つ」は、人間のはかなさと、神のことばの確かさを、対比した、この章の中心です。","s":303.444,"e":312.061,"p":false,"h":false},{"t":"新約聖書では、ペテロが、福音のことばについて、この言葉を引いています。","s":312.372,"e":317.999,"p":false,"h":false},{"t":"人は頼りなく、神のことばだけが頼りになる、ということが、イザヤ書全体の主題と重なっています。","s":318.276,"e":325.519,"p":true,"h":false},{"t":"9~11節で、主は、力ある王として来られながら、同時に、羊飼いとして、子羊を腕に抱かれます。","s":326.16,"e":334.19,"p":false,"h":false},{"t":"力と優しさが、ひとりの方の中にあることが示されています。","s":334.476,"e":338.754,"p":false,"h":false},{"t":"この姿は、のちに、イエスが「良い羊飼い」と語られる場面とも、結びつけられます。","s":339.048,"e":345.148,"p":true,"h":false},{"t":"12~17節の、神の大きさを語る問いは、バビロンの偉大な神々と力に圧倒された民への、答えです。","s":345.78,"e":353.893,"p":false,"h":false},{"t":"国々が、手おけのしずくのようだというのは、国々が重要でないという意味ではなく、神の偉大さの前では比べものにならない、という意味です。","s":354.168,"e":363.444,"p":true,"h":false},{"t":"18~20節の偶像の描写は、44章でも、より長く語られる主題の始まりです。","s":364.104,"e":370.917,"p":false,"h":false},{"t":"人が作ったものを神とする愚かさが、ここで、職人の仕事の細かな描写を通して、皮肉を込めて語られています。","s":371.232,"e":379.375,"p":true,"h":false},{"t":"25~26節の、星を一つ一つ名で呼ぶ方という言葉は、バビロンの人々が神として拝んだ星々さえ、主が創造し、数えておられるものだ、ということです。","s":380.016,"e":392.38,"p":true,"h":false},{"t":"27~28節の民の不平は、バビロンの地で、神に忘れられたと感じている人々の声です。","s":393.012,"e":400.239,"p":false,"h":false},{"t":"それに対する答えは、神の偉大さを、もう一度語ることです。","s":400.536,"e":404.995,"p":false,"h":false},{"t":"慰めの根拠は、神がどのようなお方かにあります。","s":405.288,"e":408.945,"p":true,"h":false},{"t":"31節の「主を待ち望む者は、新しく力を得る」は、聖書の中でもよく知られた約束の一つです。","s":409.572,"e":417.177,"p":false,"h":false},{"t":"「待ち望む」は、ただ待つというより、神に望みを置いて、期待して待つことです。","s":417.456,"e":422.922,"p":false,"h":false},{"t":"弱い者を引き上げる神への信頼が、人に、新しい力を与えます。","s":423.216,"e":428.081,"p":true,"h":false}]},{"title":"イザヤ書_41章","audio":"doc41_2610231055.mp3","dur":302.7,"segs":[{"t":"イザヤ書41章","s":0,"e":1.585,"p":true,"h":false},{"t":"全体の流れ","s":2.232,"e":3.337,"p":true,"h":false},{"t":"主は、島々と諸国民に、法廷に出て来るよう呼びかけられます。","s":4.14,"e":8.82,"p":false,"h":false},{"t":"「島々よ、私の前で静まれ。","s":9.108,"e":11.831,"p":false,"h":false},{"t":"国々は新しい力を得て、近づいて語れ。","s":12.132,"e":15.394,"p":false,"h":false},{"t":"共にさばきの場に進もう」(41:1)。","s":15.696,"e":17.43,"p":false,"h":false},{"t":"東から義をもって人を呼び起こし、その足もとに国々を渡し、王たちを打ち従わせたのはだれか。","s":17.712,"e":24.794,"p":false,"h":false},{"t":"剣は彼らをちりのように、弓はわらのように散らします。","s":25.092,"e":28.817,"p":false,"h":false},{"t":"それを行ったのは、初めから代々の人を呼ばれた主、初めであり、終わりと共にいる、わたしだ、と言われます(41:2-4)。","s":29.088,"e":37.063,"p":true,"h":false},{"t":"ところが、島々はこれを見て恐れ、互いに助け合って、「強くあれ」と励まし合います。","s":37.692,"e":43.973,"p":false,"h":false},{"t":"職人は金細工人を励まし、偶像を作る者は、「はんだ付けはよい」と言い、倒れないように釘で固定します(41:5-7)。","s":44.28,"e":51.905,"p":true,"h":false},{"t":"そこで、主はイスラエルに語られます。","s":52.56,"e":55.077,"p":false,"h":false},{"t":"「しかし、わたしのしもべイスラエルよ、わたしが選んだヤコブ、わたしの友アブラハムの子孫よ。","s":55.368,"e":61.686,"p":false,"h":false},{"t":"わたしは地の果てからあなたを連れ出し、その隅々からあなたを呼び、『あなたはわたしのしもべ。","s":61.992,"e":68.254,"p":false,"h":false},{"t":"わたしはあなたを選び、退けなかった』と言った」(41:8-9)。","s":68.544,"e":71.756,"p":false,"h":false},{"t":"そして、「恐れるな。","s":72.036,"e":73.399,"p":false,"h":false},{"t":"わたしはあなたとともにいる。","s":73.944,"e":75.622,"p":false,"h":false},{"t":"たじろぐな。","s":75.924,"e":76.66,"p":false,"h":false},{"t":"わたしがあなたの神だ。","s":77.832,"e":79.302,"p":false,"h":false},{"t":"わたしはあなたを強め、あなたを助け、わたしの義の右の手で、あなたを支える」と約束されます(41:10)。","s":79.74,"e":86.352,"p":true,"h":false},{"t":"あなたに怒りを燃やした者たちは恥を見、あなたと争う者たちは無に等しくなります。","s":86.976,"e":92.62,"p":false,"h":false},{"t":"「あなたの神、主であるわたしが、あなたの右手を固く握り、『恐れるな。","s":92.916,"e":97.998,"p":false,"h":false},{"t":"わたしがあなたを助ける』と言う」(41:11-13)。","s":98.28,"e":100.282,"p":false,"h":false},{"t":"「虫けらのヤコブよ、恐れるな。","s":100.584,"e":102.439,"p":false,"h":false},{"t":"イスラエルの人々よ。","s":102.744,"e":104.148,"p":false,"h":false},{"t":"わたしがあなたを助ける。","s":104.652,"e":106.187,"p":false,"h":false},{"t":"あなたを贖う者は、イスラエルの聖なる方」(41:14)。","s":106.56,"e":109.566,"p":false,"h":false},{"t":"主は、イスラエルを、新しい鋭い打穀機とし、山々を打ち砕かせます。","s":109.836,"e":115.115,"p":false,"h":false},{"t":"風はそれらを吹き散らします。","s":115.416,"e":117.254,"p":false,"h":false},{"t":"しかしイスラエルは、主にあって喜び、イスラエルの聖なる方によって誇ります(41:15-16)。","s":117.54,"e":122.928,"p":true,"h":false},{"t":"貧しい者や乏しい者が水を求めても、水がないとき、主ご自身が答えられます。","s":123.552,"e":129.69,"p":false,"h":false},{"t":"「わたしは、裸の丘に川を開き、谷間に泉を湧き出させ、荒れ野を水のある沼に、乾いた地を水の源にする」。","s":129.996,"e":138.646,"p":false,"h":false},{"t":"荒れ野には、杉、アカシア、ミルトス、オリーブの木が植えられます(41:17-19)。","s":138.924,"e":143.902,"p":false,"h":false},{"t":"それは、人々が、主の手がこれをなしたことを知り、悟るためです(41:20)。","s":144.18,"e":149.048,"p":true,"h":false},{"t":"最後に、主は再び偶像に挑まれます。","s":149.688,"e":152.687,"p":false,"h":false},{"t":"「あなたがたの訴えを出せ。","s":152.964,"e":154.63,"p":false,"h":false},{"t":"これから起こることを告げてみよ。","s":154.944,"e":156.922,"p":false,"h":false},{"t":"そうすれば、私たちはあなたがたが神であることを知る」(41:21-24)。","s":157.248,"e":160.983,"p":false,"h":false},{"t":"主は、北から人を起こし、日の昇る所から、わたしの名を呼ぶ者を起こされます。","s":161.28,"e":167.258,"p":false,"h":false},{"t":"彼は、陶器師が粘土を踏むように、支配者たちを踏みつけます(41:25)。","s":167.544,"e":172.001,"p":false,"h":false},{"t":"だれが初めからこれを告げたのか。","s":172.296,"e":174.421,"p":false,"h":false},{"t":"それはわたしだけです。","s":174.708,"e":176.064,"p":false,"h":false},{"t":"偶像は風であり、むなしいものです(41:26-29)。","s":176.616,"e":179.234,"p":true,"h":false},{"t":"各節の解説","s":179.892,"e":181.174,"p":true,"h":false},{"t":"2節の「東から義をもって呼び起こされた人」は、解釈が分かれます。","s":181.836,"e":186.718,"p":false,"h":false},{"t":"アブラハムを指すという読み方もあり、ペルシアの王キュロスを指すという読み方もあります。","s":186.984,"e":192.439,"p":false,"h":false},{"t":"25節の「北から起こされた者」と合わせると、キュロスを指すと読む立場が有力です。","s":192.708,"e":198.633,"p":false,"h":false},{"t":"ただし、いずれにしても、歴史を動かしているのは主ご自身だ、という点が大切です。","s":198.936,"e":205.059,"p":true,"h":false},{"t":"8~9節で、イスラエルが「しもべ」と呼ばれるのは、ここからイザヤ書の後半で何度も出てくる呼び方です。","s":205.704,"e":213.093,"p":false,"h":false},{"t":"「選んで、退けなかった」という言葉は、民の失敗にもかかわらず、神の選びが変わらないことを示します。","s":213.408,"e":221.113,"p":true,"h":false},{"t":"10節の「恐れるな。","s":221.76,"e":223.184,"p":false,"h":false},{"t":"わたしはあなたとともにいる」は、後半全体を貫く慰めの言葉です。","s":223.668,"e":228.625,"p":false,"h":false},{"t":"慰めの根拠が、民の強さではなく、「わたしがあなたの神だ」という神ご自身にあることに注意が必要です。","s":228.924,"e":236.506,"p":true,"h":false},{"t":"14節の「虫けら」は、イスラエルの弱さと小ささを表します。","s":237.168,"e":241.715,"p":false,"h":false},{"t":"そのような者を、神が「贖う者」と呼ばれる方として助けられます。","s":241.992,"e":246.644,"p":false,"h":false},{"t":"「贖う者」は、近い親類が助け出す務めを指す言葉で、神がイスラエルの最も近い者となってくださる、という意味があります。","s":246.924,"e":255.398,"p":true,"h":false},{"t":"15~16節の、虫けらのようなイスラエルが山々を打ち砕くという言葉は、力の逆転を語ります。","s":256.032,"e":263.562,"p":false,"h":false},{"t":"ただし、これは、イスラエルの力によるのではなく、主が力を与えてくださることによる、という意味です。","s":263.844,"e":270.778,"p":true,"h":false},{"t":"17~19節の荒れ野の回復は、35章で語られた望みと、同じ姿です。","s":271.44,"e":277.599,"p":false,"h":false},{"t":"ここでは、バビロンから帰る道の備えとして、具体的に語られています。","s":277.92,"e":283.033,"p":true,"h":false},{"t":"21~29節の、偶像との論争は、後半の大きな主題です。","s":283.68,"e":289.156,"p":false,"h":false},{"t":"偶像は、将来を告げることができません。","s":289.44,"e":292.438,"p":false,"h":false},{"t":"しかし、主は、これから起こることを前もって告げられます。","s":292.752,"e":296.751,"p":false,"h":false},{"t":"預言が成就することが、主が唯一の神であることの証しとなっています。","s":297.036,"e":302.038,"p":true,"h":false}]},{"title":"イザヤ書_42章","audio":"doc42_2610231055.mp3","dur":352.7,"segs":[{"t":"イザヤ書42章","s":0,"e":1.546,"p":true,"h":false},{"t":"全体の流れ","s":2.196,"e":3.301,"p":true,"h":false},{"t":"42章は、「見よ、わたしのしもべ」と始まります。","s":4.104,"e":7.99,"p":false,"h":false},{"t":"「わたしが支える者、わたしが選び、わたしの心が喜ぶ者。","s":8.28,"e":12.782,"p":false,"h":false},{"t":"わたしは彼の上にわたしの霊を授け、彼は国々に公正をもたらす」(42:1)。","s":13.068,"e":18.01,"p":false,"h":false},{"t":"彼は、叫ばず、声を上げず、その声を通りに聞かせません。","s":18.324,"e":23.043,"p":false,"h":false},{"t":"傷ついた葦を折らず、くすぶる灯心を消さず、真実をもって公正をもたらします(42:2-3)。","s":23.364,"e":29.289,"p":false,"h":false},{"t":"彼は衰えず、くじけず、ついには地に公正を打ち立てます。","s":29.556,"e":33.888,"p":false,"h":false},{"t":"島々は彼の教えを待ち望みます(42:4)。","s":34.164,"e":36.666,"p":true,"h":false},{"t":"天を創造し、これを広げ、地とそこから出るものを敷き広げ、地の上の民に息を与えられる神である主は、このしもべに語られます。","s":37.296,"e":47.084,"p":false,"h":false},{"t":"「わたしは、義をもってあなたを呼び、あなたの手を握り、あなたを守り、あなたを民の契約、国々の光とする。","s":47.376,"e":55.743,"p":false,"h":false},{"t":"それは、見えない目を開き、囚人を牢から、闇に住む者を獄屋から連れ出すためだ」(42:5-7)。","s":56.052,"e":62.277,"p":false,"h":false},{"t":"「わたしは主、これがわたしの名。","s":62.568,"e":64.775,"p":false,"h":false},{"t":"わたしの栄光を他の者に与えず、わたしの誉れを偶像に与
