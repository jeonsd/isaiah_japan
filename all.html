"e":60.322,"p":false,"h":false},{"t":"主が、あなたを輝かされたからだ(55:5)。","s":60.624,"e":63.204,"p":true,"h":false},{"t":"「主を求めよ。","s":63.864,"e":64.9,"p":false,"h":false},{"t":"お会いできる間に。","s":65.772,"e":67.024,"p":false,"h":false},{"t":"呼べ。","s":67.68,"e":68.103,"p":false,"h":false},{"t":"近くにおられるうちに」(55:6)。","s":68.4,"e":69.817,"p":false,"h":false},{"t":"悪しき者は、その道を捨て、不義の者は、その思いを捨てて、主に立ち返れ。","s":70.308,"e":75.94,"p":false,"h":false},{"t":"そうすれば、主は、あわれんでくださる。","s":76.248,"e":78.818,"p":false,"h":false},{"t":"私たちの神に立ち返れ。","s":79.128,"e":80.959,"p":false,"h":false},{"t":"豊かに赦してくださるからだ(55:7)。","s":81.252,"e":83.116,"p":true,"h":false},{"t":"「わたしの思いは、あなたがたの思いと異なり、あなたがたの道は、わたしの道と異なる」と主は言われます(55:8)。","s":83.772,"e":91.198,"p":false,"h":false},{"t":"天が地よりも高いように、わたしの道は、あなたがたの道よりも高く、わたしの思いは、あなたがたの思いよりも高い(55:9)。","s":91.476,"e":99.874,"p":false,"h":false},{"t":"雨や雪が、天から降って、そこに戻らず、地を潤し、芽を出させ、種蒔く人に種を与え、食べる人にパンを与える。","s":100.152,"e":109.175,"p":false,"h":false},{"t":"そのように、わたしの口から出る、わたしのことばも、むなしく、わたしのもとに帰ることはなく、わたしの望むことを成し遂げ、わたしが遣わした所で、成功する(55:10-11)。","s":109.44,"e":120.726,"p":true,"h":false},{"t":"「まことに、あなたがたは喜んで出て行き、平安のうちに導かれて行く。","s":121.356,"e":126.268,"p":false,"h":false},{"t":"山々や丘は、あなたがたの前で、喜びの声を上げ、野の木々もみな、手を打ち鳴らす」(55:12)。","s":126.576,"e":133.181,"p":false,"h":false},{"t":"いばらの代わりに糸杉が生え、おどろの代わりにミルトスが生える。","s":133.488,"e":137.677,"p":false,"h":false},{"t":"これは、主の名となり、絶えることのない永遠のしるしとなる(55:13)。","s":137.952,"e":141.979,"p":true,"h":false},{"t":"各節の解説","s":142.632,"e":143.914,"p":true,"h":false},{"t":"1節の「金のない者も来て、買って食べよ」は、救いが、代価なしに、恵みとして与えられることを、市場の呼び声にたとえています。","s":144.576,"e":154.018,"p":false,"h":false},{"t":"「金も代価も払わずに」という言葉は、52章3節の「代価なしで贖われる」と、つながっています。","s":154.332,"e":161.461,"p":false,"h":false},{"t":"この言葉は、新約聖書の、恵みによる救いの教えと響き合うと、改革派の伝統は読んできました。","s":161.748,"e":168.992,"p":true,"h":false},{"t":"2節の「パンでないもののために労する」は、人が、本当に満たされないものを追い求めて、疲れていることを指摘します。","s":169.632,"e":177.713,"p":false,"h":false},{"t":"バビロンの繁栄の中で、物質的な豊かさに心が向きやすい民への、問いかけとして読めます。","s":177.984,"e":184.527,"p":true,"h":false},{"t":"3節の「ダビデへの確かな恵み」は、解釈が分かれる箇所です。","s":185.148,"e":189.561,"p":false,"h":false},{"t":"ダビデの王座の約束が、ここでは、王一人ではなく、民全体に広げられている、と読む立場があります。","s":189.864,"e":197.477,"p":false,"h":false},{"t":"使徒の働きで、パウロが、イエスの復活を語るときに、この箇所を、ダビデへの約束の成就として引いています。","s":197.748,"e":205.415,"p":true,"h":false},{"t":"4節の「彼」が誰を指すかは、はっきりしません。","s":206.064,"e":209.224,"p":false,"h":false},{"t":"ダビデを指すという読み方、のちに来られるダビデの子を指すという読み方があります。","s":209.52,"e":214.836,"p":false,"h":false},{"t":"ただし、いずれにしても、諸国民への証人という務めが語られています。","s":215.136,"e":220.139,"p":true,"h":false},{"t":"6~7節の「主を求めよ。","s":220.788,"e":222.949,"p":false,"h":false},{"t":"お会いできる間に」は、悔い改めへの招きです。","s":223.236,"e":226.501,"p":false,"h":false},{"t":"「豊かに赦してくださる」という言葉は、神の赦しが、少しだけでなく、あふれるほどであることを示します。","s":226.8,"e":234.115,"p":true,"h":false},{"t":"8~9節の「わたしの思いは、あなたがたの思いと異なる」は、これだけ取り出すと、神は人にはわからない方だ、という意味に聞こえるかもしれません。","s":234.756,"e":244.577,"p":false,"h":false},{"t":"しかし、この言葉は、すぐ前の7節の、赦しの約束の理由として語られています。","s":244.872,"e":251.113,"p":false,"h":false},{"t":"人なら赦さないような者を、神は豊かに赦される、という意味に読むのが、文脈に合っています。","s":251.424,"e":257.836,"p":true,"h":false},{"t":"10~11節の、雨と雪の比喩は、神のことばが、必ず目的を果たすことを語ります。","s":258.48,"e":265.181,"p":false,"h":false},{"t":"この言葉は、イザヤ書全体の、結びのようにも読めます。","s":265.464,"e":269.614,"p":false,"h":false},{"t":"40章8節で、「神のことばは永遠に立つ」と語られた主題が、ここで、もう一度、語られています。","s":269.892,"e":277.271,"p":true,"h":false},{"t":"12~13節の、山々の喜びと、いばらの代わりに糸杉が生える描写は、35章の荒れ野の回復や、51章3節の、エデンのような回復と、つながっています。","s":277.92,"e":290.709,"p":false,"h":false},{"t":"この章は、前半の、40~55章の結びとして、読まれることが多いです。","s":291.024,"e":296.96,"p":true,"h":false}]},{"title":"イザヤ書_56章","audio":"doc56_2610231055.mp3","dur":201.6,"segs":[{"t":"イザヤ書56章","s":0,"e":1.548,"p":true,"h":false},{"t":"全体の流れ","s":2.196,"e":3.301,"p":true,"h":false},{"t":"主は言われます。","s":4.104,"e":5.143,"p":false,"h":false},{"t":"「公正を守り、正義を行え。","s":6.012,"e":8.297,"p":false,"h":false},{"t":"わたしの救いが来るのは近く、わたしの義が現れるのも近いからだ」(56:1)。","s":8.604,"e":13.205,"p":false,"h":false},{"t":"安息日を守って汚さず、どんな悪にも手を出さない人は幸いです(56:2)。","s":13.5,"e":18.18,"p":true,"h":false},{"t":"主に連なる異邦人は、「主は私を、その民から切り離される」と言ってはなりません。","s":18.828,"e":24.701,"p":false,"h":false},{"t":"宦官も、「私は枯れ木だ」と言ってはなりません(56:3)。","s":25.02,"e":28.183,"p":false,"h":false},{"t":"主は、安息日を守り、わたしの喜ぶことを選び、わたしの契約を堅く守る宦官に、わたしの家と城壁の内に、息子や娘にまさる記念の名を与え、絶えることのない永遠の名を与えます(56:4-5)。","s":28.476,"e":42.488,"p":false,"h":false},{"t":"主に連なって仕え、主の名を愛し、そのしもべとなる異邦人も、わたしの聖なる山に導き、祈りの家で喜ばせます。","s":42.768,"e":51.411,"p":false,"h":false},{"t":"そのささげ物は受け入れられ、「わたしの家は、すべての民の祈りの家と呼ばれる」と言われます(56:6-7)。","s":51.696,"e":58.119,"p":false,"h":false},{"t":"追い散らされたイスラエルを集める主は、言われます。","s":58.428,"e":61.724,"p":false,"h":false},{"t":"「すでに集められた者たちに、さらに他の者たちを集める」(56:8)。","s":62.028,"e":66.01,"p":true,"h":false},{"t":"ところが、後半は、指導者たちへの厳しい言葉に変わります。","s":66.636,"e":71.088,"p":false,"h":false},{"t":"野のすべての獣よ、来て食べよ。","s":71.388,"e":73.683,"p":false,"h":false},{"t":"見張りたちは盲目で、何も知らず、みな吠えることのできない犬、横になって夢を見て、眠りをむさぼる犬です。","s":74.016,"e":82.116,"p":false,"h":false},{"t":"この犬たちは貪欲で、足ることを知りません。","s":82.404,"e":85.452,"p":false,"h":false},{"t":"羊飼いたちにも悟りがありません。","s":85.752,"e":87.975,"p":false,"h":false},{"t":"みな自分の道に向かい、おのおの自分の利得を求めています(56:9-11)。","s":88.272,"e":92.502,"p":false,"h":false},{"t":"「さあ、ぶどう酒を持って来い。","s":92.772,"e":94.757,"p":false,"h":false},{"t":"強い酒に酔おう。","s":95.04,"e":96.279,"p":false,"h":false},{"t":"明日も今日のように、いや、もっと素晴らしいだろう」と言っています(56:12)。","s":96.948,"e":101.128,"p":true,"h":false},{"t":"各節の解説","s":101.772,"e":103.054,"p":true,"h":false},{"t":"1節の「公正を守り、正義を行え」は、救いが近いという約束への、民の応答として語られています。","s":103.716,"e":111.345,"p":false,"h":false},{"t":"救いは恵みですが、その恵みを受けた者は、公正と正義に歩む、という順序です。","s":111.636,"e":117.971,"p":true,"h":false},{"t":"3~5節の宦官への約束は、特に重い意味を持っています。","s":118.62,"e":122.875,"p":false,"h":false},{"t":"申命記の律法では、一定の人々は主の会衆に加われないとされていました。","s":123.192,"e":128.749,"p":false,"h":false},{"t":"ここでは、その壁が取り払われると語られます。","s":129.024,"e":132.262,"p":false,"h":false},{"t":"外側の条件ではなく、主の契約を守る心が、神の民のしるしとされています。","s":132.552,"e":138.626,"p":false,"h":false},{"t":"この節は、使徒の働きで、エチオピアの宦官が受け入れられる場面を思い起こさせる、と読まれることがあります。","s":138.924,"e":146.469,"p":true,"h":false},{"t":"6~7節の「すべての民の祈りの家」は、新約聖書で、イエスが宮を清められたとき、引かれた言葉です。","s":147.096,"e":154.785,"p":false,"h":false},{"t":"神殿が、一つの民だけの場所ではなく、すべての民のための祈りの家であることを、イエスは示されました。","s":155.088,"e":162.569,"p":true,"h":false},{"t":"8節の「さらに他の者たちを集める」は、神の民の広がりが、イスラエルの帰還だけにとどまらないことを語ります。","s":163.188,"e":171.118,"p":false,"h":false},{"t":"この言葉が、どの範囲まで及ぶのかについては、読み方が分かれます。","s":171.396,"e":176.243,"p":true,"h":false},{"t":"9~12節の「吠えることのできない犬」は、見張りの務めを果たさない指導者への、強い皮肉です。","s":176.868,"e":183.809,"p":false,"h":false},{"t":"危険を知らせるはずの者が、眠っています。","s":184.104,"e":186.956,"p":false,"h":false},{"t":"この指導者批判は、39章までの、イザヤの時代の指導者批判と、似た響きを持っています。","s":187.236,"e":194.329,"p":false,"h":false},{"t":"ここでの描写が、帰還後の共同体のことなのか、捕囚前のことなのかは、はっきりしません。","s":194.616,"e":200.978,"p":true,"h":false}]},{"title":"イザヤ書_57章","audio":"doc57_2610231055.mp3","dur":333,"segs":[{"t":"イザヤ書57章","s":0,"e":1.611,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"57章は、義人が滅びても、だれも心に留めないという嘆きから始まります。","s":4.176,"e":10.054,"p":false,"h":false},{"t":"誠実な人が取り去られても、だれも悟りません。","s":10.368,"e":13.691,"p":false,"h":false},{"t":"義人は、わざわいから取り去られ、平安に入ります。","s":14.004,"e":17.623,"p":false,"h":false},{"t":"まっすぐに歩む人は、その寝床で安らぎます(57:1-2)。","s":17.928,"e":21.246,"p":true,"h":false},{"t":"次に、偶像礼拝にふける者たちに、主が語られます。","s":21.888,"e":26.026,"p":false,"h":false},{"t":"「魔女の子らよ、姦夫と遊女の子孫よ、ここに近づけ」。","s":26.316,"e":30.305,"p":false,"h":false},{"t":"あなたがたは、だれをあざけり、口を開き、舌を出すのか。","s":30.6,"e":34.964,"p":false,"h":false},{"t":"あなたがたは、背く者の子、偽りの子孫ではないか(57:3-4)。","s":35.244,"e":39.2,"p":false,"h":false},{"t":"樫の木の間、青々としたすべての木の下で、欲情に燃え、谷間で子どもを殺し、岩の割れ目の下でささげる者たちです(57:5)。","s":39.492,"e":48.181,"p":false,"h":false},{"t":"谷の滑らかな石の中に、あなたの分があり、その石に、あなたは飲み物のささげ物を注ぎました。","s":48.492,"e":55.536,"p":false,"h":false},{"t":"わたしは、これらのことで、なだめられるだろうか(57:6)。","s":55.836,"e":59.094,"p":false,"h":false},{"t":"高い山の上に寝床を設け、そこにいけにえをささげ、扉の後ろに、記念の物を置きます。","s":59.4,"e":66.001,"p":false,"h":false},{"t":"あなたは、わたしを離れて裸になり、寝床を広げ、彼らと契約を結びました(57:7-8)。","s":66.276,"e":72.24,"p":false,"h":false},{"t":"王のところへ油を携えて行き、香油を増し加え、使者を遠くへ送り、陰府にまでへりくだらせました(57:9)。","s":72.54,"e":79.583,"p":false,"h":false},{"t":"あなたは、長い道のりに疲れても、「だめだ」とは言わず、力を新たにして、弱ることがありませんでした(57:10)。","s":79.884,"e":87.125,"p":true,"h":false},{"t":"「あなたは、だれを恐れ、おののいて偽りを言い、わたしを思わず、心に留めなかったのか。","s":87.768,"e":94.162,"p":false,"h":false},{"t":"わたしが長い間、黙っていたから、あなたは、わたしを恐れないのか」(57:11)。","s":94.464,"e":99.52,"p":false,"h":false},{"t":"「わたしは、あなたの義を告げよう。","s":99.792,"e":102.106,"p":false,"h":false},{"t":"あなたのわざも、あなたの役には立たない。","s":102.42,"e":104.955,"p":false,"h":false},{"t":"あなたが叫ぶとき、あなたが集めた物に、救わせてみよ。","s":105.264,"e":109.398,"p":false,"h":false},{"t":"風がそれらをみな吹き飛ばし、息が運び去る」。","s":109.692,"e":112.87,"p":false,"h":false},{"t":"しかし、わたしに身を寄せる者は、地を受け継ぎ、わたしの聖なる山を所有します(57:12-13)。","s":113.148,"e":119.125,"p":true,"h":false},{"t":"ここで、主の声が変わります。","s":119.772,"e":121.877,"p":false,"h":false},{"t":"「盛り上げよ、盛り上げよ、道を整えよ。","s":122.148,"e":125.195,"p":false,"h":false},{"t":"わたしの民の道から、つまずきを取り除け」(57:14)。","s":125.496,"e":128.639,"p":false,"h":false},{"t":"高く、あがめられ、永遠に住み、その名が聖なる方は言われます。","s":128.952,"e":133.81,"p":false,"h":false},{"t":"「わたしは、高く聖なる所に住み、また、砕かれて、へりくだった霊の人とともに住む。","s":134.1,"e":140.517,"p":false,"h":false},{"t":"それは、へりくだった者の霊を生き返らせ、砕かれた者の心を生き返らせるためだ」(57:15)。","s":140.832,"e":146.667,"p":false,"h":false},{"t":"わたしは、とこしえに争わず、いつまでも怒らない。","s":146.952,"e":150.644,"p":false,"h":false},{"t":"わたしが造った人の霊と、いのちが、わたしの前で衰えるからです(57:16)。","s":150.912,"e":155.583,"p":false,"h":false},{"t":"貪欲の罪のため、わたしは怒り、彼を打ち、顔を隠して怒りました。","s":155.88,"e":161.135,"p":false,"h":false},{"t":"しかし、彼は背き続け、自分の心の道を歩みました(57:17)。","s":161.424,"e":165.825,"p":false,"h":false},{"t":"「わたしは彼の道を見た。","s":166.104,"e":167.76,"p":false,"h":false},{"t":"しかし、彼をいやし、導き、慰めを彼と、彼のうちの嘆く者たちに戻そう」(57:18)。","s":168.048,"e":174.595,"p":false,"h":false},{"t":"わたしは、くちびるの実を創造する。","s":174.888,"e":177.439,"p":false,"h":false},{"t":"遠い者にも、近い者にも、平安、平安があるように。","s":177.732,"e":181.762,"p":false,"h":false},{"t":"わたしは彼をいやす、と主は言われます(57:19)。","s":182.052,"e":184.737,"p":false,"h":false},{"t":"しかし、悪者は、休むことのできない、荒れた海のようです。","s":185.04,"e":189.458,"p":false,"h":false},{"t":"その水は、泥と汚物を吹き上げます。","s":189.756,"e":192.459,"p":false,"h":false},{"t":"「悪者には平安がない」と、わたしの神は言われます(57:20-21)。","s":192.744,"e":196.286,"p":true,"h":false},{"t":"各節の解説","s":196.92,"e":198.202,"p":true,"h":false},{"t":"1~2節は、義人の死に対する人々の無関心を嘆く言葉です。","s":198.864,"e":203.794,"p":false,"h":false},{"t":"義人が取り去られるのは、さばきの前に守られているのだ、と読む立場があります。","s":204.084,"e":209.627,"p":false,"h":false},{"t":"この節の細部には、読み方が分かれるところもあります。","s":209.916,"e":213.671,"p":true,"h":false},{"t":"3~13節の長い偶像礼拝の描写は、特に難しい箇所です。","s":214.308,"e":219.492,"p":false,"h":false},{"t":"木の下、谷、岩の割れ目といった場所は、当時の異教の礼拝が行われた場所を指します。","s":219.78,"e":226.348,"p":false,"h":false},{"t":"「子どもを殺し」は、モレクなどへの、子どもを犠牲にする儀式を指すと読まれます。","s":226.62,"e":231.962,"p":false,"h":false},{"t":"9節の、「王」への使者と油も、異教の神、または外国の王との関係を指すと、読み方が分かれます。","s":232.236,"e":239.682,"p":false,"h":false},{"t":"細部を一つに決めるより、神以外のものに頼って、疲れ果てた姿として、読むのが穏当です。","s":239.976,"e":246.679,"p":true,"h":false},{"t":"10節の、「長い道のりに疲れても、『だめだ』と言わなかった」は、皮肉を含んでいます。","s":247.32,"e":253.283,"p":false,"h":false},{"t":"偶像礼拝のためには、疲れを知らずに力を尽くす民の姿です。","s":253.584,"e":258.468,"p":false,"h":false},{"t":"これが、神を求めることには、向けられていないという指摘です。","s":258.768,"e":263.111,"p":true,"h":false},{"t":"15節は、この章の中心です。","s":263.772,"e":266.399,"p":false,"h":false},{"t":"高く聖なる所に住まわれる神が、同時に、砕かれ、へりくだった者とともに住まわれる、と語られます。","s":266.688,"e":274.193,"p":false,"h":false},{"t":"神の高さと近さが、一つの言葉の中にあります。","s":274.464,"e":278.091,"p":false,"h":false},{"t":"新約聖書では、「悔いた心の者は幸いだ」という言葉との響き合いが、指摘されます。","s":278.388,"e":284.658,"p":false,"h":false},{"t":"改革派の神学が、神の超越と内在を語るときに、よく引かれる箇所です。","s":284.976,"e":290.602,"p":true,"h":false},{"t":"16節の「とこしえに争わず、いつまでも怒らない」は、神の怒りが、人の弱さを知った上での、限りあるものであることを示します。","s":291.24,"e":300.715,"p":true,"h":false},{"t":"18~19節の「いやし」は、バビロンからの帰還の回復と、罪の癒やしの、両方を含むと読まれます。","s":301.356,"e":309.032,"p":false,"h":false},{"t":"19節の「遠い者にも、近い者にも」は、新約聖書で、パウロが、エペソ人への手紙2章で、ユダヤ人と異邦人の和解を語る際に、引いています。","s":309.312,"e":320.241,"p":true,"h":false},{"t":"20~21節の、荒れた海のような悪者の描写は、悪者の内側に、平安が育たないことを表します。","s":320.904,"e":328.71,"p":false,"h":false},{"t":"48章22節と、ほぼ同じ形です。","s":329.004,"e":332.321,"p":true,"h":false}]},{"title":"イザヤ書_58章","audio":"doc58_2610231055.mp3","dur":298.1,"segs":[{"t":"イザヤ書58章","s":0,"e":1.576,"p":true,"h":false},{"t":"全体の流れ","s":2.232,"e":3.337,"p":true,"h":false},{"t":"58章は、「声を限りに叫べ。","s":4.14,"e":6.765,"p":false,"h":false},{"t":"角笛のように声を張り上げ、わたしの民に、その背きを告げよ」という命令で始まります(58:1)。","s":7.056,"e":13.329,"p":false,"h":false},{"t":"民は、日ごとにわたしを求め、わたしの道を知ることを望んでいます。","s":13.608,"e":18.539,"p":false,"h":false},{"t":"義を行い、神の定めを捨てなかった国民のようです。","s":18.828,"e":22.487,"p":false,"h":false},{"t":"義なるさばきをわたしに求め、神に近づくことを望んでいます(58:2)。","s":22.788,"e":27.156,"p":true,"h":false},{"t":"そこで民は問います。","s":27.792,"e":29.195,"p":false,"h":false},{"t":"「なぜ、私たちが断食しても、あなたはご覧にならず、私たちが身を低くしても、お気づきにならないのですか」(58:3)。","s":29.7,"e":37.264,"p":false,"h":false},{"t":"主は答えます。","s":37.548,"e":38.601,"p":false,"h":false},{"t":"「見よ、あなたがたは、断食の日に、自分の利益を追い求め、働く者をみな、しいたげている」(58:3)。","s":39.456,"e":46.281,"p":false,"h":false},{"t":"断食しながら、争いとけんかを起こし、悪の拳で打っています。","s":46.584,"e":51.378,"p":false,"h":false},{"t":"今日のような断食では、あなたがたの声は、天に届きません(58:4)。","s":51.66,"e":56.035,"p":true,"h":false},{"t":"「わたしの選ぶ断食は、こうではないか。","s":56.7,"e":59.451,"p":false,"h":false},{"t":"悪の鎖を解き、くびきの縄をほどき、虐げられた人々を自由の身とし、すべてのくびきを砕くこと。","s":59.724,"e":67.321,"p":false,"h":false},{"t":"飢えた人にあなたのパンを分け与え、さまよう貧しい人を家に入れ、裸の人を見て、これに着せ、自分の肉親に、あなたの身を隠さないことではないか」(58:5-7)。","s":67.608,"e":78.14,"p":true,"h":false},{"t":"そうすれば、あなたの光は、暁のように輝き出し、あなたの傷は、すみやかに癒やされます。","s":78.768,"e":85.911,"p":false,"h":false},{"t":"あなたの義があなたの前を行き、主の栄光が、あなたのしんがりとなります(58:8)。","s":86.184,"e":91.252,"p":false,"h":false},{"t":"そのとき、あなたが呼ぶと、主は答え、あなたが叫ぶと、「わたしはここにいる」と言われます。","s":91.548,"e":98.131,"p":false,"h":false},{"t":"もし、あなたの中から、くびきと、指さしと、悪意のある言葉を除き、飢えた人に心を注ぎ、苦しめられた人の願いを満たすなら、あなたの光は、闇の中で輝き、あなたの暗闇は、真昼のようになります(58:9-10)。","s":98.424,"e":114.062,"p":false,"h":false},{"t":"主は、絶えずあなたを導き、焼けつく土地であなたのたましいを満たし、あなたの骨を強くされます。","s":114.336,"e":121.318,"p":false,"h":false},{"t":"あなたは、潤された園のように、水の涸れない源のようになります(58:11)。","s":121.608,"e":126.526,"p":false,"h":false},{"t":"あなたの子らは、昔からの廃墟を建て直し、あなたは、代々の土台を立て直します。","s":126.792,"e":133.115,"p":false,"h":false},{"t":"あなたは、「破れ口を修復する者」、「住める道に直す者」と呼ばれます(58:12)。","s":133.38,"e":138.355,"p":true,"h":false},{"t":"最後に、安息日についての約束が語られます。","s":138.996,"e":142.401,"p":false,"h":false},{"t":"もし、安息日に旅を控え、わたしの聖なる日に、自分の好むことをせず、安息日を「楽しい日」、主の聖日を「尊ぶべき日」と呼び、これを尊んで、自分の道を行わず、自分の好むことを求めず、むだ話をしないなら、あなたは主を、あなたの喜びとする。","s":142.668,"e":161.88,"p":false,"h":false},{"t":"わたしは、あなたを、地の高い所に乗らせ、あなたの父ヤコブの相続地で、あなたを養う。","s":162.18,"e":168.889,"p":false,"h":false},{"t":"主の口が語られた(58:13-14)。","s":169.2,"e":170.721,"p":true,"h":false},{"t":"各節の解説","s":171.36,"e":172.642,"p":true,"h":false},{"t":"1節の、「声を限りに叫べ」という命令は、預言者が、遠慮せずに、民の罪を語らなければならないことを示します。","s":173.304,"e":181.934,"p":false,"h":false},{"t":"民は、自分を信仰深い者と思っていたので、この指摘は、驚くべきものです。","s":182.232,"e":188.076,"p":true,"h":false},{"t":"3~5節の断食の問答は、礼拝や宗教的な行いが、日常の不正と切り離されている、という指摘です。","s":188.712,"e":197.027,"p":false,"h":false},{"t":"1章の、形だけの礼拝への批判と、同じ流れにあります。","s":197.316,"e":201.496,"p":false,"h":false},{"t":"断食自体が悪いのではなく、断食しながら、弱い者を虐げることが、問題とされています。","s":201.78,"e":208.616,"p":true,"h":false},{"t":"6~7節の、悪の鎖を解き、飢えた人にパンを分けるという描写は、神の望まれる信仰の姿を、具体的に語ります。","s":209.268,"e":218.273,"p":false,"h":false},{"t":"祈りや断食が、貧しい人への憐れみに結びついてこそ、神に届く、ということです。","s":218.556,"e":224.901,"p":false,"h":false},{"t":"新約聖書でも、ヤコブの手紙などに、似た教えがあります。","s":225.216,"e":229.492,"p":false,"h":false},{"t":"ただし、これは、行いによって救いを得るという意味ではなく、救われた者の歩みの姿として、読まれるべきです。","s":229.788,"e":237.211,"p":true,"h":false},{"t":"8~9節の約束は、「そうすれば」という言葉で始まります。","s":237.852,"e":242.343,"p":false,"h":false},{"t":"ここは、条件付きの約束のように見えます。","s":242.64,"e":245.707,"p":false,"h":false},{"t":"行いによる救いを教えているのではなく、神を信頼する者が、憐れみの行いに生きるとき、神との交わりが、さらに豊かになる、という意味に読まれます。","s":245.988,"e":256.732,"p":true,"h":false},{"t":"12節の「破れ口を修復する者」は、崩れた城壁を直す者という意味で、民が、エルサレムの再建に携わることを語っています。","s":257.364,"e":266.493,"p":false,"h":false},{"t":"ネヘミヤ記の、城壁の再建の働きと関係づけて読まれることがあります。","s":266.832,"e":271.987,"p":true,"h":false},{"t":"13~14節の安息日についての言葉は、安息日が、重荷ではなく、喜びの日であることを示します。","s":272.628,"e":280.618,"p":false,"h":false},{"t":"ここでも、外側の規則より、神を喜ぶ心が、中心とされています。","s":280.908,"e":286.347,"p":false,"h":false},{"t":"この安息日の理解が、新約聖書の教会で、どのように受け継がれるかについては、読み方が分かれますので、ここでは、細かい適用には立ち入りません。","s":286.632,"e":297.454,"p":true,"h":false}]},{"title":"イザヤ書_59章","audio":"doc59_2610231055.mp3","dur":369.8,"segs":[{"t":"イザヤ書59章","s":0,"e":1.601,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"59章は、主の力についての宣言から始まります。","s":4.176,"e":8.332,"p":false,"h":false},{"t":"「見よ、主の御手は短くて、救えないのではない。","s":8.64,"e":12.052,"p":false,"h":false},{"t":"主の耳は遠くて、聞こえないのではない」(59:1)。","s":12.312,"e":15.05,"p":false,"h":false},{"t":"むしろ、あなたがたの咎が、あなたがたと神との間を隔て、あなたがたの罪が、御顔を隠させ、聞いてくださらないようにしているのです(59:2)。","s":15.336,"e":24.605,"p":false,"h":false},{"t":"あなたがたの手は血で汚れ、指は咎で汚れ、くちびるは偽りを語り、舌は不正をつぶやいています(59:3)。","s":24.912,"e":32.055,"p":false,"h":false},{"t":"だれも正しく訴えず、むなしいものに頼り、偽りを語り、害悪をはらんで、不法を産みます(59:4)。","s":32.364,"e":39.17,"p":true,"h":false},{"t":"彼らは、毒蛇の卵をかえし、蜘蛛の巣を織ります。","s":39.816,"e":43.758,"p":false,"h":false},{"t":"その卵を食べる者は死に、それが砕かれると、蛇が飛び出します(59:5)。","s":44.028,"e":48.817,"p":false,"h":false},{"t":"その巣は、衣服になりません。","s":49.104,"e":51.171,"p":false,"h":false},{"t":"彼らの行いは、不法の行いで、その手には暴虐のわざがあります(59:6)。","s":51.48,"e":56.361,"p":false,"h":false},{"t":"彼らの足は、悪に走り、罪のない血を流すことに急ぎ、その思いは不義の思いで、荒廃と破滅が、その道筋にあります(59:7)。","s":56.628,"e":66.072,"p":false,"h":false},{"t":"彼らは、平和の道を知らず、その歩みに公正はありません。","s":66.348,"e":70.736,"p":false,"h":false},{"t":"曲がった道を作り、これを歩む者はみな、平和を知りません(59:8)。","s":71.028,"e":75.351,"p":true,"h":false},{"t":"ここで、民が告白をします。","s":75.996,"e":78.164,"p":false,"h":false},{"t":"「それゆえ、公正は私たちから遠く離れ、義は私たちに追いつかない。","s":78.444,"e":83.479,"p":false,"h":false},{"t":"私たちは光を待ち望むが、闇ばかりで、輝きを待ち望むが、暗がりを歩む」(59:9)。","s":83.772,"e":89.911,"p":false,"h":false},{"t":"私たちは、盲人のように壁を手探りし、目のない者のように手探りします。","s":90.216,"e":95.772,"p":false,"h":false},{"t":"真昼にも、夕暮れのようにつまずき、強健な者の中で、死人のようです(59:10)。","s":96.084,"e":101.479,"p":false,"h":false},{"t":"私たちはみな、熊のようにうなり、鳩のようにうめきます。","s":101.772,"e":105.802,"p":false,"h":false},{"t":"公正を待ち望んでも、それはなく、救いを待ち望んでも、それは遠く離れています(59:11)。","s":106.092,"e":111.959,"p":false,"h":false},{"t":"「私たちの背きは、あなたの前で増し、私たちの罪は、私たちに不利な証言をします。","s":112.248,"e":118.916,"p":false,"h":false},{"t":"私たちの背きは、私たちとともにあり、私たちは自分の咎を知っています」(59:12)。","s":119.196,"e":124.625,"p":false,"h":false},{"t":"主に背き、主を否み、神に従うことから、離れ去り、しいたげと反逆を語り、心に偽りのことばをはらんで語りました(59:13)。","s":124.92,"e":134.082,"p":false,"h":false},{"t":"公正は退けられ、義は遠くに立ち、真実は広場でつまずき、正直は入ることができません(59:14)。","s":134.352,"e":141.551,"p":false,"h":false},{"t":"真実は失われ、悪から離れる者は、略奪の的になります(59:15)。","s":141.84,"e":146.619,"p":true,"h":false},{"t":"主はこれを見て、公正がないことを、悪とされました(59:15)。","s":147.24,"e":150.858,"p":false,"h":false},{"t":"主は、ひとりの人もいないのを見、取りなす者がいないのに驚かれました。","s":151.128,"e":156.048,"p":false,"h":false},{"t":"それで、主ご自身の腕が、主に救いをもたらし、主の義が、主を支えました(59:16)。","s":156.348,"e":162.193,"p":false,"h":false},{"t":"主は、義を胸当てとして着、救いのかぶとを頭にかぶり、復讐の衣を着て、熱情を外套としてまとわれました(59:17)。","s":162.468,"e":170.932,"p":false,"h":false},{"t":"その行いに応じて、敵には憤りを、敵対する者には報復を、島々には報いを与えられます(59:18)。","s":171.216,"e":178.472,"p":false,"h":false},{"t":"そのとき、西のほうでは主の御名を恐れ、日の昇るほうでは、主の栄光を恐れます。","s":178.776,"e":184.891,"p":false,"h":false},{"t":"主は、せき止められた川のように来られ、主の霊が、これを駆り立てられるからです(59:19)。","s":185.184,"e":190.917,"p":true,"h":false},{"t":"「贖う者がシオンに来る。","s":191.556,"e":193.095,"p":false,"h":false},{"t":"ヤコブの中で、背きを悔い改める者たちのところに」と、主は言われます(59:20)。","s":193.464,"e":198.601,"p":false,"h":false},{"t":"「これは、わたしが彼らと結ぶ契約。","s":198.9,"e":201.593,"p":false,"h":false},{"t":"わたしの霊があなたの上にあり、わたしがあなたの口に置いたわたしのことばは、あなたの口から、あなたの子孫の口から、その子孫の子孫の口から、今よりとこしえまで、離れない」と、主は言われます(59:21)。","s":201.888,"e":215.519,"p":true,"h":false},{"t":"各節の解説","s":216.18,"e":217.462,"p":true,"h":false},{"t":"1~2節は、民の苦しみの原因が、神の力不足ではなく、民の罪にあることを、はっきり示します。","s":218.124,"e":225.967,"p":false,"h":false},{"t":"50章2節の、「わたしの手は短いのか」という問いと、同じ流れにあります。","s":226.26,"e":231.554,"p":false,"h":false},{"t":"罪が、神と人の間を隔てるという教えは、聖書全体を貫く大切な教えです。","s":231.84,"e":238.263,"p":true,"h":false},{"t":"5~6節の毒蛇と蜘蛛の巣の描写は、悪の働きが、見かけは何かを作っているようで、実際には、何の役にも立たず、かえって害を生むことを、表しています。","s":238.896,"e":250.789,"p":true,"h":false},{"t":"9~15節の告白は、「彼ら」から「私たち」に変わります。","s":251.424,"e":255.918,"p":false,"h":false},{"t":"預言者自身も、民とともに罪を認めています。","s":256.212,"e":259.73,"p":false,"h":false},{"t":"ここは、共同体全体で、罪を告白する祈りの姿として、読まれます。","s":260.028,"e":265.664,"p":false,"h":false},{"t":"自分は別だ、という立場から語るのではなく、民とともに悔い改める姿勢が、示されています。","s":265.968,"e":273.01,"p":true,"h":false},{"t":"15~16節の、取りなす者がいないという嘆きは、53章12節の、「とりなしをした」しもべへの、伏線として読まれることがあります。","s":273.672,"e":283.628,"p":false,"h":false},{"t":"人の中に、取りなす者がいないので、神ご自身が、救いを成し遂げられます。","s":283.932,"e":289.288,"p":true,"h":false},{"t":"17節の、主が義を胸当て、救いをかぶととされる描写は、新約聖書で、パウロが、エペソ人への手紙6章で、信徒が身につける、神の武具について語るとき、同じような言葉を使っています。","s":289.908,"e":304.24,"p":false,"h":false},{"t":"ここでは、主ご自身が、戦士として来られる姿です。","s":304.524,"e":308.503,"p":true,"h":false},{"t":"19節は、解釈の分かれる箇所です。","s":309.168,"e":312.162,"p":false,"h":false},{"t":"「せき止められた川のように来られ」という言葉は、主の来臨が、抑えられた水が一気に流れ出すように、力強く、勢いのあるものであることを示します。","s":312.444,"e":323.148,"p":false,"h":false},{"t":"主の霊が、これを駆り立てる、という読み方と、主の霊が、敵に対する旗を揚げる、という読み方に分かれます。","s":323.424,"e":331.698,"p":true,"h":false},{"t":"20節の「贖う者がシオンに来る」は、新約聖書で、パウロが、ローマ人への手紙11章で、イスラエルの救いについて語るとき、引いています。","s":332.352,"e":342.469,"p":false,"h":false},{"t":"ここで、「悔い改める者たち」とあることから、この約束が、悔い改める者に向けられていることが分かります。","s":342.756,"e":350.135,"p":false,"h":false},{"t":"この節の成就が、どのような形を取るのかについては、読み方が分かれます。","s":350.424,"e":355.817,"p":true,"h":false},{"t":"21節の「わたしの霊があなたの上にあり」は、民全体に、神の霊と神のことばが、代々受け継がれるという約束です。","s":356.472,"e":365.252,"p":false,"h":false},{"t":"これは、新しい契約の約束として、読まれます。","s":365.544,"e":369.201,"p":true,"h":false}]},{"title":"イザヤ書_60章","audio":"doc60_2610231055.mp3","dur":398.7,"segs":[{"t":"イザヤ書60章","s":0,"e":1.464,"p":true,"h":false},{"t":"全体の流れ","s":2.124,"e":3.229,"p":true,"h":false},{"t":"60章は、「起きよ、輝け。","s":4.032,"e":6.583,"p":false,"h":false},{"t":"あなたの光が来て、主の栄光が、あなたの上に昇ったからだ」と始まります(60:1)。","s":6.876,"e":12.233,"p":false,"h":false},{"t":"見よ、闇は地をおおい、暗黒は諸国の民をおおう。","s":12.528,"e":16.34,"p":false,"h":false},{"t":"しかし、あなたの上には主が昇り、主の栄光が、あなたの上に現れる(60:2)。","s":16.632,"e":21.981,"p":false,"h":false},{"t":"国々は、あなたの光のもとに来て、王たちは、あなたに昇る輝きのもとに来る(60:3)。","s":22.284,"e":28.219,"p":true,"h":false},{"t":"目を上げて、周りを見回せ。","s":28.836,"e":31.046,"p":false,"h":false},{"t":"彼らはみな集まって、あなたのところに来る。","s":31.356,"e":34.104,"p":false,"h":false},{"t":"あなたの息子たちは、遠くから来、あなたの娘たちは、腕に抱かれて来る(60:4)。","s":34.38,"e":39.717,"p":false,"h":false},{"t":"そのとき、あなたは見て、輝き、あなたの心は、おののき、広がる。","s":39.996,"e":45.372,"p":false,"h":false},{"t":"海の富はあなたに向けられ、国々の財宝が、あなたのもとに来るからだ(60:5)。","s":45.648,"e":50.705,"p":false,"h":false},{"t":"ラクダの大群が、あなたをおおい、ミディアンとエファの若いラクダが来る。","s":50.976,"e":55.713,"p":false,"h":false},{"t":"シェバからは、みな金と乳香を携えて来て、主の栄誉を宣べ伝える(60:6)。","s":56.016,"e":61.066,"p":false,"h":false},{"t":"ケダルの羊の群れはみな、あなたのもとに集められ、ネバヨテの雄羊は、あなたに仕える。","s":61.344,"e":67.545,"p":false,"h":false},{"t":"それらは、わたしの祭壇の上で、受け入れられるささげ物となり、わたしは、わたしの栄光の家を、さらに輝かせる(60:7)。","s":67.824,"e":76.161,"p":true,"h":false},{"t":"雲のように飛んで来る者たち、鳩のように巣に帰る者たちは、だれか。","s":76.788,"e":81.607,"p":false,"h":false},{"t":"島々は、わたしを待ち望み、タルシシュの船が、まず、あなたの子らを遠くから連れて来る。","s":81.9,"e":88.421,"p":false,"h":false},{"t":"金銀を携えて、あなたの神、主の御名のために、イスラエルの聖なる方のために。","s":88.704,"e":94.693,"p":false,"h":false},{"t":"主が、あなたを輝かされたからだ(60:8-9)。","s":94.968,"e":97.548,"p":false,"h":false},{"t":"「異国の人々は、あなたの城壁を建て、その王たちは、あなたに仕える。","s":97.848,"e":103.048,"p":false,"h":false},{"t":"わたしは、怒ってあなたを打ったが、恵みをもって、あなたをあわれむ」(60:10)。","s":103.32,"e":107.857,"p":false,"h":false},{"t":"あなたの門は、絶えず開かれ、昼も夜も閉じられない。","s":108.144,"e":111.955,"p":false,"h":false},{"t":"国々の財宝を、あなたのもとに運び入れ、その王たちを、導いて来るためだ(60:11)。","s":112.248,"e":117.618,"p":false,"h":false},{"t":"あなたに仕えない国や王国は、滅びる。","s":117.9,"e":120.709,"p":false,"h":false},{"t":"その国々は、まったく荒れ果てる(60:12)。","s":120.996,"e":123.345,"p":false,"h":false},{"t":"レバノンの栄光、もみの木、すずかけ、糸杉が、わたしの聖所を飾るために、あなたのもとに来る。","s":123.624,"e":130.77,"p":false,"h":false},{"t":"わたしは、わたしの足台の場所を、栄光あるものにする(60:13)。","s":131.04,"e":134.841,"p":true,"h":false},{"t":"あなたを苦しめた者の子らは、身をかがめて、あなたのもとに来、あなたを侮った者はみな、あなたの足の裏にひれ伏して、あなたを「主の町」「イスラエルの聖なる方のシオン」と呼ぶ(60:14)。","s":135.468,"e":147.534,"p":false,"h":false},{"t":"あなたは、見捨てられ、憎まれ、通る人もいなかったが、わたしは、あなたを永遠の誇り、代々の喜びとする(60:15)。","s":147.816,"e":156.192,"p":false,"h":false},{"t":"あなたは、国々の乳を飲み、王たちの乳房を吸う。","s":156.492,"e":160.291,"p":false,"h":false},{"t":"あなたは、わたしが主、あなたの救い主、あなたの贖い主、ヤコブの力ある方であることを知る(60:16)。","s":160.596,"e":167.883,"p":true,"h":false},{"t":"青銅の代わりに金を、鉄の代わりに銀を、木の代わりに青銅を、石の代わりに鉄を持って来る。","s":168.516,"e":175.354,"p":false,"h":false},{"t":"わたしは、あなたの監督を平和とし、あなたを治める者を義とする(60:17)。","s":175.644,"e":180.607,"p":false,"h":false},{"t":"暴虐は、もう、あなたの地で聞かれない。","s":180.9,"e":183.761,"p":false,"h":false},{"t":"荒廃と破滅は、あなたの境界の中にない。","s":184.032,"e":187.258,"p":false,"h":false},{"t":"あなたは、自分の城壁を「救い」、自分の門を「誉れ」と呼ぶ(60:18)。","s":187.56,"e":191.754,"p":false,"h":false},{"t":"昼は、もう、太陽があなたの光とならず、月の輝きも、あなたを照らさない。","s":192.024,"e":197.824,"p":false,"h":false},{"t":"主が、あなたの永遠の光となり、あなたの神が、あなたの輝きとなる(60:19)。","s":198.108,"e":203.41,"p":false,"h":false},{"t":"あなたの太陽は、もう沈まず、あなたの月は、欠けることがない。","s":203.688,"e":208.55,"p":false,"h":false},{"t":"主が、あなたの永遠の光となり、あなたの悲しみの日々は終わるからだ(60:20)。","s":208.836,"e":213.854,"p":false,"h":false},{"t":"あなたの民は、みな義人となり、永遠に地を所有する。","s":214.128,"e":218.222,"p":false,"h":false},{"t":"それは、わたしの植えた若枝、わたしの手のわざ、わたしの栄光を現すためだ(60:21)。","s":218.52,"e":224.133,"p":false,"h":false},{"t":"最も小さい者が、千となり、最も弱い者が、強い国となる。","s":224.424,"e":229.551,"p":false,"h":false},{"t":"わたしは主。","s":229.824,"e":230.652,"p":false,"h":false},{"t":"その時が来れば、わたしは速やかに、これを行う(60:22)。","s":231.732,"e":235.379,"p":true,"h":false},{"t":"各節の解説","s":236.016,"e":237.298,"p":true,"h":false},{"t":"1~3節の「光」は、この章の中心です。","s":237.96,"e":241.423,"p":false,"h":false},{"t":"「起きよ、輝け」という命令は、民が自分の力で光を作り出すことではなく、主の栄光が、先に昇ったから、その光を受けて輝く、ということです。","s":241.74,"e":252.974,"p":false,"h":false},{"t":"2節の、闇が地をおおうという対比は、光が、諸国にも届くことを示します。","s":253.26,"e":259.152,"p":true,"h":false},{"t":"3~9節の、国々が集まる描写は、2章の、すべての民が主の山に流れ込むという幻と、響き合います。","s":259.812,"e":268.366,"p":false,"h":false},{"t":"ここでは、金、乳香、ラクダ、羊、船といった具体的な姿で、語られています。","s":268.668,"e":275.51,"p":false,"h":false},{"t":"新約聖書の、東方の博士たちが、金と乳香を携えて来た場面を、思い起こす人も多くいます。","s":275.796,"e":282.81,"p":false,"h":false},{"t":"ただし、この預言が、どの時期に、どのように成就するのかについては、読み方が分かれます。","s":283.104,"e":289.755,"p":true,"h":false},{"t":"10節の、「怒って打ったが、恵みをもってあわれむ」は、54章7~8節の、ほんのしばらくの怒りと、永遠の恵みの対比を、もう一度語っています。","s":290.376,"e":301.25,"p":true,"h":false},{"t":"11節の「門は絶えず開かれ」は、シオンが、閉じこもる町ではなく、すべての国に開かれた町であることを示します。","s":301.896,"e":310.215,"p":false,"h":false},{"t":"黙示録21章の、新しいエルサレムの門が閉ざされないという描写と、結びつけて読まれることがあります。","s":310.5,"e":317.854,"p":true,"h":false},{"t":"14節の「足の裏にひれ伏して」は、強い表現ですが、シオンが他国を支配するという意味ではなく、かつてシオンを侮った者たちが、シオンの神を、真の神として認める、という意味に読むのが穏当です。","s":318.492,"e":332.09,"p":false,"h":false},{"t":"49章22~23節にも、似た表現があります。","s":332.424,"e":336.916,"p":true,"h":false},{"t":"17~18節の、「監督を平和、治める者を義とする」は、支配する者そのものが、平和と義という性質を持つことを語ります。","s":337.536,"e":347.058,"p":false,"h":false},{"t":"力や暴力で治める社会が、終わることを示します。","s":347.364,"e":351.18,"p":true,"h":false},{"t":"19~20節の、太陽も月も要らず、主が永遠の光となるという約束は、新約聖書の黙示録21~22章で、新しいエルサレムについて、ほとんど同じ言葉で語られます。","s":351.828,"e":365.4,"p":false,"h":false},{"t":"この約束の、完全な成就は、まだ先にあると、教会は読んできました。","s":365.688,"e":371.152,"p":true,"h":false},{"t":"21節の「みな義人となり」は、民の義が、自分の行いではなく、主が植え、主が手ずから造られたものであることを語ります。","s":371.808,"e":380.999,"p":false,"h":false},{"t":"「わたしの植えた若枝」は、11章1節の「若枝」と、つながって読まれることがあります。","s":381.276,"e":387.374,"p":true,"h":false},{"t":"22節の、最も小さい者が千となるという約束は、神の民が、小さな者から増え広がるという、神の働きの姿を語ります。","s":388.008,"e":398.058,"p":true,"h":false}]},{"title":"イザヤ書_61章","audio":"doc61_2610231055.mp3","dur":247.4,"segs":[{"t":"イザヤ書61章","s":0,"e":1.639,"p":true,"h":false},{"t":"全体の流れ","s":2.304,"e":3.409,"p":true,"h":false},{"t":"「神である主の霊が、私の上にある。","s":4.212,"e":6.975,"p":false,"h":false},{"t":"主が私に油を注ぎ、貧しい人に良い知らせを伝え、心の傷ついた者を癒やし、捕らわれ人に解放を、囚人に釈放を告げるために、私を遣わされた」と、61章は始まります(61:1)。","s":7.236,"e":21.083,"p":false,"h":false},{"t":"主の恵みの年と、私たちの神の復讐の日を告げ、すべての悲しむ者を慰めるためです(61:2)。","s":21.348,"e":27.993,"p":false,"h":false},{"t":"シオンの悲しむ者には、灰の代わりに頭飾りを、悲しみの代わりに喜びの油を、憂いの心の代わりに賛美の衣を与えます。","s":28.296,"e":37.482,"p":false,"h":false},{"t":"彼らは「義の樫の木」、主が植えられた者、主の栄光を現す者と呼ばれます(61:3)。","s":37.764,"e":43.16,"p":true,"h":false},{"t":"彼らは、昔の廃墟を建て直し、荒れ果てた所を立て直します。","s":43.812,"e":48.675,"p":false,"h":false},{"t":"何代も荒れていた町々を新しくします(61:4)。","s":48.96,"e":51.798,"p":false,"h":false},{"t":"外国人が来て、あなたがたの羊を飼い、よそ者が畑を耕し、ぶどうを作ります。","s":52.092,"e":58.344,"p":false,"h":false},{"t":"しかし、あなたがたは「主の祭司」と呼ばれ、「私たちの神に仕える者」と言われます。","s":58.644,"e":64.594,"p":false,"h":false},{"t":"あなたがたは国々の富を食べ、その栄光を誇ります(61:5-6)。","s":64.872,"e":68.699,"p":false,"h":false},{"t":"あなたがたの恥の代わりに二倍の分があり、辱めの代わりに、自分の分を喜び歌います。","s":68.976,"e":75.474,"p":false,"h":false},{"t":"彼らはその地で二倍を受け継ぎ、永遠の喜びを持ちます(61:7)。","s":75.78,"e":79.785,"p":true,"h":false},{"t":"「わたし、主は公正を愛し、略奪と不正を憎む。","s":80.424,"e":84.393,"p":false,"h":false},{"t":"わたしは真実をもって彼らに報い、彼らと永遠の契約を結ぶ」(61:8)。","s":84.672,"e":89.367,"p":false,"h":false},{"t":"その子孫は、諸国民の間で知られ、彼らを見る者はみな、主に祝福された子孫だと認めます(61:9)。","s":89.64,"e":96.655,"p":true,"h":false},{"t":"最後に、シオンの喜びの歌が語られます。","s":97.308,"e":100.41,"p":false,"h":false},{"t":"「私は主にあって大いに喜び、私のたましいは、私の神にあって躍る。","s":100.692,"e":106.049,"p":false,"h":false},{"t":"主が、救いの衣を私に着せ、義の外套を私にまとわせ、花婿が頭飾りをつけ、花嫁が宝石で身を飾るようにしてくださったから」(61:10)。","s":106.344,"e":116.663,"p":false,"h":false},{"t":"地が芽を出し、園が蒔かれた物を芽生えさせるように、主はすべての国々の前で、義と賛美を芽生えさせられます(61:11)。","s":116.964,"e":124.884,"p":true,"h":false},{"t":"各節の解説","s":125.532,"e":126.814,"p":true,"h":false},{"t":"1節の語り手が誰かは、読み方が分かれます。","s":127.476,"e":130.833,"p":false,"h":false},{"t":"預言者自身とする読み方もあれば、42章や49章、50章のしもべと同じ人物とする読み方もあります。","s":131.112,"e":139.392,"p":false,"h":false},{"t":"ルカの福音書では、イエスがナザレの会堂で、この箇所を読み、「今日、この聖書のことばが、あなたがたが聞いたとおり実現しました」と言われました。","s":139.68,"e":149.983,"p":false,"h":false},{"t":"改革派の伝統は、この語り手を、最終的にイエス・キリストと受け取ってきました。","s":150.264,"e":155.82,"p":true,"h":false},{"t":"2節で、イエスがルカの福音書で朗読したとき、「私たちの神の復讐の日」の前で、読むのをやめた、と福音書は記しています。","s":156.456,"e":165.345,"p":false,"h":false},{"t":"恵みの年と復讐の日が、一つの文の中に並んでいる点は、キリストの最初の来臨と再臨の関係を考える手がかりとして、読まれることがあります。","s":165.636,"e":176.114,"p":false,"h":false},{"t":"ただし、これをどう整理するかについては、読み方が分かれます。","s":176.4,"e":180.738,"p":true,"h":false},{"t":"3節の「灰の代わりに頭飾りを」は、悲しみが、喜びに置き換えられることを、具体的な物で語ります。","s":181.368,"e":189.206,"p":false,"h":false},{"t":"回復が、気持ちの問題だけでなく、状況全体の変化であることを示します。","s":189.504,"e":195.184,"p":true,"h":false},{"t":"6節の「主の祭司」は、民全体が、神に仕える者とされることを語ります。","s":195.804,"e":201.509,"p":false,"h":false},{"t":"出エジプト記の「祭司の王国」の約束を思い起こさせます。","s":201.78,"e":205.735,"p":false,"h":false},{"t":"新約聖書でペテロが、教会を「王である祭司」と呼ぶことと、結びつけて読まれます。","s":206.028,"e":211.953,"p":true,"h":false},{"t":"7節の「二倍」は、40章2節の「二倍のものを受けた」と対になっています。","s":212.58,"e":218.098,"p":false,"h":false},{"t":"罰の二倍に対して、祝福の二倍が語られています。","s":218.412,"e":222.218,"p":true,"h":false},{"t":"10節の花婿と花嫁の比喩は、救いが、結婚の喜びのように、親密で、祝福に満ちたものであることを表します。","s":222.84,"e":231.645,"p":false,"h":false},{"t":"「救いの衣」「義の外套」は、義が、自分で作るものではなく、主から着せていただくものであることを示します。","s":231.912,"e":239.588,"p":false,"h":false},{"t":"改革派の神学が、義認を「義の衣を着せられること」として語るときに、よく引かれる言葉です。","s":239.868,"e":246.743,"p":true,"h":false}]},{"title":"イザヤ書_62章","audio":"doc62_2610231055.mp3","dur":229.9,"segs":[{"t":"イザヤ書62章","s":0,"e":1.599,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"「シオンのために、私は黙っていない。","s":4.176,"e":6.702,"p":false,"h":false},{"t":"エルサレムのために、私は休まない。","s":6.984,"e":9.538,"p":false,"h":false},{"t":"その義が輝きのように出て行き、その救いが、燃えるたいまつのようになるまで」と、62章は始まります(62:1)。","s":9.828,"e":17.358,"p":false,"h":false},{"t":"諸国民は、あなたの義を見、すべての王は、あなたの栄光を見ます。","s":17.64,"e":22.658,"p":false,"h":false},{"t":"あなたは、主の口が定められる、新しい名で呼ばれます(62:2)。","s":22.932,"e":27.162,"p":false,"h":false},{"t":"あなたは、主の手の中で、美しい冠、あなたの神の手の中で、王の頭飾りとなります(62:3)。","s":27.432,"e":34.45,"p":true,"h":false},{"t":"あなたは、もう「見捨てられた女」とは呼ばれず、あなたの国は、「荒れ果てた地」とは言われません。","s":35.1,"e":41.606,"p":false,"h":false},{"t":"あなたは「わたしの喜びは彼女にある」、あなたの国は「夫のある国」と呼ばれます。","s":41.904,"e":47.421,"p":false,"h":false},{"t":"主があなたを喜ばれ、あなたの国は夫を得るからです(62:4)。","s":47.7,"e":51.575,"p":false,"h":false},{"t":"若者が処女をめとるように、あなたの子らが、あなたをめとり、花婿が花嫁を喜ぶように、あなたの神が、あなたを喜ばれます(62:5)。","s":51.876,"e":60.996,"p":true,"h":false},{"t":"エルサレムよ、わたしは、あなたの城壁の上に、見張りを置いた。","s":61.632,"e":66.3,"p":false,"h":false},{"t":"昼も夜も、決して黙ってはならない。","s":66.6,"e":69.154,"p":false,"h":false},{"t":"主に思い起こしていただく者たちよ、休んではならない。","s":69.444,"e":73.019,"p":false,"h":false},{"t":"主がエルサレムを堅く立て、地上で誉れとされるまで、主に休む暇を与えてはならない(62:6-7)。","s":73.296,"e":79.315,"p":false,"h":false},{"t":"主は、右の手と力ある腕で誓われた。","s":79.596,"e":82.647,"p":false,"h":false},{"t":"「わたしは、二度と、あなたの穀物を、敵の食物としない。","s":82.944,"e":87.196,"p":false,"h":false},{"t":"異国の人々は、あなたが労して得た新しいぶどう酒を、飲まない」(62:8)。","s":87.48,"e":92.235,"p":false,"h":false},{"t":"収穫した者がそれを食べ、主を賛美し、ぶどうを集めた者が、わたしの聖なる庭で、それを飲む(62:9)。","s":92.52,"e":99.612,"p":true,"h":false},{"t":"「通れ、通れ、門を。","s":100.26,"e":101.944,"p":false,"h":false},{"t":"民の道を整えよ。","s":102.24,"e":103.723,"p":false,"h":false},{"t":"盛り上げよ、盛り上げよ、大路を。","s":104.148,"e":106.287,"p":false,"h":false},{"t":"石を取り除け。","s":106.596,"e":107.745,"p":false,"h":false},{"t":"国々に向かって旗を掲げよ」(62:10)。","s":108.504,"e":110.57,"p":false,"h":false},{"t":"見よ、主は地の果てまで、告げ知らせられた。","s":110.88,"e":113.888,"p":false,"h":false},{"t":"「娘シオンに言え。","s":114.192,"e":115.432,"p":false,"h":false},{"t":"見よ、あなたの救いが来る。","s":116.1,"e":117.799,"p":false,"h":false},{"t":"見よ、主の報いは、主とともにあり、その働きの報いは、御前にある」(62:11)。","s":118.08,"e":123.27,"p":false,"h":false},{"t":"彼らは、「聖なる民、主に贖われた者」と呼ばれ、あなたは、「尋ね求められる者、見捨てられない都」と呼ばれます(62:12)。","s":123.552,"e":132.184,"p":true,"h":false},{"t":"各節の解説","s":132.804,"e":134.086,"p":true,"h":false},{"t":"2節の「新しい名」は、シオンの身分と性質が、変えられることを表します。","s":134.748,"e":140.303,"p":false,"h":false},{"t":"名前は、聖書では存在そのものを表します。","s":140.616,"e":144.043,"p":false,"h":false},{"t":"見捨てられた者という名が、愛される者という名に変わります。","s":144.36,"e":148.398,"p":false,"h":false},{"t":"新約聖書では、黙示録に、新しい名が与えられるという約束が出てきます。","s":148.68,"e":154.371,"p":true,"h":false},{"t":"4~5節の結婚の比喩は、神とシオンの関係が、結婚にたとえられている、という意味です。","s":155.016,"e":161.32,"p":false,"h":false},{"t":"54章の、不妊の女と夫の比喩の、続きとして読めます。","s":161.604,"e":166.147,"p":false,"h":false},{"t":"神が、ご自分の民を喜ばれるという、驚くべき言葉です。","s":166.428,"e":170.939,"p":true,"h":false},{"t":"5節の「あなたの子らが、あなたをめとり」は、読み方が分かれます。","s":171.576,"e":176.125,"p":false,"h":false},{"t":"写本や訳によっては、「あなたを造った者があなたをめとる」と読む立場があります。","s":176.4,"e":181.831,"p":false,"h":false},{"t":"意味は大きくは変わりません。","s":182.124,"e":183.92,"p":true,"h":false},{"t":"6~7節の見張りは、エルサレムのために、昼も夜も祈りつづける者たちを指す、と読まれます。","s":184.572,"e":191.542,"p":false,"h":false},{"t":"「主に休む暇を与えてはならない」は、粘り強い祈りへの励ましです。","s":191.844,"e":196.555,"p":false,"h":false},{"t":"新約聖書で、イエスが、粘り強く祈る寡婦のたとえを語られたことと、響き合います。","s":196.848,"e":202.946,"p":true,"h":false},{"t":"10~12節は、主が来られるための道を整える呼びかけです。","s":203.58,"e":208.224,"p":false,"h":false},{"t":"40章3節の「道を備えよ」と、同じ主題です。","s":208.512,"e":212.123,"p":false,"h":false},{"t":"ここでは、道を備えることが、民の帰還のためとして語られます。","s":212.4,"e":217.08,"p":true,"h":false},{"t":"12節の「見捨てられない都」は、62章の結びとして、シオンの新しい名のひとつです。","s":217.728,"e":224.348,"p":false,"h":false},{"t":"かつて「見捨てられた」と言われた都が、「見捨てられない」と呼ばれます。","s":224.64,"e":229.266,"p":true,"h":false}]},{"title":"イザヤ書_63章","audio":"doc63_2610231055.mp3","dur":336.7,"segs":[{"t":"イザヤ書63章","s":0,"e":1.676,"p":true,"h":false},{"t":"全体の流れ","s":2.34,"e":3.445,"p":true,"h":false},{"t":"63章は、驚くべき場面から始まります。","s":4.248,"e":7.762,"p":false,"h":false},{"t":"「エドムから来る者はだれか。","s":8.064,"e":9.784,"p":false,"h":false},{"t":"ボツラから、染めた衣で来る者は。","s":10.08,"e":12.635,"p":false,"h":false},{"t":"その装いは輝かしく、大いなる力で進んで来る者は」(63:1)。","s":12.924,"e":17.048,"p":false,"h":false},{"t":"答えは、「わたしだ。","s":17.352,"e":18.731,"p":false,"h":false},{"t":"義を語り、救うのに力ある者だ」(63:1)。","s":19.26,"e":21.94,"p":false,"h":false},{"t":"なぜ、その衣は赤く、酒ぶねを踏む者の衣のようなのか、と問われます(63:2)。","s":22.212,"e":27.795,"p":false,"h":false},{"t":"「わたしはひとりで酒ぶねを踏んだ。","s":28.08,"e":30.093,"p":false,"h":false},{"t":"国々の民のうちに、わたしと共にいる者はいなかった。","s":30.384,"e":34.078,"p":false,"h":false},{"t":"わたしは怒って彼らを踏み、憤って彼らを踏みつけた。","s":34.344,"e":38.113,"p":false,"h":false},{"t":"その血が、わたしの衣に飛び散り、わたしは、自分の衣をすべて汚した」(63:3)。","s":38.412,"e":43.987,"p":false,"h":false},{"t":"「わたしの心には、復讐の日があり、わたしの贖いの年が来ていたからだ」(63:4)。","s":44.28,"e":49.444,"p":false,"h":false},{"t":"「わたしは見回したが、助ける者はなく、驚いたが、支える者もいなかった。","s":49.716,"e":55.202,"p":false,"h":false},{"t":"それで、わたしの腕が、わたしを救い、わたしの憤りが、わたしを支えた」(63:5)。","s":55.476,"e":61.076,"p":true,"h":false},{"t":"そこから、民の祈りが始まります。","s":61.704,"e":64.198,"p":false,"h":false},{"t":"「私は、主の恵みを思い起こし、主の賛美を語ろう。","s":64.476,"e":68.549,"p":false,"h":false},{"t":"主が私たちに報いてくださったすべてのことと、その大いなる恵みを」(63:7)。","s":68.832,"e":73.495,"p":false,"h":false},{"t":"主は言われました。","s":73.8,"e":74.937,"p":false,"h":false},{"t":"「まことに、彼らはわたしの民、偽りを行わない子らだ」。","s":75.708,"e":79.931,"p":false,"h":false},{"t":"こうして、主は彼らの救い主となられました(63:8)。","s":80.208,"e":83.228,"p":false,"h":false},{"t":"彼らの苦しみのときには、いつも主も苦しみ、御前の使いが彼らを救い、主は、その愛とあわれみで彼らを贖い、昔からずっと、彼らを担い、抱いてくださいました(63:9)。","s":83.52,"e":95.588,"p":true,"h":false},{"t":"しかし、彼らは背き、主の聖なる霊を悲しませました。","s":96.228,"e":100.322,"p":false,"h":false},{"t":"そこで、主は彼らの敵となって、みずから彼らと戦われました(63:10)。","s":100.62,"e":105.228,"p":false,"h":false},{"t":"すると、民は、昔の日、モーセの日を思い出しました。","s":105.516,"e":109.702,"p":false,"h":false},{"t":"「羊の群れの牧者たちを海から上らせた方は、どこにおられるのか。","s":109.98,"e":114.555,"p":false,"h":false},{"t":"その中に、聖なる霊を置かれた方は、どこにおられるのか」(63:11)。","s":114.84,"e":118.928,"p":false,"h":false},{"t":"モーセの右の手に、栄光の腕を伴わせ、永遠の名を得るために、彼らの前で水を分け、荒れ野を、馬のように、つまずくことなく導かれた方は、どこにおられるのか(63:12-14)。","s":119.232,"e":130.983,"p":true,"h":false},{"t":"そして、民は祈ります。","s":131.616,"e":133.394,"p":false,"h":false},{"t":"「天から見下ろしてください。","s":133.668,"e":135.168,"p":false,"h":false},{"t":"あなたの聖なる輝かしい住まいから、ご覧ください。","s":135.576,"e":138.999,"p":false,"h":false},{"t":"あなたの熱心と力あるわざは、どこにあるのですか。","s":139.284,"e":142.801,"p":false,"h":false},{"t":"あなたの胸の思いやり、あわれみは、私に対して、抑えられています」(63:15)。","s":143.1,"e":147.9,"p":false,"h":false},{"t":"「あなたこそ私たちの父です。","s":148.212,"e":150.12,"p":false,"h":false},{"t":"アブラハムは私たちを知らず、イスラエルも私たちを認めなくても、主よ、あなたは私たちの父、昔から、『私たちを贖う方』が、あなたの名です」(63:16)。","s":150.408,"e":161.094,"p":false,"h":false},{"t":"なぜ、主よ、あなたは私たちを、あなたの道から迷わせ、私たちの心を、あなたを恐れないほどかたくなにされたのですか。","s":161.388,"e":169.598,"p":false,"h":false},{"t":"あなたのしもべたちのために、あなたの相続地である部族のために、帰って来てください(63:17)。","s":169.884,"e":175.647,"p":false,"h":false},{"t":"あなたの聖なる民が、わずかの間、所有していたのに、私たちの敵は、あなたの聖所を踏みにじりました(63:18)。","s":175.932,"e":183.527,"p":false,"h":false},{"t":"私たちは、昔から、あなたに治められたことのない者、あなたの名で呼ばれたことのない者のようになりました(63:19)。","s":183.816,"e":191.149,"p":true,"h":false},{"t":"各節の解説","s":191.808,"e":193.09,"p":true,"h":false},{"t":"1~6節は、聖書の中でも、特に激しい描写の一つです。","s":193.752,"e":198.665,"p":false,"h":false},{"t":"「エドムから来る者」は、34章のエドムへのさばきを、思い出させます。","s":198.972,"e":203.946,"p":false,"h":false},{"t":"エドムが、神に逆らう世界全体の代表として、読まれることがあります。","s":204.228,"e":209.458,"p":false,"h":false},{"t":"ここで、「酒ぶねを踏む」ことは、さばきの暗示です。","s":209.736,"e":213.227,"p":false,"h":false},{"t":"新約聖書の黙示録19章に、同じような場面があり、キリストの再臨のさばきと結びつけて読まれます。","s":213.516,"e":220.968,"p":true,"h":false},{"t":"3節の、「わたしはひとりで」は、人の助けなしに、主ご自身が、さばきと救いを成し遂げられることを語ります。","s":221.616,"e":229.248,"p":false,"h":false},{"t":"59章16節の、取りなす者がいないという嘆きに対する、答えとして読めます。","s":229.536,"e":235.65,"p":true,"h":false},{"t":"5節は、59章16節と、ほとんど同じ言葉です。","s":236.304,"e":240.704,"p":false,"h":false},{"t":"主ご自身が、救いの働きを担われるという主題が、二度、語られています。","s":240.984,"e":246.673,"p":true,"h":false},{"t":"9節の「いつも主も苦しみ」は、神が、民の苦しみに、無関心ではおられないことを語る、大切な言葉です。","s":247.32,"e":255.641,"p":false,"h":false},{"t":"写本や訳によって、読み方が分かれるところもありますが、主が、民の苦しみに、深く共感されるという意味に、変わりはありません。","s":255.924,"e":264.836,"p":true,"h":false},{"t":"10節の「聖なる霊を悲しませた」は、旧約聖書で、聖霊について、はっきり語られる、数少ない箇所の一つです。","s":265.464,"e":273.944,"p":false,"h":false},{"t":"新約聖書で、パウロが、エペソ人への手紙4章で、聖霊を悲しませてはならないと語るときに、この言葉を踏まえていると、読まれます。","s":274.212,"e":283.981,"p":false,"h":false},{"t":"この「聖なる霊」が、三位一体の聖霊として、どこまで理解されていたのかについては、読み方が分かれます。","s":284.292,"e":291.712,"p":false,"h":false},{"t":"ただし、改革派の伝統は、ここに、聖霊の人格的な働きを、見てきました。","s":291.996,"e":298.264,"p":true,"h":false},{"t":"16節の、「アブラハムは私たちを知らず」は、民が、人間の父祖の名にではなく、神ご自身にだけ、頼る姿を語ります。","s":298.908,"e":307.951,"p":false,"h":false},{"t":"「あなたこそ私たちの父」という呼びかけは、旧約聖書では、珍しい言い方です。","s":308.232,"e":314.088,"p":true,"h":false},{"t":"17節の、「なぜ、迷わせ、かたくなにされたのですか」は、難しい言葉です。","s":314.712,"e":320.667,"p":false,"h":false},{"t":"民が、自分たちの罪の責任を、神に押しつけているのか、神の主権を認めた上で、嘆いているのか、読み方が分かれます。","s":320.976,"e":330.081,"p":false,"h":false},{"t":"ここでも、神の主権と人間の責任の、両方を見ながら読むのが、穏当です。","s":330.372,"e":336.072,"p":true,"h":false}]},{"title":"イザヤ書_64章","audio":"doc64_2610231055.mp3","dur":247.9,"segs":[{"t":"イザヤ書64章","s":0,"e":1.676,"p":true,"h":false},{"t":"全体の流れ","s":2.34,"e":3.445,"p":true,"h":false},{"t":"64章は、63章の祈りの続きです。","s":4.248,"e":7.925,"p":false,"h":false},{"t":"「ああ、あなたが天を裂いて降りて来てくださるなら、山々は、あなたの御前で揺れ動くでしょう」(64:1)。","s":8.208,"e":14.557,"p":false,"h":false},{"t":"火が柴に燃えつくように、火が水を沸き立たせるように、あなたの御名を、あなたの敵に知らせてください。","s":14.868,"e":21.731,"p":false,"h":false},{"t":"国々は、あなたの御前で震えます(64:1-2)。","s":22.032,"e":24.635,"p":false,"h":false},{"t":"あなたが、私たちの予期しなかった、恐ろしいことを行われたとき、あなたが降りて来られ、山々は、あなたの御前で揺れ動きました(64:3)。","s":24.912,"e":34.195,"p":true,"h":false},{"t":"昔から、あなたのほかに、待ち望む者のために行われる神を、耳で聞いた者も、目で見た者もいません(64:4)。","s":34.848,"e":42.614,"p":false,"h":false},{"t":"あなたは、喜んで義を行う者、あなたの道で、あなたを思い起こす者を、迎えられます。","s":42.912,"e":49.16,"p":false,"h":false},{"t":"ところが、あなたは怒られ、私たちは罪を犯しました。","s":49.428,"e":53.383,"p":false,"h":false},{"t":"私たちは、いつまでも、その道にあって、救われるのでしょうか(64:5)。","s":53.676,"e":58.252,"p":true,"h":false},{"t":"私たちはみな、汚れた者のようになり、私たちの義はみな、汚れた衣のようです。","s":58.896,"e":64.97,"p":false,"h":false},{"t":"私たちはみな、木の葉のように枯れ、私たちの咎は、風のように、私たちを吹き飛ばします(64:6)。","s":65.268,"e":72.074,"p":false,"h":false},{"t":"あなたの名を呼ぶ者はなく、あなたにすがろうと、奮い立つ者もいません。","s":72.36,"e":77.141,"p":false,"h":false},{"t":"あなたが、私たちから御顔を隠し、私たちを、咎の手に渡されたからです(64:7)。","s":77.472,"e":83.075,"p":true,"h":false},{"t":"しかし、今、主よ、あなたは私たちの父です。","s":83.736,"e":87.326,"p":false,"h":false},{"t":"私たちは粘土、あなたは私たちを形造る方。","s":87.624,"e":91.095,"p":false,"h":false},{"t":"私たちはみな、あなたの手のわざです(64:8)。","s":91.404,"e":94.067,"p":false,"h":false},{"t":"主よ、どうか、激しく怒らないでください。","s":94.356,"e":97.346,"p":false,"h":false},{"t":"いつまでも、咎を覚えないでください。","s":97.632,"e":100.088,"p":false,"h":false},{"t":"どうか、私たちがみな、あなたの民であることを、心に留めてください(64:9)。","s":100.368,"e":105.41,"p":false,"h":false},{"t":"あなたの聖なる町々は荒れ野となり、シオンは荒れ野に、エルサレムは荒れ果てた所となりました(64:10)。","s":105.696,"e":111.826,"p":false,"h":false},{"t":"私たちの聖なる、麗しい宮は、先祖があなたをほめたたえた所は、火で焼かれ、私たちの慕う所はみな、廃墟となりました(64:11)。","s":112.104,"e":121.459,"p":false,"h":false},{"t":"主よ、これらのことがあっても、あなたは、自分を抑えておられるのですか。","s":121.752,"e":126.701,"p":false,"h":false},{"t":"黙って、私たちをこれほどまでに、苦しめられるのですか(64:12)。","s":127.008,"e":130.987,"p":true,"h":false},{"t":"各節の解説","s":131.652,"e":132.934,"p":true,"h":false},{"t":"1節の「天を裂いて降りて来てください」は、民の、切実な叫びです。","s":133.596,"e":138.448,"p":false,"h":false},{"t":"新約聖書では、イエスの洗礼の時に、天が裂けたと語られており、この祈りへの、応答として読まれることがあります。","s":138.744,"e":146.887,"p":true,"h":false},{"t":"4節は、新約聖書で、パウロが、コリント人への手紙第一2章で、神が愛する者のために備えられたものについて語るとき、この言葉を踏まえて引いています。","s":147.528,"e":159.021,"p":false,"h":false},{"t":"ただし、パウロの引用は、細部が少し異なり、読み方が分かれます。","s":159.3,"e":164.405,"p":true,"h":false},{"t":"5節の後半は、解釈が難しいところです。","s":165.024,"e":168.466,"p":false,"h":false},{"t":"写本や訳によって、表現がかなり異なります。","s":168.768,"e":172.086,"p":false,"h":false},{"t":"ここでは、民が、自分たちの罪の深さに気づいて、神の恵みに頼るしかないと悟る言葉として、読むのが穏当です。","s":172.368,"e":180.936,"p":true,"h":false},{"t":"6節の「私たちの義はみな、汚れた衣のようです」は、聖書の中で、最もよく引かれる言葉の一つです。","s":181.584,"e":189.316,"p":false,"h":false},{"t":"人の最善の行いでさえ、神の前では、きよさに足りない、という告白です。","s":189.612,"e":195.267,"p":false,"h":false},{"t":"「汚れた衣」という言葉の、元の意味については、読み方が分かれますが、どちらにしても、人の義が、救いの根拠にはならないという意味です。","s":195.552,"e":204.979,"p":false,"h":false},{"t":"改革派の神学が、人間の全的堕落と、恵みのみによる救いを語るときに、特に重く受け取る箇所の一つです。","s":205.272,"e":213.524,"p":true,"h":false},{"t":"8節の「私たちは粘土、あなたは私たちを形造る方」は、29章16節、45章9節の、陶器師の比喩と、つながっています。","s":214.164,"e":224.594,"p":false,"h":false},{"t":"ここでは、神の主権が、さばきの根拠としてではなく、救いを願う根拠として、語られています。","s":224.892,"e":231.939,"p":true,"h":false},{"t":"11節の「麗しい宮は焼かれた」は、紀元前586年の、エルサレムの滅亡を、思い起こさせます。","s":232.596,"e":240.109,"p":false,"h":false},{"t":"この祈りが、捕囚の時代の民の声なのか、帰還後の民の声なのかは、読み方が分かれます。","s":240.408,"e":247.235,"p":true,"h":false}]},{"title":"イザヤ書_65章","audio":"doc65_2610231055.mp3","dur":420.6,"segs":[{"t":"イザヤ書65章","s":0,"e":1.589,"p":true,"h":false},{"t":"全体の流れ","s":2.232,"e":3.337,"p":true,"h":false},{"t":"65章は、64章の祈りに対する、主の答えです。","s":4.14,"e":8.767,"p":false,"h":false},{"t":"「わたしは、尋ねなかった者たちに、探し出され、求めなかった者たちに、見いだされた。","s":9.072,"e":15.228,"p":false,"h":false},{"t":"わたしの名を呼ばなかった国民に、『わたしはここにいる、わたしはここにいる』と言った」(65:1)。","s":15.516,"e":21.205,"p":false,"h":false},{"t":"わたしは、一日中、手を差し伸べた。","s":21.492,"e":24.454,"p":false,"h":false},{"t":"自分の考えに従って、良くない道を歩む、反逆の民に向けて(65:2)。","s":24.732,"e":29.621,"p":false,"h":false},{"t":"彼らは、わたしの顔の前で、絶えずわたしを怒らせ、園でいけにえをささげ、れんがの上で香をたき、墓地に座り、隠れた所で夜を過ごし、豚の肉を食べ、汚れた肉の汁を、器に入れます(65:3-4)。","s":29.916,"e":44.171,"p":false,"h":false},{"t":"そして言います。","s":44.46,"e":45.394,"p":false,"h":false},{"t":"「あなたの所に近寄るな。","s":46.368,"e":48.054,"p":false,"h":false},{"t":"私は、あなたより聖なる者だから」(65:5)。","s":48.348,"e":51.011,"p":true,"h":false},{"t":"主は言われます。","s":51.66,"e":52.699,"p":false,"h":false},{"t":"「見よ、これはわたしの前に書き記されている。","s":53.568,"e":56.628,"p":false,"h":false},{"t":"わたしは黙っていない。","s":56.916,"e":58.297,"p":false,"h":false},{"t":"必ず報いる。","s":58.824,"e":59.895,"p":false,"h":false},{"t":"彼らの咎と、彼らの先祖の咎を、ともに報いる」(65:6-7)。","s":60.732,"e":64.398,"p":true,"h":false},{"t":"しかし、すべてが滅ぼされるのではありません。","s":65.052,"e":68.133,"p":false,"h":false},{"t":"「ぶどうの房の中に、新しいぶどう酒が見つかるとき、人は、『それを損なうな。","s":68.436,"e":74.1,"p":false,"h":false},{"t":"その中に祝福があるから』と言う。","s":74.376,"e":76.693,"p":false,"h":false},{"t":"そのように、わたしも、わたしのしもべたちのために、すべてを滅ぼすことはしない」(65:8)。","s":77.004,"e":82.52,"p":false,"h":false},{"t":"わたしは、ヤコブから子孫を、ユダから、わたしの山々を受け継ぐ者を、出させる。","s":82.8,"e":88.709,"p":false,"h":false},{"t":"わたしの選んだ者が、それを受け継ぎ、わたしのしもべたちが、そこに住む(65:9)。","s":88.992,"e":94.079,"p":false,"h":false},{"t":"シャロンは、羊の群れの牧場となり、アコルの谷は、牛の群れの休み場となる。","s":94.356,"e":99.996,"p":false,"h":false},{"t":"わたしを求めた民のためだ(65:10)。","s":100.296,"e":102.194,"p":true,"h":false},{"t":"一方、主を捨て、わたしの聖なる山を忘れ、ガドの神に食卓を整え、ミニの神に混ぜ合わせたぶどう酒を満たす者たちを、わたしは、剣に定める。","s":102.852,"e":113.776,"p":false,"h":false},{"t":"あなたがたはみな、ひざまずいて殺される。","s":114.084,"e":116.81,"p":false,"h":false},{"t":"わたしが呼んだのに、答えず、わたしが語ったのに、聞かず、わたしの目に悪であることを行い、わたしが喜ばないことを選んだからだ(65:11-12)。","s":117.108,"e":126.509,"p":true,"h":false},{"t":"ここで、二つの運命が、対比されます。","s":127.152,"e":130.052,"p":false,"h":false},{"t":"「わたしのしもべたちは食べるが、あなたがたは飢える。","s":130.356,"e":133.67,"p":false,"h":false},{"t":"わたしのしもべたちは飲むが、あなたがたは渇く。","s":133.956,"e":137.288,"p":false,"h":false},{"t":"わたしのしもべたちは喜ぶが、あなたがたは恥を見る。","s":137.556,"e":141.364,"p":false,"h":false},{"t":"わたしのしもべたちは、心の喜びのゆえに歌うが、あなたがたは、心の痛みのゆえに叫び、霊の砕けのゆえに泣き叫ぶ」(65:13-14)。","s":141.66,"e":150.783,"p":false,"h":false},{"t":"あなたがたの名は、わたしの選んだ者たちの、呪いの言葉として残される。","s":151.092,"e":156.114,"p":false,"h":false},{"t":"しかし、神である主は、ご自分のしもべたちを、別の名で呼ばれる(65:15)。","s":156.42,"e":161.567,"p":false,"h":false},{"t":"それは、地で祝福される者は、真実の神によって祝福され、地で誓う者は、真実の神によって誓うためだ。","s":161.856,"e":170.193,"p":false,"h":false},{"t":"先の苦しみは忘れられ、わたしの目から隠されるからだ(65:16)。","s":170.496,"e":174.364,"p":true,"h":false},{"t":"そして、この章の中心が来ます。","s":174.996,"e":177.451,"p":false,"h":false},{"t":"「見よ、わたしは新しい天と新しい地を創造する。","s":177.732,"e":181.42,"p":false,"h":false},{"t":"先のことは思い出されず、心に上ることもない」(65:17)。","s":181.692,"e":185.123,"p":false,"h":false},{"t":"だから、わたしが創造するものを、いつまでも喜び楽しめ。","s":185.4,"e":189.697,"p":false,"h":false},{"t":"わたしは、エルサレムを喜びとして、その民を楽しみとして創造する(65:18)。","s":189.972,"e":195.027,"p":false,"h":false},{"t":"わたしは、エルサレムを喜び、わが民を楽しむ。","s":195.336,"e":198.948,"p":false,"h":false},{"t":"そこでは、もう、泣き声も叫び声も聞かれない(65:19)。","s":199.224,"e":202.7,"p":false,"h":false},{"t":"そこには、数日しか生きない乳飲み子も、寿命を全うしない老人もいない。","s":203.004,"e":208.545,"p":false,"h":false},{"t":"百歳で死ぬ者は、若者とされ、百歳に満たないで死ぬ者は、呪われた者とされる(65:20)。","s":208.836,"e":215.097,"p":false,"h":false},{"t":"人々は、家を建てて住み、ぶどう畑を作って、その実を食べる。","s":215.388,"e":220.209,"p":false,"h":false},{"t":"建てた家に他の者が住むことも、植えたものを他の者が食べることもない。","s":220.5,"e":225.309,"p":false,"h":false},{"t":"わたしの民の寿命は、木の寿命のようになり、わたしの選んだ者たちは、自分の手のわざを、存分に楽しむ(65:21-22)。","s":225.576,"e":233.406,"p":false,"h":false},{"t":"彼らは、むなしく労せず、わざわいのために子を産まない。","s":233.712,"e":237.605,"p":false,"h":false},{"t":"彼らは、主に祝福された者の子孫であり、その子孫も、彼らとともにいるからだ(65:23)。","s":237.888,"e":243.882,"p":false,"h":false},{"t":"彼らが呼ぶ前に、わたしは答え、彼らが語っているうちに、わたしは聞く(65:24)。","s":244.152,"e":249.305,"p":false,"h":false},{"t":"狼と子羊は、ともに草を食べ、獅子は、牛のようにわらを食べ、蛇は、ちりを食べ物とする。","s":249.588,"e":256.994,"p":false,"h":false},{"t":"わたしの聖なる山のどこでも、彼らは害を加えず、滅ぼすこともない、と主は言われます(65:25)。","s":257.292,"e":263.615,"p":true,"h":false},{"t":"各節の解説","s":264.24,"e":265.522,"p":true,"h":false},{"t":"1節は、新約聖書で、パウロが、ローマ人への手紙10章で、異邦人が救いを受けたことを語るとき、引いています。","s":266.184,"e":274.689,"p":false,"h":false},{"t":"ここでは、イスラエルの外の人々にも、主が、ご自分を現されることが、語られています。","s":274.968,"e":281.589,"p":false,"h":false},{"t":"ただし、この「尋ねなかった者たち」が、誰を指すのかについては、読み方が分かれます。","s":281.88,"e":288.037,"p":false,"h":false},{"t":"元の文脈では、イスラエル自身を指しているとも読めます。","s":288.324,"e":292.309,"p":true,"h":false},{"t":"2節の「手を差し伸べた」は、主が、反逆の民にも、絶えず呼びかけておられることを示します。","s":292.968,"e":299.673,"p":false,"h":false},{"t":"この節も、パウロは、ローマ人への手紙10章で、引いています。","s":299.952,"e":304.517,"p":true,"h":false},{"t":"3~5節の描写は、異教的な習慣と、独りよがりの聖さを、並べて語ります。","s":305.136,"e":311.327,"p":false,"h":false},{"t":"5節の「私は、あなたより聖なる者だから」という言葉は、外側の清さを誇る人が、実は、神から遠いことを、鋭く示しています。","s":311.616,"e":321.783,"p":true,"h":false},{"t":"8~9節は、さばきの中でも、神の民が、すべて滅ぼされないという、「残りの者」の主題を、もう一度語ります。","s":322.416,"e":331.181,"p":false,"h":false},{"t":"新しいぶどう酒の、たとえは、小さなものの中にある、祝福を見逃さない、神のまなざしを表します。","s":331.452,"e":339.119,"p":true,"h":false},{"t":"17節の「新しい天と新しい地」は、この書の、頂点の一つです。","s":339.768,"e":345.058,"p":false,"h":false},{"t":"新約聖書では、ペテロの手紙第二3章と、黙示録21章で、この約束が、終わりの時の完成の姿として、語られています。","s":345.348,"e":355.364,"p":false,"h":false},{"t":"ここでは、新しい創造が、単なる回復ではなく、先の苦しみが、思い出されないほどの、新しさであることが語られます。","s":355.644,"e":364.351,"p":true,"h":false},{"t":"20~25節の、新しい世界の描写は、解釈が分かれます。","s":365.004,"e":369.931,"p":false,"h":false},{"t":"寿命や、家を建てる、ぶどう畑を作るという描写は、この地上での、平和な生活の描写として読まれることがあります。","s":370.224,"e":378.867,"p":false,"h":false},{"t":"一方で、この描写を、終わりの時の、完全な新しい創造の、詩的な表現として、読む立場もあります。","s":379.152,"e":386.916,"p":false,"h":false},{"t":"ここで語られている、百歳で死ぬ者が若者とされるという言葉が、死がまだ存在する世界を描いているのか、象徴的な表現なのかについても、読み方が分かれます。","s":387.216,"e":398.96,"p":false,"h":false},{"t":"ここでは、細部を一つに決めず、神がもたらされる回復の、大きさと豊かさを、語るものとして読むことをお勧めします。","s":399.24,"e":407.616,"p":true,"h":false},{"t":"25節の、狼と子羊の描写は、11章6~9節と、ほとんど同じです。","s":408.24,"e":414.503,"p":false,"h":false},{"t":"この二つの箇所が、同じ望みを、枠のように語っていることが、分かります。","s":414.792,"e":419.973,"p":true,"h":false}]},{"title":"イザヤ書_66章","audio":"doc66_2610231055.mp3","dur":459.5,"segs":[{"t":"イザヤ書66章","s":0,"e":1.648,"p":true,"h":false},{"t":"全体の流れ","s":2.304,"e":3.409,"p":true,"h":false},{"t":"66章は、主の言葉で始まります。","s":4.212,"e":7.206,"p":false,"h":false},{"t":"「天はわたしの王座、地はわたしの足台。","s":7.488,"e":10.251,"p":false,"h":false},{"t":"あなたがたは、どこに、わたしのために家を建てるのか。","s":10.548,"e":14.267,"p":false,"h":false},{"t":"どこに、わたしのいこいの場があるのか」(66:1)。","s":14.58,"e":17.106,"p":false,"h":false},{"t":"これらはみな、わたしの手が造り、これらはみな、わたしのものだ。","s":17.388,"e":21.882,"p":false,"h":false},{"t":"しかし、わたしが目を留めるのは、苦しむ者、霊の砕かれた者、わたしのことばにおののく者だ(66:2)。","s":22.176,"e":29.181,"p":true,"h":false},{"t":"一方、牛を屠る者は、人を打ち殺す者のようで、羊をささげる者は、犬の首を折る者のようです。","s":29.808,"e":37.265,"p":false,"h":false},{"t":"彼らは、自分の道を選び、その心は、忌むべきものを喜びとしています(66:3)。","s":37.548,"e":43.208,"p":false,"h":false},{"t":"だから、わたしも、彼らへの懲らしめを選び、彼らが恐れることを、彼らにもたらす。","s":43.488,"e":49.494,"p":false,"h":false},{"t":"わたしが呼んだのに、答える者はなく、わたしが語ったのに、聞く者はいなかったからだ(66:4)。","s":49.788,"e":55.683,"p":true,"h":false},{"t":"主のことばに、おののく者たちよ、聞け。","s":56.304,"e":59.115,"p":false,"h":false},{"t":"あなたがたの兄弟たちは、あなたがたを憎み、わたしの名のゆえに、あなたがたを追い出して言う。","s":59.4,"e":65.792,"p":false,"h":false},{"t":"「主が栄光を現されるように。","s":66.096,"e":68.06,"p":false,"h":false},{"t":"私たちは、あなたがたの喜びを見よう」。","s":68.364,"e":71.376,"p":false,"h":false},{"t":"しかし、恥を見るのは、彼らのほうだ(66:5)。","s":71.676,"e":74.648,"p":false,"h":false},{"t":"町から騒ぎの声が、宮から声が聞こえる。","s":74.952,"e":78.149,"p":false,"h":false},{"t":"主が、敵に報いておられる声だ(66:6)。","s":78.408,"e":80.841,"p":true,"h":false},{"t":"産みの苦しみが来る前に、シオンは産んだ。","s":81.468,"e":84.356,"p":false,"h":false},{"t":"陣痛が来る前に、男の子を産んだ。","s":84.636,"e":87.18,"p":false,"h":false},{"t":"だれが、このようなことを聞いただろうか。","s":87.48,"e":90.12,"p":false,"h":false},{"t":"国が、一日で生まれるだろうか。","s":90.396,"e":92.629,"p":false,"h":false},{"t":"シオンは、産みの苦しみをするや否や、その子らを産んだ(66:7-8)。","s":92.916,"e":96.959,"p":false,"h":false},{"t":"「わたしが、産もうとして、産ませないことがあろうか」と主は言われる(66:9)。","s":97.272,"e":101.583,"p":false,"h":false},{"t":"エルサレムを愛する者はみな、ともに喜び、ともに楽しめ。","s":101.88,"e":106.22,"p":false,"h":false},{"t":"彼女のために悲しんだ者は、ともに喜べ(66:10)。","s":106.524,"e":109.62,"p":false,"h":false},{"t":"それは、あなたがたが、その慰めの乳房から飲んで満ち足り、その豊かな栄光から飲んで、喜びを得るためだ(66:11)。","s":109.908,"e":117.683,"p":true,"h":false},{"t":"主は言われます。","s":118.332,"e":119.371,"p":false,"h":false},{"t":"「見よ、わたしは、川のように、平和を彼女に与え、あふれる流れのように、国々の栄光を与える。","s":120.24,"e":127.449,"p":false,"h":false},{"t":"あなたがたは、乳を飲み、腕に抱かれ、膝の上であやされる。","s":127.728,"e":132.151,"p":false,"h":false},{"t":"母に慰められる者のように、わたしもあなたがたを慰める。","s":132.444,"e":136.586,"p":false,"h":false},{"t":"あなたがたは、エルサレムで慰められる」(66:12-13)。","s":136.872,"e":139.582,"p":false,"h":false},{"t":"あなたがたは見て、心は喜び、あなたがたの骨は、若草のように生き返る。","s":139.86,"e":145.538,"p":false,"h":false},{"t":"主の手は、そのしもべたちに知られ、その憤りは、敵に知られる(66:14)。","s":145.836,"e":150.743,"p":true,"h":false},{"t":"見よ、主は火のうちに来られる。","s":151.38,"e":153.515,"p":false,"h":false},{"t":"その戦車は、つむじ風のようだ。","s":153.792,"e":156.122,"p":false,"h":false},{"t":"主は、憤りをもって怒りを注ぎ、火の炎をもって叱責される(66:15)。","s":156.42,"e":161.243,"p":false,"h":false},{"t":"主は火をもって、すべての肉なる者を、剣をもってさばかれ、主に殺される者は多い(66:16)。","s":161.532,"e":167.606,"p":false,"h":false},{"t":"園で身をきよめる儀式をして、忌むべきものを食べる者たちも、ともに終わりを迎えます(66:17)。","s":167.904,"e":173.785,"p":true,"h":false},{"t":"主は、国々と、あらゆる国語の民を、集めに来られます。","s":174.42,"e":178.44,"p":false,"h":false},{"t":"彼らは来て、わたしの栄光を見る(66:18)。","s":178.704,"e":181.05,"p":false,"h":false},{"t":"わたしは、彼らの中にしるしを置き、逃れた者たちを、タルシシュ、プル、ルデ、トバル、ヤワン、遠い島々に遣わす。","s":181.332,"e":190.552,"p":false,"h":false},{"t":"彼らは、わたしの栄光を、諸国民の間に告げ知らせる(66:19)。","s":190.836,"e":194.971,"p":false,"h":false},{"t":"彼らは、すべての国々から、あなたがたの兄弟たちを、主へのささげ物として、馬、戦車、荷車、らば、ラクダに乗せて、エルサレムの、わたしの聖なる山に連れて来る(66:20)。","s":195.264,"e":208.017,"p":false,"h":false},{"t":"わたしは、その中から、祭司、レビ人を選ぶ(66:21)。","s":208.296,"e":212.007,"p":true,"h":false},{"t":"「わたしが造る新しい天と新しい地が、わたしの前にいつまでも続くように、あなたがたの子孫と、あなたがたの名も、いつまでも続く」(66:22)。","s":212.652,"e":221.783,"p":false,"h":false},{"t":"新月ごとに、安息日ごとに、すべての肉なる者が、わたしの前に来て、ひれ伏す(66:23)。","s":222.084,"e":228.15,"p":false,"h":false},{"t":"彼らは出て行って、わたしに背いた者たちの死体を見る。","s":228.42,"e":232.138,"p":false,"h":false},{"t":"そのうじは死なず、その火は消えず、すべての肉なる者の、忌み嫌うものとなる(66:24)。","s":232.416,"e":238.016,"p":true,"h":false},{"t":"各節の解説","s":238.644,"e":239.926,"p":true,"h":false},{"t":"1~2節は、神殿を建てることで、神を閉じ込めることはできない、という宣言です。","s":240.588,"e":246.79,"p":false,"h":false},{"t":"天と地を造られた方が、人の建てた家に、収まるはずがありません。","s":247.068,"e":251.548,"p":false,"h":false},{"t":"新約聖書では、使徒の働きで、ステパノが、この言葉を引いています。","s":251.856,"e":256.963,"p":false,"h":false},{"t":"神が目を留められるのは、立派な建物ではなく、砕かれた霊の人です。","s":257.256,"e":262.431,"p":true,"h":false},{"t":"3~4節の、いけにえの描写は、解釈が難しいところです。","s":263.088,"e":267.78,"p":false,"h":false},{"t":"神がいけにえを嫌われるという意味ではなく、心が神から離れたまま、形だけいけにえをささげることが、神にとって忌まわしい、ということです。","s":268.092,"e":277.636,"p":false,"h":false},{"t":"1章の、形だけの礼拝への批判と、同じ流れにあります。","s":277.956,"e":282.136,"p":true,"h":false},{"t":"7~9節の、産みの苦しみなく、一日で国が生まれるという描写は、神の民の回復が、人の理解を超えて、神ご自身のわざによることを、語っています。","s":282.78,"e":294.248,"p":false,"h":false},{"t":"この描写を、バビロンからの帰還と結びつけて読む立場も、新約聖書の教会の誕生と結びつけて読む立場も、終わりの時の完成と結びつけて読む立場も、あります。","s":294.552,"e":306.182,"p":false,"h":false},{"t":"どれを中心にするかは、読み方が分かれます。","s":306.468,"e":309.632,"p":true,"h":false},{"t":"12~13節の、母が子を慰めるように、主が慰められるという言葉は、神の慰めの、やさしさを語ります。","s":310.284,"e":319.069,"p":false,"h":false},{"t":"40章1節の「慰めよ、慰めよ」で始まった、この後半が、ここで、慰めの言葉で、一つの枠をつくっています。","s":319.356,"e":328.399,"p":true,"h":false},{"t":"15~16節は、主が、さばきのために来られるという描写です。","s":329.04,"e":334.05,"p":false,"h":false},{"t":"「火」と「剣」は、さばきの徹底さを表します。","s":334.332,"e":337.485,"p":false,"h":false},{"t":"新約聖書の、テサロニケ人への手紙第二1章などで、キリストの再臨のさばきと、結びつけて読まれることがあります。","s":337.788,"e":345.963,"p":true,"h":false},{"t":"17節は、園で身をきよめるという、異教的な儀式にふける者たちへの宣告です。","s":346.608,"e":352.772,"p":false,"h":false},{"t":"表向きは、きよめの儀式のように見えても、神ではないものに向かう礼拝は、さばきを免れない、ということです。","s":353.052,"e":361.079,"p":false,"h":false},{"t":"食べ物の細部については、本文の読み方が難しいところがあるので、ここでは深入りしません。","s":361.404,"e":367.856,"p":true,"h":false},{"t":"18~21節は、読み方が分かれやすい箇所です。","s":368.496,"e":372.513,"p":false,"h":false},{"t":"「逃れた者たち」が、誰を指すのか、遠い島々に遣わされることが、何を意味するのかについて、解釈が分かれます。","s":372.78,"e":380.844,"p":false,"h":false},{"t":"ここでは、神の栄光が、地の果てまで告げられ、諸国民が、神の民として、主のもとに集められるという望みが、語られています。","s":381.132,"e":390.8,"p":false,"h":false},{"t":"19節の地名は、当時の人々にとって、世界の果ての、遠い国々を表します。","s":391.104,"e":397.477,"p":false,"h":false},{"t":"21節で、異邦人の中から祭司、レビ人が選ばれるという約束は、56章の、異邦人や宦官への約束の、完成として読まれます。","s":397.764,"e":408.227,"p":false,"h":false},{"t":"ただし、この「その中から」が、異邦人の中からなのか、集められたイスラエルの兄弟の中からなのかは、読み方が分かれます。","s":408.528,"e":417.442,"p":true,"h":false},{"t":"22節の「新しい天と新しい地」は、65章17節の約束が、ここで、もう一度語られています。","s":418.068,"e":426.273,"p":false,"h":false},{"t":"この書が、新しい創造への望みで、閉じられていることが分かります。","s":426.564,"e":431.432,"p":true,"h":false},{"t":"24節の「そのうじは死なず、その火は消えず」は、イザヤ書の最後の言葉として、きびしいものです。","s":432.072,"e":439.361,"p":false,"h":false},{"t":"この節は、新約聖書で、イエスが、マルコの福音書9章で、地獄について語られるとき、引かれています。","s":439.668,"e":447.51,"p":false,"h":false},{"t":"書の終わりが、さばきの言葉で閉じられることには、重い意味があります。","s":447.804,"e":452.172,"p":false,"h":false},{"t":"ここでは、神に背く者の、最後の姿を、詩的な言葉で、語るものとして読みます。","s":452.484,"e":458.857,"p":true,"h":false}]}];

    b.textContent = auto ? '🔁 이어듣기 켜짐 ✔' : '⏹ 이어듣기 꺼짐';
    h.classList.toggle('off', !auto);
    h.textContent = auto ? '초록색이면 켜진 상태입니다. 그대로 두고 아래 ▶ 재생만 누르세요. (이 단추를 누르면 꺼집니다)' : '지금은 꺼져 있어서 한 글만 듣고 멈춥니다. 위 회색 단추를 눌러 켜세요.';
  }
  function hideNote() { $('note').style.display = 'none'; }
  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.defaultPlaybackRate = SPEEDS[spd]; audio.playbackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applyAuto();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { const S = segs(); let k = -1; for (let i = 0; i < S.length; i++) { if (S[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function clearMark() { const o = $('g' + lastK + '_' + lastI); if (o) { o.classList.remove('on'); } lastK = -1; lastI = -1; }
  function mark(i, follow) {
    if (i === lastI && ti === lastK) { return; }
    const old = $('g' + lastK + '_' + lastI); if (old) { old.classList.remove('on'); }
    lastK = ti; lastI = i;
    const el = $('g' + ti + '_' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function updateNow() { $('now').textContent = (ti + 1) + ' / ' + N + ' · ' + TRACKS[ti].title; }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || TRACKS[ti].dur || 0;
    $('cur').textContent = fmt(t);
    $('tot').textContent = fmt(d);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
    try { if ('mediaSession' in navigator) { navigator.mediaSession.playbackState = p ? 'playing' : 'paused'; } } catch (e) {}
  }
  function savePos() { pref('pos', ti + ':' + (audio.currentTime || 0)); }
  function play() { const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); savePos(); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || TRACKS[ti].dur || t))); paint(); }

  function mediaMeta() {
    try { if ('mediaSession' in navigator && window.MediaMetadata) { navigator.mediaSession.metadata = new MediaMetadata({ title: TRACKS[ti].title, artist: TITLE, album: TITLE }); } } catch (e) {}
  }
  function prefetch(k) { if (k >= 0 && k < N) { try { const a = new Audio(); a.preload = 'auto'; a.src = TRACKS[k].audio; } catch (e) {} } }

  /* 글 바꾸기: 같은 페이지, 같은 소리 재생기를 계속 써서 폰에서도 끊기지 않고 이어집니다 */
  function loadTrack(k, start, auto) {
    if (k < 0 || k >= N) { return; }
    ti = k; lastUser = 0;
    audio.src = TRACKS[k].audio;
    applySpd();
    const st = start || 0;
    const onMeta = () => { audio.removeEventListener('loadedmetadata', onMeta); if (st > 0) { try { audio.currentTime = st; } catch (e) {} } paint(); };
    audio.addEventListener('loadedmetadata', onMeta);
    clearMark(); updateNow(); mediaMeta(); prefetch(k + 1);
    if (auto) { play(); } else { paint(); }
  }
  function jump(k, i) {
    const S = TRACKS[k] && TRACKS[k].segs; if (!S || i < 0 || i >= S.length) { return; }
    lastUser = 0;
    if (k !== ti) { loadTrack(k, S[i].s, true); return; }
    seek(S[i].s); mark(i, true); if (!playing) { play(); }
  }

  audio.addEventListener('timeupdate', () => {
    if (!playing) { paint(); }
    if (Date.now() - lastSave > 4000) { lastSave = Date.now(); savePos(); }
  });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => {
    if (ti < N - 1) {
      if (auto) { loadTrack(ti + 1, 0, true); return; }
      setPlaying(false); clearMark(); pref('pos', (ti + 1) + ':0');
      const n = $('note'); n.style.display = 'block';
      n.innerHTML = '이어듣기가 <b>꺼져 있어서</b> 멈췄습니다. <button type="button" id="nb">이어듣기 켜고 다음 글 듣기</button>';
      $('nb').onclick = () => { auto = true; applyAuto(); hideNote(); loadTrack(ti + 1, 0, true); };
    } else { setPlaying(false); pref('pos', '0:0'); clearMark(); }
  });
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('auto').onclick = () => { auto = !auto; applyAuto(); hideNote(); };
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => {
    const t = audio.currentTime || 0, i = idxAt(t), cur = segs()[i];
    if (cur && t - cur.s > 2) { jump(ti, i); }
    else if (i > 0) { jump(ti, i - 1); }
    else if (ti > 0) { loadTrack(ti - 1, 0, true); }
    else { seek(0); }
  };
  $('next').onclick = () => {
    const i = idxAt(audio.currentTime || 0) + 1;
    if (i < segs().length) { jump(ti, i); } else if (ti < N - 1) { loadTrack(ti + 1, 0, true); }
  };
  $('pt').onclick = () => { if ((audio.currentTime || 0) > 5 || ti === 0) { jump(ti, 0); } else { loadTrack(ti - 1, 0, true); } };
  $('nt').onclick = () => { if (ti < N - 1) { loadTrack(ti + 1, 0, true); } };
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || TRACKS[ti].dur || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-k'), +s.getAttribute('data-i')); } });
  $('toc').addEventListener('click', e => {
    const a = e.target.closest ? e.target.closest('a') : null; if (!a) { return; }
    e.preventDefault(); $('lst').open = false; lastUser = 0;
    const k = +a.getAttribute('data-k');
    loadTrack(k, 0, true);
    const sec = $('t' + k); if (sec) { try { sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (x) {} }
  });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', savePos);

  /* 잠금 화면·이어폰 단추 */
  try {
    if ('mediaSession' in navigator) {
      const ms = navigator.mediaSession;
      const set = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
      set('play', play); set('pause', pause);
      set('nexttrack', () => $('nt').onclick()); set('previoustrack', () => $('pt').onclick());
      set('seekbackward', () => seek((audio.currentTime || 0) - 10)); set('seekforward', () => seek((audio.currentTime || 0) + 10));
    }
  } catch (e) {}

  /* 시작: 첫 글을 준비해 두고, 지난번 위치가 있으면 이어 듣기 안내 */
  loadTrack(0, 0, false);
  const sp = (pref('pos') || '').split(':'), rk = parseInt(sp[0], 10), rt = parseFloat(sp[1]);
  if (rk >= 0 && rk < N && rt > 10 && rt < (TRACKS[rk].dur || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + esc(TRACKS[rk].title) + '</b> ' + fmt(rt) + '까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { r.style.display = 'none'; loadTrack(rk, rt, true); };
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, loadTrack, toggle, audio, TRACKS, state: () => ({ ti, auto, playing }) };
})();
</script>
</body>
</html>
