<style>
  :root { --bg:#FAF8F3; --ink:#1F2A24; --mute:#5E6B63; --acc:#2E7D4F; --hl:#AEDDBF; --bar:#1F3A2B; --fs:22px; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); line-height:1.95; word-break:keep-all; padding-bottom:120px; }
  .wrap { max-width:760px; margin:0 auto; padding:26px 20px 0; }
  header h1 { font-size:30px; font-weight:900; line-height:1.4; letter-spacing:-0.01em; }
  header .meta { color:var(--mute); font-size:16px; margin:6px 0 4px; }
  header .rule { height:4px; width:64px; background:var(--acc); border-radius:4px; margin:14px 0 22px; }
  #resume { display:none; background:#EAF3EC; border:2px solid #BFD9C7; border-radius:14px; padding:12px 16px; margin-bottom:18px; font-size:17px; }
  #resume button { background:var(--acc); color:#fff; border:0; border-radius:12px; font:inherit; font-weight:900; font-size:16px; padding:8px 14px; margin-left:8px; cursor:pointer; }
  .top { margin:0 0 8px; }
  button.auto { font:inherit; font-weight:900; font-size:19px; height:52px; padding:0 20px; border-radius:14px; cursor:pointer; background:#EEE; color:#555; border:2px solid #CCC; }
  button.auto.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .autohint { font-size:17px; line-height:1.6; margin:6px 0 16px; color:var(--mute); }
  .autohint.off { color:#9a4a00; font-weight:700; }
  #note { display:none; background:#FFF3DC; border:2px solid #F0D49A; border-radius:14px; padding:12px 16px; margin-bottom:18px; font-size:17px; }
  #note button { background:var(--acc); color:#fff; border:0; border-radius:12px; font:inherit; font-weight:900; font-size:16px; padding:8px 14px; margin-left:8px; cursor:pointer; }
  details#lst { background:#fff; border:2px solid #DCE6DF; border-radius:14px; padding:10px 16px; margin-bottom:20px; }
  details#lst summary { cursor:pointer; font-weight:900; font-size:18px; color:var(--acc); }
  #toc { margin:10px 0 4px 22px; font-size:19px; }
  #toc li { margin:6px 0; }
  #toc a { color:var(--ink); text-decoration:none; }
  #toc .d { color:var(--mute); font-size:15px; margin-left:6px; }
  section.trk { margin-top:34px; padding-top:6px; border-top:3px solid #DCE6DF; scroll-margin-top:12px; }
  section.trk:first-child { margin-top:0; border-top:0; }
  h2.tt { font-size:calc(var(--fs) + 8px); font-weight:900; margin:.6em 0 .6em; line-height:1.45; }
  #text p { font-size:var(--fs); margin-bottom:1.1em; }
  #text h3.hd { font-size:calc(var(--fs) + 4px); font-weight:900; margin:1.6em 0 .6em; color:var(--acc); line-height:1.5; }
  .seg { cursor:pointer; border-radius:8px; padding:1px 3px; -webkit-box-decoration-break:clone; box-decoration-break:clone; scroll-margin-top:24px; transition:background .2s; }
  .seg.on { background:var(--hl); box-shadow:0 0 0 3px var(--hl); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--bar); color:#fff; padding:0 12px calc(6px + env(safe-area-inset-bottom,0px)); box-shadow:0 -4px 18px rgba(0,0,0,.25); z-index:50; }
  .now { text-align:center; font-size:14px; opacity:.9; padding:6px 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prog { height:10px; background:rgba(255,255,255,.22); cursor:pointer; overflow:hidden; margin:0 -12px 6px; }
  .prog i { display:block; height:100%; width:0; background:#8fe0a8; }
  .bar .in { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
  .tm { font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; padding:0 6px; opacity:.95; }
  .bar button { font:inherit; font-weight:900; font-size:16px; border:0; border-radius:12px; padding:0 12px; height:44px; min-width:44px; background:rgba(255,255,255,.16); color:#fff; cursor:pointer; }
  .bar button:active { transform:scale(.96); }
  .bar button:focus-visible { outline:3px solid #FFE680; outline-offset:2px; }
  #play { background:#3FAE6A; font-size:18px; min-width:100px; }
  .bar button.o { font-size:14px; min-width:40px; padding:0 10px; background:rgba(255,255,255,.1); }
  @media (max-width:640px) { header h1 { font-size:25px; } .bar button { height:42px; padding:0 9px; } #play { min-width:84px; } }
  @media print { .bar { display:none; } body { padding-bottom:0; } }
</style>

<script>
(function () {
  const TITLE = "낭독 목록", TRACKS = [{"title":"イザヤ書_01章","audio":"doc01_2610231055.mp3","dur":291.7,"segs":[{"t":"イザヤ書1章","s":0,"e":1.164,"p":true,"h":false},{"t":"全体の流れ","s":1.908,"e":3.013,"p":true,"h":false},{"t":"イザヤの書は、天と地を証人に立てる、主の訴えから始まります。","s":3.816,"e":8.563,"p":false,"h":false},{"t":"主は子として育てた民に背かれました。","s":8.856,"e":11.512,"p":false,"h":false},{"t":"牛は飼い主を知り、ろばは主人の飼い葉おけを知っているのに、イスラエルは主を知ろうとしません(1:2-3)。","s":11.808,"e":18.219,"p":false,"h":false},{"t":"民は頭から足の裏まで傷だらけで、土地は荒れ果て、エルサレムはかろうじて残った小屋のようです(1:5-8)。","s":18.54,"e":25.17,"p":false,"h":false},{"t":"それでも主が少しの生き残りを残してくださったので、ソドムやゴモラのように滅びなかったのです(1:9)。","s":25.452,"e":31.568,"p":true,"h":false},{"t":"ところが、民は熱心にいけにえをささげ、祭りを守り、祈りを重ねていました。","s":32.22,"e":38.127,"p":false,"h":false},{"t":"主はそれをすべて退けられます。","s":38.412,"e":40.572,"p":false,"h":false},{"t":"手が血で満ちているからです(1:11-15)。","s":40.86,"e":42.513,"p":false,"h":false},{"t":"主が求めておられるのは、悪から離れ、正しいことを学び、さばきを公正にし、孤児ややもめのために戦うことです(1:16-17)。","s":42.804,"e":51.476,"p":false,"h":false},{"t":"そのうえで主は、「さあ、来なさい。","s":51.768,"e":54.094,"p":false,"h":false},{"t":"論じ合おう」と招かれます。","s":54.396,"e":56.074,"p":false,"h":false},{"t":"罪が緋のように赤くても、雪のように白くしてくださる、という約束です(1:18)。","s":56.376,"e":61.483,"p":false,"h":false},{"t":"聞き従うか、逆らうか、道は二つに分かれます(1:19-20)。","s":61.776,"e":65.482,"p":true,"h":false},{"t":"後半では、かつて「忠実な都」と呼ばれたエルサレムが、遊女のようになったと嘆かれます。","s":66.132,"e":72.572,"p":false,"h":false},{"t":"銀はかすになり、酒は水で薄められ、指導者たちは賄賂を好み、孤児を守りません(1:21-23)。","s":72.864,"e":79.196,"p":false,"h":false},{"t":"しかし主は、火で精錬するようにかすを取り除き、さばき人を元のように立て直し、この町を再び「義の町」と呼ばせてくださいます(1:24-27)。","s":79.488,"e":89.132,"p":false,"h":false},{"t":"礼拝の形だけが整っていても、心と生き方が主に向いていなければ、主は受け入れてくださいません。","s":89.424,"e":96.46,"p":false,"h":false},{"t":"そして主ご自身が、民をきよめて回復してくださるのです。","s":96.768,"e":100.886,"p":true,"h":false},{"t":"各節の解説","s":101.52,"e":102.802,"p":true,"h":false},{"t":"1節で、ウジヤ、ヨタム、アハズ、ヒゼキヤという四人の王の名が挙げられるのは、イザヤの働きが長い期間にわたったことを示しています。","s":103.464,"e":113.281,"p":false,"h":false},{"t":"この章の幻が、これらの王の時代の民に向けられた言葉だと知っておくと、背景がつかみやすくなります。","s":113.58,"e":120.748,"p":true,"h":false},{"t":"3節の牛とろばの例えは、神を知らない人間が、動物よりも鈍いことを言っています。","s":121.392,"e":127.67,"p":false,"h":false},{"t":"動物でさえ誰に養われているかを知っているのに、神の民が主を知らない、という皮肉です。","s":127.98,"e":134.303,"p":true,"h":false},{"t":"9節で、「ソドムのように」ならなかったのは、民が立派だったからではなく、主が少しの者を残されたからです。","s":134.928,"e":142.36,"p":false,"h":false},{"t":"ここには、救いはいつも神の憐れみから出る、という聖書の筋が早くも現れています。","s":142.632,"e":148.83,"p":true,"h":false},{"t":"10節では、エルサレムの指導者や民が、ソドムの支配者、ゴモラの民と呼ばれます。","s":149.472,"e":155.64,"p":false,"h":false},{"t":"ひどい呼び方ですが、選ばれた民でさえ、神の前では異邦の罪深い町と同じだと言われているのです。","s":155.952,"e":163.019,"p":true,"h":false},{"t":"11~15節で、主がいけにえや祭りを拒まれるのは、礼拝そのものが間違っているからではありません。","s":163.656,"e":171.206,"p":false,"h":false},{"t":"主ご自身が定められたものだからです。","s":171.504,"e":173.943,"p":false,"h":false},{"t":"問題は、心が離れたまま形だけを続けていたことです。","s":174.24,"e":178.424,"p":false,"h":false},{"t":"「手は血で満ちている」とあるので、弱い人への不正が礼拝と並行して行われていたことがわかります。","s":178.74,"e":185.076,"p":true,"h":false},{"t":"18節の「論じ合おう」は、法廷で争う場面の言葉です。","s":185.724,"e":190.043,"p":false,"h":false},{"t":"この節は読み方が分かれます。","s":190.332,"e":192.351,"p":false,"h":false},{"t":"罪人への心からの招きとして読む立場が多いのですが、「罪が緋のようでも白くなるのか」と皮肉を込めた問いとして読む立場もあります。","s":192.636,"e":201.666,"p":false,"h":false},{"t":"改革派の伝統は、赦しを約束する恵みの言葉として重く受け取ってきました。","s":201.96,"e":207.431,"p":false,"h":false},{"t":"ただし、その赦しは、19~20節が示すように、従う者に向けられた約束です。","s":207.72,"e":214.364,"p":true,"h":false},{"t":"21節で、「忠実な都」が「遊女」になったという表現は、聖書でよく使われる比喩です。","s":214.992,"e":221.616,"p":false,"h":false},{"t":"神との契約を破って、ほかのものに心を向けた姿を、結婚への不誠実にたとえています。","s":221.904,"e":228.458,"p":true,"h":false},{"t":"22節の銀とかす、水で薄められた酒は、見た目は同じでも中身が落ちてしまった状態を表しています。","s":229.104,"e":236.842,"p":false,"h":false},{"t":"信仰の形は残っていても、中身が薄くなっているということです。","s":237.132,"e":241.569,"p":true,"h":false},{"t":"25節で、主が「手を向けて」かすを取り除くというのは、さばきの言葉ですが、同時に清める働きでもあります。","s":242.208,"e":250.38,"p":false,"h":false},{"t":"罰が目的ではなく、きよい民を取り戻すためのものだと読めます。","s":250.668,"e":255.173,"p":true,"h":false},{"t":"27節の「贖われる」は、公正と義によってシオンが回復される、ということです。","s":255.816,"e":261.778,"p":false,"h":false},{"t":"ここでは、さばきの後に残された者が悔い改めて立ち返る、という流れが描かれています。","s":262.08,"e":268.482,"p":true,"h":false},{"t":"29~31節の樫の木と園は、偶像礼拝が行われた場所を指していると考えられます。","s":269.136,"e":275.974,"p":false,"h":false},{"t":"人が頼りにして喜んでいたものが、やがて恥となり、枯れてしまいます。","s":276.264,"e":281.092,"p":false,"h":false},{"t":"31節の「強い者」が何を指すかは解釈が分かれますが、人間の力に頼るものが、火花一つで燃え尽きる、という意味では一致しています。","s":281.376,"e":291.094,"p":true,"h":false}]},{"title":"イザヤ書_02章","audio":"doc02_2610231055.mp3","dur":217.3,"segs":[{"t":"イザヤ書2章","s":0,"e":1.186,"p":true,"h":false},{"t":"全体の流れ","s":1.908,"e":3.013,"p":true,"h":false},{"t":"この章は、神の民の未来の姿から始まります。","s":3.816,"e":7.459,"p":false,"h":false},{"t":"終わりの日に、主の家の山がすべての山の上にそびえ立ち、あらゆる国の民がそこへ流れ込みます(2:2)。","s":7.74,"e":14.672,"p":false,"h":false},{"t":"人々は「ヤコブの神の家に行こう。","s":14.94,"e":17.581,"p":false,"h":false},{"t":"主が私たちにご自分の道を教えてくださる」と言い合います(2:3)。","s":17.892,"e":21.874,"p":false,"h":false},{"t":"主が国々の間をさばかれるとき、人々は剣を鋤に、槍を鎌に打ち直し、もう戦いを学ばなくなります(2:4)。","s":22.176,"e":30.214,"p":false,"h":false},{"t":"平和は、人間の努力の積み重ねではなく、神の支配の実りとして描かれています。","s":30.492,"e":36.39,"p":true,"h":false},{"t":"ところが、イザヤの目はそこで現実に戻ります。","s":37.044,"e":40.34,"p":false,"h":false},{"t":"「ヤコブの家よ、来なさい。","s":40.644,"e":42.347,"p":false,"h":false},{"t":"主の光の中を歩もう」(2:5)。","s":42.624,"e":44.312,"p":false,"h":false},{"t":"未来の約束は、今どう歩むのかを問う招きでもあります。","s":44.604,"e":48.666,"p":false,"h":false},{"t":"実際の民は、占いに頼り、外国の風習に染まり、銀や金や馬や戦車をたくわえ、自分の手で作った偶像にひれ伏していました(2:6-8)。","s":48.96,"e":58.718,"p":false,"h":false},{"t":"だから、主の日が来ます。","s":59.004,"e":60.732,"p":false,"h":false},{"t":"それは、すべて高ぶるものに向かう日です。","s":61.02,"e":63.881,"p":false,"h":false},{"t":"人間の誇りは低くされ、ただ主だけが高く上げられます(2:11-17)。","s":64.188,"e":68.253,"p":false,"h":false},{"t":"最後にイザヤは、人間に頼るのをやめるよう呼びかけます(2:22)。","s":68.544,"e":72.534,"p":true,"h":false},{"t":"各節の解説","s":73.188,"e":74.47,"p":true,"h":false},{"t":"2~4節は、ミカ書にも似た言葉が出てくる有名な箇所です。","s":75.132,"e":79.813,"p":false,"h":false},{"t":"「終わりの日」は、神の計画が完成に向かう時を指します。","s":80.1,"e":84.218,"p":false,"h":false},{"t":"山が高くされるというのは、地理が変わるというより、主の礼拝が諸国の中心になるという意味です。","s":84.492,"e":91.083,"p":false,"h":false},{"t":"改革派の伝統は、これを教会を通して福音が諸国民に広がることの預言とも結びつけて読んできました。","s":91.368,"e":98.737,"p":false,"h":false},{"t":"ただし、どの時期のどの出来事に当たるのかについては、読み方が分かれます。","s":99.036,"e":104.256,"p":true,"h":false},{"t":"4節で、みことばがエルサレムから出ていくと言われているのは、教えとさばきが主から来ることを表しています。","s":104.904,"e":112.259,"p":false,"h":false},{"t":"人々が武器を道具に打ち直すのは、戦いをやめたいという人間の願いが、ようやく神の支配の下で実現する姿です。","s":112.536,"e":121.108,"p":true,"h":false},{"t":"5節は、2~4節の約束と6節以降の現実をつなぐ蝶番です。","s":121.752,"e":127.168,"p":false,"h":false},{"t":"約束を聞いた者は、まだ実現していない今の時代にも、その光の中を歩むよう招かれています。","s":127.44,"e":134.597,"p":true,"h":false},{"t":"6節の前半は、写本の読みが難しいところで、訳によって表現が違います。","s":135.216,"e":141.059,"p":false,"h":false},{"t":"ただし、全体の意味は、民が主から離れて、外国の宗教や占いに頼るようになった、ということです。","s":141.372,"e":148.362,"p":true,"h":false},{"t":"8節の「手で作ったもの」に対する礼拝は、偶像礼拝の愚かさを突いています。","s":149.004,"e":154.423,"p":false,"h":false},{"t":"人が作ったものを、人が拝むという矛盾です。","s":154.692,"e":157.815,"p":true,"h":false},{"t":"9節の「彼らをお赦しにならないように」という言葉は、訳によって読み方が揺れます。","s":158.472,"e":164.227,"p":false,"h":false},{"t":"さばきがそれほど厳しく確かだ、という意味で受け取るのが一般的です。","s":164.52,"e":169.121,"p":true,"h":false},{"t":"12~17節で挙げられる杉の木、山、城壁、船は、当時の人々が誇りにしていた強さや豊かさの象徴です。","s":169.776,"e":179.02,"p":false,"h":false},{"t":"レバノンの杉やバシャンの樫の木は、高くそびえるものの代表で、人間の高ぶりを表します。","s":179.316,"e":185.905,"p":false,"h":false},{"t":"主の日は、それらをすべて低くする日です。","s":186.192,"e":189.046,"p":true,"h":false},{"t":"19~21節で、人々が岩の洞穴に逃げ込むのは、主の威光に耐えられないからです。","s":189.684,"e":196.268,"p":false,"h":false},{"t":"20節で偶像を、もぐらやこうもりに投げ与えるという姿は、頼っていたものが、どれほどむなしかったかを物語っています。","s":196.56,"e":205.002,"p":true,"h":false},{"t":"22節の言葉は、人間を頼る愚かさを短くまとめています。","s":205.632,"e":210.378,"p":false,"h":false},{"t":"「鼻で息をしているだけの者」とは、人間のいのちがどれほど頼りないかを言い表しています。","s":210.672,"e":216.605,"p":true,"h":false}]},{"title":"イザヤ書_03章","audio":"doc03_2610231055.mp3","dur":178.3,"segs":[{"t":"イザヤ書3章","s":0,"e":1.214,"p":true,"h":false},{"t":"全体の流れ","s":1.908,"e":3.013,"p":true,"h":false},{"t":"主は、エルサレムとユダから、人々が頼りにしているものを取り去られます。","s":3.816,"e":8.806,"p":false,"h":false},{"t":"パンと水という生活の支えだけでなく、勇士、さばき人、預言者、長老、知恵ある助言者といった、国を支える人々まで取り除かれます(3:1-3)。","s":9.108,"e":19.65,"p":false,"h":false},{"t":"指導者がいなくなった国では、未熟な若者や子どもが治める者となり、民は互いに苦しめ合います(3:4-5)。","s":19.944,"e":27.177,"p":true,"h":false},{"t":"その原因は、政治の失敗ではありません。","s":27.792,"e":30.872,"p":false,"h":false},{"t":"エルサレムがつまずいたのは、言葉も行いも主に逆らったからです(3:8-9)。","s":31.176,"e":35.675,"p":false,"h":false},{"t":"主は、正しい人には「あなたはさいわいだ」と告げ、悪しき者には災いを告げられます(3:10-11)。","s":35.964,"e":42.126,"p":false,"h":false},{"t":"後半では、豊かな女性たちの外側の飾りが取り去られ、町の門は嘆きに沈みます(3:16-26)。","s":42.408,"e":48.781,"p":false,"h":false},{"t":"神でないものに寄りかかる社会は、見た目がどれほど華やかでも、内側から崩れていきます。","s":49.068,"e":55.288,"p":true,"h":false},{"t":"各節の解説","s":55.944,"e":57.226,"p":true,"h":false},{"t":"1~3節で取り去られるものが並べられているのは、国を支える柱を一本ずつ数え上げるためです。","s":57.888,"e":64.798,"p":false,"h":false},{"t":"勇士や軍人だけでなく、預言者や占い師まで含まれています。","s":65.088,"e":69.381,"p":false,"h":false},{"t":"ここでは、国の秩序を支えるあらゆる指導者が失われる、という意味で読むのが自然です。","s":69.66,"e":75.6,"p":true,"h":false},{"t":"6~7節は、少し滑稽にも見える場面です。","s":76.284,"e":79.901,"p":false,"h":false},{"t":"上着を一枚持っているだけで「指導者になってください」と頼まれるのは、それほど人材が尽きてしまったことを表しています。","s":80.172,"e":88.079,"p":false,"h":false},{"t":"相手が断るのは、責任を負いきれない現実を知っているからです。","s":88.344,"e":92.83,"p":true,"h":false},{"t":"9節の「ソドムのように罪を隠さない」という表現は、罪を恥じるどころか、堂々と見せびらかす姿を指しています。","s":93.492,"e":101.522,"p":false,"h":false},{"t":"罪の自覚が失われたとき、さばきはすでに間近にあります。","s":101.808,"e":106.075,"p":true,"h":false},{"t":"12節の「女たち」という言葉は、読み方が分かれるところです。","s":106.704,"e":111.191,"p":false,"h":false},{"t":"「女たちが民を治める」と読む立場と、「取り立てる者たちが民を治める」と読む立場があります。","s":111.492,"e":117.944,"p":false,"h":false},{"t":"どちらを取っても、民を正しく導けない指導者への嘆きである点は変わりません。","s":118.26,"e":123.651,"p":true,"h":false},{"t":"14~15節で、主が長老たちを告発される場面は、法廷の光景です。","s":124.308,"e":130.293,"p":false,"h":false},{"t":"主ご自身が原告となり、貧しい人の顔をうすで挽くように踏みにじった、と責められます。","s":130.572,"e":136.563,"p":false,"h":false},{"t":"弱い人への扱いが、そのまま神への態度として問われているのです。","s":136.836,"e":141.354,"p":true,"h":false},{"t":"16~17節以降の女性たちへの宣告は、個人の見た目をとがめているのではありません。","s":141.984,"e":148.376,"p":false,"h":false},{"t":"飾りは豊かさの象徴であり、豊かさに安心しきった社会全体の姿を映しています。","s":148.68,"e":154.86,"p":false,"h":false},{"t":"24節で、香水が悪臭に、美しい髪がはげた頭に変わるのは、頼っていたものがすべて逆転する、という意味です。","s":155.16,"e":163.476,"p":true,"h":false},{"t":"25~26節で、男たちが戦いに倒れ、町の門が嘆くのは、4章1節の場面へつながっています。","s":164.124,"e":172.325,"p":false,"h":false},{"t":"3章と4章は続けて読むと、さばきの深刻さがいっそうはっきりします。","s":172.62,"e":177.625,"p":true,"h":false}]},{"title":"イザヤ書_04章","audio":"doc04_2610231055.mp3","dur":154.4,"segs":[{"t":"イザヤ書4章","s":0,"e":1.216,"p":true,"h":false},{"t":"全体の流れ","s":1.908,"e":3.013,"p":true,"h":false},{"t":"3章の暗い場面の続きとして、4章は始まります。","s":3.816,"e":7.632,"p":false,"h":false},{"t":"男たちが戦いで倒れたあと、七人の女がひとりの男にすがりつき、「せめて名前だけでも私たちに付けてください」と願います(4:1)。","s":7.92,"e":16.784,"p":false,"h":false},{"t":"さばきの深刻さを表す、悲しい光景です。","s":17.064,"e":20.443,"p":true,"h":false},{"t":"けれども、そこで話は大きく変わります。","s":21.096,"e":23.953,"p":false,"h":false},{"t":"「その日」、主の若枝は美しく、栄えあるものとなり、その地の実りは、生き残った者たちの誇りとなります(4:2)。","s":24.228,"e":31.558,"p":false,"h":false},{"t":"シオンとエルサレムに残された人々は「聖なる者」と呼ばれます(4:3)。","s":31.86,"e":36.203,"p":false,"h":false},{"t":"主がさばきと焼き尽くす霊によって、汚れを洗い流してくださるからです(4:4)。","s":36.504,"e":41.216,"p":false,"h":false},{"t":"さらに主は、シオンの山の上に、昼は雲、夜は煙と燃える炎の輝きを創り、天蓋のように覆って守られます(4:5-6)。","s":41.508,"e":50.144,"p":false,"h":false},{"t":"神は、さばきを通して民をきよめ、もう一度、ご自分の民とともに住んでくださるのです。","s":50.436,"e":56.949,"p":true,"h":false},{"t":"各節の解説","s":57.6,"e":58.882,"p":true,"h":false},{"t":"1節の「七人の女」は、数が多いことを表す言い方だと考えられます。","s":59.544,"e":64.899,"p":false,"h":false},{"t":"当時、結婚して男の名を負うことが女性の安全と恥の回避を意味していたことを思うと、男たちがいなくなった社会の苦しさが伝わってきます。","s":65.196,"e":74.836,"p":false,"h":false},{"t":"ただし、3章の続きとして読むべきか、新しい段落の始まりとして読むべきかは、読み方が分かれます。","s":75.132,"e":82.588,"p":true,"h":false},{"t":"2節の「主の若枝」が何を指すのかは、解釈が分かれます。","s":83.232,"e":87.515,"p":false,"h":false},{"t":"神が地にもたらす豊かな実りだとする読み方もあれば、のちに来られるメシアを指すとする読み方もあります。","s":87.804,"e":94.808,"p":false,"h":false},{"t":"改革派の伝統は、後者の意味を重く見てきました。","s":95.076,"e":98.571,"p":false,"h":false},{"t":"さばきのあとに、神は新しい芽を生えさせてくださる、という希望です。","s":98.856,"e":103.774,"p":true,"h":false},{"t":"3節の「聖なる者」は、自分の力できよくなった人ではありません。","s":104.436,"e":109.104,"p":false,"h":false},{"t":"「いのちの書に記された者」という言い方も添えられていて、神に覚えられ、選ばれた者であることがわかります。","s":109.404,"e":116.642,"p":true,"h":false},{"t":"4節の「さばきの霊」と「焼き尽くす霊」は、訳によって表現が揺れる言葉です。","s":117.288,"e":122.69,"p":false,"h":false},{"t":"主がさばきを通して汚れを取り除き、民をきよくされる、という意味でまとめることができます。","s":122.976,"e":129.326,"p":false,"h":false},{"t":"さばきが、そのまま清めの働きにもなっています。","s":129.636,"e":133.104,"p":true,"h":false},{"t":"5~6節の雲と炎は、出エジプトの民を導いた雲の柱と火の柱を思い出させます。","s":133.74,"e":140.496,"p":false,"h":false},{"t":"主は、荒れ野の旅で民とともにおられたように、回復された民とも共におられる、ということです。","s":140.796,"e":147.64,"p":false,"h":false},{"t":"昼の暑さと嵐から守る仮庵のような覆いは、神の守りのやさしさを表しています。","s":147.96,"e":153.745,"p":true,"h":false}]},{"title":"イザヤ書_05章","audio":"doc05_2610231055.mp3","dur":258.7,"segs":[{"t":"イザヤ書5章","s":0,"e":1.148,"p":true,"h":false},{"t":"全体の流れ","s":1.908,"e":3.013,"p":true,"h":false},{"t":"5章は、ぶどう畑の歌から始まります。","s":3.816,"e":6.785,"p":false,"h":false},{"t":"愛する者が、よく肥えた丘にぶどう畑を作りました。","s":7.056,"e":10.774,"p":false,"h":false},{"t":"土を掘り起こし、石を取り除き、良いぶどうの木を植え、見張りの塔を建て、酒ぶねまで掘って、良い実を待ちました。","s":11.052,"e":19.22,"p":false,"h":false},{"t":"ところが、実ったのは酸っぱい野ぶどうでした(5:1-2)。","s":19.512,"e":22.349,"p":false,"h":false},{"t":"主は問いかけます。","s":22.644,"e":23.811,"p":false,"h":false},{"t":"「私がこの畑にできることで、しなかったことがあっただろうか」(5:4)。","s":24.552,"e":28.577,"p":false,"h":false},{"t":"畑は荒らされるままにされると宣告されます(5:5-6)。","s":28.872,"e":31.818,"p":true,"h":false},{"t":"歌の意味は、すぐに明かされます。","s":32.436,"e":34.684,"p":false,"h":false},{"t":"ぶどう畑は、イスラエルの家です。","s":34.992,"e":37.381,"p":false,"h":false},{"t":"主が期待されたのは公正でしたが、見たのは流血でした。","s":37.692,"e":41.724,"p":false,"h":false},{"t":"正しさを待ったのに、聞こえたのは叫びでした(5:7)。","s":42.012,"e":45.068,"p":false,"h":false},{"t":"そのあとに、「災いだ」という一連の宣告が続きます。","s":45.36,"e":49.226,"p":false,"h":false},{"t":"土地を買い集めて貧しい人を追い出す者、朝から酒に溺れて主のみわざを顧みない者、悪を善と呼び善を悪と呼ぶ者、自分の目に賢いと思い込む者、賄賂で正しい人を退ける者です(5:8-23)。","s":49.5,"e":62.842,"p":false,"h":false},{"t":"どれも、神のことばを軽んじるところから出てくる罪です。","s":63.144,"e":66.975,"p":false,"h":false},{"t":"最後に主は、はるか遠くの国に合図を送られます。","s":67.284,"e":70.925,"p":false,"h":false},{"t":"その国は疲れることなく、急いでやって来て、獲物をくわえて離さない獅子のように、民を引き離します(5:26-29)。","s":71.208,"e":78.196,"p":false,"h":false},{"t":"恵みを受けながら実を結ばなかった民には、さばきが待っています。","s":78.48,"e":82.912,"p":true,"h":false},{"t":"各節の解説","s":83.556,"e":84.838,"p":true,"h":false},{"t":"1節の「愛する者」の歌は、結婚式で歌われるような恋の歌の形をとっています。","s":85.5,"e":91.302,"p":false,"h":false},{"t":"聞いていた人々は、最初は愛の歌だと思って聞いていたはずです。","s":91.584,"e":95.995,"p":false,"h":false},{"t":"その油断を突いて、7節で、これが自分たちへの訴えだと明かされます。","s":96.3,"e":101.305,"p":true,"h":false},{"t":"4節の問いは、この歌の中心です。","s":101.952,"e":104.708,"p":false,"h":false},{"t":"主は、できるかぎりのことをすべてなさったのです。","s":105.012,"e":108.294,"p":false,"h":false},{"t":"実がならなかった責任は、畑を作った方にではなく、畑のほうにあります。","s":108.576,"e":113.866,"p":true,"h":false},{"t":"5~6節で、垣根が取り払われ、雨が降らなくなるのは、神の守りと恵みが取り去られることを意味しています。","s":114.516,"e":122.148,"p":false,"h":false},{"t":"主が守らなければ、畑は一瞬で荒れてしまいます。","s":122.436,"e":125.989,"p":true,"h":false},{"t":"7節では、ヘブライ語の言葉の響きが似ていて、公正と流血、正しさと叫びが、それぞれ対になっています。","s":126.612,"e":134.987,"p":false,"h":false},{"t":"期待した言葉の響きが、まったく別の恐ろしい言葉に変わってしまった、という落差が、この響きによって痛いほど伝わります。","s":135.288,"e":143.968,"p":true,"h":false},{"t":"8節以降の「災いだ」は六つ続くので、民の罪が一つに限られないことを示します。","s":144.612,"e":150.744,"p":false,"h":false},{"t":"8節は土地を独占して貧しい人を追い出す罪、11~12節は宴会に明け暮れて主のみわざを見ない罪です。","s":151.02,"e":158.886,"p":false,"h":false},{"t":"罪は、貧しい人への不正と、神への無関心の両方として現れています。","s":159.192,"e":164.81,"p":true,"h":false},{"t":"14節の「よみ」が大きく口を開けるという描写は、さばきの確かさを表す生々しい表現です。","s":165.456,"e":172.335,"p":false,"h":false},{"t":"派手に暮らしていた者たちが、静かに飲み込まれていきます。","s":172.62,"e":176.447,"p":true,"h":false},{"t":"18~19節の「偽りの綱」や「主のみわざを急がせてみよ」という言葉は、神のさばきをからかう人々の姿です。","s":177.084,"e":185.761,"p":false,"h":false},{"t":"罪が罪を引き寄せ、荷車のようにずるずる引きずっていく様子が描かれています。","s":186.048,"e":191.332,"p":true,"h":false},{"t":"20節は、悪を善と呼び、善を悪と呼ぶ者への宣告です。","s":191.952,"e":196.704,"p":false,"h":false},{"t":"神の基準を失った社会が、価値そのものをひっくり返してしまう、という警告です。","s":196.992,"e":202.736,"p":true,"h":false},{"t":"24節で、民が火に焼かれるわらのように消えるのは、主のおしえを拒んだ結果です。","s":203.364,"e":209.377,"p":false,"h":false},{"t":"罪の根は、神のことばを軽んじることにあると、ここではっきり言われています。","s":209.664,"e":214.92,"p":true,"h":false},{"t":"25節の「主の手はなお伸ばされている」という言葉は、さばきがまだ終わっていないことを示します。","s":215.568,"e":222.161,"p":false,"h":false},{"t":"この繰り返しの言葉は、イザヤ書の後の章でも出てきます。","s":222.444,"e":226.437,"p":true,"h":false},{"t":"26~29節で遠くから呼ばれる国は、一般にはアッシリアだと理解されています。","s":227.088,"e":233.279,"p":false,"h":false},{"t":"ただし、はっきり名前が出ていないので、神が用いられる敵の軍勢を広く指す、と読む立場もあります。","s":233.568,"e":240.912,"p":false,"h":false},{"t":"いずれにしても、外国の軍隊でさえ、主の合図で動く道具にすぎないという点が大切です。","s":241.2,"e":247.654,"p":true,"h":false},{"t":"30節の暗い終わり方は、6章の幻への備えになっています。","s":248.328,"e":253.096,"p":false,"h":false},{"t":"さばきの暗闇が極まったところで、主の聖なる姿が示されます。","s":253.404,"e":258.104,"p":true,"h":false}]},{"title":"イザヤ書_06章","audio":"doc06_2610231055.mp3","dur":225.6,"segs":[{"t":"イザヤ書6章","s":0,"e":1.189,"p":true,"h":false},{"t":"全体の流れ","s":1.908,"e":3.013,"p":true,"h":false},{"t":"ウジヤ王が死んだ年に、イザヤは主の幻を見ます。","s":3.816,"e":7.49,"p":false,"h":false},{"t":"主は高く上げられた御座に座しておられ、衣のすそは神殿に満ちています。","s":7.776,"e":12.847,"p":false,"h":false},{"t":"その上にはセラフィムが立ち、「聖なる、聖なる、聖なる、万軍の主。","s":13.14,"e":18.641,"p":false,"h":false},{"t":"その栄光は全地に満ちる」と互いに呼びかけていました。","s":18.936,"e":22.53,"p":false,"h":false},{"t":"その声で敷居の基は揺れ動き、神殿は煙で満たされます(6:1-4)。","s":22.824,"e":27.149,"p":true,"h":false},{"t":"イザヤは「ああ、私は滅びる」と叫びます。","s":27.792,"e":31.004,"p":false,"h":false},{"t":"自分は唇の汚れた者で、唇の汚れた民の中に住んでおり、しかも王である万軍の主を見たからです(6:5)。","s":31.284,"e":38.883,"p":false,"h":false},{"t":"すると、セラフィムのひとりが、祭壇から燃え盛る炭を取り、イザヤの口に触れさせて言います。","s":39.204,"e":45.683,"p":false,"h":false},{"t":"「あなたの咎は取り去られ、罪は赦された」(6:6-7)。","s":45.972,"e":48.93,"p":false,"h":false},{"t":"赦しは、イザヤが何かをしたからではなく、神のほうから与えられました。","s":49.212,"e":54.145,"p":true,"h":false},{"t":"そのとき主が「だれを遣わそうか。","s":54.792,"e":57.198,"p":false,"h":false},{"t":"だれが私たちのために行くだろうか」と言われ、イザヤは「ここに私がおります。","s":57.492,"e":62.705,"p":false,"h":false},{"t":"私を遣わしてください」と答えます(6:8)。","s":63,"e":65.471,"p":false,"h":false},{"t":"ところが、遣わされた先の務めは重いものでした。","s":65.772,"e":69.173,"p":false,"h":false},{"t":"民は聞いても悟らず、見ても知らないままで、心は鈍くなります(6:9-10)。","s":69.444,"e":74.265,"p":false,"h":false},{"t":"イザヤが「いつまでですか」と尋ねると、町が荒れ果て、人が取り去られるまでだと答えられます(6:11-12)。","s":74.556,"e":80.831,"p":false,"h":false},{"t":"しかし最後に、切り倒された木の切り株のように、聖なる種が残ると語られます(6:13)。","s":81.108,"e":86.838,"p":false,"h":false},{"t":"さばきの中にも、神は望みを残しておられます。","s":87.12,"e":90.532,"p":true,"h":false},{"t":"各節の解説","s":91.188,"e":92.47,"p":true,"h":false},{"t":"1節の「ウジヤ王が死んだ年」は、イザヤにとって国の頼りが失われた年でした。","s":93.132,"e":98.627,"p":false,"h":false},{"t":"地上の王が去った時に、真の王が見えてくる、という流れが大切です。","s":98.892,"e":104.007,"p":true,"h":false},{"t":"2~3節のセラフィムは、「燃えるもの」という意味の名で、主の聖さを際立たせる存在です。","s":104.652,"e":110.491,"p":false,"h":false},{"t":"「聖なる」を三度重ねるのは、ヘブライ語で最上級を表す言い方で、神の聖さが比べるものなく完全であることを示します。","s":110.808,"e":119.448,"p":true,"h":false},{"t":"5節でイザヤが「唇の汚れた者」と言うのは、言葉に罪があるというだけでなく、全存在が汚れていると悟ったことの表れです。","s":120.06,"e":129.14,"p":false,"h":false},{"t":"聖なる方に出会うと、人は自分の罪をはっきり知ります。","s":129.42,"e":133.389,"p":true,"h":false},{"t":"6~7節の炭は、さばきの火であると同時に、きよめの火でもあります。","s":134.028,"e":139.194,"p":false,"h":false},{"t":"ここで赦しが罪人の側の努力ではなく、神が備えられた祭壇から来ている点は、改革派の神学が恵みの先行を語るときによく引かれます。","s":139.5,"e":149.494,"p":true,"h":false},{"t":"8節の「私たち」という複数形が何を指すかは、読み方が分かれます。","s":150.156,"e":155.066,"p":false,"h":false},{"t":"主の天の会議を指すという読み方と、三位一体を示すとする読み方があります。","s":155.376,"e":160.894,"p":false,"h":false},{"t":"改革派の伝統には後者を重んじる読み方もありますが、確定した説明ではないので、分かれると言うにとどめるのが安全です。","s":161.172,"e":169.791,"p":true,"h":false},{"t":"9~10節の言葉は、読むのが難しい箇所です。","s":170.424,"e":174.171,"p":false,"h":false},{"t":"民の心が鈍くなるのは、民が自分でそうなったのか、神が鈍くされたのか、両方の面があります。","s":174.456,"e":181.738,"p":false,"h":false},{"t":"新約聖書でもこの箇所が引かれ、福音を拒む人々の姿を説明するのに使われています。","s":182.016,"e":188.477,"p":false,"h":false},{"t":"神の主権と人の責任の両方を見ながら読む、というのが改革派の読み方です。","s":188.784,"e":194.288,"p":true,"h":false},{"t":"11~12節の「いつまでですか」は、イザヤが期限を尋ねる言葉です。","s":194.94,"e":200.081,"p":false,"h":false},{"t":"答えは、町が荒れ果てるまで、というきびしいものでした。","s":200.376,"e":204.284,"p":true,"h":false},{"t":"13節の「切り株」と「聖なる種」は、この章の望みの中心です。","s":204.912,"e":209.742,"p":false,"h":false},{"t":"木は切り倒されても、切り株に命が残ります。","s":210.024,"e":213.441,"p":false,"h":false},{"t":"ただし、この節の後半は写本や訳で表現に揺れがあり、解釈が分かれます。","s":213.732,"e":219.308,"p":false,"h":false},{"t":"残された者が、のちに来られるメシアにつながっていく、と読む伝統があります。","s":219.6,"e":224.925,"p":true,"h":false}]},{"title":"イザヤ書_07章","audio":"doc07_2610231055.mp3","dur":207.9,"segs":[{"t":"イザヤ書7章","s":0,"e":1.211,"p":true,"h":false},{"t":"全体の流れ","s":1.908,"e":3.013,"p":true,"h":false},{"t":"アハズ王の時代、北のイスラエルと南のアラムが手を結び、ユダに攻めてきました。","s":3.816,"e":9.539,"p":false,"h":false},{"t":"王の心も民の心も、森の木が風に揺れるように震えます(7:1-2)。","s":9.828,"e":14.289,"p":false,"h":false},{"t":"主はイザヤに、息子シェアル・ヤシュブを連れて王に会いに行かせます。","s":14.58,"e":18.685,"p":false,"h":false},{"t":"主の言葉は、「落ち着いて、恐れるな」というものでした。","s":18.972,"e":22.627,"p":false,"h":false},{"t":"敵は燃えさしの切れ端にすぎず、その企ては成り立たない、と告げられます(7:3-9)。","s":22.896,"e":28.139,"p":false,"h":false},{"t":"最後に「もし信じないなら、あなたがたは堅く立つことはできない」と言われます(7:9)。","s":28.44,"e":33.803,"p":true,"h":false},{"t":"主はさらに、アハズにしるしを求めるよう勧めますが、王は「主を試みない」と、信仰深いことばのように断ります(7:10-12)。","s":34.452,"e":42.696,"p":false,"h":false},{"t":"しかし、それは信仰ではなく、主に頼らず、アッシリアに頼ろうとする心を隠した言葉でした。","s":42.984,"e":49.901,"p":false,"h":false},{"t":"そこで主みずからしるしを与えられます。","s":50.184,"e":52.628,"p":false,"h":false},{"t":"「見よ、おとめがみごもって男の子を産み、その名をインマヌエルと呼ぶ」(7:14)。","s":52.92,"e":57.371,"p":false,"h":false},{"t":"「神は私たちとともにおられる」という意味の名です。","s":57.672,"e":60.747,"p":true,"h":false},{"t":"しかし、そのあとの宣告は厳しいものです。","s":61.416,"e":64.578,"p":false,"h":false},{"t":"ユダが頼ろうとしたアッシリアが、やがてユダ自身を襲う、と告げられます(7:17-25)。","s":64.872,"e":69.843,"p":false,"h":false},{"t":"人間の同盟に頼る道は、守りではなく、災いを招く道でした。","s":70.128,"e":75.248,"p":true,"h":false},{"t":"各節の解説","s":75.888,"e":77.17,"p":true,"h":false},{"t":"3節の息子の名「シェアル・ヤシュブ」は、「残りの者が帰る」という意味だと理解されています。","s":77.832,"e":83.616,"p":false,"h":false},{"t":"この名前そのものが、さばきと望みの両方を告げる預言になっています。","s":83.916,"e":88.709,"p":true,"h":false},{"t":"4節の「燃えさしの切れ端」という言い方は、一見恐ろしい敵が、実際にはすでに燃え尽きかけている、という意味です。","s":89.352,"e":97.079,"p":false,"h":false},{"t":"人の目に大きく見えるものも、神の前では力を持ちません。","s":97.38,"e":101.505,"p":true,"h":false},{"t":"9節の「信じないなら堅く立てない」は、ヘブライ語で言葉遊びになっています。","s":102.168,"e":107.385,"p":false,"h":false},{"t":"「信じる」と「堅く立つ」が同じ語根から来ているので、信仰が国の土台だということが、言葉の響きでも伝わります。","s":107.676,"e":115.632,"p":true,"h":false},{"t":"11~12節で、アハズが「しるしを求めない」と言うのは、一見へりくだっているようで、実は主の約束に耳を貸したくないという拒絶です。","s":116.28,"e":126.124,"p":false,"h":false},{"t":"信仰の言葉を使っても、心が主に向いていなければ、主はそれを偽りと見られます。","s":126.432,"e":132.516,"p":true,"h":false},{"t":"14節の「おとめ」は、この章でいちばん議論の多いところです。","s":133.164,"e":137.429,"p":false,"h":false},{"t":"ヘブライ語の言葉は「若い女性」を広く指すので、当時のアハズの時代に生まれる子を指すという読み方があります。","s":137.7,"e":145.081,"p":false,"h":false},{"t":"一方、新約聖書のマタイの福音書はこの言葉をイエスの誕生に結びつけており、改革派の伝統は、この預言の完全な成就がキリストにあると受け取ってきました。","s":145.368,"e":156.676,"p":false,"h":false},{"t":"当時の子としるしと、のちの成就の二重の意味を認める読み方もあります。","s":156.96,"e":161.81,"p":false,"h":false},{"t":"どの読み方を取るかは、教会の中でも意見が分かれるところです。","s":162.108,"e":166.576,"p":true,"h":false},{"t":"15~16節で、子が善悪を知る前に、二つの王国が滅びると語られるのは、しるしの時間的な意味を示しています。","s":167.22,"e":175.687,"p":false,"h":false},{"t":"アハズが恐れている敵は、すぐに消え去る、という約束です。","s":175.968,"e":180.32,"p":true,"h":false},{"t":"17~20節の「かみそり」の例えは、頼ろうとしたアッシリアが、ユダの髪も体毛もそり落とす道具になる、という恥ずかしめの姿です。","s":180.972,"e":190.564,"p":true,"h":false},{"t":"21~25節は、攻められた後の荒れた土地の描写です。","s":191.196,"e":195.805,"p":false,"h":false},{"t":"ぶどう畑のあった場所がいばらとおどろに覆われ、人々は凝乳と蜜で暮らします。","s":196.092,"e":201.572,"p":false,"h":false},{"t":"それは豊かさの印ではなく、耕す人がいなくなった土地の印だと読まれます。","s":201.852,"e":207.264,"p":true,"h":false}]},{"title":"イザヤ書_08章","audio":"doc08_2610231055.mp3","dur":183,"segs":[{"t":"イザヤ書8章","s":0,"e":1.176,"p":true,"h":false},{"t":"全体の流れ","s":1.908,"e":3.013,"p":true,"h":false},{"t":"7章に続いて、イザヤは大きな板に「マヘル・シャラル・ハシュ・バズ」という名を書くよう命じられます。","s":3.816,"e":10.22,"p":false,"h":false},{"t":"「急いで略奪し、早く奪い取る」という意味で、やがて敵が来ることを告げるしるしです(8:1-4)。","s":10.512,"e":16.228,"p":false,"h":false},{"t":"主は、ゆるやかに流れるシロアハの水を拒んだ民の上に、ユーフラテスの大水、つまりアッシリアの王を押し寄せさせます。","s":16.524,"e":24.825,"p":false,"h":false},{"t":"水はユダの首にまで達し、国を覆います。","s":25.128,"e":28.292,"p":false,"h":false},{"t":"しかしそれでも、その国は「インマヌエル」、神が私たちとともにおられる国です(8:5-8)。","s":28.584,"e":33.901,"p":true,"h":false},{"t":"主は、イザヤに、民が恐れるものを恐れるな、と言われます。","s":34.56,"e":38.929,"p":false,"h":false},{"t":"「万軍の主、この方を聖なる方とせよ。","s":39.24,"e":42.319,"p":false,"h":false},{"t":"この方があなたがたの恐れとなり、おののきとなる」(8:12-13)。","s":42.624,"e":45.763,"p":false,"h":false},{"t":"主は聖所ともなられ、同時に、つまずきの石、妨げの岩ともなられます(8:14)。","s":46.044,"e":51.599,"p":false,"h":false},{"t":"信じる者には避け所ですが、信じない者には落とし穴です。","s":51.876,"e":56.213,"p":true,"h":false},{"t":"最後に、イザヤは弟子たちの間にさばきの記録を封じ、主を待つと言います(8:16-17)。","s":56.844,"e":62.295,"p":false,"h":false},{"t":"人々が口寄せや霊媒に走るとき、イザヤは「おしえとあかしに尋ねよ」と言います。","s":62.568,"e":68.393,"p":false,"h":false},{"t":"この言葉に従わない者には夜明けがなく、暗闇に追いやられます(8:19-22)。","s":68.688,"e":73.201,"p":true,"h":false},{"t":"各節の解説","s":73.836,"e":75.118,"p":true,"h":false},{"t":"1~4節で、子どもの名と板の文字が同じ意味を持っているのは、さばきが確かにやって来る証拠を、前もって公に記しておくためです。","s":75.78,"e":84.707,"p":false,"h":false},{"t":"後で事が起きたとき、人々は主がすでに告げておられたことを知ります。","s":85.032,"e":89.783,"p":true,"h":false},{"t":"6節の「シロアハの水」は、エルサレムを静かに潤す小さな流れです。","s":90.432,"e":95.334,"p":false,"h":false},{"t":"これを拒むのは、神の静かな守りを軽んじることを指します。","s":95.616,"e":99.943,"p":false,"h":false},{"t":"かわりに頼ろうとしたアッシリアの大水に、かえって押し流されます。","s":100.224,"e":104.512,"p":true,"h":false},{"t":"8節の「インマヌエル」は、7章14節の名がここで再び呼ばれています。","s":105.156,"e":110.358,"p":false,"h":false},{"t":"さばきのただ中でも、神が民とともにおられるという約束は消えません。","s":110.628,"e":115.519,"p":true,"h":false},{"t":"12節の「陰謀」という言葉は、民が恐れていた敵の同盟を指すと読まれます。","s":116.208,"e":121.776,"p":false,"h":false},{"t":"主は、人が恐れるものではなく、主ご自身を恐れよと言われます。","s":122.076,"e":126.812,"p":true,"h":false},{"t":"14~15節の「つまずきの石」は、新約聖書でキリストについて引かれる言葉です。","s":127.44,"e":133.44,"p":false,"h":false},{"t":"ある人には救いの岩となり、ある人にはつまずきとなる、という二面性が、ここですでに語られています。","s":133.74,"e":140.728,"p":true,"h":false},{"t":"16~17節の「封じる」は、証言を残しておく、という意味です。","s":141.372,"e":146.375,"p":false,"h":false},{"t":"聞く耳を持たない民の中で、少数の弟子たちが、主の言葉を預かって待ちます。","s":146.7,"e":152.373,"p":true,"h":false},{"t":"19~20節の「口寄せ」に対する警告は、主の言葉以外の導きに頼る危うさを教えています。","s":153,"e":160.277,"p":false,"h":false},{"t":"「おしえとあかし」、つまり神が与えられた言葉が、判断の基準です。","s":160.56,"e":164.993,"p":false,"h":false},{"t":"この言葉は、聖書だけを権威とする改革派の立場と深く響き合います。","s":165.312,"e":170.447,"p":true,"h":false},{"t":"21~22節の暗い描写は、神の言葉を捨てた人が行き着く場所を表します。","s":171.072,"e":177.23,"p":false,"h":false},{"t":"9章の光が輝くためには、この暗さをいったん通らねばなりません。","s":177.516,"e":182.354,"p":true,"h":false}]},{"title":"イザヤ書_09章","audio":"doc09_2610231055.mp3","dur":189.9,"segs":[{"t":"イザヤ書9章","s":0,"e":1.254,"p":true,"h":false},{"t":"全体の流れ","s":1.908,"e":3.013,"p":true,"h":false},{"t":"8章の暗闇のあとに、大きな光が告げられます。","s":3.816,"e":7.343,"p":false,"h":false},{"t":"ゼブルンとナフタリの地、つまり先に辱められた地に、闇の中を歩んでいた民が大きな光を見ます(9:1-2)。","s":7.632,"e":14.941,"p":false,"h":false},{"t":"その喜びは、刈り入れの喜び、戦利品を分ける喜びにたとえられます。","s":15.228,"e":20.605,"p":false,"h":false},{"t":"重い荷と、肩のくびきと、追い立てる者の杖が、ミディアンの日のように砕かれるからです(9:3-5)。","s":20.88,"e":26.853,"p":true,"h":false},{"t":"その根拠が、あの有名な言葉です。","s":27.504,"e":30.26,"p":false,"h":false},{"t":"「ひとりのみどりごが私たちのために生まれる。","s":30.564,"e":33.261,"p":false,"h":false},{"t":"ひとりの男の子が私たちに与えられる。","s":33.552,"e":36.162,"p":false,"h":false},{"t":"主権はその肩にあり、その名は『不思議な助言者、力ある神、永遠の父、平和の君』と呼ばれる」(9:6)。","s":36.468,"e":44.061,"p":false,"h":false},{"t":"ダビデの王座に着いて、その支配はとこしえに続き、公正と正義で支えられます。","s":44.352,"e":50.244,"p":false,"h":false},{"t":"これを成し遂げるのは、万軍の主の熱心です(9:7)。","s":50.508,"e":53.838,"p":true,"h":false},{"t":"ところが、そのあとで話は再び現実に戻ります。","s":54.468,"e":58.169,"p":false,"h":false},{"t":"主のことばはヤコブに向けて送られましたが、イスラエルは高ぶって、「れんがが落ちたなら切り石で建て直そう」と言い放ちました(9:8-10)。","s":58.464,"e":66.47,"p":false,"h":false},{"t":"民は打たれても主に帰らず、指導者は民を迷わせ、すべての口は愚かなことを語ります。","s":66.744,"e":73.201,"p":false,"h":false},{"t":"そのため、「それでもなお、主の怒りは去らず、主の手はなお伸ばされている」と、繰り返されます(9:11-21)。","s":73.512,"e":79.985,"p":true,"h":false},{"t":"各節の解説","s":80.64,"e":81.922,"p":true,"h":false},{"t":"1節の「ゼブルンとナフタリ」は、北のガリラヤ地方にあたる地で、アッシリアの侵略をいちばん先に受けた地です。","s":82.584,"e":89.933,"p":false,"h":false},{"t":"この地に光が最初に差す、という約束は、マタイの福音書がイエスのガリラヤでの働きに結びつけて引いています。","s":90.252,"e":98.187,"p":true,"h":false},{"t":"4~5節の「ミディアンの日」は、士師ギデオンが少数の兵で大軍に勝った出来事を思い出させます。","s":98.82,"e":105.441,"p":false,"h":false},{"t":"勝利は人の力によらず、主から来た、という記憶です。","s":105.732,"e":109.858,"p":true,"h":false},{"t":"6節の「みどりご」が誰を指すかは、歴史的にはヒゼキヤ王を指すという読み方もあります。","s":110.484,"e":116.495,"p":false,"h":false},{"t":"しかし「力ある神」「永遠の父」という名は、通常の王には大きすぎる呼び名で、キリスト教の伝統は、これをメシアであるイエス・キリストの預言と受け取ってきました。","s":116.784,"e":127.573,"p":false,"h":false},{"t":"改革派の神学も同じです。","s":127.872,"e":129.86,"p":false,"h":false},{"t":"四つの名はそれぞれ、キリストの知恵、力、永遠、平和をたたえるものとして読まれます。","s":130.176,"e":136.339,"p":true,"h":false},{"t":"7節の「熱心」は、主が自分の民への愛のゆえに、必ず成し遂げようとされる強い思いを表します。","s":136.98,"e":144.38,"p":false,"h":false},{"t":"この約束が成るのは、人の努力ではなく、神の熱心によるのです。","s":144.684,"e":149.536,"p":true,"h":false},{"t":"8~10節で、民が「れんがが落ちたなら切り石で建て直す」と言うのは、さばきを受けても悔い改めず、自分の力でやり直そうとする高ぶりです。","s":150.192,"e":160.522,"p":true,"h":false},{"t":"12節以降に繰り返される「それでもなお、主の怒りは去らず」は、5章25節でも出てきた言葉です。","s":161.172,"e":168.581,"p":false,"h":false},{"t":"打たれても主に帰らない民に対して、さばきが段階的に重ねられていく様子を表しています。","s":168.876,"e":175.287,"p":true,"h":false},{"t":"18~21節の「悪が火のように燃え」る描写は、国の内部で互いに食い合う姿を描いています。","s":175.932,"e":183.112,"p":false,"h":false},{"t":"外の敵から攻められる前に、内側の罪によって国は崩れていく、ということです。","s":183.384,"e":189.206,"p":true,"h":false}]},{"title":"イザヤ書_10章","audio":"doc10_2610231055.mp3","dur":207.6,"segs":[{"t":"イザヤ書10章","s":0,"e":1.226,"p":true,"h":false},{"t":"全体の流れ","s":1.908,"e":3.013,"p":true,"h":false},{"t":"10章は、不正な法を作って、やもめや孤児を奪う者への「災いだ」から始まります。","s":3.816,"e":9.791,"p":false,"h":false},{"t":"「刑罰の日、遠くから来る破滅の日に、あなたがたはどうするのか」と問われます(10:1-4)。","s":10.08,"e":15.412,"p":false,"h":false},{"t":"次に、主は、ご自分の怒りの杖としてアッシリアを用いられます(10:5-6)。","s":15.696,"e":20.548,"p":true,"h":false},{"t":"ところが、アッシリアの王は、自分が神の道具にすぎないことを知らず、「私は自分の手の力と知恵でこれをやった」と誇ります(10:7-14)。","s":21.168,"e":30.023,"p":false,"h":false},{"t":"主はそれを許されません。","s":30.312,"e":31.953,"p":false,"h":false},{"t":"斧が、それを使う者に向かって高ぶるはずがないからです(10:15)。","s":32.292,"e":36.182,"p":false,"h":false},{"t":"主はアッシリアを使い終えると、そのおごりを罰されます(10:12, 16-19)。","s":36.468,"e":41.26,"p":true,"h":false},{"t":"そのあとに、望みが語られます。","s":41.904,"e":44.146,"p":false,"h":false},{"t":"その日、ヤコブの残りの者は、自分を打った者ではなく、真実に、イスラエルの聖なる方、主に頼ります。","s":44.46,"e":52.208,"p":false,"h":false},{"t":"「残りの者が帰って来る」、つまり神に立ち返ります(10:20-23)。","s":52.488,"e":55.746,"p":false,"h":false},{"t":"主はシオンの民に、「アッシリアを恐れるな」と告げ、すぐにその怒りが終わると約束されます(10:24-27)。","s":56.052,"e":62.174,"p":false,"h":false},{"t":"最後に、アッシリア軍が北からエルサレムに迫る様子が描かれますが、主が、森の木を切り倒すように、その高ぶりを切り倒されます(10:28-34)。","s":62.46,"e":72.008,"p":true,"h":false},{"t":"各節の解説","s":72.648,"e":73.93,"p":true,"h":false},{"t":"1~2節の「不正な法」は、貧しい人を守るはずの法が、逆に彼らを奪う道具にされていることを指します。","s":74.592,"e":82.386,"p":false,"h":false},{"t":"制度の形が整っていても、中身が不正であれば、主は黙っておられません。","s":82.656,"e":88.043,"p":true,"h":false},{"t":"5~6節の「怒りの杖」という言い方は、神が異教の国さえも、ご自分の目的のために用いられることを示します。","s":88.704,"e":97.123,"p":false,"h":false},{"t":"ただし、それは、アッシリアの罪を免除するものではありません。","s":97.416,"e":101.733,"p":true,"h":false},{"t":"7節の「そのつもりはなく」という言葉は、アッシリア王が神の計画に気づいていないことを指します。","s":102.384,"e":109.138,"p":false,"h":false},{"t":"神の主権と人間の責任が、同時に語られている例です。","s":109.44,"e":113.571,"p":false,"h":false},{"t":"改革派の神学は、この二つを両方とも大切にします。","s":113.868,"e":118.149,"p":true,"h":false},{"t":"13~14節で、アッシリア王が自分の力を誇る言葉は、巣の卵を拾うように国々を奪った、という生々しい比喩で語られます。","s":118.8,"e":128.732,"p":false,"h":false},{"t":"人間の高ぶりは、神にさばかれる理由になります。","s":129.024,"e":132.694,"p":true,"h":false},{"t":"15節の斧とのこぎりの例えは、道具が使い手より偉いと思う愚かさを突いています。","s":133.344,"e":139.224,"p":false,"h":false},{"t":"人間の力は、神が用いるときにだけ働く道具です。","s":139.5,"e":143.583,"p":true,"h":false},{"t":"20~23節の「残りの者」は、6章の「聖なる種」、7章のシェアル・ヤシュブとつながっています。","s":144.216,"e":150.95,"p":false,"h":false},{"t":"わずかな者が残り、主に立ち返ることで、神の民は絶えません。","s":151.236,"e":155.837,"p":false,"h":false},{"t":"ただし、23節で「滅びが定められている」と語られるように、さばきの確かさも消えません。","s":156.132,"e":162.801,"p":true,"h":false},{"t":"24~27節の言葉は、エジプトの出来事を思い出させて、民を励まします。","s":163.44,"e":169.69,"p":false,"h":false},{"t":"神はかつて抑圧者から民を救い出されたように、今度もそうされる、という約束です。","s":169.992,"e":175.918,"p":true,"h":false},{"t":"28~32節のアッシリア軍の行進は、ミグロンやミクマスなど、具体的な地名で描かれています。","s":176.58,"e":184.059,"p":false,"h":false},{"t":"エルサレムに迫る様子を、一歩ずつ数えるように語り、恐怖が高まったところで、主が登場します。","s":184.356,"e":191.473,"p":true,"h":false},{"t":"33~34節で、主が高い木を切り倒す姿は、アッシリアの高ぶりが主のみ手によって倒される場面です。","s":192.096,"e":200.476,"p":false,"h":false},{"t":"そして、この切り倒された森の後に、11章の「切り株から出る若枝」が続きます。","s":200.772,"e":206.956,"p":true,"h":false}]},{"title":"イザヤ書_11章","audio":"doc11_2610231055.mp3","dur":217.8,"segs":[{"t":"イザヤ書11章","s":0,"e":1.403,"p":true,"h":false},{"t":"全体の流れ","s":2.052,"e":3.157,"p":true,"h":false},{"t":"10章で森の木が切り倒されたあと、エッサイの切り株から一つの芽が出ます。","s":3.96,"e":9.224,"p":false,"h":false},{"t":"ひこばえが、その根から実を結びます(11:1)。","s":9.504,"e":12.096,"p":false,"h":false},{"t":"この方の上には主の霊がとどまり、知恵と悟り、思慮と力、主を知る知識と主を恐れる心の霊が注がれます(11:2)。","s":12.384,"e":20.591,"p":false,"h":false},{"t":"この王は、目に見えるところや耳で聞くところで判断せず、貧しい人を義をもってさばき、地の悩む者のために公正をもって決定を下します(11:3-5)。","s":20.88,"e":30.891,"p":true,"h":false},{"t":"その支配のもとで、世界の姿が変わります。","s":31.536,"e":34.692,"p":false,"h":false},{"t":"狼は子羊とともに宿り、豹は子やぎとともに伏し、幼い子がそれらを導きます。","s":34.992,"e":41.242,"p":false,"h":false},{"t":"乳飲み子はコブラの穴の上で戯れます(11:6-8)。","s":41.508,"e":44.304,"p":false,"h":false},{"t":"「わたしの聖なる山のどこにおいても、害を加えず、滅ぼすこともない。","s":44.604,"e":49.42,"p":false,"h":false},{"t":"主を知ることが、海をおおう水のように、地に満ちるからだ」と語られます(11:9)。","s":49.716,"e":54.758,"p":true,"h":false},{"t":"その日、エッサイの根は諸国民の旗として立てられ、国々はこの方を求めます(11:10)。","s":55.404,"e":61.104,"p":false,"h":false},{"t":"主は二度目に御手を伸ばして、アッシリアやエジプトなど、各地に散らされた残りの民を取り戻されます。","s":61.38,"e":68.214,"p":false,"h":false},{"t":"エフライムとユダの敵対も終わり、民は一つになります(11:11-16)。","s":68.508,"e":72.275,"p":false,"h":false},{"t":"さばきの森のあとに、神は新しい王による回復を備えておられます。","s":72.576,"e":77.356,"p":true,"h":false},{"t":"各節の解説","s":78.012,"e":79.294,"p":true,"h":false},{"t":"1節の「切り株」と「若枝」は、ダビデの家が一度切り倒されたようになったあとで、そこから新しい命が出ることを表しています。","s":79.956,"e":88.808,"p":false,"h":false},{"t":"10章の巨木が切り倒される姿と、ここで切り株から芽が出る姿は、対になっています。","s":89.1,"e":95.603,"p":true,"h":false},{"t":"2節の霊の働きは、六つ、または七つに分けて数えられることがあります。","s":96.228,"e":101.772,"p":false,"h":false},{"t":"主を恐れる心が二度出てくるため、数え方に揺れがあります。","s":102.06,"e":106.306,"p":false,"h":false},{"t":"大切なのは数ではなく、この王が神の霊に満たされて治めるという点です。","s":106.596,"e":111.847,"p":true,"h":false},{"t":"3~5節で、見た目や噂によらずにさばくというのは、人の王にはむずかしいことです。","s":112.5,"e":118.664,"p":false,"h":false},{"t":"腰の帯が義と真実であるという表現は、この王の務めの土台が、公正であることを示します。","s":118.98,"e":125.84,"p":true,"h":false},{"t":"6~8節の動物たちの姿は、文字どおりの動物の話か、人間社会の平和の象徴かで、読み方が分かれます。","s":126.468,"e":134.957,"p":false,"h":false},{"t":"改革派の伝統には、新しい天と地の完成の姿として受け取る読み方があります。","s":135.252,"e":141.333,"p":false,"h":false},{"t":"どの時期に当たるかについても、意見が分かれます。","s":141.624,"e":144.901,"p":false,"h":false},{"t":"いずれにしても、メシアの支配のもとで、害と恐れが消える、という約束です。","s":145.188,"e":150.756,"p":true,"h":false},{"t":"9節の「主を知ることが地に満ちる」は、平和の根が、神を知ることにあると教えています。","s":151.416,"e":157.623,"p":false,"h":false},{"t":"争いがなくなるのは、人の努力だけでなく、神が知られるからです。","s":157.896,"e":162.671,"p":true,"h":false},{"t":"10節の「エッサイの根」は、新約聖書でパウロが、異邦人にも救いが及ぶ根拠としてキリストに当てはめています。","s":163.296,"e":170.997,"p":false,"h":false},{"t":"旗として立てられるとは、諸国民が集まる目印になる、という意味です。","s":171.288,"e":175.967,"p":true,"h":false},{"t":"11~12節の「二度目に」は、最初の出エジプトに続く、もう一つの回復を指します。","s":176.616,"e":183.104,"p":false,"h":false},{"t":"散らされた民がバビロンの捕囚から帰る出来事と、さらに後の完全な回復との関係については、読み方が分かれます。","s":183.384,"e":191.7,"p":true,"h":false},{"t":"13~14節のエフライムとユダの敵対がやむ姿は、分裂した神の民が一つにされることを表します。","s":192.348,"e":200.242,"p":false,"h":false},{"t":"回復は、外の敵に勝つだけでなく、内側の争いも癒やします。","s":200.52,"e":205.313,"p":true,"h":false},{"t":"15~16節の葦の海やユーフラテス川を渡る道は、出エジプトの出来事を思い出させます。","s":205.956,"e":212.658,"p":false,"h":false},{"t":"主は、かつてのように、民の帰る道を開いてくださいます。","s":212.94,"e":217.184,"p":true,"h":false}]},{"title":"イザヤ書_12章","audio":"doc12_2610231055.mp3","dur":137.4,"segs":[{"t":"イザヤ書12章","s":0,"e":1.353,"p":true,"h":false},{"t":"全体の流れ","s":2.016,"e":3.121,"p":true,"h":false},{"t":"12章は短く、賛美の歌です。","s":3.924,"e":6.549,"p":false,"h":false},{"t":"「その日」、民は言います。","s":6.84,"e":8.224,"p":false,"h":false},{"t":"「主よ、あなたに感謝します。","s":8.748,"e":10.529,"p":false,"h":false},{"t":"あなたは私に怒られましたが、その怒りは去り、私を慰めてくださいました」(12:1)。","s":10.836,"e":16.256,"p":false,"h":false},{"t":"さばきを経験した民が、その怒りが過ぎ去ったことを喜んでいます。","s":16.56,"e":21.24,"p":true,"h":false},{"t":"続けて、「見よ、神は私の救い。","s":21.888,"e":24.699,"p":false,"h":false},{"t":"私は信頼して恐れない。","s":24.984,"e":26.84,"p":false,"h":false},{"t":"主、主は私の力、私の歌。","s":27.144,"e":29.957,"p":false,"h":false},{"t":"私の救いとなってくださった」と歌います(12:2)。","s":30.24,"e":32.908,"p":false,"h":false},{"t":"そして、「あなたがたは喜びをもって、救いの泉から水を汲む」と語られます(12:3)。","s":33.192,"e":38.749,"p":false,"h":false},{"t":"民は、主に感謝し、御名を呼び、そのみわざを諸国民の間に知らせるようにと促されます(12:4-5)。","s":39.06,"e":46.001,"p":false,"h":false},{"t":"最後に、「シオンに住む者よ、大声で喜び歌え。","s":46.296,"e":49.692,"p":false,"h":false},{"t":"あなたの中におられるイスラエルの聖なる方は、大いなる方」と結ばれます(12:6)。","s":49.968,"e":54.907,"p":true,"h":false},{"t":"1~11章の長いさばきと望みの語りは、この賛美で一つの区切りを迎えます。","s":55.548,"e":61.415,"p":true,"h":false},{"t":"各節の解説","s":62.064,"e":63.346,"p":true,"h":false},{"t":"1節の「怒りは去り」は、神の怒りが気まぐれではなく、罪に対する正しい反応であり、赦しの後には去ることを示しています。","s":64.008,"e":72.965,"p":false,"h":false},{"t":"慰めは、怒りが取り去られたことから来ます。","s":73.26,"e":76.461,"p":true,"h":false},{"t":"2節の「主は私の力、私の歌。","s":77.112,"e":80.027,"p":false,"h":false},{"t":"私の救いとなってくださった」は、出エジプト記の海の歌にある言葉と重なっています。","s":80.316,"e":86.035,"p":false,"h":false},{"t":"新しい救いが、昔の救いの再現として歌われています。","s":86.328,"e":90.531,"p":true,"h":false},{"t":"2節の「救い」という言葉は、ヘブライ語でイザヤの名とも、のちのイエスの名とも関係のある語根から来ています。","s":91.152,"e":98.306,"p":false,"h":false},{"t":"救いは、この書全体の主題の一つです。","s":98.604,"e":101.646,"p":true,"h":false},{"t":"3節の「救いの泉」は、荒れ野で水が与えられた出来事を思い出させます。","s":102.276,"e":107.556,"p":false,"h":false},{"t":"主の救いは、渇いた者に与えられる、尽きない水のように描かれます。","s":107.856,"e":112.836,"p":true,"h":false},{"t":"4~5節の「諸国民の間に知らせよ」は、神の救いが、イスラエルだけでなく、世界に向けて宣べ伝えられるべきものだと教えています。","s":113.472,"e":122.771,"p":false,"h":false},{"t":"ここに、宣教の姿の始まりを見る読み方があります。","s":123.048,"e":126.93,"p":true,"h":false},{"t":"6節の「あなたの中におられる」は、7章の「インマヌエル」と響き合います。","s":127.584,"e":132.714,"p":false,"h":false},{"t":"神が民のただ中におられる、これが賛美の理由です。","s":132.984,"e":136.728,"p":true,"h":false}]},{"title":"イザヤ書_13章","audio":"doc13_2610231055.mp3","dur":168.7,"segs":[{"t":"イザヤ書13章","s":0,"e":1.439,"p":true,"h":false},{"t":"全体の流れ","s":2.088,"e":3.193,"p":true,"h":false},{"t":"13章から23章までは、諸国民に対する宣告が続きます。","s":3.996,"e":9.03,"p":false,"h":false},{"t":"最初はバビロンです。","s":9.288,"e":10.642,"p":false,"h":false},{"t":"アモツの子イザヤが、バビロンについて示された宣告として、これが語られます(13:1)。","s":11.196,"e":16.604,"p":false,"h":false},{"t":"主は、はだかの山の上に旗を揚げ、ご自分の聖別した者たちを召して、軍勢を集められます(13:2-5)。","s":16.884,"e":23.8,"p":true,"h":false},{"t":"「主の日」が近づきます。","s":24.444,"e":25.903,"p":false,"h":false},{"t":"それは残酷な日であり、怒りと燃える憤りの日です。","s":26.352,"e":30.094,"p":false,"h":false},{"t":"人々の手は力を失い、心は溶け、産婦のようにもだえ苦しみます(13:6-8)。","s":30.384,"e":35.671,"p":false,"h":false},{"t":"この日、星も太陽も月も光を失い、主は世界をその悪のゆえに罰し、高ぶる者の誇りをやめさせられます(13:9-13)。","s":35.964,"e":44.134,"p":true,"h":false},{"t":"主は、メディア人を奮い立たせてバビロンに向かわせます。","s":44.784,"e":48.513,"p":false,"h":false},{"t":"彼らは銀を気にかけず、金も喜ばず、容赦しません(13:17-18)。","s":48.816,"e":52.953,"p":false,"h":false},{"t":"「諸王国の誉れ、カルデア人の誇り」であったバビロンは、ソドムとゴモラのように滅ぼされ、もう人が住まなくなります。","s":53.28,"e":61.048,"p":false,"h":false},{"t":"荒れ野の獣だけが住む場所になります(13:19-22)。","s":61.344,"e":63.887,"p":true,"h":false},{"t":"各節の解説","s":64.512,"e":65.794,"p":true,"h":false},{"t":"1節の「宣告」という言葉は、「重荷」とも訳される語で、預言者が語る時に重くのしかかる主の言葉を指します。","s":66.456,"e":74.395,"p":false,"h":false},{"t":"13章から、諸国民への宣告が次々に出てきます。","s":74.7,"e":78.779,"p":true,"h":false},{"t":"2~5節で、主が軍勢を召されるのは、バビロンを滅ぼすための戦いを、主ご自身が指揮しておられるからです。","s":79.416,"e":87.141,"p":false,"h":false},{"t":"遠い国から来る兵士たちは、主の道具として描かれます。","s":87.444,"e":91.263,"p":true,"h":false},{"t":"6節の「主の日」は、イザヤ書に何度も出てくる言葉です。","s":91.908,"e":95.838,"p":false,"h":false},{"t":"バビロンの滅亡という歴史的な出来事を指すのか、世の終わりの最後のさばきを指すのか、両方の意味を重ねて読むのか、解釈が分かれます。","s":96.12,"e":105.729,"p":false,"h":false},{"t":"この章のあとの部分は、世界規模の描写が強いので、両方の面を見る読み方が有力です。","s":106.02,"e":112.786,"p":true,"h":false},{"t":"10節の星や太陽の暗くなる描写は、新約聖書で、世の終わりの描写にも引かれます。","s":113.436,"e":119.859,"p":false,"h":false},{"t":"ただし、ここでは、バビロンの滅亡を告げる預言の言葉として、詩的に語られているとも読めます。","s":120.168,"e":127.04,"p":true,"h":false},{"t":"17節の「メディア人」は、実際に、のちにバビロンを滅ぼした勢力に加わった民です。","s":127.692,"e":134.065,"p":false,"h":false},{"t":"イザヤの時代には、バビロンはまだ強国ではありませんでした。","s":134.352,"e":138.385,"p":false,"h":false},{"t":"それなのに、その滅亡が告げられている点は、この預言の特徴です。","s":138.672,"e":143.668,"p":true,"h":false},{"t":"19節の「ソドムとゴモラのように」は、徹底的な滅びを表します。","s":144.324,"e":149.267,"p":false,"h":false},{"t":"バビロンは、権力と誇りの象徴として、聖書で繰り返し、神に逆らう世界の姿として描かれます。","s":149.544,"e":157.131,"p":true,"h":false},{"t":"21~22節の荒れ野の獣の描写は、滅びた町の静けさを表しています。","s":157.788,"e":163.828,"p":false,"h":false},{"t":"かつて栄えた都が、野の獣の住み処となる姿です。","s":164.124,"e":168.051,"p":true,"h":false}]},{"title":"イザヤ書_14章","audio":"doc14_2610231055.mp3","dur":206.9,"segs":[{"t":"イザヤ書14章","s":0,"e":1.486,"p":true,"h":false},{"t":"全体の流れ","s":2.124,"e":3.229,"p":true,"h":false},{"t":"14章の始めに、主はヤコブをあわれみ、イスラエルを再び選び、彼らをその地に住まわせると語られます。","s":4.032,"e":11.707,"p":false,"h":false},{"t":"外国人も彼らに加わります(14:1-2)。","s":11.988,"e":14.114,"p":false,"h":false},{"t":"主が民に安息を与え、苦役から解放される日が来ると、バビロンの王に対する嘲りの歌を歌うよう命じられます(14:3-4)。","s":14.4,"e":22.417,"p":true,"h":false},{"t":"その歌は、強い王が倒れた姿を歌います。","s":23.04,"e":26.383,"p":false,"h":false},{"t":"主は悪しき者の杖を砕かれ、全地は安らぎを得て、歓声をあげます(14:5-8)。","s":26.676,"e":31.748,"p":false,"h":false},{"t":"よみの世界は、王を迎えるために動き出し、死者の霊たちが立ち上がって語りかけます。","s":32.04,"e":37.904,"p":false,"h":false},{"t":"「あなたも私たちのように弱くなった」(14:9-11)。","s":38.196,"e":40.504,"p":true,"h":false},{"t":"続いて、「明けの明星、暁の子よ、どうして天から落ちたのか」と歌われます。","s":41.148,"e":46.779,"p":false,"h":false},{"t":"この王は、「私は天に上り、神の星々のはるか上に私の王座を据え、いと高き方のようになろう」と心の中で言いました。","s":47.088,"e":56.021,"p":false,"h":false},{"t":"しかし、よみの底に落とされます(14:12-15)。","s":56.304,"e":58.636,"p":false,"h":false},{"t":"人々は彼を見て、「この人が、地を震わせ、国々を揺り動かした者か」と驚きます(14:16-21)。","s":58.932,"e":65.463,"p":true,"h":false},{"t":"主は、バビロンを根絶やしにすると宣告されます(14:22-23)。","s":66.096,"e":69.444,"p":false,"h":false},{"t":"さらに、アッシリアについて、主は誓って言われます。","s":69.732,"e":73.119,"p":false,"h":false},{"t":"「私の計ったとおりに事は成り、私の定めたとおりに実現する」(14:24-27)。","s":73.404,"e":78.119,"p":false,"h":false},{"t":"最後に、ペリシテについての短い宣告があります(14:28-32)。","s":78.408,"e":81.89,"p":true,"h":false},{"t":"各節の解説","s":82.512,"e":83.794,"p":true,"h":false},{"t":"1~2節の、外国人が民に加わるという言葉は、神の民の回復が、諸国民をも巻き込むことを予感させます。","s":84.456,"e":93.023,"p":false,"h":false},{"t":"イスラエルの回復は、イスラエルだけで終わりません。","s":93.312,"e":96.579,"p":true,"h":false},{"t":"4節の「嘲りの歌」は、倒れた暴君に向けて歌われる歌です。","s":97.236,"e":101.813,"p":false,"h":false},{"t":"権力が絶対的に見えても、神の前では、一つの歌のネタになるほど小さい、ということが表れています。","s":102.096,"e":109.676,"p":true,"h":false},{"t":"9~11節で、よみの死者たちが王を迎える場面は、詩的な描写です。","s":110.304,"e":115.661,"p":false,"h":false},{"t":"この世で栄華を極めた者も、死んだ後は他の人と同じようになる、という皮肉を述べています。","s":115.956,"e":122.408,"p":false,"h":false},{"t":"死後の世界について詳しく教える箇所ではない、と読むのが安全です。","s":122.724,"e":127.424,"p":true,"h":false},{"t":"12節の「明けの明星」は、ラテン語訳で「ルシファー」と訳されたことから、後に、堕落した天使、つまりサタンの話と結びつけて読まれてきた箇所です。","s":128.052,"e":138.833,"p":false,"h":false},{"t":"この章の文脈では、バビロンの王に対する嘲りの歌です。","s":139.14,"e":143.393,"p":false,"h":false},{"t":"ですから、第一にはバビロンの王の高ぶりについて語っていると理解されます。","s":143.676,"e":148.761,"p":false,"h":false},{"t":"ただし、その背後に、神に逆らう高ぶりの典型を見て、サタンの姿と重ねる読み方も、教会の歴史にはあります。","s":149.04,"e":157.67,"p":false,"h":false},{"t":"どこまでそう読むかは、意見が分かれます。","s":157.968,"e":160.76,"p":true,"h":false},{"t":"13~14節の「いと高き方のようになろう」という言葉は、人間が神の座を奪おうとする、根源的な罪の姿を示しています。","s":161.424,"e":171.129,"p":false,"h":false},{"t":"高ぶる者は、必ず低くされます。","s":171.396,"e":173.973,"p":true,"h":false},{"t":"24~27節の主の誓いは、アッシリアだけでなく、諸国民すべてに対する主の計画を示す言葉です。","s":174.6,"e":182.67,"p":false,"h":false},{"t":"人が何を企てても、主の定めを妨げることはできません。","s":182.952,"e":187.229,"p":true,"h":false},{"t":"28~32節のペリシテへの宣告は、アハズ王が死んだ年に語られた、と書かれています。","s":187.884,"e":194.723,"p":false,"h":false},{"t":"ペリシテが、アッシリアの打撃を受けた後、喜んでいるのを戒める言葉です。","s":195.012,"e":200.34,"p":false,"h":false},{"t":"最後に、「主がシオンを築かれた」ことが、貧しい民の避け所だと言われます(14:32)。","s":200.664,"e":206.199,"p":true,"h":false}]},{"title":"イザヤ書_15章","audio":"doc15_2610231055.mp3","dur":146.8,"segs":[{"t":"イザヤ書15章","s":0,"e":1.376,"p":true,"h":false},{"t":"全体の流れ","s":2.016,"e":3.121,"p":true,"h":false},{"t":"15章は、モアブに対する宣告です。","s":3.924,"e":6.768,"p":false,"h":false},{"t":"一夜のうちに、モアブの二つの町、アルとキルが荒らされ、滅びます(15:1)。","s":7.056,"e":11.772,"p":false,"h":false},{"t":"人々は神殿やバモテ、高い所に上って泣き、頭を剃り、粗布をまとって嘆きます(15:2-3)。","s":12.06,"e":18.536,"p":false,"h":false},{"t":"ヘシュボンやエルアレの人々は叫び、叫び声はヤハツにまで聞こえます。","s":18.828,"e":23.535,"p":false,"h":false},{"t":"モアブの武装した兵士も、叫び声をあげて、心が震えます(15:4)。","s":23.832,"e":28.326,"p":true,"h":false},{"t":"預言者自身も、モアブのために心を痛め、「私の心はモアブのために叫ぶ」と言います(15:5)。","s":28.944,"e":35.219,"p":false,"h":false},{"t":"ニムリムの水は枯れ、草は枯れ、青いものは何も残りません。","s":35.496,"e":39.915,"p":false,"h":false},{"t":"人々は、蓄えた財産を持って、柳の谷川を越えて逃げます(15:6-7)。","s":40.212,"e":45.076,"p":false,"h":false},{"t":"嘆きの声は、国境の隅々に響きます。","s":45.36,"e":48.694,"p":false,"h":false},{"t":"ディモンの水は血で満ち、さらに主は、逃れた者に獅子を送り、残った者を襲わせられます(15:8-9)。","s":48.996,"e":55.59,"p":true,"h":false},{"t":"各節の解説","s":56.232,"e":57.514,"p":true,"h":false},{"t":"1節の「一夜のうちに」は、滅びが突然来ることを表します。","s":58.176,"e":62.58,"p":false,"h":false},{"t":"モアブは、死海の東にあった国で、イスラエルとは親戚の関係にありながら、しばしば敵対しました。","s":62.856,"e":70.126,"p":true,"h":false},{"t":"2~3節の、頭を剃り、ひげを切り、粗布をまとう姿は、当時の深い悲しみの表現です。","s":70.776,"e":77.789,"p":false,"h":false},{"t":"神殿やバモテに上って泣くのは、モアブの人々が偶像の神に助けを求めていることを示しています。","s":78.084,"e":85.064,"p":true,"h":false},{"t":"5節の預言者の嘆きは、さばきを宣告する者が、冷たく喜んでいるのではないことを示します。","s":85.716,"e":92.753,"p":false,"h":false},{"t":"神のさばきは、悲しみとともに語られます。","s":93.06,"e":96.172,"p":false,"h":false},{"t":"主ご自身も、さばきを喜ぶ方ではないのです。","s":96.48,"e":99.848,"p":true,"h":false},{"t":"6~7節の水が枯れ、草が枯れる描写は、国の暮らしの土台が失われることを表します。","s":100.512,"e":107.428,"p":false,"h":false},{"t":"逃げる人々は、蓄えた物を持って谷を越えますが、それも守られません。","s":107.712,"e":112.926,"p":true,"h":false},{"t":"9節の「獅子」は、逃れた者に追い打ちをかける、さらなるさばきの象徴です。","s":113.58,"e":119.087,"p":false,"h":false},{"t":"ここでは、細かい地名が多いので、土地の詳しい位置は、はっきりしないものも含まれます。","s":119.376,"e":125.53,"p":true,"h":false},{"t":"15章全体は、地名の多い、読みにくい章です。","s":126.18,"e":129.998,"p":false,"h":false},{"t":"それでも、モアブに対しても、神は無関心ではなく、その苦しみを見ておられ、それでも罪をさばかれるという、神の主権と憐れみの両面が描かれています。","s":130.284,"e":141.286,"p":false,"h":false},{"t":"16章の初めには、モアブの避難民のための訴えも出てきます。","s":141.588,"e":146.145,"p":true,"h":false}]},{"title":"イザヤ書_16章","audio":"doc16_2610231055.mp3","dur":203.4,"segs":[{"t":"イザヤ書16章","s":0,"e":1.411,"p":true,"h":false},{"t":"全体の流れ","s":2.052,"e":3.157,"p":true,"h":false},{"t":"15章の嘆きに続いて、モアブに対する訴えが語られます。","s":3.96,"e":8.342,"p":false,"h":false},{"t":"モアブの逃れた人々は、荒れ野のセラから、シオンの娘の山へ、子羊を送るようにと促されます(16:1)。","s":8.64,"e":15.897,"p":false,"h":false},{"t":"逃げ惑うモアブの女たちは、鳥の巣を追われた鳥のように、アルノンの渡し場でうろたえます(16:2)。","s":16.164,"e":22.209,"p":false,"h":false},{"t":"そして、シオンに向かって、「助言を与え、さばきを行ってください。","s":22.5,"e":27.252,"p":false,"h":false},{"t":"逃げて来た者をかくまい、追われる者を渡さないでください」と願います(16:3-4)。","s":27.54,"e":32.221,"p":true,"h":false},{"t":"その願いに応えるように、ひとつの望みが語られます。","s":32.868,"e":36.562,"p":false,"h":false},{"t":"慈しみによってひとつの王座が堅く立てられ、ダビデの天幕に真実をもって座る方が現れます。","s":36.864,"e":43.371,"p":false,"h":false},{"t":"その方は、公正を求め、義を行うのに速い、と言われます(16:5)。","s":43.668,"e":48.492,"p":true,"h":false},{"t":"しかし、モアブの高ぶりは、あまりにも大きいものでした。","s":49.14,"e":53.051,"p":false,"h":false},{"t":"その高ぶりと、傲慢と、怒りは、むなしい自慢にすぎません(16:6)。","s":53.316,"e":57.878,"p":false,"h":false},{"t":"だから、モアブは自分のために泣き叫びます。","s":58.176,"e":61.164,"p":false,"h":false},{"t":"キル・ハレセテのぶどう菓子を慕い、シブマのぶどう畑は荒れ、喜びの歌声は消えます(16:7-10)。","s":61.452,"e":67.321,"p":false,"h":false},{"t":"預言者はまたしても、「私のはらわたは、モアブのために立琴のように鳴る」と言います(16:11)。","s":67.608,"e":73.476,"p":false,"h":false},{"t":"モアブが高い所に上って疲れ果て、聖所で祈っても、何の役にも立たない、と言われます(16:12)。","s":73.764,"e":80.091,"p":false,"h":false},{"t":"最後に、これは主が前から語っておられた言葉であり、三年以内に、モアブの栄光は卑しめられ、残るのはわずかな者だけだと告げられます(16:13-14)。","s":80.388,"e":90.295,"p":true,"h":false},{"t":"各節の解説","s":90.936,"e":92.218,"p":true,"h":false},{"t":"1~4節の子羊を送る話は、解釈が難しいところです。","s":92.88,"e":97.705,"p":false,"h":false},{"t":"モアブがかつてユダの王に貢ぎ物を納めていたことを思い出して、今もう一度、シオンに頼るよう促している、と読む立場があります。","s":97.992,"e":107.058,"p":false,"h":false},{"t":"いずれにしても、滅びに直面した国が、神の民に避け所を求める姿が描かれています。","s":107.352,"e":113.932,"p":true,"h":false},{"t":"5節の「ダビデの天幕」に座る王は、11章の「エッサイの根」と響き合います。","s":114.552,"e":120.189,"p":false,"h":false},{"t":"滅びの宣告のただ中で、慈しみと真実による王座が語られるのは、神の望みが、イスラエルだけでなく、逃れる異邦人にも開かれていることを示します。","s":120.492,"e":131.467,"p":false,"h":false},{"t":"この王がメシアを指すと読むのが、改革派の伝統です。","s":131.76,"e":135.482,"p":false,"h":false},{"t":"ただし、歴史的な王の姿を重ねて読む立場もあります。","s":135.792,"e":139.88,"p":true,"h":false},{"t":"6節のモアブの高ぶりは、この宣告の理由として、はっきり語られています。","s":140.508,"e":145.911,"p":false,"h":false},{"t":"助けを求める声に、神が応えられるのは、悔い改めの心が伴うときですが、モアブは高ぶりを手放しませんでした。","s":146.196,"e":154.621,"p":true,"h":false},{"t":"7~10節のぶどう畑と喜びの歌の消失は、5章のぶどう畑の歌を思い出させます。","s":155.268,"e":161.807,"p":false,"h":false},{"t":"実りの喜びが奪われる姿は、神のさばきが、日常の楽しみの中にまで及ぶことを表します。","s":162.108,"e":169.414,"p":true,"h":false},{"t":"11節の預言者の嘆きは、15章5節に続いて、さばきを告げる者の痛みを示しています。","s":170.064,"e":177.144,"p":false,"h":false},{"t":"神ご自身の憐れみが、預言者の心を通して響いている、と読めます。","s":177.444,"e":182.563,"p":true,"h":false},{"t":"12節の、高い所での祈りが役に立たないという言葉は、偶像の神に頼る人々の祈りは聞かれない、という意味です。","s":183.204,"e":191.591,"p":true,"h":false},{"t":"13~14節の「三年以内」は、雇い人の年季のように、きっちり三年と数える言い方です。","s":192.24,"e":199.278,"p":false,"h":false},{"t":"さばきの時期は、主によって定められています。","s":199.584,"e":202.746,"p":true,"h":false}]},{"title":"イザヤ書_17章","audio":"doc17_2610231055.mp3","dur":198.1,"segs":[{"t":"イザヤ書17章","s":0,"e":1.454,"p":true,"h":false},{"t":"全体の流れ","s":2.124,"e":3.229,"p":true,"h":false},{"t":"17章は、ダマスコ、つまりアラムの首都に対する宣告から始まります。","s":4.032,"e":9.299,"p":false,"h":false},{"t":"ダマスコは町でなくなり、廃墟の山となります。","s":9.576,"e":12.794,"p":false,"h":false},{"t":"アロエルの町々は見捨てられ、羊の群れが伏す場所になります(17:1-2)。","s":13.104,"e":17.266,"p":false,"h":false},{"t":"ここで、宣告は北のイスラエル、つまりエフライムにも向かいます。","s":17.568,"e":22.033,"p":false,"h":false},{"t":"砦はエフライムから、王国はダマスコから消え去ります。","s":22.32,"e":25.951,"p":false,"h":false},{"t":"アラムの残りの者は、イスラエルの栄光のようになる、と言われます(17:3)。","s":26.244,"e":30.824,"p":true,"h":false},{"t":"その日、ヤコブの栄光は衰え、肥えた体はやせます。","s":31.464,"e":35.575,"p":false,"h":false},{"t":"刈り入れの後に、落ち穂を拾うように、わずかな者だけが残ります。","s":35.856,"e":40.298,"p":false,"h":false},{"t":"オリーブの木を打っても、枝の先に二つ三つの実が残るだけです(17:4-6)。","s":40.608,"e":44.91,"p":false,"h":false},{"t":"その日、人は自分を造られた方に目を向け、イスラエルの聖なる方に目を注ぎます。","s":45.216,"e":51.209,"p":false,"h":false},{"t":"自分の手で作った祭壇やアシェラ像には、もう目を向けなくなります(17:7-8)。","s":51.48,"e":55.895,"p":true,"h":false},{"t":"それは、救いの神を忘れ、力の岩を心に留めなかったからです。","s":56.52,"e":61.47,"p":false,"h":false},{"t":"いくら良い苗を植えても、悩みの日に、収穫は消えます(17:9-11)。","s":61.776,"e":65.836,"p":false,"h":false},{"t":"章の終わりには、多くの国々が海の波のように騒ぎ立つ様子が描かれます。","s":66.132,"e":71.462,"p":false,"h":false},{"t":"しかし主が一喝されると、彼らは遠くへ逃げ去り、風に追われるもみ殻のようになります。","s":71.748,"e":77.902,"p":false,"h":false},{"t":"夕べには恐れがあり、朝になる前には、もう彼らはいません。","s":78.192,"e":82.522,"p":false,"h":false},{"t":"これが、わたしたちを略奪する者の受ける分です(17:12-14)。","s":82.836,"e":86.202,"p":true,"h":false},{"t":"各節の解説","s":86.868,"e":88.15,"p":true,"h":false},{"t":"1~3節で、ダマスコへの宣告にエフライムが加わるのは、アラムとイスラエルが同盟していたからです。","s":88.812,"e":95.909,"p":false,"h":false},{"t":"7章でアハズが恐れていた二つの敵が、ここで一緒にさばかれています。","s":96.192,"e":101.161,"p":false,"h":false},{"t":"主は、7章で告げられたことを、ここで確かめておられます。","s":101.448,"e":105.675,"p":true,"h":false},{"t":"4~6節の刈り入れとオリーブの例えは、さばきの後に、わずかな者が残ることを描きます。","s":106.308,"e":112.773,"p":false,"h":false},{"t":"「残りの者」の主題が、ここでも静かに響いています。","s":113.076,"e":116.806,"p":false,"h":false},{"t":"実を全部取り尽くさず、数個を残すというイメージは、完全な滅びではないことを示します。","s":117.108,"e":123.606,"p":true,"h":false},{"t":"7~8節の「その日」の変化は、さばきが人の目を神に向けさせる、という導きを語ります。","s":124.236,"e":131.012,"p":false,"h":false},{"t":"さばきは、罰で終わらず、人を創造主に立ち返らせる働きを持ちます。","s":131.292,"e":136.56,"p":true,"h":false},{"t":"9節の「見捨てられた町々」は、解釈が難しいところです。","s":137.196,"e":141.647,"p":false,"h":false},{"t":"写本や訳によって、固有の民の名で読む立場と、一般的な表現として読む立場があります。","s":141.948,"e":148.641,"p":false,"h":false},{"t":"どちらでも、神に頼らず、土地の豊かさに頼った民の末路を表します。","s":148.932,"e":154.259,"p":true,"h":false},{"t":"10節の「救いの神を忘れ、力の岩を心に留めなかった」は、この宣告の理由を、一言でまとめています。","s":154.908,"e":162.876,"p":false,"h":false},{"t":"罪の根は、神を忘れることです。","s":163.152,"e":165.622,"p":true,"h":false},{"t":"11節の、植えた日に実がなりそうに見えても、悩みの日に収穫がなくなるという描写は、人の努力が、神を抜きにしては実を結ばないことを教えています。","s":166.284,"e":177.174,"p":true,"h":false},{"t":"12~14節の海の波のような諸国民は、エルサレムを襲う大国の姿として読まれます。","s":177.804,"e":184.451,"p":false,"h":false},{"t":"主がひと言「叱る」だけで彼らが消えるという対比が、この短い詩の中心です。","s":184.716,"e":190.196,"p":false,"h":false},{"t":"ただし、これが具体的にアッシリアを指すのか、もっと広い敵の姿なのかは、読み方が分かれます。","s":190.476,"e":197.419,"p":true,"h":false}]},{"title":"イザヤ書_18章","audio":"doc18_2610231055.mp3","dur":176,"segs":[{"t":"イザヤ書18章","s":0,"e":1.453,"p":true,"h":false},{"t":"全体の流れ","s":2.088,"e":3.193,"p":true,"h":false},{"t":"18章は、クシュ、つまり今のエチオピア、またはその付近の国に対する言葉です。","s":3.996,"e":10.282,"p":false,"h":false},{"t":"「ああ、羽音をたてる翼の地よ。","s":10.584,"e":12.881,"p":false,"h":false},{"t":"クシュの川の向こうにある地よ」と呼びかけられます(18:1)。","s":13.176,"e":16.21,"p":false,"h":false},{"t":"この国は、川の上を、パピルスの舟で使者を送ります。","s":16.488,"e":20.656,"p":false,"h":false},{"t":"使者たちは、背の高い、肌のなめらかな民、遠くまで恐れられる民のもとへ、行くよう命じられます(18:2)。","s":20.952,"e":28.103,"p":true,"h":false},{"t":"世界中の人々に呼びかけがなされます。","s":28.728,"e":31.403,"p":false,"h":false},{"t":"「山の上に旗が揚がるとき、見よ。","s":31.68,"e":34.146,"p":false,"h":false},{"t":"角笛が鳴るとき、聞け」(18:3)。","s":34.452,"e":36.324,"p":false,"h":false},{"t":"主はご自分の所から静かに見下ろしておられます。","s":36.576,"e":39.825,"p":false,"h":false},{"t":"それは、暑い日の晴れた陽光のように、刈り入れ時の暑さの中の露の雲のように、静かです(18:4)。","s":40.104,"e":46.872,"p":false,"h":false},{"t":"しかし、刈り入れの前に、花が終わり、実が熟するころ、主は小刀で若枝を切り、つるを切り払われます。","s":47.16,"e":55.145,"p":false,"h":false},{"t":"それらは山の猛禽と地の獣に残されます(18:5-6)。","s":55.44,"e":58.55,"p":true,"h":false},{"t":"最後に、その時、背が高く肌のなめらかな民から、主への贈り物が、万軍の主の名のあるシオンの山に、携えて来られます(18:7)。","s":59.22,"e":68.7,"p":true,"h":false},{"t":"各節の解説","s":69.336,"e":70.618,"p":true,"h":false},{"t":"1~2節のクシュは、当時エジプトを支配していた強い勢力と関係の深い国です。","s":71.28,"e":77.193,"p":false,"h":false},{"t":"ユダの人々が、アッシリアに対抗するために、このクシュと同盟しようと考えていたことが背景にあると考えられます。","s":77.472,"e":85.482,"p":false,"h":false},{"t":"使者の往来は、その外交の動きを映していると読まれます。","s":85.788,"e":89.933,"p":true,"h":false},{"t":"3節の「旗」と「角笛」は、戦いの合図であり、同時に、神がこれから何かをされるという知らせです。","s":90.576,"e":97.947,"p":false,"h":false},{"t":"世界中が、神のみわざに注目するよう呼ばれています。","s":98.244,"e":102.138,"p":true,"h":false},{"t":"4節の、主が静かに見ておられるという描写は、この章の中心です。","s":102.78,"e":107.978,"p":false,"h":false},{"t":"人間の国々が慌ただしく同盟を組んでいても、神は静かに、ご自分の時を待っておられます。","s":108.252,"e":114.812,"p":false,"h":false},{"t":"これは、神の主権が、人間の動きに左右されないことを教えます。","s":115.092,"e":119.949,"p":true,"h":false},{"t":"5~6節の刈り入れ前に、若枝が切られる例えは、実が熟す直前に、主が介入されることを表しています。","s":120.6,"e":128.782,"p":false,"h":false},{"t":"敵の計画が実を結ぶ直前に、主が断ち切られる、という意味に読むのが一般的です。","s":129.06,"e":135.101,"p":true,"h":false},{"t":"7節で、遠い国の民が、主に贈り物をささげるようになるのは、さばきの宣告が、最後には礼拝へと変わることを示しています。","s":135.792,"e":145.297,"p":false,"h":false},{"t":"諸国民が、シオンの主を礼拝するようになるという、2章の幻と通じる終わり方です。","s":145.584,"e":152.032,"p":true,"h":false},{"t":"18章は、短いながらも、解釈の難しい章として知られています。","s":152.676,"e":157.972,"p":false,"h":false},{"t":"特に、「羽音をたてる翼」「川の向こう」の描写が何を指すかは、読み方が分かれます。","s":158.256,"e":164.256,"p":false,"h":false},{"t":"ここでは、細部を確定するよりも、神の静かな主権と、諸国民が最終的に主のもとに来る望みを、この章の中心として読むことをお勧めします。","s":164.52,"e":175.326,"p":true,"h":false}]},{"title":"イザヤ書_19章","audio":"doc19_2610231055.mp3","dur":235.5,"segs":[{"t":"イザヤ書19章","s":0,"e":1.474,"p":true,"h":false},{"t":"全体の流れ","s":2.124,"e":3.229,"p":true,"h":false},{"t":"19章は、エジプトに対する宣告です。","s":4.032,"e":7.094,"p":false,"h":false},{"t":"主は速い雲に乗ってエジプトに来られます。","s":7.38,"e":10.034,"p":false,"h":false},{"t":"エジプトの偶像はその前で震え、エジプト人の心は溶けます(19:1)。","s":10.332,"e":14.618,"p":false,"h":false},{"t":"主は、エジプト人をエジプト人に立ち向かわせます。","s":14.904,"e":18.345,"p":false,"h":false},{"t":"兄弟は兄弟と、町は町と戦います。","s":18.648,"e":21.74,"p":false,"h":false},{"t":"エジプトの霊は空しくなり、人々は偶像や口寄せ、霊媒に伺いを立てますが、主は彼らを厳しい主人の手に渡されます(19:2-4)。","s":22.032,"e":31.083,"p":true,"h":false},{"t":"ナイル川は干上がり、漁をする人も、亜麻を扱う人も、織物をする人も、嘆きに沈みます(19:5-10)。","s":31.716,"e":38.445,"p":false,"h":false},{"t":"ツォアンの首長たちは愚かで、ファラオの賢い助言者たちの助言は、愚かなものになります。","s":38.736,"e":44.74,"p":false,"h":false},{"t":"主が、彼らのうちに、ゆがんだ霊を混ぜ込まれたからです。","s":45.036,"e":48.901,"p":false,"h":false},{"t":"彼らは、酔った者がへどの中でよろめくように、エジプトを迷わせます(19:11-15)。","s":49.212,"e":53.921,"p":true,"h":false},{"t":"ここから、話は大きく変わります。","s":54.576,"e":57.019,"p":false,"h":false},{"t":"その日、エジプトの五つの町が、カナンの言葉を話し、万軍の主に誓いを立てます。","s":57.312,"e":63.476,"p":false,"h":false},{"t":"国の真ん中には主のための祭壇が、国境には柱が立てられます(19:16-20)。","s":63.756,"e":68.455,"p":false,"h":false},{"t":"エジプトは、主を知り、いけにえと供え物をささげます。","s":68.76,"e":72.642,"p":false,"h":false},{"t":"主はエジプトを打たれますが、いやされます。","s":72.936,"e":75.641,"p":false,"h":false},{"t":"彼らが主に立ち返ると、主は祈りを聞き入れ、いやしてくださいます(19:21-22)。","s":75.924,"e":80.467,"p":false,"h":false},{"t":"そして、その日、エジプトからアッシリアへ大路ができ、エジプトとアッシリアは一緒に主に仕えます。","s":80.748,"e":87.39,"p":false,"h":false},{"t":"イスラエルは、エジプト、アッシリアと並んで、地の真ん中で祝福となります。","s":87.696,"e":92.836,"p":false,"h":false},{"t":"万軍の主は祝福して言われます。","s":93.132,"e":95.518,"p":false,"h":false},{"t":"「わが民エジプト、わが手のわざアッシリア、わが嗣業イスラエルに祝福があるように」(19:23-25)。","s":95.796,"e":101.346,"p":true,"h":false},{"t":"各節の解説","s":101.988,"e":103.27,"p":true,"h":false},{"t":"1節の、主が雲に乗って来られる姿は、神がご自身の民ではない国にも直接介入される、ということを表しています。","s":103.932,"e":112.837,"p":false,"h":false},{"t":"エジプトの偶像が震えるのは、偶像が無力であることを示します。","s":113.148,"e":117.756,"p":true,"h":false},{"t":"2~4節の、内乱の描写は、国の内側の崩れを描いています。","s":118.404,"e":123.555,"p":false,"h":false},{"t":"神は、外の敵だけでなく、国の内部の分裂を用いてもさばかれます。","s":123.84,"e":129.097,"p":true,"h":false},{"t":"5~10節のナイル川の描写は、エジプトの豊かさの源が干上がることを意味します。","s":129.744,"e":135.667,"p":false,"h":false},{"t":"ナイルを神のように頼っていた国が、その川によって苦しめられる、という皮肉があります。","s":135.972,"e":142.094,"p":true,"h":false},{"t":"11~15節の知恵ある助言者たちが愚かにされるのは、人間の知恵が、神の前では何の役にも立たないことを表します。","s":142.74,"e":151.629,"p":false,"h":false},{"t":"主が「ゆがんだ霊」を混ぜられたという表現は、神が人の判断を狂わせることもあるという、難しい言葉です。","s":151.92,"e":159.634,"p":false,"h":false},{"t":"ここでも、神の主権と人間の責任の両方を保って読むのが、改革派の読み方です。","s":159.948,"e":166.171,"p":true,"h":false},{"t":"18節の「カナンの言葉」を話す五つの町は、エジプトの中にイスラエルの神を礼拝する人々が現れることを示します。","s":166.788,"e":175.419,"p":false,"h":false},{"t":"五つという数字が何を指すかは、はっきりしません。","s":175.716,"e":179.078,"p":true,"h":false},{"t":"19~20節の祭壇と柱は、エジプトが、主を礼拝する国となることを表します。","s":179.748,"e":186.475,"p":false,"h":false},{"t":"ただし、この預言がどの時期に実現するのか、あるいは終わりの時にまだ待つべきものなのかは、読み方が分かれます。","s":186.768,"e":194.668,"p":true,"h":false},{"t":"21~22節の「打たれるが、いやされる」は、さばきが目的ではなく、悔い改めと回復へ向かうものであることを示します。","s":195.3,"e":204.389,"p":false,"h":false},{"t":"主は、エジプトにも、救いの道を開かれます。","s":204.66,"e":208.049,"p":true,"h":false},{"t":"23~25節の結びは、この宣告の中でも、もっとも驚くべき言葉です。","s":208.692,"e":214.846,"p":false,"h":false},{"t":"かつてイスラエルを苦しめたエジプトと、のちにイスラエルを襲ったアッシリアが、主の民と呼ばれ、主の手のわざと呼ばれます。","s":215.136,"e":223.166,"p":false,"h":false},{"t":"「わが民」というイスラエルへの呼び名が、異邦の国にも与えられているのは、福音が諸国民に開かれていることを、旧約の中ですでに示すものとして、よく取り上げられます。","s":223.452,"e":234.907,"p":true,"h":false}]},{"title":"イザヤ書_20章","audio":"doc20_2610231055.mp3","dur":151.1,"segs":[{"t":"イザヤ書20章","s":0,"e":1.364,"p":true,"h":false},{"t":"全体の流れ","s":2.016,"e":3.121,"p":true,"h":false},{"t":"20章は短い章で、イザヤの行動による預言が語られます。","s":3.924,"e":8.368,"p":false,"h":false},{"t":"アッシリアの王サルゴンが、将軍をアシュドドに送り、この町を攻め取った年のことです(20:1)。","s":8.64,"e":14.433,"p":false,"h":false},{"t":"そのとき、主はイザヤに、「腰の粗布を解き、足のくつを脱げ」と命じられます。","s":14.724,"e":20.293,"p":false,"h":false},{"t":"イザヤはその通りにして、裸で、はだしで歩きました(20:2)。","s":20.592,"e":24.369,"p":true,"h":false},{"t":"主は言われます。","s":25.02,"e":26.059,"p":false,"h":false},{"t":"「わたしのしもべイザヤが、エジプトとクシュに対するしるしと前兆として、三年間裸で、はだしで歩いたように、アッシリアの王は、エジプトの捕虜、クシュの捕らわれ人を、若い者も老人も、裸で、はだしで、尻をむき出しにして連れて行く」(20:3-4)。","s":26.928,"e":43.585,"p":true,"h":false},{"t":"その時、クシュを頼りにし、エジプトを誇りにしていた人々は、うろたえ、恥じます。","s":44.244,"e":50.258,"p":false,"h":false},{"t":"海岸の住民は言います。","s":50.544,"e":52.232,"p":false,"h":false},{"t":"「見よ、私たちが頼りにして、アッシリアの王から助け出してもらおうと逃げ込んだ者が、このようになってしまった。","s":52.524,"e":59.722,"p":false,"h":false},{"t":"私たちは、どうして逃れられるだろうか」(20:5-6)。","s":60.012,"e":62.737,"p":true,"h":false},{"t":"各節の解説","s":63.36,"e":64.642,"p":true,"h":false},{"t":"1節の「サルゴン」は、聖書の中で、この箇所にしか名前が出てこないアッシリアの王です。","s":65.304,"e":71.412,"p":false,"h":false},{"t":"アシュドドの陥落は、ペリシテの地の出来事ですが、エジプトに頼ろうとする人々への警告として語られています。","s":71.712,"e":79.166,"p":true,"h":false},{"t":"2節の「粗布を解く」は、預言者が着ていた喪の衣、または預言者の装いと関連づけられます。","s":79.812,"e":86.675,"p":false,"h":false},{"t":"「裸」がどの程度の姿を指すかは、読み方が分かれます。","s":86.976,"e":90.759,"p":false,"h":false},{"t":"下着だけの姿とも、完全な裸とも理解されます。","s":91.044,"e":94.929,"p":false,"h":false},{"t":"どちらにしても、恥をさらす姿であることは変わりません。","s":95.22,"e":99.059,"p":true,"h":false},{"t":"3節の「三年間」は、三年間そうし続けたのか、象徴的な期間なのか、読み方が分かれます。","s":99.72,"e":106.85,"p":false,"h":false},{"t":"細かい点にとらわれるより、預言者が自分の体で、神の言葉を語ったことが大切です。","s":107.136,"e":113.429,"p":true,"h":false},{"t":"4節で、捕虜が裸で連れて行かれる描写は、アッシリアの兵の残酷さと、人間の同盟が結局は無力であることを、具体的に示しています。","s":114.084,"e":124.264,"p":true,"h":false},{"t":"5~6節の人々の言葉は、頼りにしていたものが崩れたあとの、正直な嘆きです。","s":124.92,"e":131.146,"p":false,"h":false},{"t":"ユダの人々は、エジプトやクシュと組めば、アッシリアに勝てると思っていました。","s":131.436,"e":136.612,"p":false,"h":false},{"t":"しかし、それは、頼る先が間違っていたのです。","s":136.908,"e":140.443,"p":false,"h":false},{"t":"この章は、これまでの章で繰り返されている主題、つまり、神ではなく人に頼る愚かさを、預言者自身の姿を通して、見せています。","s":140.76,"e":150.49,"p":true,"h":false}]},{"title":"イザヤ書_21章","audio":"doc21_2610231055.mp3","dur":196.6,"segs":[{"t":"イザヤ書21章","s":0,"e":1.503,"p":true,"h":false},{"t":"全体の流れ","s":2.16,"e":3.265,"p":true,"h":false},{"t":"21章は、「海の荒れ野」についての宣告から始まります。","s":4.068,"e":8.172,"p":false,"h":false},{"t":"これはバビロンを指すと理解されています。","s":8.46,"e":10.943,"p":false,"h":false},{"t":"南のネゲブに吹く暴風のように、恐ろしい幻が荒れ野から来ます。","s":11.232,"e":15.926,"p":false,"h":false},{"t":"裏切る者は裏切り、荒らす者は荒らします。","s":16.236,"e":19.227,"p":false,"h":false},{"t":"「エラムよ、上れ。","s":19.512,"e":20.789,"p":false,"h":false},{"t":"メディアよ、攻め囲め」と命じられ、主は、これまでのうめきをすべてやめさせると言われます(21:1-2)。","s":21.42,"e":27.718,"p":true,"h":false},{"t":"この幻を見たイザヤは、体がもだえ苦しみます。","s":28.332,"e":32.05,"p":false,"h":false},{"t":"産婦の痛みのようなものに捕らえられ、聞くことも見ることもできなくなり、心はさまよい、恐れが彼を震えさせます。","s":32.328,"e":40.21,"p":false,"h":false},{"t":"楽しみにしていた夕暮れは、恐れに変わりました(21:3-4)。","s":40.5,"e":43.676,"p":false,"h":false},{"t":"町では宴の用意がされ、人々は食べ、飲んでいます。","s":43.956,"e":47.675,"p":false,"h":false},{"t":"そこへ、「君たちよ、立ち上がれ。","s":47.988,"e":50.394,"p":false,"h":false},{"t":"盾に油を塗れ」と叫ぶ声がします(21:5)。","s":50.688,"e":53.313,"p":true,"h":false},{"t":"主はイザヤに、見張りを立てて、見たものを告げさせるよう命じられます。","s":53.964,"e":58.811,"p":false,"h":false},{"t":"見張りは、ろばや、らくだに乗った者たちの一隊が来るのを見ます(21:6-7)。","s":59.112,"e":63.655,"p":false,"h":false},{"t":"見張りは獅子のように叫びます。","s":63.936,"e":65.866,"p":false,"h":false},{"t":"「主よ、私は昼間ずっと見張り台に立ち、夜もずっと持ち場についています」(21:8)。","s":66.168,"e":71.42,"p":false,"h":false},{"t":"そこに、二頭立ての戦車に乗った男が来て告げます。","s":71.712,"e":75.337,"p":false,"h":false},{"t":"「倒れた、バビロンは倒れた。","s":75.636,"e":77.579,"p":false,"h":false},{"t":"その神々の像はみな砕かれて地に落ちた」(21:9)。","s":77.868,"e":80.775,"p":false,"h":false},{"t":"最後に、イザヤは言います。","s":81.072,"e":82.951,"p":false,"h":false},{"t":"「打たれた私の民よ。","s":83.232,"e":84.702,"p":false,"h":false},{"t":"私は、イスラエルの神、万軍の主から聞いたことを、あなたがたに告げた」(21:10)。","s":85.14,"e":90.386,"p":true,"h":false},{"t":"各節の解説","s":91.044,"e":92.326,"p":true,"h":false},{"t":"1節の「海の荒れ野」は、バビロンを指すと一般に理解されています。","s":92.988,"e":97.502,"p":false,"h":false},{"t":"バビロンの低い土地が、海のように水に囲まれていたことに由来する呼び名とも言われますが、確かなことは分かりません。","s":97.776,"e":105.462,"p":false,"h":false},{"t":"この呼び名が何を指すかについては、読み方が分かれます。","s":105.768,"e":109.565,"p":true,"h":false},{"t":"2節の「エラム」と「メディア」は、バビロンを攻める勢力として名が挙げられています。","s":110.196,"e":115.413,"p":false,"h":false},{"t":"のちにバビロンを倒したのは、ペルシア王キュロスの軍で、メディア人もそこに加わっていました。","s":115.704,"e":121.873,"p":false,"h":false},{"t":"13章17節でもメディアの名が出ていました。","s":122.148,"e":125.512,"p":true,"h":false},{"t":"3~4節で、イザヤ自身の体が痛み、恐れに震えるのは、預言者が神の言葉の重さを自分の体で受け止めていることを示します。","s":126.144,"e":135.75,"p":false,"h":false},{"t":"さばきを告げる者が、冷たく宣告しているのではないことが、ここでもわかります。","s":136.044,"e":141.616,"p":true,"h":false},{"t":"5節の宴と叫びの対比は、のちにバビロンが一夜のうちに落ちたという出来事を思い起こさせます。","s":142.272,"e":148.774,"p":false,"h":false},{"t":"人々が食べ、飲んでいる最中に、突然、滅びが来ます。","s":149.076,"e":153.364,"p":true,"h":false},{"t":"6~9節の見張りは、神の言葉を待って立つ預言者の姿とも読まれます。","s":154.008,"e":159.376,"p":false,"h":false},{"t":"見張りの叫びと、戦車の男の知らせは、バビロンの陥落を、確かな出来事として告げています。","s":159.66,"e":166.479,"p":true,"h":false},{"t":"9節の「神々の像はみな砕かれて」は、バビロンが頼った偶像が、何の助けにもならなかったことを示します。","s":167.112,"e":174.872,"p":false,"h":false},{"t":"偶像に頼る国の最後は、いつもこのようになります。","s":175.176,"e":178.981,"p":false,"h":false},{"t":"この言葉は、新約聖書の黙示録で、大いなるバビロンの陥落を語る時にも響いています。","s":179.28,"e":185.608,"p":true,"h":false},{"t":"10節の「打たれた私の民」は、麦を打つ脱穀の比喩です。","s":186.228,"e":190.492,"p":false,"h":false},{"t":"神の民が、さばきを通して、打たれ、より分けられていく様子を指します。","s":190.764,"e":195.94,"p":true,"h":false}]},{"title":"イザヤ書_22章","audio":"doc22_2610231055.mp3","dur":262,"segs":[{"t":"イザヤ書22章","s":0,"e":1.514,"p":true,"h":false},{"t":"全体の流れ","s":2.16,"e":3.265,"p":true,"h":false},{"t":"22章は、「幻の谷」、つまりエルサレムに対する宣告です。","s":4.068,"e":8.663,"p":false,"h":false},{"t":"町の人々は、屋上に上って、騒ぎ、浮かれています。","s":8.928,"e":13.118,"p":false,"h":false},{"t":"しかし、その町の人々は、剣で殺されたのではなく、戦わずして死んだのです(22:1-2)。","s":13.392,"e":19.335,"p":false,"h":false},{"t":"指導者たちは皆逃げ、弓を射ることなく捕らえられます(22:3)。","s":19.62,"e":23.415,"p":false,"h":false},{"t":"そこでイザヤは、「私から目をそらしてくれ。","s":23.724,"e":26.586,"p":false,"h":false},{"t":"私は激しく泣く。","s":26.892,"e":28.232,"p":false,"h":false},{"t":"私の民の娘の破滅のことで、私を慰めようとしないでくれ」と嘆きます(22:4)。","s":28.8,"e":34.425,"p":true,"h":false},{"t":"その日は、混乱と踏みにじりと恐慌の日で、主が定められた日です。","s":35.064,"e":39.989,"p":false,"h":false},{"t":"人々は町の城壁を見回り、武器庫の武器を数え、ダビデの町の城壁の破れ目を調べ、水を蓄えます。","s":40.284,"e":48.494,"p":false,"h":false},{"t":"家を壊してまで城壁を補強します(22:5-11前半)。","s":48.78,"e":52.013,"p":false,"h":false},{"t":"しかし、彼らは、この町を造られた方、昔からこれを計画された方を見ようとはしませんでした(22:11後半)。","s":52.308,"e":60.003,"p":true,"h":false},{"t":"主は、その日、泣いて悲しみ、頭を剃って粗布をまとうよう呼びかけられました。","s":60.624,"e":66.203,"p":false,"h":false},{"t":"ところが、人々は喜び楽しんで、牛を殺し、羊をほふり、肉を食べ、酒を飲み、「食べて飲もう。","s":66.492,"e":74.255,"p":false,"h":false},{"t":"どうせ明日は死ぬのだから」と言いました(22:12-13)。","s":74.556,"e":77.124,"p":false,"h":false},{"t":"主は、「この咎は、あなたがたが死ぬまで赦されない」と告げられます(22:14)。","s":77.436,"e":82.25,"p":true,"h":false},{"t":"後半は、宮廷の長であるシェブナへの宣告です。","s":82.872,"e":86.353,"p":false,"h":false},{"t":"シェブナは高い所に墓を掘って、自分の栄誉を求めましたが、主は彼を投げ飛ばされます(22:15-19)。","s":86.652,"e":92.941,"p":false,"h":false},{"t":"その日、主は、ヒルキヤの子エルヤキムを召し、シェブナの衣と帯を着せ、権限を与えられます。","s":93.24,"e":100.221,"p":false,"h":false},{"t":"エルヤキムは、エルサレムの住民とユダの家の父となり、ダビデの家の鍵が彼の肩に置かれます(22:20-22)。","s":100.512,"e":107.199,"p":false,"h":false},{"t":"彼は、確かな所に打ち込まれた釘のようになりますが、その釘に掛けられた重みがあまりに大きくなると、その釘も抜け落ちます(22:23-25)。","s":107.496,"e":116.385,"p":true,"h":false},{"t":"各節の解説","s":117.036,"e":118.318,"p":true,"h":false},{"t":"1節の「幻の谷」は、エルサレムを指すと理解されます。","s":118.98,"e":123.079,"p":false,"h":false},{"t":"聖なる都が、他の国々と同じように、さばきの宣告を受ける対象になっています。","s":123.372,"e":129.463,"p":false,"h":false},{"t":"神の都だからといって、さばきを免れるのではない、という厳しさがここにあります。","s":129.744,"e":135.624,"p":true,"h":false},{"t":"2節の「戦わずして死んだ」は、剣で倒れたのではなく、飢えや疫病で死んだのだと読まれることがあります。","s":136.26,"e":143.473,"p":false,"h":false},{"t":"詳しい状況は、この言葉からは確定できません。","s":143.748,"e":147.461,"p":true,"h":false},{"t":"8~11節の城壁の見回りや水の貯えは、人間の備えをすべて尽くしている姿です。","s":148.104,"e":154.776,"p":false,"h":false},{"t":"それ自体は悪いことではありませんが、「この町を造られた方」に目を向けなかったことが、問題とされています。","s":155.052,"e":162.239,"p":false,"h":false},{"t":"備えと信頼は、別のものです。","s":162.54,"e":164.953,"p":true,"h":false},{"t":"12~13節の「食べて飲もう。","s":165.6,"e":168.026,"p":false,"h":false},{"t":"どうせ明日は死ぬのだから」は、悔い改めを求められた時に、逆に享楽に走る姿です。","s":168.336,"e":174.903,"p":false,"h":false},{"t":"この言葉は、新約聖書のパウロが、復活を否定する議論の中で引いています。","s":175.212,"e":180.831,"p":false,"h":false},{"t":"神の呼びかけを聞いても、自分の快楽を選ぶ心の硬さが、ここで示されています。","s":181.116,"e":187.164,"p":true,"h":false},{"t":"14節の「この咎は死ぬまで赦されない」は、罪の重大さを語る言葉です。","s":187.812,"e":193.384,"p":false,"h":false},{"t":"悔い改めの機会が与えられたのに、それを拒んだ民への、最後通告のように響きます。","s":193.68,"e":199.822,"p":true,"h":false},{"t":"15~19節のシェブナは、宮廷の長という高い地位にありながら、自分の栄誉を求めた人です。","s":200.448,"e":207.662,"p":false,"h":false},{"t":"権力を持つ者が、神のしもべではなく、自分の名のために働くとき、主はその地位を取り去られます。","s":207.936,"e":215.159,"p":true,"h":false},{"t":"20~22節のエルヤキムは、シェブナに代わる、忠実な家臣として描かれます。","s":215.784,"e":221.691,"p":false,"h":false},{"t":"「ダビデの家の鍵」を与えられるという言葉は、新約聖書で、キリストが「ダビデの鍵を持つ方」と呼ばれる場面と結びつけて読まれます。","s":221.976,"e":231.127,"p":false,"h":false},{"t":"ただし、ここでは、歴史上のエルヤキムの任命と、のちのキリストを指す読み方を、区別して考える必要があります。","s":231.408,"e":239.797,"p":true,"h":false},{"t":"23~25節の釘の描写は、解釈が難しいところです。","s":240.444,"e":245.47,"p":false,"h":false},{"t":"エルヤキムが、確かな所に打ち込まれた釘のようになるのに、後にその釘が抜け落ちると言われます。","s":245.772,"e":252.524,"p":false,"h":false},{"t":"この最後の釘が誰を指すのかは、読み方が分かれます。","s":252.828,"e":256.671,"p":false,"h":false},{"t":"エルヤキムに頼りすぎた一族への警告と読む立場が多く見られます。","s":256.968,"e":261.383,"p":true,"h":false}]},{"title":"イザヤ書_23章","audio":"doc23_2610231055.mp3","dur":236.4,"segs":[{"t":"イザヤ書23章","s":0,"e":1.586,"p":true,"h":false},{"t":"全体の流れ","s":2.232,"e":3.337,"p":true,"h":false},{"t":"23章は、ツロ、つまりフェニキアの港町に対する宣告です。","s":4.14,"e":9.195,"p":false,"h":false},{"t":"ターシシュの船よ、泣き叫べ。","s":9.504,"e":11.454,"p":false,"h":false},{"t":"ツロは荒らされ、家もなくなり、港もなくなったと、キティムの地で知らされます(23:1)。","s":11.772,"e":17.082,"p":false,"h":false},{"t":"海辺の住民よ、黙れ。","s":17.388,"e":19.187,"p":false,"h":false},{"t":"シドンの商人たちが、あなたを豊かにしていたのに、と言われます(23:2)。","s":19.476,"e":23.869,"p":false,"h":false},{"t":"シホルの穀物、ナイルの刈り入れは、ツロの収入となり、ツロは諸国民の市場となっていました(23:3)。","s":24.156,"e":30.999,"p":true,"h":false},{"t":"シドンよ、恥じよ。","s":31.644,"e":33.01,"p":false,"h":false},{"t":"海は言います。","s":33.552,"e":34.527,"p":false,"h":false},{"t":"「私は産みの苦しみをしたことがなく、子を産んだこともなく、若者を育てたことも、おとめを育てたこともない」(23:4)。","s":35.46,"e":42.914,"p":false,"h":false},{"t":"エジプトにこの知らせが届くと、人々はツロの知らせを聞いて、もだえ苦しみます(23:5)。","s":43.2,"e":48.777,"p":false,"h":false},{"t":"人々は、ターシシュへ渡って泣き叫ぶようにと促されます(23:6)。","s":49.068,"e":53.005,"p":true,"h":false},{"t":"これが、昔から栄えていたあなたがたの陽気な町なのか、と問われます。","s":53.64,"e":58.646,"p":false,"h":false},{"t":"冠を授けるツロ、商人が君主であり、貿易商人が地の誉れ高い者だった町、これを計画したのは誰か、と問われます(23:7-8)。","s":58.932,"e":68.084,"p":false,"h":false},{"t":"それは、万軍の主です。","s":68.4,"e":70.349,"p":false,"h":false},{"t":"すべての栄光の誇りを汚し、地の誉れ高い者を卑しめるために、主が計画されました(23:9)。","s":70.668,"e":77.057,"p":false,"h":false},{"t":"船は嘆き、もうターシシュの港はありません(23:10-14)。","s":77.328,"e":80.476,"p":true,"h":false},{"t":"その日、ツロは七十年の間、忘れられます。","s":81.144,"e":84.558,"p":false,"h":false},{"t":"七十年たつと、ツロは遊女の歌のようになります。","s":84.852,"e":88.377,"p":false,"h":false},{"t":"「忘れられた遊女よ、立琴を取って町を巡れ。","s":88.668,"e":92.031,"p":false,"h":false},{"t":"上手に弾き、多くの歌を歌え。","s":92.304,"e":94.532,"p":false,"h":false},{"t":"そうすれば思い出される」(23:15-16)。","s":94.86,"e":96.34,"p":false,"h":false},{"t":"七十年の終わりに、主はツロを顧みられます。","s":96.768,"e":100.149,"p":false,"h":false},{"t":"ツロは再び、その稼ぎを得て、地上のあらゆる国と淫らな取り引きをします。","s":100.44,"e":105.995,"p":false,"h":false},{"t":"しかし、その商売の利益は、主のための聖なる物となり、蓄えられも、隠されもせず、主の前に住む者たちのために、十分な食物と上等な衣服になります(23:17-18)。","s":106.272,"e":118.366,"p":true,"h":false},{"t":"各節の解説","s":119.016,"e":120.298,"p":true,"h":false},{"t":"1節の「ターシシュの船」は、遠い西の地との貿易に使われた大きな船を指します。","s":120.96,"e":126.648,"p":false,"h":false},{"t":"ターシシュの正確な場所は、はっきり分かっていません。","s":126.936,"e":130.295,"p":false,"h":false},{"t":"それでも、世界の果てまで交易していた、ツロの海の力を表す言葉として読めます。","s":130.608,"e":136.625,"p":true,"h":false},{"t":"2~3節のシドンやシホルの名は、ツロが、周りの国々の富によって豊かになっていたことを示します。","s":137.268,"e":144.68,"p":false,"h":false},{"t":"ツロの栄えは、他の国々との取り引きの上に築かれていました。","s":144.972,"e":149.433,"p":true,"h":false},{"t":"8~9節で、ツロを滅ぼす計画は、主のものだとはっきり語られます。","s":150.084,"e":155.368,"p":false,"h":false},{"t":"ここでも、人間の目には経済の変化に見えることの背後に、神の計画があるという、イザヤ書の一貫した見方があります。","s":155.664,"e":164.139,"p":false,"h":false},{"t":"誇りを汚されるのは、富そのものではなく、富を誇る心です。","s":164.412,"e":169.088,"p":true,"h":false},{"t":"15節の「七十年」は、その期間が文字どおりの七十年なのか、一人の王の時代を指す象徴的な表現なのかで、読み方が分かれます。","s":169.74,"e":179.465,"p":false,"h":false},{"t":"のちに、バビロン捕囚の七十年として知られる期間とは、直接結びつけない読み方が一般的です。","s":179.748,"e":186.996,"p":true,"h":false},{"t":"15~16節の遊女の比喩は、ツロが利益のために諸国と結びつく姿を表します。","s":187.632,"e":194.141,"p":false,"h":false},{"t":"これは、聖書が、神以外のものと結びつく不誠実を、結婚の裏切りにたとえるときの、いつもの言い方です。","s":194.436,"e":202.315,"p":false,"h":false},{"t":"ツロの商売が、悪い意味で語られていることが分かります。","s":202.608,"e":206.371,"p":true,"h":false},{"t":"17~18節の結びは、驚くべきものです。","s":207,"e":210.689,"p":false,"h":false},{"t":"ツロの利益が、主のための聖なる物となり、主に仕える人々の食物や衣服になります。","s":210.96,"e":217.308,"p":false,"h":false},{"t":"この結びは、異邦の富が、最後には神の民のために用いられるという望みを語ります。","s":217.584,"e":224.027,"p":false,"h":false},{"t":"ただし、これがどのような形で実現するのかについては、読み方が分かれます。","s":224.316,"e":229.826,"p":false,"h":false},{"t":"60章の、諸国民の富がシオンに集まるという預言とのつながりも指摘されます。","s":230.112,"e":235.83,"p":true,"h":false}]},{"title":"イザヤ書_24章","audio":"doc24_2610231055.mp3","dur":253.7,"segs":[{"t":"イザヤ書24章","s":0,"e":1.586,"p":true,"h":false},{"t":"全体の流れ","s":2.232,"e":3.337,"p":true,"h":false},{"t":"24章から27章までは、「イザヤの黙示録」と呼ばれることがあります。","s":4.14,"e":9.433,"p":false,"h":false},{"t":"これまでの個別の国々への宣告が終わり、全地に対するさばきが語られます。","s":9.72,"e":15.102,"p":false,"h":false},{"t":"「見よ、主は地を空にし、荒れ果てさせ、その面をゆがめ、住民を散らされる」(24:1)。","s":15.408,"e":21.163,"p":false,"h":false},{"t":"そのさばきは、民も祭司も、奴隷も主人も、買い手も売り手も、すべての人に等しく及びます(24:2-3)。","s":21.456,"e":28.414,"p":true,"h":false},{"t":"その理由は、地が、その住民の下で汚されたからです。","s":29.052,"e":33.191,"p":false,"h":false},{"t":"彼らは律法を犯し、定めを変え、永遠の契約を破りました。","s":33.48,"e":38.157,"p":false,"h":false},{"t":"そのため、のろいが地を食い尽くし、住民は罪を負い、地の住民は焼かれ、わずかな者が残ります(24:4-6)。","s":38.448,"e":45.778,"p":false,"h":false},{"t":"新しいぶどう酒は嘆き、ぶどうの木はしおれ、心の楽しい者たちはみな、うめきます。","s":46.08,"e":52.378,"p":false,"h":false},{"t":"喜びの音は消え、都は荒れ果てます(24:7-12)。","s":52.668,"e":55.581,"p":false,"h":false},{"t":"それでも、地の民のうちには、わずかな者が残ります。","s":55.872,"e":59.765,"p":false,"h":false},{"t":"オリーブの木
