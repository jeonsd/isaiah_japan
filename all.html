えない」(42:8)。","s":65.088,"e":69.781,"p":false,"h":false},{"t":"見よ、先のことは起こった。","s":70.056,"e":71.985,"p":false,"h":false},{"t":"新しいことを、わたしは告げる。","s":72.288,"e":74.416,"p":false,"h":false},{"t":"それが芽生える前に、あなたがたに聞かせる(42:9)。","s":74.7,"e":77.604,"p":true,"h":false},{"t":"そこで、新しい歌が呼びかけられます。","s":78.228,"e":80.96,"p":false,"h":false},{"t":"「主に新しい歌を歌え。","s":81.252,"e":83.008,"p":false,"h":false},{"t":"地の果てから、その誉れを。","s":83.304,"e":85.165,"p":false,"h":false},{"t":"海に下る者、そこに満ちるもの、島々とそこに住む者よ」。","s":85.464,"e":89.907,"p":false,"h":false},{"t":"荒れ野と、そこにある町々も声を上げ、ケダルの住む村々も声を上げます(42:10-12)。","s":90.216,"e":95.61,"p":false,"h":false},{"t":"主は勇士のように出て行き、戦士のように熱情をかき立て、鬨の声を上げて敵に向かわれます(42:13)。","s":95.904,"e":102.509,"p":false,"h":false},{"t":"「わたしは長い間、黙って、静かにして自分を抑えてきた。","s":102.78,"e":107.143,"p":false,"h":false},{"t":"今、産みの苦しみをする女のようにうめき、あえぎ、息を切らす」(42:14)。","s":107.424,"e":112.106,"p":false,"h":false},{"t":"山々や丘を荒らし、川を島にし、沼を干上がらせます。","s":112.428,"e":116.892,"p":false,"h":false},{"t":"しかし、盲人は、知らない道に導かれ、見知らぬ小道を歩かされます。","s":117.18,"e":122.755,"p":false,"h":false},{"t":"暗闇は、彼らの前で光に、でこぼこの所は平らにされます(42:15-16)。","s":123.048,"e":127.799,"p":false,"h":false},{"t":"偶像に頼る者たちは退けられ、ひどく恥を受けます(42:17)。","s":128.088,"e":132.078,"p":true,"h":false},{"t":"最後に、イスラエルの現状が語られます。","s":132.696,"e":135.548,"p":false,"h":false},{"t":"「聞け、耳の聞こえない者たち。","s":135.828,"e":138.015,"p":false,"h":false},{"t":"見よ、目の見えない者たち。","s":138.276,"e":140.198,"p":false,"h":false},{"t":"だれが盲目か。","s":140.508,"e":141.615,"p":false,"h":false},{"t":"わたしのしもべのほかに。","s":142.416,"e":143.913,"p":false,"h":false},{"t":"わたしが遣わす使いのほかに、だれが耳が聞こえないのか」(42:18-19)。","s":144.324,"e":148.225,"p":false,"h":false},{"t":"彼らは多くのことを見ても気に留めず、耳を開いていても聞きません。","s":148.5,"e":153.087,"p":false,"h":false},{"t":"主は、ご自分の義のために、教えを大いなるものとし、栄光あるものとされます。","s":153.396,"e":159.048,"p":false,"h":false},{"t":"ところが、この民は、略奪され、略奪者に渡されて、穴の中に閉じ込められ、牢に隠されています。","s":159.336,"e":166.935,"p":false,"h":false},{"t":"だれも救い出す者はいません(42:20-22)。","s":167.22,"e":169.037,"p":false,"h":false},{"t":"あなたがたのうち、だれがこれを聞くのか。","s":169.344,"e":172.058,"p":false,"h":false},{"t":"ヤコブを略奪者に渡したのはだれか。","s":172.332,"e":174.789,"p":false,"h":false},{"t":"主ではなかったか。","s":175.068,"e":176.216,"p":false,"h":false},{"t":"人々が主の道を歩もうとせず、その教えに聞き従わなかったからです。","s":176.976,"e":181.857,"p":false,"h":false},{"t":"主は、怒りの熱さを注ぎ、彼を火で囲まれましたが、彼は気づかず、心に留めませんでした(42:23-25)。","s":182.124,"e":189.176,"p":true,"h":false},{"t":"各節の解説","s":189.792,"e":191.074,"p":true,"h":false},{"t":"1~4節は、「しもべの歌」と呼ばれる四つの歌の、最初のものです。","s":191.736,"e":196.735,"p":false,"h":false},{"t":"ここで語られる「しもべ」が誰を指すかは、イザヤ書の最も大きな論点の一つです。","s":197.028,"e":202.697,"p":false,"h":false},{"t":"イスラエルの民全体を指すという読み方、預言者自身を指すという読み方、のちに来られるメシアを指すという読み方があります。","s":203.004,"e":211.395,"p":false,"h":false},{"t":"新約聖書は、マタイの福音書で、この箇所をイエスの働きに当てはめています。","s":211.68,"e":217.322,"p":false,"h":false},{"t":"改革派の伝統は、この「しもべ」を、最終的にはイエス・キリストと理解してきました。","s":217.62,"e":223.516,"p":false,"h":false},{"t":"ただし、41章で、イスラエルが「しもべ」と呼ばれていることと、どう関係するのかは、読み方が分かれます。","s":223.812,"e":231.48,"p":false,"h":false},{"t":"ここでは、イスラエルが失敗した務めを、ひとりのしもべが完成される、という理解が一つの整理です。","s":231.768,"e":238.851,"p":true,"h":false},{"t":"2~3節の、叫ばず、傷ついた葦を折らず、くすぶる灯心を消さないという描写は、力で押し通す王とは違う、柔和で忍耐強い働き方を示します。","s":239.508,"e":251.39,"p":false,"h":false},{"t":"弱い者を、そのまま見捨てず、育てる姿です。","s":251.676,"e":255.166,"p":true,"h":false},{"t":"6節の「民の契約、国々の光」は、しもべの務めの広がりを語ります。","s":255.816,"e":261.579,"p":false,"h":false},{"t":"イスラエルのためだけでなく、諸国民のための務めです。","s":261.864,"e":265.495,"p":false,"h":false},{"t":"この「光」は、新約聖書で、シメオンがイエスについて語る場面などで、思い起こされます。","s":265.788,"e":271.991,"p":true,"h":false},{"t":"7節の、見えない目を開き、囚人を牢から連れ出すという働きは、バビロンからの解放を指すとともに、より深い、罪の闇からの解放を示すと、読まれることが多いです。","s":272.628,"e":284.939,"p":true,"h":false},{"t":"9節の「新しいこと」は、これから起こる出来事を、前もって告げられることを指します。","s":285.588,"e":291.636,"p":false,"h":false},{"t":"41章の偶像との論争と同じく、預言が成就することが、神の唯一性の証しになっています。","s":291.924,"e":299.231,"p":true,"h":false},{"t":"13~14節で、主が勇士のように出て行く姿と、産みの苦しみの女のようにうめく姿が、並んで語られます。","s":299.88,"e":308.317,"p":false,"h":false},{"t":"主が、長く忍耐してきたことと、それが限界に達して動き出すことの、両方が表されています。","s":308.592,"e":315.504,"p":true,"h":false},{"t":"18~22節の、盲目で耳の聞こえないしもべは、5節以降の、見えない目を開くしもべとは、対照的です。","s":316.152,"e":324.79,"p":false,"h":false},{"t":"ここでの盲目のしもべは、務めを果たせていないイスラエルです。","s":325.08,"e":329.161,"p":false,"h":false},{"t":"主のしもべの務めを完成するのは、民ではなく、民に代わって立つ、真のしもべだ、という流れで読む立場があります。","s":329.472,"e":337.886,"p":true,"h":false},{"t":"24~25節は、イスラエルの苦しみの原因が、神の怒りであることを、率直に語ります。","s":338.508,"e":345.713,"p":false,"h":false},{"t":"民が気づかなかったことも含め、さばきが、悔い改めを促すものであることがわかります。","s":345.996,"e":352.078,"p":true,"h":false}]},{"title":"イザヤ書_43章","audio":"doc43_2610231055.mp3","dur":434.3,"segs":[{"t":"イザヤ書43章","s":0,"e":1.623,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"「しかし、今」と、43章は始まります。","s":4.176,"e":7.52,"p":false,"h":false},{"t":"「ヤコブよ、あなたを創造した主、イスラエルよ、あなたを形造った方が、こう言われる。","s":7.812,"e":13.708,"p":false,"h":false},{"t":"恐れるな。","s":14.004,"e":14.715,"p":false,"h":false},{"t":"わたしがあなたを贖った。","s":15.912,"e":17.427,"p":false,"h":false},{"t":"わたしはあなたの名を呼んだ。","s":17.82,"e":19.552,"p":false,"h":false},{"t":"あなたはわたしのもの」(43:1)。","s":19.836,"e":21.202,"p":false,"h":false},{"t":"水の中を過ぎるときも、わたしがあなたとともにいる。","s":21.744,"e":25.223,"p":false,"h":false},{"t":"川の中も、あなたは押し流されない。","s":25.524,"e":27.94,"p":false,"h":false},{"t":"火の中を歩いても、あなたは焼かれず、炎もあなたに燃えつかない(43:2)。","s":28.224,"e":32.652,"p":false,"h":false},{"t":"わたしが主、あなたの神、イスラエルの聖なる方、あなたの救い主だからです。","s":32.94,"e":38.554,"p":false,"h":false},{"t":"わたしは、エジプトをあなたの身代金とし、クシュとセバをあなたの代わりとした(43:3)。","s":38.844,"e":44.281,"p":false,"h":false},{"t":"あなたは、わたしの目に高価で、尊い。","s":44.568,"e":47.523,"p":false,"h":false},{"t":"わたしはあなたを愛している。","s":47.808,"e":49.492,"p":false,"h":false},{"t":"だから、人をあなたの代わりに、国民をあなたのいのちの代わりに与える(43:4)。","s":49.788,"e":54.71,"p":true,"h":false},{"t":"恐れるな。","s":55.332,"e":56.043,"p":false,"h":false},{"t":"わたしはあなたとともにいる。","s":57.24,"e":58.918,"p":false,"h":false},{"t":"わたしは、東から、西から、あなたの子孫を連れて来る。","s":59.22,"e":63.397,"p":false,"h":false},{"t":"北にも南にも言う。","s":63.684,"e":65.161,"p":false,"h":false},{"t":"「引き渡せ。","s":65.592,"e":66.388,"p":false,"h":false},{"t":"引き止めるな。","s":67.5,"e":68.361,"p":false,"h":false},{"t":"わたしの息子たちを遠くから、わたしの娘たちを地の果てから連れて来い。","s":69.408,"e":74.304,"p":false,"h":false},{"t":"わたしの名で呼ばれる者、わたしが栄光のために創造し、形造った者を」(43:5-7)。","s":74.592,"e":80.117,"p":true,"h":false},{"t":"主は、再び法廷を開かれます。","s":80.748,"e":83.297,"p":false,"h":false},{"t":"「目があっても見えない民、耳があっても聞こえない民を連れ出せ」。","s":83.592,"e":87.786,"p":false,"h":false},{"t":"国々は集まり、民は寄り集まるがよい。","s":88.092,"e":91.022,"p":false,"h":false},{"t":"彼らのうち、だれがこのことを告げ、先の事を聞かせるのか(43:8-9)。","s":91.296,"e":95.609,"p":false,"h":false},{"t":"「あなたがたは、わたしの証人。","s":95.904,"e":98.103,"p":false,"h":false},{"t":"わたしが選んだわたしのしもべ。","s":98.388,"e":100.281,"p":false,"h":false},{"t":"それは、あなたがたが知って、わたしを信じ、わたしこそそれであることを悟るためだ。","s":100.548,"e":106.305,"p":false,"h":false},{"t":"わたしより前に造られた神はなく、わたしより後にも、ない。","s":106.596,"e":110.837,"p":false,"h":false},{"t":"わたしこそ主、わたしのほかに救い主はいない」(43:10-11)。","s":111.132,"e":114.382,"p":false,"h":false},{"t":"わたしが告げ、救い、聞かせた。","s":114.66,"e":117.039,"p":false,"h":false},{"t":"あなたがたの間に、他の神はいなかった。","s":117.324,"e":120.28,"p":false,"h":false},{"t":"あなたがたはわたしの証人。","s":120.564,"e":122.436,"p":false,"h":false},{"t":"わたしは神である。","s":122.724,"e":123.948,"p":false,"h":false},{"t":"今日からも、わたしはそれである。","s":124.632,"e":126.681,"p":false,"h":false},{"t":"わたしの手から救い出せる者はいない。","s":126.972,"e":129.324,"p":false,"h":false},{"t":"わたしが行うとき、だれがこれを元に戻せるだろうか(43:12-13)。","s":129.6,"e":133.283,"p":true,"h":false},{"t":"主は、バビロンに言われます。","s":133.92,"e":135.857,"p":false,"h":false},{"t":"あなたがたのために、バビロンに人を送り、閂をみな外させる。","s":136.152,"e":140.614,"p":false,"h":false},{"t":"カルデア人の叫びは、嘆きに変わる(43:14)。","s":140.904,"e":143.509,"p":false,"h":false},{"t":"「わたしは主、あなたがたの聖なる者、イスラエルの創造者、あなたがたの王」(43:15)。","s":143.784,"e":149.242,"p":false,"h":false},{"t":"海の中に道を、激しい水の中に通り道を設けられた主、戦車と馬、軍勢と勇士を共に引き出された主は、彼らが倒れて、二度と起き上がれず、灯心のように消え去ると言われます(43:16-17)。","s":149.544,"e":163.088,"p":false,"h":false},{"t":"「先の事を思い出すな。","s":163.368,"e":164.917,"p":false,"h":false},{"t":"昔のことに心を留めるな。","s":165.276,"e":167.232,"p":false,"h":false},{"t":"見よ、わたしは新しいことをする。","s":167.544,"e":169.957,"p":false,"h":false},{"t":"今、それが芽生えている。","s":170.244,"e":171.966,"p":false,"h":false},{"t":"あなたがたは、それを知らないのか。","s":172.26,"e":174.553,"p":false,"h":false},{"t":"荒れ野に道を、砂漠に川を設ける」(43:18-19)。","s":174.852,"e":177.454,"p":false,"h":false},{"t":"野の獣も、山犬も、だちょうも、わたしをあがめる。","s":177.732,"e":181.686,"p":false,"h":false},{"t":"わたしが、荒れ野に水を、砂漠に川を与え、わたしの選んだ民に飲ませるからだ。","s":181.98,"e":187.743,"p":false,"h":false},{"t":"わたしが自分のために形造ったこの民は、わたしの誉れを語り告げる(43:20-21)。","s":188.028,"e":192.976,"p":true,"h":false},{"t":"しかし、ヤコブよ、あなたはわたしを呼び求めなかった。","s":193.608,"e":197.215,"p":false,"h":false},{"t":"イスラエルよ、あなたはわたしに疲れた。","s":197.496,"e":199.907,"p":false,"h":false},{"t":"あなたは全焼のいけにえの羊をわたしに持って来ず、いけにえでわたしをあがめなかった。","s":200.196,"e":205.679,"p":false,"h":false},{"t":"わたしは、穀物のささげ物であなたを苦しめず、乳香であなたを疲れさせなかった。","s":205.956,"e":211.95,"p":false,"h":false},{"t":"ところが、あなたは、わたしを罪で苦しめ、咎でわたしを疲れさせた(43:22-24)。","s":212.22,"e":217.315,"p":false,"h":false},{"t":"それでも、「わたし、このわたしは、わたし自身のために、あなたの背きの罪をぬぐい去り、あなたの罪を思い出さない」(43:25)。","s":217.584,"e":225.901,"p":false,"h":false},{"t":"わたしに思い出させよ。","s":226.188,"e":227.637,"p":false,"h":false},{"t":"共に論じ合おう。","s":228.096,"e":229.298,"p":false,"h":false},{"t":"あなたが義とされるために、あなたの言い分を述べよ(43:26)。","s":230.004,"e":233.39,"p":false,"h":false},{"t":"あなたの最初の先祖は罪を犯し、あなたの代言者たちは、わたしに背いた。","s":233.676,"e":239.238,"p":false,"h":false},{"t":"だから、わたしは、聖所の首長たちを汚し、ヤコブを滅びに、イスラエルを嘲りに渡した(43:27-28)。","s":239.544,"e":246.212,"p":true,"h":false},{"t":"各節の解説","s":246.852,"e":248.134,"p":true,"h":false},{"t":"1節の「しかし、今」は、42章の終わりの、さばきの宣告から、一気に慰めへと向きを変える言葉です。","s":248.796,"e":256.681,"p":false,"h":false},{"t":"神は、さばきの後で終わらず、「今」、救いの言葉を語られます。","s":256.968,"e":261.344,"p":false,"h":false},{"t":"「あなたはわたしのもの」という言葉は、救いの根拠が、神の所有と愛にあることを示します。","s":261.648,"e":268.088,"p":true,"h":false},{"t":"2節の、水の中、火の中を過ぎる約束は、苦難がなくなるという約束ではありません。","s":268.74,"e":275.183,"p":false,"h":false},{"t":"苦難の中を通るときに、神がともにおられる、という約束です。","s":275.508,"e":280.163,"p":false,"h":false},{"t":"出エジプトの海や、のちのバビロンの炉の出来事を思い出させます。","s":280.476,"e":284.87,"p":true,"h":false},{"t":"3~4節の「身代金」という言葉は、解釈が難しいところです。","s":285.516,"e":290.666,"p":false,"h":false},{"t":"エジプト、クシュ、セバが、イスラエルの代わりに与えられる、という言い方は、神が歴史を動かして、イスラエルを救い出される、という意味に読まれます。","s":290.952,"e":300.976,"p":false,"h":false},{"t":"ただし、これを、そのまま他の国々の価値が低いという意味に読むべきではありません。","s":301.284,"e":306.957,"p":false,"h":false},{"t":"神の愛の深さを、人間の言葉で、強く語っている表現です。","s":307.26,"e":311.813,"p":true,"h":false},{"t":"10~11節の「あなたがたはわたしの証人」は、この章の中心です。","s":312.48,"e":317.612,"p":false,"h":false},{"t":"「わたしのほかに救い主はいない」という言葉は、イザヤ書の後半を貫く、神の唯一性の宣言です。","s":317.916,"e":325.123,"p":false,"h":false},{"t":"新約聖書の、「救いは他のだれによっても与えられない」という言葉と響き合うと、読まれることがあります。","s":325.404,"e":332.508,"p":true,"h":false},{"t":"16~17節の、海に道を開かれた主という言い方は、出エジプトの出来事を指しています。","s":333.144,"e":339.764,"p":false,"h":false},{"t":"ここから、18節の、「先の事を思い出すな」という言葉が来ます。","s":340.056,"e":344.897,"p":false,"h":false},{"t":"これは、出エジプトを忘れよという意味ではありません。","s":345.168,"e":348.609,"p":false,"h":false},{"t":"新しい救いが、それを超えるほど大きいので、過去の栄光だけに心を留めてはならない、という意味に読まれます。","s":348.912,"e":356.198,"p":true,"h":false},{"t":"19節の「新しいこと」は、バビロンからの帰還を指すとともに、さらに後の、新しい救いも含むと読まれます。","s":356.868,"e":364.643,"p":false,"h":false},{"t":"新約聖書では、「新しい契約」「新しい創造」という言葉との関連が指摘されます。","s":364.932,"e":371.075,"p":false,"h":false},{"t":"ただし、どこまでを含むかは、読み方が分かれます。","s":371.376,"e":375.063,"p":true,"h":false},{"t":"22~24節は、民の不信仰を、はっきり指摘します。","s":375.696,"e":380.262,"p":false,"h":false},{"t":"ここでは、民が、いけにえを持って来なかったことではなく、心が神から離れていたことが問題とされています。","s":380.556,"e":388.083,"p":true,"h":false},{"t":"25節は、この章の頂点です。","s":388.728,"e":391.392,"p":false,"h":false},{"t":"「わたし、このわたしは、わたし自身のために、あなたの背きの罪をぬぐい去る」と語られます。","s":391.68,"e":398.21,"p":false,"h":false},{"t":"赦しの根拠は、民の悔い改めや行いではなく、神ご自身にあります。","s":398.484,"e":403.777,"p":false,"h":false},{"t":"「わたし自身のために」とあるのは、神の名の栄光のために、ということです。","s":404.064,"e":409.124,"p":false,"h":false},{"t":"改革派の神学が、救いは神の恵みだけによる、と語るときに、よく引かれる言葉です。","s":409.428,"e":415.879,"p":true,"h":false},{"t":"27~28節の、「最初の先祖」が誰を指すかは、はっきりしません。","s":416.556,"e":421.904,"p":false,"h":false},{"t":"アダムを指す読み方、ヤコブを指す読み方、民の歴史の初めを広く指す読み方があります。","s":422.208,"e":428.581,"p":false,"h":false},{"t":"どれを取っても、民の罪が、最初から続いてきたことを語っています。","s":428.868,"e":433.687,"p":true,"h":false}]},{"title":"イザヤ書_44章","audio":"doc44_2610231055.mp3","dur":436.8,"segs":[{"t":"イザヤ書44章","s":0,"e":1.636,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"「しかし、今、聞け。","s":4.176,"e":5.818,"p":false,"h":false},{"t":"わたしのしもべヤコブ、わたしが選んだイスラエルよ」と、44章は始まります。","s":6.084,"e":11.525,"p":false,"h":false},{"t":"あなたを造り、母の胎から形造り、あなたを助ける主は言われます。","s":11.808,"e":16.713,"p":false,"h":false},{"t":"「恐れるな、わたしのしもべヤコブ、わたしが選んだエシュルンよ」(44:1-2)。","s":16.992,"e":21.107,"p":false,"h":false},{"t":"主は、渇いた地に水を注ぎ、乾いた地に流れを注がれます。","s":21.42,"e":26.154,"p":false,"h":false},{"t":"そのように、あなたの子孫にわたしの霊を、あなたの末裔にわたしの祝福を注がれます。","s":26.46,"e":32.323,"p":false,"h":false},{"t":"彼らは、草の間に、流れのほとりのしだれ柳のように、芽生えます(44:3-4)。","s":32.616,"e":37.645,"p":false,"h":false},{"t":"ある者は「私は主のもの」と言い、ある者はヤコブの名を名乗り、ある者は手に「主のもの」と記し、イスラエルの名を称えます(44:5)。","s":37.944,"e":46.725,"p":true,"h":false},{"t":"イスラエルの王、その贖い主、万軍の主は言われます。","s":47.376,"e":51.442,"p":false,"h":false},{"t":"「わたしは初めであり、終わりである。","s":51.732,"e":53.924,"p":false,"h":false},{"t":"わたしのほかに神はいない」(44:6)。","s":54.216,"e":55.952,"p":false,"h":false},{"t":"わたしのように呼び、これを告げ、わたしの前に並べる者がいるだろうか。","s":56.232,"e":61.007,"p":false,"h":false},{"t":"あなたがたは、わたしの証人。","s":61.308,"e":63.507,"p":false,"h":false},{"t":"わたしのほかに神がいるだろうか。","s":63.792,"e":65.787,"p":false,"h":false},{"t":"ほかに岩はない。","s":66.096,"e":67.164,"p":false,"h":false},{"t":"わたしは知らない(44:7-8)。","s":68.004,"e":69.129,"p":true,"h":false},{"t":"そこから、偶像を作る者の愚かさが、長く語られます。","s":69.912,"e":74.041,"p":false,"h":false},{"t":"偶像を造る者は、みな空しい。","s":74.34,"e":76.836,"p":false,"h":false},{"t":"彼らが愛するものは、何の役にも立たない。","s":77.112,"e":80.032,"p":false,"h":false},{"t":"その証人たちは、見ることも知ることもできず、恥を見る(44:9)。","s":80.316,"e":84.508,"p":false,"h":false},{"t":"鉄の細工人は炭火で道具を作り、力を込めて形造ります。","s":84.78,"e":89.472,"p":false,"h":false},{"t":"しかし、飢えて力がなくなり、水を飲まなければ疲れます(44:10-12)。","s":89.748,"e":93.894,"p":false,"h":false},{"t":"木工職人は、定規をあてて、鉛筆で線を引き、かんなで削り、コンパスで円を描いて、人の姿に似せ、美しい人の形に造って、神殿に据えます(44:13)。","s":94.176,"e":105.553,"p":true,"h":false},{"t":"彼は、杉を切り、樫の木を選び、森の木の中で成長させます。","s":106.2,"e":111.508,"p":false,"h":false},{"t":"あるいは、月桂樹を植え、雨がそれを育てます。","s":111.816,"e":115.196,"p":false,"h":false},{"t":"それは人のたきぎになります。","s":115.488,"e":117.324,"p":false,"h":false},{"t":"彼はその一部を取って暖をとり、火を起こしてパンを焼きます。","s":117.612,"e":121.686,"p":false,"h":false},{"t":"その同じ木で神を造り、これを拝み、彫像にして、ひれ伏します。","s":121.968,"e":126.873,"p":false,"h":false},{"t":"半分は火に燃やし、その上で肉を焼いて食べ、満腹し、暖まって言います。","s":127.152,"e":132.857,"p":false,"h":false},{"t":"「ああ、暖かい。","s":133.164,"e":134.336,"p":false,"h":false},{"t":"火が見える」。","s":135.072,"e":135.856,"p":false,"h":false},{"t":"その残りで神を造り、これを拝んで、「私を救ってください。","s":136.98,"e":141.301,"p":false,"h":false},{"t":"あなたは私の神だから」と言います(44:14-17)。","s":141.588,"e":144.056,"p":false,"h":false},{"t":"彼らは知らず、悟らず、その目はふさがれて見えず、その心は悟れません。","s":144.324,"e":149.749,"p":false,"h":false},{"t":"心に留めて言う者はいません。","s":150.048,"e":152.024,"p":false,"h":false},{"t":"「その半分を火で燃やし、その炭火でパンを焼き、肉を焼いて食べた。","s":152.316,"e":157.179,"p":false,"h":false},{"t":"その残りで忌むべき物を造るのか。","s":157.464,"e":159.727,"p":false,"h":false},{"t":"木の切れ端にひれ伏すのか」(44:18-19)。","s":160.02,"e":161.758,"p":false,"h":false},{"t":"灰を食らう者は、惑わされた心に迷わされ、自分を救い出せず、「私の右手にあるのは偽りではないか」とも言いません(44:20)。","s":162.036,"e":170.602,"p":true,"h":false},{"t":"主は、ヤコブとイスラエルに言われます。","s":171.252,"e":173.839,"p":false,"h":false},{"t":"「これらのことを心に留めよ。","s":174.132,"e":175.96,"p":false,"h":false},{"t":"あなたはわたしのしもべ。","s":176.256,"e":177.782,"p":false,"h":false},{"t":"わたしがあなたを形造った。","s":178.164,"e":180.029,"p":false,"h":false},{"t":"あなたはわたしのしもべ。","s":180.324,"e":181.85,"p":false,"h":false},{"t":"イスラエルよ、わたしはあなたを忘れない」(44:21)。","s":182.232,"e":184.889,"p":false,"h":false},{"t":"「わたしは、あなたの背きを雲のように、あなたの罪を霧のように、ぬぐい去った。","s":185.148,"e":190.819,"p":false,"h":false},{"t":"わたしに立ち返れ。","s":191.088,"e":192.307,"p":false,"h":false},{"t":"わたしがあなたを贖ったから」(44:22)。","s":192.996,"e":194.706,"p":false,"h":false},{"t":"天よ、喜び歌え。","s":195.012,"e":196.593,"p":false,"h":false},{"t":"主がこれを行われた。","s":196.92,"e":198.45,"p":false,"h":false},{"t":"地の深みよ、叫べ。","s":198.828,"e":200.428,"p":false,"h":false},{"t":"山々よ、森とその中のすべての木よ、喜びの声を上げよ。","s":200.736,"e":205.486,"p":false,"h":false},{"t":"主がヤコブを贖い、イスラエルのうちに、ご自分の栄光を現されるからだ(44:23)。","s":205.776,"e":210.844,"p":true,"h":false},{"t":"あなたを贖い、母の胎からあなたを形造った主は言われます。","s":211.464,"e":215.649,"p":false,"h":false},{"t":"「わたしは主。","s":215.928,"e":216.756,"p":false,"h":false},{"t":"万物を造り、ひとりで天を広げ、地を敷き広げた。","s":217.836,"e":221.779,"p":false,"h":false},{"t":"占いをする者のしるしを破り、占う者を愚かにし、知恵ある者を退け、その知識を愚かにする。","s":222.048,"e":229.436,"p":false,"h":false},{"t":"しもべのことばを成就させ、使者たちの計画を成し遂げさせる」(44:24-26)。","s":229.716,"e":233.925,"p":false,"h":false},{"t":"エルサレムに「人が住む」と言い、ユダの町々に「再建される」と言い、その廃墟を「立て直す」と言う。","s":234.216,"e":241.122,"p":false,"h":false},{"t":"深い淵に「干上がれ」と言い、あなたの川を「干上がらせる」と言う。","s":241.416,"e":246.131,"p":false,"h":false},{"t":"そして、キュロスに言う。","s":246.42,"e":248.017,"p":false,"h":false},{"t":"「彼はわたしの牧者。","s":248.328,"e":249.771,"p":false,"h":false},{"t":"わたしの望むところをことごとく成し遂げる」。","s":250.236,"e":252.849,"p":false,"h":false},{"t":"エルサレムに、「再建される」、神殿に、「あなたの基は据えられる」と言う(44:27-28)。","s":253.152,"e":257.981,"p":true,"h":false},{"t":"各節の解説","s":258.624,"e":259.906,"p":true,"h":false},{"t":"2節の「エシュルン」は、「まっすぐな者」という意味の、イスラエルの詩的な呼び名です。","s":260.568,"e":265.479,"p":false,"h":false},{"t":"申命記にも出てくる名前で、民の本来あるべき姿を思い出させる呼び方です。","s":265.752,"e":271.294,"p":true,"h":false},{"t":"3節の「わたしの霊を注ぐ」は、渇いた地に水を注ぐ比喩で語られています。","s":271.944,"e":277.383,"p":false,"h":false},{"t":"32章15節の、「上から霊が注がれる」という約束と、つながっています。","s":277.668,"e":283.343,"p":false,"h":false},{"t":"民の回復が、神の霊の注ぎによって、子孫の世代まで広がるという望みです。","s":283.608,"e":289.408,"p":false,"h":false},{"t":"新約聖書では、聖霊の注ぎと結びつけられることがあります。","s":289.692,"e":294.16,"p":true,"h":false},{"t":"6節の「初めであり、終わりである」は、神が歴史全体の主であることを表します。","s":294.804,"e":300.802,"p":false,"h":false},{"t":"この言葉は、新約聖書の黙示録で、キリストご自身について語られる言葉と、同じ形をしています。","s":301.104,"e":308.209,"p":false,"h":false},{"t":"このことは、改革派の伝統が、キリストの神性を語るときに、よく指摘するところです。","s":308.484,"e":314.782,"p":true,"h":false},{"t":"9~20節の偶像の描写は、聖書の中でも特に皮肉に満ちた箇所です。","s":315.432,"e":321.009,"p":false,"h":false},{"t":"同じ木の半分は、暖をとる薪や、パンを焼く火になり、残りの半分は、神として拝まれます。","s":321.3,"e":328.743,"p":false,"h":false},{"t":"この愚かさを、筋の通った細かい描写で、静かに指摘しています。","s":329.04,"e":333.778,"p":false,"h":false},{"t":"ここでは、偶像を拝む人を、単に責めているのではなく、その愚かさを、本人が気づくように促しています。","s":334.044,"e":341.695,"p":true,"h":false},{"t":"19節の問いかけは、偶像に頼る人が、自分の行いの矛盾に気づく、という場面を想定しています。","s":342.324,"e":349.982,"p":false,"h":false},{"t":"「私の右手にあるのは偽りではないか」(20節)と言う者は、ほとんどいません。","s":350.28,"e":355.873,"p":false,"h":false},{"t":"偶像礼拝は、心が惑わされた結果であって、知識の不足というより、心の問題です。","s":356.184,"e":362.788,"p":true,"h":false},{"t":"22節の「雲のように、霧のようにぬぐい去った」は、罪が、神によって、跡形もなく消されることを表します。","s":363.42,"e":371.486,"p":false,"h":false},{"t":"「わたしに立ち返れ。","s":371.772,"e":372.992,"p":false,"h":false},{"t":"わたしがあなたを贖ったから」とあるように、赦しが先にあり、立ち返りが、その応答として語られています。","s":373.68,"e":380.909,"p":true,"h":false},{"t":"24~28節は、神の創造と、歴史の支配を結びつけています。","s":381.528,"e":387.228,"p":false,"h":false},{"t":"ここで、キュロスの名が、突然出てきます。","s":387.504,"e":390.456,"p":false,"h":false},{"t":"これは、バビロン捕囚の百五十年ほど前の預言者が、後に現れるペルシアの王の名を、前もって語っている、という理解になります。","s":390.744,"e":400.133,"p":false,"h":false},{"t":"この点は、聖書学者の間で、イザヤ書の成立について、見方が分かれる大きな論点の一つです。","s":400.428,"e":407.555,"p":false,"h":false},{"t":"ここでは、主が歴史を前もって告げられる方であることを、示す箇所として読むのが、改革派の伝統の理解です。","s":407.844,"e":415.649,"p":true,"h":false},{"t":"28節の、キュロスが「わたしの牧者」と呼ばれることは、驚くべきことです。","s":416.268,"e":421.817,"p":false,"h":false},{"t":"異邦人の王が、主の目的を果たすために用いられます。","s":422.136,"e":426.08,"p":false,"h":false},{"t":"5章の、遠くの国を呼ばれた主と、10章の、アッシリアを怒りの杖とされた主と、同じ方が、ここでは、キュロスを牧者として用いられます。","s":426.384,"e":436.147,"p":true,"h":false}]},{"title":"イザヤ書_45章","audio":"doc45_2610231055.mp3","dur":448.5,"segs":[{"t":"イザヤ書45章","s":0,"e":1.512,"p":true,"h":false},{"t":"全体の流れ","s":2.16,"e":3.265,"p":true,"h":false},{"t":"45章は、「主は、油注がれた者キュロスに、こう言われる」と始まります。","s":4.068,"e":9.582,"p":false,"h":false},{"t":"「わたしは彼の右手を握り、その前に国々を打ち倒し、王たちの腰の帯を解き、その前に扉を開き、城門を閉ざさせないようにした」(45:1)。","s":9.864,"e":19.907,"p":false,"h":false},{"t":"「わたしはあなたの前に行き、険しい所を平らにし、青銅の扉を打ち砕き、鉄のかんぬきを切り離す。","s":20.196,"e":27.933,"p":false,"h":false},{"t":"わたしは、暗やみの中の財宝、隠された場所の宝を、あなたに与える。","s":28.224,"e":33.562,"p":false,"h":false},{"t":"それは、あなたが、わたしが主であり、あなたの名を呼ぶ、イスラエルの神であることを知るためだ」(45:2-3)。","s":33.84,"e":40.579,"p":false,"h":false},{"t":"わたしのしもべヤコブのため、わたしが選んだイスラエルのために、わたしはあなたの名を呼び、称号を与えた。","s":40.86,"e":47.949,"p":false,"h":false},{"t":"あなたはわたしを知らなかったが、わたしはあなたに力を帯びさせる(45:4-5)。","s":48.24,"e":52.639,"p":false,"h":false},{"t":"それは、日の昇る所から日の沈む所まで、人々が、わたしのほかに神がいないことを知るためだ。","s":52.92,"e":60.075,"p":false,"h":false},{"t":"「わたしは主。","s":60.372,"e":61.2,"p":false,"h":false},{"t":"ほかにはいない。","s":62.28,"e":63.22,"p":false,"h":false},{"t":"わたしは光を造り、闇を創造し、平和をつくり、わざわいを創造する。","s":64.188,"e":69.682,"p":false,"h":false},{"t":"わたしは主、これらすべてを行う」(45:6-7)。","s":69.984,"e":72.514,"p":false,"h":false},{"t":"天よ、上から義を滴らせよ。","s":72.828,"e":75.081,"p":false,"h":false},{"t":"雲は義を注げ。","s":75.384,"e":76.628,"p":false,"h":false},{"t":"地は開いて救いを実らせ、義も共に芽生えさせよ。","s":77.292,"e":80.947,"p":false,"h":false},{"t":"わたしは主、これを創造した(45:8)。","s":81.252,"e":83.481,"p":true,"h":false},{"t":"しかし、自分を形造った方に争いを挑む者は災いだ。","s":84.132,"e":88.579,"p":false,"h":false},{"t":"粘土が陶器師に、「何を作っているのか」と言い、「あなたの作ったものには、手がない」と言うだろうか。","s":88.884,"e":95.502,"p":false,"h":false},{"t":"父に向かって、「何を生んだのか」、母に、「何を産んだのか」と言う者は災いだ(45:9-10)。","s":95.796,"e":101.165,"p":false,"h":false},{"t":"イスラエルの聖なる方、これを形造った方は、こう言われる。","s":101.448,"e":105.742,"p":false,"h":false},{"t":"「来るべきことについて、わたしに問うのか。","s":106.02,"e":108.712,"p":false,"h":false},{"t":"わたしの子らについて、わたしの手のわざについて、わたしに命じるのか」(45:11)。","s":109.008,"e":113.784,"p":false,"h":false},{"t":"わたしが地を造り、その上に人を創造した。","s":114.084,"e":117.364,"p":false,"h":false},{"t":"わたしの手が天を広げ、その万象に命じた。","s":117.648,"e":121.013,"p":false,"h":false},{"t":"わたしは、義をもって彼を呼び起こし、彼の道をすべてまっすぐにする。","s":121.284,"e":126.347,"p":false,"h":false},{"t":"彼は、わたしの町を建て、わたしの捕らわれ人を、代価も報酬もなしに、解き放つ(45:12-13)。","s":126.648,"e":132.818,"p":true,"h":false},{"t":"エジプトの稼ぎ、クシュの商品、背の高いセバ人は、あなたのもとに来て、あなたのものとなり、鎖につながれて、あなたの後について来る。","s":133.452,"e":143.202,"p":false,"h":false},{"t":"彼らはあなたにひれ伏し、「神は確かにあなたのうちにおられる。","s":143.496,"e":147.544,"p":false,"h":false},{"t":"ほかに神はいない」と言う(45:14)。","s":147.816,"e":149.508,"p":false,"h":false},{"t":"「まことに、あなたはご自身を隠される神。","s":149.832,"e":152.793,"p":false,"h":false},{"t":"イスラエルの神、救い主」(45:15)。","s":153.072,"e":155.018,"p":false,"h":false},{"t":"偶像を作る者はみな、恥を見、共に辱められる。","s":155.304,"e":159.414,"p":false,"h":false},{"t":"しかし、イスラエルは、主によって、永遠の救いで救われ、とこしえに恥を受けず、辱められることもない(45:16-17)。","s":159.696,"e":167.226,"p":true,"h":false},{"t":"天を創造された方、すなわち神である主は、こう言われる。","s":167.868,"e":172.151,"p":false,"h":false},{"t":"「わたしは主。","s":172.44,"e":173.268,"p":false,"h":false},{"t":"ほかにはいない。","s":174.348,"e":175.288,"p":false,"h":false},{"t":"わたしは、隠れた所、暗やみの地で語らなかった。","s":176.256,"e":180.036,"p":false,"h":false},{"t":"わたしはヤコブの子孫に、『むなしく、わたしを求めよ』とは言わなかった。","s":180.324,"e":185.245,"p":false,"h":false},{"t":"わたしは主、義を語り、正しいことを告げる」(45:18-19)。","s":185.544,"e":188.96,"p":false,"h":false},{"t":"「集まって来い。","s":189.252,"e":190.099,"p":false,"h":false},{"t":"国々から逃れて来た者たちよ。","s":191.16,"e":193.255,"p":false,"h":false},{"t":"木の偶像をかついで、救えない神に祈る者は、何も知らない」(45:20)。","s":193.572,"e":198.054,"p":false,"h":false},{"t":"「告げよ、共に論じよ。","s":198.324,"e":200.115,"p":false,"h":false},{"t":"だれが、昔からこれを聞かせ、前から告げたのか。","s":200.412,"e":204.131,"p":false,"h":false},{"t":"わたしは主ではなかったか。","s":204.408,"e":206.119,"p":false,"h":false},{"t":"わたしのほかに神はいない。","s":206.424,"e":208.16,"p":false,"h":false},{"t":"義なる神、救い主。","s":208.44,"e":210.165,"p":false,"h":false},{"t":"わたしのほかにはいない」(45:21)。","s":210.456,"e":211.901,"p":false,"h":false},{"t":"そして、この章の、大きな呼びかけが来ます。","s":212.364,"e":215.313,"p":false,"h":false},{"t":"「地の果てのすべての者よ。","s":215.604,"e":217.226,"p":false,"h":false},{"t":"わたしを仰ぎ見て、救われよ。","s":217.548,"e":219.695,"p":false,"h":false},{"t":"わたしは神。","s":219.996,"e":220.899,"p":false,"h":false},{"t":"ほかにはいない」(45:22)。","s":221.904,"e":222.844,"p":false,"h":false},{"t":"「わたしは自分にかけて誓う。","s":223.812,"e":225.665,"p":false,"h":false},{"t":"わたしの口から義が出て、決して取り消されない。","s":225.936,"e":229.128,"p":false,"h":false},{"t":"すべてのひざは、わたしの前にかがみ、すべての舌は、誓う」(45:23)。","s":229.428,"e":233.973,"p":false,"h":false},{"t":"「ただ主にだけ、義と力がある」と、人々は言う。","s":234.252,"e":237.793,"p":false,"h":false},{"t":"主に対して怒っていた者たちはみな、主のもとに来て、恥を見る。","s":238.104,"e":242.608,"p":false,"h":false},{"t":"しかし、イスラエルのすべての子孫は、主によって義とされ、誇る(45:24-25)。","s":242.892,"e":247.542,"p":true,"h":false},{"t":"各節の解説","s":248.184,"e":249.466,"p":true,"h":false},{"t":"1節の、キュロスが「油注がれた者」、つまり、メシアと呼ばれるのは、聖書の中で、きわめて珍しいことです。","s":250.128,"e":258.178,"p":false,"h":false},{"t":"ここでは、「メシア」という言葉が、王として、神に任命された者を指す、広い意味で使われています。","s":258.48,"e":265.03,"p":false,"h":false},{"t":"キュロスが、終わりの時に来られる、救い主キリストと同じ存在だという意味ではありません。","s":265.356,"e":271.211,"p":false,"h":false},{"t":"ただし、異邦の王を、主の油注がれた者と呼ぶほど、主が歴史を支配しておられる、ということが示されています。","s":271.512,"e":279.356,"p":true,"h":false},{"t":"4~5節の、「あなたはわたしを知らなかったが」は、キュロスが、主を信じていたわけではないことを示します。","s":280.008,"e":287.201,"p":false,"h":false},{"t":"主は、人が知らないところでも、ご自分の計画のために、人を用いられます。","s":287.496,"e":293.088,"p":false,"h":false},{"t":"このことは、神の主権の大きさを教えます。","s":293.364,"e":296.378,"p":true,"h":false},{"t":"7節の「平和をつくり、わざわいを創造する」は、解釈の難しい言葉です。","s":297,"e":302.651,"p":false,"h":false},{"t":"「わざわい」は、道徳的な悪ではなく、さばきとして来る災いや苦難を指すと読まれます。","s":302.94,"e":308.941,"p":false,"h":false},{"t":"神が、悪を造られたという意味ではありません。","s":309.24,"e":312.29,"p":false,"h":false},{"t":"光と闇、平和と災いという対比は、神が、すべてのものの主であり、ペルシアの二元論のように、善悪の二つの神がいるのではない、ということを語っています。","s":312.588,"e":324.43,"p":true,"h":false},{"t":"9~10節の、粘土と陶器師の比喩は、29章16節でも出てきました。","s":325.08,"e":330.968,"p":false,"h":false},{"t":"民が、神のご計画に文句を言うことを戒める言葉です。","s":331.272,"e":335.523,"p":false,"h":false},{"t":"この比喩は、新約聖書のローマ人への手紙9章でも、神の主権を語るために引かれています。","s":335.808,"e":342.45,"p":false,"h":false},{"t":"改革派の神学が、神の主権を語るときに、特に重く受け取る箇所の一つです。","s":342.72,"e":348.591,"p":true,"h":false},{"t":"13節の「彼」は、キュロスを指すと読まれます。","s":349.236,"e":352.517,"p":false,"h":false},{"t":"「代価も報酬もなしに」捕らわれ人を解き放つという言葉は、キュロスが実際に、捕囚の民を、帰還させたことと結びついて読まれます。","s":352.8,"e":362.118,"p":false,"h":false},{"t":"ここでも、神が、異邦の王を用いて、ご自分の民を救い出されるという、大きなご計画が語られます。","s":362.412,"e":369.911,"p":true,"h":false},{"t":"15節の「ご自身を隠される神」は、神が、自分の民からも、時に隠れておられるように思える、という経験を表します。","s":370.548,"e":379.799,"p":false,"h":false},{"t":"しかし、同時に、「救い主」であることも、語られています。","s":380.088,"e":384.38,"p":false,"h":false},{"t":"神の隠れが、救いの否定ではないことを、ここで教えられます。","s":384.66,"e":389.005,"p":true,"h":false},{"t":"22節の「地の果てのすべての者よ。","s":389.664,"e":392.333,"p":false,"h":false},{"t":"わたしを仰ぎ見て、救われよ」は、神の救いの招きが、イスラエルだけでなく、すべての人に向けられていることを示す、有名な言葉です。","s":392.616,"e":402.264,"p":false,"h":false},{"t":"ここには、救いが、人の行いではなく、神を仰ぎ見ることによって与えられる、という福音の姿が、すでに現れています。","s":402.552,"e":411.554,"p":true,"h":false},{"t":"23節の「すべてのひざは、わたしの前にかがみ」は、新約聖書で、パウロが、キリストの栄光を語るとき、この言葉を引いています。","s":412.2,"e":421.955,"p":false,"h":false},{"t":"主ご自身が語られた言葉が、キリストについても当てはまる、というのは、改革派の伝統が、キリストの神性を語るときに、よく指摘するところです。","s":422.244,"e":432.687,"p":true,"h":false},{"t":"25節の「主によって義とされる」は、義が、人の行いではなく、主から与えられることを語ります。","s":433.332,"e":440.609,"p":false,"h":false},{"t":"この「義とされる」という言葉は、新約聖書の、信仰による義認の教えと、深くつながっています。","s":440.892,"e":447.897,"p":true,"h":false}]},{"title":"イザヤ書_46章","audio":"doc46_2610231055.mp3","dur":235.4,"segs":[{"t":"イザヤ書46章","s":0,"e":1.564,"p":true,"h":false},{"t":"全体の流れ","s":2.232,"e":3.337,"p":true,"h":false},{"t":"ベルは膝をつき、ネボはかがみます。","s":4.14,"e":6.716,"p":false,"h":false},{"t":"その偶像は、獣と家畜に載せられ、あなたがたが担いだものは、疲れた家畜の重荷となります。","s":6.984,"e":13.977,"p":false,"h":false},{"t":"彼らはともにかがみ、膝をつき、重荷を救い出すこともできず、自分自身も捕らわれの身となって去って行きます(46:1-2)。","s":14.256,"e":21.811,"p":true,"h":false},{"t":"そこで、主はヤコブの家に語られます。","s":22.428,"e":25.158,"p":false,"h":false},{"t":"「胎内にいたときから担がれ、母の胎を出たときから運ばれてきた者たちよ、聞け。","s":25.452,"e":31.175,"p":false,"h":false},{"t":"あなたがたが年老いるまで、わたしは変わらない。","s":31.464,"e":34.653,"p":false,"h":false},{"t":"白髪になるまで、わたしが背負う。","s":34.92,"e":37.118,"p":false,"h":false},{"t":"わたしが造ったのだから、わたしが担い、背負い、救い出す」(46:3-4)。","s":37.404,"e":41.472,"p":false,"h":false},{"t":"バビロンの神々は人に担がれる重荷ですが、主はご自分の民を担われる方です。","s":41.76,"e":47.486,"p":true,"h":false},{"t":"主は問われます。","s":48.132,"e":49.183,"p":false,"h":false},{"t":"「あなたがたは、わたしをだれになぞらえ、だれと比べて、似ているというのか」(46:5)。","s":50.04,"e":55.147,"p":false,"h":false},{"t":"金を袋から惜しげなく出し、銀をはかりで量る者たちは、金細工人を雇って神を造らせ、これにひれ伏して拝みます。","s":55.44,"e":64.008,"p":false,"h":false},{"t":"彼らはそれを肩に担ぎ、運び、置くと、そこに立ったまま動けません。","s":64.296,"e":69.261,"p":false,"h":false},{"t":"叫んでも答えず、苦しみから救うこともできません(46:6-7)。","s":69.588,"e":73.19,"p":true,"h":false},{"t":"だから、思い出せ。","s":73.836,"e":75.091,"p":false,"h":false},{"t":"背く者たちよ、心に留めよ。","s":75.744,"e":78.147,"p":false,"h":false},{"t":"昔からのことを思い出せ。","s":78.444,"e":80.175,"p":false,"h":false},{"t":"わたしは神、ほかにはいない。","s":80.46,"e":82.504,"p":false,"h":false},{"t":"わたしのような者はいない。","s":82.764,"e":84.379,"p":false,"h":false},{"t":"わたしは終わりのことを初めから告げ、まだ成されていないことを昔から告げる。","s":84.672,"e":89.751,"p":false,"h":false},{"t":"「わたしのはかりごとは成り、わたしの望むことをすべて成し遂げる」(46:8-10)。","s":90.036,"e":94.094,"p":false,"h":false},{"t":"東から猛禽を呼び、遠い国から、わたしのはかりごとを行う人を呼ぶ。","s":94.392,"e":99.645,"p":false,"h":false},{"t":"わたしが語り、必ず実現させる(46:11)。","s":99.936,"e":102.644,"p":true,"h":false},{"t":"最後に、頑固な者たち、義から遠い者たちに、「わたしの義は近い。","s":103.284,"e":108.419,"p":false,"h":false},{"t":"遠くはない。","s":108.72,"e":109.499,"p":false,"h":false},{"t":"わたしの救いは遅れない。","s":110.628,"e":112.193,"p":false,"h":false},{"t":"わたしはシオンに救いを置き、イスラエルにわたしの栄光を与える」と言われます(46:12-13)。","s":112.536,"e":117.688,"p":true,"h":false},{"t":"各節の解説","s":118.332,"e":119.614,"p":true,"h":false},{"t":"1節の「ベル」と「ネボ」は、バビロンの主要な神々の名です。","s":120.276,"e":124.346,"p":false,"h":false},{"t":"「ベル」は「主」という意味で、マルドゥクの別名とされ、「ネボ」はその子とされる神です。","s":124.632,"e":129.87,"p":false,"h":false},{"t":"町の最高の神々が、荷車に積まれて運び出される姿が描かれています。","s":130.176,"e":135.568,"p":true,"h":false},{"t":"1~2節の、偶像が「重荷」となる描写は、この章の中心的な対比の一つです。","s":136.188,"e":142.461,"p":false,"h":false},{"t":"バビロンの人々は、神々を担いで運びます。","s":142.74,"e":146.128,"p":false,"h":false},{"t":"しかし、イスラエルの神は、ご自分の民を担われます。","s":146.412,"e":150.479,"p":false,"h":false},{"t":"人が神に仕えるために背負うのが偶像で、神が人を背負ってくださるのが主、という違いです。","s":150.768,"e":157.111,"p":true,"h":false},{"t":"3~4節の「胎内にいたときから担がれ」は、主が、イスラエルの誕生から老年に至るまで、変わらず支えてこられたことを語ります。","s":157.752,"e":167.152,"p":false,"h":false},{"t":"「わたしは変わらない」という言葉は、主の誠実さを、静かに語っています。","s":167.436,"e":172.554,"p":true,"h":false},{"t":"6~7節で、偶像が自分で動けず、運ばれ、置かれた場所から動かないという皮肉は、44章の、偶像を作る者への描写と同じ流れにあります。","s":173.196,"e":184.325,"p":false,"h":false},{"t":"ここでは、さらに短く、鋭く語られています。","s":184.608,"e":188.209,"p":true,"h":false},{"t":"10節の「終わりのことを初めから告げる」は、主が歴史を前もって告げられる方だ、という、後半の中心主題の一つです。","s":188.856,"e":197.382,"p":false,"h":false},{"t":"偶像は将来を告げることができません。","s":197.676,"e":200.263,"p":true,"h":false},{"t":"11節の「東から猛禽を呼び」は、キュロスを指すと読まれます。","s":200.916,"e":205.42,"p":false,"h":false},{"t":"44章28節や45章1節と、同じ流れにあります。","s":205.704,"e":210.329,"p":false,"h":false},{"t":"ここでも、主が異邦の王を、ご自身の目的のために、遠くから呼ばれる、という点が大切です。","s":210.6,"e":217.594,"p":true,"h":false},{"t":"12~13節の「わたしの義は近い」は、神の救いが、遅れることなく、近づいているという約束です。","s":218.232,"e":225.821,"p":false,"h":false},{"t":"ここでの「義」は、「救い」とほぼ同じ意味で使われています。","s":226.116,"e":229.806,"p":false,"h":false},{"t":"神が、約束を守って、救いを実現してくださる、という意味です。","s":230.112,"e":234.773,"p":true,"h":false}]},{"title":"イザヤ書_47章","audio":"doc47_2610231055.mp3","dur":303,"segs":[{"t":"イザヤ書47章","s":0,"e":1.664,"p":true,"h":false},{"t":"全体の流れ","s":2.304,"e":3.409,"p":true,"h":false},{"t":"47章は、「下って、ちりの上に座れ、処女バビロンの娘よ」という命令で始まります。","s":4.212,"e":10.966,"p":false,"h":false},{"t":"王座はなく、地に座り、もう「優しく、上品な者」とは呼ばれません。","s":11.268,"e":16.598,"p":false,"h":false},{"t":"石臼を取って粉をひき、ベールを脱ぎ、すそをからげ、すねを出して、川を渡るのです(47:1-2)。","s":16.92,"e":23.248,"p":false,"h":false},{"t":"あなたの裸はあらわになり、あなたの恥は見られます。","s":23.544,"e":27.125,"p":false,"h":false},{"t":"わたしは報復し、人をかばいません(47:3)。","s":27.432,"e":30.028,"p":false,"h":false},{"t":"「私たちを贖う方、その名は万軍の主、イスラエルの聖なる方」(47:4)。","s":30.312,"e":35.231,"p":true,"h":false},{"t":"「カルデア人の娘よ、黙って座り、闇に入れ。","s":35.856,"e":39.262,"p":false,"h":false},{"t":"もう、あなたは諸王国の女王とは呼ばれない」(47:5)。","s":39.564,"e":42.631,"p":false,"h":false},{"t":"主は、わたしの民に怒り、わたしの嗣業を汚し、あなたの手に渡した。","s":42.912,"e":48.143,"p":false,"h":false},{"t":"ところが、あなたは彼らをあわれまず、老人にさえ重いくびきを課した(47:6)。","s":48.42,"e":53.361,"p":false,"h":false},{"t":"あなたは言った。","s":53.64,"e":54.594,"p":false,"h":false},{"t":"「私はとこしえに女王だ」と。","s":55.548,"e":57.492,"p":false,"h":false},{"t":"これらのことを心に留めず、その終わりを考えもしなかった(47:7)。","s":57.78,"e":61.723,"p":true,"h":false},{"t":"だから、今、これを聞け。","s":62.352,"e":64.259,"p":false,"h":false},{"t":"快楽にふけり、安らかに住み、心の中で「私だけがいる。","s":64.548,"e":69.032,"p":false,"h":false},{"t":"私のほかにはだれもいない。","s":69.336,"e":71.151,"p":false,"h":false},{"t":"私はやもめにならず、子を失うこともない」と言う者よ(47:8)。","s":71.424,"e":75.51,"p":false,"h":false},{"t":"しかし、一瞬のうちに、一日のうちに、子を失うことと、やもめになることの二つが、突然、あなたに臨みます。","s":75.816,"e":84.021,"p":false,"h":false},{"t":"あなたの多くの呪術にもかかわらず、あなたの魔法の力にもかかわらず、それは完全にあなたに降りかかります(47:9)。","s":84.312,"e":91.855,"p":true,"h":false},{"t":"あなたは、自分の悪に安心して言った。","s":92.484,"e":95.291,"p":false,"h":false},{"t":"「だれも私を見ていない」。","s":95.58,"e":97.147,"p":false,"h":false},{"t":"あなたの知恵と知識が、あなたを惑わせ、あなたは心の中で言った。","s":97.488,"e":102.37,"p":false,"h":false},{"t":"「私だけがいる。","s":102.672,"e":103.721,"p":false,"h":false},{"t":"私のほかにはだれもいない」(47:10)。","s":104.58,"e":106.395,"p":false,"h":false},{"t":"しかし、災いがあなたに臨みます。","s":106.668,"e":109.213,"p":false,"h":false},{"t":"あなたはそれを払いのける術を知りません。","s":109.512,"e":112.228,"p":false,"h":false},{"t":"破滅があなたに落ち、あなたの知らない滅びが、突然、あなたを襲います(47:11)。","s":112.536,"e":117.679,"p":true,"h":false},{"t":"「さあ、あなたの魔法と、あなたが若いときから労してきた多くの呪術を持って立て。","s":118.332,"e":123.813,"p":false,"h":false},{"t":"あなたは、そこから益を得られるかもしれない。","s":124.092,"e":127.186,"p":false,"h":false},{"t":"あなたは、人々を恐れさせるかもしれない」(47:12)。","s":127.476,"e":130.432,"p":false,"h":false},{"t":"あなたは、多くの助言に疲れている。","s":130.716,"e":133.25,"p":false,"h":false},{"t":"天を観測する者、星を見る者、新月ごとに、あなたに降りかかることを告げる者に、立ち上がって救わせてみよ(47:13)。","s":133.56,"e":141.52,"p":false,"h":false},{"t":"見よ、彼らは、わらのようになり、火が彼らを焼き尽くす。","s":141.84,"e":146.074,"p":false,"h":false},{"t":"自分の命を炎の力から救い出すこともできない。","s":146.376,"e":149.793,"p":false,"h":false},{"t":"それは暖を取る炭火でも、前に座る火でもない(47:14)。","s":150.084,"e":153.482,"p":false,"h":false},{"t":"あなたが労して、若いときから商いをしてきた者たちは、おのおの自分の道へさまよい去り、あなたを救う者はいません(47:15)。","s":153.756,"e":161.836,"p":true,"h":false},{"t":"各節の解説","s":162.504,"e":163.786,"p":true,"h":false},{"t":"1節の「処女バビロン」は、バビロンが、これまで征服されたことのない、強く気高い国と思われていたことを表します。","s":164.448,"e":172.774,"p":false,"h":false},{"t":"そのバビロンが、ちりの上に座らされるという落差が、この章の中心です。","s":173.052,"e":178.398,"p":true,"h":false},{"t":"2節の、石臼を取って粉をひく姿は、女王から奴隷の身分への転落を表します。","s":179.028,"e":185.209,"p":false,"h":false},{"t":"かつて他の民を奴隷としたバビロンが、自分が同じ立場に置かれます。","s":185.508,"e":190.301,"p":true,"h":false},{"t":"3節の「報復し、人をかばわない」という言葉は、解釈が難しいところです。","s":190.944,"e":196.755,"p":false,"h":false},{"t":"ここでの報復は、人間の私的な恨みとは違い、主が、ご自分の民を苦しめた国を、正しくさばかれる、という意味です。","s":197.028,"e":205.386,"p":true,"h":false},{"t":"6節は、バビロンが罪に問われる理由を語ります。","s":206.028,"e":209.616,"p":false,"h":false},{"t":"主が、ご自分の民を、バビロンの手に渡されたのは事実です。","s":209.916,"e":214.454,"p":false,"h":false},{"t":"しかし、バビロンは、神の道具として用いられたことを自覚せず、あわれみを示さず、老人にまで重い労役を課しました。","s":214.74,"e":223.559,"p":false,"h":false},{"t":"ここでも、10章のアッシリアのように、神の主権と人間の責任の両方が、語られています。","s":223.848,"e":230.536,"p":true,"h":false},{"t":"8~10節の「私だけがいる。","s":231.192,"e":233.388,"p":false,"h":false},{"t":"私のほかにはだれもいない」という言葉は、神だけが言える言葉を、バビロンが自分のものとして語っています。","s":233.676,"e":240.856,"p":false,"h":false},{"t":"これは、人が神の座を奪おうとする、根源的な高ぶりを示します。","s":241.128,"e":246.228,"p":false,"h":false},{"t":"14章13~14節の、バビロンの王の言葉とも、響き合います。","s":246.528,"e":251.867,"p":true,"h":false},{"t":"9節の「子を失うことと、やもめになることの二つが、突然来る」という言葉は、バビロンが、一瞬のうちに、すべてを失うことを語ります。","s":252.504,"e":262.546,"p":false,"h":false},{"t":"ここに、のちに黙示録18章で語られる、大いなるバビロンの滅びの描写との、つながりが指摘されます。","s":262.836,"e":270.306,"p":true,"h":false},{"t":"12~13節の魔法と占星術は、バビロンが誇った知恵でした。","s":270.936,"e":275.911,"p":false,"h":false},{"t":"この知恵が、滅びの前では何の役にも立たないという皮肉は、44章25節の、占い師を愚かにされる主の言葉と、つながっています。","s":276.192,"e":286.148,"p":true,"h":false},{"t":"14節の「炭火でも、前に座る火でもない」は、その火が、暖をとるような穏やかな火ではなく、焼き尽くす火である、という意味です。","s":286.776,"e":295.797,"p":false,"h":false},{"t":"暖をとる火の描写は、44章の偶像の描写と、対比されて読まれることがあります。","s":296.1,"e":302.404,"p":true,"h":false}]},{"title":"イザヤ書_48章","audio":"doc48_2610231055.mp3","dur":398.3,"segs":[{"t":"イザヤ書48章","s":0,"e":1.575,"p":true,"h":false},{"t":"全体の流れ","s":2.232,"e":3.337,"p":true,"h":false},{"t":"48章は、ヤコブの家への呼びかけで始まります。","s":4.14,"e":7.93,"p":false,"h":false},{"t":"「これを聞け。","s":8.208,"e":8.939,"p":false,"h":false},{"t":"イスラエルの名で呼ばれ、ユダの水源から出た者たちよ。","s":10.116,"e":13.791,"p":false,"h":false},{"t":"主の名によって誓い、イスラエルの神を告白するが、真実もなく、義もない者たちよ」(48:1)。","s":14.112,"e":20.448,"p":false,"h":false},{"t":"彼らは「聖なる都の者」と名乗り、主に寄りかかるのに、実際には、その心は主から離れています(48:2)。","s":20.736,"e":28.28,"p":true,"h":false},{"t":"主は言われます。","s":28.908,"e":29.947,"p":false,"h":false},{"t":"「先の事は、昔から告げてきた。","s":30.816,"e":33.255,"p":false,"h":false},{"t":"わたしの口から出て、わたしが聞かせた。","s":33.552,"e":36.157,"p":false,"h":false},{"t":"突然、わたしはそれを行い、それは実現した」(48:3)。","s":36.432,"e":40.048,"p":false,"h":false},{"t":"「わたしは、あなたが頑固で、首は鉄の筋、額は青銅であることを知っていたから、あなたに前もって告げ、事が起こる前にあなたに聞かせた。","s":40.32,"e":50.383,"p":false,"h":false},{"t":"それは、あなたが、『私の偶像が行った。","s":50.688,"e":53.768,"p":false,"h":false},{"t":"私の彫像や鋳像が命じたのだ』と言わないようにするためだった」(48:4-5)。","s":54.072,"e":58.579,"p":true,"h":false},{"t":"今、主は、新しいことを告げられます。","s":59.22,"e":62.26,"p":false,"h":false},{"t":"「あなたは聞いた。","s":62.568,"e":63.611,"p":false,"h":false},{"t":"それをみな見よ。","s":64.476,"e":65.617,"p":false,"h":false},{"t":"あなたがたは告げないのか。","s":66.384,"e":68.022,"p":false,"h":false},{"t":"今から、新しいこと、あなたが知らなかった隠されたことを、わたしは聞かせる。","s":68.328,"e":73.707,"p":false,"h":false},{"t":"それは今、造られたもので、昔からあったものではない。","s":73.98,"e":77.854,"p":false,"h":false},{"t":"それを、あなたは今日まで聞いていない」(48:6-7)。","s":78.12,"e":80.46,"p":false,"h":false},{"t":"主は、あなたが裏切る者であり、母の胎にあるときから背く者と呼ばれてきたことを知っておられました(48:8)。","s":80.748,"e":87.678,"p":false,"h":false},{"t":"それでも、主は、ご自分の名のために怒りを抑え、ご自分の誉れのために、あなたを断ち切られませんでした(48:9)。","s":87.948,"e":95.379,"p":true,"h":false},{"t":"「見よ、わたしはあなたを精錬したが、銀のようにではなく、苦しみの炉で、あなたを試みた。","s":96.012,"e":102.408,"p":false,"h":false},{"t":"わたしは、わたし自身のために、これを行う。","s":102.708,"e":105.934,"p":false,"h":false},{"t":"どうして、わたしの名が汚されてよいだろうか。","s":106.236,"e":109.161,"p":false,"h":false},{"t":"わたしは、わたしの栄光を、ほかの者に与えない」(48:10-11)。","s":109.44,"e":112.894,"p":true,"h":false},{"t":"「わたしに聞け、ヤコブよ、わたしが呼んだイスラエルよ。","s":113.544,"e":117.071,"p":false,"h":false},{"t":"わたしはそれ。","s":117.36,"e":118.296,"p":false,"h":false},{"t":"わたしは初めであり、終わりでもある」(48:12)。","s":119.268,"e":121.666,"p":false,"h":false},{"t":"わたしの手が地の基を据え、わたしの右の手が天を広げた。","s":121.932,"e":126.165,"p":false,"h":false},{"t":"わたしがそれらを呼ぶと、それらはそろって立ちます(48:13)。","s":126.468,"e":129.703,"p":false,"h":false},{"t":"みな集まって聞け。","s":129.996,"e":131.206,"p":false,"h":false},{"t":"偶像のうち、だれがこれらを告げたのか。","s":131.904,"e":134.667,"p":false,"h":false},{"t":"主に愛された者は、バビロンに対して主の望みを行い、その腕はカルデア人に向かう(48:14)。","s":134.964,"e":141.039,"p":false,"h":false},{"t":"「わたし、このわたしが語り、彼を呼び、彼を連れて来た。","s":141.336,"e":145.668,"p":false,"h":false},{"t":"彼の道は栄える」(48:15)。","s":145.944,"e":147.241,"p":false,"h":false},{"t":"「わたしに近づいて、これを聞け。","s":147.852,"e":150.025,"p":false,"h":false},{"t":"わたしは初めから、隠れて語らなかった。","s":150.3,"e":153.124,"p":false,"h":false},{"t":"それが起こったときから、わたしはそこにいた」。","s":153.432,"e":156.248,"p":false,"h":false},{"t":"そして今、神である主が、わたしとその霊を遣わされた(48:16)。","s":156.528,"e":160.659,"p":true,"h":false},{"t":"あなたを贖う方、イスラエルの聖なる方、主は言われます。","s":161.28,"e":165.345,"p":false,"h":false},{"t":"「わたしは主、あなたの神、あなたに益になることを教え、あなたの歩むべき道に導く者」(48:17)。","s":165.636,"e":172.354,"p":false,"h":false},{"t":"「ああ、あなたがわたしの命令に耳を傾けていたなら、あなたの平和は川のように、あなたの義は海の波のようになっていた。","s":172.656,"e":181.139,"p":false,"h":false},{"t":"あなたの子孫は砂のように、あなたの胎の子孫は、その粒のようになっていた。","s":181.44,"e":186.812,"p":false,"h":false},{"t":"その名は、わたしの前から断たれることも、滅ぼされることもなかった」(48:18-19)。","s":187.092,"e":191.735,"p":true,"h":false},{"t":"そして、「バビロンから出て行け。","s":192.384,"e":194.402,"p":false,"h":false},{"t":"カルデア人から逃げ去れ。","s":194.688,"e":196.174,"p":false,"h":false},{"t":"喜びの声をもって告げ、これを知らせよ。","s":196.596,"e":199.532,"p":false,"h":false},{"t":"地の果てまで、これを響かせよ。","s":199.836,"e":202.085,"p":false,"h":false},{"t":"『主はそのしもべヤコブを贖われた』と言え」(48:20)。","s":202.392,"e":205.127,"p":false,"h":false},{"t":"主が彼らを荒れ野に導かれたとき、彼らは渇きませんでした。","s":205.416,"e":209.734,"p":false,"h":false},{"t":"主は岩から彼らのために水を流れ出させ、岩を裂いて、水をほとばしらせました(48:21)。","s":210.024,"e":215.8,"p":false,"h":false},{"t":"「悪者には平安がない」と、主は言われます(48:22)。","s":216.072,"e":218.999,"p":true,"h":false},{"t":"各節の解説","s":219.636,"e":220.918,"p":true,"h":false},{"t":"1~2節の、「イスラエルの名で呼ばれ、主の名によって誓うが、真実もなく、義もない」という言葉は、名前だけの信仰を指摘しています。","s":221.58,"e":231.437,"p":false,"h":false},{"t":"1章や29章で語られた、口先だけの礼拝への批判が、ここでも繰り返されています。","s":231.732,"e":238.274,"p":true,"h":false},{"t":"4節の「首は鉄の筋、額は青銅」は、頑固さを、強い言葉で描いています。","s":238.896,"e":244.965,"p":false,"h":false},{"t":"主が前もって告げられるのは、民が、偶像のお陰だと言わないようにするためです。","s":245.268,"e":250.893,"p":false,"h":false},{"t":"預言が、神の唯一性の証拠となるという、後半の主題が、ここにも出ています。","s":251.172,"e":257.332,"p":true,"h":false},{"t":"9~11節は、救いの根拠が、民の功績ではなく、主ご自身の名の栄光にあることを、はっきり語ります。","s":257.976,"e":266.131,"p":false,"h":false},{"t":"「わたしの名のために」「わたし自身のために」という言葉が繰り返されます。","s":266.4,"e":271.076,"p":false,"h":false},{"t":"改革派の神学が、救いは神の栄光のために与えられる、と語るときに、よく引かれる箇所です。","s":271.368,"e":278.407,"p":true,"h":false},{"t":"10節の「銀のようにではなく」は、解釈が分かれます。","s":279.036,"e":282.93,"p":false,"h":false},{"t":"銀のように、不純物を完全に除くほどには精錬しなかった、という読み方もあれば、銀の代価も得られないほど、苦しみの炉で試みた、という読み方もあります。","s":283.212,"e":294.682,"p":false,"h":false},{"t":"どちらにしても、苦難が、民を清めるための試みだった、という意味に変わりはありません。","s":294.984,"e":301.225,"p":true,"h":false},{"t":"14~15節の、「主に愛された者」は、キュロスを指すと読まれます。","s":301.896,"e":306.754,"p":false,"h":false},{"t":"ここでも、バビロンに対して、主の望みを行う人として語られています。","s":307.044,"e":312.009,"p":true,"h":false},{"t":"16節の「わたしとその霊を遣わされた」は、解釈が分かれる箇所です。","s":312.66,"e":317.637,"p":false,"h":false},{"t":"語っているのは、預言者自身なのか、しもべなのか、主ご自身なのかが、はっきりしません。","s":317.952,"e":324.377,"p":false,"h":false},{"t":"「わたし」と「その霊」が、ともに遣わされるという表現は、のちのキリスト教の教会が、三位一体を考える際の、手がかりの一つとして見てきました。","s":324.684,"e":335.009,"p":false,"h":false},{"t":"ただし、この箇所が、そのまま三位一体を教えているとまでは、断言できません。","s":335.304,"e":341.115,"p":false,"h":false},{"t":"読み方が分かれる、とお伝えするのが安全です。","s":341.424,"e":344.698,"p":true,"h":false},{"t":"18~19節の「ああ、あなたが耳を傾けていたなら」は、主の、嘆きにも近い言葉です。","s":345.348,"e":352.365,"p":false,"h":false},{"t":"民が聞き従っていたら、どれほど豊かな祝福が与えられたかを、主ご自身が、惜しんでおられます。","s":352.656,"e":359.124,"p":false,"h":false},{"t":"これは、民の失敗が、神の側の不足ではなく、民の側の不従順から来たことを、はっきりさせます。","s":359.424,"e":366.75,"p":true,"h":false},{"t":"20~21節の、バビロンから出て行けという呼びかけは、捕囚からの帰還を、第二の出エジプトとして語っています。","s":367.38,"e":375.572,"p":false,"h":false},{"t":"岩から水を出された出来事を思い起こさせ、主が、かつてのように、民を養われることを約束します。","s":375.84,"e":383.183,"p":true,"h":false},{"t":"22節の「悪者には平安がない」は、57章21節でも、ほとんど同じ形で繰り返されます。","s":383.832,"e":391.173,"p":false,"h":false},{"t":"この言葉は、後半の各区分の終わりに置かれる、区切りの言葉として読まれることがあります。","s":391.464,"e":397.662,"p":true,"h":false}]},{"title":"イザヤ書_49章","audio":"doc49_2610231055.mp3","dur":525.9,"segs":[{"t":"イザヤ書49章","s":0,"e":1.648,"p":true,"h":false},{"t":"全体の流れ","s":2.304,"e":3.409,"p":true,"h":false},{"t":"49章は、これまでとは違い、しもべ自身が語り始めます。","s":4.212,"e":8.997,"p":false,"h":false},{"t":"「島々よ、私に聞け。","s":9.288,"e":11.379,"p":false,"h":false},{"t":"遠くの国々の民よ、耳を傾けよ。","s":11.664,"e":14.665,"p":false,"h":false},{"t":"主は、私が生まれる前から私を呼び、母の胎内にいたときから、私の名を覚えておられた」(49:1)。","s":14.976,"e":21.826,"p":false,"h":false},{"t":"主は、私の口を鋭い剣のようにし、御手の陰に私を隠し、私を研ぎ澄まされた矢にして、矢筒の中に隠されました(49:2)。","s":22.104,"e":31.185,"p":false,"h":false},{"t":"主は私に言われました。","s":31.464,"e":33.032,"p":false,"h":false},{"t":"「あなたはわたしのしもべ、イスラエル。","s":33.372,"e":35.683,"p":false,"h":false},{"t":"わたしは、あなたのうちに栄光を現す」(49:3)。","s":35.964,"e":38.855,"p":true,"h":false},{"t":"しかし、しもべは言います。","s":39.492,"e":41.338,"p":false,"h":false},{"t":"「私はむなしく労し、無駄に、空しく力を使い果たした」。","s":41.652,"e":45.989,"p":false,"h":false},{"t":"それでも、「私の訴えは主とともにあり、私への報いは、私の神とともにある」と告白します(49:4)。","s":46.26,"e":53.454,"p":false,"h":false},{"t":"そして、主が、再び語られます。","s":53.748,"e":56.411,"p":false,"h":false},{"t":"「ヤコブを主のもとに立ち返らせ、イスラエルを主のもとに集めるために、母の胎内から私を形造られた主が、こう言われる。","s":56.7,"e":65.23,"p":false,"h":false},{"t":"『あなたがわたしのしもべとなって、ヤコブの諸部族を立たせ、イスラエルのうちの残された者たちを帰らせることは、あまりにも小さなことだ。","s":65.52,"e":74.75,"p":false,"h":false},{"t":"わたしはあなたを国々の光とし、わたしの救いが地の果てにまで及ぶようにする』」(49:5-6)。","s":75.024,"e":80.437,"p":true,"h":false},{"t":"イスラエルの贖い主、その聖なる方、主は、人に侮られ、国民に忌み嫌われ、支配者たちのしもべとなっている者に、こう言われます。","s":81.072,"e":90.903,"p":false,"h":false},{"t":"「王たちは見て立ち上がり、君主たちはひれ伏す。","s":91.188,"e":94.249,"p":false,"h":false},{"t":"それは、真実な主、あなたを選ばれたイスラエルの聖なる方のゆえだ」(49:7)。","s":94.536,"e":99.309,"p":true,"h":false},{"t":"主は、さらに言われます。","s":99.936,"e":101.63,"p":false,"h":false},{"t":"「恵みの時に、わたしはあなたに答え、救いの日に、あなたを助けた。","s":101.916,"e":106.672,"p":false,"h":false},{"t":"あなたを守り、あなたを民の契約として与える。","s":106.956,"e":110.292,"p":false,"h":false},{"t":"それは、国を立て直し、荒れ果てた地を、相続させるためだ」(49:8)。","s":110.592,"e":115.177,"p":false,"h":false},{"t":"囚人には「出て来なさい」と言い、闇にいる者には「姿を現しなさい」と言います。","s":115.452,"e":121.383,"p":false,"h":false},{"t":"彼らは、道すがら草を食べ、裸の丘にも牧場を得ます。","s":121.68,"e":126.132,"p":false,"h":false},{"t":"飢えず、渇かず、熱風も太陽も彼らを打たず、あわれむ方が彼らを導き、水の湧く所に連れて行かれます(49:9-10)。","s":126.432,"e":134.676,"p":false,"h":false},{"t":"わたしはすべての山を道とし、大路は引き上げられます。","s":134.964,"e":138.681,"p":false,"h":false},{"t":"見よ、遠くから、北から、西から、そしてシニムの地から、彼らが来る(49:11-12)。","s":138.996,"e":144.447,"p":false,"h":false},{"t":"天よ、喜び歌え。","s":144.72,"e":146.301,"p":false,"h":false},{"t":"地よ、楽しめ。","s":146.628,"e":147.853,"p":false,"h":false},{"t":"山々よ、喜びの声を上げよ。","s":148.536,"e":151.084,"p":false,"h":false},{"t":"主がご自分の民を慰め、その苦しむ者をあわれまれるからです(49:13)。","s":151.38,"e":155.878,"p":true,"h":false},{"t":"ところが、シオンは言います。","s":156.528,"e":158.387,"p":false,"h":false},{"t":"「主は私を見捨てた。","s":158.688,"e":160.133,"p":false,"h":false},{"t":"主は私を忘れた」(49:14)。","s":160.596,"e":162.075,"p":false,"h":false},{"t":"主は答えられます。","s":162.504,"e":163.789,"p":false,"h":false},{"t":"「女が自分の乳飲み子を忘れるだろうか。","s":164.412,"e":167.094,"p":false,"h":false},{"t":"自分の胎の子を、あわれまないだろうか。","s":167.364,"e":169.706,"p":false,"h":false},{"t":"たとえ、女たちが忘れても、わたしはあなたを忘れない」(49:15)。","s":169.992,"e":173.94,"p":false,"h":false},{"t":"「見よ、わたしは、あなたを手のひらに刻んだ。","s":174.204,"e":177.435,"p":false,"h":false},{"t":"あなたの城壁は、いつもわたしの前にある」(49:16)。","s":177.732,"e":180.748,"p":false,"h":false},{"t":"あなたの子らは急いで帰って来る。","s":181.044,"e":183.066,"p":false,"h":false},{"t":"あなたを壊した者、荒らした者は、あなたから出て行く(49:17)。","s":183.348,"e":186.914,"p":false,"h":false},{"t":"目を上げて、周りを見回せ。","s":187.2,"e":189.41,"p":false,"h":false},{"t":"彼らはみな集まって、あなたのところに来る。","s":189.72,"e":192.468,"p":false,"h":false},{"t":"わたしは生きている。","s":192.744,"e":193.878,"p":false,"h":false},{"t":"あなたは、彼らをみな飾りのように身につける、と主は言われる(49:18)。","s":194.652,"e":199.001,"p":true,"h":false},{"t":"あなたの荒れ果てた所、廃墟となった所、滅びた地は、今や、住む人には狭すぎるほどになる。","s":199.656,"e":206.553,"p":false,"h":false},{"t":"あなたを呑み込んだ者は遠くへ去る。","s":206.856,"e":209.046,"p":false,"h":false},{"t":"失った後に生まれた子らは、あなたの耳元で言う。","s":209.34,"e":212.952,"p":false,"h":false},{"t":"「この場所は私には狭すぎる。","s":213.264,"e":215.272,"p":false,"h":false},{"t":"住む場所を空けてください」(49:19-20)。","s":215.568,"e":217.128,"p":false,"h":false},{"t":"あなたは心の中で言う。","s":217.476,"e":219.161,"p":false,"h":false},{"t":"「だれが、この子らを私に産んでくれたのか。","s":219.492,"e":222.372,"p":false,"h":false},{"t":"私は子を失い、不妊の身であり、捕らえられ、追われていたのに。","s":222.66,"e":227.212,"p":false,"h":false},{"t":"だれが、この子らを育てたのか。","s":227.484,"e":229.748,"p":false,"h":false},{"t":"私はひとり残されていたのに、この子らはどこから来たのか」(49:21)。","s":230.04,"e":234.115,"p":true,"h":false},{"t":"神である主は言われます。","s":234.756,"e":236.333,"p":false,"h":false},{"t":"「見よ、わたしは国々に向けて手を上げ、民に向けて旗を揚げる。","s":236.664,"e":241.274,"p":false,"h":false},{"t":"彼らは、あなたの息子たちを懐に抱いて連れて来、あなたの娘たちを肩に担いで来る。","s":241.56,"e":247.844,"p":false,"h":false},{"t":"王たちは、あなたの養い親となり、王妃たちは、あなたの乳母となる。","s":248.148,"e":253.138,"p":false,"h":false},{"t":"彼らは、顔を地につけてあなたにひれ伏し、あなたの足のちりをなめる。","s":253.44,"e":258.351,"p":false,"h":false},{"t":"あなたは、わたしが主であることを知る。","s":258.624,"e":261.249,"p":false,"h":false},{"t":"わたしを待ち望む者は、恥を見ない」(49:22-23)。","s":261.54,"e":264.202,"p":false,"h":false},{"t":"勇士から獲物を奪い取れるだろうか。","s":264.492,"e":266.671,"p":false,"h":false},{"t":"暴君の捕虜は救い出されるだろうか。","s":266.94,"e":269.185,"p":false,"h":false},{"t":"主は言われます。","s":269.46,"e":270.499,"p":false,"h":false},{"t":"「そうだ。","s":271.368,"e":271.921,"p":false,"h":false},{"t":"勇士の捕虜も奪い取られ、暴君の獲物も救い出される。","s":272.232,"e":275.955,"p":false,"h":false},{"t":"わたしがあなたと争う者と争い、わたしがあなたの子らを救うからだ」(49:24-25)。","s":276.264,"e":280.921,"p":false,"h":false},{"t":"あなたを苦しめる者には、自分の肉を食べさせ、新しいぶどう酒のように、自分の血に酔わせる。","s":281.232,"e":288.119,"p":false,"h":false},{"t":"すべての肉なる者は、わたしが主、あなたの救い主、あなたの贖い主、ヤコブの力ある方であることを知る(49:26)。","s":288.396,"e":296.532,"p":true,"h":false},{"t":"各節の解説","s":297.18,"e":298.462,"p":true,"h":false},{"t":"1~6節は、「しもべの歌」の二番目です。","s":299.124,"e":302.26,"p":false,"h":false},{"t":"42章では、主がしもべについて語られましたが、ここでは、しもべ自身が語っています。","s":302.58,"e":309.069,"p":false,"h":false},{"t":"3節で、このしもべが「イスラエル」と呼ばれていますが、5~6節では、このしもべが、イスラエルをも立ち返らせる務めを持つと語られています。","s":309.384,"e":319.424,"p":false,"h":false},{"t":"つまり、しもべは、イスラエルでありながら、イスラエルを導く者としても語られています。","s":319.716,"e":325.761,"p":false,"h":false},{"t":"ここが、この歌の読み方の難しいところです。","s":326.052,"e":329.375,"p":false,"h":false},{"t":"改革派の伝統は、イスラエルが失敗した務めを、イスラエルを代表する、ひとりのしもべが果たされる、と読んできました。","s":329.688,"e":337.964,"p":false,"h":false},{"t":"この読み方では、しもべは、最終的に、イエス・キリストを指します。","s":338.256,"e":343,"p":false,"h":false},{"t":"ただし、イスラエル全体、または預言者自身を指すという読み方も、教会の歴史の中にはあります。","s":343.296,"e":350.427,"p":true,"h":false},{"t":"2節の、「口を鋭い剣のようにし」は、しもべが語る言葉の力を、表しています。","s":351.072,"e":357.052,"p":false,"h":false},{"t":"黙示録でも、キリストの口から出る鋭い剣が語られており、つながりが指摘されます。","s":357.336,"e":363.284,"p":true,"h":false},{"t":"4節の「むなしく労した」という告白は、しもべの働きが、一見、実を結ばないように見えることを、率直に語ります。","s":363.924,"e":372.48,"p":false,"h":false},{"t":"それでも、報いは、主とともにあるという信頼が示されます。","s":372.78,"e":377.132,"p":false,"h":false},{"t":"ここには、働きの結果が見えなくても、神に委ねる姿があります。","s":377.424,"e":382.317,"p":true,"h":false},{"t":"6節の「国々の光」は、42章6節でも語られた務めです。","s":382.968,"e":387.93,"p":false,"h":false},{"t":"ここでは、「イスラエルの残された者を帰らせるのは、小さなこと」とまで言われ、務めが、全世界に及ぶことが、強調されています。","s":388.224,"e":397.692,"p":false,"h":false},{"t":"この言葉は、新約聖書で、シメオンが幼子イエスを抱いて語った言葉や、パウロとバルナバが異邦人に福音を語る根拠として、使徒の働きの中で引かれています。","s":397.98,"e":409.309,"p":true,"h":false},{"t":"8節の「恵みの時」「救いの日」は、新約聖書で、パウロが、今こそ救いの日だと語るときに、引いています。","s":409.932,"e":417.559,"p":false,"h":false},{"t":"神の救いの約束が、キリストにおいて、成就したことを語るための言葉です。","s":417.852,"e":423.249,"p":false,"h":false},{"t":"ただし、この箇所が、そのままキリストの時代だけを指すのか、バビロンからの帰還も含むのかについては、読み方が分かれます。","s":423.54,"e":432.208,"p":true,"h":false},{"t":"12節の「シニムの地」が、どこを指すかは、はっきりしません。","s":432.864,"e":437.035,"p":false,"h":false},{"t":"エジプトの南の、アスワンを指すという読み方があり、また、中国を指すという読み方も、昔からあります。","s":437.328,"e":444.709,"p":false,"h":false},{"t":"どちらにしても、地の果てから、民が集められるという意味です。","s":444.996,"e":449.157,"p":true,"h":false},{"t":"14~15節の、シオンの嘆きと、主の答えは、この章でいちばん心に残る箇所の一つです。","s":449.82,"e":457.045,"p":false,"h":false},{"t":"「女が乳飲み子を忘れるだろうか」という問いは、母親の愛の強さを例に、神の愛が、それ以上であることを語ります。","s":457.344,"e":465.624,"p":false,"h":false},{"t":"人の愛さえ、時に失われることがあります。","s":465.912,"e":469.004,"p":false,"h":false},{"t":"しかし、神は、決して忘れられません。","s":469.296,"e":472.292,"p":true,"h":false},{"t":"16節の「手のひらに刻んだ」は、神が、民の名や姿を、消えないように、ご自分の手に刻んでおられる、という意味です。","s":472.932,"e":481.273,"p":false,"h":false},{"t":"新約聖書で、キリストの手に釘の跡があることを思い起こす人もいます。","s":481.572,"e":486.472,"p":false,"h":false},{"t":"ただし、この言葉の中心は、神が、決して民を見捨てられない、という約束です。","s":486.756,"e":493.085,"p":true,"h":false},{"t":"22~23節の「顔を地につけて、あなたにひれ伏し」は、読み方が難しい箇所です。","s":493.704,"e":500.106,"p":false,"h":false},{"t":"諸国の王たちが、シオンに仕えるというのは、シオンが他の国を支配するという意味ではなく、シオンの神が、世界の主として認められる、という意味に読むのが、穏当です。","s":500.4,"e":511.691,"p":true,"h":false},{"t":"25~26節は、主が、ご自分の民のために、強い敵とさえ争われることを語ります。","s":512.352,"e":519.578,"p":false,"h":false},{"t":"26節の厳しい表現は、さばきを詩的に語った言葉として読まれます。","s":519.84,"e":525.205,"p":true,"h":false}]},{"title":"イザヤ書_50章","audio":"doc50_2610231055.mp3","dur":307.3,"segs":[{"t":"イザヤ書50章","s":0,"e":1.364,"p":true,"h":false},{"t":"全体の流れ","s":2.016,"e":3.121,"p":true,"h":false},{"t":"50章は、主の問いで始まります。","s":3.924,"e":6.468,"p":false,"h":false},{"t":"「あなたがたの母を追い出した離縁状は、どこにあるのか。","s":6.768,"e":10.407,"p":false,"h":false},{"t":"あるいは、わたしの債権者のうち、だれに、あなたがたを売ったのか。","s":10.692,"e":15.143,"p":false,"h":false},{"t":"見よ、あなたがたは、自分の咎のゆえに売られ、あなたがたの母は、あなたがたの背きのゆえに追い出されたのだ」(50:1)。","s":15.444,"e":22.946,"p":false,"h":false},{"t":"主は問われます。","s":23.22,"e":24.271,"p":false,"h":false},{"t":"「わたしが来たのに、なぜ、だれもいなかったのか。","s":25.128,"e":28.316,"p":false,"h":false},{"t":"わたしが呼んだのに、なぜ、答える者がいなかったのか。","s":28.62,"e":32.37,"p":false,"h":false},{"t":"わたしの手は短くて、贖うことができないのか。","s":32.652,"e":36.019,"p":false,"h":false},{"t":"わたしには、救い出す力がないのか」(50:2)。","s":36.288,"e":38.919,"p":false,"h":false},{"t":"主が叱ると、海は干上がり、川は荒れ野になり、魚は水がなくて臭くなり、渇きのために死にます。","s":39.204,"e":46.608,"p":false,"h":false},{"t":"主は、天を暗やみで装い、荒布をその覆いとされます(50:2-3)。","s":46.908,"e":51.098,"p":true,"h":false},{"t":"ここから、しもべが語ります。","s":51.732,"e":53.742,"p":false,"h":false},{"t":"三番目の「しもべの歌」です。","s":54.036,"e":55.949,"p":false,"h":false},{"t":"「神である主は、私に弟子の舌を与え、疲れた者を、ことばで励ますことを知らせてくださった。","s":56.268,"e":63.075,"p":false,"h":false},{"t":"朝ごとに、主は私を呼び覚まし、私の耳を開き、弟子のように聞かせてくださる」(50:4)。","s":63.36,"e":69.619,"p":false,"h":false},{"t":"「神である主は、私の耳を開かれた。","s":69.912,"e":72.907,"p":false,"h":false},{"t":"私は逆らわず、退かなかった」(50:5)。","s":73.188,"e":75.708,"p":false,"h":false},{"t":"「私は、打つ者に背中を任せ、ひげを抜く者に頬を任せ、侮辱とつばきから顔を隠さなかった」(50:6)。","s":75.996,"e":83.214,"p":true,"h":false},{"t":"しかし、しもべは言います。","s":83.844,"e":85.69,"p":false,"h":false},{"t":"「神である主は、私を助けてくださる。","s":86.004,"e":88.864,"p":false,"h":false},{"t":"それゆえ、私は恥を見ない。","s":89.136,"e":91.38,"p":false,"h":false},{"t":"それゆえ、私は顔を火打石のようにして、恥を見ないことを知っている」(50:7)。","s":91.692,"e":96.85,"p":false,"h":false},{"t":"「私を義とする方が近くにおられる。","s":97.128,"e":99.564,"p":false,"h":false},{"t":"だれが私と争うのか。","s":99.828,"e":101.48,"p":false,"h":false},{"t":"さあ、共に立とう。","s":101.772,"e":103.223,"p":false,"h":false},{"t":"だれが私を訴えるのか。","s":103.68,"e":105.43,"p":false,"h":false},{"t":"私のところに来い」(50:8)。","s":105.732,"e":107.071,"p":false,"h":false},{"t":"「見よ、神である主が、私を助けてくださる。","s":107.64,"e":111.048,"p":false,"h":false},{"t":"だれが、私を罪に定めるのか。","s":111.312,"e":113.805,"p":false,"h":false},{"t":"見よ、彼らはみな、衣のように古び、しみが彼らを食い尽くす」(50:9)。","s":114.084,"e":118.991,"p":true,"h":false},{"t":"最後に、聞く者たちに、二つの呼びかけがなされます。","s":119.664,"e":123.487,"p":false,"h":false},{"t":"「あなたがたのうち、主を恐れ、そのしもべの声に聞き従う者はだれか。","s":123.804,"e":128.894,"p":false,"h":false},{"t":"暗闇の中を歩み、光のない者は、主の名に信頼し、自分の神に寄りかかれ」(50:10)。","s":129.168,"e":135.318,"p":false,"h":false},{"t":"一方、「見よ、あなたがたはみな、火をともし、火矢を身につける者たちだ。","s":135.612,"e":140.922,"p":false,"h":false},{"t":"自分の火の炎の中、自分がともした火矢の中を歩め。","s":141.228,"e":145.206,"p":false,"h":false},{"t":"これは、わたしの手から、あなたがたに与えられる。","s":145.476,"e":148.842,"p":false,"h":false},{"t":"あなたがたは、苦しみのうちに伏す」(50:11)。","s":149.112,"e":151.578,"p":true,"h":false},{"t":"各節の解説","s":152.244,"e":153.526,"p":true,"h":false},{"t":"1節の「離縁状」の問いは、主が、イスラエルを一方的に捨てたのではないことを語ります。","s":154.188,"e":160.379,"p":false,"h":false},{"t":"捕囚は、民の罪の結果であって、主が民との契約を、勝手に破棄したのではありません。","s":160.668,"e":167.079,"p":true,"h":false},{"t":"2節の「わたしの手は短くて」という問いは、主が、救う力がなくなったのではないことを示します。","s":167.724,"e":174.604,"p":false,"h":false},{"t":"民が、バビロンで、神に力がなくなったと感じていても、問題は、神の側にあるのではありません。","s":174.888,"e":182.124,"p":true,"h":false},{"t":"4~9節は、「しもべの歌」の三番目です。","s":182.772,"e":186.044,"p":false,"h":false},{"t":"この歌の特徴は、しもべが、神のことばを聞く者として描かれていることです。","s":186.336,"e":191.873,"p":false,"h":false},{"t":"「弟子の舌」「耳を開かれ」という言葉は、しもべが、まず聞く者であることを示します。","s":192.168,"e":198.172,"p":false,"h":false},{"t":"説教や教えの務めが、まず神のことばに耳を傾けることから始まる、という教えとしても、読まれることがあります。","s":198.468,"e":206.845,"p":true,"h":false},{"t":"6節の、背中を打たれ、ひげを抜かれ、つばきをかけられるという描写は、しもべが、苦難を、自分から進んで受けることを語ります。","s":207.468,"e":217.03,"p":false,"h":false},{"t":"新約聖書の福音書で、イエスの受難の場面と重なると、教会は読んできました。","s":217.296,"e":223.035,"p":false,"h":false},{"t":"ただし、この歌の中で、しもべが苦難を受ける理由は、まだ語られていません。","s":223.308,"e":228.912,"p":false,"h":false},{"t":"その意味は、52章13節から始まる、次の歌で明らかになります。","s":229.212,"e":234.391,"p":true,"h":false},{"t":"7節の「顔を火打石のようにして」は、困難に立ち向かう、決意の固さを表します。","s":235.044,"e":241.297,"p":false,"h":false},{"t":"ルカの福音書で、イエスがエルサレムへ向かう決意が、同じ表現で語られている、と指摘されることがあります。","s":241.596,"e":248.948,"p":true,"h":false},{"t":"8~9節の、法廷の言葉は、「義とする方」が近くにおられるので、訴える者を恐れない、という確信を語ります。","s":249.588,"e":258.178,"p":false,"h":false},{"t":"この言葉は、新約聖書で、パウロが、ローマ人への手紙8章で、「だれが神に選ばれた者たちを訴えるのか」と語る箇所と、響き合います。","s":258.48,"e":268.448,"p":false,"h":false},{"t":"信仰による義認の確信の姿が、ここに見られます。","s":268.74,"e":272.565,"p":true,"h":false},{"t":"10~11節の二つの呼びかけは、この章の結びです。","s":273.204,"e":277.33,"p":false,"h":false},{"t":"暗闇の中でも、主に信頼する者には、励ましが与えられます。","s":277.632,"e":282.306,"p":false,"h":false},{"t":"一方、自分の灯りと、自分の火矢に頼る者は、自分の火の中で苦しみます。","s":282.6,"e":288.53,"p":false,"h":false},{"t":"人が、自分の知恵や力に頼るのか、神に頼るのかという選択が、ここで鋭く示されています。","s":288.828,"e":296.147,"p":false,"h":false},{"t":"11節の「自分の火」が、何を指すのかは、読み方が分かれますが、自分の力による照らしと守りに頼る愚かさを語る、と読むのが穏当です。","s":296.46,"e":306.673,"p":true,"h":false}]},{"title":"イザヤ書_51章","audio":"doc51_2610231055.mp3","dur":364.3,"segs":[{"t":"イザヤ書51章","s":0,"e":1.539,"p":true,"h":false},{"t":"全体の流れ","s":2.196,"e":3.301,"p":true,"h":false},{"t":"「義を追い求める者、主を尋ね求める者よ、私に聞け」と、51章は始まります。","s":4.104,"e":10.536,"p":false,"h":false},{"t":"あなたがたが切り出された岩、掘り出された穴を見よ。","s":10.836,"e":14.387,"p":false,"h":false},{"t":"あなたがたの父アブラハムと、あなたがたを産んだサラを見よ。","s":14.688,"e":18.31,"p":false,"h":false},{"t":"彼がひとりのとき、わたしは彼を呼び、祝福し、増やした、と主は言われます(51:1-2)。","s":18.612,"e":24.33,"p":false,"h":false},{"t":"主はシオンを慰め、その荒れ跡をみな慰め、荒れ野をエデンのように、荒れ地を主の園のようにされます。","s":24.624,"e":31.676,"p":false,"h":false},{"t":"そこには喜びと楽しみ、感謝と歌声があります(51:3)。","s":31.968,"e":35.606,"p":true,"h":false},{"t":"「わたしの民よ、わたしに心を留めよ。","s":36.252,"e":38.991,"p":false,"h":false},{"t":"わたしの国民よ、わたしに耳を傾けよ。","s":39.276,"e":42.363,"p":false,"h":false},{"t":"おしえはわたしから出、わたしの公正は、諸国民の光となる」(51:4)。","s":42.66,"e":47.133,"p":false,"h":false},{"t":"わたしの義は近い。","s":47.412,"e":48.69,"p":false,"h":false},{"t":"わたしの救いは出て行く。","s":49.32,"e":50.854,"p":false,"h":false},{"t":"島々はわたしを待ち望み、わたしの腕に望みを置く(51:5)。","s":51.228,"e":55.027,"p":false,"h":false},{"t":"目を上げて天を見、下の地を見よ。","s":55.332,"e":57.883,"p":false,"h":false},{"t":"天は煙のように消え、地は衣のように古び、そこに住む者も、虫のように死ぬ。","s":58.212,"e":64.28,"p":false,"h":false},{"t":"しかし、わたしの救いはとこしえに続き、わたしの義はくじけることがない(51:6)。","s":64.584,"e":69.658,"p":true,"h":false},{"t":"義を知る者、心にわたしのおしえを持つ民よ、聞け。","s":70.308,"e":74.246,"p":false,"h":false},{"t":"人にそしられることを恐れるな。","s":74.52,"e":76.533,"p":false,"h":false},{"t":"ののしられても、おののくな。","s":76.824,"e":78.502,"p":false,"h":false},{"t":"しみが彼らを衣のように食い、虫が羊毛のように食い尽くす。","s":78.804,"e":83.146,"p":false,"h":false},{"t":"しかし、わたしの義はとこしえに、わたしの救いは代々に続く(51:7-8)。","s":83.448,"e":88.005,"p":true,"h":false},{"t":"そこで、民が祈ります。","s":88.668,"e":90.434,"p":false,"h":false},{"t":"「目覚めよ、目覚めよ。","s":90.72,"e":92.248,"p":false,"h":false},{"t":"力を着よ、主の腕よ。","s":92.628,"e":94.494,"p":false,"h":false},{"t":"昔の日、遠い昔の代のように目覚めよ。","s":94.788,"e":97.902,"p":false,"h":false},{"t":"ラハブを切り刻み、竜を刺し貫いたのは、あなたではなかったか。","s":98.208,"e":102.873,"p":false,"h":false},{"t":"海を、大いなる淵の水を干上がらせ、海の深みを道とし、贖われた者たちが渡るようにしたのは、あなたではなかったか」(51:9-10)。","s":103.176,"e":111.656,"p":false,"h":false},{"t":"主に贖われた者たちは帰って来る。","s":111.96,"e":114.239,"p":false,"h":false},{"t":"喜び歌いながらシオンに入り、その頭にはとこしえの喜びがある。","s":114.516,"e":119.224,"p":false,"h":false},{"t":"楽しみと喜びがついて来て、悲しみとため息は逃げ去る(51:11)。","s":119.52,"e":123.595,"p":true,"h":false},{"t":"主が答えられます。","s":124.236,"e":125.519,"p":false,"h":false},{"t":"「わたし、このわたしが、あなたがたを慰める。","s":126.144,"e":129.398,"p":false,"h":false},{"t":"あなたは、なぜ、死ぬべき人間を恐れ、草のようになる人の子を恐れるのか。","s":129.672,"e":135.26,"p":false,"h":false},{"t":"天を張り、地の基を据えた、あなたの造り主、主を忘れ、圧迫する者の怒りを、一日中、絶えず恐れている」(51:12-13)。","s":135.54,"e":144.08,"p":false,"h":false},{"t":"縛られた者は、すぐに解き放たれる。","s":144.36,"e":147.048,"p":false,"h":false},{"t":"彼は穴の中で死なず、パンに欠けることもない(51:14)。","s":147.348,"e":150.453,"p":false,"h":false},{"t":"わたしは主、あなたの神。","s":150.732,"e":152.587,"p":false,"h":false},{"t":"海をかき立て、その波を荒立たせる。","s":152.892,"e":155.527,"p":false,"h":false},{"t":"その名は万軍の主(51:15)。","s":155.808,"e":157.393,"p":false,"h":false},{"t":"「わたしは、わたしのことばをあなたの口に置き、わたしの手の陰にあなたをおおった。","s":157.716,"e":163.21,"p":false,"h":false},{"t":"それは、天を張り、地の基を据え、シオンに、『あなたはわたしの民』と言うためだ」(51:16)。","s":163.476,"e":169.198,"p":true,"h":false},{"t":"最後に、「目覚めよ、目覚めよ、立ち上がれ、エルサレムよ」と呼びかけられます。","s":169.848,"e":175.449,"p":false,"h":false},{"t":"あなたは、主の手から、憤りの杯を飲み、よろめかせる大杯を飲み干した(51:17)。","s":175.752,"e":181.557,"p":false,"h":false},{"t":"産んだ子らの中に、手を引く者はなく、育てた子らの中に、手を取る者もいません。","s":181.836,"e":187.612,"p":false,"h":false},{"t":"荒廃と破滅、飢えと剣が、あなたを襲いました。","s":187.92,"e":191.45,"p":false,"h":false},{"t":"だれがあなたを慰めるのか(51:18-19)。","s":191.736,"e":193.523,"p":false,"h":false},{"t":"あなたの子らは、網にかかった羚羊のように、通りの角々で倒れ、主の憤りと、あなたの神の叱責で満ちています(51:20)。","s":193.824,"e":202.206,"p":false,"h":false},{"t":"だから、聞け。","s":202.5,"e":203.585,"p":false,"h":false},{"t":"苦しめられた者、酔った者、しかし、ぶどう酒によらない者よ。","s":204.408,"e":209.072,"p":false,"h":false},{"t":"あなたの主、神である主は言われる。","s":209.376,"e":212.062,"p":false,"h":false},{"t":"「見よ、わたしは、よろめかせる杯を、あなたの手から取り去る。","s":212.364,"e":216.771,"p":false,"h":false},{"t":"憤りの大杯を、あなたは二度と飲まない」(51:21-22)。","s":217.044,"e":219.848,"p":false,"h":false},{"t":"それを、あなたを苦しめた者の手に渡す。","s":220.14,"e":222.891,"p":false,"h":false},{"t":"彼らは、あなたに「身を伏せよ。","s":223.2,"e":225.4,"p":false,"h":false},{"t":"我々が踏み越えて行く」と言った(51:23)。","s":225.72,"e":227.768,"p":true,"h":false},{"t":"各節の解説","s":228.42,"e":229.702,"p":true,"h":false},{"t":"1~2節で、アブラハムとサラを思い出すよう言われるのは、民が、バビロンで少数になり、望みを失いかけているからです。","s":230.364,"e":239.129,"p":false,"h":false},{"t":"ひとりのアブラムを呼び、増やされた神は、今も同じことをされる、という励ましです。","s":239.436,"e":245.406,"p":true,"h":false},{"t":"3節の「エデンのように」は、荒れ果てたシオンが、創造のはじめの園のようにされる、という意味です。","s":246.06,"e":252.66,"p":false,"h":false},{"t":"回復が、単なる元通りではなく、はじめの祝福を超えるものとして語られています。","s":252.972,"e":258.768,"p":true,"h":false},{"t":"6節の、天が煙のように消え、地が衣のように古びるという言葉は、見えるものがすべて過ぎ去っても、神の救いだけは残ることを語ります。","s":259.416,"e":269.597,"p":false,"h":false},{"t":"何に望みを置くかが、問われています。","s":269.892,"e":272.505,"p":true,"h":false},{"t":"9~10節の「目覚めよ」は、神に向かって、民が、昔のように力を現してほしいと願う祈りです。","s":273.132,"e":280.68,"p":false,"h":false},{"t":"ラハブは、神話に出てくる海の怪物で、ここでは、出エジプトの時に主が打たれたエジプトを指して使われています。","s":280.98,"e":288.873,"p":false,"h":false},{"t":"この祈りは、神が眠っておられるという意味ではなく、民が、神の力を切実に求めている姿の表れです。","s":289.152,"e":296.616,"p":true,"h":false},{"t":"11節は、35章10節と、ほぼ同じ言葉です。","s":297.288,"e":301.535,"p":false,"h":false},{"t":"前半の終わりで語られた望みが、ここで、実現に向けて、もう一度語られます。","s":301.824,"e":307.76,"p":true,"h":false},{"t":"12~13節の、「人の子を恐れる」とは、抑圧する者の力を、神よりも大きく感じてしまう民の姿です。","s":308.412,"e":316.707,"p":false,"h":false},{"t":"慰めの根拠は、天と地を造られた方が、ご自分の民を覚えておられることにあります。","s":317.016,"e":323.189,"p":true,"h":false},{"t":"16節の「わたしのことばをあなたの口に置き」は、しもべの務めを思い出させる言葉です。","s":323.82,"e":329.777,"p":false,"h":false},{"t":"ここで語られている「あなた」が誰を指すかは、イスラエル全体なのか、しもべなのか、読み方が分かれます。","s":330.048,"e":337.235,"p":true,"h":false},{"t":"17~23節の「憤りの杯」は、さばきを、飲み干さなければならない杯にたとえたものです。","s":337.86,"e":345.4,"p":false,"h":false},{"t":"新約聖書で、イエスがゲツセマネで、「この杯を過ぎ去らせてください」と祈られたことと、結びつけて読まれることがあります。","s":345.708,"e":354.034,"p":false,"h":false},{"t":"ここでは、その杯が、民の手から取り去られ、苦しめた者に渡されると語られており、さばきと赦しの、大きな転換が示されています。","s":354.312,"e":363.68,"p":true,"h":false}]},{"title":"イザヤ書_52章","audio":"doc52_2610231055.mp3","dur":280.7,"segs":[{"t":"イザヤ書52章","s":0,"e":1.514,"p":true,"h":false},{"t":"全体の流れ","s":2.16,"e":3.265,"p":true,"h":false},{"t":"52章は、「目覚めよ、目覚めよ、力を着よ、シオンよ」という呼びかけで始まります。","s":4.068,"e":10.62,"p":false,"h":false},{"t":"美しい衣を着よ、聖なる都エルサレムよ。","s":10.908,"e":14.252,"p":false,"h":false},{"t":"もう、割礼を受けていない者や汚れた者は、あなたの中に入って来ない(52:1)。","s":14.544,"e":19.62,"p":false,"h":false},{"t":"ちりを払い、立ち上がって座れ、エルサレムよ。","s":19.908,"e":23.069,"p":false,"h":false},{"t":"首の鎖を解け、捕らわれの娘シオンよ(52:2)。","s":23.364,"e":26.4,"p":false,"h":false},{"t":"主は言われます。","s":26.712,"e":27.751,"p":false,"h":false},{"t":"「あなたがたは、ただで売られた。","s":28.62,"e":30.698,"p":false,"h":false},{"t":"だから、代価なしで贖われる」(52:3)。","s":30.996,"e":33.163,"p":false,"h":false},{"t":"エジプトも、アッシリアも、理由なく民を苦しめました。","s":33.444,"e":37.186,"p":false,"h":false},{"t":"そして今、バビロンでも、民は理由なく連れて行かれ、支配者たちは嘲り、主の名は絶えず、一日中、侮られています(52:4-5)。","s":37.476,"e":46.368,"p":false,"h":false},{"t":"「だから、わたしの民は、その日、わたしの名を知る。","s":46.656,"e":50.348,"p":false,"h":false},{"t":"それは、ここにいる、とことばを語る者がわたしであることを」(52:6)。","s":50.616,"e":54.93,"p":true,"h":false},{"t":"「山々の上にあって、良い知らせを伝える者の足は、なんと美しいことか。","s":55.584,"e":60.879,"p":false,"h":false},{"t":"平和を告げ、幸いな良い知らせを伝え、救いを告げ、シオンに向かって、『あなたの神が王となられた』と言う者の足は」(52:7)。","s":61.164,"e":69.238,"p":false,"h":false},{"t":"見張りたちの声が響き、彼らは声をそろえて喜び歌います。","s":69.516,"e":73.948,"p":false,"h":false},{"t":"主がシオンに帰って来られるのを、彼らは、まのあたりに見るからです(52:8)。","s":74.232,"e":78.831,"p":false,"h":false},{"t":"エルサレムの廃墟よ、声を合わせて喜び歌え。","s":79.128,"e":82.437,"p":false,"h":false},{"t":"主がご自分の民を慰め、エルサレムを贖われたからです(52:9)。","s":82.728,"e":86.832,"p":false,"h":false},{"t":"主は、すべての国々の目の前で、聖なる腕を現されました。","s":87.12,"e":91.665,"p":false,"h":false},{"t":"地の果てのすべてが、私たちの神の救いを見ます(52:10)。","s":91.944,"e":95.437,"p":true,"h":false},{"t":"「去れ、去れ、そこから出て行け。","s":96.084,"e":98.344,"p":false,"h":false},{"t":"汚れたものに触れるな。","s":98.64,"e":100.055,"p":false,"h":false},{"t":"その中から出て行き、身をきよめよ。","s":100.548,"e":103.084,"p":false,"h":false},{"t":"主の器をになう者たちよ」(52:11)。","s":103.392,"e":105.345,"p":false,"h":false},{"t":"あなたがたは、急いで出る必要はなく、逃げるように去る必要もありません。","s":105.66,"e":110.72,"p":false,"h":false},{"t":"主があなたがたの前を進み、イスラエルの神が、あなたがたのしんがりを務められるからです(52:12)。","s":111.024,"e":117.18,"p":true,"h":false},{"t":"そして、ここから、四番目の「しもべの歌」が始まります。","s":117.828,"e":121.903,"p":false,"h":false},{"t":"「見よ、わたしのしもべは栄える。","s":122.22,"e":124.476,"p":false,"h":false},{"t":"彼は高められ、上げられ、きわめて高くなる」(52:13)。","s":124.776,"e":127.968,"p":false,"h":false},{"t":"多くの人が、彼を見て驚いた。","s":128.268,"e":130.688,"p":false,"h":false},{"t":"その顔だちは、人のものと思えないほど損なわれ、その姿は、人の子とは見えないほどであった。","s":130.968,"e":137.713,"p":false,"h":false},{"t":"しかし、彼は多くの国々を驚かせ、王たちは彼の前で口をつぐむ。","s":137.988,"e":143.287,"p":false,"h":false},{"t":"まだ語られていなかったことを、彼らは見、聞いたことのないことを、悟るからだ(52:14-15)。","s":143.568,"e":148.89,"p":true,"h":false},{"t":"各節の解説","s":149.544,"e":150.826,"p":true,"h":false},{"t":"3節の「ただで売られた。","s":151.488,"e":153.254,"p":false,"h":false},{"t":"だから、代価なしで贖われる」は、民が、バビロンに売られたのは、民自身の罪のためで、その売り手に、代価は支払われていない、という意味です。","s":153.54,"e":163.098,"p":false,"h":false},{"t":"だから、解き放つときにも、金銭の支払いは必要ない、という約束です。","s":163.404,"e":168.755,"p":false,"h":false},{"t":"この言葉は、新約聖書で、信仰による義認や、恵みによる救いを語るときに、思い出される表現です。","s":169.056,"e":176.562,"p":true,"h":false},{"t":"7節の「良い知らせを伝える者の足は、なんと美しいか」は、新約聖書で、パウロが、福音を宣べ伝える者について語るときに、引いています。","s":177.192,"e":187.567,"p":false,"h":false},{"t":"ここでは、バビロンからの解放を告げる使者のことですが、福音を伝える働きの原型として読まれてきました。","s":187.848,"e":195.035,"p":false,"h":false},{"t":"「あなたの神が王となられた」という知らせが、良い知らせの中心です。","s":195.336,"e":199.776,"p":true,"h":false},{"t":"8~10節の、見張りの喜びと廃墟の歌は、主ご自身が帰って来られることの喜びです。","s":200.412,"e":207.138,"p":false,"h":false},{"t":"民が帰るだけでなく、主がシオンに戻られる、という点が大切です。","s":207.432,"e":212.324,"p":true,"h":false},{"t":"11~12節の「去れ、出て行け」は、バビロンを出る民に、きよさを保つように呼びかけています。","s":212.976,"e":220.003,"p":false,"h":false},{"t":"出エジプトの時には、急いで逃げる必要がありましたが、今度は、主が前も後ろも守ってくださるので、急ぐ必要がありません。","s":220.284,"e":229.343,"p":true,"h":false},{"t":"13節から、53章12節までは、四番目の「しもべの歌」です。","s":230.004,"e":235.44,"p":false,"h":false},{"t":"この歌は、章の区切りより前に始まっています。","s":235.728,"e":239.041,"p":false,"h":false},{"t":"52章13~15節は、しもべが高く上げられるという、勝利の宣言から始まり、その前に、人のものと思えないほど損なわれた姿が語られます。","s":239.328,"e":250.438,"p":false,"h":false},{"t":"栄光と苦難が、ひとりのしもべの中で結びついていることが、この歌の中心です。","s":250.74,"e":256.62,"p":true,"h":false},{"t":"14~15節の「驚く」という言葉は、多くの人が、しもべの姿を見て、言葉を失うことを語ります。","s":257.256,"e":265.137,"p":false,"h":false},{"t":"15節の「王たちは口をつぐむ」は、驚きのあまり、何も言えなくなる様子です。","s":265.428,"e":271.047,"p":false,"h":false},{"t":"この言葉は、新約聖書で、パウロが、まだ福音を聞いたことのない人々に福音を伝える、と語るときに、引かれています。","s":271.332,"e":280.079,"p":true,"h":false}]},{"title":"イザヤ書_53章","audio":"doc53_2610231055.mp3","dur":376.9,"segs":[{"t":"イザヤ書53章","s":0,"e":1.576,"p":true,"h":false},{"t":"全体の流れ","s":2.232,"e":3.337,"p":true,"h":false},{"t":"53章は、この歌の続きです。","s":4.14,"e":6.76,"p":false,"h":false},{"t":"「私たちが聞いたことを、だれが信じただろうか。","s":7.056,"e":10.206,"p":false,"h":false},{"t":"主の御腕は、だれに現されたのか」(53:1)。","s":10.512,"e":12.982,"p":false,"h":false},{"t":"彼は、主の前に、ひこばえのように、乾いた地から出た根のように育った。","s":13.248,"e":18.405,"p":false,"h":false},{"t":"見るべき姿も、輝きもなく、慕うような見ばえもなかった(53:2)。","s":18.684,"e":22.964,"p":false,"h":false},{"t":"彼は、人々に蔑まれ、見捨てられ、悲しみの人で、病を知っていた。","s":23.256,"e":28.817,"p":false,"h":false},{"t":"人が顔を背けるほど蔑まれ、私たちも、彼を尊ばなかった(53:3)。","s":29.124,"e":33.911,"p":true,"h":false},{"t":"ここで、語り手が変わります。","s":34.56,"e":36.59,"p":false,"h":false},{"t":"「まことに、彼は私たちの病を負い、私たちの痛みをになった。","s":36.9,"e":41.594,"p":false,"h":false},{"t":"それなのに、私たちは、彼が罰せられ、神に打たれ、苦しめられたのだと考えた」(53:4)。","s":41.868,"e":48.149,"p":false,"h":false},{"t":"しかし、彼は、私たちの背きのために刺され、私たちの咎のために砕かれた。","s":48.42,"e":54.451,"p":false,"h":false},{"t":"彼への懲らしめが、私たちに平安をもたらし、彼の打ち傷によって、私たちは癒やされた(53:5)。","s":54.72,"e":61.14,"p":false,"h":false},{"t":"私たちはみな、羊のようにさまよい、おのおの自分の道に向かって行った。","s":61.416,"e":66.521,"p":false,"h":false},{"t":"しかし、主は、私たちすべての咎を、彼に負わせた(53:6)。","s":66.816,"e":70.954,"p":true,"h":false},{"t":"彼は虐げられ、苦しめられたが、口を開かなかった。","s":71.604,"e":75.711,"p":false,"h":false},{"t":"屠り場に引かれて行く羊のように、毛を刈る者の前で黙っている雌羊のように、彼は口を開かなかった(53:7)。","s":75.996,"e":83.167,"p":false,"h":false},{"t":"苦しみとさばきによって、彼は取り去られた。","s":83.448,"e":86.442,"p":false,"h":false},{"t":"彼の時代の者で、だれが思っただろうか。","s":86.724,"e":89.519,"p":false,"h":false},{"t":"彼が生ける者の地から断たれ、私の民の背きのゆえに、打たれたのだと(53:8)。","s":89.82,"e":94.766,"p":false,"h":false},{"t":"彼の墓は、悪しき者たちとともに設けられ、その死は、富む者とともにあった。","s":95.076,"e":100.769,"p":false,"h":false},{"t":"彼は暴虐を行わず、その口に偽りはなかったのに(53:9)。","s":101.052,"e":104.837,"p":true,"h":false},{"t":"しかし、主は、彼を砕くことを望み、病を負わせた。","s":105.48,"e":109.755,"p":false,"h":false},{"t":"彼が、自分のいのちを、罪過のためのささげ物とするなら、彼は、末長く子孫を見、主のみこころは、彼の手によって成し遂げられる(53:10)。","s":110.052,"e":119.727,"p":false,"h":false},{"t":"彼は、自分のたましいの苦しみのあとを見て、満足する。","s":120.024,"e":124.249,"p":false,"h":false},{"t":"わたしの義なるしもべは、その知識によって、多くの人を義とし、彼らの咎を負う(53:11)。","s":124.524,"e":130.3,"p":false,"h":false},{"t":"それゆえ、わたしは、多くの人々を彼に分け与え、彼は、強い者たちを、戦利品として分ける。","s":130.608,"e":138.014,"p":false,"h":false},{"t":"彼が、自分のいのちを死に明け渡し、背く者たちとともに数えられたからだ。","s":138.312,"e":143.869,"p":false,"h":false},{"t":"彼は、多くの人の罪を負い、背く者たちのために、とりなしをした(53:12)。","s":144.144,"e":149.073,"p":true,"h":false},{"t":"各節の解説","s":149.724,"e":151.006,"p":true,"h":false},{"t":"1節の「だれが信じただろうか」は、この歌が語る内容が、あまりに人の予想に反していることを示します。","s":151.668,"e":159.04,"p":false,"h":false},{"t":"力ある救い主ではなく、苦しむしもべによって救いが来るという知らせは、信じがたいものでした。","s":159.336,"e":165.941,"p":false,"h":false},{"t":"この節は、新約聖書で、ヨハネの福音書とパウロが、イエスを信じない人々について語るときに、引いています。","s":166.212,"e":174.164,"p":true,"h":false},{"t":"2~3節の姿は、人の目に魅力のない、弱い者のようです。","s":174.816,"e":179.524,"p":false,"h":false},{"t":"神の救いが、人の目に華やかなものではなく、蔑まれる者を通して来るという逆説が、ここで語られています。","s":179.82,"e":187.668,"p":true,"h":false},{"t":"4~6節は、この歌の中心です。","s":188.316,"e":191.197,"p":false,"h":false},{"t":"「私たちの病を負い、痛みをになった」「私たちの背きのために刺され」「私たちすべての咎を、彼に負わせた」という言葉は、しもべが、他の人の罪を代わりに負うという、代わりの苦しみを語っています。","s":191.484,"e":205.346,"p":false,"h":false},{"t":"「私たち」が、告白する人々を指していることに、注意が必要です。","s":205.632,"e":210.55,"p":false,"h":false},{"t":"この人々は、最初、しもべを神に打たれた者として見ていました。","s":210.816,"e":215.51,"p":false,"h":false},{"t":"しかし、実は、自分たちの罪のために、しもべが苦しんだのだと、悟ります。","s":215.784,"e":221.664,"p":false,"h":false},{"t":"改革派の神学は、これを、キリストの代償的な贖いの預言として、重く受け取ってきました。","s":221.976,"e":228.582,"p":false,"h":false},{"t":"新約聖書でも、ペテロの手紙などで、この箇所が、キリストの十字架を説明するために、引かれています。","s":228.852,"e":236.229,"p":true,"h":false},{"t":"7節の、屠り場に引かれる羊のように黙っていたという描写は、使徒の働きで、エチオピアの宦官が、この箇所を読んでいて、ピリポが、イエスの福音を語る場面で出てきます。","s":236.88,"e":249.037,"p":false,"h":false},{"t":"しもべが、自分を弁護せず、黙って苦しみを受けたことを語ります。","s":249.336,"e":254.234,"p":true,"h":false},{"t":"8節の「私の民の背きのゆえに」は、苦しみの理由が、しもべ自身の罪ではなく、民の背きにあることを、はっきり語ります。","s":254.88,"e":263.979,"p":false,"h":false},{"t":"9節の「その口に偽りはなかった」も、しもべが、自分の罪のために苦しんだのではないことを示します。","s":264.276,"e":271.669,"p":true,"h":false},{"t":"9節の、悪しき者たちとともに墓が設けられ、富む者とともに死があったという言葉は、読み方が難しい箇所です。","s":272.304,"e":280.433,"p":false,"h":false},{"t":"新約聖書の福音書では、イエスが、罪人のように十字架につけられ、富む人の墓に葬られたことと結びつけて読まれています。","s":280.728,"e":289.596,"p":true,"h":false},{"t":"10節の「主は、彼を砕くことを望み」は、非常に厳しい言葉です。","s":290.232,"e":295.376,"p":false,"h":false},{"t":"ここで、しもべの苦しみが、人間の悪意だけでなく、神ご自身の計画の中にあったことが示されます。","s":295.668,"e":303.036,"p":false,"h":false},{"t":"ただし、この言葉は、神が残酷であるという意味ではなく、救いのために、しもべが自分から、いのちを献げることを、神が計画しておられた、という意味に、読まれます。","s":303.336,"e":314.45,"p":false,"h":false},{"t":"「罪過のためのささげ物」という言葉は、レビ記の、いけにえの言葉です。","s":314.748,"e":319.566,"p":false,"h":false},{"t":"しもべが、自分のいのちを、いけにえとして献げたことを、語っています。","s":319.86,"e":324.649,"p":true,"h":false},{"t":"11節の「義とする」は、しもべの苦しみによって、多くの人が、神の前で、義とされることを語ります。","s":325.296,"e":332.711,"p":false,"h":false},{"t":"新約聖書の、信仰による義認の教えが、ここに、旧約の中で、すでに語られていることを、教会は見てきました。","s":333,"e":341.568,"p":true,"h":false},{"t":"12節の、「背く者たちとともに数えられた」は、新約聖書で、イエスが、十字架の前に、ご自分のことを語る言葉として、引かれています。","s":342.216,"e":352.172,"p":false,"h":false},{"t":"「とりなしをした」という結びは、しもべが、苦しみの中でも、人々のために祈られたことを示します。","s":352.476,"e":359.566,"p":true,"h":false},{"t":"この歌のしもべが誰を指すかについては、イスラエルの民全体と読む立場や、預言者自身と読む立場もあります。","s":360.216,"e":367.984,"p":false,"h":false},{"t":"ただし、改革派の伝統は、新約聖書の理解を受けて、この歌を、イエス・キリストの預言として、読んできました。","s":368.28,"e":376.3,"p":true,"h":false}]},{"title":"イザヤ書_54章","audio":"doc54_2610231055.mp3","dur":324.3,"segs":[{"t":"イザヤ書54章","s":0,"e":1.589,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"54章は、「喜び歌え、子を産まない不妊の女よ」と始まります。","s":4.176,"e":9.256,"p":false,"h":false},{"t":"産みの苦しみを知らない女よ、喜びの声を上げて叫べ。","s":9.54,"e":13.603,"p":false,"h":false},{"t":"見捨てられた女の子らは、夫のいる女の子らよりも多いからだ、と主は言われます(54:1)。","s":13.896,"e":19.398,"p":false,"h":false},{"t":"あなたの天幕の場所を広げ、住まいの幕を惜しまずに張れ。","s":19.692,"e":23.767,"p":false,"h":false},{"t":"綱を長くし、杭を固くせよ。","s":24.048,"e":26.412,"p":false,"h":false},{"t":"あなたは、右にも左にも広がり、あなたの子孫は、諸国民を所有し、荒れた町々に人を住まわせるからです(54:2-3)。","s":26.712,"e":35.026,"p":true,"h":false},{"t":"「恐れるな。","s":35.676,"e":36.387,"p":false,"h":false},{"t":"あなたは恥を見ない。","s":37.584,"e":38.932,"p":false,"h":false},{"t":"辱められることもない。","s":39.492,"e":41.12,"p":false,"h":false},{"t":"あなたは、若いときの恥を忘れ、やもめのときの恥を、もう思い出さない」(54:4)。","s":41.4,"e":46.697,"p":false,"h":false},{"t":"あなたを造られた方が、あなたの夫、その名は万軍の主。","s":46.98,"e":51.317,"p":false,"h":false},{"t":"あなたを贖う方は、イスラエルの聖なる方。","s":51.624,"e":54.656,"p":false,"h":false},{"t":"全地の神と呼ばれる(54:5)。","s":54.936,"e":56.42,"p":false,"h":false},{"t":"主は、あなたを、見捨てられて、心の痛む妻、若いときにめとられ、そして退けられた妻のように、呼び戻される(54:6)。","s":56.844,"e":65.394,"p":false,"h":false},{"t":"「わたしは、ほんのしばらく、あなたを見捨てた。","s":65.7,"e":68.802,"p":false,"h":false},{"t":"しかし、大きなあわれみをもって、あなたを集める」(54:7)。","s":69.084,"e":72.308,"p":false,"h":false},{"t":"あふれる憤りで、ほんの一瞬、わたしの顔をあなたから隠した。","s":72.612,"e":77.067,"p":false,"h":false},{"t":"しかし、永遠の恵みをもって、あなたをあわれむ、とあなたを贖う主は言われる(54:8)。","s":77.364,"e":82.674,"p":true,"h":false},{"t":"「これは、わたしにとって、ノアの水のようだ。","s":83.304,"e":86.347,"p":false,"h":false},{"t":"わたしは、ノアの水が、二度と地をおおわないと誓ったように、あなたに怒らず、あなたを叱らないと誓う」(54:9)。","s":86.652,"e":93.962,"p":false,"h":false},{"t":"たとえ山が移り、丘が動いても、わたしの変わらぬ愛は、あなたから移らず、わたしの平和の契約は動かない、とあなたをあわれむ主は言われます(54:10)。","s":94.284,"e":104.646,"p":true,"h":false},{"t":"「苦しめられ、嵐にもてあそばれ、慰められなかった者よ。","s":105.3,"e":109.514,"p":false,"h":false},{"t":"見よ、わたしは、あなたの石を、輝く石でふさぎ、あなたの基を、サファイアで据える」(54:11)。","s":109.836,"e":116.28,"p":false,"h":false},{"t":"あなたの小塔は、ルビーで、あなたの門は、エメラルドで、あなたの城壁は、宝石で造る(54:12)。","s":116.568,"e":122.918,"p":false,"h":false},{"t":"あなたの子らはみな、主に教えられ、あなたの子らの平和は大きい(54:13)。","s":123.192,"e":127.612,"p":false,"h":false},{"t":"あなたは義によって堅く立ち、虐げから遠ざかる。","s":127.908,"e":131.3,"p":false,"h":false},{"t":"恐れることがない。","s":131.58,"e":132.715,"p":false,"h":false},{"t":"あなたは、恐れから遠ざかり、それはあなたに近づかない(54:14)。","s":133.488,"e":137.406,"p":true,"h":false},{"t":"もし、だれかが攻めてきても、それは、わたしから出たものではない。","s":138.024,"e":142.599,"p":false,"h":false},{"t":"あなたを攻める者は、あなたのために倒れる(54:15)。","s":142.884,"e":145.894,"p":false,"h":false},{"t":"見よ、わたしは、炭火を吹きおこし、武器を作る鍛冶屋を造り、また、破壊する者も造った(54:16)。","s":146.196,"e":153.251,"p":false,"h":false},{"t":"あなたに向けて造られる武器は、どれも役に立たない。","s":153.54,"e":156.99,"p":false,"h":false},{"t":"さばきの場で、あなたと争うすべての舌を、あなたは罪に定める。","s":157.284,"e":161.83,"p":false,"h":false},{"t":"これが、主のしもべたちの受け継ぐもの、そして、わたしから出る彼らの義である、と主は言われます(54:17)。","s":162.108,"e":168.778,"p":true,"h":false},{"t":"各節の解説","s":169.416,"e":170.698,"p":true,"h":false},{"t":"1節の「不妊の女」は、バビロン捕囚で子孫を失ったように見えるシオンを表します。","s":171.36,"e":177.235,"p":false,"h":false},{"t":"53章の苦難のしもべの歌の直後に、この喜びの歌が置かれていることに、注意が必要です。","s":177.516,"e":184.434,"p":false,"h":false},{"t":"しもべの苦しみの結果として、不妊の女が、多くの子を持つ、という流れとして読む立場があります。","s":184.716,"e":191.722,"p":false,"h":false},{"t":"パウロは、ガラテヤ人への手紙4章で、この節を引いて、信仰による約束の子らについて語っています。","s":192.024,"e":199.379,"p":true,"h":false},{"t":"2~3節の、天幕を広げる描写は、シオンが、民が増えて広がっていくという約束を、目に見える形で語っています。","s":200.016,"e":208.773,"p":false,"h":false},{"t":"回復は、元の大きさに戻ることではなく、それを超えて広がることです。","s":209.052,"e":214.157,"p":true,"h":false},{"t":"7~8節の、「ほんのしばらく見捨てた」「永遠の恵み」の対比は、さばきと回復の時間の長さを比べています。","s":214.812,"e":222.604,"p":false,"h":false},{"t":"さばきは、一瞬のようであり、恵みは、永遠である、という意味です。","s":222.876,"e":227.57,"p":true,"h":false},{"t":"9節の、ノアの水への言及は、神の誓いの確かさを、創世記の出来事に重ねて語ります。","s":228.24,"e":235.358,"p":false,"h":false},{"t":"ノアの洪水の後、二度と地を洪水で滅ぼさないと、約束された神は、民に怒り続けないことも、誓っておられます。","s":235.656,"e":244.255,"p":true,"h":false},{"t":"10節の「平和の契約」は、解釈が分かれます。","s":244.908,"e":248.425,"p":false,"h":false},{"t":"ノアやダビデとの契約と関係づける読み方もあります。","s":248.724,"e":252.367,"p":false,"h":false},{"t":"新約聖書の、「新しい契約」とつなげて読まれることもあります。","s":252.648,"e":256.854,"p":false,"h":false},{"t":"どちらにしても、山が動いても、神の愛は動かない、という確かさが、中心です。","s":257.148,"e":263.366,"p":true,"h":false},{"t":"11~12節の宝石の都は、のちに、黙示録21章の、新しいエルサレムの描写と、つなげて読まれることがあります。","s":264.024,"e":273.31,"p":false,"h":false},{"t":"ここでの宝石は、文字どおりの建築材料というより、神が与えられる、美しさと堅さを語る、詩的な表現です。","s":273.6,"e":282.062,"p":true,"h":false},{"t":"13節の「あなたの子らはみな、主に教えられ」は、新約聖書で、イエスが、ヨハネの福音書6章で、引いています。","s":282.708,"e":290.882,"p":false,"h":false},{"t":"神ご自身が、民を教えてくださる、という約束です。","s":291.168,"e":295.186,"p":true,"h":false},{"t":"15~17節は、解釈の難しいところです。","s":295.848,"e":299.686,"p":false,"h":false},{"t":"16節で、武器を作る者も、破壊する者も、主が造られたとされており、ここでも、神の主権が語られています。","s":299.988,"e":308.531,"p":false,"h":false},{"t":"それでも、神の民に向けられる武器は、役に立ちません。","s":308.844,"e":312.901,"p":false,"h":false},{"t":"「主のしもべたちの受け継ぐもの」の「しもべたち」は、複数形です。","s":313.2,"e":317.367,"p":false,"h":false},{"t":"53章の、ひとりのしもべから、多くのしもべたちへと広がっていることが、読み取れます。","s":317.664,"e":323.675,"p":true,"h":false}]},{"title":"イザヤ書_55章","audio":"doc55_2610231055.mp3","dur":297.6,"segs":[{"t":"イザヤ書55章","s":0,"e":1.501,"p":true,"h":false},{"t":"全体の流れ","s":2.16,"e":3.265,"p":true,"h":false},{"t":"55章は、「ああ、渇いている者はみな、水を求めて来い。","s":4.068,"e":8.683,"p":false,"h":false},{"t":"金のない者も来て、買って食べよ。","s":8.964,"e":11.247,"p":false,"h":false},{"t":"来て、金も代価も払わずに、ぶどう酒と乳を買え」という招きで始まります(55:1)。","s":11.556,"e":17.01,"p":false,"h":false},{"t":"なぜ、パンでないもののために金を量り、腹を満たさないもののために労するのか。","s":17.28,"e":22.738,"p":false,"h":false},{"t":"わたしに聞き従い、良いものを食べ、脂の豊かなものに、あなたがたのたましいを楽しませよ(55:2)。","s":23.04,"e":29.704,"p":false,"h":false},{"t":"耳を傾け、わたしのもとに来て、聞け。","s":29.988,"e":33.102,"p":false,"h":false},{"t":"そうすれば、あなたがたのたましいは生きる。","s":33.372,"e":36.165,"p":false,"h":false},{"t":"わたしは、あなたがたと、永遠の契約を結ぶ。","s":36.432,"e":39.914,"p":false,"h":false},{"t":"ダビデへの確かな恵みである(55:3)。","s":40.212,"e":42.062,"p":true,"h":false},{"t":"見よ、わたしは、彼を国々への証人、国々の君主、また命令者とした(55:4)。","s":42.696,"e":48.828,"p":false,"h":false},{"t":"あなたは、知らない国民を呼び、あなたを知らなかった国民は、あなたのもとに走って来る。","s":49.104,"e":55.305,"p":false,"h":false},{"t":"それは、あなたの神、主のゆえ、イスラエルの聖なる方のゆえだ。","s":55.584,
