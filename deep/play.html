  button:active { transform:scale(.96); }

  .nvcard a.go { display:inline-block; background:var(--acc); color:#fff; text-decoration:none; font-weight:900; font-size:19px; border-radius:14px; padding:12px 22px; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(63,174,106,.75); } 50% { box-shadow:0 0 0 10px rgba(63,174,106,0); } }
  #play.wait { animation:pulse 1.2s infinite; }
  #resume button { background:var(--acc); color:#fff; height:auto; padding:8px 14px; margin-left:8px; font-size:16px; }
  @media (max-width:640px) { header h1 { font-size:25px; } button { height:42px; padding:0 9px; } #play { min-width:84px; } }
  @media print { .bar { display:none; } body { padding-bottom:0; } }

<script>
(function () {
  const TITLE = "낭독 목록", TRACKS = [{"title":"00_イザヤ書_概観","audio":"book_2610310202_1.mp3","start":0,"end":488.568,"dur":488.6,"segs":[{"t":"イザヤ書 全体概観 ========================================","s":0,"e":1.807,"p":true,"h":false},{"t":"[基本情報] - 著者:アモツの子イザヤ。","s":2.28,"e":5.053,"p":false,"h":false},{"t":"預言者アモスとは別人です。","s":5.256,"e":7.341,"p":false,"h":false},{"t":"- 活動時期:ウジヤ王が死んだ年(紀元前740年ごろ)に召命を受け、ヨタム、アハズ、ヒゼキヤの各王の時代まで働きました。","s":7.536,"e":18.257,"p":false,"h":false},{"t":"アッシリアが強大であった時代です。","s":18.504,"e":20.844,"p":false,"h":false},{"t":"- 名前の意味:「主は救い」。","s":21.12,"e":23.047,"p":false,"h":false},{"t":"書全体の主題と重なります。","s":23.232,"e":25.443,"p":false,"h":false},{"t":"- 中心主題:「イスラエルの聖なる方」である主、裁きの後に残される残りの者、ダビデの子孫として来られるメシア、苦難の僕による救い - 分量:66章。","s":25.656,"e":38.436,"p":false,"h":false},{"t":"旧約の預言書の中でも最も長い書の一つで、文体は非常に詩的です。","s":38.64,"e":44.744,"p":true,"h":false},{"t":"[歴史的背景] イザヤは、ユダが政治的危機に次々と見舞われた時代に活動しました。","s":45.336,"e":52.084,"p":false,"h":false},{"t":"北のアラムとエフライムが同盟を結んでユダを圧迫し、アハズ王は神に拠り頼まず、アッシリアに助けを求めました。","s":52.272,"e":61.19,"p":false,"h":false},{"t":"やがて北イスラエルがアッシリアによって滅ぼされ、ヒゼキヤの時代にはアッシリアの大軍がエルサレムの前まで攻め寄せました。","s":61.392,"e":70.2,"p":false,"h":false},{"t":"40章以降は視点がはるか後の時代に移り、バビロンに連れて行かれている民に語りかける形をとります。","s":70.392,"e":78.288,"p":false,"h":false},{"t":"この後半部分の著者については、伝統的にイザヤ一人の預言と見る立場と、捕囚期以後の別の著者がいたと見る学界の立場とに分かれています。","s":78.504,"e":89.312,"p":false,"h":false},{"t":"この概観は、一つの書として読む流れに従っています。","s":89.544,"e":93.645,"p":true,"h":false},{"t":"[構造:66章が聖書66巻に似た構造] 1) 1-39章(旧約39巻に対応):裁きと警告 ユダと諸国民の罪を責め、アッシリアの脅威の中で、人や同盟ではなく主にのみ拠り頼むよう促します。","s":94.152,"e":112.428,"p":false,"h":false},{"t":"2) 40-66章(新約27巻に対応):慰めと救い バビロン捕囚を見据えて回復を宣言し、苦難の僕と新しい天と新しい地を希望として示します。","s":112.728,"e":126.053,"p":false,"h":false},{"t":"二つの部分の分量が旧約・新約の巻数と一致するのは興味深い観察ですが、著者が意図した設計だと断定できる根拠はありません。","s":126.264,"e":136.791,"p":true,"h":false},{"t":"[詳細な流れ] - 1-12章:ユダに対する裁きとインマヌエルなるメシアの約束 1章は、反逆した民を告発する序論です。","s":137.232,"e":147.22,"p":false,"h":false},{"t":"5章のぶどう畑の歌は、良い実を期待されたのに野ぶどうを結んだという嘆きです。","s":147.432,"e":153.56,"p":false,"h":false},{"t":"6章の召命の幻に続き、7-12章ではインマヌエルのしるし、一人のみどりごとして来られる平和の君、エッサイの株から出る芽が続き、12章の賛美で締めくくられます。","s":153.768,"e":167.483,"p":false,"h":false},{"t":"- 13-27章:諸国民に対する裁きの預言 バビロン、アッシリア、ペリシテ、モアブ、ダマスコ、エジプト、ツロなど周辺諸国に対する宣告が続きます。","s":167.712,"e":180.55,"p":false,"h":false},{"t":"その中でエルサレムも例外ではないことを22章が示しています。","s":180.768,"e":185.42,"p":false,"h":false},{"t":"24-27章は、全地の裁きと、諸国民が集う宴、死を永遠に呑み込まれるという約束が出てくる、イザヤの小黙示録です。","s":185.64,"e":196.545,"p":false,"h":false},{"t":"- 28-35章:エジプトに拠り頼むことへの叱責と回復の約束 「災いあれ」で始まる警告が繰り返され、エジプトの馬と戦車に頼る指導者たちを叱責します。","s":196.752,"e":210.252,"p":false,"h":false},{"t":"シオンに据えられた尊い隅の石、静けさと信頼の中にある力が強調され、34章の裁きと35章の回復が対比をなします。","s":210.456,"e":221.564,"p":false,"h":false},{"t":"- 36-39章:ヒゼキヤ時代の歴史的付録(アッシリアの危機、病の癒やし、バビロンの使者) 前半の裁きの預言と後半の慰めの預言をつなぐ蝶番です。","s":221.784,"e":235.649,"p":false,"h":false},{"t":"アッシリアの前で祈りによって救われたヒゼキヤが、バビロンの使者の前では高ぶり、イザヤは後にバビロン捕囚を預言します。","s":235.872,"e":244.616,"p":false,"h":false},{"t":"- 40-48章:捕囚からの帰還の約束、偶像と区別される主 「慰めよ、慰めよ、わたしの民を」で始まります。","s":244.824,"e":255.1,"p":false,"h":false},{"t":"創造主であり歴史の支配者である神が偶像をあざ笑い、クロスを用いてバビロンから救い出されます。","s":255.312,"e":262.609,"p":false,"h":false},{"t":"- 49-55章:僕の歌と身代わりの苦難 イスラエルが担いきれなかった使命を僕が代わりに成し遂げ、新しい出エジプトの希望が広がります。","s":262.944,"e":273.715,"p":false,"h":false},{"t":"中心は53章の身代わりの苦難で、54章のシオンの歌と55章の無償の招きがそれに続きます。","s":273.936,"e":282.324,"p":false,"h":false},{"t":"- 56-66章:真の礼拝と新しい天と新しい地 異邦人や宦官までもが神の家に受け入れられ、断食は形式ではなく正義と憐れみによって表されるべきだと語られます。","s":282.528,"e":297.291,"p":false,"h":false},{"t":"油注がれた者の宣言、民のための嘆きと祈りを経て、新しい天と新しい地で終わります。","s":297.504,"e":304.965,"p":true,"h":false},{"t":"[四つの僕の歌] - 第一:公義をもたらす僕。","s":305.544,"e":309.42,"p":false,"h":false},{"t":"傷ついた葦を折らず、諸国民に公義をもたらします。","s":309.624,"e":313.877,"p":false,"h":false},{"t":"- 第二:諸国民の光となる僕。","s":314.088,"e":316.867,"p":false,"h":false},{"t":"イスラエルを回復させ、地の果てまで救いを届けます。","s":317.064,"e":320.98,"p":false,"h":false},{"t":"- 第三:従順に苦難を受ける僕。","s":321.192,"e":323.763,"p":false,"h":false},{"t":"打たれ、ひげを抜かれながらも、顔を火打ち石のように固くします。","s":323.928,"e":328.819,"p":false,"h":false},{"t":"- 第四:身代わりの死を遂げ、高く上げられる僕。","s":329.016,"e":332.817,"p":false,"h":false},{"t":"卑しめの極みから高挙へとつながります。","s":333,"e":335.923,"p":false,"h":false},{"t":"四つの歌が向かう方向は、使命、確信、苦難、身代わりと栄光です。","s":336.144,"e":342.12,"p":true,"h":false},{"t":"[中心的メッセージ] 1) 神の聖:6章の召命の幻と「イスラエルの聖なる方」という呼称が、書全体で二十回以上登場します。","s":342.6,"e":353.722,"p":false,"h":false},{"t":"聖なる神の前で人間の罪が明らかにされ、その方が清めてくださいます。","s":353.928,"e":359.582,"p":false,"h":false},{"t":"2) 裁きと残りの者:罪に対する裁きは厳しいものですが、切り倒された切り株から聖なる種が残るようにしてくださいます。","s":359.808,"e":369.16,"p":false,"h":false},{"t":"3) メシア預言:インマヌエル、平和の君、エッサイの根株、苦難の僕(53章)へとつながり、王と僕という二つの姿が一人の方に集められます。","s":369.36,"e":382.034,"p":false,"h":false},{"t":"4) ただ主のみ:偶像のむなしさ、そして唯一の創造主・贖い主である神の宣言(40-48章) 5) 新しい出エジプトと新しい創造:捕囚からの解放がより大きな救いの影となり、新しい天と新しい地(65-66章)で完成されます。","s":382.248,"e":404.078,"p":false,"h":false},{"t":"6) シオン:裁かれるエルサレムが、諸国民の集う神の都に変えられていく流れが、書全体を貫いています。","s":404.352,"e":412.866,"p":true,"h":false},{"t":"[新約との関連] 新約聖書で最も多く引用される預言書の一つです。","s":413.328,"e":418.916,"p":false,"h":false},{"t":"福音書は、洗礼者ヨハネの使命をイザヤの預言の成就として紹介し、インマヌエルのしるしはイエス様の誕生と結びつけられます。","s":419.136,"e":429.299,"p":false,"h":false},{"t":"イエス様はナザレの会堂で、油注がれた者の宣言を朗読し、これが今日実現したと言われました。","s":429.528,"e":437.086,"p":false,"h":false},{"t":"十字架の身代わり(53章)は、初代教会が福音を説明するときにまず指し示した箇所でした。","s":437.28,"e":445.013,"p":false,"h":false},{"t":"異邦人への光、隅の石、新しい天と新しい地も、新約の随所で繰り返されます。","s":445.224,"e":452.684,"p":true,"h":false},{"t":"[読む順序の提案] - 初めて読むとき:1、6、7、9、11、40、53、55、61、65章 - 流れをつかむとき:上の詳細な流れの単位ごとに読み、各単位の前でこの概観を参照 - 読んでいて道に迷ったとき:36-39章を基準点とし、前半は「今目の前にある危機の中で主に拠り頼みなさい」、後半は「これから来る捕囚の中でも主が救ってくださる」と理解すればよいでしょう。","s":453.144,"e":488.116,"p":true,"h":false}]},{"title":"反逆した民への告発","audio":"book_2610310202_1.mp3","start":488.568,"end":600.504,"dur":111.9,"segs":[{"t":"反逆した民への告発","s":488.568,"e":490.547,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / ユダに対する裁きとメシアの約束 (1-12章)","s":490.992,"e":498.619,"p":true,"h":false},{"t":"[概観] イザヤ書全体の序論です。","s":499.056,"e":501.69,"p":false,"h":false},{"t":"ウジヤ、ヨタム、アハズ、ヒゼキヤの時代にイザヤが見た幻であると述べて始まります。","s":501.912,"e":508.874,"p":false,"h":false},{"t":"神は、子として育てられた民が自分に背いたと、天と地を証人に立てて告発されます。","s":509.064,"e":516.104,"p":false,"h":false},{"t":"牛は飼い主を知り、ろばも主人の飼い葉桶を知っているのに、イスラエルは知りません。","s":516.312,"e":522.25,"p":false,"h":false},{"t":"全身が傷だらけなのに立ち返らず、ソドムとゴモラのようになるところを、残りの者のゆえにかろうじて免れたにすぎません。","s":522.432,"e":531.358,"p":false,"h":false},{"t":"そのさなかにも、いけにえや祭りを欠かすことはありませんでしたが、神はそれを耐えられない重荷だと言われます。","s":531.552,"e":539.187,"p":false,"h":false},{"t":"手に血が満ちたまま献げる礼拝は受け入れられず、悪を行うのをやめ、善を行うことを学び、公正を求め、孤児とやもめを助けなさいと言われます。","s":539.4,"e":550.464,"p":true,"h":false},{"t":"[流れ] - 天と地を証人に立てた告発:主人を見分ける獣にも及ばない民 - 形式的ないけにえの拒否と公正の要求:手に血が満ちた礼拝は受け入れられない - 「来たれ、論じ合おう」という招き:罪は緋のように赤くても雪のように白くなり、従うなら地の良い産物を食べる - 忠実だった町が遊女となった嘆きと、公義によって贖われるシオンの回復の約束","s":550.92,"e":578.902,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 真の礼拝は、いけにえの量ではなく、生活における正義によって表されることを、この書の最初の章が宣言しています。","s":579.456,"e":592.252,"p":false,"h":false},{"t":"罪をありのままに認めさせながらも、赦しへと招かれる神の恵みは、福音の中心に通じています。","s":592.488,"e":600.054,"p":true,"h":false}]},{"title":"主の山と主の日","audio":"book_2610310202_1.mp3","start":600.504,"end":696.816,"dur":96.3,"segs":[{"t":"主の山と主の日","s":600.504,"e":601.947,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / ユダに対する裁きとメシアの約束 (1-12章)","s":602.376,"e":610.003,"p":true,"h":false},{"t":"[概観] まず、終わりの日の幻が繰り広げられます。","s":610.44,"e":614.468,"p":false,"h":false},{"t":"主の神殿の山がすべての山の上にそびえ立ち、諸国民が律法を学びに集まってきて、剣を打ち直して鋤とし、槍を打ち直して鎌とする平和が訪れます。","s":614.664,"e":626.665,"p":false,"h":false},{"t":"しかし、すぐに現実に戻り、ヤコブの家に、主の光の中を歩もうと勧めます。","s":626.856,"e":633.353,"p":false,"h":false},{"t":"今のユダは、東方の占い、金銀、軍馬と戦車、そして手で造った偶像に満ちています。","s":633.552,"e":640.975,"p":false,"h":false},{"t":"主の日には、高い山、高い塔、堅固な城壁のように、人の高ぶりで築き上げたものがすべて低くされ、偶像は消え去り、ただ主だけが高く上げられます。","s":641.208,"e":653.622,"p":false,"h":false},{"t":"鼻から息をする人間に頼るなという勧めで終わります。","s":653.808,"e":657.743,"p":true,"h":false},{"t":"[流れ] - 終わりの日の幻:諸国民がシオンに上って御言葉を学び、戦いをやめる - 現在の現実:占い、財産、軍事力、偶像に満ちたユダ - 主の日:高ぶるものがすべて低くされ、人の息に頼ることのむなしさが示される","s":658.2,"e":676.929,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 諸国民が神のもとに集まるこの幻は、福音があらゆる民族に広がっていく教会のビジョンにつながります。","s":677.376,"e":688.851,"p":false,"h":false},{"t":"終わりに成就する約束が、今私たちが歩む光の道を照らしているということを黙想させられます。","s":689.064,"e":696.347,"p":true,"h":false}]},{"title":"エルサレムの指導者たちと着飾る女たちへの裁き","audio":"book_2610310202_1.mp3","start":696.816,"end":790.488,"dur":93.7,"segs":[{"t":"エルサレムの指導者たちと着飾る女たちへの裁き","s":696.816,"e":700.615,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / ユダに対する裁きとメシアの約束 (1-12章)","s":701.064,"e":708.691,"p":true,"h":false},{"t":"[概観] 神がエルサレムとユダの頼みとしていたものを取り去られる場面です。","s":709.128,"e":714.407,"p":false,"h":false},{"t":"食物と水、勇士と裁判官、預言者と長老といった社会の支えが失われると、未熟な子どもたちが指導者となり、民は互いに虐げ合い、隣人同士が争います。","s":714.624,"e":727.684,"p":false,"h":false},{"t":"人々は、外套一枚持っているというだけの理由で、あなたが治めてくださいと人にすがりますが、誰もそれを引き受けようとしません。","s":727.896,"e":737.446,"p":false,"h":false},{"t":"貧しい者を踏みにじる者たちを裁かれる神の前で、シオンの娘たちの贅沢が一つひとつ列挙され、香水の代わりに腐臭、帯の代わりに縄、編んだ髪の代わりに禿げ頭に変わると宣告されます。","s":737.64,"e":752.524,"p":false,"h":false},{"t":"義人には、その行いの実を食べる祝福があると約束されます。","s":752.736,"e":757.536,"p":true,"h":false},{"t":"[流れ] - 頼みとしていたものを取り去られる:食物と指導者を失った社会の混乱 - 指導者たちへの告発:貧しい者の顔をひき臼でひくような不正 - シオンの娘たちの贅沢と、それに伴う恥","s":757.992,"e":773.078,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 人や物に頼っていたものが一瞬にして崩れ得るという警告です。","s":773.52,"e":781.828,"p":false,"h":false},{"t":"目に見える安定の代わりに、神だけにしっかりとつながる生き方とはどのようなものかを、振り返らせる章です。","s":782.064,"e":789.981,"p":true,"h":false}]},{"title":"主の若枝と清められたシオン","audio":"book_2610310202_1.mp3","start":790.488,"end":880.968,"dur":90.5,"segs":[{"t":"主の若枝と清められたシオン","s":790.488,"e":792.832,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / ユダに対する裁きとメシアの約束 (1-12章)","s":793.32,"e":800.947,"p":true,"h":false},{"t":"[概観] 前の章の裁きの後に来る回復の、短い描写です。","s":801.384,"e":806.287,"p":false,"h":false},{"t":"多くの男が戦争で死に、七人の女が一人の男にすがるという悲惨な場面の後に、その日、主の若枝が麗しく栄えあるものとなるという約束が示されます。","s":806.496,"e":819.055,"p":false,"h":false},{"t":"地の産物は、逃れて生き残った者たちの誇りとなります。","s":819.264,"e":823.552,"p":false,"h":false},{"t":"シオンに残された者は聖なる者と呼ばれ、いのちの書に記された者たちです。","s":823.752,"e":829.502,"p":false,"h":false},{"t":"神は、裁きの霊と焼き尽くす霊によって、シオンの娘たちの汚れとエルサレムの血を洗い清められます。","s":829.728,"e":837.49,"p":false,"h":false},{"t":"そして、シオンのすべての家の上に、昼は雲と煙、夜は燃える火の輝きを置き、栄光が覆いとなり仮庵となって、暑さと嵐から守ってくださいます。","s":837.768,"e":850.257,"p":true,"h":false},{"t":"[流れ] - 戦争後の悲惨な現実 - 主の若枝と残りの者:聖なる者と呼ばれる人々 - 裁きの火で洗い清められ、雲と火の輝きで守られるシオン","s":850.728,"e":862.928,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 裁きは終わりではなく、清めの過程であり、その先に、神が民とともに住まわれる姿があります。","s":863.352,"e":874.544,"p":false,"h":false},{"t":"出エジプトのときの雲の柱と火の柱を思い起こさせる、臨在の約束です。","s":874.752,"e":880.427,"p":true,"h":false}]},{"title":"ぶどう畑の歌と六つの災い","audio":"book_2610310202_1.mp3","start":880.968,"end":983.952,"dur":103,"segs":[{"t":"ぶどう畑の歌と六つの災い","s":880.968,"e":883.509,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / ユダに対する裁きとメシアの約束 (1-12章)","s":883.944,"e":891.571,"p":true,"h":false},{"t":"[概観] イザヤが歌う愛の歌で始まります。","s":892.008,"e":895.159,"p":false,"h":false},{"t":"肥沃な丘にぶどう畑を作り、石を取り除き、良いぶどうの木を植え、見張りの塔と酒ぶねまで備えたのに、実ったのは野ぶどうでした。","s":895.392,"e":905.675,"p":false,"h":false},{"t":"主人はユダの人々に、このぶどう畑のために、これ以上何をすべきだったのかと問い、垣根を取り払って荒れ果てさせると宣言されます。","s":905.88,"e":916.457,"p":false,"h":false},{"t":"このぶどう畑こそイスラエルであり、公正を期待されたのに流血があり、正義を期待されたのに叫びがあったと解き明かされます。","s":916.656,"e":926.426,"p":false,"h":false},{"t":"続いて、家や畑をどこまでも増やす貪欲、酒に溺れる快楽、罪を引き寄せる大胆さ、善悪を逆転させる混乱、自分は賢いという高ぶり、賄賂で義人を不当に扱う裁判について六つの災いが宣告され、アッシリアが口笛の合図に駆けつけて、裁きを執行します。","s":926.64,"e":948.42,"p":true,"h":false},{"t":"[流れ] - ぶどう畑の歌:心を込めて育てたのに野ぶどうを実らせたイスラエル - 六つの災い:貪欲、快楽、罪に対する開き直り、善悪の転倒、高ぶり、不正な裁判 - 神が奮い立たせられる遠い国の軍隊","s":948.888,"e":966.706,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 良い実を期待されながら得られなかったぶどう畑の主人の嘆きは、まことのぶどうの木であるイエス様と対照をなします。","s":967.2,"e":979.115,"p":false,"h":false},{"t":"私たちが結ぶ実は何であるかを、点検させる章です。","s":979.32,"e":983.48,"p":true,"h":false}]},{"title":"イザヤの召命","audio":"book_2610310202_1.mp3","start":983.952,"end":1088.328,"dur":104.4,"segs":[{"t":"イザヤの召命","s":983.952,"e":985.101,"p":true,"h":false},{"t":"[位置] 1- 2,"e":1137.241,"p":false,"h":false},{"t":"「見よ、おとめが身ごもって男の子を産み、その名をインマヌエルと呼ぶ」。","s":1137.432,"e":1142.614,"p":false,"h":false},{"t":"しかし、アハズが頼りにしたアッシリアが、かえってかみそりのような災いとなってユダを襲うという予告で終わります。","s":1142.808,"e":1151.191,"p":true,"h":false},{"t":"[流れ] - 恐れる王に与えられる言葉:信じなければ堅く立つことはできない - しるしを拒む不信仰と、インマヌエルのしるし - アッシリアに頼った代価:かみそりとはえと蜂のたとえ","s":1151.664,"e":1165.056,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 人間の愚かさの中でも、神ご自身が救いのしるしを与えてくださることが恵みです。","s":1165.488,"e":1175.283,"p":false,"h":false},{"t":"この約束はイエス・キリストの誕生につながり、神が私たちとともにおられるという福音を、最も簡潔に示しています。","s":1175.472,"e":1184.725,"p":true,"h":false}]},{"title":"アッシリアの侵攻と主を畏れなさい","audio":"book_2610310202_1.mp3","start":1185.192,"end":1289.496,"dur":104.3,"segs":[{"t":"アッシリアの侵攻と主を畏れなさい","s":1185.192,"e":1187.81,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / ユダに対する裁きとメシアの約束 (1-12章)","s":1188.24,"e":1195.867,"p":true,"h":false},{"t":"[概観] イザヤに生まれた子の名はマヘル・シャラル・ハシュ・バズ、すなわち「略奪は速く、分捕りは早い」という意味です。","s":1196.304,"e":1206.381,"p":false,"h":false},{"t":"その子が父母を呼べるようになる前に、アッシリアがダマスコとサマリアを略奪するというしるしです。","s":1206.576,"e":1213.422,"p":false,"h":false},{"t":"ユダの民が、ゆるやかに流れるシロアの水、すなわち神の支配を捨てて人間の王を喜ぶと、アッシリアの大河の水がユダの首にまで達するようにされると言われます。","s":1213.632,"e":1225.799,"p":false,"h":false},{"t":"しかし、その翼の広がるところはインマヌエルの地であるため、ユダは最後までは滅びません。","s":1226.04,"e":1232.909,"p":false,"h":false},{"t":"イザヤには、この民が恐れるものを恐れず、万軍の主だけを聖なる方とせよと言われ、主は聖所となられるが、つまずきの石、ぶつかる岩ともなられると教えられます。","s":1233.096,"e":1245.794,"p":false,"h":false},{"t":"霊媒や口寄せに尋ねず、律法と証しに従うようにと言われ、そうしない者たちは暗闇の中をさまよいます。","s":1246.008,"e":1254.554,"p":true,"h":false},{"t":"[流れ] - マヘル・シャラル・ハシュ・バズのしるし:アッシリア侵攻の切迫 - シロアの水を捨てた代価と、インマヌエルの地の約束 - 恐れるものを恐れず、主を畏れなさい - 律法と証しを捨て、霊媒に尋ねる闇","s":1255.008,"e":1271.621,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 同じ神が、信じる者には避け所となり、信じない者にはつまずきの石となられます。","s":1272.072,"e":1282.442,"p":false,"h":false},{"t":"世の恐れに流されず、神の言葉を握りしめることがどれほど大切かを語る章です。","s":1282.68,"e":1289.018,"p":true,"h":false}]},{"title":"平和の君","audio":"book_2610310202_1.mp3","start":1289.496,"end":1388.016,"dur":98.5,"segs":[{"t":"平和の君","s":1289.496,"e":1290.383,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / ユダに対する裁きとメシアの約束 (1-12章)","s":1291.368,"e":1298.995,"p":true,"h":false},{"t":"[概観] 闇の中の暗さは永遠ではありません。","s":1299.432,"e":1302.77,"p":false,"h":false},{"t":"以前はゼブルンとナフタリが辱めを受けましたが、やがてガリラヤが栄光を受け、闇の中を歩んでいた民は大きな光を見ます。","s":1302.96,"e":1312.585,"p":false,"h":false},{"t":"その喜びは、刈り入れの喜びのようであり、戦利品を分け合う喜びのようです。","s":1312.776,"e":1318.917,"p":false,"h":false},{"t":"それは、圧制のくびきと杖が折られたからです。","s":1319.184,"e":1322.663,"p":false,"h":false},{"t":"一人のみどりごが私たちのために生まれ、一人の男の子が私たちに与えられました。","s":1322.88,"e":1328.963,"p":false,"h":false},{"t":"主権はその肩にあり、その名は、驚くべき指導者、力ある神、永遠の父、平和の君です。","s":1329.168,"e":1337.288,"p":false,"h":false},{"t":"ダビデの王座の上で、公正と正義によって永遠に治められ、万軍の主の熱心がこれを成し遂げられます。","s":1337.472,"e":1345.466,"p":false,"h":false},{"t":"しかし後半は、高ぶって立ち返らない北イスラエルへの裁きであり、「それでも御怒りは去らず、御手は伸ばされたままである」という繰り返しが続きます。","s":1345.68,"e":1357.03,"p":true,"h":false},{"t":"[流れ] - ガリラヤに差す大きな光:圧制のくびきを砕かれる - 一人のみどりごと平和の君:五つの名 - 高ぶる北イスラエルへの裁きと、繰り返される句","s":1357.512,"e":1369.466,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] クリスマスの預言の中心となる箇所です。","s":1369.92,"e":1376.508,"p":false,"h":false},{"t":"闇の中に来られた大きな光、弱い赤ん坊として来られ、永遠の王として治められるメシアの約束が、ここで最も輝かしく宣言されます。","s":1376.712,"e":1387.547,"p":true,"h":false}]},{"title":"アッシリアの高ぶりと残りの者の帰還","audio":"book_2610310202_1.mp3","start":1388.016,"end":1481.472,"dur":93.5,"segs":[{"t":"アッシリアの高ぶりと残りの者の帰還","s":1388.016,"e":1390.97,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / ユダに対する裁きとメシアの約束 (1-12章)","s":1391.424,"e":1399.051,"p":true,"h":false},{"t":"[概観] 不義の法令を作って貧しい者の権利を奪う者たちに、災いが宣告されます。","s":1399.488,"e":1406.254,"p":false,"h":false},{"t":"神はアッシリアを怒りの杖として用いられますが、アッシリアは自分の力と知恵で勝ったのだと誇り、斧が、自分を振るう方に向かって誇る愚かさだと責められます。","s":1406.472,"e":1418.632,"p":false,"h":false},{"t":"神は、シオンでの御業を終えられた後に、アッシリアの王の高慢な心の実を罰せられます。","s":1418.856,"e":1425.74,"p":false,"h":false},{"t":"アッシリアの軍隊が北から攻め下ってくる行軍が生々しく描かれ、レバノンの高い木が斧で切り倒されるように、高ぶる者は低くされます。","s":1425.96,"e":1436.527,"p":false,"h":false},{"t":"一方、イスラエルの残りの者は、自分を打った者にもう頼らず、力ある神のもとに帰り、海の砂のような民のうち、残りの者だけが帰ってくると言われます。","s":1436.736,"e":1449.183,"p":false,"h":false},{"t":"シオンの住民には、アッシリアを恐れるなと慰められます。","s":1449.408,"e":1453.634,"p":true,"h":false},{"t":"[流れ] - 不義の立法者たちへの災い - 道具にすぎないアッシリアの高ぶりと裁き - 残りの者の帰還と、シオンの民への慰め","s":1454.112,"e":1464.177,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 悪の権力もまた、神の手の中にある道具にすぎないという確信を与えてくれます。","s":1464.624,"e":1474.344,"p":false,"h":false},{"t":"大きな裁きの中でも残りの者を保たれる神の真実さは、新約にも引き継がれます。","s":1474.536,"e":1480.994,"p":true,"h":false}]},{"title":"エッサイの株から出る若枝","audio":"book_2610310202_1.mp3","start":1481.472,"end":1578.456,"dur":97,"segs":[{"t":"エッサイの株から出る若枝","s":1481.472,"e":1483.514,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / ユダに対する裁きとメシアの約束 (1-12章)","s":1484.016,"e":1491.643,"p":true,"h":false},{"t":"[概観] アッシリアの斧で切り倒された大木のようなダビデ王朝の切り株から、エッサイの株に一つの芽が出ます。","s":1492.08,"e":1500.295,"p":false,"h":false},{"t":"主の霊がその上にとどまり、知恵と悟りの霊、思慮と勇気の霊、主を知り、主を畏れる霊です。","s":1500.504,"e":1508.144,"p":false,"h":false},{"t":"その方は、目に見えるところによって裁かず、貧しい者を公正に、柔和な者を正しく裁き、口のむちで地を打ち、唇の息で悪者を殺されます。","s":1508.328,"e":1520.208,"p":false,"h":false},{"t":"狼は小羊とともに宿り、豹は子やぎとともに伏し、子牛と若獅子が共にいて、小さな子がこれらを導く平和の国が来て、海を水が覆うように、主を知る知識が地に満ちます。","s":1520.4,"e":1534.964,"p":false,"h":false},{"t":"エッサイの根が諸国民の旗として立つと、諸国民がそこに集まり、神はアッシリアやエジプトから散らされた残りの民を、新しい出エジプトのようにもう一度集められます。","s":1535.16,"e":1547.811,"p":true,"h":false},{"t":"[流れ] - エッサイの株から出る芽と、聖霊が下られた王 - 公義の統治と平和の国:狼と小羊 - 諸国民の旗と、残りの者の第二の出エジプト","s":1548.384,"e":1560.71,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] ダビデの子孫として来られるメシアを、最も豊かに描いた章です。","s":1561.152,"e":1569.62,"p":false,"h":false},{"t":"この王の統治は、力ではなく、公義と平和によって行われ、その国では諸国民も一つとなります。","s":1569.84,"e":1577.98,"p":true,"h":false}]},{"title":"救いの歌","audio":"book_2610310202_1.mp3","start":1578.456,"end":1671.12,"dur":92.7,"segs":[{"t":"救いの歌","s":1578.456,"e":1579.402,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / ユダに対する裁きとメシアの約束 (1-12章)","s":1580.328,"e":1587.955,"p":true,"h":false},{"t":"[概観] 1章から11章までの結論の役割を果たす、二編の短い賛美です。","s":1588.392,"e":1594.589,"p":false,"h":false},{"t":"その日、民はこう言います。","s":1594.8,"e":1596.952,"p":false,"h":false},{"t":"「主よ、あなたは私に怒りを向けられたのに、その怒りは去り、私を慰めてくださいます。","s":1597.152,"e":1604.327,"p":false,"h":false},{"t":"感謝します」。","s":1604.544,"e":1605.448,"p":false,"h":false},{"t":"神は私の救いであり、私は信頼して恐れない。","s":1606.416,"e":1610.439,"p":false,"h":false},{"t":"主は私の力、私の歌、私の救いとなられたと告白し、喜びのうちに救いの泉から水をくむと言います。","s":1610.64,"e":1619.829,"p":false,"h":false},{"t":"続いて、主に感謝し、御名を呼び、そのなさったことを諸国民の中に知らせよという、宣教的な勧めが出てきます。","s":1620.048,"e":1629.224,"p":false,"h":false},{"t":"シオンの住民に向かって声を張り上げて歌えという命令で終わります。","s":1629.504,"e":1634.375,"p":false,"h":false},{"t":"イスラエルの聖なる方が、あなたがたの中で偉大なお方だからです。","s":1634.592,"e":1639.256,"p":true,"h":false},{"t":"[流れ] - 怒りから慰めへと変わった恵みへの感謝 - 救いの泉から水をくむ - 諸国民に知らせ、シオンで大いに賛美せよという宣言","s":1639.704,"e":1650.104,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 裁きと約束の長い物語が、この賛美で締めくくられます。","s":1650.504,"e":1658.764,"p":false,"h":false},{"t":"私たちが受けた救いは、個人の喜びから始まって、諸国民に向けた証しへとつながるべきであることを示しており、新約の教会の賛美と同じ心です。","s":1658.976,"e":1670.639,"p":true,"h":false}]},{"title":"バビロンに対する裁き","audio":"book_2610310202_1.mp3","start":1671.12,"end":1759.152,"dur":88,"segs":[{"t":"バビロンに対する裁き","s":1671.12,"e":1672.912,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":1673.352,"e":1681.477,"p":true,"h":false},{"t":"[概観] 諸国民への託宣は、バビロンから始まります。","s":1681.896,"e":1685.949,"p":false,"h":false},{"t":"高い山の上に旗を掲げて軍勢を呼び集められると、神が召された勇士たちが遠い国から集まってきます。","s":1686.168,"e":1694.376,"p":false,"h":false},{"t":"主の日が近づいているので、人々は産みの苦しみにある女のように悶えます。","s":1694.592,"e":1700.168,"p":false,"h":false},{"t":"太陽と月と星は光を失い、天は震え、地は揺れ動きます。","s":1700.472,"e":1705.845,"p":false,"h":false},{"t":"神は、高ぶる者の傲慢をやめさせ、銀を尊ばないメディア人を奮い立たせて、バビロンを攻められます。","s":1706.064,"e":1713.878,"p":false,"h":false},{"t":"諸国の誉れ、カルデア人の誇りであったバビロンは、ソドムとゴモラのように人の住まない地となり、野の獣とふくろうだけがそこに住みます。","s":1714.08,"e":1724.215,"p":false,"h":false},{"t":"当時アッシリアが強大であった時代に、はるか後のバビロンの滅亡までも見通した預言です。","s":1724.424,"e":1731.012,"p":true,"h":false},{"t":"[流れ] - 旗を掲げて軍勢を呼び集められる神 - 宇宙的な揺れとして描かれる主の日 - メディアによるバビロンの滅亡と、永遠の荒廃","s":1731.48,"e":1742.259,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 高ぶる文明の力が永遠ではないことを示しています。","s":1742.712,"e":1750.208,"p":false,"h":false},{"t":"バビロンが世の権力の象徴となり、最後の裁きの姿へとつながっていく点が、ヨハネの黙示録と結びつきます。","s":1750.44,"e":1758.699,"p":true,"h":false}]},{"title":"バビロンの王を嘲る歌","audio":"book_2610310202_1.mp3","start":1759.152,"end":1853.616,"dur":94.5,"segs":[{"t":"バビロンの王を嘲る歌","s":1759.152,"e":1761.186,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":1761.624,"e":1769.749,"p":true,"h":false},{"t":"[概観] バビロンへの裁きの後に、イスラエルの回復が約束されます。","s":1770.168,"e":1775.371,"p":false,"h":false},{"t":"ヤコブを憐れみ、再び選び、彼らの地に置かれ、寄留者も彼らに連なります。","s":1775.568,"e":1781.982,"p":false,"h":false},{"t":"続いて、圧制をしていたバビロンの王を嘲る歌が続きます。","s":1782.168,"e":1786.856,"p":false,"h":false},{"t":"むちと杖は折られ、陰府はその王を迎えるためにざわめき、諸王が立ち上がります。","s":1787.064,"e":1793.19,"p":false,"h":false},{"t":"明けの明星、曙の子が天から落ちたのは、心の中で「私は天に上り、神の星々のはるか上に私の王座を据える」と言った高ぶりのためであり、彼は陰府の最も深いところに下ります。","s":1793.4,"e":1808.515,"p":false,"h":false},{"t":"さらに、アッシリアが神の地で砕かれること、ペリシテに対して喜ぶなという警告、そして、主がシオンを築かれたので、苦しむ者がそこに逃れるという言葉が続きます。","s":1808.712,"e":1821.801,"p":true,"h":false},{"t":"[流れ] - ヤコブの回復:寄留者も共に集まる新しい地 - バビロンの王を嘲る歌:陰府に下る高ぶる者 - アッシリアの滅亡とペリシテへの警告","s":1822.344,"e":1834.371,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 自ら神になろうとする高ぶりは、必ず砕かれるという教えです。","s":1834.8,"e":1843.391,"p":false,"h":false},{"t":"一部の箇所は、伝統的にサタンの堕落と結びつけて解釈されることもありますが、本来はバビロンの王の没落を歌ったものです。","s":1843.608,"e":1853.058,"p":true,"h":false}]},{"title":"モアブに対する託宣 (1)","audio":"book_2610310202_1.mp3","start":1853.616,"end":1939.776,"dur":86.2,"segs":[{"t":"モアブに対する託宣 (1)","s":1853.616,"e":1855.882,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":1856.328,"e":1864.453,"p":true,"h":false},{"t":"[概観] モアブへの託宣です。","s":1864.872,"e":1866.911,"p":false,"h":false},{"t":"アルやキルのような町々が一夜のうちに荒らされ、滅びます。","s":1867.104,"e":1871.506,"p":false,"h":false},{"t":"モアブの人々は神殿の丘に上って泣き、ネボとメデバのために嘆き悲しみ、頭をそり、ひげを切り、通りで粗布をまとい、屋上で泣き叫びます。","s":1871.712,"e":1883.35,"p":false,"h":false},{"t":"ヘシュボンとエルアレが叫ぶ声は遠くヤハツにまで聞こえ、モアブの勇士たちまでが震えます。","s":1883.568,"e":1890.082,"p":false,"h":false},{"t":"預言者は「わが心はモアブのために叫ぶ」と述べ、難民たちがツォアルとエグラト・シェリシヤに逃れ、苦労して手に入れた財産を柳の谷川の向こうへと運んでいく様子を描きます。","s":1890.288,"e":1904.284,"p":false,"h":false},{"t":"ディモンの水にも血が満ちているのに、神はさらに大きな災いを加えるという警告で終わります。","s":1904.496,"e":1911.284,"p":true,"h":false},{"t":"[流れ] - 一夜にして崩れ落ちたモアブの町々 - 頭をそり、粗布をまとった嘆き - ツォアルへ向かう難民の行列と、加えられる災い","s":1911.768,"e":1922.385,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 諸国民を裁かれる神の言葉の中にあっても、預言者は異邦人の苦しみに心を動かされます。","s":1922.832,"e":1933.675,"p":false,"h":false},{"t":"裁きを伝える人の悲しみがどのようなものであるべきかを、考えさせられます。","s":1933.896,"e":1939.309,"p":true,"h":false}]},{"title":"モアブに対する託宣 (2)とダビデの王座","audio":"book_2610310202_1.mp3","start":1939.776,"end":2039.616,"dur":99.8,"segs":[{"t":"モアブに対する託宣 (2)とダビデの王座","s":1939.776,"e":1942.991,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":1943.424,"e":1951.549,"p":true,"h":false},{"t":"[概観] モアブの難民たちが、セラからシオンの山へ子羊を送り、避難所を求める場面です。","s":1951.968,"e":1959.057,"p":false,"h":false},{"t":"アルノンの渡し場で、巣を追われて散らされた鳥のように、モアブの女たちが震えます。","s":1959.288,"e":1965.455,"p":false,"h":false},{"t":"モアブはユダに、自分たちをかくまってほしいと頼み、追われた者を守る憐れみを求めます。","s":1965.768,"e":1972.405,"p":false,"h":false},{"t":"そのとき、ダビデの天幕で一つの王座が慈しみによって堅く据えられ、その上に座する方は、真実をもって裁き、公正を求め、義を速やかに行います。","s":1972.608,"e":1985.411,"p":false,"h":false},{"t":"しかし、モアブは高ぶり、傲慢で、怒りの大きい国として知られており、嘆きの声が満ちています。","s":1985.616,"e":1993.517,"p":false,"h":false},{"t":"ヘシュボンとシブマのぶどう畑は枯れ、喜びと楽しみは果樹園から消えます。","s":1993.704,"e":1999.401,"p":false,"h":false},{"t":"神は、ヤゼルのために泣く以上にモアブのために泣かれ、三年のうちにモアブの栄光は衰えると宣言されます。","s":1999.608,"e":2008.041,"p":true,"h":false},{"t":"[流れ] - シオンに避難所を求めるモアブ - 慈しみによって堅く据えられるダビデの王座と、公義の王 - 高ぶるモアブのぶどう畑と、三年後の衰退","s":2008.512,"e":2019.88,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 異邦人がシオンの王に避難所を求める場面は、すべての民がキリストのもとに来る日を、あらかじめ示しています。","s":2020.344,"e":2032.111,"p":false,"h":false},{"t":"避難所を求める者を迎え入れる公義の王の姿は、来られるメシアの人格そのものです。","s":2032.32,"e":2039.1,"p":true,"h":false}]},{"title":"ダマスコとエフライムに対する託宣","audio":"book_2610310202_1.mp3","start":2039.616,"end":2130.72,"dur":91.1,"segs":[{"t":"ダマスコとエフライムに対する託宣","s":2039.616,"e":2042.22,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":2042.64,"e":2050.765,"p":true,"h":false},{"t":"[概観] ダマスコとエフライムへの託宣です。","s":2051.184,"e":2054.167,"p":false,"h":false},{"t":"ダマスコは町ではなくなり、廃墟の山となり、エフライムの要塞も消えます。","s":2054.376,"e":2059.927,"p":false,"h":false},{"t":"ヤコブの栄光は衰え、体は痩せ細り、刈り入れをする者が穂を拾い集めるように、オリーブの木を打った後に、高い枝にわずかな実が残るように、少数だけが残ります。","s":2060.112,"e":2073.387,"p":false,"h":false},{"t":"その日、人々は自分を造られた方を仰ぎ、イスラエルの聖なる方に目を向け、自分の手で造った祭壇やアシェラ像を見なくなります。","s":2073.576,"e":2083.747,"p":false,"h":false},{"t":"彼らは、救いの神を忘れ、力の岩を思い出さなかったからです。","s":2083.968,"e":2088.969,"p":false,"h":false},{"t":"最後に、海の波のようにざわめく多くの民が、神が叱責されると、もみ殻のように散らされ、夕べの恐怖が朝になる前に消え去ると宣言されます。","s":2089.248,"e":2100.827,"p":true,"h":false},{"t":"[流れ] - ダマスコとエフライムの廃墟 - 刈り入れ後に残る穂のような、少数の残りの者 - 救いの岩を忘れた罪と、籾殻のように消える諸国民のざわめき","s":2101.296,"e":2113.384,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 神を忘れることが、すべての不幸の根であるという警告です。","s":2113.824,"e":2121.713,"p":false,"h":false},{"t":"大きな裁きの中でも、少数の者が目を上げて創造主を仰ぐようになるという約束が、希望を与えてくれます。","s":2121.912,"e":2130.262,"p":true,"h":false}]},{"title":"クシュに対する託宣","audio":"book_2610310202_1.mp3","start":2130.72,"end":2214.6,"dur":83.9,"segs":[{"t":"クシュに対する託宣","s":2130.72,"e":2132.305,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":2132.736,"e":2140.861,"p":true,"h":false},{"t":"[概観] クシュ、すなわちエチオピアへの託宣です。","s":2141.28,"e":2144.922,"p":false,"h":false},{"t":"羽音が騒がしい地、川の向こうから、葦で作った舟に乗って海の上に使者を送る国が出てきます。","s":2145.168,"e":2152.754,"p":false,"h":false},{"t":"背が高く肌がなめらかな強い民が、アッシリアに対抗するために、ユダに同盟を求めに来たものと思われます。","s":2153.064,"e":2161.39,"p":false,"h":false},{"t":"神は、全世界が旗とラッパの音を見るだろうと言われ、ご自身は住まいから静かに見守っておられると言われます。","s":2161.584,"e":2169.604,"p":false,"h":false},{"t":"ぶどう畑を剪定するように、刈り入れの前に若枝を切り取り、猛獣や鳥にその死体を食べさせられます。","s":2169.84,"e":2177.865,"p":false,"h":false},{"t":"そのときに、背の高い民が、万軍の主の名のあるシオンの山に贈り物を携えてきます。","s":2178.072,"e":2185.114,"p":true,"h":false},{"t":"[流れ] - 使者を送って同盟を求めるクシュ - 住まいから静かに見守っておられる神の時 - ぶどう畑の剪定のような裁きと、シオンに贈り物を携えるクシュ","s":2185.584,"e":2197.353,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 人間の同盟や外交がどれほど慌ただしくても、歴史の時計は神が握っておられます。","s":2197.776,"e":2207.934,"p":false,"h":false},{"t":"急がずに時を待たれる神を信頼する信仰が、この短い章の核心です。","s":2208.168,"e":2214.122,"p":true,"h":false}]},{"title":"エジプトに対する託宣","audio":"book_2610310202_1.mp3","start":2214.6,"end":2317.584,"dur":103,"segs":[{"t":"エジプトに対する託宣","s":2214.6,"e":2216.4,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":2216.832,"e":2224.957,"p":true,"h":false},{"t":"[概観] エジプトへの託宣です。","s":2225.376,"e":2227.738,"p":false,"h":false},{"t":"主が速い雲に乗ってエジプトに臨まれると、偶像は震え、エジプト人の心は溶けます。","s":2227.944,"e":2234.797,"p":false,"h":false},{"t":"兄弟や隣人が互いに戦う内紛が起こり、残酷な主人が彼らを支配します。","s":2235,"e":2241.263,"p":false,"h":false},{"t":"ナイル川は干上がり、漁師や織物師たちは嘆き、ツォアンの首長たちとファラオの賢い参謀たちは愚かになって、エジプトをよろめかせます。","s":2241.48,"e":2251.956,"p":false,"h":false},{"t":"しかし、この章は裁きで終わりません。","s":2252.232,"e":2255.246,"p":false,"h":false},{"t":"その日、エジプトに、主に誓いを立てる町々が生まれ、エジプトの真ん中に主のための祭壇が築かれ、彼らが圧迫のゆえに叫ぶと、救い主を遣わしてくださいます。","s":2255.424,"e":2268.091,"p":false,"h":false},{"t":"主はエジプトを打たれ、また癒やされ、エジプトからアッシリアへと大路が通じて、両国がともに礼拝します。","s":2268.288,"e":2276.376,"p":false,"h":false},{"t":"ついにイスラエルが、エジプト、アッシリアとともに三つの国となって、地の真ん中で祝福となります。","s":2276.592,"e":2283.983,"p":true,"h":false},{"t":"[流れ] - 雲に乗って臨まれる裁き:内紛、干ばつ、賢者たちの愚かさ - その日、主に仕えるエジプトの町々と祭壇 - エジプト、アッシリア、イスラエルがともに祝福となる驚くべき回復","s":2284.44,"e":2299.88,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] イスラエルの最大の敵であった国々までもが、神の民と呼ばれるという驚くべき約束です。","s":2300.304,"e":2310.496,"p":false,"h":false},{"t":"神の救いの計画が、一つの民族を超えて諸国民を包んでいることを示しています。","s":2310.744,"e":2317.108,"p":true,"h":false}]},{"title":"裸のしるし","audio":"book_2610310202_1.mp3","start":2317.584,"end":2402.376,"dur":84.8,"segs":[{"t":"裸のしるし","s":2317.584,"e":2318.746,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":2319.456,"e":2327.581,"p":true,"h":false},{"t":"[概観] アッシリアの王サルゴンが遣わしたタルタンが、ペリシテのアシュドドを攻めて占領したときのことです。","s":2328,"e":2335.317,"p":false,"h":false},{"t":"神はイザヤに、粗布を脱ぎ、サンダルを脱いで歩くようにと言われ、預言者は三年間、裸、はだしで歩きました。","s":2335.536,"e":2344.092,"p":false,"h":false},{"t":"これはエジプトとクシュに対するしるしであり、予兆であって、アッシリアの王が、エジプトの捕虜とクシュの捕らわれ人を、若者も老人も区別なく、裸、はだしで引いていくという意味です。","s":2344.272,"e":2357.719,"p":false,"h":false},{"t":"アッシリアに対抗するためにエジプトとクシュを頼みにしていた海岸地方の住民は、「私たちが頼みにしていた国がこうなったのだから、どうしてアッシリアから逃れられようか」と嘆くことになります。","s":2357.928,"e":2371.818,"p":true,"h":false},{"t":"[流れ] - アシュドドがアッシリアに陥落するという歴史的背景 - イザヤが三年間示した、裸、はだしのしるし - エジプトとクシュを頼みにしていた者たちの落胆","s":2372.28,"e":2384.113,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 預言者は、言葉だけでなく、生き方のすべてで神のメッセージを証ししました。","s":2384.544,"e":2393.923,"p":false,"h":false},{"t":"この世の国々に頼ることのむなしさと、御言葉のために恥をも忍ぶ従順の重みを、黙想させられます。","s":2394.12,"e":2401.934,"p":true,"h":false}]},{"title":"バビロン、ドマ、アラビアに対する託宣","audio":"book_2610310202_1.mp3","start":2402.376,"end":2502.12,"dur":99.7,"segs":[{"t":"バビロン、ドマ、アラビアに対する託宣","s":2402.376,"e":2405.595,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":2406.024,"e":2414.149,"p":true,"h":false},{"t":"[概観] 三つの短い託宣が続きます。","s":2414.568,"e":2417.769,"p":false,"h":false},{"t":"まず、海の荒れ野についての託宣で、南から吹き荒れるつむじ風のように、エラムとメディアが攻め込んでくる幻がイザヤに臨みます。","s":2417.976,"e":2427.963,"p":false,"h":false},{"t":"彼は産みの苦しみにある女のように苦しみ、驚きます。","s":2428.176,"e":2432.365,"p":false,"h":false},{"t":"一方、バビロンでは宴会を開いて飲み食いしているのに、「盾に油を塗れ」という叫びが聞こえ、見張りの者は「バビロンは陥落した」と叫びます。","s":2432.688,"e":2444.072,"p":false,"h":false},{"t":"続いてドマ(エドム)についての託宣では、セイルから誰かが見張りの者に「夜はどうなっているか」と尋ねると、「朝が来るが、夜もまた来る。","s":2444.304,"e":2454.821,"p":false,"h":false},{"t":"尋ねたければ尋ねよ。","s":2455.008,"e":2456.598,"p":false,"h":false},{"t":"戻ってきなさい」という意味深長な答えが返ってきます。","s":2456.88,"e":2460.821,"p":false,"h":false},{"t":"最後に、アラビアについての託宣で、逃げ回るデダンの隊商に水とパンを持って行けと言われ、一年のうちにケダルの栄光は衰えると宣言されます。","s":2461.032,"e":2472.428,"p":true,"h":false},{"t":"[流れ] - 海の荒れ野:陥落するバビロンと苦しむ預言者 - ドマ:朝が来るが夜も来るという見張りの答え - アラビア:一年のうちに衰えるケダルの栄光","s":2472.912,"e":2484.68,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 世の安逸な宴のただ中で、見張りの者は目を覚ましていなければなりません。","s":2485.104,"e":2494.23,"p":false,"h":false},{"t":"終わりの日が来ることを告げて、人々を立ち返らせる預言者の使命について、考えさせられる章です。","s":2494.416,"e":2501.655,"p":true,"h":false}]},{"title":"幻の谷:エルサレムに対する託宣","audio":"book_2610310202_1.mp3","start":2502.12,"end":2608.464,"dur":106.3,"segs":[{"t":"幻の谷:エルサレムに対する託宣","s":2502.12,"e":2505.174,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":2505.6,"e":2513.725,"p":true,"h":false},{"t":"[概観] エルサレムを「幻の谷」と呼ぶ託宣です。","s":2514.144,"e":2518.508,"p":false,"h":false},{"t":"騒ぎと興奮に満ちた町の屋上に人々が上っていますが、実際に死んだ者たちは剣で死んだのでも戦いで死んだのでもなく、指導者たちが逃げる途中で捕らえられたのだと言います。","s":2518.704,"e":2531.675,"p":false,"h":false},{"t":"敵の侵攻が迫ると、人々はダビデの町の崩れた箇所を点検し、下の池の水を集め、家を壊して城壁を補強することにだけ没頭し、これを行われる神を仰ぎ見ませんでした。","s":2531.88,"e":2545.963,"p":false,"h":false},{"t":"神が「泣き悲しめ」と言われたのに、彼らは牛を屠り、羊を屠り、「明日は死ぬのだから、食べて飲もう」と言います。","s":2546.184,"e":2555.446,"p":false,"h":false},{"t":"続いて、高ぶる宮廷長官シェブナが罷免されて大きな球のように投げ捨てられ、エルヤキムがダビデの家の鍵を受けて、開けると閉じる者がなく、閉じると開ける者がない権威を持ちます。","s":2555.664,"e":2569.292,"p":false,"h":false},{"t":"しかし、釘のように打ち込まれたその上に掛けられたものも、結局は落ちてしまいます。","s":2569.488,"e":2575.699,"p":true,"h":false},{"t":"[流れ] - 幻の谷エルサレムの騒ぎと恐れ - 防衛の準備ばかりして神を仰ぎ見ない、高ぶった享楽 - シェブナの罷免と、エルヤキムに託されたダビデの家の鍵","s":2576.16,"e":2588.484,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 危機の中で、人間の計画は慌ただしいのに、神を仰ぐ目がない姿が警告となります。","s":2588.928,"e":2599.437,"p":false,"h":false},{"t":"開けると閉じる者がいない鍵の権威は、まことのダビデの子孫であるキリストが持っておられる権威を、あらかじめ示す絵です。","s":2599.656,"e":2608.023,"p":true,"h":false}]},{"title":"ツロに対する託宣","audio":"book_2610310202_1.mp3","start":2608.464,"end":2699.688,"dur":91.2,"segs":[{"t":"ツロに対する託宣","s":2608.464,"e":2610.047,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":2610.528,"e":2618.653,"p":true,"h":false},{"t":"[概観] 地中海の海上貿易の中心地であったツロへの託宣です。","s":2619.072,"e":2624.4,"p":false,"h":false},{"t":"タルシシュの船が嘆くのは、ツロが荒らされて港も家もなくなったからです。","s":2624.616,"e":2629.849,"p":false,"h":false},{"t":"シドンの商人たちが海を渡って富を築き、ツロはナイルの穀物で利益を上げて諸国の市場となりましたが、万軍の主は、そのすべての栄華の高ぶりを汚し、地の尊い者たちを低くしようとされます。","s":2630.064,"e":2645.489,"p":false,"h":false},{"t":"ツロの冠をかぶる者たちは姿を消し、船はタルシシュに逃げていきます。","s":2645.76,"e":2651.289,"p":false,"h":false},{"t":"しかし、七十年後、ツロは遊女の歌のように、再び商売を始めます。","s":2651.496,"e":2657.553,"p":false,"h":false},{"t":"ところが、その利益と報酬は、蓄えられたり隠されたりすることなく、主の前に住む者たちが満ち足りて食べ、美しく着るために使われるという、逆転をもって締めくくられます。","s":2657.76,"e":2671.013,"p":true,"h":false},{"t":"[流れ] - 海上貿易都市ツロの没落と、悲しむ港々 - 高ぶる栄華を低くされる神の計画 - 七十年後の回復と、主のために聖別される利益","s":2671.464,"e":2683.562,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 繁栄の絶頂でも、高ぶれば崩れます。","s":2684.064,"e":2690.694,"p":false,"h":false},{"t":"しかし、富は神にささげられるときに初めて真の用いられ方をするということを、最後の逆転が教えてくれます。","s":2690.88,"e":2699.244,"p":true,"h":false}]},{"title":"全地に対する裁き","audio":"book_2610310202_1.mp3","start":2699.688,"end":2794.728,"dur":95,"segs":[{"t":"全地に対する裁き","s":2699.688,"e":2701.4,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":2701.824,"e":2709.949,"p":true,"h":false},{"t":"[概観] 13章から続いた諸国民への託宣が終わり、視線が全地、全世界の裁きへと広がります。","s":2710.368,"e":2718.537,"p":false,"h":false},{"t":"イザヤ書の小黙示録と呼ばれる24章から27章が始まります。","s":2718.744,"e":2724.105,"p":false,"h":false},{"t":"主が地を荒れ果てさせられるので、民と祭司、僕と主人、買う者と売る者の区別なく、同じ運命を迎えます。","s":2724.336,"e":2733.233,"p":false,"h":false},{"t":"その理由は、地が律法を犯し、掟に背き、永遠の契約を破ったからです。","s":2733.432,"e":2739.871,"p":false,"h":false},{"t":"ぶどう酒は嘆き、心楽しい者たちは悲しみ、町は崩れて廃墟となります。","s":2740.056,"e":2746.356,"p":false,"h":false},{"t":"しかし、残りの者たちは、東の方、海の島々で声を上げて主をたたえます。","s":2746.584,"e":2753.024,"p":false,"h":false},{"t":"天の軍勢と地上の王たちが牢に閉じ込められ、月は恥じ、太陽は辱められる中で、万軍の主がシオンの山で王として治められます。","s":2753.232,"e":2764.035,"p":true,"h":false},{"t":"[流れ] - 全地に臨む普遍的な裁き:身分の区別はない - 永遠の契約を破った罪と、その結果としての荒廃 - 残りの者の賛美と、シオンの山で統治される主の栄光","s":2764.488,"e":2778.207,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 一つの国ではなく、全世界が神の前に立つ終わりの日の姿です。","s":2778.648,"e":2787.613,"p":false,"h":false},{"t":"裁きの果てに、王である神の統治が現れるという事実が、希望の根拠となります。","s":2787.816,"e":2794.269,"p":true,"h":false}]},{"title":"山の上の宴と死の滅絶","audio":"book_2610310202_1.mp3","start":2794.728,"end":2892.096,"dur":97.4,"segs":[{"t":"山の上の宴と死の滅絶","s":2794.728,"e":2797.07,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":2797.512,"e":2805.637,"p":true,"h":false},{"t":"[概観] 前の章の裁きに続く、感謝の歌です。","s":2806.056,"e":2809.996,"p":false,"h":false},{"t":"「主は私の神。","s":2810.208,"e":2811.524,"p":false,"h":false},{"t":"私はあなたをあがめ、御名をたたえます」。","s":2812.08,"e":2815.243,"p":false,"h":false},{"t":"昔から立てておられた計画が、真実に、まことに成し遂げられたからです。","s":2815.536,"e":2820.985,"p":false,"h":false},{"t":"高ぶる都は瓦礫の山となりましたが、貧しい者のとりで、苦しむ者のとりで、嵐を避ける場所となってくださった神を歌います。","s":2821.176,"e":2830.996,"p":false,"h":false},{"t":"続いて、この山で、すべての民のために、肥えた肉と熟成させたぶどう酒の宴を催し、すべての民を覆うベールと覆いを取り除き、死を永遠に滅ぼされるという驚くべき約束が語られます。","s":2831.208,"e":2846.624,"p":false,"h":false},{"t":"主なる神は、すべての顔から涙をぬぐい、御自分の民の恥を全地から取り去られます。","s":2846.832,"e":2853.596,"p":false,"h":false},{"t":"その日、人々は「この方こそ、私たちが待ち望んだ神だ」と言います。","s":2853.816,"e":2859.591,"p":true,"h":false},{"t":"[流れ] - 昔の計画の真実さをたたえる歌 - 貧しい者のとりでである神 - シオンの山での、すべての民のための宴と、死の滅絶、涙をぬぐわれること","s":2860.032,"e":2872.334,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 死が永遠に呑み込まれ、涙がぬぐわれるという約束は、聖書全体の中でも最も温かい希望の一つです。","s":2872.8,"e":2884.753,"p":false,"h":false},{"t":"復活と新しい創造の希望が、この旧約の宣言の上で、より鮮明になります。","s":2884.968,"e":2891.631,"p":true,"h":false}]},{"title":"救いの歌","audio":"book_2610310202_1.mp3","start":2892.096,"end":2993.352,"dur":101.3,"segs":[{"t":"救いの歌","s":2892.096,"e":2893.042,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":2893.968,"e":2902.093,"p":true,"h":false},{"t":"[概観] その日にユダの地で歌われる歌が続きます。","s":2902.512,"e":2906.141,"p":false,"h":false},{"t":"「私たちには堅固な町がある。","s":2906.352,"e":2908.567,"p":false,"h":false},{"t":"救いを城壁とし、とりでとしてくださる」、門を開いて、信仰を守る正しい国民を入らせよと言います。","s":2908.776,"e":2916.702,"p":false,"h":false},{"t":"心の堅固な者を、平安に平安を重ねて守られるのは、その人が主に信頼しているからだと語り、主を永遠に信頼しなさいと勧めます。","s":2916.912,"e":2927.739,"p":false,"h":false},{"t":"主は永遠の岩だからです。","s":2927.928,"e":2929.92,"p":false,"h":false},{"t":"正しい人の道は平らであり、民は主の裁きの道で主を待ち望み、慕います。","s":2930.112,"e":2936.452,"p":false,"h":false},{"t":"主の裁きが地に臨むとき、世界の住民は義を学ぶと歌います。","s":2936.832,"e":2941.816,"p":false,"h":false},{"t":"続いて、死者が生き返り、塵の中に伏す者たちが目覚めて喜び歌うという、復活の希望が宣言されます。","s":2942.04,"e":2950.491,"p":false,"h":false},{"t":"最後には、「わが民よ、行って奥の間に入り、戸を閉ざし、憤りが過ぎ去るまで、しばらく身を隠せ」という勧めが出てきます。","s":2950.68,"e":2961.207,"p":true,"h":false},{"t":"[流れ] - 堅固な町と、信仰を守る正しい国民 - 心の堅固な者の平安:永遠の岩に信頼する - 死者の復活と、怒りが過ぎ去るまでの身を隠すこと","s":2961.672,"e":2974.092,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 平安は環境からではなく、神への揺るぎない信頼から生まれます。","s":2974.536,"e":2983.049,"p":false,"h":false},{"t":"死者が生き返るという宣言は、旧約の中で復活を最も明確に語る箇所の一つで、新約の復活の希望につながります。","s":2983.248,"e":2992.898,"p":true,"h":false}]},{"title":"レビヤタンの裁きとイスラエルの回復","audio":"book_2610310202_1.mp3","start":2993.352,"end":3096.552,"dur":103.2,"segs":[{"t":"レビヤタンの裁きとイスラエルの回復","s":2993.352,"e":2996.153,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 諸国民への託宣と小黙示録 (13-27章)","s":2996.568,"e":3004.693,"p":true,"h":false},{"t":"[概観] その日、主は、鋭く大きく強い剣で、レビヤタン、すなわち逃げる蛇、曲がりくねる蛇を罰し、海にいる竜を殺されます。","s":3005.112,"e":3015.713,"p":false,"h":false},{"t":"続いて、5章の悲しいぶどう畑の歌と対比をなす、新しいぶどう畑の歌が出てきます。","s":3015.984,"e":3023.137,"p":false,"h":false},{"t":"麗しいぶどう畑があり、主が見守る者となって、折々に水を注ぎ、昼も夜も見守られます。","s":3023.352,"e":3031.049,"p":false,"h":false},{"t":"「私に憤りはない」と言われ、いばらやあざみが私に向かってくるなら、共に焼き尽くそうと言われ、むしろ私と和を結べと招かれます。","s":3031.32,"e":3041.384,"p":false,"h":false},{"t":"やがて、ヤコブが根を張り、イスラエルが芽を出して花を咲かせ、その実は世界に満ちます。","s":3041.568,"e":3048.508,"p":false,"h":false},{"t":"神はイスラエルを懲らしめられるが、罪は赦され、ついに大きな角笛が吹き鳴らされ、アッシリアの地で滅びようとしていた者や、エジプトの地に追われていた者たちが来て、エルサレムの聖なる山で主を礼拝します。","s":3048.72,"e":3063.958,"p":true,"h":false},{"t":"[流れ] - 悪の勢力の象徴であるレビヤタンの滅亡 - 喜びのぶどう畑の歌:5章からの逆転 - 散らされた者たちが大きな角笛の音とともに集まり、シオンで礼拝する","s":3064.44,"e":3077.758,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 悲しいぶどう畑が喜びのぶどう畑へと変わる逆転は、神が最後までイスラエルを見捨てられないという約束です。","s":3078.192,"e":3090.138,"p":false,"h":false},{"t":"主人が自ら見守られるぶどう畑で、私たちが実を結ぶ道が開かれます。","s":3090.36,"e":3096.085,"p":true,"h":false}]},{"title":"エフライムの酔いどれと尊い隅の石","audio":"book_2610310202_1.mp3","start":3096.552,"end":3208.272,"dur":111.7,"segs":[{"t":"エフライムの酔いどれと尊い隅の石","s":3096.552,"e":3099.485,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 災いと回復の約束 (28-35章)","s":3099.936,"e":3107.562,"p":true,"h":false},{"t":"[概観] 「災いあれ」で始まる宣言が続く、28章から35章が始まります。","s":3108,"e":3114.651,"p":false,"h":false},{"t":"エフライムの酔いどれたちの高ぶる冠、すなわちサマリアが、しおれる花のように衰え、アッシリアの雹と嵐に踏みにじられます。","s":3114.84,"e":3124.101,"p":false,"h":false},{"t":"残りの民には、主が栄光の冠となられますが、ユダの祭司と預言者も、強い酒でよろめき、幻と判断で誤ります。","s":3124.32,"e":3133.898,"p":false,"h":false},{"t":"御言葉を教えようとする預言者を嘲り、乳離れした子に教えるように、教えに教え、戒めに戒めを重ねて教えるのかとあざける者たちに、神は、異国の唇と異なる言葉で語られると答えられます。","s":3134.088,"e":3150.395,"p":false,"h":false},{"t":"偽りを避け所とし、死と結んだ契約は破棄され、神がシオンに、試された石、尊く堅固な礎の石を据えられたと言われます。","s":3150.6,"e":3161.115,"p":false,"h":false},{"t":"信じる者は慌てません。","s":3161.328,"e":3163.134,"p":false,"h":false},{"t":"最後に、農夫が時にかなって畑を耕し、種をまき、脱穀するように、神の摂理も賢いというたとえで締めくくります。","s":3163.32,"e":3173.231,"p":true,"h":false},{"t":"[流れ] - エフライムの酔いどれの高ぶる冠の没落 - 御言葉を嘲る指導者たちと、偽りの避け所 - シオンに据えられた尊い隅の石:信じる者は慌てない - 農夫のたとえに表れる、神の賢い摂理","s":3173.712,"e":3189.292,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 隅の石であるキリストを信じる者は恥を受けないという御言葉が、新約で繰り返し引用されます。","s":3189.744,"e":3200.72,"p":false,"h":false},{"t":"神の時と方法を信頼する信仰が、急がない平安を与えてくれることを黙想させられます。","s":3200.928,"e":3207.788,"p":true,"h":false}]},{"title":"アリエルに対する災いと唇による尊敬","audio":"book_2610310202_1.mp3","start":3208.272,"end":3323.544,"dur":115.3,"segs":[{"t":"アリエルに対する災いと唇による尊敬","s":3208.272,"e":3211.735,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 災いと回復の約束 (28-35章)","s":3212.184,"e":3219.81,"p":true,"h":false},{"t":"[概観] アリエル、すなわちダビデが陣を敷いた町エルサレムに、災いが宣告されます。","s":3220.248,"e":3226.684,"p":false,"h":false},{"t":"毎年祭りは巡ってきますが、神が町を包囲されるので、民は悲しみ嘆くことになります。","s":3226.896,"e":3233.95,"p":false,"h":false},{"t":"しかし、突然、一瞬のうちに、万軍の主が雷と地震と大きな声をもって臨まれ、アリエルを攻めていたすべての国民が、夜の幻のように消え去ります。","s":3234.168,"e":3246.683,"p":false,"h":false},{"t":"民は驚いて目が見えなくなり、酔ったようになりますが、それは酒のためではなく、主が深い眠りを注がれたからです。","s":3246.888,"e":3255.476,"p":false,"h":false},{"t":"封じられた書物の言葉を読むことができず、口では近づくが心は遠く離れ、人間の戒めを教えて、敬うふりをする信仰が責められます。","s":3255.696,"e":3266.699,"p":false,"h":false},{"t":"自分の計画を神から隠そうとする者たち、陶工を粘土のように見なす高ぶる者たちに災いが宣告され、最後には、耳の聞こえない者が書物の言葉を聞き、目の見えない者の目が暗闇の中から見るという回復が約束されます。","s":3266.904,"e":3284.468,"p":true,"h":false},{"t":"[流れ] - アリエルの包囲と、突然の救い - 唇だけで尊敬する信仰と、霊的に目の見えない指導者たち - 陶工と粘土のたとえ:創造主に教えようとする高ぶり - 耳の聞こえない者が聞き、目の見えない者が見る回復の日","s":3284.928,"e":3302.845,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 心は遠く離れているのに唇だけで行う礼拝を責められたこの御言葉を、イエス様も引用されました。","s":3303.264,"e":3314.698,"p":false,"h":false},{"t":"へりくだる者が、イスラエルの聖なる方によって喜ぶという最後の場面が、真の信仰の方向を示しています。","s":3314.928,"e":3323.071,"p":true,"h":false}]},{"title":"エジプトに頼ることへの叱責","audio":"book_2610310202_1.mp3","start":3323.544,"end":3414.912,"dur":91.4,"segs":[{"t":"エジプトに頼ることへの叱責","s":3323.544,"e":3325.776,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 災いと回復の約束 (28-35章)","s":3326.232,"e":3333.858,"p":true,"h":false},{"t":"[概観] 逆らう子らに災いが宣告されます。","s":3334.296,"e":3337.635,"p":false,"h":false},{"t":"神に尋ねもせずにエジプトに下って行き、ファラオの陰に身を避けようとしますが、それはむしろ恥となります。","s":3337.824,"e":3345.715,"p":false,"h":false},{"t":"民が預言者に、耳に心地よいことだけを語れと要求すると、神は、「立ち帰って静かにしていれば救われ、落ち着いて信頼していることにこそ、あなたがたの力がある」と言われます。","s":3345.936,"e":3359.612,"p":false,"h":false},{"t":"しかし、民は「いや、馬に乗って逃げよう」と言います。","s":3359.832,"e":3364.248,"p":false,"h":false},{"t":"それでも主は、恵みを施そうと待っておられ、シオンに住む民に、「これが道だ。","s":3364.464,"e":3370.573,"p":false,"h":false},{"t":"これに歩め」という師の声を聞かせてくださいます。","s":3370.752,"e":3374.492,"p":false,"h":false},{"t":"アッシリアは、主の息に焼かれて消え去ります。","s":3374.688,"e":3377.977,"p":true,"h":false},{"t":"[流れ] - 神に尋ねずにエジプトの陰に逃れる、逆らう子ら - 静かにして信頼せよという招きと、それを拒む民 - 恵みを施そうと待っておられる神と、正しい道を教える師の声 - アッシリアの滅亡","s":3378.432,"e":3394.174,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 立ち帰って静かに神を信頼することが力だという御言葉は、忙しい信仰生活を送る私たちにとって、大切な焦点です。","s":3394.608,"e":3408.212,"p":false,"h":false},{"t":"救いを拒む人を待って恵みを施そうとされる神の姿が、福音の心です。","s":3408.408,"e":3414.452,"p":true,"h":false}]},{"title":"エジプトの馬と戦車に頼る者に災いあれ","audio":"book_2610310202_1.mp3","start":3414.912,"end":3517.68,"dur":102.8,"segs":[{"t":"エジプトの馬と戦車に頼る者に災いあれ","s":3414.912,"e":3418.227,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 災いと回復の約束 (28-35章)","s":3418.68,"e":3426.306,"p":true,"h":false},{"t":"[概観] 助けを得ようとエジプトに下っていく者たちに災いが宣告されます。","s":3426.744,"e":3432.219,"p":false,"h":false},{"t":"彼らは馬に頼り、戦車が多く、騎兵が非常に強いことを信じながら、イスラエルの聖なる方を仰がず、主を求めません。","s":3432.504,"e":3442.219,"p":false,"h":false},{"t":"神もまた知恵ある方であり、災いをもたらし、御言葉を取り消されることなく、悪を行う者の家と、悪を行う者を助ける者を打たれます。","s":3442.392,"e":3453.364,"p":false,"h":false},{"t":"「エジプト人は人であって神ではなく、その馬は肉であって霊ではない」という宣言が続きます。","s":3453.648,"e":3460.687,"p":false,"h":false},{"t":"主が御手を伸ばされると、助ける者もつまずき、助けられる者も倒れます。","s":3460.872,"e":3466.412,"p":false,"h":false},{"t":"獅子が獲物をつかみ、羊飼いの群れがどれほど大声を上げても恐れないように、万軍の主はシオンのために戦われ、翼を広げる鳥のようにエルサレムを守り、救い出されます。","s":3466.608,"e":3479.875,"p":false,"h":false},{"t":"それゆえ、「あなたがたがひどく背いた方のもとに立ち帰れ」と言われ、偶像を捨てるよう求められます。","s":3480.072,"e":3487.273,"p":true,"h":false},{"t":"[流れ] - 馬と戦車に頼って、主を求めない者たち - エジプト人は人にすぎず、神ではないという宣言 - 獅子と鳥のたとえ:エルサレムを守られる主 - 立ち帰りへの招きと、偶像を捨てる日","s":3487.752,"e":3502.201,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 何に頼るのかが、信仰の核心となる問いです。","s":3502.656,"e":3509.895,"p":false,"h":false},{"t":"目に見える力が大きくても、神に取って代わることはできないということを、明確に語る章です。","s":3510.096,"e":3517.21,"p":true,"h":false}]},{"title":"義をもって治める王と聖霊の注ぎ","audio":"book_2610310202_1.mp3","start":3517.68,"end":3615.504,"dur":97.8,"segs":[{"t":"義をもって治める王と聖霊の注ぎ","s":3517.68,"e":3520.436,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 災いと回復の約束 (28-35章)","s":3520.872,"e":3528.498,"p":true,"h":false},{"t":"[概観] ここで、一人の王が義をもって治め、高官たちが公正をもって支配するという約束で始まります。","s":3528.936,"e":3536.982,"p":false,"h":false},{"t":"その方は、風を避ける場所のようであり、嵐を避ける場所のようであり、乾いた地の水の流れのようであり、疲れた地の大きな岩の陰のようです。","s":3537.192,"e":3548.177,"p":false,"h":false},{"t":"その統治のもとでは、見る者の目はふさがれず、聞く者の耳は傾けられ、愚か者が再び高貴な者と呼ばれることはありません。","s":3548.496,"e":3558.172,"p":false,"h":false},{"t":"一方、安逸をむさぼる女たちには、一年あまり後には、ぶどうの収穫がなく、震えることになると警告し、いばらとあざみが生える廃墟を見つめさせます。","s":3558.36,"e":3570.446,"p":false,"h":false},{"t":"しかし、上から霊が注がれると、荒れ野は果樹園となり、公正が宿り、義の実は平和、その結果は、とこしえの平穏と安全です。","s":3570.768,"e":3581.633,"p":false,"h":false},{"t":"この平和な住まいで、民は安全な家に静かに憩います。","s":3581.832,"e":3586.435,"p":true,"h":false},{"t":"[流れ] - 義をもって治める王と、避け所のような統治 - 安逸をむさぼる女たちへの警告 - 上から霊が注がれるとき:荒れ野が果樹園に変わる - 義の実である平和と安全","s":3586.896,"e":3600.371,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] メシアが治められる国は、義と平和が実を結ぶ国です。","s":3600.84,"e":3608.716,"p":false,"h":false},{"t":"聖霊が注がれるという約束は、ペンテコステの聖霊降臨で成就し始めました。","s":3608.904,"e":3615.055,"p":true,"h":false}]},{"title":"裁き主、立法者、王である主","audio":"book_2610310202_1.mp3","start":3615.504,"end":3731.76,"dur":116.3,"segs":[{"t":"裁き主、立法者、王である主","s":3615.504,"e":3618.44,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 災いと回復の約束 (28-35章)","s":3618.888,"e":3626.514,"p":true,"h":false},{"t":"[概観] 自分は虐げられていないのに虐げる者、すなわちアッシリアに災いが宣告されます。","s":3626.952,"e":3633.811,"p":false,"h":false},{"t":"民は、「主よ、私たちに恵みを施してください。","s":3634.032,"e":3637.912,"p":false,"h":false},{"t":"私たちはあなたを待ち望みます。","s":3638.112,"e":3640.588,"p":false,"h":false},{"t":"朝ごとに私たちの腕となり、苦難の時に私たちの救いとなってください」と祈ります。","s":3640.776,"e":3647.213,"p":false,"h":false},{"t":"神が今立ち上がり、今御自身を現されると、アッシリアは籾殻をはらみ、刈り株を産み、自分の息が火となって、自らを焼き尽くします。","s":3647.4,"e":3658.514,"p":false,"h":false},{"t":"シオンの罪人たちは恐れおののき、「誰が焼き尽くす火のそばに住めるだろうか」と問いますが、ただ、正しく歩み、真実を語り、不正な利得を忌み嫌い、賄賂を拒む者だけが、高い所に住み、岩の砦がその者の避け所となります。","s":3658.704,"e":3677.238,"p":false,"h":false},{"t":"その目は、麗しい王の姿を見、はるかに広がる地を見ます。","s":3677.448,"e":3682.35,"p":false,"h":false},{"t":"「主は私たちの裁き主、私たちの立法者、私たちの王。","s":3682.632,"e":3687.578,"p":false,"h":false},{"t":"主ご自身が私たちを救われる」という告白で結ばれ、そこに住む者は「私は病気だ」と言わず、罪が赦されます。","s":3687.768,"e":3697.388,"p":true,"h":false},{"t":"[流れ] - 虐げる者に宣告された災いと、恵みを求める祈り - 立ち上がられた主の前で焼かれるアッシリア - 焼き尽くす火のそばに住む者:正しく歩む者 - 裁き主、立法者、王である主","s":3697.824,"e":3712.373,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 神は私たちの裁き主であり、律法を与えてくださる方であり、王であられます。","s":3712.8,"e":3722.196,"p":false,"h":false},{"t":"この三つが一人の方の中で私たちを救いへと導かれるので、この宣言はシオンの民の最も力強い告白です。","s":3722.4,"e":3731.165,"p":true,"h":false}]},{"title":"諸国民とエドムに対する裁き","audio":"book_2610310202_1.mp3","start":3731.76,"end":3833.616,"dur":101.9,"segs":[{"t":"諸国民とエドムに対する裁き","s":3731.76,"e":3734.31,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 災いと回復の約束 (28-35章)","s":3734.736,"e":3742.362,"p":true,"h":false},{"t":"[概観] すべての国々とすべての民に、近づいて聞けという呼びかけで始まる、裁きの宣言です。","s":3742.8,"e":3750.367,"p":false,"h":false},{"t":"主はすべての国に対して怒り、天の万象は朽ち果て、天は巻物のように巻かれます。","s":3750.552,"e":3757.28,"p":false,"h":false},{"t":"神の剣が天で酔うほど飲んだ後、エドムの上に下って裁かれ、ボツラでいけにえがささげられ、エドムの地で大きな殺戮が行われます。","s":3757.488,"e":3767.627,"p":false,"h":false},{"t":"これは主の報復の日、シオンの訴えを弁護される年です。","s":3767.832,"e":3772.136,"p":false,"h":false},{"t":"エドムの川はピッチとなり、塵は硫黄となり、地は燃えるピッチとなって、永遠に煙が上り、代々にわたって荒れ果てます。","s":3772.32,"e":3781.524,"p":false,"h":false},{"t":"いばらが宮殿を覆い、ふくろうやからす、山犬やだちょうの住みかとなり、混沌の測り縄と虚無のおもりが下ろされます。","s":3781.752,"e":3790.33,"p":false,"h":false},{"t":"「主の書を調べて読んでみよ」という言葉で結ばれるのは、神が口で命じられたことは、一つも欠けることなく成就するという意味です。","s":3790.536,"e":3800.425,"p":true,"h":false},{"t":"[流れ] - 諸国民に向けた法廷の召集と、天が巻物のように巻かれること - エドムに下される裁きの剣 - 永遠に荒れ果てる地と、主の書に記された言葉の確かさ","s":3800.928,"e":3813.611,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] この章は、1章から続いた裁きの宣告の頂点であり、すぐ後の35章が示す、贖われた者たちの回復と劇的な対比をなします。","s":3814.056,"e":3828.921,"p":false,"h":false},{"t":"神の裁きは、不義を放置されない公義の結果です。","s":3829.128,"e":3833.175,"p":true,"h":false}]},{"title":"荒れ野に咲く花と聖なる道","audio":"book_2610310202_1.mp3","start":3833.616,"end":3944.256,"dur":110.6,"segs":[{"t":"荒れ野に咲く花と聖なる道","s":3833.616,"e":3835.786,"p":true,"h":false},{"t":"[位置] 1-39章 裁きと警告 / 災いと回復の約束 (28-35章)","s":3836.232,"e":3843.858,"p":true,"h":false},{"t":"[概観] 荒れ果てた荒れ野と乾いた地が喜び、砂漠がサフランのように咲いて大いに喜び、歌います。","s":3844.296,"e":3852.224,"p":false,"h ス","s":833.424,"e":837.193,"p":true,"h":false},{"t":"[位置] 40-66章 慰めと救い / 捕囚からの帰還の約束と偶像批判 (40-48章)","s":837.648,"e":846.202,"p":true,"h":false},{"t":"[概観] 「ヤコブよ、恐れるな。","s":846.648,"e":849.02,"p":false,"h":false},{"t":"渇いた者に水を注ぐように、わたしの霊をあなたの子孫に注ぐ。","s":849.192,"e":854.285,"p":false,"h":false},{"t":"彼らは、流れのほとりの柳のように芽生える」と言われます。","s":854.472,"e":858.771,"p":false,"h":false},{"t":"神は初めであり終わりであり、「わたしのほかに神はいない」と宣言され、偶像を造る者たちの愚かさを風刺されます。","s":858.96,"e":867.933,"p":false,"h":false},{"t":"同じ木で火をたいて体を温め、食べ物を焼き、残りで神像を造って、「私を救ってください」と言ってひれ伏す姿です。","s":868.152,"e":878.004,"p":false,"h":false},{"t":"「背きを濃い雲のように、罪を霧のように消し去った。","s":878.208,"e":882.436,"p":false,"h":false},{"t":"わたしに立ち帰れ」と言われ、天と地が歌うように呼びかけられます。","s":882.6,"e":887.41,"p":false,"h":false},{"t":"最後に、キュロスに向かって、「あなたはわたしの牧者」と言われ、エルサレムが再建され、神殿の基が据えられると予告されます。","s":887.616,"e":897.186,"p":true,"h":false},{"t":"[流れ] - 霊を注がれる約束と、流れのほとりの柳のような子孫 - 初めであり終わりである神と、偶像を造る者への風刺 - 背きを雲のように消し去る贖い - キュロスによるエルサレムの再建と神殿再建の預言","s":897.672,"e":914.435,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 神が霊を注がれるという約束は、新約の聖霊降臨につながります。","s":914.904,"e":923.725,"p":false,"h":false},{"t":"木切れで神を造るという風刺は、今も私たちの心に簡単に居座る新しい偶像を、振り返らせます。","s":923.952,"e":932.016,"p":true,"h":false}]},{"title":"油注がれたキュロス","audio":"book_2610310202_2.mp3","start":932.472,"end":1048.752,"dur":116.3,"segs":[{"t":"油注がれたキュロス","s":932.472,"e":934.087,"p":true,"h":false},{"t":"[位置] 40-66章 慰めと救い / 捕囚からの帰還の約束と偶像批判 (40-48章)","s":934.536,"e":943.09,"p":true,"h":false},{"t":"[概観] 神は、異邦の王キュロスを「わたしが油を注いだ者」と呼び、その右手を取って、諸国民を彼の前に降伏させられます。","s":943.536,"e":954.225,"p":false,"h":false},{"t":"青銅の扉を砕き、鉄のかんぬきをへし折って、暗い所の宝を与えられるのは、イスラエルの神、主が、彼を指名して呼んだことを知らせるためです。","s":954.432,"e":966.047,"p":false,"h":false},{"t":"「わたしは光を造り、闇を創造し、平和をつくり、災いを創造する。","s":966.264,"e":972.253,"p":false,"h":false},{"t":"わたしは主、これらすべてを行う者」という宣言が続きます。","s":972.456,"e":977.344,"p":false,"h":false},{"t":"土の器が陶工に向かって「あなたは何を作っているのか」と問い詰めるのは愚かです。","s":977.544,"e":984.289,"p":false,"h":false},{"t":"神はキュロスを奮い立たせ、代価も報酬もなしに、捕虜を解放させられます。","s":984.504,"e":990.229,"p":false,"h":false},{"t":"「あなたはまことに、御自身を隠される神、イスラエルの救い主」という告白も出てきます。","s":990.456,"e":997.269,"p":false,"h":false},{"t":"最後に、地の果てのすべての民に、「わたしを仰ぎ見て、救われよ」と言われ、「わたしにすべての膝はかがみ、すべての舌は誓う」という誓いを立てられます。","s":997.536,"e":1009.674,"p":true,"h":false},{"t":"[流れ] - 油注がれた異邦の王キュロスを奮い立たせられる神 - 光と闇、平和と災いを造られる唯一の創造主 - 陶工と粘土のたとえと、捕虜を解放される救い - 地の果てのすべての民への救いの招きと、すべての膝がかがむという約束","s":1010.136,"e":1028.94,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 神は、知らない異邦の王までも、ご自分の計画のために用いられます。","s":1029.36,"e":1038.241,"p":false,"h":false},{"t":"すべての膝がかがみ、すべての舌が告白する日は、新約でキリストに適用され、この方が万物の主であることを宣言しています。","s":1038.456,"e":1048.273,"p":true,"h":false}]},{"title":"重荷となった偶像、懐に抱かれる神","audio":"book_2610310202_2.mp3","start":1048.752,"end":1158,"dur":109.2,"segs":[{"t":"重荷となった偶像、懐に抱かれる神","s":1048.752,"e":1052.122,"p":true,"h":false},{"t":"[位置] 40-66章 慰めと救い / 捕囚からの帰還の約束と偶像批判 (40-48章)","s":1052.544,"e":1061.098,"p":true,"h":false},{"t":"[概観] バビロンの神ベルがうずくまり、ネボがかがむと、その偶像は、獣や家畜に載せられて運ばれる荷物となります。","s":1061.544,"e":1070.572,"p":false,"h":false},{"t":"神というものが、人間が担いで運ばなければならない重い荷物だというのです。","s":1070.784,"e":1076.459,"p":false,"h":false},{"t":"一方、主は、胎内にいるときから今まで、抱き、背負い、救い出される方です。","s":1076.712,"e":1083.014,"p":false,"h":false},{"t":"「あなたがたが年老いて白髪になっても、わたしは背負う。","s":1083.216,"e":1086.996,"p":false,"h":false},{"t":"わたしが造ったのだから、わたしが抱き、背負い、救い出す」という約束が出てきます。","s":1087.2,"e":1093.626,"p":false,"h":false},{"t":"神は、金を注ぎ出して神像を造り、担ぎ上げて据える人々をご覧になって、「わたしを誰になぞらえようとするのか」と問われます。","s":1093.824,"e":1103.69,"p":false,"h":false},{"t":"初めから終わりを告げ、まだなされていないことを昔から示し、「わたしの計画は成就し、わたしの望むことをすべて成し遂げる」と言われます。","s":1103.904,"e":1114.109,"p":false,"h":false},{"t":"東から猛禽を呼び、わたしの計画を成し遂げさせるという約束とともに、かたくなな心の者たちにも、「わたしの義は近づいている」と言われます。","s":1114.296,"e":1125.342,"p":true,"h":false},{"t":"[流れ] - 獣に載せられて運ばれるバビロンの偶像 - 胎内から白髪になるまで背負い、抱かれる神 - 初めから終わりをご存じで、必ず成し遂げられる計画","s":1125.816,"e":1137.328,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 人が神を担いで歩くのではなく、神が私たちを担いで歩かれるという対比が、この章の最大の慰めです。","s":1137.768,"e":1149.946,"p":false,"h":false},{"t":"年老いて白髪になっても変わらずに抱いてくださる守りが、晩年の信仰に特に大きな力を与えます。","s":1150.152,"e":1157.428,"p":true,"h":false}]},{"title":"バビロンの没落","audio":"book_2610310202_2.mp3","start":1158,"end":1266.672,"dur":108.7,"segs":[{"t":"バビロンの没落","s":1158,"e":1159.37,"p":true,"h":false},{"t":"[位置] 40-66章 慰めと救い / 捕囚からの帰還の約束と偶像批判 (40-48章)","s":1159.872,"e":1168.426,"p":true,"h":false},{"t":"[概観] 「おとめバビロンの娘よ、降りて、塵の上に座れ」という、嘲りを含んだ裁きの宣言です。","s":1168.872,"e":1177.284,"p":false,"h":false},{"t":"バビロンは、もはや諸国の女主人と呼ばれることはなく、臼をひき、ベールを脱ぎ、裾をからげて、川を渡らなければなりません。","s":1177.56,"e":1187.5,"p":false,"h":false},{"t":"神はイスラエルに怒って、バビロンの手に渡されましたが、バビロンは憐れみを示さず、年老いた者にも重いくびきを負わせました。","s":1187.688,"e":1197.381,"p":false,"h":false},{"t":"バビロンは、心の中で、「私はとこしえに女主人」と言い、「私だけ、私のほかには誰もいない」と言って、安心して座っていました。","s":1197.576,"e":1208.373,"p":false,"h":false},{"t":"しかし、一瞬のうちに、子を失うことと、やもめになることが突然臨みます。","s":1208.568,"e":1214.65,"p":false,"h":false},{"t":"呪文や多くの魔術、星を観察する者や占星術師も、炎の前のわらのように、自分を救うことができません。","s":1214.856,"e":1223.869,"p":false,"h":false},{"t":"生涯をかけて取引をしていた者たちも、それぞれ自分の道へと散っていき、誰も助けてくれません。","s":1224.048,"e":1231.536,"p":true,"h":false},{"t":"[流れ] - 女主人の座から塵へと降りるバビロン - 憐れみのない圧制と、「私のほかには誰もいない」という高ぶり - 占星術や呪術が役に立たない突然の没落","s":1231.992,"e":1244.698,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 「私だけ、私のほかには誰もいない」という高ぶりは、神の座を奪おうとする人間の最も根本的な罪です。","s":1245.12,"e":1257.51,"p":false,"h":false},{"t":"バビロンの没落は、この世の権力が最後には崩れるという預言であり、黙示録のバビロンの裁きにつながります。","s":1257.72,"e":1266.184,"p":true,"h":false}]},{"title":"頑ななイスラエル、バビロンから出なさい","audio":"book_2610310202_2.mp3","start":1266.672,"end":1360.56,"dur":93.9,"segs":[{"t":"頑ななイスラエル、バビロンから出なさい","s":1266.672,"e":1269.485,"p":true,"h":false},{"t":"[位置] 40-66章 慰めと救い / 捕囚からの帰還の約束と偶像批判 (40-48章)","s":1269.912,"e":1278.466,"p":true,"h":false},{"t":"[概観] 「ヤコブの家よ、聞け」。","s":1278.912,"e":1281.225,"p":false,"h":false},{"t":"主の名によって誓いながら、真実と正義をもって行わない民に、神は、偶像のせいにできないように、昔から事を前もって知らせておかれたと言われます。","s":1281.432,"e":1293.143,"p":false,"h":false},{"t":"彼らは、首は鉄の筋、額は青銅のように頑なですが、神は、御名と栄光のために怒りを抑え、銀のように alse},{"t":"[新約・キリストとの関連 / 黙想ポイント] 福音を伝える者の足が美しいという御言葉は、新約で宣教の精神として引用されます。","s":1753.536,"e":1764.294,"p":false,"h":false},{"t":"損なわれて人の姿とも思えない僕が、ついには高く上げられるという宣言が、すぐ次の章の苦難を準備します。","s":1764.528,"e":1773.231,"p":true,"h":false}]},{"title":"苦難の僕(第四の僕の歌)","audio":"book_2610310202_2.mp3","start":1773.696,"end":1877.472,"dur":103.8,"segs":[{"t":"苦難の僕(第四の僕の歌)","s":1773.696,"e":1776.097,"p":true,"h":false},{"t":"[位置] 40-66章 慰めと救い / 主の僕と身代わりの救い (49-55章)","s":1776.624,"e":1784.133,"p":true,"h":false},{"t":"[概観] 第四の僕の歌の中心であり、イザヤ書の頂点です。","s":1784.568,"e":1789.382,"p":false,"h":false},{"t":"彼は、乾いた地から出た根のように、見るべき姿も輝きもなく育ち、人々に蔑まれ、病を知っている人でした。","s":1789.584,"e":1798.783,"p":false,"h":false},{"t":"しかし、彼が負った病と悲しみは、私たちのものであり、彼は、私たちの背きのために刺され、私たちの咎のために砕かれ、彼の懲らしめによって私たちに平和が与えられ、彼の打ち傷によって私たちは癒やされました。","s":1798.992,"e":1816.046,"p":false,"h":false},{"t":"私たちは皆、羊のように迷い、それぞれ自分の道に向かって行きましたが、主は私たちすべての咎を彼に負わせられ、彼は屠り場に引かれていく小羊のように、黙っておられました。","s":1816.272,"e":1830.037,"p":false,"h":false},{"t":"彼の魂が償いのいけにえとされた後、彼は子孫を見て長生きし、多くの人を義とし、尊い者とともに分け前を受けます。","s":1830.24,"e":1840.304,"p":true,"h":false},{"t":"[流れ] - 見るべき姿もなく、蔑まれる僕 - 私たちの病と咎を身代わりに負われる、贖いの苦難 - 屠り場に引かれる小羊と、墓 - 償いのいけにえとされ、多くの人を義とし、高く上げられる僕","s":1840.752,"e":1856.457,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 初代教会は、この章を、十字架の身代わりを説明する最も重要な本文としました。","s":1856.88,"e":1867.139,"p":false,"h":false},{"t":"私たちの罪を代わりに負い、私たちが癒やされるようにしてくださった僕の前で、私たちの立ち位置を改めて確認させられる章です。","s":1867.344,"e":1877.039,"p":true,"h":false}]},{"title":"不妊の女の歌","audio":"book_2610310202_2.mp3","start":1877.472,"end":1973.448,"dur":96,"segs":[{"t":"不妊の女の歌","s":1877.472,"e":1878.944,"p":true,"h":false},{"t":"[位置] 40-66章 慰めと救い / 主の僕と身代わりの救い (49-55章)","s":1879.392,"e":1886.901,"p":true,"h":false},{"t":"[概観] 「子を産まなかった不妊の女よ、喜び歌え。","s":1887.336,"e":1891.52,"p":false,"h":false},{"t":"天幕の場所を広げ、杭を固くせよ」という呼びかけで始まります。","s":1891.704,"e":1896.861,"p":false,"h":false},{"t":"見捨てられた女の子らが、多くなるからです。","s":1897.056,"e":1900.157,"p":false,"h":false},{"t":"「あなたを造られた方があなたの夫、あなたを贖う方はイスラエルの聖なる方であるから 、この宣言とつながっています。","s":2061.792,"e":2069.593,"p":true,"h":false}]},{"title":"すべての民の祈りの家","audio":"book_2610310202_2.mp3","start":2070.048,"end":2162.928,"dur":92.9,"segs":[{"t":"すべての民の祈りの家","s":2070.048,"e":2072.029,"p":true,"h":false},{"t":"[位置] 40-66章 慰めと救い / 真の礼拝と新しい天と新しい地 (56-66章)","s":2072.448,"e":2081.365,"p":true,"h":false},{"t":"[概観] 「公正を守り、正義を行え。","s":2081.784,"e":2084.963,"p":false,"h":false},{"t":"わたしの救いは近い」という言葉とともに、安息日を守り、悪を避ける者は幸いだと言われます。","s":2085.192,"e":2092.82,"p":false,"h":false},{"t":"主に連なる異邦人も、「主は私を民から分けられる」と言ってはならず、宦官も、「私は枯れ木だ」と言ってはなりません。","s":2093.016,"e":2102.379,"p":false,"h":false},{"t":"安息日を守り、契約を固く守る者には、神の家の中で、息子や娘にまさる記念の名を与え、異邦人も聖なる山に導いて、喜ばせてくださいます。","s":2102.568,"e":2114.994,"p":false,"h":false},{"t":"「わたしの家は、すべての民の祈りの家と呼ばれる」と言われます。","s":2115.192,"e":2119.889,"p":false,"h":false},{"t":"一方、目の見えない見張りの者たちや、吠えることのできない犬のような牧者たち、自分の利益だけを求める指導者たちが責められます。","s":2120.112,"e":2129.707,"p":true,"h":false},{"t":"[流れ] - 公正と安息日を守る者の幸い - 異邦人と宦官も歓迎される神の家 - すべての民の祈りの家という宣言 - 目の見えない見張りの者と、貪欲な牧者たちへの叱責","s":2130.264,"e":2144.221,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 血筋や身体の条件にかかわらず、神に従う者を受け入れてくださるという宣言です。","s":2144.664,"e":2154.639,"p":false,"h":false},{"t":"イエス様は神殿でこの御言葉を引用され、すべての民の祈りの家が強盗の巣になったと責められました。","s":2154.84,"e":2162.469,"p":true,"h":false}]},{"title":"へりくだる者とともに住まわれる神","audio":"book_2610310202_2.mp3","start":2162.928,"end":2260.08,"dur":97.2,"segs":[{"t":"へりくだる者とともに住まわれる神","s":2162.928,"e":2165.442,"p":true,"h":false},{"t":"[位置] 40-66章 慰めと救い / 真の礼拝と新しい天と新しい地 (56-66章)","s":2165.904,"e":2174.821,"p":true,"h":false},{"t":"[概観] 正しい人が死んでも、心に留める者はいませんが、彼は悪から取り去られて、平安に入ります。","s":2175.24,"e":2183.34,"p":false,"h":false},{"t":"一方、占い師の子ら、偶像礼拝や霊的な姦淫に陥った者たちは、樫の木の下で子どもをいけにえにささげ、神を恐れません。","s":2183.544,"e":2193.824,"p":false,"h":false},{"t":"神は、長い間黙っておられたので、わたしを恐れないのかと言われ、あなたが集めた偶像は、あなたを救えないと言われます。","s":2194.056,"e":2203.514,"p":false,"h":false},{"t":"一方、わたしに身を寄せる者は、地を受け継ぎ、わたしの聖なる山を所有します。","s":2203.752,"e":2210.249,"p":false,"h":false},{"t":"いと高く聖なる方が、打 。","s":2370.576,"e":2373.758,"p":false,"h":false},{"t":"耳が鈍くて聞こえないのでもない。","s":2373.96,"e":2376.292,"p":false,"h":false},{"t":"ただ、あなたがたの咎が、あなたがたと神との間を隔てているのだ」という言葉です。","s":2376.48,"e":2382.872,"p":false,"h":false},{"t":"手は血で、唇は偽りで汚れ、彼らは毒蛇の卵をかえし、くもの巣を織り、平和の道を知りません。","s":2383.08,"e":2391.457,"p":false,"h":false},{"t":"民は、「公正は私たちから遠く離れ、盲人のように壁を手探りで進む」と、自分たちの罪を告白します。","s":2391.648,"e":2400.367,"p":false,"h":false},{"t":"そこで神は、公正がなく、とりなす者がいないのをご覧になって、御自身の腕で救いをもたらし、義を胸当てとし、救いを兜として、立ち上がられます。","s":2400.576,"e":2412.704,"p":false,"h":false},{"t":"贖う方がシオンに来られ、「わたしの霊とわたしの言葉が、あなたの口から永遠に離れない」という契約が結ばれます。","s":2412.912,"e":2421.85,"p":true,"h":false},{"t":"[流れ] - 罪が神と民の間を隔てること - 偽りと暴力に満ちた社会と、民の告白 - とりなす者がいないのをご覧になり、御自身の腕で救われる神 - シオンに来られる贖う方と、永遠の言葉と霊の契約","s":2422.32,"e":2438.65,"p":true,"h":false},{"t":"[新約・キリストとの関連 / 黙想ポイント] 神が、とりなす者がいないことに驚かれ、御自身で救いの道を開かれるというこの宣言が、福音の核心です。","s":2439.072,"e":2451.142,"p":false,"h":false},{"t":"贖う方がシオンに来られるという約束は、キリストの到来と、イスラエルの救いへの希望につながります。","s":2451.36,"e":2458.913,"p":true,"h":false}]},{"title":"起きよ、光を放て","audio":"book_2610310202_2.mp3","start":2459.376,"end":2555.52,"dur":96.1,"segs":[{"t":"起きよ、光を放て","s":2459.376,"e":2461.332,"p":true,"h":false},{"t":"[位置] 40-66章 慰めと救い / 真の礼拝と新しい天と新しい地 (56-66章)","s":2461.776,"e":2470.693,"p":true,"h":false},{"t":"[概観] 「起きよ、光を放て。","s":2471.112,"e":2473.689,"p":false,"h":false},{"t":"あなたの光は来て、主の栄光があなたの上に輝いている」という命令で始まります。","s":2473.92,"e":2480.461,"p":false,"h":false},{"t":"闇が地を覆っても、主があなたの上に現れるので、諸国民があなたの光に、王たちがあなたの輝きに向かって来ます。","s":2480.664,"e":2489.752,"p":false,"h":false},{"t":"遠くから息子たちが帰り、娘たちが抱かれて来て、海の富と諸国民の財宝、シェバの金と香が集まり、主の栄光を告げ知らせます。","s":2489.952,"e":2500.542,"p":false,"h":false},{"t":"異邦人が城壁を築き、王たちが仕え、城門は昼も夜も閉ざされることがありません。","s":2500.8,"e":2507.601,"p":false,"h":false},{"t":"太陽や月ではなく、主がとこしえの光となり、悲しみの日は終わり、民はみな義しい者となって、地を永遠に所有し、小さな者が千となります。","s":2507.784,"e":2519.365,"p":true,"h":false},{"t":"[流れ] - 闇が覆うときに臨む、主の栄光 - 遠くから帰ってくる子らと、諸国民の贈り物 - いつも開かれている城門と、諸国民が仕えるシオン - 太陽や月ではなく、主がとこしえの光となる日","s":2519.808,"e":253     const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 終了' : '⛶ 全画面'; b.setAttribute('aria-label', isFs() ? '全画面を終了' : '全画面表示'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, go, seek, toggle, audio, TRACKS, state: () => ({ k, playing, curSrc }) };
})();
