<script>
(function () {
  const TITLE = "「使徒の働き」を深く読み解く", TRACKS = [{"title":"1.国の回復を尋ねる弟子たちに、なぜ時をお語りにならないのか――昇天と使徒の働きの最初の問い","audio":"book_2610280719_1.mp3","start":0,"end":916.452,"dur":916.5,"segs":[{"t":"1.国の回復を尋ねる弟子たちに、なぜ時をお語りにならないのか――昇天と使徒の働きの最初の問い","s":0,"e":8.264,"p":true,"h":false},{"t":"本文：使徒の働き1章1節から11節（ともに読む本文：ルカの福音書24章44節から53節、ダニエル書7章13節から14節、詩篇110篇1節、使徒の働き2章29節から36節、使徒の働き3章19節から21節、使徒の働き15章13節から18節）","s":8.748,"e":35.992,"p":true,"h":false},{"t":"使徒の働きは、一つの問いから始まります。","s":36.432,"e":39.623,"p":true,"h":false},{"t":"復活された主は四十日の間、弟子たちに神の国のことを語られました。","s":40.176,"e":45.635,"p":false,"h":false},{"t":"そして最後の日、弟子たちは尋ねます。","s":45.828,"e":48.705,"p":false,"h":false},{"t":"主よ、今こそイスラエルのために国を再興してくださるのですか。","s":48.996,"e":53.803,"p":true,"h":false},{"t":"この問いは、的外れに見えます。","s":54.288,"e":56.722,"p":false,"h":false},{"t":"四十日も学んだのに、まだそんなことを言うのかと、もどかしく思いやすいでしょう。","s":56.952,"e":62.667,"p":false,"h":false},{"t":"ところが、主の答えはもっと意外です。","s":62.856,"e":65.763,"p":false,"h":false},{"t":"主はその問いを叱られもせず、そうだとも、違うともお答えになりません。","s":65.988,"e":71.424,"p":false,"h":false},{"t":"時はあなたがたの知るところではないと言われ、すぐに話を聖霊と証人と地の果てへと向けられます。","s":71.604,"e":78.869,"p":true,"h":false},{"t":"ここでは、この答えが何を意味するのか、そしてその直後に起こる昇天がこの問いとどのようにつながるのかを見ていきます。","s":79.38,"e":88.203,"p":false,"h":false},{"t":"この一つの問いをしっかりつかむなら、使徒の働き全28章がその答えとして読めるようになります。","s":88.524,"e":95.855,"p":true,"h":false},{"t":"使徒の働きの主語は誰か","s":96.408,"e":98.525,"p":true,"h":false},{"t":"ルカはこの書を始めるにあたり、自分が先に書いた書、すなわちルカの福音書を振り返ります。","s":98.964,"e":105.771,"p":false,"h":false},{"t":"その書には、イエスが行い、教え始められたすべてのことを書いたとあります（使徒の働き1章1節）。","s":106.056,"e":114.004,"p":false,"h":false},{"t":"ここで、「始められた」という言葉が大切です。","s":114.192,"e":117.657,"p":true,"h":false},{"t":"ルカの福音書がイエスが始められた働きなら、使徒の働きはその働きの続きです。","s":118.188,"e":124.636,"p":false,"h":false},{"t":"主は昇天されましたが、働きをやめられたのではありません。","s":124.884,"e":129.167,"p":false,"h":false},{"t":"天から、聖霊によって、使徒たちを通して、その働きを続けておられます。","s":129.348,"e":135.016,"p":true,"h":false},{"t":"ですから、この書はしばしば使徒たちの働きと呼ばれますが、この書の主語は最後まで主です。","s":135.54,"e":142.299,"p":false,"h":false},{"t":"五旬節に聖霊を注いでくださる方も昇天された主であり（使徒の働き2章33節）、ダマスコへの道でサウロを捕らえられる方もその方です。","s":142.56,"e":153.77,"p":false,"h":false},{"t":"使徒たちは主が働かれる通り道であって、物語の主人公ではありません。","s":154.08,"e":159.656,"p":false,"h":false},{"t":"この点を見失うなら、使徒の働きは偉大な人々の活躍の物語として読まれてしまいます。","s":159.84,"e":166.669,"p":true,"h":false},{"t":"弟子たちは何を尋ねたのか","s":167.22,"e":169.315,"p":true,"h":false},{"t":"弟子たちの問いは、根拠なく出てきたものではありません。","s":169.812,"e":173.517,"p":false,"h":false},{"t":"旧約は、神が散らされた民を再び集め、彼らを回復されると繰り返し約束しています。","s":173.7,"e":180.92,"p":false,"h":false},{"t":"エゼキエルは、神がご自分の霊を民のうちに置き、新しい心を与えて、彼らが再び自分たちの地に住むようにされると語っています（エゼキエル書36章24節から28節）。","s":181.224,"e":195.841,"p":false,"h":false},{"t":"復活された主を直接見た弟子たちが、今こそその約束が実現する時が来たと考えたことは、聖書に忠実な期待でした。","s":196.056,"e":205.478,"p":true,"h":false},{"t":"ただ、その期待の中には、まだ解かれていないことがありました。","s":205.92,"e":210.426,"p":false,"h":false},{"t":"弟子たちは四十日の間、神の国についての話を聞いていたにもかかわらず（使徒の働き1章3節）、その国をイスラエルという一つの民族のことだと考えていました。","s":210.636,"e":223.492,"p":false,"h":false},{"t":"その国がどのような国であり、誰に開かれるのかは、五旬節の後になって初めて明らかになります。","s":223.704,"e":231.401,"p":true,"h":false},{"t":"ここで、主の答えをよく見なければなりません。","s":231.948,"e":235.272,"p":false,"h":false},{"t":"主は、国が回復されないとは言われません。","s":235.44,"e":238.601,"p":false,"h":false},{"t":"ただ、時を尋ねるところで弟子たちを別のところへ向き直らせられます。","s":238.788,"e":243.689,"p":true,"h":false},{"t":"答えは一続きになっている","s":244.332,"e":246.456,"p":true,"h":false},{"t":"主の答えは二つの節に収められています（使徒の働き1章7節から8節）。","s":246.888,"e":253.108,"p":false,"h":false},{"t":"主はまず、時と時期を父に委ねられます。","s":253.296,"e":256.555,"p":false,"h":false},{"t":"それは、父がご自分の権威によって定められたことなので、あなたがたの知るところではない、ということです。","s":256.824,"e":264.377,"p":false,"h":false},{"t":"主は以前、その日、その時は子も知らず、ただ父だけが知っておられると言われました（マタイの福音書24章36節）。","s":264.672,"e":274.459,"p":false,"h":false},{"t":"時を知らないのは弟子たちに何かが足りないからではなく、神が神であられるからです。","s":274.644,"e":280.519,"p":false,"h":false},{"t":"時の予定表は父の御手の中にあります。","s":280.764,"e":283.76,"p":true,"h":false},{"t":"しかし、みことばはそこで終わらず、すぐに聖霊へと続きます。","s":284.292,"e":289.066,"p":false,"h":false},{"t":"知ることのできないものの代わりに、受けることになるものを語られるのです。","s":289.296,"e":294.17,"p":false,"h":false},{"t":"聖霊があなたがたに臨まれるとき、あなたがたは力を受けると言われます。","s":294.408,"e":299.522,"p":false,"h":false},{"t":"神の国は、日付を知っている人々の間に現れるのではなく、聖霊を受けた人々の間に現れます。","s":299.844,"e":307.612,"p":false,"h":false},{"t":"先に見たエゼキエルの約束を思い起こすなら、神が回復の中心として約束されたのは、まさにご自分の霊を注がれることでした。","s":307.908,"e":317.54,"p":false,"h":false},{"t":"ですから主は、問いを避けられたのではなく、弟子たちを回復のただ中へと連れて行かれたのです。","s":317.736,"e":324.514,"p":true,"h":false},{"t":"そして、その聖霊が来られるなら、あなたがたはエルサレム、ユダヤとサマリアの全土、さらに地の果てまで、わたしの証人となると言われます。","s":325.008,"e":335.373,"p":false,"h":false},{"t":"ここで、問いの視野が変わります。","s":335.664,"e":337.872,"p":false,"h":false},{"t":"弟子たちはイスラエルという一つの国について尋ねたのに、主は地の果てを語られます。","s":338.148,"e":344.153,"p":true,"h":false},{"t":"ここに出てくる「地の果て」という言葉は、イザヤ書49章6節から来ています。","s":344.7,"e":350.996,"p":false,"h":false},{"t":"神がしもべを異邦人の光とし、救いが地の果てにまで届くようにされると言われた、まさにそのみことばです。","s":351.288,"e":359.163,"p":false,"h":false},{"t":"イザヤ書を深く読んできた人なら、ここですでに聞き覚えのある声を聞くことになります。","s":359.424,"e":365.657,"p":false,"h":false},{"t":"パウロも後にこのみことばを引いて、自分が異邦人へ向かう根拠とします（使徒の働き13章47節）。","s":365.976,"e":374.707,"p":false,"h":false},{"t":"イスラエルの回復は諸国の救いを通して実現するということがイザヤ以来の約束であり、主は弟子たちの問いをまさにその約束の場へ移されたのです。","s":374.94,"e":386.257,"p":true,"h":false},{"t":"証人となれという命令ではなく、証人となるという約束","s":386.784,"e":391.313,"p":true,"h":false},{"t":"8節はしばしば、地の果てまで証人となれという命令として読まれます。","s":391.752,"e":396.965,"p":false,"h":false},{"t":"しかし本文の文は、命令ではなく未来を語る文です。","s":397.224,"e":401.434,"p":false,"h":false},{"t":"聖霊が臨まれるなら、あなたがたは証人となるということです。","s":401.688,"e":406.196,"p":true,"h":false},{"t":"小さな違いに見えますが、その意味は大きく異なります。","s":406.728,"e":411.002,"p":false,"h":false},{"t":"命令であれば、証人となることは弟子たちが担う課題です。","s":411.3,"e":415.509,"p":false,"h":false},{"t":"約束であれば、証人となることは聖霊がなさる働きの実です。","s":415.764,"e":420.547,"p":false,"h":false},{"t":"弟子たちが決心して証人となるのではなく、聖霊が臨まれるなら、証人となってしまうのです。","s":420.804,"e":427.578,"p":true,"h":false},{"t":"使徒の働きは、実際にそのように進んでいきます。","s":428.04,"e":431.912,"p":false,"h":false},{"t":"ペテロは五旬節の前には、女中の前でさえ主を知らないと言っていた人でした。","s":432.18,"e":437.849,"p":false,"h":false},{"t":"ところが聖霊が臨まれると、同じ人がエルサレムの大勢の人々の前で口を開きます。","s":438.048,"e":444.474,"p":false,"h":false},{"t":"彼を変えたのは意志の決意ではなく、臨まれた聖霊でした。","s":444.888,"e":449.428,"p":true,"h":false},{"t":"この順序を、使徒の働きを読む間じゅう覚えていなければなりません。","s":449.892,"e":454.828,"p":false,"h":false},{"t":"まず主が約束され、聖霊が臨まれ、その結果として証人が生まれます。","s":455.004,"e":460.53,"p":false,"h":false},{"t":"恵みが先に来て、従順はその後に続きます。","s":460.836,"e":464.576,"p":true,"h":false},{"t":"昇天は去ることではなく、即位である","s":465.084,"e":467.997,"p":true,"h":false},{"t":"では、昇天を見ていきましょう。","s":468.432,"e":470.752,"p":false,"h":false},{"t":"雲が主を包み、弟子たちの目には見えなくなります（使徒の働き1章9節）。","s":470.952,"e":476.999,"p":true,"h":false},{"t":"私たちは昇天を、主が去って行かれる場面として受け止めやすいものです。","s":477.468,"e":482.704,"p":false,"h":false},{"t":"しかし聖書は、この場面を即位として読みます。","s":483.048,"e":486.7,"p":true,"h":false},{"t":"旧約において雲は、神の栄光が臨まれるところです。","s":487.224,"e":491.382,"p":false,"h":false},{"t":"そしてダニエル書7章は、人の子のような方が天の雲とともに「年を経た方」のもとに進み、永遠の主権を受ける場面を示しています。","s":491.652,"e":502.167,"p":false,"h":false},{"t":"あらゆる民、国民、国語の者たちが、その方に仕えるようになったとあります（ダニエル書7章13節から14節）。","s":502.524,"e":512.109,"p":false,"h":false},{"t":"雲に包まれて上って行かれるイエスを見た弟子たちは、ダニエルが幻の中で見たあの場面を、自分たちの目の前で見たのです。","s":512.28,"e":521.092,"p":true,"h":false},{"t":"ペテロは五旬節に、この意味をはっきりと説き明かします。","s":521.64,"e":525.702,"p":false,"h":false},{"t":"ダビデは天に上ったのではありません。","s":525.96,"e":528.446,"p":false,"h":false},{"t":"しかしダビデが歌った、「主が私の主に、『あなたは、わたしの右の座に着いていなさい』と言われた」その主こそ、このイエスだと言います（使徒の働き2章34節から35節、詩篇110篇1節）。","s":528.624,"e":545.365,"p":false,"h":false},{"t":"神がその方を右の座に上げ、約束された聖霊を父から受けて注いでくださったと言います（使徒の働き2章33節）。","s":545.58,"e":555.034,"p":false,"h":false},{"t":"昇天は王が御座に着かれた出来事であり、五旬節はその王が送ってくださった贈り物です。","s":555.228,"e":562.161,"p":true,"h":false},{"t":"もう一つ、見落としてはならないことがあります。","s":562.68,"e":565.771,"p":false,"h":false},{"t":"上って行かれた方は、復活された体のまま上って行かれました。","s":566.1,"e":570.757,"p":false,"h":false},{"t":"主は人の体を取られたまま、今、天におられます。","s":570.996,"e":574.986,"p":false,"h":false},{"t":"ハイデルベルク信仰問答は、これを昇天の慰めとして語ります。","s":575.316,"e":580.145,"p":false,"h":false},{"t":"私たちの肉を取られたかしらが天におられるので、肢体である私たちを御自分のもとに引き寄せてくださる確かな保証となる、ということです。","s":580.464,"e":590.251,"p":false,"h":false},{"t":"そしてその方は、天で私たちのために父の御前にあって執り成してくださいます。","s":590.508,"e":596.479,"p":false,"h":false},{"t":"ヘブル人への手紙も同じことを語っています（ヘブル人への手紙4章14節、7章25節）。","s":596.772,"e":604.937,"p":false,"h":false},{"t":"昇天された主は遠くへ去られた方ではなく、天で今も私たちのために働いておられる方です。","s":605.16,"e":612.346,"p":true,"h":false},{"t":"この問いは使徒の働き全体で答えを得る","s":612.936,"e":616.242,"p":true,"h":false},{"t":"1章6節の問いは、その場では解かれず、この書全体を通して答えを得ます。","s":616.68,"e":622.854,"p":true,"h":false},{"t":"ペテロは神殿で説教しながら、天がイエスを受け入れておかなければならない時があると語ります。","s":623.376,"e":630.001,"p":false,"h":false},{"t":"神が聖なる預言者たちを通して語られた、万物を回復される時まで、ということです（使徒の働き3章21節）。","s":630.288,"e":639.713,"p":false,"h":false},{"t":"ここで使われている「回復」という言葉は、1章6節の「回復」と同じ語根を持つ言葉です。","s":639.9,"e":647.278,"p":false,"h":false},{"t":"弟子たちはイスラエルの回復を尋ねましたが、ペテロは万物の回復を語ります。","s":647.568,"e":653.342,"p":false,"h":false},{"t":"問いははるかに大きくなっています。","s":653.652,"e":655.935,"p":true,"h":false},{"t":"15章のエルサレム会議では、ヤコブがアモスのことばを引きます。","s":656.46,"e":661.128,"p":false,"h":false},{"t":"神が倒れたダビデの幕屋を建て直されるのは、異邦人の中に残っている人々が主を求めるようになるためだと言います（使徒の働き15章16節から17節）。","s":661.428,"e":673.582,"p":false,"h":false},{"t":"ダビデの国が回復される姿が、異邦人が救われる姿として起こっている、という宣言です。","s":673.776,"e":680.963,"p":false,"h":false},{"t":"1章で弟子たちが尋ねた回復が、15章では異邦人の教会への加入として説明されるのです。","s":681.192,"e":688.757,"p":true,"h":false},{"t":"そしてこの書の最後の場面で、パウロはローマの借家に軟禁されていても、神の国を宣べ伝え、教えています（使徒の働き28章30節から31節）。","s":689.292,"e":701.9,"p":false,"h":false},{"t":"地の果ての入り口でこの書は終わりますが、最後の文の主題は神の国です。","s":702.108,"e":707.598,"p":false,"h":false},{"t":"この書は1章で始まった主題で終わります。","s":707.832,"e":710.852,"p":true,"h":false},{"t":"読み方が分かれるところ","s":711.468,"e":713.191,"p":true,"h":false},{"t":"この本文をめぐって、教会の中では解釈が分かれます。","s":713.628,"e":717.745,"p":true,"h":false},{"t":"一つの立場は、主が弟子たちの問いを訂正されなかった点に注目します。","s":718.272,"e":723.623,"p":false,"h":false},{"t":"それゆえ、イスラエル民族の国がやがてこの地上で別に回復されるという約束が、今もなお有効だと読みます。","s":723.924,"e":732.539,"p":true,"h":false},{"t":"別の立場は、主は問いを否定はされなかったものの、答えの中で問いの枠組みを変えられ、使徒の働きはその回復を、教会の中で異邦人とともに実現することとして説明していると読みます。","s":733.068,"e":747.645,"p":false,"h":false},{"t":"改革派の伝統は、おおむねこの立場に立っています。","s":747.936,"e":751.701,"p":false,"h":false},{"t":"ただし改革派の中でも、ローマ人への手紙11章の「イスラエルはみな救われる」をどう読むかによって、イスラエル民族の将来に寄せる期待はそれぞれ異なります。","s":751.968,"e":764.562,"p":true,"h":false},{"t":"ここでは後者の立場から読みます。","s":765.108,"e":767.498,"p":false,"h":false},{"t":"理由は、先に見たように、使徒の働き自体が1章6節の問いを3章と15章でそのように解き明かしているからです。","s":767.772,"e":777.363,"p":false,"h":false},{"t":"しかし、1章6節の一節だけでこの論争が終わるわけではないことは、率直に述べておかなければなりません。","s":777.6,"e":785.561,"p":true,"h":false},{"t":"時を知りたがる心について","s":786.06,"e":788.277,"p":true,"h":false},{"t":"主が、時は知るところではないと言われたみことばは、今日の教会にもそのまま届いています。","s":788.724,"e":795.282,"p":true,"h":false},{"t":"韓国の教会は、再臨の日付を決めて叫ぶ人々によって、何度も大きな傷を受けてきました。","s":795.816,"e":803.238,"p":false,"h":false},{"t":"しかし、このような日付の計算は、計算が間違っていたというだけで終わる問題ではありません。","s":803.448,"e":810.497,"p":false,"h":false},{"t":"主が父に属するものだと言われたことを、人が自分の手につかもうとすることです。","s":810.756,"e":816.481,"p":false,"h":false},{"t":"時を知らなければ安心できないという心は、信仰ではなく不安です。","s":816.732,"e":822.013,"p":true,"h":false},{"t":"そして、その心はこの場面の弟子たちにもありました。","s":822.492,"e":826.415,"p":false,"h":false},{"t":"主はその心を叱られず、聖霊を与えると言われます。","s":826.596,"e":830.647,"p":false,"h":false},{"t":"不安を満たすのは予定表ではなく、聖霊だというみことばです。","s":830.952,"e":835.601,"p":true,"h":false},{"t":"天を見上げる人々","s":836.1,"e":837.613,"p":true,"h":false},{"t":"最後に、二人の人が現れます。","s":838.044,"e":840.603,"p":false,"h":false},{"t":"白い衣を着た二人が弟子たちに語ります。","s":840.852,"e":843.877,"p":false,"h":false},{"t":"どうして立って天ばかり見上げているのですか。","s":844.236,"e":847.093,"p":false,"h":false},{"t":"あなたがたが天に上って行かれるのを見たこのイエスは、そのままおいでになります（使徒の働き1章10節から11節）。","s":847.296,"e":855.858,"p":true,"h":false},{"t":"このことばを叱責としてだけ聞くなら、天を見上げずに勤勉に働きなさい、という教訓になります。","s":856.332,"e":863.585,"p":false,"h":false},{"t":"しかし、このことばの重みは後半にあります。","s":863.856,"e":867.252,"p":false,"h":false},{"t":"このイエスがおいでになる、という約束です。","s":867.528,"e":870.693,"p":false,"h":false},{"t":"上って行かれたそのままの姿で、同じ方が再び来られます。","s":870.948,"e":875.502,"p":true,"h":false},{"t":"ですから昇天は別れではなく、再び会うことを約束された別れです。","s":876.06,"e":881.313,"p":false,"h":false},{"t":"そして証人の時代は、まさにその間に置かれた時間です。","s":881.532,"e":885.769,"p":true,"h":false},{"t":"ルカは先の書で、弟子たちが主が上って行かれるのを見て、大きな喜びとともにエルサレムに帰ったと記しました（ルカの福音書24章52節）。","s":886.248,"e":897.761,"p":false,"h":false},{"t":"王が御座に着かれ、その王が再び来られ、その間に聖霊が来られるからです。","s":897.948,"e":903.688,"p":true,"h":false},{"t":"使徒の働き1章6節の問いへの答えは、時ではなく、その方です。","s":904.212,"e":909.683,"p":false,"h":false},{"t":"この書を読み続ける間、私たちは予定表ではなく、王を見ることになります。","s":909.9,"e":915.923,"p":true,"h":false}]},{"title":"2.五旬節（ペンテコステ）の聖霊降臨は、なぜ繰り返されない出来事なのか：新しい時代の幕開けと、聖霊を経験する場","audio":"book_2610280719_1.mp3","start":916.452,"end":1626.228,"dur":709.8,"segs":[{"t":"2.五旬節（ペンテコステ）の聖霊降臨は、なぜ繰り返されない出来事なのか：新しい時代の幕開けと、聖霊を経験する場","s":916.452,"e":926.899,"p":true,"h":false},{"t":"本文：使徒の働き2章1節から41節（ともに読む本文：ヨエル書2章28節から32節、ヨハネの福音書7章37節から39節、ヨハネの福音書14章16節から18節、ヨハネの福音書16章7節、ルカの福音書24章49節、コリント人への手紙 第一 12章13節、エペソ人への手紙2章19節から22節）","s":927.36,"e":959.646,"p":true,"h":false},{"t":"五旬節（ペンテコステ）の物語は、教会が最も愛している場面であると同時に、最も多く誤解されている場面でもあります。","s":960.084,"e":969.836,"p":true,"h":false},{"t":"風のような音がし、炎のような舌が現れ、人々は知らなかった言葉で神の大きなみわざを語ります。","s":970.452,"e":978.21,"p":false,"h":false},{"t":"この場面を読んだ多くの信徒は、こう尋ねます。","s":978.552,"e":981.907,"p":false,"h":false},{"t":"そのときにあったことが、なぜ今日の私たちにはないのですか。","s":982.188,"e":986.573,"p":false,"h":false},{"t":"あるいは、こう考えます。","s":986.868,"e":988.727,"p":false,"h":false},{"t":"そのようなことがあってこそ、初めて聖霊を受けたことになるのではありませんか。","s":988.992,"e":994.432,"p":true,"h":false},{"t":"この文章では、五旬節（ペンテコステ）がどのような出来事だったのか、そしてこの出来事の中で繰り返されないものと、今日もすべての信者に起こるものが何なのかを区別して見ていきます。","s":994.896,"e":1008.311,"p":false,"h":false},{"t":"この区別を見失うと、五旬節（ペンテコステ）は信者を慰めるどころか、不安にさせる場面になってしまいます。","s":1008.576,"e":1017.041,"p":true,"h":false},{"t":"五旬節（ペンテコステ）とはどのような日だったのか","s":1017.576,"e":1021.393,"p":true,"h":false},{"t":"五旬節（ペンテコステ）は、過越の祭りから五十日目に当たる日でした。","s":1021.824,"e":1027.393,"p":false,"h":false},{"t":"旧約では初穂の祭り、あるいは七週の祭りと呼ばれる祭りで、初物の穀物を神に献げ、収穫を感謝する日でした（レビ記23章15節から21節）。","s":1027.584,"e":1040.841,"p":false,"h":false},{"t":"ですからエルサレムには、全世界に散らされて住んでいたユダヤ人たちが巡礼のために集まっていました。","s":1041.048,"e":1048.251,"p":false,"h":false},{"t":"ルカが並べている地名が十五にも及ぶのは、そのためです（使徒の働き2章9節から11節）。","s":1048.5,"e":1055.949,"p":true,"h":false},{"t":"主は昇天される前に、弟子たちにエルサレムを離れず、父が約束されたものを待つようにと言われました（使徒の働き1章4節）。","s":1056.42,"e":1066.206,"p":false,"h":false},{"t":"その約束は、ある日突然生まれたものではありません。","s":1066.428,"e":1070.469,"p":false,"h":false},{"t":"ヨエルは、神がすべての肉なる者に霊を注がれる日が来ると言い（ヨエル書2章28節）、エゼキエルは、神がご自分の霊を民のうちに置かれると言いました。","s":1070.676,"e":1082.789,"p":false,"h":false},{"t":"主も十字架を前にして、助け主を遣わすと繰り返し語られました（ヨハネの福音書14章16節から18節、16章7節）。","s":1082.988,"e":1093.853,"p":true,"h":false},{"t":"ところが、ヨハネの福音書7章には一つの重要な説明が添えられています。","s":1094.292,"e":1100.004,"p":false,"h":false},{"t":"イエスがまだ栄光を受けておられなかったので、聖霊はまだおられなかった、ということです（ヨハネの福音書7章39節）。","s":1100.232,"e":1109.733,"p":false,"h":false},{"t":"聖霊はただ来られるのではなく、栄光を受けられたキリストが遣わされる方だ、ということです。","s":1109.952,"e":1116.621,"p":false,"h":false},{"t":"十字架と復活と昇天が終わった後に、初めて聖霊は来られます。","s":1116.9,"e":1121.781,"p":false,"h":false},{"t":"ですから五旬節（ペンテコステ）は、神が突然新しいことをなさる日ではなく、先立つ贖いの出来事が一つにつながって到達したところなのです。","s":1122.084,"e":1133.102,"p":true,"h":false},{"t":"風と火と言葉","s":1133.604,"e":1134.877,"p":true,"h":false},{"t":"本文が記しているしるしは三つです。","s":1135.512,"e":1138.077,"p":false,"h":false},{"t":"激しい風が吹いて来たような響き、分かれた炎のような舌、そしてほかの国のことばで語ることです（使徒の働き2章2節から4節）。","s":1138.356,"e":1148.79,"p":true,"h":false},{"t":"旧約において風と火は、神が臨まれるときに現れる姿です。","s":1149.228,"e":1154.187,"p":false,"h":false},{"t":"シナイ山でも火と音があり（出エジプト記19章16節から18節）、幕屋と神殿には栄光の雲が満ちていました。","s":1154.448,"e":1164.205,"p":false,"h":false},{"t":"ルカは、まさにその神が今や一つの建物ではなく、人々の上に臨まれることを、絵のように示しています。","s":1164.384,"e":1172.674,"p":false,"h":false},{"t":"炎のような舌が、一人ひとりの上にとどまったと言われています。","s":1172.952,"e":1177.404,"p":false,"h":false},{"t":"神の臨在が、神殿から人へと移って来たのです。","s":1177.668,"e":1181.427,"p":true,"h":false},{"t":"語るということは、さらに注意して見るべき点です。","s":1181.916,"e":1185.674,"p":false,"h":false},{"t":"本文は、一人ひとりが自分の生まれ故郷のことばで聞いている、と言っています（使徒の働き2章6節から8節）。","s":1185.948,"e":1194.582,"p":false,"h":false},{"t":"これは何か分からない声ではなく、人々が聞き取れる実際の言語でした。","s":1194.804,"e":1200.078,"p":false,"h":false},{"t":"しかもその内容は自己を誇ることではなく、神の大きなみわざでした（使徒の働き2章11節）。","s":1200.276,"e":1207.855,"p":false,"h":false},{"t":"この場面を創世記11章のバベルと対比して読む解釈者もいます。","s":1208.052,"e":1213.108,"p":false,"h":false},{"t":"バベルでは高慢のゆえにことばが分かれ、人々は散らされましたが、五旬節（ペンテコステ）では、ことばが分かれたまま福音がすべての民族に聞かされます。","s":1213.452,"e":1225,"p":false,"h":false},{"t":"ルカがこの対比を直接語っているわけではないので断定はできませんが、五旬節（ペンテコステ）の向かう先がすべての民族であることは明らかです。","s":1225.332,"e":1236.375,"p":true,"h":false},{"t":"ペテロの最初の説教は、そのことを確かめてくれます。","s":1236.996,"e":1240.836,"p":false,"h":false},{"t":"ペテロは、酒に酔っているという嘲りに答えながら、これはヨエルの預言が実現したのだと言います。","s":1241.1,"e":1248.108,"p":false,"h":false},{"t":"そして、その出来事を起こされた方は、神がご自分の右の座に上げられたイエスであると宣べ伝えます（使徒の働き2章33節）。","s":1248.408,"e":1258.732,"p":false,"h":false},{"t":"しるしは、それ自体が目的だったのではありません。","s":1258.956,"e":1262.517,"p":false,"h":false},{"t":"しるしは、イエスが主でありキリストであることを指し示す指でした。","s":1262.7,"e":1267.564,"p":false,"h":false},{"t":"聖霊はご自分を高めるのではなく、キリストを証しされる方です（ヨハネの福音書15章26節、16章14節）。","s":1267.776,"e":1277.836,"p":true,"h":false},{"t":"繰り返されないこと","s":1278.288,"e":1279.694,"p":true,"h":false},{"t":"五旬節（ペンテコステ）は、救済史の中で一度起こった出来事です。","s":1280.196,"e":1285.648,"p":false,"h":false},{"t":"キリストが成し遂げられた救いの上に、聖霊が新しい時代を開き、教会を建て上げられた日です。","s":1285.92,"e":1292.96,"p":false,"h":false},{"t":"この日を起点として、神の民はもはや一つの民族の垣根の内にいるのではなく、すべての民族から集められた人々が一つのからだとなります。","s":1293.192,"e":1303.872,"p":true,"h":false},{"t":"この出来事は、キリストの十字架と復活が繰り返されないのと同じように、繰り返されません。","s":1304.424,"e":1311.188,"p":false,"h":false},{"t":"ルカも、風と火が五旬節（ペンテコステ）ごとに繰り返されたとは記していません。","s":1311.372,"e":1317.734,"p":false,"h":false},{"t":"五旬節（ペンテコステ）を毎日もう一度経験しなければならない出来事にしてしまうなら、すでに成し遂げられたことを、もう一度成し遂げなければならない課題へと変えてしまうことになります。","s":1317.924,"e":1330.808,"p":true,"h":false},{"t":"もちろん、使徒の働きには似たような出来事が何度か続いて起こります。","s":1331.352,"e":1336.402,"p":false,"h":false},{"t":"サマリアで、コルネリオの家で、エペソで、聖霊が臨まれる場面が続きます。","s":1336.716,"e":1342.473,"p":false,"h":false},{"t":"しかしそれらも、私たち一人ひとりの経験のための手本ではなく、福音が新たな境界を越えるたびに、神が同じ聖霊を与えられたという証拠でした。","s":1342.764,"e":1354.226,"p":false,"h":false},{"t":"この点は、次の文章で別に見ていきます。","s":1354.428,"e":1357.815,"p":true,"h":false},{"t":"今日もすべての信者に起こること","s":1358.388,"e":1360.788,"p":true,"h":false},{"t":"それでは、五旬節（ペンテコステ）の実りの中で、今日の私たちにも当てはまることとは何でしょうか。","s":1361.232,"e":1369.04,"p":true,"h":false},{"t":"聖霊が信じる人のうちに住んでおられるという事実です。","s":1369.512,"e":1373.432,"p":false,"h":false},{"t":"パウロは、キリストの御霊を持っていない人は、キリストのものではないと言っています（ローマ人への手紙8章9節）。","s":1373.688,"e":1382.11,"p":false,"h":false},{"t":"また、私たちがユダヤ人であってもギリシア人であっても、奴隷であっても自由人であっても、みな一つの御霊によってバプテスマを受けて一つのからだとなった、と言っています（コリント人への手紙 第一 12章13節）。","s":1382.328,"e":1398.229,"p":false,"h":false},{"t":"コリントの教会は問題の多い教会でしたが、パウロは彼らに聖霊を受けたのかと尋ねるのではなく、すでに聖霊によってバプテスマを受けたと言っています。","s":1398.42,"e":1409.24,"p":false,"h":false},{"t":"聖霊を受けているという事実は、特別な瞬間の経験ではなく、キリストに属するすべての人の立場でした。","s":1409.508,"e":1417.628,"p":true,"h":false},{"t":"ペテロの説教が終わったとき、人々は心を刺され、何をすればよいのかと尋ねます。","s":1418.076,"e":1424.506,"p":false,"h":false},{"t":"ペテロの答えは、悔い改めてバプテスマを受けなさい、そうすれば聖霊の賜物を受ける、というものでした。","s":1424.808,"e":1432.662,"p":false,"h":false},{"t":"そして、この約束はあなたがたと、あなたがたの子どもたちと、遠くにいるすべての人に対してなされたものだと言います（使徒の働き2章38節から39節）。","s":1432.872,"e":1445.695,"p":false,"h":false},{"t":"聖霊の賜物は、少数の特別な人のものではなく、神が召されるすべての人のものだという宣言です。","s":1445.904,"e":1453.715,"p":true,"h":false},{"t":"その日、およそ三千人が加えられたと言われています（使徒の働き2章41節）。","s":1454.292,"e":1460.476,"p":false,"h":false},{"t":"彼らに風が吹いたとか、炎のような舌がとどまったという話はありません。","s":1460.664,"e":1466.215,"p":false,"h":false},{"t":"彼らはみことばを受け、心を刺され、バプテスマを受けました。","s":1466.388,"e":1471.004,"p":false,"h":false},{"t":"これが、教会が始まったあり方でした。","s":1471.212,"e":1474.088,"p":true,"h":false},{"t":"読み方が分かれるところ","s":1474.524,"e":1476.247,"p":true,"h":false},{"t":"この問題をめぐって、教会の中では立場が分かれます。","s":1476.684,"e":1480.696,"p":true,"h":false},{"t":"ペンテコステ運動やカリスマ派の系統は、聖霊のバプテスマを新生とは区別される別個の経験として理解する傾向があります。","s":1481.22,"e":1490.721,"p":false,"h":false},{"t":"信じた後に聖霊のバプテスマを受けてこそ、力を得るという考えです。","s":1491.048,"e":1496.398,"p":false,"h":false},{"t":"改革派の伝統は一般に、聖霊のバプテスマを、キリストと結び合わされる新生の出来事とともに起こるものと見ます。","s":1496.7,"e":1505.354,"p":false,"h":false},{"t":"ただし改革派の中にも、これとは異なって教えた人がいます。","s":1505.664,"e":1510.354,"p":false,"h":false},{"t":"二十世紀のイギリスの牧師、マーティン・ロイドジョーンズがその例です。","s":1510.632,"e":1515.644,"p":false,"h":false},{"t":"彼は聖霊のバプテスマを、新生の後に与えられる別個の経験として教えました。","s":1515.924,"e":1522.123,"p":true,"h":false},{"t":"この文章は、先に見た理由から、前者の区別に従います。","s":1522.584,"e":1527.348,"p":false,"h":false},{"t":"パウロがすべての信者に対して、すでに一つの御霊によってバプテスマを受けたと言っており、聖霊がなければキリストのものではないと言っているからです。","s":1527.66,"e":1537.995,"p":false,"h":false},{"t":"しかしこれは、聖霊の満たしを求めることはむなしいと言っているのではありません。","s":1538.208,"e":1543.86,"p":false,"h":false},{"t":"パウロはエペソの信徒たちに、聖霊に満たされなさいと勧めています（エペソ人への手紙5章18節）。","s":1544.04,"e":1552.005,"p":false,"h":false},{"t":"聖霊がおられないから求めるのではなく、すでにおられる聖霊が、より深く治めてくださることを求めるのです。","s":1552.212,"e":1560.134,"p":true,"h":false},{"t":"経験の基準にはならない五旬節（ペンテコステ）","s":1560.78,"e":1564.421,"p":true,"h":false},{"t":"五旬節（ペンテコステ）を今日の基準にすると、二つのことが起こります。","s":1564.92,"e":1570.403,"p":true,"h":false},{"t":"風と火と異言を経験していない信者は、自分には何かが足りないと感じるようになります。","s":1570.968,"e":1577.406,"p":false,"h":false},{"t":"反対に、そのような経験をした信者は、自分がより高い段階にいると考えるようになります。","s":1577.7,"e":1584.489,"p":false,"h":false},{"t":"どちらも、恵みを経験の大きさで測ることです。","s":1584.792,"e":1588.507,"p":false,"h":false},{"t":"しかし本文において人々を動かしたのは、経験ではなく、宣べ伝えられたキリストでした。","s":1588.788,"e":1595.487,"p":true,"h":false},{"t":"五旬節（ペンテコステ）が与える慰めは、これです。","s":1595.952,"e":1600.038,"p":false,"h":false},{"t":"教会は私たちが造ったのではなく、昇天された王が遣わされた聖霊によって建てられました。","s":1600.308,"e":1606.998,"p":false,"h":false},{"t":"そしてその聖霊は、今日もみことばが宣べ伝えられるとき、人の心を刺してキリストへと導かれます。","s":1607.184,"e":1614.811,"p":false,"h":false},{"t":"私たちがすべきことは、あの日の火をもう一度燃え立たせようとすることではなく、あの日に証しされた方を信じ、その方のうちに安らぐことです。","s":1615.104,"e":1625.713,"p":true,"h":false}]},{"title":"3.サマリアとコルネリオとエペソの弟子たちは、なぜ聖霊を受ける順序がそれぞれ違うのでしょうか：救いの順序表ではなく、福音が境界を越えていく道です","audio":"book_2610280719_1.mp3","start":1626.228,"end":2215.728,"dur":589.5,"segs":[{"t":"3.サマリアとコルネリオとエペソの弟子たちは、なぜ聖霊を受ける順序がそれぞれ違うのでしょうか：救いの順序表ではなく、福音が境界を越えていく道です","s":1626.228,"e":1638.202,"p":true,"h":false},{"t":"本文：使徒の働き8章4節から25節、10章44節から48節、19章1節から7節（ともに読む本文：使徒の働き2章38節から39節、使徒の働き11章15節から18節、ローマ人への手紙8章9節、コリント人への手紙第一12章13節、エペソ人への手紙1章13節から14節）","s":1638.684,"e":1668.588,"p":true,"h":false},{"t":"使徒の働きを初めて読む人は、すぐに混乱します。","s":1669.032,"e":1673.034,"p":false,"h":false},{"t":"聖霊を受ける順序が、章ごとに違うからです。","s":1673.316,"e":1676.966,"p":true,"h":false},{"t":"五旬節には、悔い改めてバプテスマを受ければ聖霊を受けると言われました（使徒の働き2章38節）。","s":1677.456,"e":1685.873,"p":false,"h":false},{"t":"ところがサマリアでは、人々が信じてバプテスマを受けたのに、聖霊はまだ下っておられなかったと言われています。","s":1686.096,"e":1693.883,"p":false,"h":false},{"t":"コルネリオの家では反対に、バプテスマの前に、しかも説教が終わる前に聖霊が下られます。","s":1694.16,"e":1701.139,"p":false,"h":false},{"t":"エペソでは、すでに弟子と呼ばれていた人々が、聖霊がおられるということさえ聞いたことがないと言います。","s":1701.432,"e":1708.683,"p":true,"h":false},{"t":"これでは、どの順序が正しいのか分からないと思わずにはいられません。","s":1709.244,"e":1714.08,"p":false,"h":false},{"t":"この文章では、この三つの場面が救いの順序を教えようとしているのではなく、まったく別のことを語っている点を見ていきます。","s":1714.248,"e":1723.325,"p":true,"h":false},{"t":"サマリアで起こったこと","s":1723.86,"e":1725.479,"p":true,"h":false},{"t":"ステパノの殉教によって散らされた人々のうち、ピリポがサマリアの町に下って行き、キリストを宣べ伝えます（使徒の働き8章5節）。","s":1725.948,"e":1736.095,"p":false,"h":false},{"t":"人々はピリポの語ることを信じてバプテスマを受け、その町は大きな喜びに満たされました（使徒の働き8章8節、12節）。","s":1736.316,"e":1746.645,"p":false,"h":false},{"t":"ところがエルサレムの使徒たちはこの知らせを聞き、ペテロとヨハネを遣わします。","s":1746.864,"e":1752.182,"p":false,"h":false},{"t":"二人が下って行って祈り、手を置くと、そこでようやくサマリアの人々は聖霊を受けました（使徒の働き8章14節から17節）。","s":1752.48,"e":1762.883,"p":true,"h":false},{"t":"サマリアを理解するには、ユダヤ人とサマリア人の間にあった長い敵対を知る必要があります。","s":1763.352,"e":1770.292,"p":false,"h":false},{"t":"この二つの民は信仰の根を共有していながらも、数百年にわたって分かれていました。","s":1770.552,"e":1776.957,"p":false,"h":false},{"t":"ヨハネの福音書4章は、ユダヤ人はサマリア人と付き合わないと語っています。","s":1777.14,"e":1782.933,"p":false,"h":false},{"t":"この分裂が解かれないままサマリアの教会が別に生まれていたなら、教会は二つに裂かれていたでしょう。","s":1783.26,"e":1790.463,"p":true,"h":false},{"t":"それゆえ神は、使徒たちが直接下って行き、同じ聖霊が同じようにサマリアの人々にも下られるのを見させられます。","s":1790.928,"e":1799.718,"p":false,"h":false},{"t":"エルサレム教会がこの出来事を目で見て、サマリアの人々も同じ教会の肢体であることを認めるようになったのです。","s":1800.036,"e":1808.426,"p":false,"h":false},{"t":"サマリアで聖霊が遅れて下られた理由は、サマリアの人々に何かが足りなかったからではなく、二つに分かれていた神の民が一つのからだであることを、使徒たちの手を通して確認させるためだったと見るのが自然です。","s":1808.712,"e":1824.05,"p":true,"h":false},{"t":"コルネリオの家で起こったこと","s":1824.552,"e":1826.662,"p":true,"h":false},{"t":"コルネリオの家では、順序がまったく逆です。","s":1827.108,"e":1830.37,"p":false,"h":false},{"t":"ペテロがまだ語っている間に、聖霊がみことばを聞いているすべての人に下られます（使徒の働き10章44節）。","s":1830.6,"e":1839.341,"p":false,"h":false},{"t":"ペテロと一緒に来たユダヤ人の信者たちは驚きます。","s":1839.528,"e":1843.443,"p":false,"h":false},{"t":"異邦人にも聖霊が注がれたからです（使徒の働き10章45節）。","s":1843.776,"e":1849.454,"p":true,"h":false},{"t":"この場面で聖霊は、使徒の按手を待たれもせず、バプテスマを待たれもしませんでした。","s":1849.896,"e":1856.08,"p":false,"h":false},{"t":"ペテロは後にエルサレムでこの出来事を説明し、聖霊が初めに私たちに下られたのと同じように、彼らにも下られたと言います（使徒の働き11章15節から17節）。","s":1856.268,"e":1869.767,"p":false,"h":false},{"t":"そして、彼が言ったことはこれです。","s":1869.984,"e":1872.513,"p":false,"h":false},{"t":"神が彼らにも私たちと同じ賜物を与えてくださったのなら、私のような者が、いったい何者で、神を妨げることができるでしょうか。","s":1872.792,"e":1883.059,"p":true,"h":false},{"t":"ここでも、順序が要点ではありません。","s":1883.52,"e":1886.444,"p":false,"h":false},{"t":"異邦人が神の民に加わることができるかどうかを人が判断する前に、神が先に判定を下されたことが要点です。","s":1886.652,"e":1895.378,"p":false,"h":false},{"t":"教会が扉を開く前に、聖霊が先に扉を開かれたのです。","s":1895.652,"e":1900.586,"p":true,"h":false},{"t":"エペソの弟子たち","s":1901.088,"e":1902.42,"p":true,"h":false},{"t":"エペソでパウロは、弟子と呼ばれる十二人ほどの人々に出会います。","s":1902.996,"e":1907.76,"p":false,"h":false},{"t":"パウロの最初の質問は興味深いものです。","s":1908.072,"e":1911.198,"p":false,"h":false},{"t":"信じたとき、聖霊を受けたか、ということです（使徒の働き19章2節）。","s":1911.42,"e":1917.567,"p":false,"h":false},{"t":"この質問は、通常の信者であれば、信じたときに聖霊を受けているはずだということを前提にしています。","s":1917.756,"e":1925.739,"p":true,"h":false},{"t":"ところが彼らは、聖霊がおられるということさえ聞いたことがないと答えます。","s":1926.288,"e":1931.573,"p":false,"h":false},{"t":"調べてみると、彼らはヨハネのバプテスマしか受けていない人々でした。","s":1931.868,"e":1936.909,"p":false,"h":false},{"t":"パウロは、ヨハネは悔い改めのバプテスマを授けながら、自分の後に来られる方を信じるようにと言ったのだと説明します。","s":1937.124,"e":1946.054,"p":false,"h":false},{"t":"彼らがイエスの名によってバプテスマを受け、パウロが手を置くと、聖霊が下られ、彼らは異言を語り、預言をしました（使徒の働き19章3節から6節）。","s":1946.412,"e":1958.643,"p":true,"h":false},{"t":"この人々は、旧約から新約へ移る敷居に立っていた人々です。","s":1959.12,"e":1964.08,"p":false,"h":false},{"t":"バプテスマのヨハネが指し示した方をまだ知らないまま、ヨハネの教えの中にとどまっていました。","s":1964.34,"e":1971.005,"p":false,"h":false},{"t":"ルカがこの話を記録したのは、キリストの完成されたみわざを知る信仰と、その前の段階にとどまる信仰とが区別されることを示すためです。","s":1971.18,"e":1981.792,"p":false,"h":false},{"t":"ですから、この場面もまた、今日の信者たちに聖霊を二段階で受けるという教えを与えようとしているのではありません。","s":1982.016,"e":1990.715,"p":true,"h":false},{"t":"三つの場面を流れる一つの筋","s":1991.16,"e":1993.641,"p":true,"h":false},{"t":"三つの場面を並べて見ると、共通点が見えてきます。","s":1994.112,"e":1998.16,"p":false,"h":false},{"t":"五旬節のユダヤ人、サマリアの人々、異邦人コルネリオ、そしてヨハネの弟子たちです。","s":1998.468,"e":2005.378,"p":false,"h":false},{"t":"福音が新しい境界を越えるたびに、同じ聖霊が同じように下られたという話です。","s":2005.596,"e":2012.094,"p":false,"h":false},{"t":"しかも、使徒たちがその場にいるか、証人がいるところで下られました。","s":2012.328,"e":2017.393,"p":false,"h":false},{"t":"使徒の働き1章8節で約束された、エルサレム、ユダヤとサマリア、そして地の果てへと至る道が、このように開かれたのです。","s":2017.584,"e":2027.465,"p":true,"h":false},{"t":"ですから、この話はこのように読まなければなりません。","s":2027.952,"e":2031.8,"p":false,"h":false},{"t":"どのような順序で聖霊を受けるかについての規則ではなく、だれに対してもこの恵みが閉ざされていないことを、神が一つ一つ確かめていかれた過程です。","s":2031.984,"e":2042.788,"p":true,"h":false},{"t":"シモンというサマリアの魔術師","s":2043.324,"e":2045.63,"p":true,"h":false},{"t":"サマリアの話には、もう一人の人物がいます。","s":2046.06,"e":2049.562,"p":false,"h":false},{"t":"魔術で人々を驚かせていたシモンです。","s":2049.84,"e":2052.714,"p":false,"h":false},{"t":"彼も信じてバプテスマを受けたと記されています（使徒の働き8章13節）。","s":2052.972,"e":2058.937,"p":false,"h":false},{"t":"ところが、使徒たちが手を置いて聖霊が下られるのを見ると、金を差し出して、この権威を自分にもくださいと言います。","s":2059.128,"e":2067.515,"p":true,"h":false},{"t":"ペテロの答えは厳しいものです。","s":2068.056,"e":2070.392,"p":false,"h":false},{"t":"あなたの銀は、あなたとともに滅びるがよい。","s":2070.648,"e":2073.989,"p":false,"h":false},{"t":"神の賜物を金で手に入れようと思ったからだ（使徒の働き8章20節）。","s":2074.176,"e":2079.855,"p":false,"h":false},{"t":"そして、あなたの心は神の前に正しくないと言います。","s":2080.08,"e":2084.232,"p":true,"h":false},{"t":"この場面は重要な事実を思い起こさせます。","s":2084.76,"e":2088.078,"p":false,"h":false},{"t":"バプテスマを受けたというしるしが、すなわち聖霊を受けたという証明ではありません。","s":2088.396,"e":2094.123,"p":false,"h":false},{"t":"聖霊は売り買いできる力ではなく、神が恵みによって与えてくださる賜物です。","s":2094.336,"e":2100.26,"p":false,"h":false},{"t":"シモンは聖霊を、自分の影響力を大きくする道具と見ていました。","s":2100.492,"e":2105.713,"p":false,"h":false},{"t":"聖霊を体験のしるしや力の手段として見る心は、いつもこのシモンの立場に近いのです。","s":2105.928,"e":2112.691,"p":false,"h":false},{"t":"本文はこの箇所で、言葉を控えていません。","s":2113.056,"e":2116.442,"p":true,"h":false},{"t":"読み方が分かれる点","s":2116.872,"e":2118.47,"p":true,"h":false},{"t":"サマリアで起こったことをめぐっては、解釈が分かれます。","s":2118.96,"e":2122.753,"p":false,"h":false},{"t":"ピリポの伝道によって信じたサマリアの人々が、聖霊なしに信者として過ごしていたと見る立場もあれば、彼らの信仰はまだ完全ではなかったと見る立場もあり、サマリアという特別な境界で起こった救済史的な例外と見る立場もあります。","s":2123.028,"e":2140.5,"p":false,"h":false},{"t":"どの立場であっても、今日の信者に同じ順序が求められると読むのは難しいでしょう。","s":2140.812,"e":2147.172,"p":true,"h":false},{"t":"この文章が立つ場所は、最後の立場に近いものです。","s":2147.616,"e":2151.6,"p":false,"h":false},{"t":"信者に聖霊がどのように与えられるかを、書簡が明確に語っているからです。","s":2151.9,"e":2157.46,"p":false,"h":false},{"t":"聖霊がおられなければ、その人はキリストのものではなく（ローマ人への手紙8章9節）、みことばを聞いて信じたとき、約束の聖霊によって証印を押されます（エペソ人への手紙1章13節）。","s":2157.732,"e":2173.097,"p":false,"h":false},{"t":"使徒の働きの場面はこの基準を揺るがすのではなく、福音がどのような道筋で広がっていったかを示しています。","s":2173.284,"e":2181.196,"p":true,"h":false},{"t":"キリストにあって休むこと","s":2181.708,"e":2183.53,"p":true,"h":false},{"t":"この本文を読んで、不安になる必要はありません。","s":2183.976,"e":2187.636,"p":false,"h":false},{"t":"自分が聖霊をどのような順序で、どのようなしるしとともに受けたのかを、吟味する理由はありません。","s":2187.9,"e":2194.986,"p":true,"h":false},{"t":"福音を聞いてキリストを信じる人のうちには、聖霊がおられます。","s":2195.46,"e":2199.95,"p":false,"h":false},{"t":"それが信仰の事実であり、使徒の働きの三つの場面は、その事実がすべての民族に開かれていることを示しています。","s":2200.212,"e":2209.114,"p":false,"h":false},{"t":"聖霊は、私たちがつかむ体験ではなく、私たちをつかんでくださるお方です。","s":2209.392,"e":2215.245,"p":true,"h":false}]},{"title":"4.十字架を、神が定められた御心であると同時に人の罪として語る説教は、どのようにして可能なのでしょうか","audio":"book_2610280719_1.mp3","start":2215.728,"end":2777.58,"dur":561.9,"segs":[{"t":"4.十字架を、神が定められた御心であると同時に人の罪として語る説教は、どのようにして可能なのでしょうか","s":2215.728,"e":2224.571,"p":true,"h":false},{"t":"本文：使徒の働き2章22節から24節、36節から37節、3章13節から19節、4章24節から28節（共に読む本文：創世記50章20節、詩篇2篇1節から2節、イザヤ書53章10節、ルカの福音書22章22節、ヤコブの手紙1章13節）","s":2225.052,"e":2251.997,"p":true,"h":false},{"t":"使徒の働きの初期の説教には、一見不思議に思える共通点があります。","s":2252.412,"e":2257.839,"p":false,"h":false},{"t":"一つの文の中で、二つのことを同時に語っているという点です。","s":2258.1,"e":2262.812,"p":true,"h":false},{"t":"イエスが死なれたのは、神が定められたご計画とあらかじめ知られていたことによるのだ、と言われています。","s":2263.32,"e":2270.65,"p":false,"h":false},{"t":"ところがそのすぐ後で、そのことを、あなたがたが不法な者たちの手を借りて十字架につけ、殺したのだ、と言っています。","s":2270.952,"e":2279.701,"p":false,"h":false},{"t":"使徒の働き2章23節です。","s":2279.952,"e":2282.584,"p":false,"h":false},{"t":"神のご計画だと言いながら人の罪だと言い、人の罪だと言いながら神のご計画だと言うのです。","s":2282.868,"e":2289.79,"p":true,"h":false},{"t":"この文章では、この二つの言葉がなぜ衝突しないのか、そしてこの説教が人々にどのように働いたのかを見ていきます。","s":2290.284,"e":2299.05,"p":false,"h":false},{"t":"この問いは神学における長年の難問ですが、使徒たちがこれを難問として扱わず、説教の骨格として用いたことは驚くべきことです。","s":2299.464,"e":2309.654,"p":true,"h":false},{"t":"三度繰り返される同じ構造","s":2310.156,"e":2312.746,"p":true,"h":false},{"t":"この構造は、一度出てきて終わるものではありません。","s":2313.18,"e":2316.996,"p":false,"h":false},{"t":"五旬節（ペンテコステ）にペテロがした説教に現れ、使徒の働き2章23節、神殿のソロモンの回廊でした説教にもう一度現れます。","s":2317.176,"e":2328.425,"p":false,"h":false},{"t":"あなたがたはいのちの君を殺したが、神はこの方を死者の中からよみがえらせた、と言いながら、そのことは神がすべての預言者の口を通してあらかじめ告げておられたことを成就されたのだ、と語っています。","s":2328.768,"e":2343.531,"p":false,"h":false},{"t":"使徒の働き3章15節、18節です。","s":2343.78,"e":2347.611,"p":false,"h":false},{"t":"そして、教会が迫害を受けてささげた祈りの中にも、三度目に現れます。","s":2347.884,"e":2353.627,"p":false,"h":false},{"t":"ヘロデとポンティオ・ピラトが、異邦人たちとイスラエルの民と共にイエスに敵対して集まりましたが、それは御手と御心によってあらかじめ定められていたことを行うためだった、と告白しています。","s":2353.896,"e":2368.08,"p":false,"h":false},{"t":"使徒の働き4章27節から28節です。","s":2368.332,"e":2372.246,"p":true,"h":false},{"t":"最初の二つは人々に向けた宣言であり、最後の一つは信者たちが神にささげる祈りです。","s":2372.796,"e":2379.896,"p":false,"h":false},{"t":"人々に宣べ伝えるときにも、神の御前にひれ伏して祈るときにも、同じ言葉が語られています。","s":2380.176,"e":2387.203,"p":false,"h":false},{"t":"ですから、これは説教者の修辞ではなく、初代教会が十字架を理解したあり方でした。","s":2387.484,"e":2394.005,"p":false,"h":false},{"t":"教会は十字架を、人間の悲劇としてだけでも、神のご計画としてだけでも読んではいませんでした。","s":2394.216,"e":2401.372,"p":false,"h":false},{"t":"この二つを共にしっかりと握っていたのです。","s":2401.56,"e":2404.722,"p":true,"h":false},{"t":"ヨセフの物語が示したあり方","s":2405.268,"e":2407.794,"p":true,"h":false},{"t":"この構造は、聖書に初めて現れるあり方ではありません。","s":2408.256,"e":2412.664,"p":false,"h":false},{"t":"最もはっきりした先例はヨセフです。","s":2412.864,"e":2415.589,"p":true,"h":false},{"t":"ヨセフの兄たちはねたみによって弟を穴に投げ込み、奴隷として売りました。","s":2416.068,"e":2421.904,"p":false,"h":false},{"t":"それは明らかな罪でした。","s":2422.116,"e":2424.243,"p":false,"h":false},{"t":"ところが後に、ヨセフは兄たちに言います。","s":2424.456,"e":2427.621,"p":false,"h":false},{"t":"兄たちは私に悪を計りましたが、神はそれを良いことのための計らいとし、今日のように多くの人々を生かしておられるのだ、と言うのです。","s":2427.912,"e":2438.195,"p":false,"h":false},{"t":"創世記50章20節です。","s":2438.46,"e":2440.8,"p":false,"h":false},{"t":"同じ出来事について、兄たちの悪だと言い、神の善だと言っています。","s":2441.052,"e":2446.51,"p":false,"h":false},{"t":"兄たちは責任を免れず、神は罪の責任を負われません。","s":2446.776,"e":2451.649,"p":true,"h":false},{"t":"イザヤ書で、神がアッシリアを杖として用いられることを読んだことがあるなら、同じ構造がお分かりになるでしょう。","s":2452.14,"e":2460.123,"p":false,"h":false},{"t":"神はアッシリアを道具として用いられましたが、アッシリアは自らの高ぶりの責任を負いました。","s":2460.312,"e":2467.151,"p":false,"h":false},{"t":"十字架は、この構造が最も深く、最も鮮明に現れた場所です。","s":2467.368,"e":2472.883,"p":true,"h":false},{"t":"罪の作者となられない神","s":2473.416,"e":2475.502,"p":true,"h":false},{"t":"ここで直ちに出てくる問いがあります。","s":2475.972,"e":2478.294,"p":false,"h":false},{"t":"神があらかじめ定められたのなら、神が罪を造られたのではないでしょうか。","s":2478.564,"e":2483.791,"p":true,"h":false},{"t":"聖書は、この問いに対して二つのことを同時に語っています。","s":2484.288,"e":2488.615,"p":false,"h":false},{"t":"神はすべてのことを統べ治めておられること、そして神は悪を行われることも、人を悪によって試みられることもない、ということです。","s":2488.896,"e":2498.968,"p":false,"h":false},{"t":"ヤコブの手紙1章13節です。","s":2499.228,"e":2501.822,"p":false,"h":false},{"t":"改革派の信仰告白は、この二つを共にしっかりと握ります。","s":2502.072,"e":2506.9,"p":false,"h":false},{"t":"神は永遠の昔からすべてのことを定めておられますが、罪の作者とはなられず、被造物の意志に暴力を加えることもなさらない、と告白します。","s":2507.22,"e":2518.188,"p":false,"h":false},{"t":"イスカリオテのユダも、ピラトも、群衆も、自分の意志のままに行動し、自分の罪を犯しました。","s":2518.452,"e":2526.261,"p":false,"h":false},{"t":"しかし、彼らの罪も神の御手の外へ逃れることはできませんでした。","s":2526.444,"e":2531.484,"p":true,"h":false},{"t":"これが完全に説明されたと言うなら、それは正直ではありません。","s":2531.916,"e":2536.681,"p":false,"h":false},{"t":"ここは説明が終わる場所ではなく、神秘が始まる場所です。","s":2536.884,"e":2541.195,"p":false,"h":false},{"t":"ただ、使徒たちがこの二つの言葉を互いに矛盾するものとは見なさず、だからこそ説教でも祈りでも一緒に語った、という事実は明らかです。","s":2541.42,"e":2551.845,"p":true,"h":false},{"t":"この説教はどのように働いたのでしょうか","s":2552.328,"e":2555.167,"p":true,"h":false},{"t":"この説教の効果は興味深いものです。","s":2555.748,"e":2558.675,"p":false,"h":false},{"t":"ペテロは神が定められたご計画を語った後、あなたがたが十字架につけたこのイエスを、神は主とし、またキリストとされたのだ、と宣言します。","s":2558.952,"e":2569.804,"p":false,"h":false},{"t":"使徒の働き2章36節です。","s":2570.076,"e":2572.828,"p":false,"h":false},{"t":"聞いていた人々は心を刺された、とあります。","s":2573.1,"e":2576.39,"p":false,"h":false},{"t":"使徒の働き2章37節です。","s":2576.7,"e":2579.502,"p":true,"h":false},{"t":"もし説教が神のご計画だけを強調していたなら、聞いていた人々は、自分たちの責任ではないと安心したことでしょう。","s":2580.012,"e":2588.976,"p":false,"h":false},{"t":"もし人の罪だけを強調していたなら、彼らは絶望したことでしょう。","s":2589.192,"e":2594.196,"p":false,"h":false},{"t":"神のご計画と人の罪が共に宣べ伝えられたからこそ、二つのことが同時に起こります。","s":2594.412,"e":2600.971,"p":false,"h":false},{"t":"自分の罪から逃れることはできず、同時に、その罪さえも神が救いの道とされたという知らせを聞くのです。","s":2601.288,"e":2609.225,"p":true,"h":false},{"t":"ペテロが神殿でした説教は、この点をさらに明らかに示しています。","s":2609.712,"e":2614.887,"p":false,"h":false},{"t":"ペテロは、聞いていた人々がイエスを引き渡し、拒んだことを、隠すことなく語ります。","s":2615.184,"e":2621.651,"p":false,"h":false},{"t":"そうしてから、兄弟たち、あなたがたが無知のためにあのようなことをしたのを、私は知っています、と言います。","s":2621.952,"e":2630.004,"p":false,"h":false},{"t":"使徒の働き3章17節です。","s":2630.268,"e":2632.868,"p":false,"h":false},{"t":"そしてすぐに、悔い改めて立ち返り、罪をぬぐい去っていただくようにと勧めます。","s":2633.148,"e":2639.335,"p":false,"h":false},{"t":"責任を問うた後に、招きが続きます。","s":2639.592,"e":2642.694,"p":false,"h":false},{"t":"罪を隠さない説教だけが、価なしの赦しを正しく宣べ伝えることができます。","s":2642.976,"e":2648.948,"p":true,"h":false},{"t":"反ユダヤ主義として読んではならない理由","s":2649.528,"e":2652.459,"p":true,"h":false},{"t":"この本文は、歴史の中でひどく誤用されてきました。","s":2652.912,"e":2656.802,"p":false,"h":false},{"t":"ユダヤ人がイエスを殺したという証拠として用いられ、ユダヤ人迫害の口実となりました。","s":2657.016,"e":2663.631,"p":false,"h":false},{"t":"これは本文を重大に読み誤ったものです。","s":2663.82,"e":2666.897,"p":true,"h":false},{"t":"まず、ペテロも説教を聞いていた人々も皆ユダヤ人であり、説教者自身がユダヤ人でした。","s":2667.492,"e":2674.979,"p":false,"h":false},{"t":"そして4章27節は、イエスに敵対した者たちを、ヘロデとピラト、異邦人たち、そしてイスラエルの民だと述べています。","s":2675.16,"e":2684.95,"p":false,"h":false},{"t":"異邦人の権力者とユダヤ人の指導者たちと群衆が、共にそこにいました。","s":2685.24,"e":2691.178,"p":false,"h":false},{"t":"さらに根本的には、詩篇2篇とイザヤ書53章によれば、この死はすべての人の罪のためのものでした。","s":2691.396,"e":2699.746,"p":false,"h":false},{"t":"十字架の前に立つ人は、だれも傍観者ではいられません。","s":2699.928,"e":2704.028,"p":false,"h":false},{"t":"聖書が責任を問う対象は、ある一つの民族ではなく、神を離れたすべての人です。","s":2704.212,"e":2711.049,"p":true,"h":false},{"t":"ですから、この本文を読む信者がなすべきことは、だれかを指さすことではなく、自分自身がこの十字架の前で不法な者たちの立場に立っていたことを認めることです。","s":2711.556,"e":2723.677,"p":true,"h":false},{"t":"恵みは最も大きな罪の上に立っている","s":2724.192,"e":2727.456,"p":true,"h":false},{"t":"この本文が与える最大の慰めは、これです。","s":2727.9,"e":2731.471,"p":false,"h":false},{"t":"人類が犯した最も大きな罪、すなわち神の御子を殺した罪が、まさに救いが成し遂げられた場所となりました。","s":2731.824,"e":2739.99,"p":false,"h":false},{"t":"神は人間の最も悪しき行いさえも、救いのご計画の中に置かれました。","s":2740.176,"e":2746.007,"p":true,"h":false},{"t":"それでは、私たちの罪はどうでしょうか。","s":2746.44,"e":2749.444,"p":false,"h":false},{"t":"どのような罪も神のご計画の外で起こることはなく、キリストの十字架より大きな罪はありません。","s":2749.644,"e":2756.957,"p":false,"h":false},{"t":"この信仰が、使徒たちが大胆に説教し、祈った根でした。","s":2757.132,"e":2761.654,"p":false,"h":false},{"t":"神が定められたという言葉は、彼らにとって宿命論ではなく安息であり、人が殺したという言葉は、責任逃れを防ぐ鏡でした。","s":2761.848,"e":2772.238,"p":false,"h":false},{"t":"この二つが共にあるとき、福音は福音として聞こえるのです。","s":2772.468,"e":2777.09,"p":true,"h":false}]},{"title":"5.初代教会の財産の共有は、従うべき模範なのか――アナニアとサッピラが死んだ理由","audio":"book_2610280719_1.mp3","start":2777.58,"end":3354.336,"dur":576.8,"segs":[{"t":"5.初代教会の財産の共有は、従うべき模範なのか――アナニアとサッピラが死んだ理由","s":2777.58,"e":2784.68,"p":true,"h":false},{"t":"本文：使徒の働き2章42節から47節、4章32節から5章11節（共に読む本文：使徒の働き6章1節から6節、使徒の働き11章27節から30節、ローマ人への手紙15章25節から27節、コリント人への手紙 第二8章1節から15節、ヨシュア記7章、レビ記10章1節から3節）","s":2785.104,"e":2813.831,"p":true,"h":false},{"t":"エルサレム教会の姿は、長い間、教会の理想として読まれてきました。","s":2814.264,"e":2819.993,"p":false,"h":false},{"t":"信者たちはすべての物を共有し、財産や所有物を売って、それぞれの必要に応じて分け与えていたとあります（使徒の働き2章44節から45節）。","s":2820.204,"e":2832.756,"p":false,"h":false},{"t":"貧しい人は一人もいなかったとあります（使徒の働き4章34節）。","s":2832.948,"e":2838.674,"p":true,"h":false},{"t":"この場面を読んだ人々は、二つに分かれました。","s":2839.14,"e":2842.596,"p":false,"h":false},{"t":"一方は教会はこのように生きるべきだと言い、もう一方は時代が違ったと言います。","s":2842.812,"e":2848.701,"p":false,"h":false},{"t":"ところが、この美しい場面のすぐ後に、恐ろしい出来事が続きます。","s":2848.968,"e":2854.382,"p":false,"h":false},{"t":"土地を売って献金した夫婦が、同じ日に死ぬのです。","s":2854.62,"e":2858.429,"p":true,"h":false},{"t":"この文章では、財産の共有が今日の教会の従うべき規範なのか、そしてアナニアとサッピラはなぜあのようになったのかを、共に見ていきます。","s":2858.94,"e":2869.62,"p":false,"h":false},{"t":"二つの問いは、一つの物語の中で互いを解き明かしています。","s":2869.92,"e":2874.647,"p":true,"h":false},{"t":"記録されたことと、命じられたこと","s":2875.176,"e":2877.808,"p":true,"h":false},{"t":"まず、区別しなければならないことがあります。","s":2878.236,"e":2881.334,"p":false,"h":false},{"t":"聖書に記録されていることと、聖書が命じていることは違います。","s":2881.62,"e":2886.24,"p":false,"h":false},{"t":"使徒の働きの物語が、神がなさったことと教会が行ったことを記録したものなら、それがすべての教会が従うべき規定なのかは、別に問わなければなりません。","s":2886.516,"e":2898.527,"p":true,"h":false},{"t":"本文を注意深く見ると、財産の共有は命令ではなく、自発的な行動でした。","s":2898.972,"e":2905.419,"p":false,"h":false},{"t":"ルカは、信者の群れが自分の財産を自分のものだと主張せず、共有していたと書きながら（使徒の働き4章32節）、その理由を、使徒たちが大いなる力をもって主イエスの復活を証しし、群れが大きな恵みを受けていたからだと説明しています（使徒の働き4章33節）。","s":2905.596,"e":2927.273,"p":false,"h":false},{"t":"だれも律法によって強制したのではなく、恵みが心を開いていただけです。","s":2927.52,"e":2932.876,"p":true,"h":false},{"t":"しかも、このことは長くは続きませんでした。","s":2933.388,"e":2936.603,"p":false,"h":false},{"t":"すぐに6章に行くと、教会の中で配給をめぐる不満が起こり、その後、エルサレム教会は他の地域の教会の助けを受けなければならないほど貧しくなります（使徒の働き11章27節から30節、ローマ人への手紙15章25節から26節）。","s":2936.808,"e":2957.033,"p":false,"h":false},{"t":"財産の共有が、教会の恒久的な制度にはならなかったということです。","s":2957.22,"e":2962.638,"p":false,"h":false},{"t":"新約聖書の手紙のどこにも、すべての教会が財産を共有せよという命令はありません。","s":2962.908,"e":2969.619,"p":false,"h":false},{"t":"むしろパウロは、それぞれが心に決めたとおりに、喜んで献げるようにと勧めています（コリント人への手紙 第二9章7節）。","s":2969.82,"e":2979.286,"p":true,"h":false},{"t":"では、この場面には何の意味もないのでしょうか。","s":2979.72,"e":2983.109,"p":false,"h":false},{"t":"そうではありません。","s":2983.428,"e":2984.705,"p":false,"h":false},{"t":"これは、聖霊が臨まれた共同体に現れた実でした。","s":2985.336,"e":2989.495,"p":false,"h":false},{"t":"救済を義務として定めたのではなく、恵みを受けた心が自然に生み出した結果でした。","s":2989.692,"e":2996.116,"p":false,"h":false},{"t":"私たちが学ぶべきことは、制度を複製することではなく、恵みが財産に対する心をこのように変えるという事実です。","s":2996.316,"e":3005.117,"p":true,"h":false},{"t":"バルナバの名","s":3005.604,"e":3006.537,"p":true,"h":false},{"t":"ルカは、具体的に一人の人物を紹介します。","s":3007.512,"e":3011.189,"p":false,"h":false},{"t":"キプロス生まれのレビ人ヨセフが畑を売り、その代金を使徒たちの足もとに置き、使徒たちは彼を、慰めの子という意味のバルナバと呼んだとあります（使徒の働き4章36節から37節）。","s":3011.472,"e":3026.801,"p":true,"h":false},{"t":"バルナバの物語は、称賛に値する一人の人物を紹介するだけでは終わりません。","s":3027.276,"e":3033.487,"p":false,"h":false},{"t":"すぐ後に続くアナニアとサッピラの物語と対になっています。","s":3033.684,"e":3038.299,"p":false,"h":false},{"t":"一方は土地を売って持って来て、もう一方も土地を売って持って来ました。","s":3038.544,"e":3043.439,"p":false,"h":false},{"t":"外から見れば、同じ行動です。","s":3043.692,"e":3046.176,"p":false,"h":false},{"t":"ところが、一方は称賛され、もう一方は死にます。","s":3046.464,"e":3050.626,"p":false,"h":false},{"t":"違いはどこにあったのでしょうか。","s":3050.856,"e":3052.98,"p":true,"h":false},{"t":"アナニアとサッピラの罪","s":3053.448,"e":3055.265,"p":true,"h":false},{"t":"アナニアとサッピラの夫婦は所有地を売りましたが、その代金の一部を隠しておき、一部だけを持って来て使徒たちの足もとに置きました（使徒の働き5章1節から2節）。","s":3055.68,"e":3068.567,"p":false,"h":false},{"t":"問題は、隠したことにあったのではありません。","s":3068.784,"e":3072.111,"p":false,"h":false},{"t":"ペテロの言葉を聞いてみましょう。","s":3072.312,"e":3074.414,"p":true,"h":false},{"t":"その土地は、売らずにおけば、あなたのものであり、売ってからも、その代金はあなたの自由になるのではなかったか（使徒の働き5章4節）。","s":3074.868,"e":3085.617,"p":false,"h":false},{"t":"初めから、すべてを献げよという要求があったのではありません。","s":3085.848,"e":3090.221,"p":false,"h":false},{"t":"そうだとすれば、罪は所有物をすべて献げなかったことにあるのではありません。","s":3090.42,"e":3096.347,"p":false,"h":false},{"t":"ペテロが指摘した罪は、偽りでした。","s":3096.54,"e":3099.459,"p":false,"h":false},{"t":"一部だけを献げながら、すべてを献げたかのように見せようとしたのです。","s":3099.672,"e":3104.426,"p":false,"h":false},{"t":"人から献身的な信者だという評判を得ようとし、そのために神の前で偽りを企てました。","s":3104.64,"e":3111.912,"p":true,"h":false},{"t":"ですからペテロは、このことを次のように言い表します。","s":3112.38,"e":3116.41,"p":false,"h":false},{"t":"どうしてあなたはサタンに心を奪われて聖霊を欺いたのか（使徒の働き5章3節）。","s":3116.7,"e":3123.467,"p":false,"h":false},{"t":"あなたは人に偽りを言ったのではなく、神に偽りを言ったのだ（使徒の働き5章4節）。","s":3123.684,"e":3130.625,"p":false,"h":false},{"t":"恵みに感動して献げたバルナバの献金とは違い、アナニアとサッピラは、恵みの形を借りて自分を高めようとしました。","s":3130.812,"e":3139.603,"p":false,"h":false},{"t":"違っていたのは献金の額ではなく、心の向きでした。","s":3139.812,"e":3143.995,"p":true,"h":false},{"t":"この罪がこれほど重く扱われた理由","s":3144.456,"e":3147.541,"p":true,"h":false},{"t":"この物語を読むと、だれもが居心地の悪さを覚えます。","s":3147.984,"e":3152.162,"p":false,"h":false},{"t":"一度の偽りで死とは、あまりにも苛酷ではないかと思います。","s":3152.412,"e":3156.736,"p":false,"h":false},{"t":"本文の刃を鈍らせてはなりません。","s":3157.056,"e":3159.43,"p":false,"h":false},{"t":"神は実際にこの二人を打たれ、ルカはそのことを何の弁明もなく記録しています。","s":3159.612,"e":3165.639,"p":false,"h":false},{"t":"それでもルカは、この出来事を理解するための手がかりを残しています。","s":3165.912,"e":3170.751,"p":true,"h":false},{"t":"このことは、教会が始まったばかりの時に起こりました。","s":3171.312,"e":3175.206,"p":false,"h":false},{"t":"聖書には、このように神が新しい始まりの場で、聖さの基準を明確に示された例があります。","s":3175.488,"e":3182.729,"p":false,"h":false},{"t":"荒野で幕屋が建てられ、いけにえが献げられ始めた時、ナダブとアビフは異なる火を献げて死にました。","s":3183.12,"e":3190.472,"p":false,"h":false},{"t":"神は、わたしに近づく者によって、わたしは聖なる者とされると言われました（レビ記10章3節）。","s":3190.752,"e":3198.525,"p":false,"h":false},{"t":"カナンの征服が始まった時には、アカンが聖絶のものを盗んで死にました（ヨシュア記7章）。","s":3198.744,"e":3205.548,"p":false,"h":false},{"t":"新しい共同体の始まりにおいて、神はご自身の聖さを身をもって示されます。","s":3205.764,"e":3211.816,"p":true,"h":false},{"t":"教会にも、同じことが起こったのです。","s":3212.424,"e":3215.274,"p":false,"h":false},{"t":"神が聖霊によって建てられた共同体の中で、聖霊を欺くことは軽く見過ごされることではありませんでした。","s":3215.52,"e":3223.484,"p":false,"h":false},{"t":"この出来事の後、教会全体とこのことを聞いた人々は、非常に恐れたとあります（使徒の働き5章11節）。","s":3223.692,"e":3232.721,"p":false,"h":false},{"t":"ルカが「教会」という言葉を明確に使う最初の箇所が、まさにこの場面であることも意味深いことです。","s":3232.944,"e":3240.634,"p":false,"h":false},{"t":"教会は、神が恐るべきお方であることを知る人々の集まりとして、世に現れました。","s":3240.9,"e":3247.618,"p":true,"h":false},{"t":"ただし、一つのことは正直に言わなければなりません。","s":3248.064,"e":3251.993,"p":false,"h":false},{"t":"この夫婦が永遠の救いから除かれたのかどうかを、聖書は語っていません。","s":3252.168,"e":3257.443,"p":false,"h":false},{"t":"本文が語っているのは、神が彼らをこの地上で打たれたという事実までです。","s":3257.64,"e":3263.111,"p":false,"h":false},{"t":"その先を、私たちが断定することはできません。","s":3263.4,"e":3266.98,"p":true,"h":false},{"t":"今日の教会が読むべきこと","s":3267.432,"e":3269.589,"p":true,"h":false},{"t":"この本文は、しばしば二つの仕方で誤用されます。","s":3270.024,"e":3273.85,"p":true,"h":false},{"t":"一つは、財産の共有を信者の義務にすることです。","s":3274.38,"e":3278.463,"p":false,"h":false},{"t":"先に見たとおり、ペテロが「その土地はあなたのものではなかったか」と尋ねた言葉が、それを防いでいます。","s":3278.736,"e":3286.752,"p":false,"h":false},{"t":"所有物をどうするかは、自由な応答であるべきでした。","s":3286.98,"e":3291.189,"p":true,"h":false},{"t":"もう一つは、この物語を献金を強いる道具として使うことです。","s":3291.624,"e":3296.505,"p":false,"h":false},{"t":"神に約束したものをすべて献げなければ罰を受ける、というような説教です。","s":3296.772,"e":3302.216,"p":false,"h":false},{"t":"これも本文に合いません。","s":3302.496,"e":3304.239,"p":false,"h":false},{"t":"アナニアとサッピラの罪は、少なく献げたことではなく、欺いたことにありました。","s":3304.44,"e":3310.379,"p":true,"h":false},{"t":"本文が私たちに問うているのは、これです。","s":3310.92,"e":3313.988,"p":false,"h":false},{"t":"私が神に献げるものは、恵みに感動した心から出たのか、それとも人に見せようとする心から出たのか。","s":3314.232,"e":3322.107,"p":false,"h":false},{"t":"神は心をご覧になるので、だれにも知られずに献げた小さなものが、人々の前で大きく献げたものより尊いことがあります。","s":3322.404,"e":3331.534,"p":true,"h":false},{"t":"そして、もう一つ言わなければなりません。","s":3332.052,"e":3334.975,"p":false,"h":false},{"t":"この二人は恵みを利用しましたが、この出来事の中心には、今も復活された主が聖霊によってご自身の教会を守っておられるという事実があります。","s":3335.148,"e":3346.179,"p":false,"h":false},{"t":"その主の臨在が慰めであると同時に恐れでもあることを、教会はこの出来事の後に学びました。","s":3346.524,"e":3353.874,"p":true,"h":false}]},{"title":"6.ステパノはなぜ弁明をせず、旧約の歴史を長く語った末に殉教するのでしょうか","audio":"book_2610280719_1.mp3","start":3354.336,"end":4017.888,"dur":663.6,"segs":[{"t":"6.ステパノはなぜ弁明をせず、旧約の歴史を長く語った末に殉教するのでしょうか","s":3354.336,"e":3361.204,"p":true,"h":false},{"t":"本文：使徒の働き6章8節から8章3節まで（ともに読む本文：創世記12章1節から3節、出エジプト記2章11節から15節、出エジプト記3章1節から10節、エレミヤ書7章1節から15節、イザヤ書66章1節から2節、ルカの福音書23章34節、ルカの福音書23章46節）","s":3361.644,"e":3390.543,"p":true,"h":false},{"t":"使徒の働きで最も長い説教は、ステパノの説教です。","s":3390.984,"e":3395.311,"p":false,"h":false},{"t":"しかし、この説教は読むのが最も難しいのです。","s":3395.592,"e":3399.507,"p":true,"h":false},{"t":"ステパノは、神殿と律法を冒瀆したという告発を受け、法廷に立ちます。","s":3400.02,"e":3405.614,"p":false,"h":false},{"t":"人々は、彼が弁明するものと思ったでしょう。","s":3405.888,"e":3409.304,"p":false,"h":false},{"t":"ところがステパノは、アブラハムから始めて、ヨセフ、モーセ、幕屋、ソロモンの神殿に至るまで、イスラエルの歴史をたどっていきます。","s":3409.524,"e":3419.773,"p":false,"h":false},{"t":"告発とは関係がないように見える話が、50節近くも続きます。","s":3420,"e":3425.083,"p":false,"h":false},{"t":"すると突然、語調が変わり、あなたがたはうなじを固くした人たちだと宣言します。","s":3425.364,"e":3431.461,"p":false,"h":false},{"t":"そして、石で打ち殺されます。","s":3431.736,"e":3434.052,"p":true,"h":false},{"t":"この文章では、この長い歴史の要約が、実は緻密に組み立てられた応答であることを見ていきます。","s":3434.652,"e":3442.012,"p":false,"h":false},{"t":"ステパノは弁明したのではなく、告発を覆して、告発者を法廷の被告席に立たせたのです。","s":3442.32,"e":3449.678,"p":true,"h":false},{"t":"何を告発されたのか","s":3450.204,"e":3451.972,"p":true,"h":false},{"t":"ステパノは、恵みと力に満ち、民の中で大きなしるしと不思議を行っていた人でした（使徒の働き6章8節）。","s":3452.472,"e":3461.539,"p":false,"h":false},{"t":"彼の語ることに反論できなくなった人々が、偽りの証人を立てて告発します。","s":3461.76,"e":3467.787,"p":false,"h":false},{"t":"この人が、この聖なる所と律法に逆らうことを語り、ナザレ人イエスがこの所を壊し、モーセが伝えた慣例を変えると言うのを聞いた、というのです（使徒の働き6章13節から14節）。","s":3468.06,"e":3482.984,"p":true,"h":false},{"t":"告発の核心は、神殿と律法です。","s":3483.432,"e":3486.484,"p":false,"h":false},{"t":"神殿は神がおられる所であり、律法は神が与えられた道だと信じていた人々にとって、この二つに触れることは、すなわち神を冒瀆することでした。","s":3486.744,"e":3498.01,"p":false,"h":false},{"t":"大祭司は、このことは事実なのかと尋ねます。","s":3498.228,"e":3501.705,"p":false,"h":false},{"t":"ステパノの説教は、この質問への答えです。","s":3501.972,"e":3505.372,"p":true,"h":false},{"t":"神はいつも、この地の外で先に働かれた","s":3505.86,"e":3509.45,"p":true,"h":false},{"t":"ステパノはアブラハムから始めます。","s":3509.892,"e":3512.322,"p":false,"h":false},{"t":"栄光の神が、メソポタミアにいたアブラハムに現れたと言います（使徒の働き7章2節）。","s":3512.592,"e":3519.601,"p":false,"h":false},{"t":"ハランからカナンへ召し出されたとき、神は彼に、この地で足の踏み場となるほどの地も相続地として与えなかったと言います（使徒の働き7章5節）。","s":3519.792,"e":3531.088,"p":false,"h":false},{"t":"神殿のあるこの地ではなく、異邦の地で神が約束を与えられたというのです。","s":3531.312,"e":3537.072,"p":true,"h":false},{"t":"ヨセフも同じです。","s":3537.612,"e":3538.96,"p":false,"h":false},{"t":"兄弟たちのねたみを受けてエジプトに売られましたが、神は彼とともにおられました（使徒の働き7章9節）。","s":3539.52,"e":3547.746,"p":false,"h":false},{"t":"神の救いは、エジプトで起こりました。","s":3547.98,"e":3550.777,"p":false,"h":false},{"t":"モーセはなおさらです。","s":3550.968,"e":3552.353,"p":false,"h":false},{"t":"神はイスラエルの地ではなく、ミディアンの荒野、燃える柴の前でモーセを召し出されます。","s":3552.876,"e":3559.103,"p":false,"h":false},{"t":"そして、モーセが立っていた所は聖なる地だと語られます（使徒の働き7章33節）。","s":3559.392,"e":3566.554,"p":false,"h":false},{"t":"土地が聖かったから神が来られたのではなく、神が来られたので土地が聖くなったのです。","s":3566.808,"e":3573.13,"p":true,"h":false},{"t":"ステパノの論旨は、このように積み重ねられていきます。","s":3573.72,"e":3577.46,"p":false,"h":false},{"t":"神は神殿という一つの場所に縛られてはおられず、イスラエルの歴史における決定的な瞬間ごとに、イスラエルの地の外で働かれたということです。","s":3577.716,"e":3588.431,"p":false,"h":false},{"t":"神殿を神と同一視する人々にとって、これは最も根本的な反論です。","s":3588.732,"e":3594.809,"p":true,"h":false},{"t":"遣わされた方を退ける民","s":3595.32,"e":3597.638,"p":true,"h":false},{"t":"ステパノが歴史をたどりながら繰り返し示すパターンが、もう一つあります。","s":3598.092,"e":3603.101,"p":false,"h":false},{"t":"神が救い主を遣わされると、民がその方を退けるということです。","s":3603.42,"e":3608.447,"p":true,"h":false},{"t":"ヨセフは兄弟たちに売られました。","s":3608.964,"e":3611.404,"p":false,"h":false},{"t":"モーセは初め、イスラエルの同胞たちに退けられました。","s":3611.592,"e":3615.806,"p":false,"h":false},{"t":"「だれがあなたを、私たちの支配者、また裁判官にしたのか」と言われました（使徒の働き7章27節）。","s":3616.02,"e":3624.492,"p":false,"h":false},{"t":"しかしステパノは、そのモーセを神がまさに支配者、また救い主として立て、遣わされたと言います（使徒の働き7章35節）。","s":3624.696,"e":3634.915,"p":false,"h":false},{"t":"民が拒んだ人を、神はかえって高く立てられたのです。","s":3635.136,"e":3638.997,"p":false,"h":false},{"t":"イスラエルは、モーセがシナイ山に上っている間に、金の子牛を造りました（使徒の働き7章39節から41節）。","s":3639.24,"e":3649.195,"p":true,"h":false},{"t":"このパターンが積み重ねられた後に、ステパノの結論が出てきます。","s":3649.644,"e":3654.29,"p":false,"h":false},{"t":"あなたがたの先祖たちが迫害しなかった預言者が、だれかいたでしょうか。","s":3654.612,"e":3659.689,"p":false,"h":false},{"t":"義なる方が来られることを前もって告げた人々まで殺し、あなたがたは今、その義なる方を裏切り、殺した者となった、というのです（使徒の働き7章52節）。","s":3659.868,"e":3672.44,"p":false,"h":false},{"t":"ステパノは初めから、これを語るために歴史をたどってきたのです。","s":3672.648,"e":3677.106,"p":true,"h":false},{"t":"神殿についての最後の言葉","s":3677.616,"e":3679.993,"p":true,"h":false},{"t":"その間に、神殿についての言葉が出てきます。","s":3680.46,"e":3683.905,"p":false,"h":false},{"t":"神の幕屋は荒野を移動する天幕であり、ダビデが神殿を建てようとしましたが、建てたのはソロモンだったと言います。","s":3684.204,"e":3692.605,"p":false,"h":false},{"t":"そして続けて、こう語ります。","s":3692.88,"e":3695.057,"p":false,"h":false},{"t":"いと高き方は、手で造った所にはお住みにならない（使徒の働き7章48節）。","s":3695.328,"e":3702.45,"p":true,"h":false},{"t":"彼はイザヤ書66章を引用します。","s":3702.888,"e":3706.021,"p":false,"h":false},{"t":"「天はわたしの王座、地はわたしの足台。","s":3706.344,"e":3709.478,"p":false,"h":false},{"t":"あなたがたは、わたしのためにどんな家を建てるというのか。","s":3709.656,"e":3713.8,"p":false,"h":false},{"t":"わたしの安息の場所はどこにあるのか」（イザヤ書66章1節から2節）。","s":3714.012,"e":3720.046,"p":false,"h":false},{"t":"これは、神が神殿に反対されたのではなく、神殿に閉じ込められる方ではないということです。","s":3720.276,"e":3727.16,"p":false,"h":false},{"t":"神殿は神を納める箱ではなく、神が臨在される場所を指し示すしるしでした。","s":3727.44,"e":3733.48,"p":false,"h":false},{"t":"エレミヤも、ただ「主の宮」と叫んで安心している民に向かって、同じことを語ったことがあります（エレミヤ書7章4節）。","s":3733.668,"e":3743.384,"p":true,"h":false},{"t":"ですから、ステパノが神殿を冒瀆したという告発は正確ではありませんでした。","s":3743.82,"e":3749.44,"p":false,"h":false},{"t":"彼は、神殿を神そのものと取り違える心を叱責したのであり、その取り違えこそがイエスを拒むことになった根だと指摘したのです。","s":3749.652,"e":3759.302,"p":false,"h":false},{"t":"イエスが神殿を壊し、三日で建て直すと言われた言葉は、ご自分のからだを指していたのです（ヨハネの福音書2章19節から21節）。","s":3759.552,"e":3770.456,"p":false,"h":false},{"t":"まことの神殿は今や建物ではなくキリストですが、建物にとらわれた人々はその方を知りませんでした。","s":3770.676,"e":3778.454,"p":true,"h":false},{"t":"説教が止まった場所","s":3778.92,"e":3780.558,"p":true,"h":false},{"t":"ステパノが語り終えたとき、人々は歯ぎしりしました。","s":3780.972,"e":3785.037,"p":false,"h":false},{"t":"そのときステパノは、聖霊に満たされて天を見つめ、神の栄光と、神の右に立っておられるイエスを見ます（使徒の働き7章55節）。","s":3785.22,"e":3795.936,"p":false,"h":false},{"t":"そして、天が開かれ、人の子が神の右に立っておられるのが見えると言います（使徒の働き7章56節）。","s":3796.128,"e":3804.586,"p":true,"h":false},{"t":"この場面には、注目すべき点があります。","s":3805.056,"e":3808.028,"p":false,"h":false},{"t":"新約聖書は、昇天されたイエスが神の右に座しておられるとしばしば語りますが、ここでは立っておられます。","s":3808.332,"e":3816.491,"p":false,"h":false},{"t":"この違いについては、いくつもの解釈があります。","s":3816.756,"e":3820.246,"p":false,"h":false},{"t":"殉教する証人を迎えるために立ち上がられたのだと見ることもできますし、法廷でご自分の証人を弁護するために立っておられるのだと見ることもできます。","s":3820.536,"e":3831.036,"p":false,"h":false},{"t":"本文は理由を語っていないので、一つだけに断定するのは難しいです。","s":3831.372,"e":3836.587,"p":false,"h":false},{"t":"ただ、明らかなことは、地上の法廷でステパノが告発されているまさにその時、天の法廷では人の子が彼の味方として立っておられたということです。","s":3836.844,"e":3847.837,"p":true,"h":false},{"t":"そしてステパノの最後の言葉は、偶然と言うにはあまりにも、イエスが十字架の上で語られた言葉に似ています。","s":3848.4,"e":3856.571,"p":false,"h":false},{"t":"「主イエスよ。","s":3856.896,"e":3857.871,"p":false,"h":false},{"t":"私の霊をお受けください。」","s":3858.804,"e":3860.676,"p":false,"h":false},{"t":"「主よ。","s":3860.856,"e":3861.385,"p":false,"h":false},{"t":"この罪を彼らに負わせないでください」（使徒の働き7章59節から60節）。","s":3861.576,"e":3867.927,"p":false,"h":false},{"t":"これは、ルカの福音書の十字架の場面ですでに一度聞いた言葉です（ルカの福音書23章34節、46節）。","s":3868.128,"e":3877.958,"p":false,"h":false},{"t":"ステパノは死を前にして、自分の主にそのまま似た姿で死にました。","s":3878.172,"e":3883.035,"p":true,"h":false},{"t":"一人の死が開いた道","s":3883.5,"e":3885.292,"p":true,"h":false},{"t":"本文は、ステパノの死について、このような言葉で終わります。","s":3885.732,"e":3890.084,"p":false,"h":false},{"t":"サウロは、彼が殺されることに賛成していました（使徒の働き8章1節）。","s":3890.376,"e":3896.31,"p":false,"h":false},{"t":"証人たちが上着を脱いで、サウロという青年の足もとに置いたという言葉が、その前に出てきます（使徒の働き7章58節）。","s":3896.532,"e":3906.533,"p":false,"h":false},{"t":"この青年が、後に使徒パウロとなります。","s":3906.72,"e":3909.676,"p":true,"h":false},{"t":"そしてまさにその日、エルサレムの教会に対して大迫害が起こり、使徒たち以外の者はみな、ユダヤとサマリアの諸地方に散らされました（使徒の働き8章1節）。","s":3910.248,"e":3922.615,"p":false,"h":false},{"t":"しかし、散らされた人たちは巡り歩いて、福音のことばを宣べ伝えたと言います（使徒の働き8章4節）。","s":3922.812,"e":3931.278,"p":false,"h":false},{"t":"主が昇天の際に約束された、ユダヤとサマリアへ至る道が、一人の死と大迫害を通して開かれたのです。","s":3931.488,"e":3939.488,"p":true,"h":false},{"t":"迫害は教会を止めるために起こりましたが、神はそれを人々を散らすために用いられました。","s":3940.02,"e":3946.613,"p":false,"h":false},{"t":"人間の悪が神のご計画の中に入り、福音の道となるこの構造を、私たちはすでに見てきました。","s":3946.896,"e":3954.724,"p":false,"h":false},{"t":"ステパノは、自分が死ぬことによって、この構造をその身をもって示しました。","s":3954.924,"e":3960.47,"p":true,"h":false},{"t":"ステパノが私たちに教えること","s":3960.936,"e":3963.315,"p":true,"h":false},{"t":"この本文は、信者に殉教せよと求めるものではありません。","s":3963.78,"e":3968.291,"p":false,"h":false},{"t":"本文は、神がどのようなお方であるかを語っています。","s":3968.496,"e":3972.408,"p":false,"h":false},{"t":"神は、神殿にも土地にも制度にも閉じ込められないお方であり、人が退けた者をかえって高く上げられるお方であり、ご自分の証人を天から見守っておられるお方です。","s":3972.672,"e":3985.222,"p":true,"h":false},{"t":"私たちはステパノの説教を読みながら、自分の内にある神殿を点検することになります。","s":3985.812,"e":3992.21,"p":false,"h":false},{"t":"自分が神だと信じて握りしめているものが、実は神を指し示すしるしにすぎないのではないか、そのしるしに縛られて、神が遣わされた方を知ることができなくなっているのではないかと、自らに問うことになります。","s":3992.544,"e":4007.74,"p":false,"h":false},{"t":"この問いの前で、ステパノが見たものを、私たちも信仰によって見ます。","s":4008.024,"e":4013.155,"p":false,"h":false},{"t":"天は開かれており、人の子は神の右におられます。","s":4013.424,"e":4017.273,"p":true,"h":false}]},{"title":"7.サウロはなぜ選ばれたのか：ダマスコへの道で三度繰り返される回心の物語","audio":"book_2610280719_1.mp3","start":4017.888,"end":4599.864,"dur":582,"segs":[{"t":"7.サウロはなぜ選ばれたのか：ダマスコへの道で三度繰り返される回心の物語","s":4017.888,"e":4024.22,"p":true,"h":false},{"t":"本文：使徒の働き9章1節から31節（一緒に読む本文：使徒の働き22章3節から21節、使徒の働き26章9節から23節、ガラテヤ人への手紙1章11節から24節、ピリピ人への手紙3章4節から9節、テモテへの手紙 第一1章12節から16節、コリント人への手紙 第一15章8節から10節、使徒の働き16章14節）","s":4024.692,"e":4057.382,"p":true,"h":false},{"t":"使徒の働きは、同じ話をほとんど繰り返さない書物です。","s":4057.848,"e":4062.451,"p":false,"h":false},{"t":"一つの出来事に一度だけ紙幅を使うのが、この書物のやり方です。","s":4062.708,"e":4067.805,"p":false,"h":false},{"t":"ところが、ダマスコへの道での出来事だけは三度出てきます。","s":4068.072,"e":4072.245,"p":false,"h":false},{"t":"9章で一度、22章でパウロがエルサレムの群衆の前で語るときに一度、26章でアグリッパ王の前で語るときに一度です。","s":4072.536,"e":4082.96,"p":true,"h":false},{"t":"これは、ルカがこの出来事をどれほど重要に考えていたかを示しています。","s":4083.444,"e":4088.689,"p":false,"h":false},{"t":"そして、この物語が投げかける問いは単純ではありません。","s":4088.952,"e":4093.344,"p":false,"h":false},{"t":"神は、なぜよりによってサウロを選ばれたのでしょうか。","s":4093.524,"e":4097.239,"p":false,"h":false},{"t":"教会を最も激しく迫害していた人を、なぜ選ばれたのでしょうか。","s":4097.484,"e":4102.487,"p":true,"h":false},{"t":"教会を滅ぼそうとしていた人","s":4102.956,"e":4105.29,"p":true,"h":false},{"t":"まず、サウロがどのような人だったのかを見なければなりません。","s":4105.728,"e":4109.927,"p":false,"h":false},{"t":"彼はステパノを殺すことに賛成し、教会を荒らし回って、家々に入り、男も女も引きずり出して牢に渡していました。","s":4110.12,"e":4119.66,"p":false,"h":false},{"t":"9章は、彼がなおも主の弟子たちに対して脅かしと殺意に燃え、ダマスコの諸会堂へ向かう途上にあったことから始まります。","s":4119.876,"e":4128.95,"p":true,"h":false},{"t":"パウロ自身が後に、この時期についてどのように語ったかも重要です。","s":4129.524,"e":4134.501,"p":false,"h":false},{"t":"テモテに書いた手紙で、彼は以前には冒瀆する者、迫害する者、暴力を振るう者だったと言っています。","s":4134.78,"e":4142.682,"p":false,"h":false},{"t":"そして、自分は罪人のかしらだと言っています。","s":4142.952,"e":4146.351,"p":false,"h":false},{"t":"これは謙遜な言い方をした誇張ではなく、彼の本心でした。","s":4146.588,"e":4151.054,"p":false,"h":false},{"t":"彼は、自分が教会の迫害者だったことを生涯忘れることができませんでした。","s":4151.268,"e":4156.997,"p":true,"h":false},{"t":"このような人が、どうして選ばれた者となったのでしょうか。","s":4157.46,"e":4161.319,"p":false,"h":false},{"t":"この問いが、この本文の核心です。","s":4161.564,"e":4164.238,"p":true,"h":false},{"t":"道の上で捕らえられた方","s":4164.732,"e":4166.682,"p":true,"h":false},{"t":"ダマスコに近づいたとき、天からの光が彼を巡り照らし、サウロは地に倒れます。","s":4167.144,"e":4173.384,"p":false,"h":false},{"t":"そして、声が聞こえます。","s":4173.696,"e":4175.705,"p":false,"h":false},{"t":"「サウロ、サウロ。","s":4175.964,"e":4177.387,"p":false,"h":false},{"t":"なぜわたしを迫害するのか。」","s":4177.872,"e":4179.955,"p":true,"h":false},{"t":"サウロは尋ねます。","s":4180.392,"e":4181.695,"p":false,"h":false},{"t":"「主よ、あなたはどなたですか。」","s":4182.3,"e":4184.57,"p":false,"h":false},{"t":"答えはこうです。","s":4184.82,"e":4185.929,"p":false,"h":false},{"t":"「わたしは、あなたが迫害しているイエスである。」","s":4186.728,"e":4190.018,"p":false,"h":false},{"t":"この答えに注目しなければなりません。","s":4190.22,"e":4192.869,"p":false,"h":false},{"t":"サウロは教会を迫害していたのに、主は、わたしを迫害していると言われます。","s":4193.064,"e":4198.876,"p":false,"h":false},{"t":"教会に手を触れることは、すなわちキリストに手を触れることだということです。","s":4199.112,"e":4204.3,"p":false,"h":false},{"t":"キリストと教会は、それほど一つなのです。","s":4204.548,"e":4207.673,"p":true,"h":false},{"t":"ここで、サウロの状態をもう一度見てください。","s":4208.148,"e":4211.595,"p":false,"h":false},{"t":"サウロは悔い改めていたのでもなく、神を求めていたのでもなく、イエスを知りたいと思っていたのでもありませんでした。","s":4211.784,"e":4220.235,"p":false,"h":false},{"t":"彼は迫害の旅のただ中にいました。","s":4220.496,"e":4223.335,"p":false,"h":false},{"t":"主導権は初めから終わりまで主にありました。","s":4223.52,"e":4226.824,"p":false,"h":false},{"t":"三度目の記録である26章では、主がこのように付け加えられます。","s":4227.084,"e":4232.161,"p":false,"h":false},{"t":"「とげの付いた棒を蹴るのは、あなたには痛いことだ。」","s":4232.448,"e":4236.041,"p":false,"h":false},{"t":"鋭い棒を蹴る牛に向けて言う言葉です。","s":4236.228,"e":4239.187,"p":false,"h":false},{"t":"サウロは主に逆らっていましたが、それは自分の力でしていたことではなく、主がすでに彼を捕らえておられたという意味に読むことができます。","s":4239.468,"e":4249.199,"p":true,"h":false},{"t":"パウロの証しが示すこと","s":4249.764,"e":4251.625,"p":true,"h":false},{"t":"パウロは後に、ガラテヤの教会に送った手紙で、この出来事をこのように説明しています。","s":4252.104,"e":4258.669,"p":false,"h":false},{"t":"「母の胎にいるときから私を選び分け、恵みによって召してくださった神が、ご自分の御子を私のうちに啓示して、異邦人に福音を宣べ伝えさせようとお決めになったとき」。","s":4258.944,"e":4271.799,"p":false,"h":false},{"t":"パウロが語る順序を見てください。","s":4272.012,"e":4274.202,"p":false,"h":false},{"t":"神が選ばれ、恵みによって召され、御子を現すことを望まれました。","s":4274.424,"e":4279.499,"p":false,"h":false},{"t":"これらすべての文の主語は神です。","s":4279.716,"e":4282.063,"p":false,"h":false},{"t":"パウロは自分の決断や悟りを、一度も前に出していません。","s":4282.38,"e":4286.908,"p":true,"h":false},{"t":"テモテへの手紙 第一では、さらに進んで、神がなぜそのようにされたのか、その理由を語っています。","s":4287.348,"e":4294.963,"p":false,"h":false},{"t":"「私があわれみを受けたのは、キリスト・イエスがこの上ない寛容をまず私に示し、やがて主を信じて永遠のいのちを得ることになる人々の先例にするためでした。」","s":4295.232,"e":4307.146,"p":false,"h":false},{"t":"神は、最も大きな迫害者を救うことによって、どのような罪人も救われ得ることを示されました。","s":4307.364,"e":4314.854,"p":true,"h":false},{"t":"ですから、サウロが選ばれた理由はサウロにあるのではなく、神にあります。","s":4315.32,"e":4320.71,"p":false,"h":false},{"t":"サウロに熱心があったからでもなく、後に使徒として大きな働きをするからでもありません。","s":4320.972,"e":4327.371,"p":false,"h":false},{"t":"神は、彼の熱心が誤った方向に向けられていたことをご存じでありながら彼を選ばれ、その選びがサウロの人生を覆しました。","s":4327.56,"e":4337.498,"p":false,"h":false},{"t":"これが恵みです。","s":4337.712,"e":4338.815,"p":true,"h":false},{"t":"選びは使命であり、苦難である","s":4339.62,"e":4342.098,"p":true,"h":false},{"t":"主はダマスコの弟子アナニアに現れ、サウロに手を置くようにと言われます。","s":4342.536,"e":4347.676,"p":false,"h":false},{"t":"アナニアはためらいます。","s":4347.936,"e":4349.389,"p":false,"h":false},{"t":"彼は、サウロがエルサレムで聖徒たちにどれほど多くの害を加えたかを聞いたと言います。","s":4349.844,"e":4355.971,"p":false,"h":false},{"t":"主はこのように答えられます。","s":4356.252,"e":4358.317,"p":false,"h":false},{"t":"「行きなさい。","s":4358.592,"e":4359.403,"p":false,"h":false},{"t":"あの人は、わたしの名を異邦人、王たち、イスラエルの子らの前に運ぶ、わたしの選びの器です。」","s":4360.5,"e":4368.174,"p":true,"h":false},{"t":"その次の御言葉が重要です。","s":4368.672,"e":4370.956,"p":false,"h":false},{"t":"「わたしの名のために、彼がどんなに苦しまなければならないかを、わたしは彼に示します。」","s":4371.228,"e":4377.603,"p":false,"h":false},{"t":"選びは、栄光の場所へ召すことに先立って、苦難の場所へ召すことでした。","s":4377.852,"e":4383.404,"p":false,"h":false},{"t":"使徒の働きの後半は、この約束がどのように実現したかを示しています。","s":4383.612,"e":4389.181,"p":false,"h":false},{"t":"パウロは打たれ、牢に入れられ、難船し、ついにはローマの鎖につながれます。","s":4389.48,"e":4395.303,"p":false,"h":false},{"t":"しかし、それは主があらかじめ示された道でした。","s":4395.672,"e":4399.336,"p":true,"h":false},{"t":"そして、見逃すことのできない場面が一つあります。","s":4399.848,"e":4403.401,"p":false,"h":false},{"t":"アナニアはサウロのもとに来て、「兄弟サウロ」と呼びかけます。","s":4403.7,"e":4408.118,"p":false,"h":false},{"t":"ほんの数日前まで教会を踏みにじっていた人を、教会は兄弟と呼ぶのです。","s":4408.416,"e":4414.197,"p":false,"h":false},{"t":"神の恵みは、教会にも最も難しいことを求めました。","s":4414.428,"e":4419.111,"p":false,"h":false},{"t":"迫害者を兄弟として受け入れることです。","s":4419.288,"e":4422.046,"p":true,"h":false},{"t":"三度繰り返される理由","s":4422.564,"e":4424.394,"p":true,"h":false},{"t":"それでは、なぜルカはこの物語を三度も記録したのでしょうか。","s":4424.832,"e":4429.551,"p":false,"h":false},{"t":"三つの記録を比べると、強調点が少しずつ異なることに気づきます。","s":4429.872,"e":4435.267,"p":true,"h":false},{"t":"9章は、この出来事がどのように起こったのかを、事実に即して伝えます。","s":4435.812,"e":4441.389,"p":false,"h":false},{"t":"22章でパウロは、エルサレムのユダヤ人の群衆の前で語ります。","s":4441.68,"e":4446.764,"p":false,"h":false},{"t":"ですから、自分がガマリエルの足もとで律法を厳格に学んだ者であり、神に対して熱心だったことを強調し、アナニアを律法に従って敬虔で、すべてのユダヤ人から評判の良い人として紹介しています。","s":4447.044,"e":4462.632,"p":false,"h":false},{"t":"聞き手がユダヤ人だからです。","s":4462.956,"e":4464.904,"p":false,"h":false},{"t":"26章ではアグリッパ王の前で語りながらアナニアを省き、主が直接、自分を使命へと召されたことを前面に置いています。","s":4465.152,"e":4474.903,"p":true,"h":false},{"t":"同じ出来事を、聞き手に応じて異なる面から照らして語っているのです。","s":4475.448,"e":4480.484,"p":false,"h":false},{"t":"出来事の事実は一つも変わっていません。","s":4480.74,"e":4483.801,"p":false,"h":false},{"t":"これは、伝道者が福音の核心を変えることなく、聞く人の立場に合わせて語ることができることも示しています。","s":4483.98,"e":4492.231,"p":false,"h":false},{"t":"しかし、ルカが三度記録した最大の理由は、この出来事が使徒の働き全体の方向を変える転換点だったからでしょう。","s":4492.548,"e":4501.567,"p":false,"h":false},{"t":"異邦人へ福音を携えて行く人が、この出来事から始まるのです。","s":4501.872,"e":4506.924,"p":true,"h":false},{"t":"今日の信者がこの本文から受け取ること","s":4507.452,"e":4510.369,"p":true,"h":false},{"t":"この本文を読んで、パウロのような劇的な回心体験がなければ本物の信仰ではないと考えるなら、それは困ります。","s":4510.8,"e":4519.578,"p":false,"h":false},{"t":"使徒の働きの中でも、回心の姿はそれぞれ異なります。","s":4519.836,"e":4524.401,"p":false,"h":false},{"t":"ピリピのルディアについては、主が彼女の心を開いて、パウロの語ることに心を留めるようにされたとだけ記されています。","s":4524.696,"e":4533.292,"p":false,"h":false},{"t":"光も、声も、地に倒れることもありませんでした。","s":4533.588,"e":4537.582,"p":false,"h":false},{"t":"パウロの回心が特別だったのは、彼の使命が特別だったからであって、すべての回心の規格だからではありません。","s":4537.8,"e":4546.1,"p":true,"h":false},{"t":"回心のあり方は多様でも、回心の主体は同じです。","s":4546.62,"e":4550.783,"p":false,"h":false},{"t":"サウロを捕らえられた方がルディアの心を開かれた方であり、今、私たちの心を開かれた方です。","s":4551.012,"e":4558.289,"p":false,"h":false},{"t":"自分がどのように信じるようになったのかをよく考えてみるなら、その根源にはいつも、私が神を求める前に神が私を求めてくださったという事実があります。","s":4558.572,"e":4570.415,"p":true,"h":false},{"t":"パウロは自分を使徒たちの中で最も小さい者だと言って、このように語ります。","s":4570.992,"e":4576.657,"p":false,"h":false},{"t":"「私は使徒の中では最も小さい者であって、神の教会を迫害したのですから、使徒と呼ばれるに値しない者です。」","s":4576.932,"e":4585.854,"p":false,"h":false},{"t":"「ところが、神の恵みによって、私は今の私になりました。」","s":4586.076,"e":4590.935,"p":false,"h":false},{"t":"教会を迫害した者が使徒となったことが恵みであるなら、信者のすべての立場は同じ恵みの上に立っています。","s":4591.116,"e":4599.331,"p":true,"h":false}]},{"title":"8.コルネリオの出来事で、なぜペテロには幻が三度も必要だったのでしょうか：異邦人に開かれた扉","audio":"book_2610280719_1.mp3","start":4599.864,"end":5293.26,"dur":693.4,"segs":[{"t":"8.コルネリオの出来事で、なぜペテロには幻が三度も必要だったのでしょうか：異邦人に開かれた扉","s":4599.864,"e":4608.246,"p":true,"h":false},{"t":"本文：使徒の働き10章1節から11章18節（共に読む本文：創世記12章3節、レビ記11章1節から8節、イザヤ書56章3節から8節、使徒の働き15章7節から11節、ガラテヤ人への手紙2章11節から14節、エペソ人への手紙2章11節から22節）","s":4608.684,"e":4634.845,"p":true,"h":false},{"t":"使徒の働きには、異邦人が初めて福音を聞き、聖霊を受ける物語が、驚くほど長く記されています。","s":4635.288,"e":4643.758,"p":false,"h":false},{"t":"10章と11章にわたって、同じ出来事がほとんど二度繰り返されています。","s":4644.036,"e":4649.746,"p":false,"h":false},{"t":"それほどこの出来事が、教会の歴史における分水嶺だったということです。","s":4650.012,"e":4655.247,"p":true,"h":false},{"t":"ところが、この物語を読んでいると、一つ不思議な点が目につきます。","s":4655.772,"e":4660.869,"p":false,"h":false},{"t":"神はペテロに、同じ幻を三度もお見せになります。","s":4661.172,"e":4665.344,"p":false,"h":false},{"t":"神が一度語られれば十分なように思えますが、なぜ三度だったのでしょうか。","s":4665.672,"e":4671.074,"p":false,"h":false},{"t":"この文章では、この繰り返しが語っていることをたどりながら、異邦人に扉が開かれることが、いかに深い壁を越えることだったのかを見ていきます。","s":4671.288,"e":4681.814,"p":true,"h":false},{"t":"二人を同時に備えられる神","s":4682.376,"e":4684.61,"p":true,"h":false},{"t":"物語は二人の人物から始まります。","s":4685.076,"e":4687.988,"p":false,"h":false},{"t":"カイサリアのコルネリオは、イタリア隊の百人隊長です。","s":4688.28,"e":4692.382,"p":false,"h":false},{"t":"ローマの軍人であり、異邦人です。","s":4692.672,"e":4695.544,"p":false,"h":false},{"t":"ところが本文は、彼が敬虔で、家族全員とともに神を恐れ、人々に多くの施しをし、いつも神に祈りをささげている人だと紹介しています（使徒の働き10章2節）。","s":4695.804,"e":4709.832,"p":false,"h":false},{"t":"ある日、午後三時ごろ、彼は幻の中で御使いを見て、ヨッパにいるシモン・ペテロを招くようにと言われます。","s":4710.024,"e":4718.314,"p":true,"h":false},{"t":"続いて、ペテロの物語が語られます。","s":4718.844,"e":4721.734,"p":false,"h":false},{"t":"ヨッパで、革なめし職人シモンの家の屋上で祈っていたペテロは空腹を覚え、幻の中で天が開かれ、大きな布のような入れ物が下りて来るのを見ました。","s":4722.012,"e":4733.89,"p":false,"h":false},{"t":"その中には、四つ足の動物、地を這うもの、鳥が満ちていました。","s":4734.108,"e":4739.619,"p":false,"h":false},{"t":"そして、声が言います。","s":4739.832,"e":4741.61,"p":false,"h":false},{"t":"「ペテロよ、さあ、屠って食べなさい」（使徒の働き10章13節）。","s":4741.884,"e":4747.098,"p":true,"h":false},{"t":"ここで、神が一人ではなく二人を同時に動かしておられることが分かります。","s":4747.572,"e":4752.806,"p":false,"h":false},{"t":"コルネリオは人を遣わし、ペテロはその人たちが到着する直前に幻を受けます。","s":4753.08,"e":4759.478,"p":false,"h":false},{"t":"二人が互いを知らない状態で、神は両方を一度に備えられました。","s":4759.776,"e":4764.913,"p":false,"h":false},{"t":"異邦人伝道は、ペテロが計画して始めたことではなく、神が両方の扉を同時に開かれた出来事でした。","s":4765.104,"e":4773.295,"p":true,"h":false},{"t":"ペテロの拒み","s":4773.744,"e":4774.847,"p":true,"h":false},{"t":"ペテロの反応が重要です。","s":4775.652,"e":4777.53,"p":false,"h":false},{"t":"「主よ、そんなことはできません。」","s":4777.776,"e":4780.022,"p":false,"h":false},{"t":"「私はまだ一度も、きよくない物や汚れた物を食べたことがありません」（使徒の働き10章14節）。","s":4780.224,"e":4787.953,"p":false,"h":false},{"t":"ペテロは、生涯にわたって律法の定めどおり、きよい食べ物だけを食べてきた人です。","s":4788.144,"e":4794.419,"p":false,"h":false},{"t":"レビ記11章が定めた区別は、神が与えられたものでした。","s":4794.66,"e":4799.263,"p":false,"h":false},{"t":"彼は、この区別を守ることが神に忠実である道だと信じていました。","s":4799.448,"e":4804.989,"p":true,"h":false},{"t":"その拒みは、単なる食習慣の問題ではありませんでした。","s":4805.424,"e":4809.775,"p":false,"h":false},{"t":"異邦人と共に食事をすることは、ユダヤ人にとって汚れることであり、異邦人の家に入ることさえ違法と考えられていました（使徒の働き10章28節）。","s":4809.996,"e":4822.091,"p":false,"h":false},{"t":"食べ物の区別は、人の区別とつながっていました。","s":4822.308,"e":4825.985,"p":false,"h":false},{"t":"きよい動物と汚れた動物がいるように、選ばれた民と異邦人がいるという古くからの考えが、その根底にありました。","s":4826.196,"e":4834.952,"p":true,"h":false},{"t":"主がこの幻でなさろうとしたことは、食物の規定を変えることではありませんでした。","s":4835.412,"e":4841.399,"p":false,"h":false},{"t":"そのことは、後にペテロがこの幻を解き明かして語った言葉から明らかになります。","s":4841.604,"e":4848.002,"p":false,"h":false},{"t":"「神は私に、どんな人のことも、きよくない者、あるいは汚れた者と呼んではならないことを、示してくださいました」（使徒の働き10章28節）。","s":4848.264,"e":4859.854,"p":false,"h":false},{"t":"幻の目的は、人に対する心を正すことでした。","s":4860.036,"e":4864.137,"p":true,"h":false},{"t":"三度必要だった理由","s":4864.572,"e":4866.357,"p":true,"h":false},{"t":"声はこのように言います。","s":4866.804,"e":4868.502,"p":false,"h":false},{"t":"「神がきよめた物を、あなたがきよくないと言ってはならない。」","s":4868.82,"e":4872.791,"p":false,"h":false},{"t":"そして、このようなことが三度あったと記されています（使徒の働き10章15節から16節）。","s":4872.996,"e":4880.488,"p":false,"h":false},{"t":"なぜ三度だったのかを、本文は説明していません。","s":4880.7,"e":4884.548,"p":false,"h":false},{"t":"いくつかの可能性を考えることはできます。","s":4884.768,"e":4887.67,"p":true,"h":false},{"t":"一つは、この出来事が確かな事実であることを強調する方法だという解釈です。","s":4888.188,"e":4894.362,"p":false,"h":false},{"t":"聖書では、同じことが三度起こると、そのことが確定されたという意味で読まれる場合が多くあります。","s":4894.596,"e":4902.18,"p":false,"h":false},{"t":"もう一つは、ペテロの頑なさがそれほど深かったという解釈です。","s":4902.516,"e":4907.431,"p":false,"h":false},{"t":"一度見ただけで解ける偏見ではありませんでした。","s":4907.7,"e":4910.981,"p":false,"h":false},{"t":"何年にもわたって身についた信念は、一瞬で覆されるものではありません。","s":4911.192,"e":4916.719,"p":true,"h":false},{"t":"主の三度の問いかけに三度否んだペテロと結びつけて読む解釈もありますが、本文はこの結びつきを直接語っていないので、断定することは難しいです。","s":4917.168,"e":4928.717,"p":false,"h":false},{"t":"ただ、はっきりしているのは、神がペテロが理解するまで待ってくださったという点です。","s":4929.012,"e":4934.849,"p":false,"h":false},{"t":"神は偏見を持つ人を威圧するのではなく、その人が悟るまで繰り返し教えられます。","s":4935.132,"e":4941.434,"p":true,"h":false},{"t":"敬虔な人は救われるのか","s":4941.972,"e":4943.992,"p":true,"h":false},{"t":"異邦人コルネリオは、本文で非常に良い姿として描かれています。","s":4944.42,"e":4949.598,"p":false,"h":false},{"t":"彼の祈りと施しは神の御前に上って覚えられている、とあります（使徒の働き10章4節）。","s":4949.892,"e":4957.233,"p":false,"h":false},{"t":"それではコルネリオは、福音がなくてもすでに救われていた人だったのでしょうか。","s":4957.452,"e":4962.817,"p":true,"h":false},{"t":"本文は、そのようには語っていません。","s":4963.284,"e":4966.057,"p":false,"h":false},{"t":"御使いがコルネリオにペテロを招くよう命じた理由を、ペテロは後にこのように伝えています。","s":4966.236,"e":4972.921,"p":false,"h":false},{"t":"「その人が、あなたとあなたの家の者全員を救うことばを、あなたに話してくれます」（使徒の働き11章14節）。","s":4973.22,"e":4982.599,"p":false,"h":false},{"t":"敬虔で施しをする人であっても、救われることばを聞かなければなりませんでした。","s":4982.796,"e":4988.384,"p":false,"h":false},{"t":"ローマ人への手紙が語るとおり、信仰は聞くことから始まり、聞くことはキリストについてのみことばによるのです（ローマ人への手紙10章17節）。","s":4988.592,"e":4999.636,"p":true,"h":false},{"t":"コルネリオの敬虔さは救いの根拠ではなく、神がすでに彼に働いておられたしるしでした。","s":5000.076,"e":5006.95,"p":false,"h":false},{"t":"神が彼を福音へと導くために、まず彼の心を備えられたのです。","s":5007.132,"e":5012.384,"p":false,"h":false},{"t":"これを、救われるためには敬虔に生きなければならないという意味で読むなら、それは本文を逆さにすることです。","s":5012.676,"e":5020.276,"p":true,"h":false},{"t":"ペテロの説教が誤って読まれる箇所","s":5020.776,"e":5023.434,"p":true,"h":false},{"t":"ペテロはコルネリオの家で説教を始め、このように言います。","s":5023.908,"e":5028.235,"p":false,"h":false},{"t":"「神は人を分け隔てなさらず、どの国の人であっても、神を恐れ、義を行う人を受け入れてくださることが、よく分かりました」（使徒の働き10章34節から35節）。","s":5028.516,"e":5042.172,"p":false,"h":false},{"t":"この箇所はしばしば、どの宗教を信じていても誠実に生きるなら、神は受け入れてくださるという証拠として引用されます。","s":5042.376,"e":5051.225,"p":true,"h":false},{"t":"しかし、文脈がその解釈を妨げています。","s":5051.736,"e":5055.313,"p":false,"h":false},{"t":"ペテロが悟ったのは、神がユダヤ人という身分を理由に人をえこひいきなさらないという事実です。","s":5055.588,"e":5062.451,"p":false,"h":false},{"t":"続く説教の中心はイエス・キリストであり、結論はこれです。","s":5062.824,"e":5067.727,"p":false,"h":false},{"t":"「イエスを信じる者はみな、その名によって罪の赦しを受ける」（使徒の働き10章43節）。","s":5067.972,"e":5075.739,"p":false,"h":false},{"t":"扉はすべての民族に開かれましたが、その扉はキリストおひとりです。","s":5075.928,"e":5081.118,"p":false,"h":false},{"t":"分け隔てをなさらないということは、救いの道がいくつもあるということではなく、一つの道がすべての民族に開かれているということです。","s":5081.4,"e":5090.927,"p":true,"h":false},{"t":"みことばが終わる前に","s":5091.444,"e":5093.056,"p":true,"h":false},{"t":"ペテロがこれらのことばをまだ話しているときに、聖霊がみことばを聞いていたすべての人に下りました（使徒の働き10章44節）。","s":5093.496,"e":5103.11,"p":false,"h":false},{"t":"ペテロが招きのことばを語ろうと準備していたのかは分かりませんが、本文は、説教が終わる前だったと記しています。","s":5103.324,"e":5111.548,"p":false,"h":false},{"t":"神は、人が締めくくるのを待たれなかったのです。","s":5111.784,"e":5115.269,"p":true,"h":false},{"t":"一緒に行った割礼を受けた信者たちは驚きます（使徒の働き10章45節）。","s":5115.744,"e":5122.181,"p":false,"h":false},{"t":"彼らは、異邦人が恵みを受けることを想像していませんでした。","s":5122.332,"e":5126.944,"p":false,"h":false},{"t":"ペテロはすぐに結論を出します。","s":5127.156,"e":5129.356,"p":false,"h":false},{"t":"「この人たちは、私たちと同じように聖霊を受けたのですから、だれが水のバプテスマを授けるのを妨げることができるでしょうか」（使徒の働き10章47節）。","s":5129.604,"e":5141.431,"p":false,"h":false},{"t":"神が先に決定を下され、教会はそれに従いました。","s":5141.628,"e":5145.986,"p":true,"h":false},{"t":"エルサレム教会の反応","s":5146.452,"e":5148.304,"p":true,"h":false},{"t":"しかし、この出来事がすぐにすべての人の同意を得たわけではありません。","s":5148.756,"e":5153.943,"p":false,"h":false},{"t":"ペテロがエルサレムに上ると、割礼を受けている者たちが彼を非難します。","s":5154.12,"e":5159.358,"p":false,"h":false},{"t":"「あなたは無割礼の者たちの家に入って、彼らと一緒に食事をした」と言ったのです（使徒の働き11章3節）。","s":5159.664,"e":5168.367,"p":false,"h":false},{"t":"問題は異邦人が救われたことよりも、ペテロが彼らと共に食事をしたことでした。","s":5168.592,"e":5174.619,"p":true,"h":false},{"t":"ペテロは初めから順を追って説明します。","s":5175.072,"e":5178.09,"p":false,"h":false},{"t":"幻について語り、聖霊が下られたことについて語ります。","s":5178.384,"e":5182.806,"p":false,"h":false},{"t":"そして言います。","s":5183.136,"e":5184.145,"p":false,"h":false},{"t":"「私が神を妨げることができるでしょうか」（使徒の働き11章17節）。","s":5185.044,"e":5190.961,"p":false,"h":false},{"t":"すると人々は黙って、神をほめたたえ、「それでは、神は異邦人にも、いのちに至る悔い改めを与えてくださったのだ」と言いました（使徒の働き11章18節）。","s":5191.164,"e":5204.154,"p":true,"h":false},{"t":"神の御業が明らかに示されたとき、教会が受け入れたという点は貴重です。","s":5204.628,"e":5210.412,"p":false,"h":false},{"t":"しかし、このことであらゆる問題が終わったわけではありません。","s":5210.676,"e":5214.974,"p":false,"h":false},{"t":"パウロは後にアンティオキアで、ペテロが異邦人と食事をしていたのに、ユダヤから来た人たちが来ると身を引いたと証言しています（ガラテヤ人への手紙2章11節から14節）。","s":5215.14,"e":5228.525,"p":false,"h":false},{"t":"幻を見て、説教をし、聖霊が下られるのを直接見たペテロでさえ、再び揺らぎました。","s":5228.712,"e":5235.977,"p":false,"h":false},{"t":"これが人間です。","s":5236.164,"e":5237.367,"p":false,"h":false},{"t":"恵みは、一度悟った人を永遠に完成された人にするのではなく、その人を最後まで支えてくださる主に頼らせます。","s":5238.072,"e":5246.837,"p":true,"h":false},{"t":"私たちの内にある清めの規定","s":5247.432,"e":5250.122,"p":true,"h":false},{"t":"今日、この本文は私たちに、なじみのない食物の規定ではなく、心の境界線を問いかけます。","s":5250.636,"e":5258.13,"p":false,"h":false},{"t":"教会はどれほどしばしば、人をきよい人とそうでない人に分けてきたでしょうか。","s":5258.412,"e":5264.065,"p":false,"h":false},{"t":"学歴、地域、職業、過去の過ち、身分が、線を引く基準になることもあります。","s":5264.28,"e":5271.52,"p":true,"h":false},{"t":"神がきよめたものをきよくないと言ってはならないという声は、今日の私たちにも聞こえてきます。","s":5272.056,"e":5278.558,"p":false,"h":false},{"t":"その線を引くことができるのは神だけであり、神はその線をキリストにあって消されました。","s":5278.824,"e":5285.341,"p":false,"h":false},{"t":"異邦人に開かれた扉とは、今私たちが立っている場所が、開かれた扉であるという事実です。","s":5285.592,"e":5292.744,"p":true,"h":false}]},{"title":"9.ヤコブは死に、ペテロは救い出された：同じ祈りに対して異なる結果を与えられる神","audio":"book_2610280719_1.mp3","start":5293.26,"end":5923.116,"dur":629.9,"segs":[{"t":"9.ヤコブは死に、ペテロは救い出された：同じ祈りに対して異なる結果を与えられる神","s":5293.26,"e":5300.415,"p":true,"h":false},{"t":"本文：使徒の働き12章1節から25節（ともに読む箇所：マルコの福音書10章35節から40節、ヨハネの福音書21章18節から19節、使徒の働き5章17節から21節、詩篇34篇19節、ヨハネの黙示録6章9節から11節）","s":5300.856,"e":5324.755,"p":true,"h":false},{"t":"使徒の働き12章は、教会を最も答えにくい問いの前に立たせる章です。","s":5325.228,"e":5331.162,"p":true,"h":false},{"t":"ヘロデ王は教会を迫害し、使徒ヤコブを剣で殺しました（使徒の働き12章2節）。","s":5331.708,"e":5338.685,"p":false,"h":false},{"t":"そして、ペテロも捕らえて牢に入れます。","s":5338.908,"e":5341.705,"p":false,"h":false},{"t":"教会はペテロのために熱心に祈っていました。","s":5341.968,"e":5345.383,"p":false,"h":false},{"t":"ところがペテロは、御使いに導かれて牢から出て来ます。","s":5345.568,"e":5349.634,"p":false,"h":false},{"t":"一人の使徒は剣の下で死に、一人の使徒は牢から救い出されました。","s":5349.96,"e":5354.937,"p":true,"h":false},{"t":"祈る教会に対して、神はなぜ一人を救い、一人を救われなかったのでしょうか。","s":5355.396,"e":5361.514,"p":false,"h":false},{"t":"この文章では、本文がこの問いについてどのように語り、どのように沈黙しているのかをたどってみます。","s":5361.696,"e":5368.929,"p":true,"h":false},{"t":"一文で終わるヤコブの死","s":5369.472,"e":5371.419,"p":true,"h":false},{"t":"本文でまず驚かされるのは、ヤコブの死がいかに短く記されているかということです。","s":5371.848,"e":5378.035,"p":false,"h":false},{"t":"ヘロデがヨハネの兄弟ヤコブを剣で殺したという、それだけです（使徒の働き12章2節）。","s":5378.292,"e":5385.411,"p":false,"h":false},{"t":"弁明もなく、最後の言葉もなく、理由もありません。","s":5385.6,"e":5389.711,"p":false,"h":false},{"t":"ステパノについては、1章半にわたって説教と死が記されていますが、ヤコブは一行です。","s":5389.956,"e":5396.793,"p":true,"h":false},{"t":"ヤコブは、十二使徒の中で最初に殉教した人です。","s":5397.3,"e":5401.362,"p":false,"h":false},{"t":"彼はヨハネの兄弟であり、ゼベダイの子であり、イエスが最も近くに置かれた三人のうちの一人でした。","s":5401.62,"e":5409.299,"p":false,"h":false},{"t":"しかし、ルカは彼の死を説明しません。","s":5409.504,"e":5412.677,"p":false,"h":false},{"t":"神がなぜこの人を守られなかったのか、一言も語りません。","s":5412.852,"e":5417.313,"p":true,"h":false},{"t":"この沈黙は意図されたもののように思われます。","s":5417.748,"e":5420.838,"p":false,"h":false},{"t":"ルカは神学的に説得力のある解説を加えることもできたでしょうが、そうはしませんでした。","s":5421.24,"e":5427.89,"p":false,"h":false},{"t":"説明されない死を、説明されないままにしておいたのです。","s":5428.08,"e":5432.172,"p":false,"h":false},{"t":"それが、この章を読む際の最初の正直な姿勢です。","s":5432.436,"e":5436.608,"p":true,"h":false},{"t":"ただ、一つの手がかりはあります。","s":5437.116,"e":5439.493,"p":false,"h":false},{"t":"福音書で、ヤコブとヨハネがイエスに高い地位を求めたとき、イエスはこう尋ねられました。","s":5439.78,"e":5446.642,"p":false,"h":false},{"t":"「わたしが飲む杯を、あなたがたは飲むことができますか。」","s":5446.836,"e":5450.831,"p":false,"h":false},{"t":"そして、「あなたがたは、わたしが飲む杯を飲む」と言われました（マルコの福音書10章38節から39節）。","s":5451.048,"e":5460.443,"p":false,"h":false},{"t":"ヤコブの殉教は、主がすでに語っておられた道でした。","s":5460.66,"e":5464.687,"p":false,"h":false},{"t":"それが説明になるわけではありません。","s":5464.872,"e":5467.421,"p":false,"h":false},{"t":"しかし、この死が主のご計画とは無関係に起きた事故ではなかったことを教えてくれます。","s":5467.608,"e":5474.142,"p":true,"h":false},{"t":"ペテロの牢獄と教会の祈り","s":5474.664,"e":5477.068,"p":true,"h":false},{"t":"ヤコブが死に、ユダヤ人たちが喜ぶのを見たヘロデは、ペテロも捕らえます。","s":5477.58,"e":5482.743,"p":false,"h":false},{"t":"種なしパンの祭りの期間だったため、過越の祭りの後で民衆の前に引き出そうとして、彼を牢に入れ、四人ずつ四組、全部で十六人の兵士に見張らせます（使徒の働き12章3節から4節）。","s":5483.124,"e":5498.348,"p":false,"h":false},{"t":"逃げることのできない、徹底した監視です。","s":5498.568,"e":5501.595,"p":true,"h":false},{"t":"本文は、この状況の中に短いながらも重要な一文を置いています。","s":5502.132,"e":5507.379,"p":false,"h":false},{"t":"「こうして、ペテロは牢に閉じ込められていた。","s":5507.676,"e":5510.74,"p":false,"h":false},{"t":"教会は彼のために、神に熱心に祈っていた。」","s":5510.952,"e":5514.817,"p":false,"h":false},{"t":"（使徒の働き12章5節）この一文が、この章の軸です。","s":5515.02,"e":5519.858,"p":false,"h":false},{"t":"教会には軍事力も政治的な影響力もありませんでした。","s":5520.096,"e":5524.545,"p":false,"h":false},{"t":"持っていたのは祈りだけでした。","s":5524.74,"e":5526.88,"p":true,"h":false},{"t":"御使いに導かれて出て来た夜","s":5527.332,"e":5529.5
