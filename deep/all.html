92,"p":true,"h":false},{"t":"ヘロデがペテロを引き出そうとしていた、まさにその前の晩、ペテロは二本の鎖につながれ、二人の兵士の間で眠っていました（使徒の働き12章6節）。","s":5530.032,"e":5542.077,"p":false,"h":false},{"t":"この場面は心に残ります。","s":5542.272,"e":5544.4,"p":false,"h":false},{"t":"明日には死ぬかもしれない人が眠っているのです。","s":5544.648,"e":5547.849,"p":false,"h":false},{"t":"御使いが来て脇腹をたたき、起こさなければならないほど、深く眠っていました。","s":5548.104,"e":5553.798,"p":true,"h":false},{"t":"御使いが彼を導いて出て行くと、鎖は外れ、門はひとりでに開きます。","s":5554.26,"e":5559.912,"p":false,"h":false},{"t":"ペテロは、それが幻だと思っていたと言います（使徒の働き12章9節）。","s":5560.2,"e":5566.09,"p":false,"h":false},{"t":"通りに立って初めて我に返り、主が御使いを遣わして自分をヘロデの手から救い出してくださったのだと分かった、と言います（使徒の働き12章11節）。","s":5566.32,"e":5577.699,"p":true,"h":false},{"t":"祈っていた人々が驚く","s":5578.164,"e":5580.249,"p":true,"h":false},{"t":"ところが、物語の中で最も人間味のある部分はこの後に出て来ます。","s":5580.684,"e":5586.299,"p":false,"h":false},{"t":"ペテロが、マルコと呼ばれていたヨハネの母マリアの家へ行くと、多くの人が集まって祈っていました。","s":5586.588,"e":5593.829,"p":false,"h":false},{"t":"彼が門をたたくと、ロダという女中が出て来て、ペテロの声だと分かりましたが、うれしさのあまり門を開けずに中へ駆け込み、ペテロが門の外に立っていると知らせます。","s":5594.04,"e":5606.144,"p":true,"h":false},{"t":"祈っていた人たちの反応は、こうでした。","s":5606.748,"e":5609.702,"p":false,"h":false},{"t":"「あなたは気が狂っている。」","s":5609.916,"e":5611.656,"p":false,"h":false},{"t":"女中が本当だと言い張ると、彼らは、それなら彼の御使いだと言います（使徒の働き12章15節）。","s":5611.86,"e":5619.959,"p":false,"h":false},{"t":"その間も、ペテロはずっと門をたたいていました。","s":5620.176,"e":5623.6,"p":false,"h":false},{"t":"門を開けてみるとペテロが立っていたので、彼らは驚いたとあります。","s":5623.812,"e":5628.637,"p":true,"h":false},{"t":"この場面がどれほど正直か、見てください。","s":5629.212,"e":5632.317,"p":false,"h":false},{"t":"教会はペテロのために熱心に祈っていました。","s":5632.524,"e":5635.939,"p":false,"h":false},{"t":"しかし、実際に祈りが聞かれ、ペテロが門の前に立っていると、信じることができませんでした。","s":5636.124,"e":5643.249,"p":false,"h":false},{"t":"答えを求めて祈っていた人たちが、その答えを信じられなかったのです。","s":5643.468,"e":5648.418,"p":false,"h":false},{"t":"この物語は、教会の信仰が立派だったから祈りが聞かれたのではないことを、はっきり示しています。","s":5648.652,"e":5655.867,"p":false,"h":false},{"t":"弱い信仰でささげた祈りにも、神は答えてくださったのです。","s":5656.14,"e":5660.733,"p":false,"h":false},{"t":"祈りへの答えは、祈る人の信仰の大きさではなく、祈りを聞かれる神のみこころにかかっています。","s":5660.964,"e":5668.191,"p":true,"h":false},{"t":"二人の違いをどう読むべきか","s":5668.704,"e":5670.806,"p":true,"h":false},{"t":"それでは、同じ教会はヤコブのためにも祈らなかったのでしょうか。","s":5671.26,"e":5676.02,"p":false,"h":false},{"t":"本文はそのことを語っていません。","s":5676.3,"e":5678.736,"p":false,"h":false},{"t":"ヤコブのための祈りがあったのか、あったとすれば、なぜその祈りが聞かれなかったのかは分かりません。","s":5678.928,"e":5686.118,"p":false,"h":false},{"t":"私たちが確かめられるのは、二つの結果がいずれも神の御手の中にあったということです。","s":5686.308,"e":5692.706,"p":true,"h":false},{"t":"ペテロが救い出されたことも、永遠の保護を意味していたわけではありません。","s":5693.256,"e":5698.302,"p":false,"h":false},{"t":"ヨハネの福音書21章で主はペテロに、彼が年を取ると他の人が彼に帯を締め、望まないところへ連れて行くようになると言われ、それによって、彼がどのような死によって神の栄光を現すことになるのかを示されたとあります（ヨハネの福音書21章18節から19節）。","s":5698.476,"e":5719.992,"p":false,"h":false},{"t":"ペテロの救出は、死を免れたということではなく、死ぬ時がまだ来ていなかったということでした。","s":5720.184,"e":5727.027,"p":false,"h":false},{"t":"ヤコブにはその時が先に来て、ペテロには後に来ました。","s":5727.204,"e":5731.496,"p":true,"h":false},{"t":"これですべての問いが解けるわけではありません。","s":5731.956,"e":5734.81,"p":false,"h":false},{"t":"なぜその順序だったのかは、今もなお神だけがご存じです。","s":5734.98,"e":5739.342,"p":false,"h":false},{"t":"信者がこの前で正直に言えることは、神は祈りに答えてくださるが、私たちが望む仕方だけで答えられるのではないということ、そして、答えを受けていないように見えるところにも神は不在ではなかったということです。","s":5739.588,"e":5755.591,"p":false,"h":false},{"t":"詩篇は、正しい人には苦しみが多いが、主はそのすべてから彼を救い出されると語りますが（詩篇34篇19節）、その救い出しは時に死を通してもたらされます。","s":5755.86,"e":5769.284,"p":true,"h":false},{"t":"ヘロデの最期","s":5769.828,"e":5770.907,"p":true,"h":false},{"t":"この章の後半に、ヘロデが登場します。","s":5771.736,"e":5774.77,"p":false,"h":false},{"t":"ツロとシドンの人々が王の恵みを求めて出て来たとき、ヘロデは日を定め、王服を着て演壇に座り、演説をします。","s":5775.048,"e":5784.22,"p":false,"h":false},{"t":"人々は、「これは神の声だ。","s":5784.516,"e":5786.856,"p":false,"h":false},{"t":"人間の声ではない」と叫びます。","s":5787.036,"e":5789.463,"p":false,"h":false},{"t":"その瞬間、主の使いが彼を打ったとあります。","s":5789.736,"e":5793.163,"p":false,"h":false},{"t":"彼が栄光を神に帰さなかったからです。","s":5793.444,"e":5796.35,"p":false,"h":false},{"t":"彼は虫に食われて死んだと記されています（使徒の働き12章21節から23節）。","s":5796.612,"e":5803.734,"p":true,"h":false},{"t":"歴史家ヨセフスも、ヘロデ・アグリッパ一世がカイサリアで開かれた行事において神だという称賛を受け、その後まもなく急な腹痛で死んだと記しています。","s":5804.208,"e":5815.628,"p":false,"h":false},{"t":"細部は異なりますが、急死したという点では一致しています。","s":5815.908,"e":5820.405,"p":false,"h":false},{"t":"剣でヤコブを殺し、ペテロをも殺そうとしていた王が、五日後には倒れたのです。","s":5820.696,"e":5826.751,"p":true,"h":false},{"t":"この箇所は、前の物語と対照をなしています。","s":5827.248,"e":5830.875,"p":false,"h":false},{"t":"教会には目に見える力が一つもなく、ヘロデは軍隊と王権を持っていました。","s":5831.136,"e":5837.039,"p":false,"h":false},{"t":"しかし、最後に倒れたのは王でした。","s":5837.256,"e":5840.171,"p":false,"h":false},{"t":"神が王を立て、また退けられるという事実が、このように現されています。","s":5840.352,"e":5846.097,"p":false,"h":false},{"t":"これは、ヤコブの死についての説明ではありません。","s":5846.364,"e":5849.882,"p":false,"h":false},{"t":"ただ、ヤコブを殺した剣が最後の言葉を語ることはできなかったと示しています。","s":5850.072,"e":5855.721,"p":true,"h":false},{"t":"王は死に、みことばは広まる","s":5856.192,"e":5858.62,"p":true,"h":false},{"t":"そして、この章は一文で閉じられます。","s":5859.072,"e":5862.065,"p":false,"h":false},{"t":"「神のことばは、ますます広まっていった。」","s":5862.384,"e":5865.342,"p":false,"h":false},{"t":"（使徒の働き12章24節）ヤコブが死に、ペテロが捕らえられ、ヘロデが死んだ、このすべての過程を経て残ったのは、神のことばが広まったという事実です。","s":5865.516,"e":5877.7,"p":true,"h":false},{"t":"ルカはこの一文によって、この章の意味を要約しています。","s":5878.224,"e":5882.464,"p":false,"h":false},{"t":"教会が勝ったのでもなく、迫害者が勝ったのでもありません。","s":5882.724,"e":5886.872,"p":false,"h":false},{"t":"みことばが勝ったのです。","s":5887.08,"e":5888.57,"p":false,"h":false},{"t":"誰が生き、誰が死ぬかによって、福音の行く末が決まるのではありません。","s":5888.988,"e":5894.399,"p":false,"h":false},{"t":"一人の使徒が倒れても、王が軍隊を送り出しても、みことばは広まり続けます。","s":5894.568,"e":5900.743,"p":true,"h":false},{"t":"私たちがこの章から受け取る慰めは、これです。","s":5901.264,"e":5904.875,"p":false,"h":false},{"t":"私たちがささげた祈りが聞かれていないように見えるところにも神はおられ、聞かれたように見えるところでも、栄光は私たちの信仰ではなく神に帰されます。","s":5905.188,"e":5916.342,"p":false,"h":false},{"t":"そして、私たちの生と死のどちらにおいても、神のことばは広まり続けます。","s":5916.636,"e":5922.587,"p":true,"h":false}]},{"title":"10.永遠のいのちに定められていた人たちはみな信じたというのに、なぜそれほど熱心に説得するのか：選びと伝道","audio":"book_2610280719_2.mp3","start":0,"end":698.328,"dur":698.3,"segs":[{"t":"10.永遠のいのちに定められていた人たちはみな信じたというのに、なぜそれほど熱心に説得するのか：選びと伝道","s":0,"e":9.145,"p":true,"h":false},{"t":"本文：使徒の働き13章44節から52節、18章1節から11節（ともに読む本文：ヨハネの福音書6章37節、ヨハネの福音書10章16節、ローマ人への手紙10章14節から17節、エペソ人への手紙1章3節から6節、テモテへの手紙第2章10節、使徒の働き16章13節から15節）","s":9.576,"e":38.414,"p":true,"h":false},{"t":"使徒の働き13章48節は、神学的な論争においてしばしば引用される箇所です。","s":38.88,"e":46.142,"p":false,"h":false},{"t":"異邦人たちが聞いて喜び、神のことばをあがめ、永遠のいのちを与えられるように定められていた人たちはみな信じた、というみことばです。","s":46.404,"e":56.694,"p":true,"h":false},{"t":"この箇所は、二つの誤解を生んできました。","s":57.204,"e":60.415,"p":false,"h":false},{"t":"一つは、神がすでに定めておられるなら、伝道する必要はないという考えです。","s":60.624,"e":66.792,"p":false,"h":false},{"t":"もう一つは、そのようなことは危険だから信者に教えるべきではない、という考えです。","s":67.068,"e":73.442,"p":false,"h":false},{"t":"しかし、使徒の働きのパウロは、この箇所が出てくる町においても、ほかの町においても、昼も夜も休まずに説得し、勧めています。","s":73.692,"e":83.924,"p":true,"h":false},{"t":"この文章では、この箇所が何を語っているのか、そして選びと伝道がどのように一つの働きの中でともに進むのかを見ていきます。","s":84.42,"e":94.005,"p":true,"h":false},{"t":"ピシディアのアンティオキアにおける二度の安息日","s":94.572,"e":97.869,"p":true,"h":false},{"t":"パウロとバルナバは第一次伝道旅行の途中でピシディアのアンティオキアに着き、最初の安息日に会堂で説教しました（使徒の働き13章14節から41節）。","s":98.316,"e":111.494,"p":false,"h":false},{"t":"人々は次の安息日にもこのみことばを語ってほしいと願い、多くのユダヤ人と敬虔な改宗者たちがパウロに従いました。","s":111.708,"e":120.872,"p":false,"h":false},{"t":"そして次の安息日には、町の人がほとんどみな、神のことばを聞くために集まったとあります（使徒の働き13章44節）。","s":121.212,"e":131.573,"p":true,"h":false},{"t":"するとユダヤ人たちはねたみに満たされ、パウロの語ることに反対し、悪口を言いました（使徒の働き13章45節）。","s":132.048,"e":141.827,"p":false,"h":false},{"t":"パウロとバルナバは大胆に語ります。","s":142.02,"e":144.472,"p":false,"h":false},{"t":"神のことばをまずあなたがたに語るはずでしたが、あなたがたがそれを退け、自分自身を永遠のいのちにふさわしくない者としているので、私たちは異邦人のほうに向かう、ということです（使徒の働き13章46節）。","s":144.756,"e":161.546,"p":false,"h":false},{"t":"そしてイザヤ書49章6節を引用し、これが主が命じられたことであると言います（使徒の働き13章47節）。","s":161.748,"e":171.493,"p":true,"h":false},{"t":"続いて、この箇所が出てきます。","s":171.936,"e":174.313,"p":false,"h":false},{"t":"異邦人たちはそれを聞いて喜び、主のことばをほめたたえた。","s":174.564,"e":179.284,"p":false,"h":false},{"t":"そして、永遠のいのちに定められていた人たちはみな、信じた（使徒の働き13章48節）。","s":179.496,"e":187.506,"p":false,"h":false},{"t":"同じ説教を同じ会堂で聞いたのに、ある人はねたんで反対し、ある人は喜んで信じました。","s":187.704,"e":195.158,"p":false,"h":false},{"t":"ルカはその違いを、人々の性向や知恵によってではなく、神の定めによって説明しています。","s":195.372,"e":202.238,"p":true,"h":false},{"t":"定められていた者ということば","s":202.788,"e":205.001,"p":true,"h":false},{"t":"ここで使われていることばの訳をめぐって、解釈が分かれます。","s":205.452,"e":209.829,"p":false,"h":false},{"t":"新改訳2017は、「永遠のいのちに定められていた人たち」と訳しています。","s":210.096,"e":216.44,"p":false,"h":false},{"t":"原語では、「定める」「配置する」という意味をもつことばが受動態で用いられています。","s":216.72,"e":222.916,"p":false,"h":false},{"t":"大部分の改革派の解釈者と多くの注解者は、これを、神が永遠のいのちのためにあらかじめ定めておられた、という意味に読みます。","s":223.2,"e":233.255,"p":true,"h":false},{"t":"別の解釈もあります。","s":233.784,"e":235.437,"p":false,"h":false},{"t":"このことばを、自ら心を定めた人たちと見て、永遠のいのちを求める態度を定めた人たち、という意味に読む立場です。","s":235.692,"e":244.865,"p":false,"h":false},{"t":"この解釈では、信仰はまず人の選択によって起こったことになります。","s":245.16,"e":250.362,"p":true,"h":false},{"t":"文法だけで、この論争を終わらせるのは難しいです。","s":250.884,"e":254.834,"p":false,"h":false},{"t":"しかし、文脈は第一の読み方を支持しています。","s":255.096,"e":258.961,"p":false,"h":false},{"t":"ルカがその前で、ねたむユダヤ人たちと喜ぶ異邦人たちを並べて置き、その違いを説明している箇所だからです。","s":259.236,"e":267.811,"p":false,"h":false},{"t":"もし人の心構えが違いを生んだのなら、その心構えをだれが与えたのかを、さらに問わなければなりません。","s":268.092,"e":275.902,"p":false,"h":false},{"t":"それゆえパウロは、別の箇所でこのように言っています。","s":276.084,"e":279.835,"p":false,"h":false},{"t":"神は、世界の基が据えられる前から、キリストにあって私たちを選び、愛のうちに私たちをあらかじめ定められた、と言っています（エペソ人への手紙1章4節から5節）。","s":280.116,"e":293.495,"p":false,"h":false},{"t":"そして主は、父がわたしに与えてくださる者はみな、わたしのところに来る、と言われました（ヨハネの福音書6章37節）。","s":293.688,"e":303.442,"p":true,"h":false},{"t":"ですからこの文章は、この箇所を、神が永遠のいのちのために定めておられた人々が福音を聞いて信じる、という意味に読みます。","s":303.912,"e":313.739,"p":false,"h":false},{"t":"しかし、別の解釈が可能であることも隠しません。","s":314.028,"e":318.008,"p":true,"h":false},{"t":"それでも、なぜ説得するのか","s":318.456,"e":320.908,"p":true,"h":false},{"t":"この箇所を誤解する人は、このように尋ねます。","s":321.336,"e":324.735,"p":false,"h":false},{"t":"神がすでに定めておられるなら、人が語る必要はありますか。","s":324.972,"e":329.576,"p":false,"h":false},{"t":"しかし、使徒の働きでこの箇所を書いたルカこそ、パウロの休むことのない伝道を最も熱心に記録した人です。","s":329.796,"e":338.179,"p":true,"h":false},{"t":"18章では、パウロはコリントで、安息日ごとに会堂で論じ、ユダヤ人やギリシア人を説得したとあります（使徒の働き18章4節）。","s":338.688,"e":349.865,"p":false,"h":false},{"t":"ユダヤ人たちが反抗し、悪口を言うと、パウロは衣服のちりを払い落として言います。","s":350.064,"e":356.659,"p":false,"h":false},{"t":"「あなたがたの血は、あなたがたの頭に降りかかれ。","s":356.94,"e":360.393,"p":false,"h":false},{"t":"私は責任がない。","s":360.576,"e":362.198,"p":false,"h":false},{"t":"今後は異邦人のほうに行く」（使徒の働き18章6節）。","s":362.484,"e":366.873,"p":false,"h":false},{"t":"このことばは、責任が聞き手にあるという宣言です。","s":367.056,"e":370.887,"p":false,"h":false},{"t":"拒んだ人の拒絶は、その人自身の責任です。","s":371.124,"e":374.799,"p":true,"h":false},{"t":"続いて、主は夜、幻のうちにパウロに語られます。","s":375.3,"e":379.452,"p":false,"h":false},{"t":"「恐れないで、語り続けなさい。","s":379.728,"e":382.108,"p":false,"h":false},{"t":"黙ってはいけない。","s":382.392,"e":383.683,"p":false,"h":false},{"t":"わたしがあなたとともにいるので、あなたを襲って危害を加える者はいない。","s":384.3,"e":389.679,"p":false,"h":false},{"t":"この町には、わたしの民がたくさんいるのだから」（使徒の働き18章9節から10節）。","s":389.88,"e":396.646,"p":true,"h":false},{"t":"このみことばが要です。","s":397.116,"e":398.569,"p":false,"h":false},{"t":"コリントにいた多くの異邦人は、まだ信じていませんでした。","s":399.024,"e":403.3,"p":false,"h":false},{"t":"ところが主は、彼らを「わたしの民」と呼ばれます。","s":403.488,"e":407.224,"p":false,"h":false},{"t":"主がすでに選んでおられた人々が、その町に多くいたのです。","s":407.448,"e":411.773,"p":false,"h":false},{"t":"そして主は、パウロが語るべき理由がまさにそれだと言われます。","s":412.128,"e":416.637,"p":false,"h":false},{"t":"選ばれた人が多くいるから、黙らずに伝えなさい、ということです。","s":416.88,"e":421.753,"p":true,"h":false},{"t":"選びは伝道を妨げず、伝道を支える","s":422.28,"e":425.756,"p":true,"h":false},{"t":"パウロは自分の働きをこのように説明しています。","s":426.204,"e":429.756,"p":false,"h":false},{"t":"「ですから、私は選ばれた人々のために、すべてのことを耐え忍んでいます。","s":430.092,"e":435.568,"p":false,"h":false},{"t":"彼らもまた、キリスト・イエスにある救いを、永遠の栄光とともに受けるようになるためです」（テモテへの手紙第2章10節）。","s":435.852,"e":445.386,"p":false,"h":false},{"t":"選ばれた人がいるから耐え忍び、選ばれた人がいるから伝えるのです。","s":445.608,"e":450.448,"p":false,"h":false},{"t":"選びは伝道をやめる理由ではなく、伝道がむだにならないという確信の根拠です。","s":450.72,"e":456.806,"p":true,"h":false},{"t":"もし救いが全面的に人の決断にかかっているなら、伝道者は説得に失敗するたびに絶望しなければなりません。","s":457.344,"e":465.593,"p":false,"h":false},{"t":"しかし、神がすでに人々を選び、みことばのうちで彼らを召してくださるなら、伝道者は拒まれても落胆せず、大胆に伝えることができます。","s":465.768,"e":476.533,"p":false,"h":false},{"t":"主は、ご自分の羊はわたしの声を聞くと言われ、また、この囲いに属さないほかの羊たちがわたしにはいるが、彼らもわたしの声を聞き、一つの群れとなると言われました（ヨハネの福音書10章16節）。","s":476.82,"e":492.379,"p":true,"h":false},{"t":"また神は、みことばを通して人々を信仰へと導かれます。","s":492.84,"e":497.532,"p":false,"h":false},{"t":"信仰は聞くことから始まり、聞くことは、キリストについてのみことばによるのです（ローマ人への手紙10章17節）。","s":497.844,"e":506.83,"p":false,"h":false},{"t":"定めは、みことばの宣教に取って代わるものではありません。","s":507.024,"e":511.254,"p":false,"h":false},{"t":"定めを成し遂げられる神の方法が、みことばの宣教です。","s":511.416,"e":515.79,"p":false,"h":false},{"t":"ピリピのルディアについて、ルカは、主が彼女の心を開いて、パウロの語ることに心を留めるようにされたと記しています（使徒の働き16章14節）。","s":516.096,"e":527.99,"p":false,"h":false},{"t":"心を開かれるのは主であり、主が用いられた手段はパウロのことばでした。","s":528.228,"e":533.694,"p":true,"h":false},{"t":"ですから、選びと伝道は互いに争いません。","s":534.132,"e":537.693,"p":false,"h":false},{"t":"神は目的と手段をともに定められます。","s":537.876,"e":540.866,"p":false,"h":false},{"t":"永遠のいのちのために定められ、そしてその永遠のいのちに至らせる福音の宣教者を遣わされます。","s":541.188,"e":548.476,"p":true,"h":false},{"t":"選びの教えが慰めとなる理由","s":549.108,"e":551.6,"p":true,"h":false},{"t":"本文には、もう一つ注目すべき点があります。","s":552.06,"e":555.525,"p":false,"h":false},{"t":"異邦人たちがこのことばを聞いて喜んだ、ということです。","s":555.804,"e":560.007,"p":false,"h":false},{"t":"選びの教理は、今日の教会ではしばしば論争の武器として用いられますが、聖書においては信じる者たちにとって喜びでした。","s":560.232,"e":569.812,"p":true,"h":false},{"t":"私が信じるようになったのが、自分の知恵や決断によるのではなく、神がまず私を選んでくださったからだとすれば、私の救いは私の揺れ動く信仰にかかってはいません。","s":570.276,"e":583.091,"p":false,"h":false},{"t":"神が始められたことは、神が成し遂げられます。","s":583.344,"e":586.716,"p":false,"h":false},{"t":"アンティオキアの異邦人たちは、みことばを聞いて喜び、神のことばをあがめました。","s":586.98,"e":593.022,"p":false,"h":false},{"t":"ルカは、彼らの信仰の根が神の定めにあったと説明していますが、その説明は、信仰を誇りではなく感謝の理由とします。","s":593.208,"e":603.167,"p":true,"h":false},{"t":"そして迫害が起こり、パウロとバルナバがその地方から追い出されたときにも、本文は、弟子たちが喜びと聖霊に満たされていたと記しています（使徒の働き13章52節）。","s":603.684,"e":617.126,"p":false,"h":false},{"t":"選んでくださる神を知る人々は、環境によって揺れ動きません。","s":617.328,"e":621.973,"p":true,"h":false},{"t":"韓国の教会における二つの誤り","s":622.404,"e":625.257,"p":true,"h":false},{"t":"韓国の教会には、この問題をめぐって二つの誤りがありました。","s":625.716,"e":630.798,"p":true,"h":false},{"t":"一つは、選びを伝道しない理由にすることです。","s":631.26,"e":634.918,"p":false,"h":false},{"t":"神がご自身でなさることだと言って、福音を伝える労苦をやめてしまう態度です。","s":635.148,"e":640.845,"p":false,"h":false},{"t":"しかしパウロは、選ばれた民が多くいるという理由で、黙らずに語りなさいという主のことばを聞きました。","s":641.124,"e":648.725,"p":true,"h":false},{"t":"もう一つは、選びの教えを聖徒たちに隠し、救いが人の決心によって生み出されるかのように説教することです。","s":649.188,"e":657.465,"p":false,"h":false},{"t":"そうすると信者は、自分の信仰が弱くなるたびに、救いが揺らいでいると感じるようになります。","s":657.756,"e":664.615,"p":false,"h":false},{"t":"聖書が慰めとして与えた教えを隠せば、信者は慰めを失います。","s":664.884,"e":670.319,"p":true,"h":false},{"t":"本文が私たちに与えるのは、この二つをともにしっかりと握る道です。","s":670.86,"e":676.225,"p":false,"h":false},{"t":"神が永遠のいのちのために定められた人は必ず信じるという事実、そしてその信仰に至らせるために、神が私たちを福音を伝える者として召してくださったという事実です。","s":676.512,"e":689.352,"p":false,"h":false},{"t":"伝道は神の選びを成し遂げる神の道具であり、その道具として用いられることは慰めであり、栄光です。","s":689.688,"e":697.79,"p":true,"h":false}]},{"title":"11.パウロはなぜ三度も「これからは異邦人のほうへ行く」と宣言するのか――イスラエルの不信仰と福音","audio":"book_2610280719_2.mp3","start":698.328,"end":1327.14,"dur":628.8,"segs":[{"t":"11.パウロはなぜ三度も「これからは異邦人のほうへ行く」と宣言するのか――イスラエルの不信仰と福音","s":698.328,"e":706.556,"p":true,"h":false},{"t":"本文：使徒の働き13章44節から47節、18章4節から6節、28章17節から31節（併せて読む本文：イザヤ書6章9節から10節、イザヤ書49章6節、ローマ人への手紙1章16節、ローマ人への手紙9章1節から5節、ローマ人への手紙11章1節から2節、ローマ人への手紙11章25節から27節）","s":706.968,"e":739.208,"p":true,"h":false},{"t":"使徒の働きを最後まで読んだ読者は、同じ場面が三度繰り返されていることに気づきます。","s":739.656,"e":746.079,"p":false,"h":false},{"t":"パウロがユダヤ人に福音を語り、ユダヤ人が拒み、パウロがこれからは異邦人のほうへ向かうと宣言するのです。","s":746.388,"e":754.563,"p":true,"h":false},{"t":"ピシディアのアンティオキアで、使徒の働き13章46節、コリントで、使徒の働き18章6節、そしてこの書の最後の場面であるローマで、使徒の働き28章28節、同じ宣言が出てきます。","s":755.1,"e":771.715,"p":false,"h":false},{"t":"三度も同じことを言うなら、パウロはユダヤ人を見捨てたのでしょうか。","s":771.984,"e":776.982,"p":false,"h":false},{"t":"使徒の働きは反ユダヤ的な書なのでしょうか。","s":777.204,"e":780.539,"p":false,"h":false},{"t":"ここでは、この問いに正直に答えてみましょう。","s":780.804,"e":784.204,"p":true,"h":false},{"t":"三つの宣言","s":784.656,"e":785.842,"p":true,"h":false},{"t":"第一は、ピシディアのアンティオキアです。","s":786.564,"e":789.427,"p":false,"h":false},{"t":"ユダヤ人たちがねたみにかられてパウロの語ることに反対すると、パウロは、神のことばはまずあなたがたに語られなければならなかったが、あなたがたがそれを退けたので、私たちは異邦人のほうへ向かう、と言います。","s":789.66,"e":805.09,"p":false,"h":false},{"t":"使徒の働き13章46節です。","s":805.392,"e":808.541,"p":false,"h":false},{"t":"そして、イザヤ書49章6節を引用します。","s":808.776,"e":812.715,"p":false,"h":false},{"t":"神が異邦人の光とし、救いが地の果てにまで届くようにされるという約束です。","s":813.024,"e":818.842,"p":true,"h":false},{"t":"第二は、コリントです。","s":819.396,"e":821.124,"p":false,"h":false},{"t":"ユダヤ人たちが反対し、悪口を言うと、パウロは衣のちりを払い落として言います。","s":821.376,"e":827.845,"p":false,"h":false},{"t":"「あなたがたの血は、あなたがたの頭上に降りかかれ。","s":828.144,"e":831.581,"p":false,"h":false},{"t":"私は責任がない。","s":831.78,"e":833.402,"p":false,"h":false},{"t":"今後、私は異邦人のところに行く。」","s":833.688,"e":836.622,"p":false,"h":false},{"t":"使徒の働き18章6節です。","s":836.82,"e":839.347,"p":true,"h":false},{"t":"最後は、ローマです。","s":839.88,"e":841.358,"p":false,"h":false},{"t":"パウロはローマに到着した後、まずユダヤ人の指導者たちを招いて、福音を説明します。","s":841.788,"e":848.653,"p":false,"h":false},{"t":"信じた人もいれば、信じなかった人もいました。","s":848.916,"e":852.495,"p":false,"h":false},{"t":"互いに意見が一致せずに帰って行くとき、パウロは一言を付け加えます。","s":852.696,"e":857.989,"p":false,"h":false},{"t":"聖霊が預言者イザヤを通してあなたがたの先祖に語られたことは正しかった、と言って、イザヤ書6章を引用します。","s":858.312,"e":867.052,"p":false,"h":false},{"t":"聞いてはいても決して悟らず、見てはいても決して知ろうとしない、というみことばです。","s":867.312,"e":873.426,"p":false,"h":false},{"t":"使徒の働き28章25節から27節です。","s":873.684,"e":877.829,"p":false,"h":false},{"t":"そして結論を述べます。","s":878.112,"e":879.84,"p":false,"h":false},{"t":"「ですから、神のこの救いが異邦人に送られたことを、知っておいてください。","s":880.092,"e":885.585,"p":false,"h":false},{"t":"彼らは耳を傾けるでしょう。」","s":885.78,"e":887.934,"p":false,"h":false},{"t":"使徒の働き28章28節です。","s":888.156,"e":891.208,"p":true,"h":false},{"t":"この最後の引用に注目してください。","s":891.72,"e":894.347,"p":false,"h":false},{"t":"イザヤ書を深く読む第一回で、私たちが見た、まさにあの本文です。","s":894.528,"e":900.023,"p":false,"h":false},{"t":"イザヤ書6章は、イスラエルが神のことばを聞いても悟らないという現象が、イスラエルの歴史で初めて起きたことではなく、イザヤの時代から続いてきたことを示しています。","s":900.288,"e":912.446,"p":false,"h":false},{"t":"パウロは、ローマのユダヤ人たちが福音を拒むことも、この古くからのパターンの延長として理解しています。","s":912.744,"e":920.371,"p":false,"h":false},{"t":"イエスが教えられたときにも同じみことばが引用され、今、それがこの書の最後の場面で繰り返されます。","s":920.736,"e":928.48,"p":true,"h":false},{"t":"イスラエルを見捨てたのではない","s":929.088,"e":931.08,"p":true,"h":false},{"t":"それでは、この宣言は、パウロがユダヤ人への宣教をやめるという意味だったのでしょうか。","s":931.536,"e":938.026,"p":false,"h":false},{"t":"本文をたどってみると、そうではありません。","s":938.232,"e":941.247,"p":true,"h":false},{"t":"ピシディアのアンティオキアで異邦人のほうへ行くと宣言したパウロは、次の町イコニオンでどうしたでしょうか。","s":941.688,"e":949.175,"p":false,"h":false},{"t":"ユダヤ人の会堂に入って語った、とあります。","s":949.392,"e":952.639,"p":false,"h":false},{"t":"使徒の働き14章1節です。","s":952.956,"e":955.501,"p":false,"h":false},{"t":"テサロニケでも、いつものならわしに従って会堂に入りました。","s":955.764,"e":960.197,"p":false,"h":false},{"t":"使徒の働き17章1節から2節です。","s":960.408,"e":963.607,"p":false,"h":false},{"t":"コリントで異邦人のほうへ行くと宣言した後にも、エペソに着くと会堂に入り、三か月の間大胆に語りました。","s":963.864,"e":972.461,"p":false,"h":false},{"t":"使徒の働き19章8節です。","s":972.684,"e":975.224,"p":false,"h":false},{"t":"そしてローマに到着すると、真っ先にユダヤ人の指導者たちを招きました。","s":975.492,"e":981.059,"p":true,"h":false},{"t":"ですから、この宣言は永久的な転換ではなく、その町、その場面における宣言でした。","s":981.504,"e":988.596,"p":false,"h":false},{"t":"パウロは、会堂が拒む場所では福音の向きを異邦人へと変え、次の町では再び会堂へ向かいました。","s":988.776,"e":997.034,"p":false,"h":false},{"t":"この繰り返しは、パウロがユダヤ人を見捨てなかった証拠です。","s":997.272,"e":1001.758,"p":true,"h":false},{"t":"パウロ自身が、ローマ人への手紙でこの問題を直接扱っています。","s":1002.24,"e":1007.413,"p":false,"h":false},{"t":"彼は、福音は信じるすべての人に救いをもたらす神の力であり、ユダヤ人をはじめギリシア人にも与えられるものだと言います。","s":1007.676,"e":1016.928,"p":false,"h":false},{"t":"ローマ人への手紙1章16節です。","s":1017.216,"e":1020.106,"p":false,"h":false},{"t":"そしてローマ人への手紙9章では、こう告白します。","s":1020.384,"e":1024.331,"p":false,"h":false},{"t":"私には大きな悲しみがあり、私の心には絶え間ない痛みがあります。","s":1024.596,"e":1029.961,"p":false,"h":false},{"t":"私の兄弟たち、肉による同胞のためなら、私自身がのろわれてキリストから引き離されてもよいと願うほどです。","s":1030.32,"e":1039.01,"p":false,"h":false},{"t":"ローマ人への手紙9章2節から3節です。","s":1039.284,"e":1042.624,"p":false,"h":false},{"t":"イスラエルの不信仰を前にしたパウロは、冷たい裁き手ではなく、涙を流す兄弟でした。","s":1042.884,"e":1049.656,"p":true,"h":false},{"t":"ローマ人への手紙11章は、さらに明確です。","s":1050.12,"e":1053.869,"p":false,"h":false},{"t":"神がご自分の民を退けられたのか、決してそんなことはない、と言い、自分自身がイスラエル人であることをその証拠として挙げます。","s":1054.116,"e":1063.8,"p":false,"h":false},{"t":"ローマ人への手紙11章1節です。","s":1064.088,"e":1066.907,"p":false,"h":false},{"t":"ですから、使徒の働きにある三度の宣言は、イスラエル全体に対する神の最終的な判決ではなく、福音の門が異邦人に開かれる救済史の転換点を示す場面なのです。","s":1067.184,"e":1080.499,"p":true,"h":false},{"t":"なぜ神はイスラエルの不信仰を許されるのか","s":1081.044,"e":1084.583,"p":true,"h":false},{"t":"パウロはローマ人への手紙で、この難問に答えます。","s":1085.004,"e":1088.731,"p":false,"h":false},{"t":"イスラエルのつまずきが、異邦人に救いが及ぶこととなった、ということです。","s":1089,"e":1094.495,"p":false,"h":false},{"t":"ローマ人への手紙11章11節です。","s":1094.76,"e":1097.837,"p":false,"h":false},{"t":"そして、イスラエルの一部が頑なになったのは、異邦人の満ちる時が来るまでだと言います。","s":1098.108,"e":1104.66,"p":false,"h":false},{"t":"ローマ人への手紙11章25節です。","s":1104.948,"e":1108.125,"p":true,"h":false},{"t":"ですから、イスラエルの不信仰さえも、神のご計画の外にあったのではありません。","s":1108.656,"e":1114.682,"p":false,"h":false},{"t":"これは先に見た、十字架が人間の罪であると同時に神のご計画であったことと同じ構造です。","s":1114.884,"e":1122.149,"p":false,"h":false},{"t":"イザヤ書6章がすでに語っているように、聞いても悟らないという現象を、神は救いの歴史の一部として用いられます。","s":1122.408,"e":1131.11,"p":true,"h":false},{"t":"それでは、イスラエルの将来はどうなるのでしょうか。","s":1131.624,"e":1135.156,"p":false,"h":false},{"t":"パウロはこの奥義を知らせようと言い、こうしてイスラエルはみな救われる、と語ります。","s":1135.404,"e":1141.306,"p":false,"h":false},{"t":"ローマ人への手紙11章26節です。","s":1141.596,"e":1144.821,"p":false,"h":false},{"t":"この箇所をどう読むかについては、教会の中でも解釈が分かれます。","s":1145.088,"e":1149.89,"p":false,"h":false},{"t":"ある人たちは、イスラエル民族が将来、大規模に回心するという意味に読みます。","s":1150.236,"e":1156.379,"p":false,"h":false},{"t":"別の人たちは、イスラエルはみな、異邦人とユダヤ人から成る神の民全体を指すと読みます。","s":1156.644,"e":1163.709,"p":false,"h":false},{"t":"ここでは、この論争を決着させることはしません。","s":1163.988,"e":1167.687,"p":false,"h":false},{"t":"ただ、イスラエルの将来についての神の約束は取り消されていない、というパウロの確信は明らかであることを述べておきます。","s":1167.876,"e":1176.866,"p":true,"h":false},{"t":"反ユダヤ主義に悪用してはならない理由","s":1177.452,"e":1180.481,"p":true,"h":false},{"t":"この本文には、教会史の中で反ユダヤ主義を正当化するために用いられてきた、不幸な歴史があります。","s":1180.908,"e":1188.673,"p":false,"h":false},{"t":"神がユダヤ人を退け、教会がその地位に取って代わったと教えるやり方です。","s":1188.936,"e":1194.847,"p":false,"h":false},{"t":"しかし、この読み方は本文に合いません。","s":1195.164,"e":1198.358,"p":true,"h":false},{"t":"パウロはユダヤ人であり、イザヤもユダヤ人であり、イエスもユダヤ人でした。","s":1198.764,"e":1204.412,"p":false,"h":false},{"t":"福音はユダヤ人から出て異邦人へ行ったのであって、ユダヤ人を離れて異邦人へ行ったのではありません。","s":1204.596,"e":1212.301,"p":false,"h":false},{"t":"ローマ人への手紙11章でパウロは、接ぎ木された異邦人信者が、元の枝に対して高ぶってはならないと警告します。","s":1212.516,"e":1221.47,"p":false,"h":false},{"t":"あなたを支えているのは根であって、あなたが根を支えているのではない、と言います。","s":1221.768,"e":1227.309,"p":false,"h":false},{"t":"ローマ人への手紙11章18節です。","s":1227.6,"e":1230.772,"p":false,"h":false},{"t":"異邦人信者は、高ぶりではなくへりくだりをもって、この本文を読まなければなりません。","s":1231.056,"e":1237.457,"p":true,"h":false},{"t":"パウロが宣言したとき、それは復讐の宣言ではなく、悲しみの宣言でした。","s":1237.896,"e":1243.95,"p":false,"h":false},{"t":"責任が聞き手たちにあるという言葉は明白でしたが、その言葉を語った人は、彼らのためならのろわれることさえいとわないと言った人でした。","s":1244.16,"e":1254.026,"p":true,"h":false},{"t":"妨げられることなく","s":1254.492,"e":1256.147,"p":true,"h":false},{"t":"使徒の働きの最後の2節は、この宣言の直後に来る文章として、もう一度読む価値があります。","s":1256.58,"e":1263.845,"p":false,"h":false},{"t":"パウロは、丸二年、自分の借りた家に住み、彼のもとに来る人たちをみな迎え入れ、少しも妨げられることなく、大胆に神の国を宣べ伝え、主イエス・キリストについて教えました。","s":1264.14,"e":1278.737,"p":false,"h":false},{"t":"使徒の働き28章30節から31節です。","s":1278.936,"e":1283.088,"p":true,"h":false},{"t":"彼のもとに来る人たちをみな迎え入れた、とあります。","s":1283.616,"e":1287.193,"p":false,"h":false},{"t":"この人々の中には、ユダヤ人もいたでしょうし、異邦人もいたでしょう。","s":1287.468,"e":1292.709,"p":false,"h":false},{"t":"異邦人のほうへ行くという宣言の後にも、パウロの家の扉は閉ざされませんでした。","s":1292.904,"e":1299.094,"p":true,"h":false},{"t":"この最後の場面が語っているのは、これです。","s":1299.528,"e":1302.666,"p":false,"h":false},{"t":"人間の拒絶は、神の救いのご計画を止めることはできません。","s":1302.912,"e":1307.726,"p":false,"h":false},{"t":"イスラエルの拒絶が福音が異邦人へ行く道を開いたように、だれかの拒絶は神の国における終わりではありません。","s":1307.916,"e":1316.239,"p":false,"h":false},{"t":"そして福音は、鎖につながれた使徒の口を通してであっても、妨げられることなく宣べ伝えられます。","s":1316.448,"e":1323.878,"p":false,"h":false},{"t":"妨げられないのは、福音です。","s":1324.224,"e":1326.537,"p":true,"h":false}]},{"title":"12.律法から自由だというのに、なぜエルサレム会議は「血を避けなさい」とし、パウロはテモテに割礼を受けさせたのでしょうか","audio":"book_2610280719_2.mp3","start":1327.14,"end":2064.528,"dur":737.4,"segs":[{"t":"12.律法から自由だというのに、なぜエルサレム会議は「血を避けなさい」とし、パウロはテモテに割礼を受けさせたのでしょうか","s":1327.14,"e":1336.779,"p":true,"h":false},{"t":"本文：使徒の働き15章1節から35節、16章1節から5節、21章17節から26節（一緒に読む本文：ガラテヤ人への手紙2章1節から5節、5章1節から6節、コリント人への手紙第一8章1節から13節、9章19節から23節、10章23節から33節、エペソ人への手紙2章8節から9節、コロサイ人への手紙2章16節から17節）","s":1337.292,"e":1372.364,"p":true,"h":false},{"t":"使徒の働き15章は、教会の歴史において最も重要な会議の一つです。","s":1372.824,"e":1378.73,"p":false,"h":false},{"t":"異邦人がクリスチャンになるためには、まずユダヤ人にならなければならないのかをめぐって、教会が決定を下した場でした。","s":1379.016,"e":1387.516,"p":true,"h":false},{"t":"ところが、この章を読むと、かえって疑問が増えてきます。","s":1387.944,"e":1392.15,"p":false,"h":false},{"t":"律法のくびきを異邦人に負わせないと決めておきながら、すぐ後で、偶像に供えられた物と淫らな行いと、絞め殺したものと血を避けるよう勧めているからです。","s":1392.408,"e":1404.388,"p":false,"h":false},{"t":"同じ使徒の働きで、パウロはテモテに割礼を受けさせていますが、ガラテヤ人への手紙では、テトスには割礼を受けさせなかったと言っています。","s":1404.72,"e":1415.035,"p":false,"h":false},{"t":"そして後にエルサレムでは、律法に従う儀式に自ら参加します。","s":1415.304,"e":1420.384,"p":true,"h":false},{"t":"パウロには一貫性がなかったのでしょうか。","s":1421.028,"e":1423.762,"p":false,"h":false},{"t":"この文章では、この見かけ上の矛盾を一つずつ解いていきます。","s":1423.98,"e":1428.652,"p":false,"h":false},{"t":"解いていくと、一つの原則が見えてきます。","s":1428.948,"e":1432.073,"p":true,"h":false},{"t":"何をめぐって論争したのか","s":1432.548,"e":1434.688,"p":true,"h":false},{"t":"出来事はアンティオキアで始まります。","s":1435.14,"e":1437.705,"p":false,"h":false},{"t":"ユダヤから下って来たある人々が兄弟たちを教え、「モーセの慣習に従って割礼を受けなければ、救われることはできない」と言いました。","s":1437.984,"e":1448.031,"p":false,"h":false},{"t":"使徒の働き15章1節です。","s":1448.208,"e":1450.682,"p":false,"h":false},{"t":"パウロとバルナバは彼らと激しく対立し、この問題をエルサレムの使徒たちと長老たちのところへ持って行きます。","s":1450.908,"e":1458.877,"p":true,"h":false},{"t":"争点は明らかです。","s":1459.476,"e":1461.038,"p":false,"h":false},{"t":"救われるために何が必要なのか、ということです。","s":1461.384,"e":1465.196,"p":false,"h":false},{"t":"異邦人はイエスを信じるだけで十分なのか、それとも割礼とモーセの律法の遵守が加えられなければならないのか。","s":1465.452,"e":1473.79,"p":false,"h":false},{"t":"この問いは、福音の本質に触れます。","s":1474.056,"e":1476.815,"p":false,"h":false},{"t":"もし信仰に律法の遵守が加えられなければならないなら、キリストの十字架は救いを完成していないことになります。","s":1477.08,"e":1484.97,"p":true,"h":false},{"t":"ペテロが立ち上がって語ります。","s":1485.504,"e":1487.444,"p":false,"h":false},{"t":"神が異邦人にも、私たちに与えられたのと同じように聖霊を与え、信仰によって彼らの心をきよめてくださったのに、どうして私たちの先祖も私たちも負いきれなかったくびきを、彼らの首に負わせて神を試みるのかと問いかけます。","s":1487.7,"e":1505.327,"p":false,"h":false},{"t":"そして結論を述べます。","s":1505.592,"e":1507.32,"p":false,"h":false},{"t":"「私たちが主イエスの恵みによって救われることを信じているのは、彼らと同じです。」","s":1507.572,"e":1513.555,"p":false,"h":false},{"t":"使徒の働き15章11節です。","s":1513.836,"e":1516.547,"p":true,"h":false},{"t":"この一文が、この会議の神学的な中心です。","s":1517.04,"e":1520.89,"p":false,"h":false},{"t":"救いは、ユダヤ人であれ異邦人であれ、一つの方法によって実現します。","s":1521.144,"e":1526.859,"p":false,"h":false},{"t":"主イエスの恵みにより、信仰によって受けるのです。","s":1527.12,"e":1530.832,"p":true,"h":false},{"t":"ヤコブの結論","s":1531.332,"e":1532.58,"p":true,"h":false},{"t":"ヤコブはアモスの預言を引用し、異邦人の入信が神が昔から語っておられたことだと示します。","s":1533.24,"e":1540.647,"p":false,"h":false},{"t":"使徒の働き15章15節から18節です。","s":1540.944,"e":1544.67,"p":false,"h":false},{"t":"そして結論を語ります。","s":1544.94,"e":1546.768,"p":false,"h":false},{"t":"異邦人の中から神に立ち返る人たちを悩ませず、ただ、偶像によって汚れたものと淫らな行いと、絞め殺したものと血を避けるようにと手紙を書くべきだ、というのです。","s":1547.064,"e":1559.976,"p":false,"h":false},{"t":"使徒の働き15章19節から20節です。","s":1560.204,"e":1563.856,"p":true,"h":false},{"t":"その理由も付け加えます。","s":1564.38,"e":1566.158,"p":false,"h":false},{"t":"モーセの律法には、昔からどの町にもそれを宣べ伝える人がいて、安息日ごとに会堂で読まれている、ということです。","s":1566.396,"e":1575.121,"p":false,"h":false},{"t":"使徒の働き15章21節です。","s":1575.396,"e":1578.247,"p":false,"h":false},{"t":"この言葉の意味は、こう読むことができます。","s":1578.528,"e":1581.546,"p":false,"h":false},{"t":"異邦人信者がユダヤ人信者と一つの教会で食卓を共にするなら、ユダヤ人にとって特に嫌悪すべきいくつかのことを慎むのが愛だ、ということです。","s":1581.84,"e":1593.401,"p":true,"h":false},{"t":"ですから、この四つは救いの条件ではありません。","s":1593.9,"e":1597.59,"p":false,"h":false},{"t":"手紙にも、この点ははっきり表れています。","s":1597.788,"e":1601.088,"p":false,"h":false},{"t":"「聖霊と私たちは、次の必要なもののほかは、あなたがたにどんな重荷も負わせないことに決めました。」","s":1601.316,"e":1608.647,"p":false,"h":false},{"t":"使徒の働き15章28節です。","s":1608.984,"e":1611.894,"p":false,"h":false},{"t":"救われるためにはこれを守らなければならないとは言わず、重荷として負わせはしないが、必要なことは守るようにと言っています。","s":1612.152,"e":1621.142,"p":false,"h":false},{"t":"前者は救いの問題であり、後者は交わりにおける配慮です。","s":1621.404,"e":1626.019,"p":true,"h":false},{"t":"血と絞め殺したもの","s":1626.516,"e":1628.049,"p":true,"h":false},{"t":"この四つの中で、今日の読者にとって最もなじみが薄いのは、血と絞め殺したものです。","s":1628.496,"e":1634.919,"p":false,"h":false},{"t":"これは今日も守るべき規定なのでしょうか。","s":1635.192,"e":1637.989,"p":true,"h":false},{"t":"教会の中には、この問いに対して二つの答えがあります。","s":1638.468,"e":1642.763,"p":false,"h":false},{"t":"一つは、この要求を、当時ユダヤ人と異邦人が共に食事をする教会の状況のための、一時的な配慮と見る立場です。","s":1643.04,"e":1652.652,"p":false,"h":false},{"t":"この立場は、パウロが後にコリントの教会に書いた手紙で、偶像に供えられた物の問題を扱う仕方を根拠にします。","s":1652.904,"e":1661.853,"p":false,"h":false},{"t":"パウロは、偶像は何でもないので、偶像に供えられた物を食べても汚されることはないとしながらも、弱い兄弟がそれを見てつまずくなら、食べないと言います。","s":1662.156,"e":1673.545,"p":false,"h":false},{"t":"コリント人への手紙第一8章4節から13節です。","s":1673.856,"e":1678.121,"p":false,"h":false},{"t":"市場で売っているものは良心のために何も尋ねずに食べなさい、しかし誰かが、これは供え物だと知らせてくれたなら、その知らせてくれた人と良心のために食べないようにと言います。","s":1678.392,"e":1691.307,"p":false,"h":false},{"t":"コリント人への手紙第一10章25節から28節です。","s":1691.64,"e":1696.308,"p":false,"h":false},{"t":"これは律法を救いの条件とするのではなく、愛によって自由を節制するあり方です。","s":1696.536,"e":1702.584,"p":true,"h":false},{"t":"もう一つの立場は、偶像に供えられた物と淫らな行いは道徳的に恒久的な禁止であり、血と絞め殺したものも、創世記9章でノアに与えられた古い規定に関わると見ます。","s":1703.088,"e":1717.203,"p":false,"h":false},{"t":"この解釈では、この四つは異邦人にも求められる最小限の規範です。","s":1717.452,"e":1723.024,"p":true,"h":false},{"t":"この文章は前者の読み方に傾いていますが、この箇所が簡単に解けるものではないことは述べておきます。","s":1723.536,"e":1731.051,"p":false,"h":false},{"t":"どちらの立場にも共通する点があります。","s":1731.384,"e":1734.318,"p":false,"h":false},{"t":"これは救いの条件ではないという点、そしてキリストにあって互いに配慮する交わりのあり方だという点です。","s":1734.624,"e":1742.462,"p":true,"h":false},{"t":"テモテの割礼とテトスの割礼","s":1742.976,"e":1745.459,"p":true,"h":false},{"t":"ここで、パウロの一貫性という問題に移ります。","s":1745.964,"e":1749.526,"p":false,"h":false},{"t":"16章でパウロは、ルステラでテモテを同行者にしようとして、彼に割礼を受けさせます。","s":1749.816,"e":1756.659,"p":false,"h":false},{"t":"その地方にいたユダヤ人たちのためだと、その理由を述べています。","s":1756.944,"e":1761.746,"p":false,"h":false},{"t":"使徒の働き16章3節です。","s":1762.164,"e":1764.711,"p":false,"h":false},{"t":"テモテは信じるユダヤ人の女性の子で、父親はギリシア人でした。","s":1765.008,"e":1770.046,"p":true,"h":false},{"t":"ところがガラテヤ人への手紙2章で、パウロはテトスをエルサレムに連れて行ったとき、彼はギリシア人であったのに、無理に割礼を受けさせられなかったと言っています。","s":1770.48,"e":1781.951,"p":false,"h":false},{"t":"忍び込んだ偽兄弟たちが私たちを奴隷にしようとしたが、私たちは彼らに一時も屈服しなかったと言います。","s":1782.252,"e":1790.254,"p":false,"h":false},{"t":"ガラテヤ人への手紙2章3節から5節です。","s":1790.532,"e":1794.056,"p":false,"h":false},{"t":"同じパウロが、一人には割礼を受けさせ、一人にはそれを拒みました。","s":1794.312,"e":1799.639,"p":true,"h":false},{"t":"二つの出来事を分けるのは、救いとの関係です。","s":1800.072,"e":1803.704,"p":false,"h":false},{"t":"テトスの場合、割礼は救いに必要だという主張の試金石でした。","s":1803.96,"e":1808.984,"p":false,"h":false},{"t":"これを受け入れれば福音の真理が崩れるので、パウロは一歩も退きませんでした。","s":1809.18,"e":1815.26,"p":false,"h":false},{"t":"一方、テモテの場合には、救いの条件だという主張は入り込んでいませんでした。","s":1815.444,"e":1821.746,"p":false,"h":false},{"t":"ユダヤ人の母から生まれたテモテが割礼を受けていなければ、ユダヤ人たちに福音を宣べ伝えるとき妨げとなるため、宣教のための自発的な配慮として受けさせたのです。","s":1821.924,"e":1834.176,"p":true,"h":false},{"t":"原則は一つです。","s":1834.704,"e":1836.157,"p":false,"h":false},{"t":"救いの条件として求められるなら拒み、福音のための自由な選択であるなら認めるのです。","s":1836.612,"e":1843.286,"p":false,"h":false},{"t":"パウロはこの原則を、コリントの教会にこのように説明します。","s":1843.596,"e":1848.386,"p":false,"h":false},{"t":"ユダヤ人にはユダヤ人のようになった、これはユダヤ人を得るためであり、すべての人に、すべてのものとなった、これは何とかして、何人かでも救うためだ、と言います。","s":1848.636,"e":1861.048,"p":false,"h":false},{"t":"コリント人への手紙第一9章20節から22節です。","s":1861.308,"e":1865.851,"p":true,"h":false},{"t":"エルサレムでの誓願","s":1866.348,"e":1867.871,"p":true,"h":false},{"t":"パウロの一貫性の問題が最も鋭く提起されるのは、21章です。","s":1868.292,"e":1873.844,"p":false,"h":false},{"t":"パウロがエルサレムに上ると、ヤコブと長老たちはこのように言います。","s":1874.124,"e":1878.826,"p":false,"h":false},{"t":"ユダヤ人の中で信じる者は何万人もいて、皆が律法に熱心な人々だが、彼らはあなたについて、異邦人の中に住むユダヤ人にモーセに背を向け、割礼を行わないよう教えていると聞いている、というのです。","s":1879.092,"e":1895.252,"p":false,"h":false},{"t":"使徒の働き21章20節から21節です。","s":1895.508,"e":1899.516,"p":false,"h":false},{"t":"そこで、誓願を立てている四人の人と一緒にきよめの儀式を行い、その費用を出してあげるよう提案します。","s":1899.792,"e":1907.544,"p":true,"h":false},{"t":"パウロはこの提案に従います。","s":1908.072,"e":1910.112,"p":false,"h":false},{"t":"使徒の働き21章26節です。","s":1910.376,"e":1913.416,"p":false,"h":false},{"t":"このことは、以前にも似た形で現れています。","s":1913.688,"e":1917.114,"p":false,"h":false},{"t":"18章でパウロは、誓願を立てていたのでケンクレアで髪を切ったとあります。","s":1917.396,"e":1923.058,"p":false,"h":false},{"t":"使徒の働き18章18節です。","s":1923.372,"e":1926.181,"p":true,"h":false},{"t":"このことについて、ある学者たちは、パウロが福音の自由を損ない、妥協したのだと批判します。","s":1926.684,"e":1934.033,"p":false,"h":false},{"t":"別の学者たちは、これをパウロの一貫した原則の適用だと見ます。","s":1934.316,"e":1939.361,"p":false,"h":false},{"t":"救いの条件でないなら、ユダヤ人の慣習に参加しても福音を損なうことはなく、むしろ誤解を解いて福音への道を開くことだ、というのです。","s":1939.644,"e":1950.312,"p":false,"h":false},{"t":"この文章は、二つ目の読み方に従います。","s":1950.624,"e":1953.946,"p":false,"h":false},{"t":"ただし、このことが結果としてパウロの益にならなかったという事実は、覚えておく必要があります。","s":1954.224,"e":1961.11,"p":false,"h":false},{"t":"パウロはこの直後、神殿で捕らえられます。","s":1961.424,"e":1964.61,"p":true,"h":false},{"t":"福音と自由","s":1965.132,"e":1966.296,"p":true,"h":false},{"t":"これらすべての議論を経て残る中心は、福音を表す一つの文です。","s":1967.04,"e":1972.325,"p":false,"h":false},{"t":"「あなたがたは恵みのゆえに、信仰によって救われたのです。","s":1972.62,"e":1976.729,"p":false,"h":false},{"t":"それは自分自身から出たことではなく、神の賜物です。」","s":1977.048,"e":1981.13,"p":false,"h":false},{"t":"エペソ人への手紙2章8節です。","s":1981.404,"e":1984.032,"p":false,"h":false},{"t":"救いは、割礼や食べ物や祭りや、どのような行いの付け足しによっても成り立ちません。","s":1984.284,"e":1990.77,"p":false,"h":false},{"t":"コロサイ人への手紙は、食べ物や飲み物、祭り、新月、安息日を理由に、だれにもあなたがたを批判させてはならないとし、これらは来たるべきものの影であって、本体はキリストにあると言います。","s":1990.944,"e":2006.234,"p":false,"h":false},{"t":"コロサイ人への手紙2章16節から17節です。","s":2006.496,"e":2010.42,"p":true,"h":false},{"t":"しかし、この自由は好き勝手に生きる自由ではありません。","s":2010.924,"e":2015.114,"p":false,"h":false},{"t":"自由を与えられた人は、その自由を愛のために用います。","s":2015.316,"e":2019.657,"p":false,"h":false},{"t":"弱い兄弟のために食べず、福音のためにユダヤ人のようになることもあります。","s":2019.96,"e":2025.535,"p":false,"h":false},{"t":"自由は、救いの問題では一歩も退かない断固とした態度として、交わりの問題では兄弟を配慮する柔軟さとして現れます。","s":2025.864,"e":2035.951,"p":true,"h":false},{"t":"今日の教会にも、似たようなことが多くあります。","s":2036.484,"e":2040.086,"p":false,"h":false},{"t":"ある食べ物や祭り、習慣、外見を信仰の条件であるかのように求めることがあり、反対に、何も慎まずに兄弟をつまずかせることもあります。","s":2040.372,"e":2051.632,"p":false,"h":false},{"t":"エルサレム会議が私たちに与える知恵は、この両方を防ぎます。","s":2051.964,"e":2056.636,"p":false,"h":false},{"t":"救いの条件にはキリスト以外の何も加えず、兄弟との交わりでは愛を先にする道です。","s":2056.932,"e":2064.031,"p":true,"h":false}]},{"title":"13.聖霊が禁じ、幻によって召し、くじを引かせる導きを、どのように読めばよいのでしょうか","audio":"book_2610280719_2.mp3","start":2064.528,"end":2854.584,"dur":790.1,"segs":[{"t":"13.聖霊が禁じ、幻によって召し、くじを引かせる導きを、どのように読めばよいのでしょうか","s":2064.528,"e":2072.334,"p":true,"h":false},{"t":"本文：使徒の働き1章21節から26節、16章6節から10節（ともに読む本文：使徒の働き8章26節から29節、使徒の働き13章1節から3節、使徒の働き15章28節、使徒の働き20章22節から24節、使徒の働き21章4節、10節から14節、箴言16章9節、箴言16章33節、ローマ人への手紙12章2節、テサロニケ人への手紙 第一4章3節）","s":2072.808,"e":2111.5,"p":true,"h":false},{"t":"教会の中で最もよく使われる言葉の一つは、神が導かれた、という言葉です。","s":2111.94,"e":2118.263,"p":false,"h":false},{"t":"仕事や結婚相手や引っ越しや教会の働きについて、神のみこころを求めることは、信者の日常です。","s":2118.528,"e":2126.678,"p":false,"h":false},{"t":"そして使徒の働きは、導きの物語で満ちています。","s":2126.916,"e":2131.065,"p":true,"h":false},{"t":"ところが、使徒の働きを注意深く読んでみると、神が導かれる方法があまりにも多様であることに気づきます。","s":2131.632,"e":2139.697,"p":false,"h":false},{"t":"くじを引くこともあり、御使いが語ることもあり、聖霊が直接語られることもあり、幻が現れることもあり、聖霊が禁じられることもあります。","s":2139.984,"e":2150.668,"p":false,"h":false},{"t":"これをどのように読めばよいのでしょうか。","s":2151,"e":2153.448,"p":false,"h":false},{"t":"この中のどれが、今日の信者に期待されている方法なのでしょうか。","s":2153.664,"e":2158.441,"p":true,"h":false},{"t":"この文章では、使徒の働きに出てくる導きの場面を見ながら、それが私たちに何を語り、何を語っていないのかを区別してみましょう。","s":2158.92,"e":2169.122,"p":true,"h":false},{"t":"最後のくじ引き","s":2169.72,"e":2171.079,"p":true,"h":false},{"t":"使徒の働き1章で、十一人の使徒たちはイスカリオテのユダの代わりを補うことにします。","s":2171.628,"e":2178.408,"p":false,"h":false},{"t":"条件にかなう二人、ヨセフ・バルサバとマティアを立てて、祈ります。","s":2178.684,"e":2183.624,"p":false,"h":false},{"t":"「すべての人の心をご存じの主よ。","s":2183.904,"e":2186.644,"p":false,"h":false},{"t":"この二人のうちのどちらをお選びになったかを、お示しください。」","s":2186.82,"e":2191.175,"p":false,"h":false},{"t":"そしてくじを引くと、マティアに当たり、彼は十一人の使徒たちに加えられました（使徒の働き1章23節から26節）。","s":2191.356,"e":2201.355,"p":true,"h":false},{"t":"くじ引きは、旧約において神のみこころを求める方法として用いられました。","s":2201.832,"e":2207.4,"p":false,"h":false},{"t":"箴言は、人はくじを投げるが、その決定は主から来る、と言っています（箴言16章33節）。","s":2207.592,"e":2216.036,"p":false,"h":false},{"t":"しかし、使徒の働き全体で、くじ引きがこのように用いられたのは、この一度だけです。","s":2216.232,"e":2223.048,"p":false,"h":false},{"t":"聖霊が五旬節に臨まれた後には、再び出てきません。","s":2223.288,"e":2227.749,"p":true,"h":false},{"t":"これは重要な事実を示しています。","s":2228.184,"e":2230.736,"p":false,"h":false},{"t":"くじ引きは、聖霊がまだ来られる前、昇天と五旬節の間という過渡期に用いられた方法でした。","s":2231.028,"e":2238.542,"p":false,"h":false},{"t":"聖霊が来られた後は、導きの方法が変わりました。","s":2238.804,"e":2242.789,"p":false,"h":false},{"t":"使徒の働きに出てくる使徒たちは、これから先の重要な決定をくじで行いませんでした。","s":2242.98,"e":2249.6,"p":true,"h":false},{"t":"付け加えて、一つは正直に言わなければなりません。","s":2250.036,"e":2253.939,"p":false,"h":false},{"t":"マティアはその後、使徒の働きで再び言及されておらず、第十二番目の使徒をパウロと見るべきかどうかをめぐって、教会には長い議論があります。","s":2254.14,"e":2265.183,"p":false,"h":false},{"t":"ルカはマティアが十二使徒に加えられたと記しており、その選びを否定していませんので、この文章ではこの選びをそのまま受け入れ、議論はいったんここで脇に置きます。","s":2265.48,"e":2277.388,"p":true,"h":false},{"t":"聖霊と御使いと幻","s":2278.008,"e":2280.09,"p":true,"h":false},{"t":"その後の導きは多様です。","s":2280.528,"e":2282.566,"p":false,"h":false},{"t":"御使いがピリポに語り、荒野へ向かう道に行くようにと言います（使徒の働き8章26節）。","s":2282.796,"e":2290.091,"p":false,"h":false},{"t":"続いて聖霊がピリポに、その馬車に近づくようにと語られます（使徒の働き8章29節）。","s":2290.284,"e":2297.832,"p":false,"h":false},{"t":"アンティオキアの教会が断食して主を礼拝しているとき、聖霊はバルナバとサウロを、わたしのために取り分けるようにと言われます（使徒の働き13章2節）。","s":2298.06,"e":2309.665,"p":false,"h":false},{"t":"幻がコルネリオとペテロに現れます。","s":2309.868,"e":2312.753,"p":false,"h":false},{"t":"エルサレム会議の決定は、このように表現されます。","s":2313.036,"e":2316.861,"p":false,"h":false},{"t":"「聖霊と私たちは、次の必要なもの以外には、あなたがたにどんな重荷も負わせないことを決めました」（使徒の働き15章28節）。","s":2317.104,"e":2327.465,"p":true,"h":false},{"t":"これらすべての場面には共通点があります。","s":2327.94,"e":2331.027,"p":false,"h":false},{"t":"神が福音の道を開くために導かれた、ということです。","s":2331.324,"e":2335.637,"p":false,"h":false},{"t":"個人の安楽や成功のための導きではなく、福音が新しい人々に届くようにする導きでした。","s":2335.896,"e":2343.165,"p":false,"h":false},{"t":"そしてその大部分は、使徒たちと教会の指導者たちが、福音の働きにおける決定的な時に経験したことでした。","s":2343.348,"e":2352.274,"p":true,"h":false},{"t":"禁じられる聖霊","s":2352.708,"e":2354.143,"p":true,"h":false},{"t":"最も興味深い場面は16章です。","s":2354.616,"e":2357.732,"p":false,"h":false},{"t":"パウロの一行は、アジアでみことばを語ることを聖霊に禁じられたので、フリギア・ガラテヤの地を通って行きます。","s":2358.036,"e":2366.419,"p":false,"h":false},{"t":"ムシアの近くに来てから、ビティニアに行こうとしましたが、イエスの御霊がそれをお許しになりませんでした（使徒の働き16章6節から7節）。","s":2366.712,"e":2377.324,"p":false,"h":false},{"t":"そこでムシアを通り過ぎて、トロアスに下って行きます。","s":2377.548,"e":2381.351,"p":true,"h":false},{"t":"この箇所で、私たちは不思議な点に気づきます。","s":2381.904,"e":2385.448,"p":false,"h":false},{"t":"聖霊はパウロが福音を伝えることを禁じられました。","s":2385.792,"e":2389.612,"p":false,"h":false},{"t":"アジアは、後にエペソ教会が建てられ、ヨハネの黙示録に出てくる七つの教会が置かれることになる地です。","s":2389.824,"e":2397.757,"p":false,"h":false},{"t":"しかし、この時はまだその時ではありませんでした。","s":2398.032,"e":2401.786,"p":false,"h":false},{"t":"本文は、どのように禁じられたのか、なぜ禁じられたのかを語っていません。","s":2401.992,"e":2407.452,"p":false,"h":false},{"t":"聖霊が言葉によって語られたのか、状況によって妨げられたのか、心に与えられた感動だったのかは分かりません。","s":2407.644,"e":2416.085,"p":false,"h":false},{"t":"理由も教えていません。","s":2416.284,"e":2417.949,"p":true,"h":false},{"t":"そして夜、トロアスでパウロは幻を見ます。","s":2418.372,"e":2421.883,"p":false,"h":false},{"t":"一人のマケドニア人が立って、「マケドニアに渡って来て、私たちを助けてください」と願っています。","s":2422.116,"e":2429.292,"p":false,"h":false},{"t":"この幻を見た後、本文はこのように記しています。","s":2429.568,"e":2433.673,"p":false,"h":false},{"t":"「私たちはただちにマケドニアに出かけることにした。","s":2433.924,"e":2437.45,"p":false,"h":false},{"t":"神が私たちを召して、彼らに福音を宣べ伝えさせようとしておられるのだ、と判断したからである」（使徒の働き16章10節）。","s":2437.704,"e":2447.525,"p":true,"h":false},{"t":"ここでは、「判断した」という言葉に注目しなければなりません。","s":2448,"e":2452.796,"p":false,"h":false},{"t":"この言葉には、さまざまな根拠を集めて結論に至った、という意味があります。","s":2452.968,"e":2458.801,"p":false,"h":false},{"t":"パウロの一行は、一つの幻だけを見て走り出したのではありません。","s":2459.088,"e":2464.236,"p":false,"h":false},{"t":"アジアで妨げられ、ビティニアで妨げられ、トロアスに着いて幻が現れたという一連の出来事を総合して、神が召しておられると判断したのです。","s":2464.416,"e":2475.497,"p":false,"h":false},{"t":"そしてその判断は、共同体の中でともになされました。","s":2475.756,"e":2480.047,"p":false,"h":false},{"t":"この節で初めて本文の主語が「私たち」に変わりますが、これはルカがこの旅に加わったからです。","s":2480.256,"e":2487.406,"p":false,"h":false},{"t":"導きは、個人の神秘的な体験で終わらず、ともにいる人々の判断へとつながりました。","s":2487.672,"e":2494.462,"p":true,"h":false},{"t":"聖霊の導きと他の信者の言葉","s":2494.908,"e":2497.89,"p":true,"h":false},{"t":"導きがいつも明快であるとは限らないことを示す箇所が、もう一つあります。","s":2498.328,"e":2503.83,"p":false,"h":false},{"t":"パウロは、エルサレムでどのようなことが自分に起こるのか分からないまま、御霊に縛られてエルサレムに上って行くのだと言います。","s":2504.088,"e":2512.641,"p":false,"h":false},{"t":"ただ、聖霊が町ごとに、なわめと苦難が自分を待っていると証ししておられる、と言います（使徒の働き20章22節から23節）。","s":2512.98,"e":2523.659,"p":false,"h":false},{"t":"ところがツロでは、弟子たちが御霊によって、パウロにエルサレムへ上らないようにと言っていた、と記されています（使徒の働き21章4節）。","s":2523.852,"e":2534.429,"p":false,"h":false},{"t":"カイサリアでは、預言者アガボがパウロの帯を取って自分の手足を縛り、この帯の持ち主はこのように縛られる、と預言します。","s":2534.616,"e":2543.843,"p":false,"h":false},{"t":"人々が上らないようにと願うと、パウロは、私はエルサレムで主イエスの御名のためなら、縛られることだけでなく、死ぬ覚悟もできています、と答えます（使徒の働き21章10節から13節）。","s":2544.12,"e":2559.274,"p":true,"h":false},{"t":"この場面は私たちを困らせます。","s":2559.744,"e":2562.249,"p":false,"h":false},{"t":"御霊によって上らないようにと言った弟子たちがいて、同じ御霊に縛られて上るのだと言ったパウロがいました。","s":2562.516,"e":2569.672,"p":false,"h":false},{"t":"どちらが正しかったのでしょうか。","s":2569.968,"e":2571.981,"p":false,"h":false},{"t":"本文はパウロの道に沿って物語を続けていますので、パウロが主のみこころに従ったのだと読むことができます。","s":2572.2,"e":2580.102,"p":false,"h":false},{"t":"しかしこの場面は、聖霊の導きを知っていると主張する人どうしでも、異なることを言う場合があることを示しています。","s":2580.372,"e":2588.843,"p":false,"h":false},{"t":"主観的な感動だけでは、導きを確定することはできない、ということです。","s":2589.12,"e":2594.857,"p":true,"h":false},{"t":"導きについての二つの立場","s":2595.348,"e":2597.588,"p":true,"h":false},{"t":"この問題をめぐって、今日の教会には二つの大きな理解があります。","s":2598.012,"e":2603.051,"p":true,"h":false},{"t":"一つは、聖霊が今日も使徒の働きの時代のように、幻と声と感動によって直接導かれる、という理解です。","s":2603.628,"e":2612.539,"p":false,"h":false},{"t":"この立場は、聖霊の直接の語りを求め、それを見分けなければならないと教えます。","s":2612.772,"e":2619.095,"p":true,"h":false},{"t":"もう一つは、神のみこころは聖書に十分に啓示されているので、今日の信者は聖書の原則と知恵ある判断、そして神の摂理の中で道を見いだす、という理解です。","s":2619.612,"e":2632.458,"p":false,"h":false},{"t":"改革派の伝統は、おおむねこちらに立っています。","s":2632.752,"e":2636.211,"p":false,"h":false},{"t":"神が今日も摂理によって私たちを導かれるという点は、両方の立場が認めています。","s":2636.496,"e":2642.944,"p":false,"h":false},{"t":"ただし、新しい啓示を期待するかどうかで分かれます。","s":2643.228,"e":2647.093,"p":true,"h":false},{"t":"この文章は、二つ目の立場から読みます。","s":2647.62,"e":2650.763,"p":false,"h":false},{"t":"その理由は、使徒の働きにおける導きの大部分が、福音の働きの決定的な転換点で使徒たちに与えられたものであり、これをすべての信者が日常の決定において期待すべき規範とする根拠が、本文にはないからです。","s":2651.04,"e":2667.987,"p":false,"h":false},{"t":"書簡は、日常の決定について信者に別のことを語っています。","s":2668.212,"e":2673.114,"p":false,"h":false},{"t":"「神のみこころは、あなたがたが聖なる者となることです」と言い（テサロニケ人への手紙 第一4章3節）、「心を新たにすることで自分を変えていただき、神のみこころは何か、すなわち、何が良いことで、神に喜ばれ、完全であるのかを見分けるようになりなさい」と言います（ローマ人への手紙12章2節）。","s":2673.396,"e":2696.916,"p":false,"h":false},{"t":"仕事や引っ越しや結婚相手を選ぶことにおいて、信者は聖書がすでに語っている原則と知恵と祈りの中で判断し、その結果を神に委ねます。","s":2697.12,"e":2708.009,"p":true,"h":false},{"t":"「導き」という言葉が危険になるとき","s":2708.532,"e":2711.543,"p":true,"h":false},{"t":"この文章を書いている立場からは言いにくいことですが、言わなければならないことがあります。","s":2711.988,"e":2718.275,"p":false,"h":false},{"t":"韓国の教会では、「神が語られた」という言葉があまりにも簡単に使われています。","s":2718.576,"e":2725.048,"p":false,"h":false},{"t":"自分の計画に神の名を着せたり、自分の判断を反論できない権威にしたりするために用いられることがあります。","s":2725.344,"e":2733.245,"p":false,"h":false},{"t":"神が私に幻でお見せになった、と言われれば、だれも反論しにくいからです。","s":2733.588,"e":2739.365,"p":true,"h":false},{"t":"使徒の働きの使徒たちは、幻を見たと言いながらも、自分の判断を吟味してもらう過程を通りました。","s":2739.888,"e":2747.453,"p":false,"h":false},{"t":"コルネリオの出来事の後、ペテロはエルサレム教会の前で、自分がしたことを説明しなければなりませんでした。","s":2747.664,"e":2755.547,"p":false,"h":false},{"t":"エルサレム会議では、使徒たちがともに集まり、聖書と経験を前にして議論しました。","s":2755.764,"e":2762.248,"p":false,"h":false},{"t":"自分が聞いた声を根拠にしてすべてを決めることは、使徒の働きの方法ではありません。","s":2762.424,"e":2768.79,"p":true,"h":false},{"t":"信者が神のみこころを求めることは、当然のことです。","s":2769.264,"e":2773.266,"p":false,"h":false},{"t":"箴言は、人が心の中で自分の道を思い巡らしていても、その歩みを確かなものにするのは主である、と言っています（箴言16章9節）。","s":2773.548,"e":2784.848,"p":false,"h":false},{"t":"しかしこのみことばは、神が神秘的なしるしによって私たちのすべての選択を代わりにしてくださる、という意味ではなく、私たちが計画し歩んでいくすべての歩みの背後に、神の御手があるという意味です。","s":2785.068,"e":2800.17,"p":true,"h":false},{"t":"知らないまま歩む信者","s":2800.728,"e":2802.621,"p":true,"h":false},{"t":"使徒の働きにおける導きが私たちに与える最大の慰めは、これです。","s":2803.068,"e":2808.68,"p":false,"h":false},{"t":"神はすべてを支配しておられ、私たちが知らないときにも働いておられます。","s":2808.936,"e":2814.276,"p":false,"h":false},{"t":"パウロは、なぜアジアが閉ざされたのかを知りませんでした。","s":2814.552,"e":2818.509,"p":false,"h":false},{"t":"なぜビティニアが閉ざされたのかを知りませんでした。","s":2818.692,"e":2821.844,"p":false,"h":false},{"t":"知らないまま歩いて行ったとき、マケドニアの扉が開かれました。","s":2822.112,"e":2826.617,"p":true,"h":false},{"t":"信者の道は、ほとんどの場合このようなものです。","s":2827.116,"e":2830.713,"p":false,"h":false},{"t":"私たちはすべての理由を知らないまま、聖書が語ることに従って歩き、閉ざされれば向きを変え、開かれれば入って行きます。","s":2830.932,"e":2840.058,"p":false,"h":false},{"t":"そして後になって振り返ると、閉ざされた扉も開かれた扉も、同じ御手が造られた道だったことを知ります。","s":2840.328,"e":2848.205,"p":false,"h":false},{"t":"この確信があれば、知らないことの前でも不安にならずに歩むことができます。","s":2848.464,"e":2854.032,"p":true,"h":false}]},{"title":"14.アテネでの説教は接点を見いだしたのか、それとも宣教なのか：アレオパゴスのパウロ","audio":"book_2610280719_2.mp3","start":2854.584,"end":3592.44,"dur":737.9,"segs":[{"t":"14.アテネでの説教は接点を見いだしたのか、それとも宣教なのか：アレオパゴスのパウロ","s":2854.584,"e":2861.59,"p":true,"h":false},{"t":"本文：使徒の働き17章16節から34節（一緒に読む本文：イザヤ書44章9節から20節、詩篇19篇1節から4節、使徒の働き14章15節から17節、ローマ人への手紙1章18節から25節、ローマ人への手紙2章14節から15節、コリント人への手紙第一2章1節から5節）","s":2862.036,"e":2890.265,"p":true,"h":false},{"t":"パウロの説教の中で最も多く研究されてきた説教は、アテネのアレオパゴスでの説教です。","s":2890.728,"e":2897.652,"p":false,"h":false},{"t":"旧約聖書の話が一つも出てこず、聞き手が哲学者たちである点で、ほかの説教とは異なります。","s":2897.964,"e":2905.558,"p":true,"h":false},{"t":"この説教をめぐって、教会の中では長い論争があります。","s":2906.1,"e":2910.255,"p":false,"h":false},{"t":"パウロはこの説教で、異邦人の宗教心をほめたのでしょうか、それとも罪に定めたのでしょうか。","s":2910.636,"e":2917.764,"p":false,"h":false},{"t":"そして、この説教を伝道の模範とすべきなのでしょうか、それとも失敗した説教の反面教師とすべきなのでしょうか。","s":2917.98,"e":2926.402,"p":false,"h":false},{"t":"この文章では、本文が語っているとおりに説教の構造をたどりながら、この問いに答えていきます。","s":2926.656,"e":2933.773,"p":true,"h":false},{"t":"パウロの最初の反応","s":2934.324,"e":2936.019,"p":true,"h":false},{"t":"この説教は、パウロの感情から始まります。","s":2936.448,"e":2939.723,"p":false,"h":false},{"t":"パウロはアテネで仲間たちを待っていたとき、町が偶像でいっぱいなのを見て、心に憤りを覚えたとあります（使徒の働き17章16節）。","s":2940.048,"e":2950.671,"p":false,"h":false},{"t":"この「憤り」という言葉は、心が激しく揺さぶられ、苦しむことを意味する強い言葉です。","s":2950.884,"e":2958.179,"p":false,"h":false},{"t":"これは見物する人の感想ではなく、心を刺し貫かれた人の反応です。","s":2958.444,"e":2963.929,"p":true,"h":false},{"t":"アテネは、哲学と学問と芸術の中心都市でした。","s":2964.456,"e":2968.75,"p":false,"h":false},{"t":"観光客だったなら、感嘆したであろう町です。","s":2968.956,"e":2972.278,"p":false,"h":false},{"t":"しかしパウロは、その町の美しさの中で、まず偶像を見ました。","s":2972.556,"e":2977.65,"p":false,"h":false},{"t":"これが説教の出発点です。","s":2977.848,"e":2979.923,"p":false,"h":false},{"t":"パウロはこの町と親しく交わろうとしたのではなく、この町の魂が神から離れていることを悲しみました。","s":2980.224,"e":2987.89,"p":true,"h":false},{"t":"それで、会堂ではユダヤ人や敬虔な人たちと、広場では毎日出会う人たちと論じ合いました。","s":2988.36,"e":2995.879,"p":false,"h":false},{"t":"エピクロス派とストア派の哲学者たちも彼と論じ合い、彼らはパウロをおしゃべり呼ばわりし、外国の神々を伝えている者だと言いました。","s":2996.1,"e":3006.042,"p":false,"h":false},{"t":"パウロが伝えていた内容が、イエスと復活だったからです（使徒の働き17章18節）。","s":3006.324,"e":3013.299,"p":false,"h":false},{"t":"そして彼らはパウロをアレオパゴスに連れて行き、その新しい教えが何なのか、知ることができるだろうかと尋ねます。","s":3013.524,"e":3021.958,"p":true,"h":false},{"t":"知られていない神","s":3022.488,"e":3023.844,"p":true,"h":false},{"t":"パウロは説教をこのように始めます。","s":3024.396,"e":3026.973,"p":false,"h":false},{"t":"「アテネの皆さん。","s":3027.24,"e":3028.426,"p":false,"h":false},{"t":"あなたがたは、あらゆる点で宗教心にあつい方々だと、私は見ております。」","s":3029.148,"e":3035.313,"p":false,"h":false},{"t":"そして、歩き回ってあなたがたの拝んでいるものを見ているうちに、「知られない神に」と刻まれた祭壇も見た、と言います。","s":3035.592,"e":3044.369,"p":false,"h":false},{"t":"ですから、あなたがたが知らずに拝んでいるものを、私があなたがたに知らせましょう、と言います（使徒の働き17章22節から23節）。","s":3044.736,"e":3055.522,"p":true,"h":false},{"t":"この導入部はしばしば、パウロが異教徒の宗教心を認め、それを接点とした証拠として読まれます。","s":3055.968,"e":3063.674,"p":false,"h":false},{"t":"しかし本文を詳しく見るなら、パウロがしているのは接触ではなく、指摘です。","s":3063.96,"e":3069.846,"p":false,"h":false},{"t":"あなたがたが知らずに拝んでいる、という言葉は、ほめ言葉ではなく診断です。","s":3070.08,"e":3075.591,"p":false,"h":false},{"t":"あなたがたは、自分たちが礼拝している対象が何なのかも知らずに礼拝している、ということです。","s":3075.84,"e":3082.865,"p":false,"h":false},{"t":"「知られない神に」と刻まれた祭壇は、彼らが自分たちの神々の一覧に確信を持てない余地があることを、自ら認めた証拠であり、パウロはその余地を用いて、まことの神を宣べ伝えます。","s":3083.112,"e":3097.752,"p":true,"h":false},{"t":"説教の順序","s":3098.304,"e":3099.601,"p":true,"h":false},{"t":"パウロの説教の順序は、注意して見るに値します。","s":3100.212,"e":3104.035,"p":false,"h":false},{"t":"彼は創造から始めます。","s":3104.28,"e":3106.11,"p":false,"h":false},{"t":"世界とその中にあるすべてのものを造られた神は、天地の主ですから、手で造られた宮にお住みにならず、何かに不足しているかのように、人の手によって仕えられる必要もない、と言います（使徒の働き17章24節から25節）。","s":3106.404,"e":3124.369,"p":false,"h":false},{"t":"これはユダヤ人なら誰もが同意する言葉ですが、アテネの哲学者や神殿を崇拝する人たちにとっては衝撃でした。","s":3124.584,"e":3132.985,"p":false,"h":false},{"t":"神々が人の供え物を食べて生きる、という考えを真っ向から退けているのです。","s":3133.188,"e":3139.133,"p":true,"h":false},{"t":"続いて、一人の人からあらゆる民族を造り出し、彼らの定められた時代と住む場所の境をお定めになった、と言います。","s":3139.668,"e":3148.625,"p":false,"h":false},{"t":"これは、人が神を求め、手探りで見いだすためだ、と言います（使徒の働き17章26節から27節）。","s":3148.92,"e":3157.877,"p":false,"h":false},{"t":"そして神は、私たち一人ひとりから遠く離れてはおられない、と言います。","s":3158.1,"e":3163.583,"p":true,"h":false},{"t":"この箇所でパウロは、彼らの詩人の言葉を引用します。","s":3164.148,"e":3168.213,"p":false,"h":false},{"t":"「私たちは神の中に生き、動き、存在している」という言葉と、「私たちもまたその子孫である」という言葉です（使徒の働き17章28節）。","s":3168.504,"e":3180.672,"p":false,"h":false},{"t":"この引用は、ストア派系統の詩人たちがゼウスについて語った言葉でした。","s":3180.888,"e":3186.283,"p":false,"h":false},{"t":"パウロはその言葉を、まことの神に適用しました。","s":3186.468,"e":3190.371,"p":false,"h":false},{"t":"これは詩人の神学を承認したのではありません。","s":3190.572,"e":3193.843,"p":false,"h":false},{"t":"パウロはその言葉を取り上げて、彼らの偶像礼拝に反論するために用います。","s":3194.028,"e":3199.943,"p":false,"h":false},{"t":"私たちが神の子孫であるなら、神を金や銀や石、つまり人間の技術によって刻まれたものと考えるのは、筋が通らないということです（使徒の働き17章29節）。","s":3200.22,"e":3213.899,"p":false,"h":false},{"t":"彼ら自身の口から出た言葉によって、彼らの偶像を打ち壊すのです。","s":3214.116,"e":3219.216,"p":true,"h":false},{"t":"この論法は、イザヤ書44章で、木で偶像を造り、その半分で火をたく人を風刺したみことばと、同じ流れにあります。","s":3219.732,"e":3229.381,"p":false,"h":false},{"t":"「イザヤ書を深く読む」をお聞きになった方なら、その風刺とこの説教がつながっていることに気づかれるでしょう。","s":3229.668,"e":3237.158,"p":true,"h":false},{"t":"悔い改めの宣言","s":3237.624,"e":3239.228,"p":true,"h":false},{"t":"その後に、説教の転換点が現れます。","s":3239.64,"e":3242.877,"p":false,"h":false},{"t":"神は、そのような無知の時代を見過ごしておられましたが、今は、どこででもすべての人に悔い改めを命じておられる、ということです（使徒の働き17章30節）。","s":3243.168,"e":3255.872,"p":false,"h":false},{"t":"それまで穏やかに続いてきた口調が、ここで変わります。","s":3256.056,"e":3259.989,"p":false,"h":false},{"t":"「今は」という言葉には、救済の歴史における転換が込められています。","s":3260.268,"e":3265.533,"p":false,"h":false},{"t":"キリストが来られた後は、知らなかったことは言い訳になりません。","s":3265.812,"e":3270.317,"p":true,"h":false},{"t":"その理由は、神が定めた方によって、義をもって全世界をさばく日をお決めになったからです。","s":3270.744,"e":3277.6,"p":false,"h":false},{"t":"そして、その方を死者の中からよみがえらせることによって、このことの確証をすべての人にお与えになった、と言います（使徒の働き17章31節）。","s":3277.836,"e":3289.52,"p":false,"h":false},{"t":"さばきと復活が、説教の頂点です。","s":3289.752,"e":3292.864,"p":false,"h":false},{"t":"パウロはここでイエスという名さえ口にしていませんが、復活された方がさばき主であることは明らかでした。","s":3293.1,"e":3300.447,"p":true,"h":false},{"t":"反応は分かれました。","s":3300.912,"e":3302.414,"p":false,"h":false},{"t":"復活という言葉を聞いて、ある者たちはあざ笑い、ある者たちは、このことについては、またいつか聞くことにしよう、と言いました（使徒の働き17章32節）。","s":3302.82,"e":3315.774,"p":false,"h":false},{"t":"パウロは彼らの中から出て行きます。","s":3315.96,"e":3318.4,"p":true,"h":false},{"t":"接点なのか、それとも宣教なのか","s":3318.912,"e":3321.93,"p":true,"h":false},{"t":"この説教をめぐる最も古い論争は、これです。","s":3322.368,"e":3326.021,"p":false,"h":false},{"t":"パウロは異教徒の宗教心や詩人の言葉の中に接点を見いだしたと考えるべきなのでしょうか、それとも最初から最後まで、異教の世界観を打ち壊す宣教だったと考えるべきなのでしょうか。","s":3326.292,"e":3340.555,"p":true,"h":false},{"t":"一方では、この説教を宣教の模範だと見ます。","s":3341.124,"e":3344.761,"p":false,"h":false},{"t":"パウロは聞き手が知っている言葉から始め、彼らの世界の中に福音へ至る道を造ったのだから、今日の伝道も文化との接点を見つけるべきだ、というのです。","s":3345.048,"e":3356.357,"p":false,"h":false},{"t":"もう一方では、パウロは接点のように見える言葉を用いながらも、それらすべてを創造主なる神を中心として、再定義したと見ます。","s":3356.64,"e":3366.505,"p":false,"h":false},{"t":"知られない神はまことの神ではなく、詩人の「子孫」という言葉は、偶像礼拝を罪に定める論証となりました。","s":3366.792,"e":3375.653,"p":true,"h":false},{"t":"本文は、二つ目の読み方を支持しています。","s":3376.116,"e":3379.412,"p":false,"h":false},{"t":"パウロの話し方は聞き手に合わせられていましたが、話の内容は聞き手の思想に従ってはいませんでした。","s":3379.68,"e":3387.168,"p":false,"h":false},{"t":"彼は聞き手の言葉を借りましたが、聞き手の世界観を認めたのではありません。","s":3387.348,"e":3392.846,"p":false,"h":false},{"t":"創造、さばき、復活、そして悔い改めという説教の骨格は、アテネの哲学にはないものでした。","s":3393.036,"e":3400.963,"p":false,"h":false},{"t":"ローマ人への手紙1章が語っていることも、これと同じです。","s":3401.172,"e":3405.587,"p":false,"h":false},{"t":"神の、目に見えない性質が被造物に現れて知られているので、人は弁解できないと言いながら、人はその真理を阻み、偶像へと変えた、と言います（ローマ人への手紙1章18節から23節）。","s":3405.852,"e":3421.688,"p":false,"h":false},{"t":"接点は、人がすでに神を知っているという事実ではなく、知っていながら拒んでいるという事実でした。","s":3421.908,"e":3429.258,"p":true,"h":false},{"t":"失敗した説教なのか","s":3429.72,"e":3431.548,"p":true,"h":false},{"t":"この説教の結果をめぐっては、もう一つの解釈があります。","s":3432.024,"e":3436.232,"p":false,"h":false},{"t":"この説教にはほとんど実りがなかったので、パウロは哲学を用いて失敗し、それゆえコリントでは、イエス・キリスト、しかも十字架につけられた方のほかには、何も知るまいと決心したのだ、という解釈です（コリント人への手紙第一2章2節）。","s":3436.524,"e":3455.426,"p":false,"h":false},{"t":"アテネからコリントへ行ったという順序が、この解釈を裏づけているように見えます。","s":3455.64,"e":3461.318,"p":true,"h":false},{"t":"しかし本文は、そのようには記していません。","s":3461.904,"e":3465.133,"p":false,"h":false},{"t":"ルカは、数人の者がパウロに付き従って信じ、その中にはアレオパゴスの議員ディオヌシオ、ダマリスという女、そしてほかの人々もいた、と記しています（使徒の働き17章34節）。","s":3465.324,"e":3480.715,"p":false,"h":false},{"t":"アレオパゴスの議会の一員が信じたことは、小さな結果ではありませんでした。","s":3480.912,"e":3486.521,"p":false,"h":false},{"t":"ルカはこの説教を、失敗談として記してはいません。","s":3486.708,"e":3490.666,"p":false,"h":false},{"t":"コリント人への手紙第一のみことばについても、アテネでの説教を後悔する言葉として読む根拠は、本文にはありません。","s":3490.92,"e":3499.983,"p":false,"h":false},{"t":"パウロはどこでも十字架のことばを中心に置いており、アテネでもその中心は、復活とさばきという形でありました。","s":3500.172,"e":3508.744,"p":true,"h":false},{"t":"今日の伝道者へ","s":3509.208,"e":3510.526,"p":true,"h":false},{"t":"この説教が今日の伝道に与える知恵は、これです。","s":3511.116,"e":3514.808,"p":false,"h":false},{"t":"福音を伝えるとき、相手の言葉と文化と問いを知ることは重要です。","s":3515.076,"e":3520.294,"p":false,"h":false},{"t":"パウロは彼らの町を歩き、彼らの祭壇を読み、彼らの詩人を知っていました。","s":3520.512,"e":3526.578,"p":false,"h":false},{"t":"相手を知らずにする伝道は、塀の向こうから叫ぶことに似ています。","s":3526.776,"e":3531.627,"p":true,"h":false},{"t":"しかし、言葉を合わせることと、内容を合わせることは別のことです。","s":3532.176,"e":3537.346,"p":false,"h":false},{"t":"アレオパゴスのパウロは言葉を合わせましたが、内容は合わせませんでした。","s":3537.612,"e":3542.903,"p":false,"h":false},{"t":"福音は、聞き手の必要に合わせて福音を変えるのではなく、聞き手の必要そのものを新たに定義します。","s":3543.084,"e":3550.861,"p":false,"h":false},{"t":"人々が望むものをまず与え、後から福音を与えるというやり方は、この本文にはありません。","s":3551.148,"e":3558.306,"p":true,"h":false},{"t":"そして最後に、福音の前で、ある人はあざ笑い、ある人は信じるということを受け入れなければなりません。","s":3558.744,"e":3566.727,"p":false,"h":false},{"t":"復活という言葉を聞いてアテネの哲学者たちが笑ったように、今日も同じ反応があります。","s":3566.916,"e":3573.389,"p":false,"h":false},{"t":"伝道者のなすべきことは、説得力のある話し方でその笑いに打ち勝つことではなく、神がさばきのために定め、復活させた方がおられることを、変わることなく宣べ伝えることです。","s":3573.684,"e":3586.954,"p":false,"h":false},{"t":"その宣教を通して、神は一人か二人の心を開かれます。","s":3587.22,"e":3591.904,"p":true,"h":false}]},{"title":"15.使徒時代のしるしと奇跡は、今日もあるのか――使徒の働きに記された力の物語をどう読むか","audio":"book_2610280719_2.mp3","start":3592.44,"end":4369.32,"dur":776.9,"segs":[{"t":"15.使徒時代のしるしと奇跡は、今日もあるのか――使徒の働きに記された力の物語をどう読むか","s":3592.44,"e":3600.181,"p":true,"h":false},{"t":"本文：使徒の働き3章1節から10節、5章12節から16節、14章3節、19章11節から20節（ともに読む本文：使徒の働き2章43節、8章6節から13節、コリント人への手紙第22章12節、ヘブル人への手紙2章3節から4節、テモテへの手紙第4章20節、テモテへの手紙第5章23節、ピリピ人への手紙2章25節から27節、マタイの福音書7章21節から23節、ヤコブの手紙5章14節から16節）","s":3600.612,"e":3642.645,"p":true,"h":false},{"t":"使徒の働きは、奇跡の書として読まれてきました。","s":3643.128,"e":3646.765,"p":false,"h":false},{"t":"足の不自由な人が立ち上がり、ペテロの影が病人を覆い、パウロの手ぬぐいが病を治し、死人が生き返ります。","s":3646.944,"e":3655.634,"p":false,"h":false},{"t":"ですから、今日の教会がこのように問うのは当然です。","s":3655.908,"e":3659.87,"p":false,"h":false},{"t":"なぜ、このようなことが今日ではこれほど少ないのでしょうか。","s":3660.12,"e":3664.274,"p":false,"h":false},{"t":"私たちの信仰が足りないからでしょうか、それとも、このようなことの時代は過ぎ去ったからでしょうか。","s":3664.512,"e":3671.538,"p":true,"h":false},{"t":"この問いは、教会の中で最も大きな傷と論争を生んできた問題の一つです。","s":3672,"e":3677.89,"p":false,"h":false},{"t":"この文章では、どちらか一方の立場に肩入れする前に、使徒の働きがこれらの奇跡をどのように記しているのかを、まず見ていきます。","s":3678.156,"e":3688.065,"p":true,"h":false},{"t":"だれが行ったのか","s":3688.56,"e":3689.749,"p":true,"h":false},{"t":"使徒の働きのしるしと不思議を注意深く読むと、一つの事実が目に留まります。","s":3690.468,"e":3696.33,"p":false,"h":false},{"t":"ほとんどの奇跡が、使徒たちとその同労者たちの手によって起こっているということです。","s":3696.624,"e":3702.399,"p":false,"h":false},{"t":"多くの不思議としるしが、使徒たちを通して行われたとあります（使徒の働き2章43節）。","s":3702.636,"e":3710.151,"p":false,"h":false},{"t":"使徒たちの手によって、多くのしるしと不思議が民の間で行われたとあります（使徒の働き5章12節）。","s":3710.376,"e":3718.438,"p":false,"h":false},{"t":"パウロとバルナバがイコニオンに長く滞在し、主によって大胆に語っていたとき、主はしるしと不思議を彼らの手によって行わせ、恵みのみことばを証しされたとあります（使徒の働き14章3節）。","s":3718.656,"e":3733.405,"p":true,"h":false},{"t":"奇跡は、使徒ではない人を通しても起こります。","s":3733.884,"e":3737.106,"p":false,"h":false},{"t":"執事ステパノとピリポがそうです。","s":3737.376,"e":3739.587,"p":false,"h":false},{"t":"しかし、彼らは使徒たちが按手して立てた人々であり（使徒の働き6章6節）、ピリポによるサマリアでの奇跡は使徒たちの確認を経ました。","s":3739.824,"e":3750.658,"p":false,"h":false},{"t":"ダマスコの弟子アナニアがサウロに手を置いて目を見えるようにした出来事のように、使徒ではない人が用いられた場面もあります。","s":3750.84,"e":3759.066,"p":false,"h":false},{"t":"しかし、それも主が幻によって直接彼を遣わされた特別な場合でした（使徒の働き9章10節から18節）。","s":3759.336,"e":3768.821,"p":false,"h":false},{"t":"一般の信者が日常的にしるしを行う姿は、使徒の働きには出てきません。","s":3769.056,"e":3775.135,"p":false,"h":false},{"t":"ルカはこれらの奇跡を、使徒的な証しと結び付けて記しています。","s":3775.32,"e":3780.047,"p":true,"h":false},{"t":"奇跡の目的","s":3780.576,"e":3781.869,"p":true,"h":false},{"t":"これらの奇跡が何のために起こったのかも、本文は語っています。","s":3782.484,"e":3786.961,"p":false,"h":false},{"t":"14章3節は、しるしと不思議が、その恵みのみことばを証ししたものだと述べています。","s":3787.344,"e":3794.077,"p":false,"h":false},{"t":"奇跡は、みことばの保証でした。","s":3794.364,"e":3796.888,"p":true,"h":false},{"t":"3章で、ペテロとヨハネが神殿の美しの門の前で足の不自由な人を立ち上がらせた出来事を見てください。","s":3797.352,"e":3805.66,"p":false,"h":false},{"t":"人々が驚いて駆け寄って来ると、ペテロはただちに説教します。","s":3805.812,"e":3810.559,"p":false,"h":false},{"t":"なぜこのことを不思議に思うのか、私たちが自分自身の力や敬虔によってこの人を歩かせたかのように、なぜ私たちを見つめるのかと問い、この人がイエスの御名を信じる信仰によって癒やされたのだと語ります（使徒の働き3章12節から16節）。","s":3810.816,"e":3829.641,"p":false,"h":false},{"t":"そして、その説教は悔い改めなさいという招きへと続きます（使徒の働き3章19節）。","s":3829.824,"e":3837.441,"p":false,"h":false},{"t":"奇跡はそれ自体で終わるのではなく、ただちにイエスを指し示す指となりました。","s":3837.672,"e":3843.424,"p":true,"h":false},{"t":"新約聖書は、この点を明確にしています。","s":3843.864,"e":3847.214,"p":false,"h":false},{"t":"ヘブル人への手紙は、救いについてのことばが初めに主によって語られ、それを聞いた人々が私たちに確かなものとしてくれたものであり、神もまた、しるしと不思議、様々な力あるわざ、そしてご自身のみこころにしたがって聖霊を分け与えることによって、彼らとともに証しされたと述べています（ヘブル人への手紙2章3節から4節）。","s":3847.5,"e":3872.62,"p":false,"h":false},{"t":"パウロは自分の使徒職を弁明し、使徒としてのしるし、すなわち、しるしと不思議と力あるわざが、あなたがたの間で行われたと語っています（コリント人への手紙第22章12節）。","s":3872.844,"e":3886.913,"p":false,"h":false},{"t":"奇跡が使徒の信任状の役割を果たしたということです。","s":3887.1,"e":3890.94,"p":true,"h":false},{"t":"すべての病が治ったわけではない","s":3891.456,"e":3893.958,"p":true,"h":false},{"t":"使徒の働きの奇跡を読むとき、見落としやすい事実があります。","s":3894.408,"e":3899.035,"p":false,"h":false},{"t":"使徒時代にも、すべての病がただちに治ったわけではないということです。","s":3899.304,"e":3904.354,"p":true,"h":false},{"t":"パウロは、自分の同労者トロフィモを病気のままミレトに残して来たと語っています（テモテへの手紙第4章20節）。","s":3904.884,"e":3913.479,"p":false,"h":false},{"t":"テモテには、度々起こる病のために、少量のぶどう酒を用いるよう勧めています（テモテへの手紙第5章23節）。","s":3913.668,"e":3923.02,"p":false,"h":false},{"t":"エパフロディトは病気になり、死ぬほどでしたが、神が彼をあわれんでくださって癒やされたとあります（ピリピ人への手紙2章26節から27節）。","s":3923.208,"e":3934.304,"p":false,"h":false},{"t":"パウロ自身には肉体のとげがあり、三度も主に願いましたが、主は「わたしの恵みはあなたに十分である」と言われました（コリント人への手紙第22章7節から9節）。","s":3934.512,"e":3948.041,"p":true,"h":false},{"t":"死人をも生き返らせたパウロが、病んでいる同労者を癒やすことはできませんでした。","s":3948.516,"e":3954.146,"p":false,"h":false},{"t":"これは、奇跡が使徒の意思にかかっている力ではなく、神のみこころにしたがって起こる出来事であったことを示しています。","s":3954.348,"e":3962.619,"p":false,"h":false},{"t":"奇跡は、いつでも取り出して使える権能ではありませんでした。","s":3962.916,"e":3967.23,"p":true,"h":false},{"t":"ペテロの影とパウロの手ぬぐい","s":3967.668,"e":3969.897,"p":true,"h":false},{"t":"二つの場面は、特に注意して読まなければなりません。","s":3970.332,"e":3974.318,"p":false,"h":false},{"t":"人々が病人を大通りに運び出し、せめてペテロが通りかかるときには、その影でもだれかにかかるようにと願ったとあります（使徒の働き5章15節）。","s":3974.508,"e":3986.098,"p":false,"h":false},{"t":"また、パウロの身につけていた手ぬぐいや前掛けを持って行って病人に当てると、病気は去り、悪霊も出て行ったとあります（使徒の働き19章12節）。","s":3986.352,"e":3997.75,"p":true,"h":false},{"t":"これらの場面を根拠に、何らかの物や人に力が宿っていたと教えることは、本文を大きく誤解することです。","s":3998.196,"e":4006.463,"p":false,"h":false},{"t":"まず本文は、ペテロの影が病気を治したとは語っていません。","s":4006.728,"e":4011.494,"p":false,"h":false},{"t":"人々がそのように願ったとだけ語っています。","s":4011.696,"e":4014.655,"p":false,"h":false},{"t":"パウロの手ぬぐいについて、ルカはこのように説明しています。","s":4014.936,"e":4019.088,"p":false,"h":false},{"t":"神がパウロの手によって、並外れた奇跡を行われたということです（使徒の働き19章11節）。","s":4019.364,"e":4027.173,"p":false,"h":false},{"t":"ルカはそれを並外れた奇跡と呼び、普通の出来事ではなく特別な出来事であることを、自ら明らかにしています。","s":4027.392,"e":4035.822,"p":true,"h":false},{"t":"そして、そのすぐ後に続く物語が、この点を明確にしています。","s":4036.392,"e":4041.569,"p":false,"h":false},{"t":"ユダヤ人の魔術師スケワの七人の息子たちが、イエスの名を呪文のように使って悪霊を追い出そうとしましたが、悪霊につかれた人に打ち負かされ、傷を負って裸のまま逃げ出しました（使徒の働き19章13節から16節）。","s":4041.828,"e":4059.207,"p":false,"h":false},{"t":"イエスの名は、人が使う道具ではありませんでした。","s":4059.432,"e":4063.023,"p":false,"h":false},{"t":"そしてこの出来事によって、エペソの人々は恐れを抱き、主イエスの御名を大いにあがめ、多くの魔術を行っていた人たちが本を集めて焼き捨てましたが、その値段は銀貨五万枚だったとあります（使徒の働き19章17節から19節）。","s":4063.248,"e":4081.874,"p":false,"h":false},{"t":"力の結果は、不思議な物を崇拝することではなく、魔術を捨て、神の御名があがめられることでした。","s":4082.112,"e":4089.597,"p":true,"h":false},{"t":"今日の教会はどのように読むのか","s":4090.032,"e":4092.484,"p":true,"h":false},{"t":"この問題において、教会は大きく二つの立場に分かれています。","s":4092.912,"e":4097.71,"p":true,"h":false},{"t":"一つは、使徒的なしるしは使徒時代に限られていたという立場です。","s":4098.348,"e":4103.32,"p":false,"h":false},{"t":"この立場は、奇跡が使徒たちの語るみことばが神から来たものであることを確証する役割を果たし、新約聖書が完成した後には、この役割が聖書そのものによって置き換えられたと見ます。","s":4103.568,"e":4117.295,"p":false,"h":false},{"t":"改革派の伝統のかなり多くは、この立場に立っています。","s":4117.572,"e":4121.688,"p":true,"h":false},{"t":"もう一つは、神が今日も使徒時代と同じような仕方でしるしを行われるという立場です。","s":4122.252,"e":4128.529,"p":false,"h":false},{"t":"この立場は、使徒の働きとコリント人への手紙第一にある賜物が廃止されたという根拠は、聖書にはないと見ます。","s":4128.804,"e":4137.394,"p":false,"h":false},{"t":"ペンテコステ派やカリスマ派の教会だけでなく、改革派の中にもこの立場を支持する人がいます。","s":4137.66,"e":4144.562,"p":true,"h":false},{"t":"この文章は、第一の立場から読みます。","s":4145.076,"e":4148.148,"p":false,"h":false},{"t":"これまで見てきた理由によるものです。","s":4148.424,"e":4150.744,"p":false,"h":false},{"t":"奇跡は使徒たちと結び付いて現れ、その目的はみことばの証しであり、一般の信者が行う標準的な仕方としては記されておらず、使徒時代にもすべての病がただちに治ったわけではありませんでした。","s":4151.124,"e":4166.365,"p":false,"h":false},{"t":"しかし、この立場においても明確にしなければならないことがあります。","s":4166.568,"e":4171.333,"p":false,"h":false},{"t":"神が今日、病を癒やし、奇跡を行うことがおできになるのを否定するのではありません。","s":4171.608,"e":4178.085,"p":false,"h":false},{"t":"神はいつでも全能です。","s":4178.268,"e":4180.052,"p":false,"h":false},{"t":"ヤコブの手紙は、病気の人がいるなら、教会の長老たちを招き、主の御名によって油を塗って祈ってもらうようにと語り、信仰による祈りは病人を救うと述べています（ヤコブの手紙5章14節から15節）。","s":4180.32,"e":4196.53,"p":false,"h":false},{"t":"神は祈りに答えて、病を癒やされます。","s":4196.736,"e":4199.928,"p":false,"h":false},{"t":"ただし、これは使徒時代のしるしが、今日の信者の標準であるという意味ではありません。","s":4200.192,"e":4206.513,"p":true,"h":false},{"t":"奇跡を判断する基準","s":4206.924,"e":4208.823,"p":true,"h":false},{"t":"奇跡をどのように見分けるべきかという問いも残ります。","s":4209.228,"e":4212.818,"p":false,"h":false},{"t":"聖書は、奇跡が起こったという事実だけで、その出来事が神から出たものだとは見ません。","s":4213.08,"e":4219.642,"p":false,"h":false},{"t":"申命記は、預言者がしるしや不思議を見せながら、ほかの神々に従おうと言うなら、そのことばに聞き従ってはならないと語っています（申命記13章1節から3節）。","s":4219.812,"e":4232.859,"p":false,"h":false},{"t":"イエスも、その日に多くの人が、「主よ、主よ。","s":4233.06,"e":4236.827,"p":false,"h":false},{"t":"私たちはあなたの名によって預言し、あなたの名によって悪霊を追い出し、あなたの名によって多くの奇跡を行ったではありませんか」と言ったとしても、「わたしはあなたがたを知らない」と言われるだろうと語られました（マタイの福音書7章22節から23節）。","s":4237.02,"e":4256.3,"p":true,"h":false},{"t":"奇跡はみことばの証拠となることはあっても、みことばの上に立つ権威となることはできません。","s":4256.748,"e":4263.184,"p":false,"h":false},{"t":"ある出来事が奇跡のように見えるからといって、それを語る人の教えが正しいことにはなりません。","s":4263.372,"e":4270.27,"p":false,"h":false},{"t":"判断はいつでも、聖書が教える福音と一致しているかどうかにあります。","s":4270.464,"e":4275.589,"p":true,"h":false},{"t":"苦しみの中にいる信者へ","s":4276.152,"e":4278.079,"p":true,"h":false},{"t":"この文章を読んでいる人の中には、病のために切に祈り続けてきたにもかかわらず、癒やされていない人がいるでしょう。","s":4278.528,"e":4287.228,"p":false,"h":false},{"t":"そしてだれかから、信仰が足りないから癒やされないのだと言われたことがあるかもしれません。","s":4287.456,"e":4293.379,"p":true,"h":false},{"t":"使徒の働きは、そのことばを裏付けていません。","s":4293.828,"e":4297.255,"p":false,"h":false},{"t":"パウロのとげが癒やされなかったのは信仰が足りなかったからではなく、トロフィモが病のまま残されたことも同じでした。","s":4297.428,"e":4305.589,"p":false,"h":false},{"t":"主はパウロに、「わたしの恵みはあなたに十分である」と言われ、「わたしの力は弱さのうちに完全に現れる」と言われました（コリント人への手紙第22章9節）。","s":4305.78,"e":4318.827,"p":false,"h":false},{"t":"病が癒やされることも恵みであり、癒やされない中で支えられることも恵みです。","s":4319.028,"e":4324.706,"p":false,"h":false},{"t":"信者の信仰とは、病が癒やされるという約束にすがることではなく、病の中でも私を支えてくださるキリストにすがることです。","s":4324.968,"e":4334.527,"p":true,"h":false},{"t":"しるしを求める心がどこから来るのかも、調べる必要があります。","s":4335.048,"e":4339.857,"p":false,"h":false},{"t":"主は、悪い、姦淫の時代がしるしを求めると言われました（マタイの福音書12章39節）。","s":4340.232,"e":4347.891,"p":false,"h":false},{"t":"私たちが本当に求めるべきものは、しるしではなく、しるしが指し示すお方です。","s":4348.08,"e":4354.292,"p":false,"h":false},{"t":"使徒の働きのすべての奇跡は、一つのところを指し示していました。","s":4354.524,"e":4359.46,"p":false,"h":false},{"t":"よみがえられたイエスが生きておられ、治めておられるという事実です。","s":4359.672,"e":4364.417,"p":false,"h":false},{"t":"奇跡を見ても見なくても、その事実が信者の希望です。","s":4364.676,"e":4368.813,"p":true,"h":false}]},{"title":"16.裁判を受けるパウロと、開かれたままの結末は何を語っているのか――使徒の働きの最後の8章","audio":"book_2610280719_2.mp3","start":4369.32,"end":5215.428,"dur":846.1,"segs":[{"t":"16.裁判を受けるパウロと、開かれたままの結末は何を語っているのか――使徒の働きの最後の8章","s":4369.32,"e":4377.64,"p":true,"h":false},{"t":"本文：使徒の働き21章27節から28章31節（ともに読む本文：使徒の働き9章15節から16節、使徒の働き23章11節、使徒の働き27章23節から24節、ピリピ人への手紙1章12節から14節、エペソ人への手紙6章19節から20節、テモテへの手紙第4章6節から8節）","s":4378.104,"e":4407.839,"p":true,"h":false},{"t":"使徒の働きを最後まで読んだ読者は、不思議な事実に驚きます。","s":4408.308,"e":4413.114,"p":false,"h":false},{"t":"この書の最後の8章の大部分が、パウロが捕らえられ、裁判を受け、牢に入れられている話だということです。","s":4413.384,"e":4421.472,"p":false,"h":false},{"t":"28章のうち、ほぼ四分の一です。","s":4421.736,"e":4424.921,"p":true,"h":false},{"t":"福音が地の果てまで広がっていく話を期待していた読者は、この部分で戸惑いやすいでしょう。","s":4425.408,"e":4431.868,"p":false,"h":false},{"t":"伝道旅行もなく、教会の開拓もほとんどありません。","s":4432.068,"e":4436.316,"p":false,"h":false},{"t":"その代わりに出てくるのは、法廷と牢と嵐と船です。","s":4436.496,"e":4440.597,"p":false,"h":false},{"t":"しかも、この書は結論もなく終わります。","s":4440.852,"e":4443.882,"p":false,"h":false},{"t":"パウロの裁判がどうなったのかを教えてくれません。","s":4444.128,"e":4447.405,"p":true,"h":false},{"t":"この文章では、ルカがなぜこの話をこれほど長く記録したのか、そしてなぜこのような形で書を閉じたのかを見ていきます。","s":4447.836,"e":4456.769,"p":false,"h":false},{"t":"この最後の部分を理解すると、使徒の働き全体がもう一度読めるようになります。","s":4457.088,"e":4463.136,"p":true,"h":false},{"t":"逮捕から護送まで","s":4463.64,"e":4465.084,"p":true,"h":false},{"t":"まず、出来事の流れを簡単にたどってみましょう。","s":4465.548,"e":4469.149,"p":false,"h":false},{"t":"パウロはエルサレムに上り、神殿でアジアから来たユダヤ人たちに捕らえられ、騒動の中でローマの千人隊長に救い出されて兵営へ連れて行かれます（使徒の働き21章27節から36節）。","s":4469.364,"e":4484.694,"p":false,"h":false},{"t":"群衆の前で、自分がどのように主に出会ったのかを弁明しますが、異邦人のもとへ遣わされたという言葉に、群衆は再び激しく怒ります（使徒の働き22章）。","s":4484.916,"e":4497.868,"p":false,"h":false},{"t":"最高法院の前では、パリサイ人とサドカイ人の間に分裂が起こり、また騒動になります（使徒の働き23章）。","s":4498.056,"e":4507.537,"p":true,"h":false},{"t":"その夜、主がパウロのそばに立って言われます。","s":4507.992,"e":4511.27,"p":false,"h":false},{"t":"「勇気を出しなさい。","s":4511.52,"e":4512.877,"p":false,"h":false},{"t":"あなたがエルサレムで、わたしのことをあかししたように、ローマでもあかししなければならない」（使徒の働き23章11節）。","s":4513.428,"e":4522.77,"p":false,"h":false},{"t":"この一言が、これらすべての場面を導く鍵です。","s":4522.968,"e":4526.82,"p":false,"h":false},{"t":"パウロが経験するすべてのことは、この約束に向かって進んでいました。","s":4527.108,"e":4532.154,"p":true,"h":false},{"t":"四十人余りがパウロを殺すと誓う陰謀が明らかになり、パウロはカイサリアへ護送されて総督ペリクスの前に立ちます（使徒の働き24章）。","s":4532.58,"e":4543.532,"p":false,"h":false},{"t":"ペリクスは決定を延ばし、二年間パウロを拘束しておきます。","s":4543.74,"e":4548.237,"p":false,"h":false},{"t":"新しい総督フェストが来ると、パウロは皇帝に上訴します（使徒の働き25章11節）。","s":4548.528,"e":4555.982,"p":false,"h":false},{"t":"その間にアグリッパ王が来て、パウロの話を聞く席に着きます（使徒の働き26章）。","s":4556.196,"e":4563.06,"p":false,"h":false},{"t":"そしてパウロは囚人となって船に乗せられ、ローマへ向かいます。","s":4563.252,"e":4567.772,"p":true,"h":false},{"t":"三度の弁明が語ること","s":4568.292,"e":4570.274,"p":true,"h":false},{"t":"パウロの弁明は、三度にわたって長く記録されています。","s":4570.74,"e":4574.84,"p":false,"h":false},{"t":"群衆の前での弁明（使徒の働き22章）、総督ペリクスの前での弁明（使徒の働き24章）、そしてアグリッパ王の前での弁明（使徒の働き26章）です。","s":4575.096,"e":4588.8,"p":false,"h":false},{"t":"それぞれ異なる聴衆に異なる仕方で語っていますが、中心は一つです。","s":4589.028,"e":4594.539,"p":false,"h":false},{"t":"復活の望みのために、私は裁かれているということです（使徒の働き23章6節、24章21節、26章6節から8節）。","s":4594.788,"e":4606.667,"p":true,"h":false},{"t":"そして、ローマの役人たちの判断は一貫していました。","s":4607.136,"e":4611.339,"p":false,"h":false},{"t":"千人隊長は、この人が死や拘束に値することは何一つしていないと言いました（使徒の働き23章29節）。","s":4611.528,"e":4621.113,"p":false,"h":false},{"t":"フェストも、死に値することは何もしていないと言いました（使徒の働き25章25節）。","s":4621.32,"e":4628.409,"p":false,"h":false},{"t":"アグリッパ王は、この人が皇帝に上訴していなかったなら、釈放されただろうと言いました（使徒の働き26章32節）。","s":4628.592,"e":4638.138,"p":true,"h":false},{"t":"ルカがこれらの判決を記録する理由は明らかです。","s":4638.6,"e":4642.223,"p":false,"h":false},{"t":"福音は、ローマ法に反する反乱ではないということです。","s":4642.488,"e":4646.613,"p":false,"h":false},{"t":"それは、教会がローマ帝国の中で正当に存在できることの弁証でもあります。","s":4646.88,"e":4652.852,"p":false,"h":false},{"t":"しかし、この点がこの話のすべてではありません。","s":4653.18,"e":4656.866,"p":false,"h":false},{"t":"もっと深い意味があります。","s":4657.068,"e":4658.871,"p":true,"h":false},{"t":"主がなさった約束の成就","s":4659.372,"e":4661.485,"p":true,"h":false},{"t":"パウロが初めて召しを受けたとき、主はアナニアにこのように言われました。","s":4661.928,"e":4667.179,"p":false,"h":false},{"t":"「あの人は、わたしの名を異邦人、王たち、イスラエルの子らの前に運ぶ、わたしの選びの器です」（使徒の働き9章15節）。","s":4667.364,"e":4677.649,"p":false,"h":false},{"t":"王たちの前で伝えるというみことばが、ここで実現します。","s":4677.84,"e":4682.045,"p":false,"h":false},{"t":"ペリクスとフェスト、そしてアグリッパ王の前で、パウロは神の福音を証しします。","s":4682.34,"e":4688.605,"p":false,"h":false},{"t":"そして、皇帝の前に立つという約束（使徒の働き27章24節）が、船の上で今一度確かめられます。","s":4688.856,"e":4697.915,"p":true,"h":false},{"t":"また主は、このように言われました。","s":4698.468,"e":4700.845,"p":false,"h":false},{"t":"「彼がわたしの名のために、どんなに多くの苦しみを受けなければならないかを、わたしは彼に示します」（使徒の働き9章16節）。","s":4701.024,"e":4710.946,"p":false,"h":false},{"t":"牢と裁判と鎖は、この約束の成就です。","s":4711.14,"e":4714.753,"p":false,"h":false},{"t":"パウロに起こったことは、神の計画が中断されたのではなく、計画どおりに進んでいたのです。","s":4714.992,"e":4721.97,"p":false,"h":false},{"t":"彼は自由に伝道旅行をしていた時にも、鎖につながれて護送されていた時にも、主の器でした。","s":4722.192,"e":4729.68,"p":true,"h":false},{"t":"嵐の中の約束","s":4730.148,"e":4731.803,"p":true,"h":false},{"t":"27章は、物語全体の中で最も劇的な場面です。","s":4732.236,"e":4737.223,"p":false,"h":false},{"t":"ローマへ向かう船はユーラクロンという暴風に遭い、何日も太陽も星も見えず、激しい嵐が続いたため、助かる望みさえ失われたとあります（使徒の働き27章20節）。","s":4737.456,"e":4751.523,"p":false,"h":false},{"t":"皆が絶望したその時、パウロが立ち上がって語ります。","s":4751.748,"e":4755.942,"p":false,"h":false},{"t":"神の御使いが昨夜、私のそばに立って、「パウロよ、恐れることはありません。","s":4756.212,"e":4762.203,"p":false,"h":false},{"t":"あなたは必ずカイサルの前に立ちます。","s":4762.404,"e":4764.968,"p":false,"h":false},{"t":"見なさい。","s":4765.284,"e":4765.98,"p":false,"h":false},{"t":"神は、あなたと同船している人たちをみな、あなたに与えておられます」と言われた、というのです（使徒の働き27章23節から24節）。","s":4766.148,"e":4777.826,"p":true,"h":false},{"t":"ここで目を引くのは、囚人が船にいるすべての人を安心させる立場に立っていることです。","s":4778.28,"e":4784.589,"p":false,"h":false},{"t":"この船の指揮を執るのは船長と百人隊長ですが、実際に船を導いているのは、神の約束を受けた囚人です。","s":4784.904,"e":4793.703,"p":false,"h":false},{"t":"そして結果は、約束どおりです。","s":4793.94,"e":4796.402,"p":false,"h":false},{"t":"船は難破して壊れましたが、船に乗っていた二百七十六人は皆、無事に救われます（使徒の働き27章37節、44節）。","s":4796.64,"e":4808.117,"p":true,"h":false},{"t":"ルカはこの章で、救われるという言葉を何度も繰り返します。","s":4808.556,"e":4813.059,"p":false,"h":false},{"t":"助かる望みが失われたという言葉で始まり（使徒の働き27章20節）、「あの人たちが船にとどまっていなければ、あなたがたは助かりません」という言葉を経て（使徒の働き27章31節）、皆が救われたという言葉で終わります。","s":4813.38,"e":4832.116,"p":false,"h":false},{"t":"肉体の命が救われる話ですが、ルカが同じ言葉をこれほど繰り返すことには意図があるように思われます。","s":4832.46,"e":4840.225,"p":false,"h":false},{"t":"神の約束は、嵐と難破を通っても取り消されないことを示す話だからです。","s":4840.56,"e":4846.502,"p":true,"h":false},{"t":"マルタでは、パウロは毒蛇にかまれても害を受けなかったので、島の人々は彼を神だと言ったとあります（使徒の働き28章3節から6節）。","s":4847.004,"e":4858.446,"p":false,"h":false},{"t":"続いて、パウロが島の首長プブリウスの父をはじめ、病気の人々を癒やす場面が出てきますが（使徒の働き28章7節から9節）、囚人として閉じ込められた身であっても、福音の道が開かれることを示しています。","s":4858.632,"e":4875.469,"p":true,"h":false},{"t":"ローマに到着した囚人","s":4876.02,"e":4878.078,"p":true,"h":false},{"t":"パウロがついにローマの近くまで来ると、その知らせを聞いたローマの兄弟たちが、アピウスの市場とトレス・タベルネまで迎えに来ます。","s":4878.54,"e":4888.149,"p":false,"h":false},{"t":"パウロは彼らを見て神に感謝し、勇気を得たとあります（使徒の働き28章15節）。","s":4888.476,"e":4895.624,"p":false,"h":false},{"t":"囚人として護送されて来ながらも、兄弟たちに会うと力を得るパウロの姿は、人間味があります。","s":4895.856,"e":4903.293,"p":true,"h":false},{"t":"そして、この書はこのように終わります。","s":4903.848,"e":4906.529,"p":false,"h":false},{"t":"パウロは、まる二年の間、自分の借りた家に住んで、訪ねて来る人たちをみな迎え入れ、少しも妨げられることなく、神の国を宣べ伝え、主イエス・キリストのことを教えた（使徒の働き28章30節から31節）。","s":4906.8,"e":4924.944,"p":true,"h":false},{"t":"開かれたままの結末","s":4925.412,"e":4927.266,"p":true,"h":false},{"t":"この結末は、読者に疑問を残します。","s":4927.716,"e":4930.888,"p":false,"h":false},{"t":"パウロの裁判はどうなったのでしょうか。","s":4931.172,"e":4933.694,"p":false,"h":false},{"t":"彼は釈放されたのでしょうか、それとも殉教したのでしょうか。","s":4933.908,"e":4938.224,"p":false,"h":false},{"t":"ルカはなぜ語らなかったのでしょうか。","s":4938.48,"e":4940.861,"p":true,"h":false},{"t":"さまざまな説明が提示されてきました。","s":4941.324,"e":4944.028,"p":false,"h":false},{"t":"ルカがこの書を書いた時には裁判がまだ終わっていなかったという説明、ルカが物語を続ける第三の書を構想していたという説明、ルカが意図的に開かれた結末を選んだという説明があります。","s":4944.24,"e":4958.348,"p":false,"h":false},{"t":"本文だけで確定することはできません。","s":4958.64,"e":4961.385,"p":true,"h":false},{"t":"しかし、この書の構造から読み取れることがあります。","s":4961.844,"e":4965.566,"p":false,"h":false},{"t":"使徒の働きは1章1節で、イエスが行い、教え始められたすべてのことについて書いた書だと言っています。","s":4965.804,"e":4973.891,"p":false,"h":false},{"t":"始められた働きと言っているのですから、その働きはまだ終わっていないという意味です。","s":4974.156,"e":4980.07,"p":false,"h":false},{"t":"この書の最後の言葉は、「少しも妨げられることなく」です。","s":4980.312,"e":4984.698,"p":false,"h":false},{"t":"この言葉は、妨げられずに、という意味を持つ言葉です。","s":4984.956,"e":4989.421,"p":false,"h":false},{"t":"パウロは鎖につながれたが、福音はつながれなかった、というのが最後の宣言です。","s":4989.708,"e":4996.106,"p":true,"h":false},{"t":"ですからこの結末は、パウロの物語が終わっていないという意味ではなく、福音の物語が終わっていないという意味として読まれます。","s":4996.62,"e":5005.828,"p":false,"h":false},{"t":"昇天された主が天において聖霊によって働かれる物語は、28章で閉じず、読者の時代へと続いていきます。","s":5006.088,"e":5015.018,"p":true,"h":false},{"t":"パウロの最期は、後の別の手紙からうかがうことができます。","s":5015.52,"e":5019.703,"p":false,"h":false},{"t":"テモテへの手紙第二で、パウロは自分がすでに注ぎのささげ物となっており、世を去る時が近づいたと言っています（テモテへの手紙第4章6節）。","s":5020.02,"e":5030.997,"p":false,"h":false},{"t":"使徒の働きは、パウロの死を記録していません。","s":5031.252,"e":5034.753,"p":false,"h":false},{"t":"使徒の働きの主人公は、初めからパウロではなかったからです。","s":5034.924,"e":5039.509,"p":true,"h":false},{"t":"牢が奉仕の場となる","s":5040,"e":5041.657,"p":true,"h":false},{"t":"この最後の部分で、もう一つ付け加えたいことがあります。","s":5042.088,"e":5046.088,"p":false,"h":false},{"t":"パウロがローマで捕らえられていた時期に書かれたものとして、伝統的に知られている手紙があります。","s":5046.408,"e":5052.819,"p":false,"h":false},{"t":"ピリピ人への手紙、エペソ人への手紙、コロサイ人への手紙、ピレモンへの手紙です。","s":5053.068,"e":5059.752,"p":false,"h":false},{"t":"新約聖書の最も深い神学の一部が、牢の中で書かれたのです。","s":5060.016,"e":5065.131,"p":true,"h":false},{"t":"ピリピ人への手紙で、パウロはこのように書いています。","s":5065.668,"e":5069.406,"p":false,"h":false},{"t":"「私に起こったことが、かえって福音の前進に役立ったことを、兄弟たち、知ってほしいのです」（ピリピ人への手紙1章12節）。","s":5069.7,"e":5079.736,"p":false,"h":false},{"t":"牢に入れられたことによって、近衛兵全体とほかのすべての人々に、私がキリストのために鎖につながれていることが知られ、兄弟たちの多くが私の投獄によって主にあって確信を得て、ますます大胆にみことばを語るようになった、と言っています（ピリピ人への手紙1章13節から14節）。","s":5079.96,"e":5102.66,"p":false,"h":false},{"t":"エペソ人への手紙でも、鎖につながれた使節となったが、大胆に福音の奥義を知らせることができるようにと願っている、と語っています（エペソ人への手紙6章19節から20節）。","s":5102.856,"e":5116.822,"p":true,"h":false},{"t":"使徒の働きの最後の8章は、一人の人が閉じ込められる話ではなく、閉じ込められた所でも福音が力強く働く話です。","s":5117.256,"e":5127.104,"p":false,"h":false},{"t":"神はパウロをローマへ送るために、裁判を用い、船を用い、嵐を用い、鎖を用いられました。","s":5127.444,"e":5135.548,"p":false,"h":false},{"t":"人の目には挫折に見えるすべてのことが、神の御手の中では道でした。","s":5135.796,"e":5141.015,"p":true,"h":false},{"t":"キリスト者が苦しみの中で読むべきこと","s":5141.448,"e":5144.291,"p":true,"h":false},{"t":"この話が信者に与える慰めは、これです。","s":5144.724,"e":5148.164,"p":false,"h":false},{"t":"私たちの人生にも、計画が狂い、道が塞がれ、閉じ込められたように思える時期が来ます。","s":5148.432,"e":5155.492,"p":false,"h":false},{"t":"その時、信者は自分が神の計画の外に落ちてしまったと考えやすいのです。","s":5155.848,"e":5161.909,"p":true,"h":false},{"t":"しかし、パウロの牢獄は計画の外ではありませんでした。","s":5162.4,"e":5166.686,"p":false,"h":false},{"t":"牢獄は、主が約束された道の上にありました。","s":5166.9,"e":5170.568,"p":false,"h":false},{"t":"ローマへの道は、鎖と難破を通る道であり、それが地の果てへ至る道でした。","s":5170.824,"e":5176.96,"p":false,"h":false},{"t":"この事実が教えるのは、神が苦しみを好まれるということではなく、神の約束は私たちが望む道だけで実現するのではなく、どのような道を通っても実現するということです。","s":5177.16,"e":5190.425,"p":true,"h":false},{"t":"そして、福音は閉じ込められません。","s":5190.948,"e":5193.747,"p":false,"h":false},{"t":"ルカの最後の言葉が、それを教えています。","s":5193.936,"e":5196.991,"p":false,"h":false},{"t":"少しも妨げられることなく。","s":5197.284,"e":5199.446,"p":false,"h":false},{"t":"私たちが閉じ込められても福音は閉じ込められず、私たちが倒れても福音は倒れません。","s":5199.66,"e":5206.39,"p":false,"h":false},{"t":"使徒の働きの物語が私たちの時代へと続いているのは、この福音が人の力によって立っているのではないからです。","s":5206.572,"e":5214.799,"p":true,"h":false}]},{"title":"17.一本の筋として読む使徒の働き","audio":"book_2610280719_2.mp3","start":5215.428,"end":5718.708,"dur":503.3,"segs":[{"t":"17.一本の筋として読む使徒の働き","s":5215.428,"e":5218.95,"p":true,"h":false},{"t":"本文：使徒の働き全体（ともに読む本文：使徒の働き1章1節から11節、使徒の働き6章7節、使徒の働き9章31節、使徒の働き12章24節、使徒の働き16章5節、使徒の働き19章20節、使徒の働き28章30節から31節）","s":5219.388,"e":5244.26,"p":true,"h":false},{"t":"これまで十六回にわたって、使徒の働きの問いを一つずつたどってきました。","s":5244.732,"e":5250.105,"p":false,"h":false},{"t":"最後に一歩引いて、この書全体を一本の筋として読んでみましょう。","s":5250.312,"e":5255.491,"p":false,"h":false},{"t":"問いは多くありましたが、この書は初めから終わりまで一つの物語です。","s":5255.712,"e":5260.927,"p":true,"h":false},{"t":"書の目次","s":5261.544,"e":5262.486,"p":true,"h":false},{"t":"使徒の働きには別に目次はありませんが、1章8節がその役割を果たしています。","s":5263.452,"e":5269.85,"p":false,"h":false},{"t":"昇天される直前、主は、聖霊があなたがたの上に臨むとき、あなたがたは力を受け、エルサレム、ユダヤとサマリアの全土、さらに地の果てまで、わたしの証人となる、と言われました。","s":5270.112,"e":5284.226,"p":true,"h":false},{"t":"この一節が、書全体を三つの部分に分けています。","s":5284.692,"e":5288.669,"p":false,"h":false},{"t":"最初の7章は、エルサレムで起こった出来事です。","s":5288.94,"e":5292.701,"p":false,"h":false},{"t":"五旬節に聖霊が臨み、教会が建てられ、迫害とステパノの殉教によって幕を閉じます。","s":5292.936,"e":5300.063,"p":false,"h":false},{"t":"次の5章は、福音がユダヤとサマリアへ広がっていく物語です。","s":5300.352,"e":5305.252,"p":false,"h":false},{"t":"ピリポがサマリアへ行き、サウロが回心し、ペテロがコルネリオの家へ行き、アンティオキアで教会が異邦人にまで開かれます。","s":5305.5,"e":5314.593,"p":false,"h":false},{"t":"残りの16章は、アンティオキアから遣わされたパウロに従ってローマに至る、地の果ての物語です。","s":5314.896,"e":5322.471,"p":true,"h":false},{"t":"この書は、福音がどのように一つの町から始まり、帝国の中心にまで至ったのかを示す物語であり、その物語の構造は初めから主が約束しておられたものでした。","s":5322.996,"e":5335.925,"p":false,"h":false},{"t":"使徒たちが計画を立ててこの道を造ったのではなく、主が語られた道に沿って、この書は展開していきます。","s":5336.136,"e":5343.912,"p":true,"h":false},{"t":"一つの文でつながる報告","s":5344.416,"e":5346.648,"p":true,"h":false},{"t":"ルカは、この大きな流れの中に短い報告文をあちこちに差し挟みます。","s":5347.08,"e":5353.039,"p":false,"h":false},{"t":"神のことばはますます広まり、弟子の数は非常に増えていったと言います。","s":5353.308,"e":5358.642,"p":false,"h":false},{"t":"教会は平安を得て堅く立てられ、その数は増えていったと言います。","s":5358.96,"e":5363.937,"p":false,"h":false},{"t":"神のことばは、ますます広がっていったと言います。","s":5364.216,"e":5367.591,"p":false,"h":false},{"t":"諸教会は信仰を堅くされ、日ごとに人数が増えていったと言います。","s":5367.852,"e":5372.957,"p":false,"h":false},{"t":"主のことばは力強く広まり、勢いを得ていったと言います。","s":5373.252,"e":5377.804,"p":false,"h":false},{"t":"そしてこの書の最後の文は、パウロが少しも妨げられることなく神の国を宣べ伝えていた、ということばです。","s":5378.076,"e":5386.263,"p":true,"h":false},{"t":"これらの報告が置かれている箇所を見ると、共通点があります。","s":5386.752,"e":5391.129,"p":false,"h":false},{"t":"たいてい、大きな危機の直後です。","s":5391.396,"e":5393.999,"p":false,"h":false},{"t":"ステパノが死んだ後、迫害が起こった後、ヤコブが死にヘロデが死んだ後、エペソで騒動が起こった後です。","s":5394.276,"e":5402.177,"p":false,"h":false},{"t":"ルカは危機と迫害があるたびに、このように言います。","s":5402.412,"e":5406.148,"p":false,"h":false},{"t":"しかし、みことばは成長していった。","s":5406.372,"e":5409.112,"p":false,"h":false},{"t":"使徒の働きは、使徒たちの物語である前に、みことばが成長していった物語です。","s":5409.288,"e":5415.686,"p":true,"h":false},{"t":"主語は誰か","s":5416.2,"e":5417.31,"p":true,"h":false},{"t":"この書の主語は、初めからお一人でした。","s":5418.108,"e":5421.123,"p":false,"h":false},{"t":"1章1節は、イエスが行い、教え始められたすべてのことを、前の書に記したと述べています。","s":5421.348,"e":5428.825,
