"p":false,"h":false},{"t":"そうであるなら、この書はその働きの続きです。","s":5429.088,"e":5432.812,"p":true,"h":false},{"t":"五旬節に聖霊を注いでくださる方は、昇天された主です。","s":5433.3,"e":5437.912,"p":false,"h":false},{"t":"ステパノが死ぬとき、天で立っておられた方はその主です。","s":5438.16,"e":5442.201,"p":false,"h":false},{"t":"ダマスコへの道でサウロを捕らえられた方も、コルネリオとペテロに幻を与えられた方も、牢の扉を開かれた方も、嵐の中でパウロのそばに立たれた方も、同じ主です。","s":5442.444,"e":5455.646,"p":false,"h":false},{"t":"使徒たちは働く者たちでしたが、この働きの主体ではありませんでした。","s":5455.908,"e":5461.06,"p":true,"h":false},{"t":"この点が、この書の読み方を定めます。","s":5461.524,"e":5464.426,"p":false,"h":false},{"t":"使徒の働きは、使徒たちをまねるようにと書かれた模範事例集ではありません。","s":5464.692,"e":5470.166,"p":false,"h":false},{"t":"教会が従うべき制度や方法を集めた手引き書でもありません。","s":5470.344,"e":5474.824,"p":false,"h":false},{"t":"昇天された主が、天から聖霊によって教会を建て、広げられた働きの記録です。","s":5475.06,"e":5481.537,"p":false,"h":false},{"t":"ですから、使徒の働きを読む最もよい方法は、この場面で私は何をすべきかを先に問うことではなく、この場面で主は何をしておられるのかを先に問うことです。","s":5481.828,"e":5493.978,"p":true,"h":false},{"t":"十六の問いが指し示したところ","s":5494.572,"e":5496.988,"p":true,"h":false},{"t":"振り返ってみると、私たちが扱った問いはすべて、同じお方を指していました。","s":5497.416,"e":5503.355,"p":true,"h":false},{"t":"昇天された主は、国の回復を尋ねる弟子たちに、時ではなく、聖霊と地の果てについて語られました。","s":5503.788,"e":5511.719,"p":false,"h":false},{"t":"五旬節に聖霊が臨まれたのは、その主が送られた贈り物であり、その後サマリア人、異邦人、ヨハネの弟子たちに同じ聖霊が臨まれたのは、福音があらゆる境界を越えることの証拠でした。","s":5511.924,"e":5526.816,"p":false,"h":false},{"t":"十字架が神の定められたみこころであると同時に人の罪であるという説教は、最も大きな罪が救いの場となったという知らせでした。","s":5527.008,"e":5536.583,"p":true,"h":false},{"t":"財産を分け合った教会とアナニアの死は、聖霊が臨まれた共同体の恵みと聖さをともに示し、ステパノは神殿に閉じ込められない神と、天で立っておられる人の子を見ました。","s":5537.016,"e":5550.342,"p":false,"h":false},{"t":"教会を迫害していたサウロが選ばれたことは、神の恵みが人の資格とは無関係であることの証拠であり、コルネリオの家で、神は幻によって偏見の壁を打ち壊されました。","s":5550.552,"e":5563.709,"p":false,"h":false},{"t":"ヤコブの死とペテロの救出は、説明のつかない神の主権の前に、私たちを立たせました。","s":5563.944,"e":5570.78,"p":true,"h":false},{"t":"永遠のいのちに定められていた人たちは信じ、パウロは彼らのために沈黙しませんでした。","s":5571.216,"e":5578.092,"p":false,"h":false},{"t":"イスラエルの拒絶の前でも、福音は異邦人に道を開きました。","s":5578.308,"e":5583.059,"p":false,"h":false},{"t":"エルサレム会議は、救いがただ主イエスの恵みによって実現することを守り抜き、使徒たちへの導きは、神が福音の働きをどのように導かれるのかを示しました。","s":5583.276,"e":5595.371,"p":false,"h":false},{"t":"アテネにいたパウロは、接点をことばの水準でのみ用い、宣教の内容は少しも変えず、使徒たちのしるしは、みことばを証しする働きのために用いられました。","s":5595.552,"e":5607.981,"p":false,"h":false},{"t":"最後に、裁判を受けて閉じ込められたパウロは、福音が鎖につながれないことを示しました。","s":5608.188,"e":5615.063,"p":true,"h":false},{"t":"すべての問いの根底には、一つの確信がありました。","s":5615.532,"e":5619.558,"p":false,"h":false},{"t":"働かれるのは神であり、神は人の弱さと罪と反対さえも用いて、ご自分のことばを成し遂げられる、ということです。","s":5619.744,"e":5628.509,"p":true,"h":false},{"t":"まだ終わっていない物語","s":5629.032,"e":5630.929,"p":true,"h":false},{"t":"使徒の働きは28章で終わりますが、物語は終わっていません。","s":5631.372,"e":5636.301,"p":false,"h":false},{"t":"この書が、始められた働きについて語って開いた扉は、閉じられていません。","s":5636.484,"e":5642.344,"p":false,"h":false},{"t":"今、私たちが生きている時代こそ、その続きです。","s":5642.532,"e":5646.504,"p":false,"h":false},{"t":"昇天された主は今も天から聖霊によって教会を建て、みことばを広め、地の果てへ福音を送っておられます。","s":5646.744,"e":5655.212,"p":true,"h":false},{"t":"そして、この物語にはまだ実現していない終わりがあります。","s":5655.744,"e":5660.172,"p":false,"h":false},{"t":"昇天のとき、白い衣を着た二人の人が言いました。","s":5660.46,"e":5664.618,"p":false,"h":false},{"t":"「あなたがたを離れて天に上げられたこのイエスは、天に上って行くのをあなたがたが見たのと同じ有様で、またおいでになります。」","s":5664.816,"e":5673.975,"p":false,"h":false},{"t":"使徒の働きの初めにあった約束は、この書が終わった後にも残っています。","s":5674.284,"e":5679.749,"p":true,"h":false},{"t":"ですから、使徒の働きを読む人は二つの方向を見ます。","s":5680.26,"e":5684.551,"p":false,"h":false},{"t":"一つは、天で今も働いておられる王であり、もう一つは、再び来られるその王です。","s":5684.832,"e":5691.522,"p":false,"h":false},{"t":"その間に置かれた時が証人の時代であり、その時の中に私たちがいます。","s":5691.78,"e":5697.388,"p":false,"h":false},{"t":"証人となれという命令ではなく、証人となるという約束を受けた者としてです。","s":5697.684,"e":5703.534,"p":false,"h":false},{"t":"私たちを証人とならせてくださる方は聖霊であり、その聖霊を送られた方は昇天された王です。","s":5703.804,"e":5711.156,"p":false,"h":false},{"t":"この書が初めと終わりで指し示す名は一つです。","s":5711.436,"e":5714.76,"p":false,"h":false},{"t":"イエス・キリスト、天に上られた主です。","s":5715,"e":5718.183,"p":true,"h":false}]}];
  const N = TRACKS.length;

      let para = '';
      tr.segs.forEach((g, i) => {
        const span = '<span class="seg" id="g' + k + '_' + i + '" data-k="' + k + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
        if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h3 class="hd">' + span + '</h3>'; }

  function applyAuto() {

  }

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.defaultPlaybackRate = SPEEDS[spd]; audio.playbackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }

  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });

  function idxAt(t) { const S = segs(); let k = -1; for (let i = 0; i < S.length; i++) { if (S[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function clearMark() { const o = $('g' + lastK + '_' + lastI); if (o) { o.classList.remove('on'); } lastK = -1; lastI = -1; }

  }

  /* 이어듣기가 꺼져 있을 때: 같은 파일 안에서 次の文章로 넘어가는 순간 멈춥니다 */

    else if (i > 0) { jump(ti, i - 1); }
    else if (ti > 0) { loadTrack(ti - 1, 0, true); }
    else { seekAbs(0); }
  };
  $('next').onclick = () => {
    const i = idxAt(audio.currentTime || 0) + 1;
    if (i < segs().length) { jump(ti, i); } else if (ti < N - 1) { loadTrack(ti + 1, 0, true); }
  };
  $('pt').onclick = () => { if (localT() > 5 || ti === 0) { loadTrack(ti, 0, true); } else { loadTrack(ti - 1, 0, true); } };
  $('nt').onclick = () => { if (ti < N - 1) { loadTrack(ti + 1, 0, true); } };
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = TRACKS[ti].dur || 0; seekAbs(TRACKS[ti].start + ((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-k'), +s.getAttribute('data-i')); } });
  $('toc').addEventListener('click', e => {
    const a = e.target.closest ? e.target.closest('a') : null; if (!a) { return; }
    e.preventDefault(); $('lst').open = false; lastUser = 0;
    const k = +a.getAttribute('data-k');
    loadTrack(k, 0, true);
    const sec = $('t' + k); if (sec) { try { sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (x) {} }
  });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seekAbs((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seekAbs((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', savePos);

  /* 잠금 화면·이어폰 단추 */
  try {
    if ('mediaSession' in navigator) {
      const ms = navigator.mediaSession;
      const set = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
      set('play', play); set('pause', pause);
      set('nexttrack', () => $('nt').onclick()); set('previoustrack', () => $('pt').onclick());
      set('seekbackward', () => seekAbs((audio.currentTime || 0) - 10)); set('seekforward', () => seekAbs((audio.currentTime || 0) + 10));
    }
  } catch (e) {}

  /* 시작: 주소 끝의 #번호가 있으면 그 글을, 없으면 첫 글을 준비하고, 지난번 위치가 있으면 이어 듣기 안내 */
  const hm = /^#(\d+)$/.exec(location.hash || '');
  let k0 = 0; if (hm) { const q = parseInt(hm[1], 10) - 1; if (q >= 0 && q < N) { k0 = q; } }
  loadTrack(k0, 0, false);
  inited = true;
  if (hm) { const sec = $('t' + k0); if (sec) { setTimeout(() => { try { sec.scrollIntoView({ block: 'start' }); } catch (x) {} }, 60); } }
  else {
    const sp = (pref('pos') || '').split(':'), rk = parseInt(sp[0], 10), rt = parseFloat(sp[1]);
    if (rk >= 0 && rk < N && rt > 10 && rt < (TRACKS[rk].dur || 1e9) - 5) {
      const r = $('resume'); r.style.display = 'block';
      r.innerHTML = '前回は <b>' + esc(TRACKS[rk].title) + '</b> の ' + fmt(rt) + ' まで聞きました。<button type="button" id="rb">続きから聞く</button>';
      $('rb').onclick = () => { r.style.display = 'none'; loadTrack(rk, rt, true); const sec = $('t' + rk); if (sec) { try { sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (x) {} } };
    }
  }
  /* 全画面表示 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 終了' : '⛶ 全画面'; b.setAttribute('aria-label', isFs() ? '全画面を終了' : '全画面表示'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, loadTrack, toggle, audio, TRACKS, seekAbs, state: () => ({ ti, auto, playing, curSrc }) };
})();
</script>
</body>
</html>
