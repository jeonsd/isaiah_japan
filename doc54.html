なたの石を、輝く石でふさぎ、あなたの基を、サファイアで据える」(54:11)。","s":109.836,"e":116.28,"p":false,"h":false},{"t":"あなたの小塔は、ルビーで、あなたの門は、エメラルドで、あなたの城壁は、宝石で造る(54:12)。","s":116.568,"e":122.918,"p":false,"h":false},{"t":"あなたの子らはみな、主に教えられ、あなたの子らの平和は大きい(54:13)。","s":123.192,"e":127.612,"p":false,"h":false},{"t":"あなたは義によって堅く立ち、虐げから遠ざかる。","s":127.908,"e":131.3,"p":false,"h":false},{"t":"恐れることがない。","s":131.58,"e":132.715,"p":false,"h":false},{"t":"あなたは、恐れから遠ざかり、それはあなたに近づかない(54:14)。","s":133.488,"e":137.406,"p":true,"h":false},{"t":"もし、だれかが攻めてきても、それは、わたしから出たものではない。","s":138.024,"e":142.599,"p":false,"h":false},{"t":"あなたを攻める者は、あなたのために倒れる(54:15)。","s":142.884,"e":145.894,"p":false,"h":false},{"t":"見よ、わたしは、炭火を吹きおこし、武器を作る鍛冶屋を造り、また、破壊する者も造った(54:16)。","s":146.196,"e":153.251,"p":false,"h":false},{"t":"あなたに向けて造られる武器は、どれも役に立たない。","s":153.54,"e":156.99,"p":false,"h":false},{"t":"さばきの場で、あなたと争うすべての舌を、あなたは罪に定める。","s":157.284,"e":161.83,"p":false,"h":false},{"t":"これが、主のしもべたちの受け継ぐもの、そして、わたしから出る彼らの義である、と主は言われます(54:17)。","s":162.108,"e":168.778,"p":true,"h":false},{"t":"各節の解説","s":169.416,"e":170.698,"p":true,"h":false},{"t":"1節の「不妊の女」は、バビロン捕囚で子孫を失ったように見えるシオンを表します。","s":171.36,"e":177.235,"p":false,"h":false},{"t":"53章の苦難のしもべの歌の直後に、この喜びの歌が置かれていることに、注意が必要です。","s":177.516,"e":184.434,"p":false,"h":false},{"t":"しもべの苦しみの結果として、不妊の女が、多くの子を持つ、という流れとして読む立場があります。","s":184.716,"e":191.722,"p":false,"h":false},{"t":"パウロは、ガラテヤ人への手紙4章で、この節を引いて、信仰による約束の子らについて語っています。","s":192.024,"e":199.379,"p":true,"h":false},{"t":"2~3節の、天幕を広げる描写は、シオンが、民が増えて広がっていくという約束を、目に見える形で語っています。","s":200.016,"e":208.773,"p":false,"h":false},{"t":"回復は、元の大きさに戻ることではなく、それを超えて広がることです。","s":209.052,"e":214.157,"p":true,"h":false},{"t":"7~8節の、「ほんのしばらく見捨てた」「永遠の恵み」の対比は、さばきと回復の時間の長さを比べています。","s":214.812,"e":222.604,"p":false,"h":false},{"t":"さばきは、一瞬のようであり、恵みは、永遠である、という意味です。","s":222.876,"e":227.57,"p":true,"h":false},{"t":"9節の、ノアの水への言及は、神の誓いの確かさを、創世記の出来事に重ねて語ります。","s":228.24,"e":235.358,"p":false,"h":false},{"t":"ノアの洪水の後、二度と地を洪水で滅ぼさないと、約束された神は、民に怒り続けないことも、誓っておられます。","s":235.656,"e":244.255,"p":true,"h":false},{"t":"10節の「平和の契約」は、解釈が分かれます。","s":244.908,"e":248.425,"p":false,"h":false},{"t":"ノアやダビデとの契約と関係づける読み方もあります。","s":248.724,"e":252.367,"p":false,"h":false},{"t":"新約聖書の、「新しい契約」とつなげて読まれることもあります。","s":252.648,"e":256.854,"p":false,"h":false},{"t":"どちらにしても、山が動いても、神の愛は動かない、という確かさが、中心です。","s":257.148,"e":263.366,"p":true,"h":false},{"t":"11~12節の宝石の都は、のちに、黙示録21章の、新しいエルサレムの描写と、つなげて読まれることがあります。","s":264.024,"e":273.31,"p":false,"h":false},{"t":"ここでの宝石は、文字どおりの建築材料というより、神が与えられる、美しさと堅さを語る、詩的な表現です。","s":273.6,"e":282.062,"p":true,"h":false},{"t":"13節の「あなたの子らはみな、主に教えられ」は、新約聖書で、イエスが、ヨハネの福音書6章で、引いています。","s":282.708,"e":290.882,"p":false,"h":false},{"t":"神ご自身が、民を教えてくださる、という約束です。","s":291.168,"e":295.186,"p":true,"h":false},{"t":"15~17節は、解釈の難しいところです。","s":295.848,"e":299.686,"p":false,"h":false},{"t":"16節で、武器を作る者も、破壊する者も、主が造られたとされており、ここでも、神の主権が語られています。","s":299.988,"e":308.531,"p":false,"h":false},{"t":"それでも、神の民に向けられる武器は、役に立ちません。","s":308.844,"e":312.901,"p":false,"h":false},{"t":"「主のしもべたちの受け継ぐもの」の「しもべたち」は、複数形です。","s":313.2,"e":317.367,"p":false,"h":false},{"t":"53章の、ひとりのしもべから、多くのしもべたちへと広がっていることが、読み取れます。","s":317.664,"e":323.675,"p":true,"h":false}], NAV = {"prev":{"href":"doc53.html","title":"イザヤ書_53章"},"next":{"href":"doc55.html","title":"イザヤ書_55章"},"list":"index.html"};

  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
