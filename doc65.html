(function () {
  const TITLE = "イザヤ書_65章", AUDIO_SRC = "doc65_2610231055.mp3", DUR = 421, SEGS = [{"t":"イザヤ書65章","s":0,"e":1.589,"p":true,"h":false},{"t":"全体の流れ","s":2.232,"e":3.337,"p":true,"h":false},{"t":"65章は、64章の祈りに対する、主の答えです。","s":4.14,"e":8.767,"p":false,"h":false},{"t":"「わたしは、尋ねなかった者たちに、探し出され、求めなかった者たちに、見いだされた。","s":9.072,"e":15.228,"p":false,"h":false},{"t":"わたしの名を呼ばなかった国民に、『わたしはここにいる、わたしはここにいる』と言った」(65:1)。","s":15.516,"e":21.205,"p":false,"h":false},{"t":"わたしは、一日中、手を差し伸べた。","s":21.492,"e":24.454,"p":false,"h":false},{"t":"自分の考えに従って、良くない道を歩む、反逆の民に向けて(65:2)。","s":24.732,"e":29.621,"p":false,"h":false},{"t":"彼らは、わたしの顔の前で、絶えずわたしを怒らせ、園でいけにえをささげ、れんがの上で香をたき、墓地に座り、隠れた所で夜を過ごし、豚の肉を食べ、汚れた肉の汁を、器に入れます(65:3-4)。","s":29.916,"e":44.171,"p":false,"h":false},{"t":"そして言います。","s":44.46,"e":45.394,"p":false,"h":false},{"t":"「あなたの所に近寄るな。","s":46.368,"e":48.054,"p":false,"h":false},{"t":"私は、あなたより聖なる者だから」(65:5)。","s":48.348,"e":51.011,"p":true,"h":false},{"t":"主は言われます。","s":51.66,"e":52.699,"p":false,"h":false},{"t":"「見よ、これはわたしの前に書き記されている。","s":53.568,"e":56.628,"p":false,"h":false},{"t":"わたしは黙っていない。","s":56.916,"e":58.297,"p":false,"h":false},{"t":"必ず報いる。","s":58.824,"e":59.895,"p":false,"h":false},{"t":"彼らの咎と、彼らの先祖の咎を、ともに報いる」(65:6-7)。","s":60.732,"e":64.398,"p":true,"h":false},{"t":"しかし、すべてが滅ぼされるのではありません。","s":65.052,"e":68.133,"p":false,"h":false},{"t":"「ぶどうの房の中に、新しいぶどう酒が見つかるとき、人は、『それを損なうな。","s":68.436,"e":74.1,"p":false,"h":false},{"t":"その中に祝福があるから』と言う。","s":74.376,"e":76.693,"p":false,"h":false},{"t":"そのように、わたしも、わたしのしもべたちのために、すべてを滅ぼすことはしない」(65:8)。","s":77.004,"e":82.52,"p":false,"h":false},{"t":"わたしは、ヤコブから子孫を、ユダから、わたしの山々を受け継ぐ者を、出させる。","s":82.8,"e":88.709,"p":false,"h":false},{"t":"わたしの選んだ者が、それを受け継ぎ、わたしのしもべたちが、そこに住む(65:9)。","s":88.992,"e":94.079,"p":false,"h":false},{"t":"シャロンは、羊の群れの牧場となり、アコルの谷は、牛の群れの休み場となる。","s":94.356,"e":99.996,"p":false,"h":false},{"t":"わたしを求めた民のためだ(65:10)。","s":100.296,"e":102.194,"p":true,"h":false},{"t":"一方、主を捨て、わたしの聖なる山を忘れ、ガドの神に食卓を整え、ミニの神に混ぜ合わせたぶどう酒を満たす者たちを、わたしは、剣に定める。","s":102.852,"e":113.776,"p":false,"h":false},{"t":"あなたがたはみな、ひざまずいて殺される。","s":114.084,"e":116.81,"p":false,"h":false},{"t":"わたしが呼んだのに、答えず、わたしが語ったのに、聞かず、わたしの目に悪であることを行い、わたしが喜ばないことを選んだからだ(65:11-12)。","s":117.108,"e":126.509,"p":true,"h":false},{"t":"ここで、二つの運命が、対比されます。","s":127.152,"e":130.052,"p":false,"h":false},{"t":"「わたしのしもべたちは食べるが、あなたがたは飢える。","s":130.356,"e":133.67,"p":false,"h":false},{"t":"わたしのしもべたちは飲むが、あなたがたは渇く。","s":133.956,"e":137.288,"p":false,"h":false},{"t":"わたしのしもべたちは喜ぶが、あなたがたは恥を見る。","s":137.556,"e":141.364,"p":false,"h":false},{"t":"わたしのしもべたちは、心の喜びのゆえに歌うが、あなたがたは、心の痛みのゆえに叫び、霊の砕けのゆえに泣き叫ぶ」(65:13-14)。","s":141.66,"e":150.783,"p":false,"h":false},{"t":"あなたがたの名は、わたしの選んだ者たちの、呪いの言葉として残される。","s":151.092,"e":156.114,"p":false,"h":false},{"t":"しかし、神である主は、ご自分のしもべたちを、別の名で呼ばれる(65:15)。","s":156.42,"e":161.567,"p":false,"h":false},{"t":"それは、地で祝福される者は、真実の神によって祝福され、地で誓う者は、真実の神によって誓うためだ。","s":161.856,"e":170.193,"p":false,"h":false},{"t":"先の苦しみは忘れられ、わたしの目から隠されるからだ(65:16)。","s":170.496,"e":174.364,"p":true,"h":false},{"t":"そして、この章の中心が来ます。","s":174.996,"e":177.451,"p":false,"h":false},{"t":"「見よ、わたしは新しい天と新しい地を創造する。","s":177.732,"e":181.42,"p":false,"h":false},{"t":"先のことは思い出されず、心に上ることもない」(65:17)。","s":181.692,"e":185.123,"p":false,"h":false},{"t":"だから、わたしが創造するものを、いつまでも喜び楽しめ。","s":185.4,"e":189.697,"p":false,"h":false},{"t":"わたしは、エルサレムを喜びとして、その民を楽しみとして創造する(65:18)。","s":189.972,"e":195.027,"p":false,"h":false},{"t":"わたしは、エルサレムを喜び、わが民を楽しむ。","s":195.336,"e":198.948,"p":false,"h":false},{"t":"そこでは、もう、泣き声も叫び声も聞かれない(65:19)。","s":199.224,"e":202.7,"p":false,"h":false},{"t":"そこには、数日しか生きない乳飲み子も、寿命を全うしない老人もいない。","s":203.004,"e":208.545,"p":false,"h":false},{"t":"百歳で死ぬ者は、若者とされ、百歳に満たないで死ぬ者は、呪われた者とされる(65:20)。","s":208.836,"e":215.097,"p":false,"h":false},{"t":"人々は、家を建てて住み、ぶどう畑を作って、その実を食べる。","s":215.388,"e":220.209,"p":false,"h":false},{"t":"建てた家に他の者が住むことも、植えたものを他の者が食べることもない。","s":220.5,"e":225.309,"p":false,"h":false},{"t":"わたしの民の寿命は、木の寿命のようになり、わたしの選んだ者たちは、自分の手のわざを、存分に楽しむ(65:21-22)。","s":225.576,"e":233.406,"p":false,"h":false},{"t":"彼らは、むなしく労せず、わざわいのために子を産まない。","s":233.712,"e":237.605,"p":false,"h":false},{"t":"彼らは、主に祝福された者の子孫であり、その子孫も、彼らとともにいるからだ(65:23)。","s":237.888,"e":243.882,"p":false,"h":false},{"t":"彼らが呼ぶ前に、わたしは答え、彼らが語っているうちに、わたしは聞く(65:24)。","s":244.152,"e":249.305,"p":false,"h":false},{"t":"狼と子羊は、ともに草を食べ、獅子は、牛のようにわらを食べ、蛇は、ちりを食べ物とする。","s":249.588,"e":256.994,"p":false,"h":false},{"t":"わたしの聖なる山のどこでも、彼らは害を加えず、滅ぼすこともない、と主は言われます(65:25)。","s":257.292,"e":263.615,"p":true,"h":false},{"t":"各節の解説","s":264.24,"e":265.522,"p":true,"h":false},{"t":"1節は、新約聖書で、パウロが、ローマ人への手紙10章で、異邦人が救いを受けたことを語るとき、引いています。","s":266.184,"e":274.689,"p":false,"h":false},{"t":"ここでは、イスラエルの外の人々にも、主が、ご自分を現されることが、語られています。","s":274.968,"e":281.589,"p":false,"h":false},{"t":"ただし、この「尋ねなかった者たち」が、誰を指すのかについては、読み方が分かれます。","s":281.88,"e":288.037,"p":false,"h":false},{"t":"元の文脈では、イスラエル自身を指しているとも読めます。","s":288.324,"e":292.309,"p":true,"h":false},{"t":"2節の「手を差し伸べた」は、主が、反逆の民にも、絶えず呼びかけておられることを示します。","s":292.968,"e":299.673,"p":false,"h":false},{"t":"この節も、パウロは、ローマ人への手紙10章で、引いています。","s":299.952,"e":304.517,"p":true,"h":false},{"t":"3~5節の描写は、異教的な習慣と、独りよがりの聖さを、並べて語ります。","s":305.136,"e":311.327,"p":false,"h":false},{"t":"5節の「私は、あなたより聖なる者だから」という言葉は、外側の清さを誇る人が、実は、神から遠いことを、鋭く示しています。","s":311.616,"e":321.783,"p":true,"h":false},{"t":"8~9節は、さばきの中でも、神の民が、すべて滅ぼされないという、「残りの者」の主題を、もう一度語ります。","s":322.416,"e":331.181,"p":false,"h":false},{"t":"新しいぶどう酒の、たとえは、小さなものの中にある、祝福を見逃さない、神のまなざしを表します。","s":331.452,"e":339.119,"p":true,"h":false},{"t":"17節の「新しい天と新しい地」は、この書の、頂点の一つです。","s":339.768,"e":345.058,"p":false,"h":false},{"t":"新約聖書では、ペテロの手紙第二3章と、黙示録21章で、この約束が、終わりの時の完成の姿として、語られています。","s":345.348,"e":355.364,"p":false,"h":false},{"t":"ここでは、新しい創造が、単なる回復ではなく、先の苦しみが、思い出されないほどの、新しさであることが語られます。","s":355.644,"e":364.351,"p":true,"h":false},{"t":"20~25節の、新しい世界の描写は、解釈が分かれます。","s":365.004,"e":369.931,"p":false,"h":false},{"t":"寿命や、家を建てる、ぶどう畑を作るという描写は、この地上での、平和な生活の描写として読まれることがあります。","s":370.224,"e":378.867,"p":false,"h":false},{"t":"一方で、この描写を、終わりの時の、完全な新しい創造の、詩的な表現として、読む立場もあります。","s":379.152,"e":386.916,"p":false,"h":false},{"t":"ここで語られている、百歳で死ぬ者が若者とされるという言葉が、死がまだ存在する世界を描いているのか、象徴的な表現なのかについても、読み方が分かれます。","s":387.216,"e":398.96,"p":false,"h":false},{"t":"ここでは、細部を一つに決めず、神がもたらされる回復の、大きさと豊かさを、語るものとして読むことをお勧めします。","s":399.24,"e":407.616,"p":true,"h":false},{"t":"25節の、狼と子羊の描写は、11章6~9節と、ほとんど同じです。","s":408.24,"e":414.503,"p":false,"h":false},{"t":"この二つの箇所が、同じ望みを、枠のように語っていることが、分かります。","s":414.792,"e":419.973,"p":true,"h":false}], NAV = {"prev":{"href":"doc64.html","title":"イザヤ書_64章"},"next":{"href":"doc66.html","title":"イザヤ書_66章"},"list":"index.html"};

  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
