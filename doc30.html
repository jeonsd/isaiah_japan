(function () {
  const TITLE = "イザヤ書_30章", AUDIO_SRC = "doc30_2610231055.mp3", DUR = 389, SEGS = [{"t":"イザヤ書30章","s":0,"e":1.426,"p":true,"h":false},{"t":"全体の流れ","s":2.088,"e":3.193,"p":true,"h":false},{"t":"30章は、「災いだ、反逆の子らは」と始まります。","s":3.996,"e":8.207,"p":false,"h":false},{"t":"主は言われます。","s":8.496,"e":9.535,"p":false,"h":false},{"t":"彼らは、計画を立てるが、わたしによらず、同盟を結ぶが、わたしの霊によらない。","s":10.404,"e":16.628,"p":false,"h":false},{"t":"そうして、罪に罪を重ねている(30:1)。","s":16.92,"e":19.411,"p":false,"h":false},{"t":"彼らは、わたしの口に尋ねることなく、エジプトに下って行き、ファラオの保護を求め、エジプトの陰に避け所を求める(30:2)。","s":19.692,"e":28.034,"p":false,"h":false},{"t":"そのため、ファラオの保護は恥となり、エジプトの陰は屈辱となります(30:3)。","s":28.332,"e":33.139,"p":false,"h":false},{"t":"ネゲブの獣たちの重荷、すなわち、荷を積んだろばやらくだの隊商は、苦難と悩みの地を通ってエジプトへ向かいますが、その助けは空しいものです。","s":33.444,"e":43.937,"p":false,"h":false},{"t":"だから、主は、エジプトを「何もしない、おとなしくしているラハブ」と呼ばれます(30:4-7)。","s":44.208,"e":49.703,"p":true,"h":false},{"t":"主は、イザヤに、これを板に書き、書物に記して、後の日の永遠の証拠とするよう命じられます。","s":50.328,"e":57.322,"p":false,"h":false},{"t":"彼らは、反逆の民、偽りの子ら、主の教えを聞こうとしない子らだからです。","s":57.6,"e":63.326,"p":false,"h":false},{"t":"彼らは、先見者に「見るな」、預言者に「正しいことを私たちに預言するな。","s":63.612,"e":69.037,"p":false,"h":false},{"t":"耳に心地よいことを語れ。","s":69.336,"e":71.15,"p":false,"h":false},{"t":"まぼろしを預言せよ。","s":71.424,"e":72.87,"p":false,"h":false},{"t":"道から離れ、小道を外れ、イスラエルの聖なる方を、私たちの前から消せ」と言います(30:8-11)。","s":73.332,"e":79.605,"p":true,"h":false},{"t":"だから、イスラエルの聖なる方は、こう言われます。","s":80.244,"e":83.646,"p":false,"h":false},{"t":"「あなたがたは、このことばを退け、しいたげとゆがんだ道に頼り、それに寄りかかった。","s":83.952,"e":90.092,"p":false,"h":false},{"t":"だから、この咎は、あなたがたにとって、崩れ落ちる高い城壁のひび割れのようになる。","s":90.396,"e":96.458,"p":false,"h":false},{"t":"それは、突然、一瞬のうちに崩れ落ちる」(30:12-14)。","s":96.732,"e":100.028,"p":true,"h":false},{"t":"ところが、主は、続けて言われます。","s":100.656,"e":103.274,"p":false,"h":false},{"t":"「立ち返って静かにしていれば、あなたがたは救われ、落ち着いて信頼すれば、あなたがたは力を得る。","s":103.572,"e":110.457,"p":false,"h":false},{"t":"それなのに、あなたがたは、そうしようとはしなかった」(30:15)。","s":110.736,"e":114.33,"p":false,"h":false},{"t":"彼らは、馬に乗って逃げようと言いますが、追う者はもっと速くなります。","s":114.624,"e":119.542,"p":false,"h":false},{"t":"千人が一人の脅しで逃げ、五人の脅しで逃げ去ります(30:16-17)。","s":119.844,"e":123.674,"p":true,"h":false},{"t":"それでも、主は、あなたがたに恵みを与えようと待っておられ、あわれみを与えようと立ち上がられます。","s":124.308,"e":131.146,"p":false,"h":false},{"t":"主は公正の神だからです。","s":131.436,"e":133.342,"p":false,"h":false},{"t":"主を待ち望むすべての人は、幸いです(30:18)。","s":133.668,"e":136.581,"p":false,"h":false},{"t":"シオンに住む民よ、あなたはもう泣くことはありません。","s":136.872,"e":140.089,"p":false,"h":false},{"t":"主は、あなたの叫び声に応えて、必ず恵みを与えられます。","s":140.4,"e":145.087,"p":false,"h":false},{"t":"主はあなたに悩みのパンと苦しみの水を与えられますが、あなたの教師は、もう隠れることなく、あなたの目は教師を見ます。","s":145.368,"e":154.002,"p":false,"h":false},{"t":"右に行くにも、左に行くにも、「これが道だ。","s":154.296,"e":157.607,"p":false,"h":false},{"t":"これに歩め」と言う声が、後ろから聞こえます(30:19-21)。","s":157.896,"e":161.025,"p":true,"h":false},{"t":"偶像は汚れた物として投げ捨てられ、主が土に蒔く種に雨を与え、地の産物は豊かで、肥えたものになります。","s":161.676,"e":169.658,"p":false,"h":false},{"t":"月の光は太陽の光のようになり、太陽の光は七倍になります。","s":169.956,"e":174.874,"p":false,"h":false},{"t":"主が、ご自分の民の傷を包み、打たれた傷を癒やされる日です(30:22-26)。","s":175.176,"e":179.875,"p":true,"h":false},{"t":"見よ、主の御名は遠くから来られます。","s":180.504,"e":183.172,"p":false,"h":false},{"t":"その怒りは燃え、立ち上る煙は重く、その唇は憤りに満ち、その舌は焼き尽くす火のようです。","s":183.456,"e":190.84,"p":false,"h":false},{"t":"その息は、首にまで達する、あふれる流れのようです。","s":191.16,"e":195.035,"p":false,"h":false},{"t":"主は諸国を破滅のふるいでふるい、民のあごに、迷わせるくつわをはめられます。","s":195.336,"e":200.838,"p":false,"h":false},{"t":"しかし、あなたがたは、聖なる祭りの夜のように歌い、主の山に笛を吹いて上る者のように、心から喜びます(30:27-29)。","s":201.132,"e":209.477,"p":false,"h":false},{"t":"アッシリアは、主の声で恐れ、打たれます。","s":209.772,"e":212.752,"p":false,"h":false},{"t":"主が杖で打たれるたびに、タンバリンと立琴が鳴り響きます。","s":213.048,"e":217.216,"p":false,"h":false},{"t":"トフェトは、昔から備えられており、王のためにも用意されています。","s":217.512,"e":222.229,"p":false,"h":false},{"t":"主の息は、硫黄の流れのように、これを燃やします(30:30-33)。","s":222.516,"e":226.111,"p":true,"h":false},{"t":"各節の解説","s":226.764,"e":228.046,"p":true,"h":false},{"t":"1~2節の「わたしの霊によらない同盟」は、神に尋ねることなく、人間の計画に頼った、ユダの外交を指しています。","s":228.708,"e":237.274,"p":false,"h":false},{"t":"同盟そのものが罪なのではなく、神に尋ねることをせず、神を抜きにして進んだことが、問題とされています。","s":237.564,"e":245.421,"p":true,"h":false},{"t":"7節の「ラハブ」は、神話に出てくる海の怪物の名前で、ここでは、エジプトの別名として使われています。","s":246.06,"e":253.665,"p":false,"h":false},{"t":"見かけは大きいのに、何の助けにもならない国、という皮肉です。","s":253.944,"e":258.481,"p":true,"h":false},{"t":"8~11節の、民が預言者に「耳に心地よいことを語れ」と求める姿は、人が、神の真実の言葉より、慰めのことばを好む傾向を示しています。","s":259.128,"e":270.853,"p":false,"h":false},{"t":"説教者が、聞く人の願いに合わせて語ってしまう危うさとして、今日の教会にも通じる言葉です。","s":271.152,"e":278.045,"p":true,"h":false},{"t":"12~14節の、崩れ落ちる城壁の例えは、小さなひびが、やがて取り返しのつかない崩壊となることを示しています。","s":278.676,"e":287.57,"p":false,"h":false},{"t":"罪は、時間とともに積み重なり、ある時、一瞬で崩れ落ちます。","s":287.856,"e":292.933,"p":true,"h":false},{"t":"15節は、この章でいちばん有名な言葉の一つです。","s":293.58,"e":297.525,"p":false,"h":false},{"t":"「立ち返って静かにしていれば救われ、落ち着いて信頼すれば力を得る」とあります。","s":297.828,"e":303.221,"p":false,"h":false},{"t":"「立ち返る」と「静かにする」は、悔い改めと、神に任せることの両方を表します。","s":303.516,"e":309.52,"p":false,"h":false},{"t":"人が焦って動き回る時に、主は静かに待つことを求められます。","s":309.816,"e":314.431,"p":false,"h":false},{"t":"救いが、人の働きによらず、神ご自身から来るという、イザヤ書の中心の主題が、ここに凝縮されています。","s":314.712,"e":322.899,"p":true,"h":false},{"t":"18節の「主は待っておられる」という言葉は、民が主を待つだけでなく、主ご自身が民に恵みを与えるために待っておられる、という、驚くべき姿を語ります。","s":323.532,"e":334.887,"p":false,"h":false},{"t":"主の忍耐の深さを示します。","s":335.16,"e":337.26,"p":true,"h":false},{"t":"20~21節の、教師が隠れず、後ろから「これが道だ」と声が聞こえるという約束は、神のことばによる導きの回復を語っています。","s":337.896,"e":348.049,"p":false,"h":false},{"t":"8章の、「おしえとあかしに尋ねよ」と響き合います。","s":348.336,"e":351.672,"p":true,"h":false},{"t":"26節の、月が太陽のように、太陽が七倍になるという表現は、癒やしと回復の完成を、光の溢れる姿で描く、詩的な表現です。","s":352.332,"e":363.031,"p":false,"h":false},{"t":"文字どおりの天体の変化というより、神の祝福の豊かさを語ると読むのが、穏当でしょう。","s":363.312,"e":369.599,"p":true,"h":false},{"t":"33節の「トフェト」は、エルサレムの近くの谷で、かつて偶像礼拝と子どもを犠牲にする儀式が行われた場所の名前です。","s":370.26,"e":379.149,"p":false,"h":false},{"t":"ここでは、アッシリアの王のために備えられた、さばきの火の場所として語られています。","s":379.44,"e":385.129,"p":false,"h":false},{"t":"細部については、読み方が分かれます。","s":385.416,"e":388.109,"p":true,"h":false}], NAV = {"prev":{"href":"doc29.html","title":"イザヤ書_29章"},"next":{"href":"doc31.html","title":"イザヤ書_31章"},"list":"index.html"};

  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
