(function () {
  const TITLE = "イザヤ書_57章", AUDIO_SRC = "doc57_2610231055.mp3", DUR = 333, SEGS = [{"t":"イザヤ書57章","s":0,"e":1.611,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"57章は、義人が滅びても、だれも心に留めないという嘆きから始まります。","s":4.176,"e":10.054,"p":false,"h":false},{"t":"誠実な人が取り去られても、だれも悟りません。","s":10.368,"e":13.691,"p":false,"h":false},{"t":"義人は、わざわいから取り去られ、平安に入ります。","s":14.004,"e":17.623,"p":false,"h":false},{"t":"まっすぐに歩む人は、その寝床で安らぎます(57:1-2)。","s":17.928,"e":21.246,"p":true,"h":false},{"t":"次に、偶像礼拝にふける者たちに、主が語られます。","s":21.888,"e":26.026,"p":false,"h":false},{"t":"「魔女の子らよ、姦夫と遊女の子孫よ、ここに近づけ」。","s":26.316,"e":30.305,"p":false,"h":false},{"t":"あなたがたは、だれをあざけり、口を開き、舌を出すのか。","s":30.6,"e":34.964,"p":false,"h":false},{"t":"あなたがたは、背く者の子、偽りの子孫ではないか(57:3-4)。","s":35.244,"e":39.2,"p":false,"h":false},{"t":"樫の木の間、青々としたすべての木の下で、欲情に燃え、谷間で子どもを殺し、岩の割れ目の下でささげる者たちです(57:5)。","s":39.492,"e":48.181,"p":false,"h":false},{"t":"谷の滑らかな石の中に、あなたの分があり、その石に、あなたは飲み物のささげ物を注ぎました。","s":48.492,"e":55.536,"p":false,"h":false},{"t":"わたしは、これらのことで、なだめられるだろうか(57:6)。","s":55.836,"e":59.094,"p":false,"h":false},{"t":"高い山の上に寝床を設け、そこにいけにえをささげ、扉の後ろに、記念の物を置きます。","s":59.4,"e":66.001,"p":false,"h":false},{"t":"あなたは、わたしを離れて裸になり、寝床を広げ、彼らと契約を結びました(57:7-8)。","s":66.276,"e":72.24,"p":false,"h":false},{"t":"王のところへ油を携えて行き、香油を増し加え、使者を遠くへ送り、陰府にまでへりくだらせました(57:9)。","s":72.54,"e":79.583,"p":false,"h":false},{"t":"あなたは、長い道のりに疲れても、「だめだ」とは言わず、力を新たにして、弱ることがありませんでした(57:10)。","s":79.884,"e":87.125,"p":true,"h":false},{"t":"「あなたは、だれを恐れ、おののいて偽りを言い、わたしを思わず、心に留めなかったのか。","s":87.768,"e":94.162,"p":false,"h":false},{"t":"わたしが長い間、黙っていたから、あなたは、わたしを恐れないのか」(57:11)。","s":94.464,"e":99.52,"p":false,"h":false},{"t":"「わたしは、あなたの義を告げよう。","s":99.792,"e":102.106,"p":false,"h":false},{"t":"あなたのわざも、あなたの役には立たない。","s":102.42,"e":104.955,"p":false,"h":false},{"t":"あなたが叫ぶとき、あなたが集めた物に、救わせてみよ。","s":105.264,"e":109.398,"p":false,"h":false},{"t":"風がそれらをみな吹き飛ばし、息が運び去る」。","s":109.692,"e":112.87,"p":false,"h":false},{"t":"しかし、わたしに身を寄せる者は、地を受け継ぎ、わたしの聖なる山を所有します(57:12-13)。","s":113.148,"e":119.125,"p":true,"h":false},{"t":"ここで、主の声が変わります。","s":119.772,"e":121.877,"p":false,"h":false},{"t":"「盛り上げよ、盛り上げよ、道を整えよ。","s":122.148,"e":125.195,"p":false,"h":false},{"t":"わたしの民の道から、つまずきを取り除け」(57:14)。","s":125.496,"e":128.639,"p":false,"h":false},{"t":"高く、あがめられ、永遠に住み、その名が聖なる方は言われます。","s":128.952,"e":133.81,"p":false,"h":false},{"t":"「わたしは、高く聖なる所に住み、また、砕かれて、へりくだった霊の人とともに住む。","s":134.1,"e":140.517,"p":false,"h":false},{"t":"それは、へりくだった者の霊を生き返らせ、砕かれた者の心を生き返らせるためだ」(57:15)。","s":140.832,"e":146.667,"p":false,"h":false},{"t":"わたしは、とこしえに争わず、いつまでも怒らない。","s":146.952,"e":150.644,"p":false,"h":false},{"t":"わたしが造った人の霊と、いのちが、わたしの前で衰えるからです(57:16)。","s":150.912,"e":155.583,"p":false,"h":false},{"t":"貪欲の罪のため、わたしは怒り、彼を打ち、顔を隠して怒りました。","s":155.88,"e":161.135,"p":false,"h":false},{"t":"しかし、彼は背き続け、自分の心の道を歩みました(57:17)。","s":161.424,"e":165.825,"p":false,"h":false},{"t":"「わたしは彼の道を見た。","s":166.104,"e":167.76,"p":false,"h":false},{"t":"しかし、彼をいやし、導き、慰めを彼と、彼のうちの嘆く者たちに戻そう」(57:18)。","s":168.048,"e":174.595,"p":false,"h":false},{"t":"わたしは、くちびるの実を創造する。","s":174.888,"e":177.439,"p":false,"h":false},{"t":"遠い者にも、近い者にも、平安、平安があるように。","s":177.732,"e":181.762,"p":false,"h":false},{"t":"わたしは彼をいやす、と主は言われます(57:19)。","s":182.052,"e":184.737,"p":false,"h":false},{"t":"しかし、悪者は、休むことのできない、荒れた海のようです。","s":185.04,"e":189.458,"p":false,"h":false},{"t":"その水は、泥と汚物を吹き上げます。","s":189.756,"e":192.459,"p":false,"h":false},{"t":"「悪者には平安がない」と、わたしの神は言われます(57:20-21)。","s":192.744,"e":196.286,"p":true,"h":false},{"t":"各節の解説","s":196.92,"e":198.202,"p":true,"h":false},{"t":"1~2節は、義人の死に対する人々の無関心を嘆く言葉です。","s":198.864,"e":203.794,"p":false,"h":false},{"t":"義人が取り去られるのは、さばきの前に守られているのだ、と読む立場があります。","s":204.084,"e":209.627,"p":false,"h":false},{"t":"この節の細部には、読み方が分かれるところもあります。","s":209.916,"e":213.671,"p":true,"h":false},{"t":"3~13節の長い偶像礼拝の描写は、特に難しい箇所です。","s":214.308,"e":219.492,"p":false,"h":false},{"t":"木の下、谷、岩の割れ目といった場所は、当時の異教の礼拝が行われた場所を指します。","s":219.78,"e":226.348,"p":false,"h":false},{"t":"「子どもを殺し」は、モレクなどへの、子どもを犠牲にする儀式を指すと読まれます。","s":226.62,"e":231.962,"p":false,"h":false},{"t":"9節の、「王」への使者と油も、異教の神、または外国の王との関係を指すと、読み方が分かれます。","s":232.236,"e":239.682,"p":false,"h":false},{"t":"細部を一つに決めるより、神以外のものに頼って、疲れ果てた姿として、読むのが穏当です。","s":239.976,"e":246.679,"p":true,"h":false},{"t":"10節の、「長い道のりに疲れても、『だめだ』と言わなかった」は、皮肉を含んでいます。","s":247.32,"e":253.283,"p":false,"h":false},{"t":"偶像礼拝のためには、疲れを知らずに力を尽くす民の姿です。","s":253.584,"e":258.468,"p":false,"h":false},{"t":"これが、神を求めることには、向けられていないという指摘です。","s":258.768,"e":263.111,"p":true,"h":false},{"t":"15節は、この章の中心です。","s":263.772,"e":266.399,"p":false,"h":false},{"t":"高く聖なる所に住まわれる神が、同時に、砕かれ、へりくだった者とともに住まわれる、と語られます。","s":266.688,"e":274.193,"p":false,"h":false},{"t":"神の高さと近さが、一つの言葉の中にあります。","s":274.464,"e":278.091,"p":false,"h":false},{"t":"新約聖書では、「悔いた心の者は幸いだ」という言葉との響き合いが、指摘されます。","s":278.388,"e":284.658,"p":false,"h":false},{"t":"改革派の神学が、神の超越と内在を語るときに、よく引かれる箇所です。","s":284.976,"e":290.602,"p":true,"h":false},{"t":"16節の「とこしえに争わず、いつまでも怒らない」は、神の怒りが、人の弱さを知った上での、限りあるものであることを示します。","s":291.24,"e":300.715,"p":true,"h":false},{"t":"18~19節の「いやし」は、バビロンからの帰還の回復と、罪の癒やしの、両方を含むと読まれます。","s":301.356,"e":309.032,"p":false,"h":false},{"t":"19節の「遠い者にも、近い者にも」は、新約聖書で、パウロが、エペソ人への手紙2章で、ユダヤ人と異邦人の和解を語る際に、引いています。","s":309.312,"e":320.241,"p":true,"h":false},{"t":"20~21節の、荒れた海のような悪者の描写は、悪者の内側に、平安が育たないことを表します。","s":320.904,"e":328.71,"p":false,"h":false},{"t":"48章22節と、ほぼ同じ形です。","s":329.004,"e":332.321,"p":true,"h":false}], NAV = {"prev":{"href":"doc56.html","title":"イザヤ書_56章"},"next":{"href":"doc58.html","title":"イザヤ書_58章"},"list":"index.html"};

    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
