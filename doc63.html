alse},{"t":"すると、民は、昔の日、モーセの日を思い出しました。","s":105.516,"e":109.702,"p":false,"h":false},{"t":"「羊の群れの牧者たちを海から上らせた方は、どこにおられるのか。","s":109.98,"e":114.555,"p":false,"h":false},{"t":"その中に、聖なる霊を置かれた方は、どこにおられるのか」(63:11)。","s":114.84,"e":118.928,"p":false,"h":false},{"t":"モーセの右の手に、栄光の腕を伴わせ、永遠の名を得るために、彼らの前で水を分け、荒れ野を、馬のように、つまずくことなく導かれた方は、どこにおられるのか(63:12-14)。","s":119.232,"e":130.983,"p":true,"h":false},{"t":"そして、民は祈ります。","s":131.616,"e":133.394,"p":false,"h":false},{"t":"「天から見下ろしてください。","s":133.668,"e":135.168,"p":false,"h":false},{"t":"あなたの聖なる輝かしい住まいから、ご覧ください。","s":135.576,"e":138.999,"p":false,"h":false},{"t":"あなたの熱心と力あるわざは、どこにあるのですか。","s":139.284,"e":142.801,"p":false,"h":false},{"t":"あなたの胸の思いやり、あわれみは、私に対して、抑えられています」(63:15)。","s":143.1,"e":147.9,"p":false,"h":false},{"t":"「あなたこそ私たちの父です。","s":148.212,"e":150.12,"p":false,"h":false},{"t":"アブラハムは私たちを知らず、イスラエルも私たちを認めなくても、主よ、あなたは私たちの父、昔から、『私たちを贖う方』が、あなたの名です」(63:16)。","s":150.408,"e":161.094,"p":false,"h":false},{"t":"なぜ、主よ、あなたは私たちを、あなたの道から迷わせ、私たちの心を、あなたを恐れないほどかたくなにされたのですか。","s":161.388,"e":169.598,"p":false,"h":false},{"t":"あなたのしもべたちのために、あなたの相続地である部族のために、帰って来てください(63:17)。","s":169.884,"e":175.647,"p":false,"h":false},{"t":"あなたの聖なる民が、わずかの間、所有していたのに、私たちの敵は、あなたの聖所を踏みにじりました(63:18)。","s":175.932,"e":183.527,"p":false,"h":false},{"t":"私たちは、昔から、あなたに治められたことのない者、あなたの名で呼ばれたことのない者のようになりました(63:19)。","s":183.816,"e":191.149,"p":true,"h":false},{"t":"各節の解説","s":191.808,"e":193.09,"p":true,"h":false},{"t":"1~6節は、聖書の中でも、特に激しい描写の一つです。","s":193.752,"e":198.665,"p":false,"h":false},{"t":"「エドムから来る者」は、34章のエドムへのさばきを、思い出させます。","s":198.972,"e":203.946,"p":false,"h":false},{"t":"エドムが、神に逆らう世界全体の代表として、読まれることがあります。","s":204.228,"e":209.458,"p":false,"h":false},{"t":"ここで、「酒ぶねを踏む」ことは、さばきの暗示です。","s":209.736,"e":213.227,"p":false,"h":false},{"t":"新約聖書の黙示録19章に、同じような場面があり、キリストの再臨のさばきと結びつけて読まれます。","s":213.516,"e":220.968,"p":true,"h":false},{"t":"3節の、「わたしはひとりで」は、人の助けなしに、主ご自身が、さばきと救いを成し遂げられることを語ります。","s":221.616,"e":229.248,"p":false,"h":false},{"t":"59章16節の、取りなす者がいないという嘆きに対する、答えとして読めます。","s":229.536,"e":235.65,"p":true,"h":false},{"t":"5節は、59章16節と、ほとんど同じ言葉です。","s":236.304,"e":240.704,"p":false,"h":false},{"t":"主ご自身が、救いの働きを担われるという主題が、二度、語られています。","s":240.984,"e":246.673,"p":true,"h":false},{"t":"9節の「いつも主も苦しみ」は、神が、民の苦しみに、無関心ではおられないことを語る、大切な言葉です。","s":247.32,"e":255.641,"p":false,"h":false},{"t":"写本や訳によって、読み方が分かれるところもありますが、主が、民の苦しみに、深く共感されるという意味に、変わりはありません。","s":255.924,"e":264.836,"p":true,"h":false},{"t":"10節の「聖なる霊を悲しませた」は、旧約聖書で、聖霊について、はっきり語られる、数少ない箇所の一つです。","s":265.464,"e":273.944,"p":false,"h":false},{"t":"新約聖書で、パウロが、エペソ人への手紙4章で、聖霊を悲しませてはならないと語るときに、この言葉を踏まえていると、読まれます。","s":274.212,"e":283.981,"p":false,"h":false},{"t":"この「聖なる霊」が、三位一体の聖霊として、どこまで理解されていたのかについては、読み方が分かれます。","s":284.292,"e":291.712,"p":false,"h":false},{"t":"ただし、改革派の伝統は、ここに、聖霊の人格的な働きを、見てきました。","s":291.996,"e":298.264,"p":true,"h":false},{"t":"16節の、「アブラハムは私たちを知らず」は、民が、人間の父祖の名にではなく、神ご自身にだけ、頼る姿を語ります。","s":298.908,"e":307.951,"p":false,"h":false},{"t":"「あなたこそ私たちの父」という呼びかけは、旧約聖書では、珍しい言い方です。","s":308.232,"e":314.088,"p":true,"h":false},{"t":"17節の、「なぜ、迷わせ、かたくなにされたのですか」は、難しい言葉です。","s":314.712,"e":320.667,"p":false,"h":false},{"t":"民が、自分たちの罪の責任を、神に押しつけているのか、神の主権を認めた上で、嘆いているのか、読み方が分かれます。","s":320.976,"e":330.081,"p":false,"h":false},{"t":"ここでも、神の主権と人間の責任の、両方を見ながら読むのが、穏当です。","s":330.372,"e":336.072,"p":true,"h":false}], NAV = {"prev":{"href":"doc62.html","title":"イザヤ書_62章"},"next":{"href":"doc64.html","title":"イザヤ書_64章"},"list":"index.html"};

  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
