(60:11)。","s":112.248,"e":117.618,"p":false,"h":false},{"t":"あなたに仕えない国や王国は、滅びる。","s":117.9,"e":120.709,"p":false,"h":false},{"t":"その国々は、まったく荒れ果てる(60:12)。","s":120.996,"e":123.345,"p":false,"h":false},{"t":"レバノンの栄光、もみの木、すずかけ、糸杉が、わたしの聖所を飾るために、あなたのもとに来る。","s":123.624,"e":130.77,"p":false,"h":false},{"t":"わたしは、わたしの足台の場所を、栄光あるものにする(60:13)。","s":131.04,"e":134.841,"p":true,"h":false},{"t":"あなたを苦しめた者の子らは、身をかがめて、あなたのもとに来、あなたを侮った者はみな、あなたの足の裏にひれ伏して、あなたを「主の町」「イスラエルの聖なる方のシオン」と呼ぶ(60:14)。","s":135.468,"e":147.534,"p":false,"h":false},{"t":"あなたは、見捨てられ、憎まれ、通る人もいなかったが、わたしは、あなたを永遠の誇り、代々の喜びとする(60:15)。","s":147.816,"e":156.192,"p":false,"h":false},{"t":"あなたは、国々の乳を飲み、王たちの乳房を吸う。","s":156.492,"e":160.291,"p":false,"h":false},{"t":"あなたは、わたしが主、あなたの救い主、あなたの贖い主、ヤコブの力ある方であることを知る(60:16)。","s":160.596,"e":167.883,"p":true,"h":false},{"t":"青銅の代わりに金を、鉄の代わりに銀を、木の代わりに青銅を、石の代わりに鉄を持って来る。","s":168.516,"e":175.354,"p":false,"h":false},{"t":"わたしは、あなたの監督を平和とし、あなたを治める者を義とする(60:17)。","s":175.644,"e":180.607,"p":false,"h":false},{"t":"暴虐は、もう、あなたの地で聞かれない。","s":180.9,"e":183.761,"p":false,"h":false},{"t":"荒廃と破滅は、あなたの境界の中にない。","s":184.032,"e":187.258,"p":false,"h":false},{"t":"あなたは、自分の城壁を「救い」、自分の門を「誉れ」と呼ぶ(60:18)。","s":187.56,"e":191.754,"p":false,"h":false},{"t":"昼は、もう、太陽があなたの光とならず、月の輝きも、あなたを照らさない。","s":192.024,"e":197.824,"p":false,"h":false},{"t":"主が、あなたの永遠の光となり、あなたの神が、あなたの輝きとなる(60:19)。","s":198.108,"e":203.41,"p":false,"h":false},{"t":"あなたの太陽は、もう沈まず、あなたの月は、欠けることがない。","s":203.688,"e":208.55,"p":false,"h":false},{"t":"主が、あなたの永遠の光となり、あなたの悲しみの日々は終わるからだ(60:20)。","s":208.836,"e":213.854,"p":false,"h":false},{"t":"あなたの民は、みな義人となり、永遠に地を所有する。","s":214.128,"e":218.222,"p":false,"h":false},{"t":"それは、わたしの植えた若枝、わたしの手のわざ、わたしの栄光を現すためだ(60:21)。","s":218.52,"e":224.133,"p":false,"h":false},{"t":"最も小さい者が、千となり、最も弱い者が、強い国となる。","s":224.424,"e":229.551,"p":false,"h":false},{"t":"わたしは主。","s":229.824,"e":230.652,"p":false,"h":false},{"t":"その時が来れば、わたしは速やかに、これを行う(60:22)。","s":231.732,"e":235.379,"p":true,"h":false},{"t":"各節の解説","s":236.016,"e":237.298,"p":true,"h":false},{"t":"1~3節の「光」は、この章の中心です。","s":237.96,"e":241.423,"p":false,"h":false},{"t":"「起きよ、輝け」という命令は、民が自分の力で光を作り出すことではなく、主の栄光が、先に昇ったから、その光を受けて輝く、ということです。","s":241.74,"e":252.974,"p":false,"h":false},{"t":"2節の、闇が地をおおうという対比は、光が、諸国にも届くことを示します。","s":253.26,"e":259.152,"p":true,"h":false},{"t":"3~9節の、国々が集まる描写は、2章の、すべての民が主の山に流れ込むという幻と、響き合います。","s":259.812,"e":268.366,"p":false,"h":false},{"t":"ここでは、金、乳香、ラクダ、羊、船といった具体的な姿で、語られています。","s":268.668,"e":275.51,"p":false,"h":false},{"t":"新約聖書の、東方の博士たちが、金と乳香を携えて来た場面を、思い起こす人も多くいます。","s":275.796,"e":282.81,"p":false,"h":false},{"t":"ただし、この預言が、どの時期に、どのように成就するのかについては、読み方が分かれます。","s":283.104,"e":289.755,"p":true,"h":false},{"t":"10節の、「怒って打ったが、恵みをもってあわれむ」は、54章7~8節の、ほんのしばらくの怒りと、永遠の恵みの対比を、もう一度語っています。","s":290.376,"e":301.25,"p":true,"h":false},{"t":"11節の「門は絶えず開かれ」は、シオンが、閉じこもる町ではなく、すべての国に開かれた町であることを示します。","s":301.896,"e":310.215,"p":false,"h":false},{"t":"黙示録21章の、新しいエルサレムの門が閉ざされないという描写と、結びつけて読まれることがあります。","s":310.5,"e":317.854,"p":true,"h":false},{"t":"14節の「足の裏にひれ伏して」は、強い表現ですが、シオンが他国を支配するという意味ではなく、かつてシオンを侮った者たちが、シオンの神を、真の神として認める、という意味に読むのが穏当です。","s":318.492,"e":332.09,"p":false,"h":false},{"t":"49章22~23節にも、似た表現があります。","s":332.424,"e":336.916,"p":true,"h":false},{"t":"17~18節の、「監督を平和、治める者を義とする」は、支配する者そのものが、平和と義という性質を持つことを語ります。","s":337.536,"e":347.058,"p":false,"h":false},{"t":"力や暴力で治める社会が、終わることを示します。","s":347.364,"e":351.18,"p":true,"h":false},{"t":"19~20節の、太陽も月も要らず、主が永遠の光となるという約束は、新約聖書の黙示録21~22章で、新しいエルサレムについて、ほとんど同じ言葉で語られます。","s":351.828,"e":365.4,"p":false,"h":false},{"t":"この約束の、完全な成就は、まだ先にあると、教会は読んできました。","s":365.688,"e":371.152,"p":true,"h":false},{"t":"21節の「みな義人となり」は、民の義が、自分の行いではなく、主が植え、主が手ずから造られたものであることを語ります。","s":371.808,"e":380.999,"p":false,"h":false},{"t":"「わたしの植えた若枝」は、11章1節の「若枝」と、つながって読まれることがあります。","s":381.276,"e":387.374,"p":true,"h":false},{"t":"22節の、最も小さい者が千となるという約束は、神の民が、小さな者から増え広がるという、神の働きの姿を語ります。","s":388.008,"e":398.058,"p":true,"h":false}], NAV = {"prev":{"href":"doc59.html","title":"イザヤ書_59章"}   function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
