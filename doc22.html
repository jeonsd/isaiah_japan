  const TITLE = "イザヤ書_22章", AUDIO_SRC = "doc22_2610231055.mp3", DUR = 262, SEGS = [{"t":"イザヤ書22章","s":0,"e":1.514,"p":true,"h":false},{"t":"全体の流れ","s":2.16,"e":3.265,"p":true,"h":false},{"t":"22章は、「幻の谷」、つまりエルサレムに対する宣告です。","s":4.068,"e":8.663,"p":false,"h":false},{"t":"町の人々は、屋上に上って、騒ぎ、浮かれています。","s":8.928,"e":13.118,"p":false,"h":false},{"t":"しかし、その町の人々は、剣で殺されたのではなく、戦わずして死んだのです(22:1-2)。","s":13.392,"e":19.335,"p":false,"h":false},{"t":"指導者たちは皆逃げ、弓を射ることなく捕らえられます(22:3)。","s":19.62,"e":23.415,"p":false,"h":false},{"t":"そこでイザヤは、「私から目をそらしてくれ。","s":23.724,"e":26.586,"p":false,"h":false},{"t":"私は激しく泣く。","s":26.892,"e":28.232,"p":false,"h":false},{"t":"私の民の娘の破滅のことで、私を慰めようとしないでくれ」と嘆きます(22:4)。","s":28.8,"e":34.425,"p":true,"h":false},{"t":"その日は、混乱と踏みにじりと恐慌の日で、主が定められた日です。","s":35.064,"e":39.989,"p":false,"h":false},{"t":"人々は町の城壁を見回り、武器庫の武器を数え、ダビデの町の城壁の破れ目を調べ、水を蓄えます。","s":40.284,"e":48.494,"p":false,"h":false},{"t":"家を壊してまで城壁を補強します(22:5-11前半)。","s":48.78,"e":52.013,"p":false,"h":false},{"t":"しかし、彼らは、この町を造られた方、昔からこれを計画された方を見ようとはしませんでした(22:11後半)。","s":52.308,"e":60.003,"p":true,"h":false},{"t":"主は、その日、泣いて悲しみ、頭を剃って粗布をまとうよう呼びかけられました。","s":60.624,"e":66.203,"p":false,"h":false},{"t":"ところが、人々は喜び楽しんで、牛を殺し、羊をほふり、肉を食べ、酒を飲み、「食べて飲もう。","s":66.492,"e":74.255,"p":false,"h":false},{"t":"どうせ明日は死ぬのだから」と言いました(22:12-13)。","s":74.556,"e":77.124,"p":false,"h":false},{"t":"主は、「この咎は、あなたがたが死ぬまで赦されない」と告げられます(22:14)。","s":77.436,"e":82.25,"p":true,"h":false},{"t":"後半は、宮廷の長であるシェブナへの宣告です。","s":82.872,"e":86.353,"p":false,"h":false},{"t":"シェブナは高い所に墓を掘って、自分の栄誉を求めましたが、主は彼を投げ飛ばされます(22:15-19)。","s":86.652,"e":92.941,"p":false,"h":false},{"t":"その日、主は、ヒルキヤの子エルヤキムを召し、シェブナの衣と帯を着せ、権限を与えられます。","s":93.24,"e":100.221,"p":false,"h":false},{"t":"エルヤキムは、エルサレムの住民とユダの家の父となり、ダビデの家の鍵が彼の肩に置かれます(22:20-22)。","s":100.512,"e":107.199,"p":false,"h":false},{"t":"彼は、確かな所に打ち込まれた釘のようになりますが、その釘に掛けられた重みがあまりに大きくなると、その釘も抜け落ちます(22:23-25)。","s":107.496,"e":116.385,"p":true,"h":false},{"t":"各節の解説","s":117.036,"e":118.318,"p":true,"h":false},{"t":"1節の「幻の谷」は、エルサレムを指すと理解されます。","s":118.98,"e":123.079,"p":false,"h":false},{"t":"聖なる都が、他の国々と同じように、さばきの宣告を受ける対象になっています。","s":123.372,"e":129.463,"p":false,"h":false},{"t":"神の都だからといって、さばきを免れるのではない、という厳しさがここにあります。","s":129.744,"e":135.624,"p":true,"h":false},{"t":"2節の「戦わずして死んだ」は、剣で倒れたのではなく、飢えや疫病で死んだのだと読まれることがあります。","s":136.26,"e":143.473,"p":false,"h":false},{"t":"詳しい状況は、この言葉からは確定できません。","s":143.748,"e":147.461,"p":true,"h":false},{"t":"8~11節の城壁の見回りや水の貯えは、人間の備えをすべて尽くしている姿です。","s":148.104,"e":154.776,"p":false,"h":false},{"t":"それ自体は悪いことではありませんが、「この町を造られた方」に目を向けなかったことが、問題とされています。","s":155.052,"e":162.239,"p":false,"h":false},{"t":"備えと信頼は、別のものです。","s":162.54,"e":164.953,"p":true,"h":false},{"t":"12~13節の「食べて飲もう。","s":165.6,"e":168.026,"p":false,"h":false},{"t":"どうせ明日は死ぬのだから」は、悔い改めを求められた時に、逆に享楽に走る姿です。","s":168.336,"e":174.903,"p":false,"h":false},{"t":"この言葉は、新約聖書のパウロが、復活を否定する議論の中で引いています。","s":175.212,"e":180.831,"p":false,"h":false},{"t":"神の呼びかけを聞いても、自分の快楽を選ぶ心の硬さが、ここで示されています。","s":181.116,"e":187.164,"p":true,"h":false},{"t":"14節の「この咎は死ぬまで赦されない」は、罪の重大さを語る言葉です。","s":187.812,"e":193.384,"p":false,"h":false},{"t":"悔い改めの機会が与えられたのに、それを拒んだ民への、最後通告のように響きます。","s":193.68,"e":199.822,"p":true,"h":false},{"t":"15~19節のシェブナは、宮廷の長という高い地位にありながら、自分の栄誉を求めた人です。","s":200.448,"e":207.662,"p":false,"h":false},{"t":"権力を持つ者が、神のしもべではなく、自分の名のために働くとき、主はその地位を取り去られます。","s":207.936,"e":215.159,"p":true,"h":false},{"t":"20~22節のエルヤキムは、シェブナに代わる、忠実な家臣として描かれます。","s":215.784,"e":221.691,"p":false,"h":false},{"t":"「ダビデの家の鍵」を与えられるという言葉は、新約聖書で、キリストが「ダビデの鍵を持つ方」と呼ばれる場面と結びつけて読まれます。","s":221.976,"e":231.127,"p":false,"h":false},{"t":"ただし、ここでは、歴史上のエルヤキムの任命と、のちのキリストを指す読み方を、区別して考える必要があります。","s":231.408,"e":239.797,"p":true,"h":false},{"t":"23~25節の釘の描写は、解釈が難しいところです。","s":240.444,"e":245.47,"p":false,"h":false},{"t":"エルヤキムが、確かな所に打ち込まれた釘のようになるのに、後にその釘が抜け落ちると言われます。","s":245.772,"e":252.524,"p":false,"h":false},{"t":"この最後の釘が誰を指すのかは、読み方が分かれます。","s":252.828,"e":256.671,"p":false,"h":false},{"t":"エルヤキムに頼りすぎた一族への警告と読む立場が多く見られます。","s":256.968,"e":261.383,"p":true,"h":false}], NAV = {"prev":{"href":"doc21.html","title":"イザヤ書_21章"},"next":{"href":"doc23.html","title":"イザヤ書_23章"},"list":"index.html"};

  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  applyFs(); applySpd();

  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {

  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }

  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */

    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
