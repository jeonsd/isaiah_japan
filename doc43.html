(function () {
  const TITLE = "イザヤ書_43章", AUDIO_SRC = "doc43_2610231055.mp3", DUR = 434, SEGS = [{"t":"イザヤ書43章","s":0,"e":1.623,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"「しかし、今」と、43章は始まります。","s":4.176,"e":7.52,"p":false,"h":false},{"t":"「ヤコブよ、あなたを創造した主、イスラエルよ、あなたを形造った方が、こう言われる。","s":7.812,"e":13.708,"p":false,"h":false},{"t":"恐れるな。","s":14.004,"e":14.715,"p":false,"h":false},{"t":"わたしがあなたを贖った。","s":15.912,"e":17.427,"p":false,"h":false},{"t":"わたしはあなたの名を呼んだ。","s":17.82,"e":19.552,"p":false,"h":false},{"t":"あなたはわたしのもの」(43:1)。","s":19.836,"e":21.202,"p":false,"h":false},{"t":"水の中を過ぎるときも、わたしがあなたとともにいる。","s":21.744,"e":25.223,"p":false,"h":false},{"t":"川の中も、あなたは押し流されない。","s":25.524,"e":27.94,"p":false,"h":false},{"t":"火の中を歩いても、あなたは焼かれず、炎もあなたに燃えつかない(43:2)。","s":28.224,"e":32.652,"p":false,"h":false},{"t":"わたしが主、あなたの神、イスラエルの聖なる方、あなたの救い主だからです。","s":32.94,"e":38.554,"p":false,"h":false},{"t":"わたしは、エジプトをあなたの身代金とし、クシュとセバをあなたの代わりとした(43:3)。","s":38.844,"e":44.281,"p":false,"h":false},{"t":"あなたは、わたしの目に高価で、尊い。","s":44.568,"e":47.523,"p":false,"h":false},{"t":"わたしはあなたを愛している。","s":47.808,"e":49.492,"p":false,"h":false},{"t":"だから、人をあなたの代わりに、国民をあなたのいのちの代わりに与える(43:4)。","s":49.788,"e":54.71,"p":true,"h":false},{"t":"恐れるな。","s":55.332,"e":56.043,"p":false,"h":false},{"t":"わたしはあなたとともにいる。","s":57.24,"e":58.918,"p":false,"h":false},{"t":"わたしは、東から、西から、あなたの子孫を連れて来る。","s":59.22,"e":63.397,"p":false,"h":false},{"t":"北にも南にも言う。","s":63.684,"e":65.161,"p":false,"h":false},{"t":"「引き渡せ。","s":65.592,"e":66.388,"p":false,"h":false},{"t":"引き止めるな。","s":67.5,"e":68.361,"p":false,"h":false},{"t":"わたしの息子たちを遠くから、わたしの娘たちを地の果てから連れて来い。","s":69.408,"e":74.304,"p":false,"h":false},{"t":"わたしの名で呼ばれる者、わたしが栄光のために創造し、形造った者を」(43:5-7)。","s":74.592,"e":80.117,"p":true,"h":false},{"t":"主は、再び法廷を開かれます。","s":80.748,"e":83.297,"p":false,"h":false},{"t":"「目があっても見えない民、耳があっても聞こえない民を連れ出せ」。","s":83.592,"e":87.786,"p":false,"h":false},{"t":"国々は集まり、民は寄り集まるがよい。","s":88.092,"e":91.022,"p":false,"h":false},{"t":"彼らのうち、だれがこのことを告げ、先の事を聞かせるのか(43:8-9)。","s":91.296,"e":95.609,"p":false,"h":false},{"t":"「あなたがたは、わたしの証人。","s":95.904,"e":98.103,"p":false,"h":false},{"t":"わたしが選んだわたしのしもべ。","s":98.388,"e":100.281,"p":false,"h":false},{"t":"それは、あなたがたが知って、わたしを信じ、わたしこそそれであることを悟るためだ。","s":100.548,"e":106.305,"p":false,"h":false},{"t":"わたしより前に造られた神はなく、わたしより後にも、ない。","s":106.596,"e":110.837,"p":false,"h":false},{"t":"わたしこそ主、わたしのほかに救い主はいない」(43:10-11)。","s":111.132,"e":114.382,"p":false,"h":false},{"t":"わたしが告げ、救い、聞かせた。","s":114.66,"e":117.039,"p":false,"h":false},{"t":"あなたがたの間に、他の神はいなかった。","s":117.324,"e":120.28,"p":false,"h":false},{"t":"あなたがたはわたしの証人。","s":120.564,"e":122.436,"p":false,"h":false},{"t":"わたしは神である。","s":122.724,"e":123.948,"p":false,"h":false},{"t":"今日からも、わたしはそれである。","s":124.632,"e":126.681,"p":false,"h":false},{"t":"わたしの手から救い出せる者はいない。","s":126.972,"e":129.324,"p":false,"h":false},{"t":"わたしが行うとき、だれがこれを元に戻せるだろうか(43:12-13)。","s":129.6,"e":133.283,"p":true,"h":false},{"t":"主は、バビロンに言われます。","s":133.92,"e":135.857,"p":false,"h":false},{"t":"あなたがたのために、バビロンに人を送り、閂をみな外させる。","s":136.152,"e":140.614,"p":false,"h":false},{"t":"カルデア人の叫びは、嘆きに変わる(43:14)。","s":140.904,"e":143.509,"p":false,"h":false},{"t":"「わたしは主、あなたがたの聖なる者、イスラエルの創造者、あなたがたの王」(43:15)。","s":143.784,"e":149.242,"p":false,"h":false},{"t":"海の中に道を、激しい水の中に通り道を設けられた主、戦車と馬、軍勢と勇士を共に引き出された主は、彼らが倒れて、二度と起き上がれず、灯心のように消え去ると言われます(43:16-17)。","s":149.544,"e":163.088,"p":false,"h":false},{"t":"「先の事を思い出すな。","s":163.368,"e":164.917,"p":false,"h":false},{"t":"昔のことに心を留めるな。","s":165.276,"e":167.232,"p":false,"h":false},{"t":"見よ、わたしは新しいことをする。","s":167.544,"e":169.957,"p":false,"h":false},{"t":"今、それが芽生えている。","s":170.244,"e":171.966,"p":false,"h":false},{"t":"あなたがたは、それを知らないのか。","s":172.26,"e":174.553,"p":false,"h":false},{"t":"荒れ野に道を、砂漠に川を設ける」(43:18-19)。","s":174.852,"e":177.454,"p":false,"h":false},{"t":"野の獣も、山犬も、だちょうも、わたしをあがめる。","s":177.732,"e":181.686,"p":false,"h":false},{"t":"わたしが、荒れ野に水を、砂漠に川を与え、わたしの選んだ民に飲ませるからだ。","s":181.98,"e":187.743,"p":false,"h":false},{"t":"わたしが自分のために形造ったこの民は、わたしの誉れを語り告げる(43:20-21)。","s":188.028,"e":192.976,"p":true,"h":false},{"t":"しかし、ヤコブよ、あなたはわたしを呼び求めなかった。","s":193.608,"e":197.215,"p":false,"h":false},{"t":"イスラエルよ、あなたはわたしに疲れた。","s":197.496,"e":199.907,"p":false,"h":false},{"t":"あなたは全焼のいけにえの羊をわたしに持って来ず、いけにえでわたしをあがめなかった。","s":200.196,"e":205.679,"p":false,"h":false},{"t":"わたしは、穀物のささげ物であなたを苦しめず、乳香であなたを疲れさせなかった。","s":205.956,"e":211.95,"p":false,"h":false},{"t":"ところが、あなたは、わたしを罪で苦しめ、咎でわたしを疲れさせた(43:22-24)。","s":212.22,"e":217.315,"p":false,"h":false},{"t":"それでも、「わたし、このわたしは、わたし自身のために、あなたの背きの罪をぬぐい去り、あなたの罪を思い出さない」(43:25)。","s":217.584,"e":225.901,"p":false,"h":false},{"t":"わたしに思い出させよ。","s":226.188,"e":227.637,"p":false,"h":false},{"t":"共に論じ合おう。","s":228.096,"e":229.298,"p":false,"h":false},{"t":"あなたが義とされるために、あなたの言い分を述べよ(43:26)。","s":230.004,"e":233.39,"p":false,"h":false},{"t":"あなたの最初の先祖は罪を犯し、あなたの代言者たちは、わたしに背いた。","s":233.676,"e":239.238,"p":false,"h":false},{"t":"だから、わたしは、聖所の首長たちを汚し、ヤコブを滅びに、イスラエルを嘲りに渡した(43:27-28)。","s":239.544,"e":246.212,"p":true,"h":false},{"t":"各節の解説","s":246.852,"e":248.134,"p":true,"h":false},{"t":"1節の「しかし、今」は、42章の終わりの、さばきの宣告から、一気に慰めへと向きを変える言葉です。","s":248.796,"e":256.681,"p":false,"h":false},{"t":"神は、さばきの後で終わらず、「今」、救いの言葉を語られます。","s":256.968,"e":261.344,"p":false,"h":false},{"t":"「あなたはわたしのもの」という言葉は、救いの根拠が、神の所有と愛にあることを示します。","s":261.648,"e":268.088,"p":true,"h":false},{"t":"2節の、水の中、火の中を過ぎる約束は、苦難がなくなるという約束ではありません。","s":268.74,"e":275.183,"p":false,"h":false},{"t":"苦難の中を通るときに、神がともにおられる、という約束です。","s":275.508,"e":280.163,"p":false,"h":false},{"t":"出エジプトの海や、のちのバビロンの炉の出来事を思い出させます。","s":280.476,"e":284.87,"p":true,"h":false},{"t":"3~4節の「身代金」という言葉は、解釈が難しいところです。","s":285.516,"e":290.666,"p":false,"h":false},{"t":"エジプト、クシュ、セバが、イスラエルの代わりに与えられる、という言い方は、神が歴史を動かして、イスラエルを救い出される、という意味に読まれます。","s":290.952,"e":300.976,"p":false,"h":false},{"t":"ただし、これを、そのまま他の国々の価値が低いという意味に読むべきではありません。","s":301.284,"e":306.957,"p":false,"h":false},{"t":"神の愛の深さを、人間の言葉で、強く語っている表現です。","s":307.26,"e":311.813,"p":true,"h":false},{"t":"10~11節の「あなたがたはわたしの証人」は、この章の中心です。","s":312.48,"e":317.612,"p":false,"h":false},{"t":"「わたしのほかに救い主はいない」という言葉は、イザヤ書の後半を貫く、神の唯一性の宣言です。","s":317.916,"e":325.123,"p":false,"h":false},{"t":"新約聖書の、「救いは他のだれによっても与えられない」という言葉と響き合うと、読まれることがあります。","s":325.404,"e":332.508,"p":true,"h":false},{"t":"16~17節の、海に道を開かれた主という言い方は、出エジプトの出来事を指しています。","s":333.144,"e":339.764,"p":false,"h":false},{"t":"ここから、18節の、「先の事を思い出すな」という言葉が来ます。","s":340.056,"e":344.897,"p":false,"h":false},{"t":"これは、出エジプトを忘れよという意味ではありません。","s":345.168,"e":348.609,"p":false,"h":false},{"t":"新しい救いが、それを超えるほど大きいので、過去の栄光だけに心を留めてはならない、という意味に読まれます。","s":348.912,"e":356.198,"p":true,"h":false},{"t":"19節の「新しいこと」は、バビロンからの帰還を指すとともに、さらに後の、新しい救いも含むと読まれます。","s":356.868,"e":364.643,"p":false,"h":false},{"t":"新約聖書では、「新しい契約」「新しい創造」という言葉との関連が指摘されます。","s":364.932,"e":371.075,"p":false,"h":false},{"t":"ただし、どこまでを含むかは、読み方が分かれます。","s":371.376,"e":375.063,"p":true,"h":false},{"t":"22~24節は、民の不信仰を、はっきり指摘します。","s":375.696,"e":380.262,"p":false,"h":false},{"t":"ここでは、民が、いけにえを持って来なかったことではなく、心が神から離れていたことが問題とされています。","s":380.556,"e":388.083,"p":true,"h":false},{"t":"25節は、この章の頂点です。","s":388.728,"e":391.392,"p":false,"h":false},{"t":"「わたし、このわたしは、わたし自身のために、あなたの背きの罪をぬぐい去る」と語られます。","s":391.68,"e":398.21,"p":false,"h":false},{"t":"赦しの根拠は、民の悔い改めや行いではなく、神ご自身にあります。","s":398.484,"e":403.777,"p":false,"h":false},{"t":"「わたし自身のために」とあるのは、神の名の栄光のために、ということです。","s":404.064,"e":409.124,"p":false,"h":false},{"t":"改革派の神学が、救いは神の恵みだけによる、と語るときに、よく引かれる言葉です。","s":409.428,"e":415.879,"p":true,"h":false},{"t":"27~28節の、「最初の先祖」が誰を指すかは、はっきりしません。","s":416.556,"e":421.904,"p":false,"h":false},{"t":"アダムを指す読み方、ヤコブを指す読み方、民の歴史の初めを広く指す読み方があります。","s":422.208,"e":428.581,"p":false,"h":false},{"t":"どれを取っても、民の罪が、最初から続いてきたことを語っています。","s":428.868,"e":433.687,"p":true,"h":false}], NAV = {"prev":{"href":"doc42.html","title":"イザヤ書_42章"},"next":{"href":"doc44.html","title":"イザヤ書_44章"},"list":"index.html"};

  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  /* 글 그리기 */
  (function build() {
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }

    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
