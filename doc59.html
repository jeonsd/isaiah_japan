(function () {
  const TITLE = "イザヤ書_59章", AUDIO_SRC = "doc59_2610231055.mp3", DUR = 370, SEGS = [{"t":"イザヤ書59章","s":0,"e":1.601,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"59章は、主の力についての宣言から始まります。","s":4.176,"e":8.332,"p":false,"h":false},{"t":"「見よ、主の御手は短くて、救えないのではない。","s":8.64,"e":12.052,"p":false,"h":false},{"t":"主の耳は遠くて、聞こえないのではない」(59:1)。","s":12.312,"e":15.05,"p":false,"h":false},{"t":"むしろ、あなたがたの咎が、あなたがたと神との間を隔て、あなたがたの罪が、御顔を隠させ、聞いてくださらないようにしているのです(59:2)。","s":15.336,"e":24.605,"p":false,"h":false},{"t":"あなたがたの手は血で汚れ、指は咎で汚れ、くちびるは偽りを語り、舌は不正をつぶやいています(59:3)。","s":24.912,"e":32.055,"p":false,"h":false},{"t":"だれも正しく訴えず、むなしいものに頼り、偽りを語り、害悪をはらんで、不法を産みます(59:4)。","s":32.364,"e":39.17,"p":true,"h":false},{"t":"彼らは、毒蛇の卵をかえし、蜘蛛の巣を織ります。","s":39.816,"e":43.758,"p":false,"h":false},{"t":"その卵を食べる者は死に、それが砕かれると、蛇が飛び出します(59:5)。","s":44.028,"e":48.817,"p":false,"h":false},{"t":"その巣は、衣服になりません。","s":49.104,"e":51.171,"p":false,"h":false},{"t":"彼らの行いは、不法の行いで、その手には暴虐のわざがあります(59:6)。","s":51.48,"e":56.361,"p":false,"h":false},{"t":"彼らの足は、悪に走り、罪のない血を流すことに急ぎ、その思いは不義の思いで、荒廃と破滅が、その道筋にあります(59:7)。","s":56.628,"e":66.072,"p":false,"h":false},{"t":"彼らは、平和の道を知らず、その歩みに公正はありません。","s":66.348,"e":70.736,"p":false,"h":false},{"t":"曲がった道を作り、これを歩む者はみな、平和を知りません(59:8)。","s":71.028,"e":75.351,"p":true,"h":false},{"t":"ここで、民が告白をします。","s":75.996,"e":78.164,"p":false,"h":false},{"t":"「それゆえ、公正は私たちから遠く離れ、義は私たちに追いつかない。","s":78.444,"e":83.479,"p":false,"h":false},{"t":"私たちは光を待ち望むが、闇ばかりで、輝きを待ち望むが、暗がりを歩む」(59:9)。","s":83.772,"e":89.911,"p":false,"h":false},{"t":"私たちは、盲人のように壁を手探りし、目のない者のように手探りします。","s":90.216,"e":95.772,"p":false,"h":false},{"t":"真昼にも、夕暮れのようにつまずき、強健な者の中で、死人のようです(59:10)。","s":96.084,"e":101.479,"p":false,"h":false},{"t":"私たちはみな、熊のようにうなり、鳩のようにうめきます。","s":101.772,"e":105.802,"p":false,"h":false},{"t":"公正を待ち望んでも、それはなく、救いを待ち望んでも、それは遠く離れています(59:11)。","s":106.092,"e":111.959,"p":false,"h":false},{"t":"「私たちの背きは、あなたの前で増し、私たちの罪は、私たちに不利な証言をします。","s":112.248,"e":118.916,"p":false,"h":false},{"t":"私たちの背きは、私たちとともにあり、私たちは自分の咎を知っています」(59:12)。","s":119.196,"e":124.625,"p":false,"h":false},{"t":"主に背き、主を否み、神に従うことから、離れ去り、しいたげと反逆を語り、心に偽りのことばをはらんで語りました(59:13)。","s":124.92,"e":134.082,"p":false,"h":false},{"t":"公正は退けられ、義は遠くに立ち、真実は広場でつまずき、正直は入ることができません(59:14)。","s":134.352,"e":141.551,"p":false,"h":false},{"t":"真実は失われ、悪から離れる者は、略奪の的になります(59:15)。","s":141.84,"e":146.619,"p":true,"h":false},{"t":"主はこれを見て、公正がないことを、悪とされました(59:15)。","s":147.24,"e":150.858,"p":false,"h":false},{"t":"主は、ひとりの人もいないのを見、取りなす者がいないのに驚かれました。","s":151.128,"e":156.048,"p":false,"h":false},{"t":"それで、主ご自身の腕が、主に救いをもたらし、主の義が、主を支えました(59:16)。","s":156.348,"e":162.193,"p":false,"h":false},{"t":"主は、義を胸当てとして着、救いのかぶとを頭にかぶり、復讐の衣を着て、熱情を外套としてまとわれました(59:17)。","s":162.468,"e":170.932,"p":false,"h":false},{"t":"その行いに応じて、敵には憤りを、敵対する者には報復を、島々には報いを与えられます(59:18)。","s":171.216,"e":178.472,"p":false,"h":false},{"t":"そのとき、西のほうでは主の御名を恐れ、日の昇るほうでは、主の栄光を恐れます。","s":178.776,"e":184.891,"p":false,"h":false},{"t":"主は、せき止められた川のように来られ、主の霊が、これを駆り立てられるからです(59:19)。","s":185.184,"e":190.917,"p":true,"h":false},{"t":"「贖う者がシオンに来る。","s":191.556,"e":193.095,"p":false,"h":false},{"t":"ヤコブの中で、背きを悔い改める者たちのところに」と、主は言われます(59:20)。","s":193.464,"e":198.601,"p":false,"h":false},{"t":"「これは、わたしが彼らと結ぶ契約。","s":198.9,"e":201.593,"p":false,"h":false},{"t":"わたしの霊があなたの上にあり、わたしがあなたの口に置いたわたしのことばは、あなたの口から、あなたの子孫の口から、その子孫の子孫の口から、今よりとこしえまで、離れない」と、主は言われます(59:21)。","s":201.888,"e":215.519,"p":true,"h":false},{"t":"各節の解説","s":216.18,"e":217.462,"p":true,"h":false},{"t":"1~2節は、民の苦しみの原因が、神の力不足ではなく、民の罪にあることを、はっきり示します。","s":218.124,"e":225.967,"p":false,"h":false},{"t":"50章2節の、「わたしの手は短いのか」という問いと、同じ流れにあります。","s":226.26,"e":231.554,"p":false,"h":false},{"t":"罪が、神と人の間を隔てるという教えは、聖書全体を貫く大切な教えです。","s":231.84,"e":238.263,"p":true,"h":false},{"t":"5~6節の毒蛇と蜘蛛の巣の描写は、悪の働きが、見かけは何かを作っているようで、実際には、何の役にも立たず、かえって害を生むことを、表しています。","s":238.896,"e":250.789,"p":true,"h":false},{"t":"9~15節の告白は、「彼ら」から「私たち」に変わります。","s":251.424,"e":255.918,"p":false,"h":false},{"t":"預言者自身も、民とともに罪を認めています。","s":256.212,"e":259.73,"p":false,"h":false},{"t":"ここは、共同体全体で、罪を告白する祈りの姿として、読まれます。","s":260.028,"e":265.664,"p":false,"h":false},{"t":"自分は別だ、という立場から語るのではなく、民とともに悔い改める姿勢が、示されています。","s":265.968,"e":273.01,"p":true,"h":false},{"t":"15~16節の、取りなす者がいないという嘆きは、53章12節の、「とりなしをした」しもべへの、伏線として読まれることがあります。","s":273.672,"e":283.628,"p":false,"h":false},{"t":"人の中に、取りなす者がいないので、神ご自身が、救いを成し遂げられます。","s":283.932,"e":289.288,"p":true,"h":false},{"t":"17節の、主が義を胸当て、救いをかぶととされる描写は、新約聖書で、パウロが、エペソ人への手紙6章で、信徒が身につける、神の武具について語るとき、同じような言葉を使っています。","s":289.908,"e":304.24,"p":false,"h":false},{"t":"ここでは、主ご自身が、戦士として来られる姿です。","s":304.524,"e":308.503,"p":true,"h":false},{"t":"19節は、解釈の分かれる箇所です。","s":309.168,"e":312.162,"p":false,"h":false},{"t":"「せき止められた川のように来られ」という言葉は、主の来臨が、抑えられた水が一気に流れ出すように、力強く、勢いのあるものであることを示します。","s":312.444,"e":323.148,"p":false,"h":false},{"t":"主の霊が、これを駆り立てる、という読み方と、主の霊が、敵に対する旗を揚げる、という読み方に分かれます。","s":323.424,"e":331.698,"p":true,"h":false},{"t":"20節の「贖う者がシオンに来る」は、新約聖書で、パウロが、ローマ人への手紙11章で、イスラエルの救いについて語るとき、引いています。","s":332.352,"e":342.469,"p":false,"h":false},{"t":"ここで、「悔い改める者たち」とあることから、この約束が、悔い改める者に向けられていることが分かります。","s":342.756,"e":350.135,"p":false,"h":false},{"t":"この節の成就が、どのような形を取るのかについては、読み方が分かれます。","s":350.424,"e":355.817,"p":true,"h":false},{"t":"21節の「わたしの霊があなたの上にあり」は、民全体に、神の霊と神のことばが、代々受け継がれるという約束です。","s":356.472,"e":365.252,"p":false,"h":false},{"t":"これは、新しい契約の約束として、読まれます。","s":365.544,"e":369.201,"p":true,"h":false}], NAV = {"prev":{"href":"doc58.html","title":"イザヤ書_58章"},"next":{"href":"doc60.html","title":"イザヤ書_60章"},"list":"index.html"};

      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
