false,"h":false},{"t":"「主よ、これらによって人は生き、私の霊のいのちも、すべてこれらの中にあります。","s":90.108,"e":95.963,"p":false,"h":false},{"t":"私を癒やし、生かしてください」(38:16)。","s":96.264,"e":98.435,"p":true,"h":false},{"t":"最後に、彼は言います。","s":99.072,"e":100.8,"p":false,"h":false},{"t":"「見よ、私の苦しみは平安のためであった。","s":101.088,"e":104.194,"p":false,"h":false},{"t":"あなたは、滅びの穴から私のいのちを引き戻された。","s":104.472,"e":108.235,"p":false,"h":false},{"t":"あなたが、私のすべての罪を、あなたの背後に投げ捨てられたからです」(38:17)。","s":108.54,"e":113.22,"p":false,"h":false},{"t":"陰府はあなたに感謝せず、死はあなたをほめたたえません。","s":113.508,"e":117.229,"p":false,"h":false},{"t":"しかし、生きている者、生きている者こそ、今日の私のように、あなたに感謝します(38:18-19)。","s":117.54,"e":123.458,"p":false,"h":false},{"t":"主は私を救ってくださる。","s":123.768,"e":125.561,"p":false,"h":false},{"t":"私たちは生きている限り、主の宮で、琴に合わせて歌う(38:20)。","s":125.856,"e":130.156,"p":false,"h":false},{"t":"イザヤは、いちじくの練り物を腫れ物に当てるよう命じ、ヒゼキヤは癒やされます(38:21)。","s":130.464,"e":135.755,"p":false,"h":false},{"t":"ヒゼキヤは、「主の宮に上れるというしるしは何ですか」と尋ねていました(38:22)。","s":136.044,"e":140.963,"p":true,"h":false},{"t":"各節の解説","s":141.624,"e":142.906,"p":true,"h":false},{"t":"1節の「死ぬ。","s":143.568,"e":144.678,"p":false,"h":false},{"t":"治らない」という宣告は、ヒゼキヤの祈りによって、取り消されます。","s":145.476,"e":149.943,"p":false,"h":false},{"t":"これは、神のことばが、民の祈りに応答して変わることがある、という点で、読み方が分かれる箇所です。","s":150.228,"e":157.648,"p":false,"h":false},{"t":"改革派の伝統は、神の永遠の計画は変わらず、祈りも、その計画の中で神が用いられる手段だと理解してきました。","s":157.932,"e":166.762,"p":true,"h":false},{"t":"3節の「真実と全き心をもって歩んだ」という祈りは、自分の功績を主張するように聞こえます。","s":167.4,"e":174.28,"p":false,"h":false},{"t":"しかし、これは、神への信頼の中で歩んできた者が、その歩みを神に訴える言葉として読むのが、穏当です。","s":174.564,"e":182.689,"p":false,"h":false},{"t":"救いの根拠は、ヒゼキヤの行いでなく、後の17節が語るように、神の赦しにあります。","s":182.988,"e":189.774,"p":true,"h":false},{"t":"5~6節の「十五年」の延命は、この町の救いの約束と、結びつけて語られます。","s":190.404,"e":196.744,"p":false,"h":false},{"t":"この出来事の時期が、アッシリアの侵攻のどの時点かについては、聖書学者の間で見方が分かれます。","s":197.028,"e":204.323,"p":true,"h":false},{"t":"8節の「日時計の影が戻る」しるしは、天体の動きが主の支配のもとにあることを示します。","s":204.984,"e":211.652,"p":false,"h":false},{"t":"どのような自然現象   $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
