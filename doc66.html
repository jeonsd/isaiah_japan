<script>
(function () {
  const TITLE = "イザヤ書_66章", AUDIO_SRC = "doc66_2610231055.mp3", DUR = 460, SEGS = [{"t":"イザヤ書66章","s":0,"e":1.648,"p":true,"h":false},{"t":"全体の流れ","s":2.304,"e":3.409,"p":true,"h":false},{"t":"66章は、主の言葉で始まります。","s":4.212,"e":7.206,"p":false,"h":false},{"t":"「天はわたしの王座、地はわたしの足台。","s":7.488,"e":10.251,"p":false,"h":false},{"t":"あなたがたは、どこに、わたしのために家を建てるのか。","s":10.548,"e":14.267,"p":false,"h":false},{"t":"どこに、わたしのいこいの場があるのか」(66:1)。","s":14.58,"e":17.106,"p":false,"h":false},{"t":"これらはみな、わたしの手が造り、これらはみな、わたしのものだ。","s":17.388,"e":21.882,"p":false,"h":false},{"t":"しかし、わたしが目を留めるのは、苦しむ者、霊の砕かれた者、わたしのことばにおののく者だ(66:2)。","s":22.176,"e":29.181,"p":true,"h":false},{"t":"一方、牛を屠る者は、人を打ち殺す者のようで、羊をささげる者は、犬の首を折る者のようです。","s":29.808,"e":37.265,"p":false,"h":false},{"t":"彼らは、自分の道を選び、その心は、忌むべきものを喜びとしています(66:3)。","s":37.548,"e":43.208,"p":false,"h":false},{"t":"だから、わたしも、彼らへの懲らしめを選び、彼らが恐れることを、彼らにもたらす。","s":43.488,"e":49.494,"p":false,"h":false},{"t":"わたしが呼んだのに、答える者はなく、わたしが語ったのに、聞く者はいなかったからだ(66:4)。","s":49.788,"e":55.683,"p":true,"h":false},{"t":"主のことばに、おののく者たちよ、聞け。","s":56.304,"e":59.115,"p":false,"h":false},{"t":"あなたがたの兄弟たちは、あなたがたを憎み、わたしの名のゆえに、あなたがたを追い出して言う。","s":59.4,"e":65.792,"p":false,"h":false},{"t":"「主が栄光を現されるように。","s":66.096,"e":68.06,"p":false,"h":false},{"t":"私たちは、あなたがたの喜びを見よう」。","s":68.364,"e":71.376,"p":false,"h":false},{"t":"しかし、恥を見るのは、彼らのほうだ(66:5)。","s":71.676,"e":74.648,"p":false,"h":false},{"t":"町から騒ぎの声が、宮から声が聞こえる。","s":74.952,"e":78.149,"p":false,"h":false},{"t":"主が、敵に報いておられる声だ(66:6)。","s":78.408,"e":80.841,"p":true,"h":false},{"t":"産みの苦しみが来る前に、シオンは産んだ。","s":81.468,"e":84.356,"p":false,"h":false},{"t":"陣痛が来る前に、男の子を産んだ。","s":84.636,"e":87.18,"p":false,"h":false},{"t":"だれが、このようなことを聞いただろうか。","s":87.48,"e":90.12,"p":false,"h":false},{"t":"国が、一日で生まれるだろうか。","s":90.396,"e":92.629,"p":false,"h":false},{"t":"シオンは、産みの苦しみをするや否や、その子らを産んだ(66:7-8)。","s":92.916,"e":96.959,"p":false,"h":false},{"t":"「わたしが、産もうとして、産ませないことがあろうか」と主は言われる(66:9)。","s":97.272,"e":101.583,"p":false,"h":false},{"t":"エルサレムを愛する者はみな、ともに喜び、ともに楽しめ。","s":101.88,"e":106.22,"p":false,"h":false},{"t":"彼女のために悲しんだ者は、ともに喜べ(66:10)。","s":106.524,"e":109.62,"p":false,"h":false},{"t":"それは、あなたがたが、その慰めの乳房から飲んで満ち足り、その豊かな栄光から飲んで、喜びを得るためだ(66:11)。","s":109.908,"e":117.683,"p":true,"h":false},{"t":"主は言われます。","s":118.332,"e":119.371,"p":false,"h":false},{"t":"「見よ、わたしは、川のように、平和を彼女に与え、あふれる流れのように、国々の栄光を与える。","s":120.24,"e":127.449,"p":false,"h":false},{"t":"あなたがたは、乳を飲み、腕に抱かれ、膝の上であやされる。","s":127.728,"e":132.151,"p":false,"h":false},{"t":"母に慰められる者のように、わたしもあなたがたを慰める。","s":132.444,"e":136.586,"p":false,"h":false},{"t":"あなたがたは、エルサレムで慰められる」(66:12-13)。","s":136.872,"e":139.582,"p":false,"h":false},{"t":"あなたがたは見て、心は喜び、あなたがたの骨は、若草のように生き返る。","s":139.86,"e":145.538,"p":false,"h":false},{"t":"主の手は、そのしもべたちに知られ、その憤りは、敵に知られる(66:14)。","s":145.836,"e":150.743,"p":true,"h":false},{"t":"見よ、主は火のうちに来られる。","s":151.38,"e":153.515,"p":false,"h":false},{"t":"その戦車は、つむじ風のようだ。","s":153.792,"e":156.122,"p":false,"h":false},{"t":"主は、憤りをもって怒りを注ぎ、火の炎をもって叱責される(66:15)。","s":156.42,"e":161.243,"p":false,"h":false},{"t":"主は火をもって、すべての肉なる者を、剣をもってさばかれ、主に殺される者は多い(66:16)。","s":161.532,"e":167.606,"p":false,"h":false},{"t":"園で身をきよめる儀式をして、忌むべきものを食べる者たちも、ともに終わりを迎えます(66:17)。","s":167.904,"e":173.785,"p":true,"h":false},{"t":"主は、国々と、あらゆる国語の民を、集めに来られます。","s":174.42,"e":178.44,"p":false,"h":false},{"t":"彼らは来て、わたしの栄光を見る(66:18)。","s":178.704,"e":181.05,"p":false,"h":false},{"t":"わたしは、彼らの中にしるしを置き、逃れた者たちを、タルシシュ、プル、ルデ、トバル、ヤワン、遠い島々に遣わす。","s":181.332,"e":190.552,"p":false,"h":false},{"t":"彼らは、わたしの栄光を、諸国民の間に告げ知らせる(66:19)。","s":190.836,"e":194.971,"p":false,"h":false},{"t":"彼らは、すべての国々から、あなたがたの兄弟たちを、主へのささげ物として、馬、戦車、荷車、らば、ラクダに乗せて、エルサレムの、わたしの聖なる山に連れて来る(66:20)。","s":195.264,"e":208.017,"p":false,"h":false},{"t":"わたしは、その中から、祭司、レビ人を選ぶ(66:21)。","s":208.296,"e":212.007,"p":true,"h":false},{"t":"「わたしが造る新しい天と新しい地が、わたしの前にいつまでも続くように、あなたがたの子孫と、あなたがたの名も、いつまでも続く」(66:22)。","s":212.652,"e":221.783,"p":false,"h":false},{"t":"新月ごとに、安息日ごとに、すべての肉なる者が、わたしの前に来て、ひれ伏す(66:23)。","s":222.084,"e":228.15,"p":false,"h":false},{"t":"彼らは出て行って、わたしに背いた者たちの死体を見る。","s":228.42,"e":232.138,"p":false,"h":false},{"t":"そのうじは死なず、その火は消えず、すべての肉なる者の、忌み嫌うものとなる(66:24)。","s":232.416,"e":238.016,"p":true,"h":false},{"t":"各節の解説","s":238.644,"e":239.926,"p":true,"h":false},{"t":"1~2節は、神殿を建てることで、神を閉じ込めることはできない、という宣言です。","s":240.588,"e":246.79,"p":false,"h":false},{"t":"天と地を造られた方が、人の建てた家に、収まるはずがありません。","s":247.068,"e":251.548,"p":false,"h":false},{"t":"新約聖書では、使徒の働きで、ステパノが、この言葉を引いています。","s":251.856,"e":256.963,"p":false,"h":false},{"t":"神が目を留められるのは、立派な建物ではなく、砕かれた霊の人です。","s":257.256,"e":262.431,"p":true,"h":false},{"t":"3~4節の、いけにえの描写は、解釈が難しいところです。","s":263.088,"e":267.78,"p":false,"h":false},{"t":"神がいけにえを嫌われるという意味ではなく、心が神から離れたまま、形だけいけにえをささげることが、神にとって忌まわしい、ということです。","s":268.092,"e":277.636,"p":false,"h":false},{"t":"1章の、形だけの礼拝への批判と、同じ流れにあります。","s":277.956,"e":282.136,"p":true,"h":false},{"t":"7~9節の、産みの苦しみなく、一日で国が生まれるという描写は、神の民の回復が、人の理解を超えて、神ご自身のわざによることを、語っています。","s":282.78,"e":294.248,"p":false,"h":false},{"t":"この描写を、バビロンからの帰還と結びつけて読む立場も、新約聖書の教会の誕生と結びつけて読む立場も、終わりの時の完成と結びつけて読む立場も、あります。","s":294.552,"e":306.182,"p":false,"h":false},{"t":"どれを中心にするかは、読み方が分かれます。","s":306.468,"e":309.632,"p":true,"h":false},{"t":"12~13節の、母が子を慰めるように、主が慰められるという言葉は、神の慰めの、やさしさを語ります。","s":310.284,"e":319.069,"p":false,"h":false},{"t":"40章1節の「慰めよ、慰めよ」で始まった、この後半が、ここで、慰めの言葉で、一つの枠をつくっています。","s":319.356,"e":328.399,"p":true,"h":false},{"t":"15~16節は、主が、さばきのために来られるという描写です。","s":329.04,"e":334.05,"p":false,"h":false},{"t":"「火」と「剣」は、さばきの徹底さを表します。","s":334.332,"e":337.485,"p":false,"h":false},{"t":"新約聖書の、テサロニケ人への手紙第二1章などで、キリストの再臨のさばきと、結びつけて読まれることがあります。","s":337.788,"e":345.963,"p":true,"h":false},{"t":"17節は、園で身をきよめるという、異教的な儀式にふける者たちへの宣告です。","s":346.608,"e":352.772,"p":false,"h":false},{"t":"表向きは、きよめの儀式のように見えても、神ではないものに向かう礼拝は、さばきを免れない、ということです。","s":353.052,"e":361.079,"p":false,"h":false},{"t":"食べ物の細部については、本文の読み方が難しいところがあるので、ここでは深入りしません。","s":361.404,"e":367.856,"p":true,"h":false},{"t":"18~21節は、読み方が分かれやすい箇所です。","s":368.496,"e":372.513,"p":false,"h":false},{"t":"「逃れた者たち」が、誰を指すのか、遠い島々に遣わされることが、何を意味するのかについて、解釈が分かれます。","s":372.78,"e":380.844,"p":false,"h":false},{"t":"ここでは、神の栄光が、地の果てまで告げられ、諸国民が、神の民として、主のもとに集められるという望みが、語られています。","s":381.132,"e":390.8,"p":false,"h":false},{"t":"19節の地名は、当時の人々にとって、世界の果ての、遠い国々を表します。","s":391.104,"e":397.477,"p":false,"h":false},{"t":"21節で、異邦人の中から祭司、レビ人が選ばれるという約束は、56章の、異邦人や宦官への約束の、完成として読まれます。","s":397.764,"e":408.227,"p":false,"h":false},{"t":"ただし、この「その中から」が、異邦人の中からなのか、集められたイスラエルの兄弟の中からなのかは、読み方が分かれます。","s":408.528,"e":417.442,"p":true,"h":false},{"t":"22節の「新しい天と新しい地」は、65章17節の約束が、ここで、もう一度語られています。","s":418.068,"e":426.273,"p":false,"h":false},{"t":"この書が、新しい創造への望みで、閉じられていることが分かります。","s":426.564,"e":431.432,"p":true,"h":false},{"t":"24節の「そのうじは死なず、その火は消えず」は、イザヤ書の最後の言葉として、きびしいものです。","s":432.072,"e":439.361,"p":false,"h":false},{"t":"この節は、新約聖書で、イエスが、マルコの福音書9章で、地獄について語られるとき、引かれています。","s":439.668,"e":447.51,"p":false,"h":false},{"t":"書の終わりが、さばきの言葉で閉じられることには、重い意味があります。","s":447.804,"e":452.172,"p":false,"h":false},{"t":"ここでは、神に背く者の、最後の姿を、詩的な言葉で、語るものとして読みます。","s":452.484,"e":458.857,"p":true,"h":false}], NAV = {"prev":{"href":"doc65.html","title":"イザヤ書_65章"},"next":null,"list":"index.html"};

  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  (function build() {

    });

    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);

  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
