<script>

  const TITLE = "イザヤ書_62章", AUDIO_SRC = "doc62_2610231055.mp3", DUR = 230, SEGS = [{"t":"イザヤ書62章","s":0,"e":1.599,"p":true,"h":false},{"t":"全体の流れ","s":2.268,"e":3.373,"p":true,"h":false},{"t":"「シオンのために、私は黙っていない。","s":4.176,"e":6.702,"p":false,"h":false},{"t":"エルサレムのために、私は休まない。","s":6.984,"e":9.538,"p":false,"h":false},{"t":"その義が輝きのように出て行き、その救いが、燃えるたいまつのようになるまで」と、62章は始まります(62:1)。","s":9.828,"e":17.358,"p":false,"h":false},{"t":"諸国民は、あなたの義を見、すべての王は、あなたの栄光を見ます。","s":17.64,"e":22.658,"p":false,"h":false},{"t":"あなたは、主の口が定められる、新しい名で呼ばれます(62:2)。","s":22.932,"e":27.162,"p":false,"h":false},{"t":"あなたは、主の手の中で、美しい冠、あなたの神の手の中で、王の頭飾りとなります(62:3)。","s":27.432,"e":34.45,"p":true,"h":false},{"t":"あなたは、もう「見捨てられた女」とは呼ばれず、あなたの国は、「荒れ果てた地」とは言われません。","s":35.1,"e":41.606,"p":false,"h":false},{"t":"あなたは「わたしの喜びは彼女にある」、あなたの国は「夫のある国」と呼ばれます。","s":41.904,"e":47.421,"p":false,"h":false},{"t":"主があなたを喜ばれ、あなたの国は夫を得るからです(62:4)。","s":47.7,"e":51.575,"p":false,"h":false},{"t":"若者が処女をめとるように、あなたの子らが、あなたをめとり、花婿が花嫁を喜ぶように、あなたの神が、あなたを喜ばれます(62:5)。","s":51.876,"e":60.996,"p":true,"h":false},{"t":"エルサレムよ、わたしは、あなたの城壁の上に、見張りを置いた。","s":61.632,"e":66.3,"p":false,"h":false},{"t":"昼も夜も、決して黙ってはならない。","s":66.6,"e":69.154,"p":false,"h":false},{"t":"主に思い起こしていただく者たちよ、休んではならない。","s":69.444,"e":73.019,"p":false,"h":false},{"t":"主がエルサレムを堅く立て、地上で誉れとされるまで、主に休む暇を与えてはならない(62:6-7)。","s":73.296,"e":79.315,"p":false,"h":false},{"t":"主は、右の手と力ある腕で誓われた。","s":79.596,"e":82.647,"p":false,"h":false},{"t":"「わたしは、二度と、あなたの穀物を、敵の食物としない。","s":82.944,"e":87.196,"p":false,"h":false},{"t":"異国の人々は、あなたが労して得た新しいぶどう酒を、飲まない」(62:8)。","s":87.48,"e":92.235,"p":false,"h":false},{"t":"収穫した者がそれを食べ、主を賛美し、ぶどうを集めた者が、わたしの聖なる庭で、それを飲む(62:9)。","s":92.52,"e":99.612,"p":true,"h":false},{"t":"「通れ、通れ、門を。","s":100.26,"e":101.944,"p":false,"h":false},{"t":"民の道を整えよ。","s":102.24,"e":103.723,"p":false,"h":false},{"t":"盛り上げよ、盛り上げよ、大路を。","s":104.148,"e":106.287,"p":false,"h":false},{"t":"石を取り除け。","s":106.596,"e":107.745,"p":false,"h":false},{"t":"国々に向かって旗を掲げよ」(62:10)。","s":108.504,"e":110.57,"p":false,"h":false},{"t":"見よ、主は地の果てまで、告げ知らせられた。","s":110.88,"e":113.888,"p":false,"h":false},{"t":"「娘シオンに言え。","s":114.192,"e":115.432,"p":false,"h":false},{"t":"見よ、あなたの救いが来る。","s":116.1,"e":117.799,"p":false,"h":false},{"t":"見よ、主の報いは、主とともにあり、その働きの報いは、御前にある」(62:11)。","s":118.08,"e":123.27,"p":false,"h":false},{"t":"彼らは、「聖なる民、主に贖われた者」と呼ばれ、あなたは、「尋ね求められる者、見捨てられない都」と呼ばれます(62:12)。","s":123.552,"e":132.184,"p":true,"h":false},{"t":"各節の解説","s":132.804,"e":134.086,"p":true,"h":false},{"t":"2節の「新しい名」は、シオンの身分と性質が、変えられることを表します。","s":134.748,"e":140.303,"p":false,"h":false},{"t":"名前は、聖書では存在そのものを表します。","s":140.616,"e":144.043,"p":false,"h":false},{"t":"見捨てられた者という名が、愛される者という名に変わります。","s":144.36,"e":148.398,"p":false,"h":false},{"t":"新約聖書では、黙示録に、新しい名が与えられるという約束が出てきます。","s":148.68,"e":154.371,"p":true,"h":false},{"t":"4~5節の結婚の比喩は、神とシオンの関係が、結婚にたとえられている、という意味です。","s":155.016,"e":161.32,"p":false,"h":false},{"t":"54章の、不妊の女と夫の比喩の、続きとして読めます。","s":161.604,"e":166.147,"p":false,"h":false},{"t":"神が、ご自分の民を喜ばれるという、驚くべき言葉です。","s":166.428,"e":170.939,"p":true,"h":false},{"t":"5節の「あなたの子らが、あなたをめとり」は、読み方が分かれます。","s":171.576,"e":176.125,"p":false,"h":false},{"t":"写本や訳によっては、「あなたを造った者があなたをめとる」と読む立場があります。","s":176.4,"e":181.831,"p":false,"h":false},{"t":"意味は大きくは変わりません。","s":182.124,"e":183.92,"p":true,"h":false},{"t":"6~7節の見張りは、エルサレムのために、昼も夜も祈りつづける者たちを指す、と読まれます。","s":184.572,"e":191.542,"p":false,"h":false},{"t":"「主に休む暇を与えてはならない」は、粘り強い祈りへの励ましです。","s":191.844,"e":196.555,"p":false,"h":false},{"t":"新約聖書で、イエスが、粘り強く祈る寡婦のたとえを語られたことと、響き合います。","s":196.848,"e":202.946,"p":true,"h":false},{"t":"10~12節は、主が来られるための道を整える呼びかけです。","s":203.58,"e":208.224,"p":false,"h":false},{"t":"40章3節の「道を備えよ」と、同じ主題です。","s":208.512,"e":212.123,"p":false,"h":false},{"t":"ここでは、道を備えることが、民の帰還のためとして語られます。","s":212.4,"e":217.08,"p":true,"h":false},{"t":"12節の「見捨てられない都」は、62章の結びとして、シオンの新しい名のひとつです。","s":217.728,"e":224.348,"p":false,"h":false},{"t":"かつて「見捨てられた」と言われた都が、「見捨てられない」と呼ばれます。","s":224.64,"e":229.266,"p":true,"h":false}], NAV = {"prev":{"href":"doc61.html","title":"イザヤ書_61章"},"next":{"href":"doc63.html","title":"イザヤ書_63章"},"list":"index.html"};

  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

  (function build() {

    SEGS.forEach((g, i) => {

  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }

  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {

    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }

  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */

    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
