<script>
(function () {
  const TITLE = "イザヤ書_49章", AUDIO_SRC = "doc49_2610231055.mp3", DUR = 526, SEGS = [{"t":"イザヤ書49章","s":0,"e":1.648,"p":true,"h":false},{"t":"全体の流れ","s":2.304,"e":3.409,"p":true,"h":false},{"t":"49章は、これまでとは違い、しもべ自身が語り始めます。","s":4.212,"e":8.997,"p":false,"h":false},{"t":"「島々よ、私に聞け。","s":9.288,"e":11.379,"p":false,"h":false},{"t":"遠くの国々の民よ、耳を傾けよ。","s":11.664,"e":14.665,"p":false,"h":false},{"t":"主は、私が生まれる前から私を呼び、母の胎内にいたときから、私の名を覚えておられた」(49:1)。","s":14.976,"e":21.826,"p":false,"h":false},{"t":"主は、私の口を鋭い剣のようにし、御手の陰に私を隠し、私を研ぎ澄まされた矢にして、矢筒の中に隠されました(49:2)。","s":22.104,"e":31.185,"p":false,"h":false},{"t":"主は私に言われました。","s":31.464,"e":33.032,"p":false,"h":false},{"t":"「あなたはわたしのしもべ、イスラエル。","s":33.372,"e":35.683,"p":false,"h":false},{"t":"わたしは、あなたのうちに栄光を現す」(49:3)。","s":35.964,"e":38.855,"p":true,"h":false},{"t":"しかし、しもべは言います。","s":39.492,"e":41.338,"p":false,"h":false},{"t":"「私はむなしく労し、無駄に、空しく力を使い果たした」。","s":41.652,"e":45.989,"p":false,"h":false},{"t":"それでも、「私の訴えは主とともにあり、私への報いは、私の神とともにある」と告白します(49:4)。","s":46.26,"e":53.454,"p":false,"h":false},{"t":"そして、主が、再び語られます。","s":53.748,"e":56.411,"p":false,"h":false},{"t":"「ヤコブを主のもとに立ち返らせ、イスラエルを主のもとに集めるために、母の胎内から私を形造られた主が、こう言われる。","s":56.7,"e":65.23,"p":false,"h":false},{"t":"『あなたがわたしのしもべとなって、ヤコブの諸部族を立たせ、イスラエルのうちの残された者たちを帰らせることは、あまりにも小さなことだ。","s":65.52,"e":74.75,"p":false,"h":false},{"t":"わたしはあなたを国々の光とし、わたしの救いが地の果てにまで及ぶようにする』」(49:5-6)。","s":75.024,"e":80.437,"p":true,"h":false},{"t":"イスラエルの贖い主、その聖なる方、主は、人に侮られ、国民に忌み嫌われ、支配者たちのしもべとなっている者に、こう言われます。","s":81.072,"e":90.903,"p":false,"h":false},{"t":"「王たちは見て立ち上がり、君主たちはひれ伏す。","s":91.188,"e":94.249,"p":false,"h":false},{"t":"それは、真実な主、あなたを選ばれたイスラエルの聖なる方のゆえだ」(49:7)。","s":94.536,"e":99.309,"p":true,"h":false},{"t":"主は、さらに言われます。","s":99.936,"e":101.63,"p":false,"h":false},{"t":"「恵みの時に、わたしはあなたに答え、救いの日に、あなたを助けた。","s":101.916,"e":106.672,"p":false,"h":false},{"t":"あなたを守り、あなたを民の契約として与える。","s":106.956,"e":110.292,"p":false,"h":false},{"t":"それは、国を立て直し、荒れ果てた地を、相続させるためだ」(49:8)。","s":110.592,"e":115.177,"p":false,"h":false},{"t":"囚人には「出て来なさい」と言い、闇にいる者には「姿を現しなさい」と言います。","s":115.452,"e":121.383,"p":false,"h":false},{"t":"彼らは、道すがら草を食べ、裸の丘にも牧場を得ます。","s":121.68,"e":126.132,"p":false,"h":false},{"t":"飢えず、渇かず、熱風も太陽も彼らを打たず、あわれむ方が彼らを導き、水の湧く所に連れて行かれます(49:9-10)。","s":126.432,"e":134.676,"p":false,"h":false},{"t":"わたしはすべての山を道とし、大路は引き上げられます。","s":134.964,"e":138.681,"p":false,"h":false},{"t":"見よ、遠くから、北から、西から、そしてシニムの地から、彼らが来る(49:11-12)。","s":138.996,"e":144.447,"p":false,"h":false},{"t":"天よ、喜び歌え。","s":144.72,"e":146.301,"p":false,"h":false},{"t":"地よ、楽しめ。","s":146.628,"e":147.853,"p":false,"h":false},{"t":"山々よ、喜びの声を上げよ。","s":148.536,"e":151.084,"p":false,"h":false},{"t":"主がご自分の民を慰め、その苦しむ者をあわれまれるからです(49:13)。","s":151.38,"e":155.878,"p":true,"h":false},{"t":"ところが、シオンは言います。","s":156.528,"e":158.387,"p":false,"h":false},{"t":"「主は私を見捨てた。","s":158.688,"e":160.133,"p":false,"h":false},{"t":"主は私を忘れた」(49:14)。","s":160.596,"e":162.075,"p":false,"h":false},{"t":"主は答えられます。","s":162.504,"e":163.789,"p":false,"h":false},{"t":"「女が自分の乳飲み子を忘れるだろうか。","s":164.412,"e":167.094,"p":false,"h":false},{"t":"自分の胎の子を、あわれまないだろうか。","s":167.364,"e":169.706,"p":false,"h":false},{"t":"たとえ、女たちが忘れても、わたしはあなたを忘れない」(49:15)。","s":169.992,"e":173.94,"p":false,"h":false},{"t":"「見よ、わたしは、あなたを手のひらに刻んだ。","s":174.204,"e":177.435,"p":false,"h":false},{"t":"あなたの城壁は、いつもわたしの前にある」(49:16)。","s":177.732,"e":180.748,"p":false,"h":false},{"t":"あなたの子らは急いで帰って来る。","s":181.044,"e":183.066,"p":false,"h":false},{"t":"あなたを壊した者、荒らした者は、あなたから出て行く(49:17)。","s":183.348,"e":186.914,"p":false,"h":false},{"t":"目を上げて、周りを見回せ。","s":187.2,"e":189.41,"p":false,"h":false},{"t":"彼らはみな集まって、あなたのところに来る。","s":189.72,"e":192.468,"p":false,"h":false},{"t":"わたしは生きている。","s":192.744,"e":193.878,"p":false,"h":false},{"t":"あなたは、彼らをみな飾りのように身につける、と主は言われる(49:18)。","s":194.652,"e":199.001,"p":true,"h":false},{"t":"あなたの荒れ果てた所、廃墟となった所、滅びた地は、今や、住む人には狭すぎるほどになる。","s":199.656,"e":206.553,"p":false,"h":false},{"t":"あなたを呑み込んだ者は遠くへ去る。","s":206.856,"e":209.046,"p":false,"h":false},{"t":"失った後に生まれた子らは、あなたの耳元で言う。","s":209.34,"e":212.952,"p":false,"h":false},{"t":"「この場所は私には狭すぎる。","s":213.264,"e":215.272,"p":false,"h":false},{"t":"住む場所を空けてください」(49:19-20)。","s":215.568,"e":217.128,"p":false,"h":false},{"t":"あなたは心の中で言う。","s":217.476,"e":219.161,"p":false,"h":false},{"t":"「だれが、この子らを私に産んでくれたのか。","s":219.492,"e":222.372,"p":false,"h":false},{"t":"私は子を失い、不妊の身であり、捕らえられ、追われていたのに。","s":222.66,"e":227.212,"p":false,"h":false},{"t":"だれが、この子らを育てたのか。","s":227.484,"e":229.748,"p":false,"h":false},{"t":"私はひとり残されていたのに、この子らはどこから来たのか」(49:21)。","s":230.04,"e":234.115,"p":true,"h":false},{"t":"神である主は言われます。","s":234.756,"e":236.333,"p":false,"h":false},{"t":"「見よ、わたしは国々に向けて手を上げ、民に向けて旗を揚げる。","s":236.664,"e":241.274,"p":false,"h":false},{"t":"彼らは、あなたの息子たちを懐に抱いて連れて来、あなたの娘たちを肩に担いで来る。","s":241.56,"e":247.844,"p":false,"h":false},{"t":"王たちは、あなたの養い親となり、王妃たちは、あなたの乳母となる。","s":248.148,"e":253.138,"p":false,"h":false},{"t":"彼らは、顔を地につけてあなたにひれ伏し、あなたの足のちりをなめる。","s":253.44,"e":258.351,"p":false,"h":false},{"t":"あなたは、わたしが主であることを知る。","s":258.624,"e":261.249,"p":false,"h":false},{"t":"わたしを待ち望む者は、恥を見ない」(49:22-23)。","s":261.54,"e":264.202,"p":false,"h":false},{"t":"勇士から獲物を奪い取れるだろうか。","s":264.492,"e":266.671,"p":false,"h":false},{"t":"暴君の捕虜は救い出されるだろうか。","s":266.94,"e":269.185,"p":false,"h":false},{"t":"主は言われます。","s":269.46,"e":270.499,"p":false,"h":false},{"t":"「そうだ。","s":271.368,"e":271.921,"p":false,"h":false},{"t":"勇士の捕虜も奪い取られ、暴君の獲物も救い出される。","s":272.232,"e":275.955,"p":false,"h":false},{"t":"わたしがあなたと争う者と争い、わたしがあなたの子らを救うからだ」(49:24-25)。","s":276.264,"e":280.921,"p":false,"h":false},{"t":"あなたを苦しめる者には、自分の肉を食べさせ、新しいぶどう酒のように、自分の血に酔わせる。","s":281.232,"e":288.119,"p":false,"h":false},{"t":"すべての肉なる者は、わたしが主、あなたの救い主、あなたの贖い主、ヤコブの力ある方であることを知る(49:26)。","s":288.396,"e":296.532,"p":true,"h":false},{"t":"各節の解説","s":297.18,"e":298.462,"p":true,"h":false},{"t":"1~6節は、「しもべの歌」の二番目です。","s":299.124,"e":302.26,"p":false,"h":false},{"t":"42章では、主がしもべについて語られましたが、ここでは、しもべ自身が語っています。","s":302.58,"e":309.069,"p":false,"h":false},{"t":"3節で、このしもべが「イスラエル」と呼ばれていますが、5~6節では、このしもべが、イスラエルをも立ち返らせる務めを持つと語られています。","s":309.384,"e":319.424,"p":false,"h":false},{"t":"つまり、しもべは、イスラエルでありながら、イスラエルを導く者としても語られています。","s":319.716,"e":325.761,"p":false,"h":false},{"t":"ここが、この歌の読み方の難しいところです。","s":326.052,"e":329.375,"p":false,"h":false},{"t":"改革派の伝統は、イスラエルが失敗した務めを、イスラエルを代表する、ひとりのしもべが果たされる、と読んできました。","s":329.688,"e":337.964,"p":false,"h":false},{"t":"この読み方では、しもべは、最終的に、イエス・キリストを指します。","s":338.256,"e":343,"p":false,"h":false},{"t":"ただし、イスラエル全体、または預言者自身を指すという読み方も、教会の歴史の中にはあります。","s":343.296,"e":350.427,"p":true,"h":false},{"t":"2節の、「口を鋭い剣のようにし」は、しもべが語る言葉の力を、表しています。","s":351.072,"e":357.052,"p":false,"h":false},{"t":"黙示録でも、キリストの口から出る鋭い剣が語られており、つながりが指摘されます。","s":357.336,"e":363.284,"p":true,"h":false},{"t":"4節の「むなしく労した」という告白は、しもべの働きが、一見、実を結ばないように見えることを、率直に語ります。","s":363.924,"e":372.48,"p":false,"h":false},{"t":"それでも、報いは、主とともにあるという信頼が示されます。","s":372.78,"e":377.132,"p":false,"h":false},{"t":"ここには、働きの結果が見えなくても、神に委ねる姿があります。","s":377.424,"e":382.317,"p":true,"h":false},{"t":"6節の「国々の光」は、42章6節でも語られた務めです。","s":382.968,"e":387.93,"p":false,"h":false},{"t":"ここでは、「イスラエルの残された者を帰らせるのは、小さなこと」とまで言われ、務めが、全世界に及ぶことが、強調されています。","s":388.224,"e":397.692,"p":false,"h":false},{"t":"この言葉は、新約聖書で、シメオンが幼子イエスを抱いて語った言葉や、パウロとバルナバが異邦人に福音を語る根拠として、使徒の働きの中で引かれています。","s":397.98,"e":409.309,"p":true,"h":false},{"t":"8節の「恵みの時」「救いの日」は、新約聖書で、パウロが、今こそ救いの日だと語るときに、引いています。","s":409.932,"e":417.559,"p":false,"h":false},{"t":"神の救いの約束が、キリストにおいて、成就したことを語るための言葉です。","s":417.852,"e":423.249,"p":false,"h":false},{"t":"ただし、この箇所が、そのままキリストの時代だけを指すのか、バビロンからの帰還も含むのかについては、読み方が分かれます。","s":423.54,"e":432.208,"p":true,"h":false},{"t":"12節の「シニムの地」が、どこを指すかは、はっきりしません。","s":432.864,"e":437.035,"p":false,"h":false},{"t":"エジプトの南の、アスワンを指すという読み方があり、また、中国を指すという読み方も、昔からあります。","s":437.328,"e":444.709,"p":false,"h":false},{"t":"どちらにしても、地の果てから、民が集められるという意味です。","s":444.996,"e":449.157,"p":true,"h":false},{"t":"14~15節の、シオンの嘆きと、主の答えは、この章でいちばん心に残る箇所の一つです。","s":449.82,"e":457.045,"p":false,"h":false},{"t":"「女が乳飲み子を忘れるだろうか」という問いは、母親の愛の強さを例に、神の愛が、それ以上であることを語ります。","s":457.344,"e":465.624,"p":false,"h":false},{"t":"人の愛さえ、時に失われることがあります。","s":465.912,"e":469.004,"p":false,"h":false},{"t":"しかし、神は、決して忘れられません。","s":469.296,"e":472.292,"p":true,"h":false},{"t":"16節の「手のひらに刻んだ」は、神が、民の名や姿を、消えないように、ご自分の手に刻んでおられる、という意味です。","s":472.932,"e":481.273,"p":false,"h":false},{"t":"新約聖書で、キリストの手に釘の跡があることを思い起こす人もいます。","s":481.572,"e":486.472,"p":false,"h":false},{"t":"ただし、この言葉の中心は、神が、決して民を見捨てられない、という約束です。","s":486.756,"e":493.085,"p":true,"h":false},{"t":"22~23節の「顔を地につけて、あなたにひれ伏し」は、読み方が難しい箇所です。","s":493.704,"e":500.106,"p":false,"h":false},{"t":"諸国の王たちが、シオンに仕えるというのは、シオンが他の国を支配するという意味ではなく、シオンの神が、世界の主として認められる、という意味に読むのが、穏当です。","s":500.4,"e":511.691,"p":true,"h":false},{"t":"25~26節は、主が、ご自分の民のために、強い敵とさえ争われることを語ります。","s":512.352,"e":519.578,"p":false,"h":false},{"t":"26節の厳しい表現は、さばきを詩的に語った言葉として読まれます。","s":519.84,"e":525.205,"p":true,"h":false}], NAV = {"prev":{"href":"doc48.html","title":"イザヤ書_48章"},"next":{"href":"doc50.html","title":"イザヤ書_50章"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];
  const KEY = 'narr:' + TITLE + ':' + AUDIO_SRC;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let spd = 1, fsi = 2, last = -1, lastUser = 0, playing = false, tickId = 0;
  const audio = new Audio(AUDIO_SRC);
  audio.preload = 'metadata';

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

  /* 글 그리기 */
  (function build() {
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
